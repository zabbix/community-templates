zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: c8eab832bd684e91b4968e737cc77b6c
    name: Printer group
  templates:
  - uuid: ab5b83f44fd84f90819e870574f88a76
    template: Canon Color MF printers
    name: Canon Color MF printers
    description: Canon color multifunction printers monitored through SNMP. Uses standard
      System, Host Resources, and Printer MIB objects, and discovers available Canon
      counters and waste toner receptacles. Validated with MF660C Series on Zabbix
      7.0.30; MF750C series shares
      the documented counter family but has not been tested with this update. Configure
      SNMP on the host interface.
    groups:
    - name: Printer group
    items:
    - uuid: 26fe9592a4494450902ab818d5793aca
      name: System description
      type: SNMP_AGENT
      snmp_oid: ".1.3.6.1.2.1.1.1.0"
      key: Canon.model
      delay: 1h
      history: 7d
      value_type: TEXT
      trends: '0'
      description: sysDescr identifies the printer model.
    - uuid: 7ed1f04946084426a3f3ca41c175a33d
      name: System location
      type: SNMP_AGENT
      snmp_oid: ".1.3.6.1.2.1.1.6.0"
      key: Device.location
      delay: 1h
      history: 7d
      value_type: CHAR
      trends: '0'
      description: sysLocation, if configured on the device.
    - uuid: 2a0557a3e55246e1a00e56dde0fdd294
      name: System name
      type: SNMP_AGENT
      snmp_oid: ".1.3.6.1.2.1.1.5.0"
      key: device.name
      delay: 1h
      history: 7d
      value_type: TEXT
      trends: '0'
      description: sysName reported by the printer.
    - uuid: 6bb2585b9aca43acaccae081626eab99
      name: Printer serial number
      type: SNMP_AGENT
      snmp_oid: ".1.3.6.1.2.1.43.5.1.1.17.1"
      key: Device.serial.number
      delay: 1h
      history: 7d
      value_type: TEXT
      trends: '0'
      description: prtGeneralSerialNumber from Printer MIB.
    - uuid: 6fc65d76f62c4a858cc6faeae5b9f9e2
      name: Printer status
      type: SNMP_AGENT
      snmp_oid: ".1.3.6.1.2.1.25.3.2.1.5.1"
      key: Device.status
      delay: '60'
      history: 7d
      value_type: FLOAT
      trends: 30d
      description: 'hrDeviceStatus: 2 is running; other values require attention.'
      triggers:
      - uuid: 90d4adf4a4724299837ec12ef4757bec
        expression: last(/Canon Color MF printers/Device.status)<>2
        name: Printer status is not running
        priority: AVERAGE
        dependencies:
        - name: "{HOST.NAME} is unavailable (ICMP)"
          expression: max(/Canon Color MF printers/icmpping,3m)=0
      valuemap:
        name: hrDeviceStatus
    - uuid: f35fb3f2371742e9bc6a08238eb02b85
      name: ICMP ping
      type: SIMPLE
      key: icmpping
      valuemap:
        name: Service state
      triggers:
      - uuid: c8a31bdc8f234c158efbc1c3a4bc7ccc
        expression: max(/Canon Color MF printers/icmpping,3m)=0
        name: "{HOST.NAME} is unavailable (ICMP)"
        priority: DISASTER
    - uuid: ffca77a1541f431c970340afe7fd962c
      name: ICMP packet loss (%)
      type: SIMPLE
      key: icmppingloss
      value_type: FLOAT
      units: "%"
      triggers:
      - uuid: ccaf6745fdb649708ffc3fd27b5b6282
        expression: min(/Canon Color MF printers/icmppingloss,5m)>20
        name: "{HOST.NAME}: High packet loss (> 20%)"
        priority: WARNING
        dependencies:
        - name: "{HOST.NAME} is unavailable (ICMP)"
          expression: max(/Canon Color MF printers/icmpping,3m)=0
    - uuid: 3a3ae0feb62a42afaeb22b73e7a6b976
      name: ICMP ping response time (ms)
      type: SIMPLE
      key: icmppingsec
      value_type: FLOAT
      units: ms
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '1000'
    - uuid: 42855dbb783649a6b587aa9bca8b143c
      name: Printer cover status
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.6.1.1.3.1.1
      key: printer.cover.status
      description: |
        prtCoverStatus:
        3=coverOpen, 4=coverClosed, 5=interlockOpen, 6=interlockClosed
      valuemap:
        name: prtCoverStatus
      triggers:
      - uuid: b0319c09538f4cc9b63bddc3476c2b87
        expression: last(/Canon Color MF printers/printer.cover.status)=3 or last(/Canon
          Color MF printers/printer.cover.status)=5
        name: Printer cover or interlock is open
        priority: WARNING
    - uuid: ae7588d393fd44b9ad13dd29086ce367
      name: Marker life count
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
      key: printer.pages.total
      delay: 15m
      description: prtMarkerLifeCount. Read printer.marker.unit for the unit; this
        is distinct from Canon copy-and-print counters.
    - uuid: 5b92f7dd5a904ceda942deff861a9a8f
      name: Printer operational status (Printer MIB)
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.16.5.1.2.1.1
      key: printer.state.text
      value_type: CHAR
      trends: '0'
      description: Printer console state, such as sleep, idle, or processing.
    - uuid: a21f3200d4804503884c88cfb2b2ecc1
      name: Uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: system.uptime
      delay: 5m
      units: uptime
      description: sysUpTime in hundredths of a second, converted to seconds.
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      triggers:
      - uuid: ad67436c87cb4f51bfbffb9bbd4d3cbf
        expression: nodata(/Canon Color MF printers/system.uptime,10m)=1
        name: "{HOST.NAME}: No SNMP response"
        priority: HIGH
        dependencies:
        - name: "{HOST.NAME} is unavailable (ICMP)"
          expression: max(/Canon Color MF printers/icmpping,3m)=0
    - uuid: ddbcd894814b461db70532780d1bd5fa
      name: Marker counter unit
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.10.2.1.3.1.1
      key: printer.marker.unit
      delay: 1h
      description: prtMarkerCounterUnit; MF660C reports 7 (impressions).
    discovery_rules:
    - uuid: 407d1183d90c45f482df8f64e18491d7
      name: IPv4 address discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#IP_ADDRESS},1.3.6.1.2.1.4.20.1.1]
      key: device.ip.discovery
      delay: 1h
      lifetime: 30d
      filter:
        conditions:
        - macro: '{#IP_ADDRESS}'
          value: '^(?!127\.).+$'
      item_prototypes:
      - uuid: 28288bdc0f884312910a3d5da8bfbe91
        name: Device IPv4 address {#IP_ADDRESS}
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.4.20.1.1.{#SNMPINDEX}
        key: Device.IP.address[{#SNMPINDEX}]
        delay: 1h
        history: 7d
        value_type: CHAR
        description: IPv4 interface address from IP-MIB ipAdEntAddr. Loopback addresses
          are excluded; a device with multiple addresses creates multiple items.
    - uuid: c0871f6448b44a97a4c9de1a738ec11e
      name: Toner and Supplies Discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TONER_NAME},1.3.6.1.2.1.43.11.1.1.6.1,{#TONER_COLOR},1.3.6.1.2.1.43.12.1.1.4.1]
      key: toner.discovery
      delay: 1h
      lifetime: 30d
      filter:
        conditions:
        - macro: "{#TONER_COLOR}"
          value: "^(black|cyan|magenta|yellow)$"
      item_prototypes:
      - uuid: 7675ed178b8b439593e717cdaf6a3372
        name: Toner level (raw) {#TONER_NAME}
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.1.{#SNMPINDEX}
        key: toner.level[{#TONER_COLOR}]
        delay: 5m
        value_type: FLOAT
        description: Raw prtMarkerSuppliesLevel. Compare with prtMarkerSuppliesMaxCapacity
          for a percentage; negative values are Printer-MIB sentinels.
        trigger_prototypes:
        - uuid: '008ab4affc664a8c8d67b85f5ec2c9a5'
          expression: last(/Canon Color MF printers/toner.percent[{#TONER_COLOR}])<10
            and last(/Canon Color MF printers/toner.percent[{#TONER_COLOR}])>0 and
            last(/Canon Color MF printers/toner.level[{#TONER_COLOR}])>=0 and last(/Canon
            Color MF printers/toner.max[{#TONER_COLOR}])>0
          name: Toner [{#TONER_NAME}] is low (1-9%)
          priority: HIGH
        - uuid: 665a2c2d8c504137b8f9be2869c441ca
          expression: last(/Canon Color MF printers/toner.percent[{#TONER_COLOR}])<20
            and last(/Canon Color MF printers/toner.percent[{#TONER_COLOR}])>=10 and
            last(/Canon Color MF printers/toner.level[{#TONER_COLOR}])>=0 and last(/Canon
            Color MF printers/toner.max[{#TONER_COLOR}])>0
          name: Toner [{#TONER_NAME}] is low (10-19%)
          priority: WARNING
          description: Prepare a replacement cartridge.
        - uuid: 7f515a7290d64845beab268fb763e7ac
          expression: last(/Canon Color MF printers/toner.level[{#TONER_COLOR}])=0
            and last(/Canon Color MF printers/toner.max[{#TONER_COLOR}])>0
          name: Toner [{#TONER_NAME}] is empty (0%)
          priority: DISASTER
      - uuid: 539dea4a031b484bbd1c10eef782d12c
        name: Toner remaining {#TONER_NAME}
        type: CALCULATED
        key: toner.percent[{#TONER_COLOR}]
        delay: 5m
        value_type: FLOAT
        units: "%"
        params: 100*last(//toner.level[{#TONER_COLOR}])/last(//toner.max[{#TONER_COLOR}])
        description: Calculated from prtMarkerSuppliesLevel and prtMarkerSuppliesMaxCapacity.
          Valid when both values are nonnegative and capacity is greater than zero.
      - uuid: 54f56329c7c643febefd48dbda49eb08
        name: Toner capacity {#TONER_NAME}
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.1.{#SNMPINDEX}
        key: toner.max[{#TONER_COLOR}]
        delay: 1h
        value_type: FLOAT
        description: Raw prtMarkerSuppliesMaxCapacity. Nonpositive values are Printer-MIB
          sentinels.
      graph_prototypes:
      - uuid: 8397abbd0d7343a3a5001125fd36921e
        name: Toner [{#TONER_NAME}] — level (%)
        graph_items:
        - color: 199C0D
          calc_fnc: ALL
          item:
            host: Canon Color MF printers
            key: toner.percent[{#TONER_COLOR}]
    - uuid: 42ac970da302438e8f123c893f9c9ef1
      name: Waste toner container discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SUPPLY_CLASS},1.3.6.1.2.1.43.11.1.1.4,{#SUPPLY_TYPE},1.3.6.1.2.1.43.11.1.1.5,{#SUPPLY_NAME},1.3.6.1.2.1.43.11.1.1.6,{#SUPPLY_UNIT},1.3.6.1.2.1.43.11.1.1.7]
      key: waste.toner.discovery
      delay: 1h
      lifetime: 30d
      filter:
        conditions:
        - macro: '{#SUPPLY_CLASS}'
          value: ^4$
        - macro: '{#SUPPLY_TYPE}'
          value: ^4$
      item_prototypes:
      - uuid: 4fc2933c151744808cc9b07d4d48f203
        name: 'Waste toner container {#SNMPINDEX} ({#SUPPLY_NAME}): capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.{#SNMPINDEX}
        key: waste.toner.capacity[{#SNMPINDEX}]
        delay: 1h
        value_type: FLOAT
        description: prtMarkerSuppliesMaxCapacity in prtMarkerSuppliesSupplyUnit
          ({#SUPPLY_UNIT}). -1 means other and -2 means unknown.
      - uuid: 5f5c48a420ba451d901cf49032452d41
        name: 'Waste toner container {#SNMPINDEX} ({#SUPPLY_NAME}): free space'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.{#SNMPINDEX}
        key: waste.toner.free[{#SNMPINDEX}]
        delay: 5m
        value_type: FLOAT
        description: For a receptacle, prtMarkerSuppliesLevel is the remaining
          space in prtMarkerSuppliesSupplyUnit ({#SUPPLY_UNIT}). -1 means other,
          -2 means unknown, and -3 means some space remains.
    - uuid: 717a7388067a464c9f27f7f568c06237
      name: Canon counter discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#COUNTER_NAME},1.3.6.1.4.1.1602.1.11.1.4.1.3]
      key: canon.counter.discovery
      delay: 1h
      lifetime: 30d
      filter:
        conditions:
        - macro: "{#COUNTER_NAME}"
          value: "^.+$"
      item_prototypes:
      - uuid: 827cd7d5a61b43e789cb76969e110301
        name: Canon counter {#COUNTER_NAME} ({#SNMPINDEX})
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.4.1.1602.1.11.1.4.1.4.{#SNMPINDEX}
        key: canon.counter[{#SNMPINDEX}]
        delay: 1h
        description: Canon private MIB counter. Counter IDs and availability vary
          by model and region; the name comes from the printer.
    - uuid: cb5e36653d444248b90e69ef29f89963
      name: Paper input discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TRAY_NAME},1.3.6.1.2.1.43.8.2.1.13]
      key: printer.input.discovery
      delay: 1h
      lifetime: 30d
      filter:
        conditions:
        - macro: "{#TRAY_NAME}"
          value: "^.+$"
      item_prototypes:
      - uuid: 7f43a8c14a7b489693d1e587bd655e08
        name: Paper level {#TRAY_NAME}
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.10.{#SNMPINDEX}
        key: printer.input.level[{#SNMPINDEX}]
        delay: 5m
        value_type: FLOAT
        description: prtInputCurrentLevel in the input capacity unit. -3 means at
          least one unit remains, -2 means unknown, and zero means empty.
      - uuid: 74fe389ae32f46879e66b705a4f59ccc
        name: Paper capacity {#TRAY_NAME}
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.9.{#SNMPINDEX}
        key: printer.input.capacity[{#SNMPINDEX}]
        delay: 1h
        value_type: FLOAT
        description: prtInputMaxCapacity in the input capacity unit; -2 means unknown.
      - uuid: 19c36c1927a84151acf93212eb02e4a6
        name: Paper input status {#TRAY_NAME}
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.11.{#SNMPINDEX}
        key: printer.input.status[{#SNMPINDEX}]
        delay: 5m
        description: prtInputStatus is a bit field (PrtSubUnitStatusTC), not a paper-out
          boolean.
    valuemaps:
    - uuid: d0db89d545f147d390063e0c5ab1f601
      name: hrDeviceStatus
      mappings:
      - value: '1'
        newvalue: unknown
      - value: '2'
        newvalue: running
      - value: '3'
        newvalue: warning
      - value: '4'
        newvalue: testing
      - value: '5'
        newvalue: down
    - uuid: 95d06c97cdd44b15aab4fa50276449de
      name: prtCoverStatus
      mappings:
      - value: '3'
        newvalue: coverOpen
      - value: '4'
        newvalue: coverClosed
      - value: '5'
        newvalue: interlockOpen
      - value: '6'
        newvalue: interlockClosed
    - uuid: c20eb7ae55a94950a75fe96d6379ffdd
      name: Service state
      mappings:
      - value: '0'
        newvalue: Down
      - value: '1'
        newvalue: Up
