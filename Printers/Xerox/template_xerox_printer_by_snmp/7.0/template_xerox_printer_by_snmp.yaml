zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 6c3a2c7832c64ff4b2891ee163ebc137
    name: Templates/Network devices
  templates:
  - uuid: 8eb26d8cc69443cf8ae4ebbe9d258afd
    template: Xerox Printer by SNMP
    name: Xerox Printer by SNMP
    vendor:
      name: Rémi Piazza
      version: 7.0-0
    description: 'Generic Xerox printer template over SNMP (Printer-MIB, HOST-RESOURCES-MIB, SNMPv2-MIB): device and error status, supplies, input trays and printer alerts via LLD. Tested on VersaLink C405,
      C415, B415, B315 and a Xerox 8135.

      Author: Rémi Piazza (remipiazza).'
    groups:
    - name: Templates/Network devices
    items:
    - uuid: 2e8b93818bb541b59f2db6a7610b7877
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: system.descr
      delay: 1h
      history: 31d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: system
    - uuid: be23e9858bfa4071bd208ba11a977a2f
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: system.name
      delay: 1h
      history: 31d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: system
    - uuid: 21b1ebf59fb64c8589d0d2e6d677d6d6
      name: Serial number
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
      key: xerox.serial
      delay: 1h
      history: 31d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: system
      triggers:
      - uuid: d661fe14747c4d8893d6c60e3d700ca9
        expression: last(/Xerox Printer by SNMP/xerox.serial,#1)<>last(/Xerox Printer by SNMP/xerox.serial,#2) and length(last(/Xerox Printer by SNMP/xerox.serial))>0
        name: Serial number has changed
        priority: INFO
        tags:
        - tag: scope
          value: availability
    - uuid: 122bb87c625f410880395a3b3effd266
      name: Uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: system.uptime
      delay: 1m
      history: 31d
      trends: 365d
      value_type: FLOAT
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
      triggers:
      - uuid: fa5bd91209ea43f3b651907f1f2ba72a
        expression: last(/Xerox Printer by SNMP/system.uptime)<10m
        name: Printer has been restarted
        priority: INFO
        tags:
        - tag: scope
          value: availability
      - uuid: b94b993240bd44a289dfe5121ceccb54
        expression: nodata(/Xerox Printer by SNMP/system.uptime,{$XEROX.NODATA})=1
        name: No SNMP data collection
        priority: HIGH
        description: Printer is unreachable or SNMP credentials are wrong.
        tags:
        - tag: scope
          value: availability
    - uuid: a17b7e47044b451792e828427047e1d3
      name: Pages printed (total)
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
      key: xerox.pages.total
      delay: 1h
      history: 31d
      trends: 365d
      value_type: UNSIGNED
      units: pages
      tags:
      - tag: component
        value: counter
    - uuid: 0c8d6af2e37d4e0b9edb5bae4a6ecf2f
      name: Device status
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.3.2.1.5.{$XEROX.HRIDX}
      key: xerox.device.status
      delay: 1m
      history: 31d
      trends: 365d
      value_type: UNSIGNED
      valuemap:
        name: HOST-RESOURCES-MIB::hrDeviceStatus
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: 00292476238443d6a1edd18da921e581
        expression: min(/Xerox Printer by SNMP/xerox.device.status,#2)=5
        name: Device status is down
        priority: HIGH
        tags:
        - tag: scope
          value: availability
      - uuid: e16ab266bf7443f4909f8c80df226a41
        expression: min(/Xerox Printer by SNMP/xerox.device.status,#2)=3
        name: Device status is warning
        priority: WARNING
        tags:
        - tag: scope
          value: availability
    - uuid: e70dae15335e476a98f641aa6913cb5c
      name: Printer status
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.3.5.1.1.{$XEROX.HRIDX}
      key: xerox.printer.status
      delay: 1m
      history: 31d
      trends: 365d
      value_type: UNSIGNED
      valuemap:
        name: HOST-RESOURCES-MIB::hrPrinterStatus
      tags:
      - tag: component
        value: status
    - uuid: 61e010e72a75438e898191c413c6b59e
      name: Detected error state (raw)
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.3.5.1.2.{$XEROX.HRIDX}
      key: xerox.errorstate
      delay: 1m
      history: 31d
      trends: 365d
      value_type: UNSIGNED
      description: 'First octet of hrPrinterDetectedErrorState (bit mask: 128 lowPaper, 64 noPaper, 32 lowToner, 16 noToner, 8 doorOpen, 4 jammed, 2 offline, 1 serviceRequested).'
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - 'var h = String(value).replace(/[^0-9A-Fa-f]/g, '''');

          if (h.length < 2) { return 0; }

          return parseInt(h.substring(0, 2), 16);'
      tags:
      - tag: component
        value: status
    - uuid: 73ac5846464b45fc9511c4095838e6ed
      name: 'Error: paper jam'
      type: DEPENDENT
      key: xerox.err.jam
      delay: '0'
      history: 31d
      trends: 365d
      description: 'hrPrinterDetectedErrorState: jammed'
      valuemap:
        name: Xerox flag
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - 'return (parseInt(value, 10) & 4) ? 1 : 0;'
      master_item:
        key: xerox.errorstate
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: a95fc272aa2b4ee7875db408dd442733
        expression: min(/Xerox Printer by SNMP/xerox.err.jam,#2)=1
        name: Paper jam
        priority: HIGH
        tags:
        - tag: scope
          value: availability
    - uuid: a58ccd9f52124eb99d7a1c9482351949
      name: 'Error: cover open'
      type: DEPENDENT
      key: xerox.err.door
      delay: '0'
      history: 31d
      trends: 365d
      description: 'hrPrinterDetectedErrorState: doorOpen'
      valuemap:
        name: Xerox flag
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - 'return (parseInt(value, 10) & 8) ? 1 : 0;'
      master_item:
        key: xerox.errorstate
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: ef173ee84af24558ab7b5af0884ca216
        expression: min(/Xerox Printer by SNMP/xerox.err.door,#2)=1
        name: Cover open
        priority: WARNING
        tags:
        - tag: scope
          value: availability
    - uuid: 1e19a31ebefa4d2786974d10ee49e990
      name: 'Error: out of paper'
      type: DEPENDENT
      key: xerox.err.nopaper
      delay: '0'
      history: 31d
      trends: 365d
      description: 'hrPrinterDetectedErrorState: noPaper'
      valuemap:
        name: Xerox flag
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - 'return (parseInt(value, 10) & 64) ? 1 : 0;'
      master_item:
        key: xerox.errorstate
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: 777ff743ec484600823f03aef1ccd3ea
        expression: min(/Xerox Printer by SNMP/xerox.err.nopaper,#2)=1
        name: Out of paper
        priority: AVERAGE
        tags:
        - tag: scope
          value: availability
    - uuid: 0baaaf57a3c645ab80b3fbaa5ee28445
      name: 'Error: out of toner'
      type: DEPENDENT
      key: xerox.err.notoner
      delay: '0'
      history: 31d
      trends: 365d
      description: 'hrPrinterDetectedErrorState: noToner'
      valuemap:
        name: Xerox flag
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - 'return (parseInt(value, 10) & 16) ? 1 : 0;'
      master_item:
        key: xerox.errorstate
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: 8bbb4a4df67f4c10932ed9bcd91e8162
        expression: min(/Xerox Printer by SNMP/xerox.err.notoner,#2)=1
        name: Out of toner
        priority: AVERAGE
        tags:
        - tag: scope
          value: availability
    - uuid: 837e5062e67140e7bc4b7c0d2a975f02
      name: 'Error: service requested'
      type: DEPENDENT
      key: xerox.err.service
      delay: '0'
      history: 31d
      trends: 365d
      description: 'hrPrinterDetectedErrorState: serviceRequested'
      valuemap:
        name: Xerox flag
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - 'return (parseInt(value, 10) & 1) ? 1 : 0;'
      master_item:
        key: xerox.errorstate
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: db14b21a084e4bad91eab56f694565b4
        expression: min(/Xerox Printer by SNMP/xerox.err.service,#2)=1
        name: Service requested
        priority: HIGH
        tags:
        - tag: scope
          value: availability
    - uuid: d80f9ea00a934de8ac6fa2f5d459cf51
      name: 'Error: offline'
      type: DEPENDENT
      key: xerox.err.offline
      delay: '0'
      history: 31d
      trends: 365d
      description: 'hrPrinterDetectedErrorState: offline'
      valuemap:
        name: Xerox flag
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - 'return (parseInt(value, 10) & 2) ? 1 : 0;'
      master_item:
        key: xerox.errorstate
      tags:
      - tag: component
        value: status
      triggers:
      - uuid: 1aeac1e74f61440dad95fd848ad0c1e7
        expression: min(/Xerox Printer by SNMP/xerox.err.offline,#2)=1
        name: Printer is offline
        priority: AVERAGE
        tags:
        - tag: scope
          value: availability
    discovery_rules:
    - uuid: 18fa1596f2de400f8ac1826cf5214ace
      name: Supplies discovery (toner, drum, fuser, waste container...)
      type: SNMP_AGENT
      snmp_oid: discovery[{#SUPPLY_NAME},1.3.6.1.2.1.43.11.1.1.6]
      key: xerox.supplies.discovery
      delay: 1h
      filter:
        evaltype: AND
        conditions:
        - macro: '{#SUPPLY_NAME}'
          value: '{$XEROX.SUPPLY.MATCHES}'
          formulaid: A
        - macro: '{#SUPPLY_NAME}'
          value: '{$XEROX.SUPPLY.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
          formulaid: B
      item_prototypes:
      - uuid: af3e0fc3a321496887b71c0efa36c334
        name: Level [{#SUPPLY_NAME}]
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.{#SNMPINDEX}
        key: xerox.supply.level[{#SNMPINDEX}]
        delay: 15m
        history: 31d
        trends: 365d
        value_type: FLOAT
        description: prtMarkerSuppliesLevel. -1 other, -2 unknown, -3 some remaining.
        tags:
        - tag: component
          value: supply
        - tag: supply
          value: '{#SUPPLY_NAME}'
      - uuid: 02dd72f17a9a42bda08f4925c9076491
        name: Max capacity [{#SUPPLY_NAME}]
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.11.1.1.8.{#SNMPINDEX}
        key: xerox.supply.max[{#SNMPINDEX}]
        delay: 1h
        history: 31d
        trends: 365d
        value_type: FLOAT
        tags:
        - tag: component
          value: supply
        - tag: supply
          value: '{#SUPPLY_NAME}'
      - uuid: 8deddf78b29346be96340ca2edf8d3f6
        name: Remaining [{#SUPPLY_NAME}]
        type: CALCULATED
        key: xerox.supply.pct[{#SNMPINDEX}]
        delay: 15m
        value_type: FLOAT
        units: '%'
        params: 100*last(//xerox.supply.level[{#SNMPINDEX}])/(last(//xerox.supply.max[{#SNMPINDEX}])*(last(//xerox.supply.max[{#SNMPINDEX}])>0)+100*(last(//xerox.supply.max[{#SNMPINDEX}])<=0))
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - 'var v = parseFloat(value);

            return (isNaN(v) || v < 0 || v > 100) ? -1 : Math.round(v * 10) / 10;'
        description: If the max capacity is <=0 or unknown, the level is assumed to be already expressed in %. -1 = level unknown / "some remaining".
        tags:
        - tag: component
          value: supply
        - tag: supply
          value: '{#SUPPLY_NAME}'
      - uuid: 0fdf70406f2b4ba1b244b231dd2c5df0
        name: '[{#SUPPLY_NAME}] days left'
        type: CALCULATED
        key: xerox.supply.days[{#SNMPINDEX}]
        delay: 1h
        value_type: FLOAT
        units: d
        params: min(max(timeleft(//xerox.supply.pct[{#SNMPINDEX}],4w,0)/86400,0),365)
        tags:
        - tag: component
          value: supply
        - tag: supply
          value: '{#SUPPLY_NAME}'
      trigger_prototypes:
      - uuid: 576435fa454944cfa6d5a333bf3ec68d
        expression: last(/Xerox Printer by SNMP/xerox.supply.pct[{#SNMPINDEX}])>=0 and last(/Xerox Printer by SNMP/xerox.supply.pct[{#SNMPINDEX}])<={$XEROX.SUPPLY.CRIT}
        name: '[{#SUPPLY_NAME}] is below {$XEROX.SUPPLY.CRIT}% (critical)'
        opdata: '{ITEM.LASTVALUE1}'
        priority: HIGH
        tags:
        - tag: scope
          value: capacity
      - uuid: 68b4ea6c467d446ea385b5c515865bcf
        expression: last(/Xerox Printer by SNMP/xerox.supply.pct[{#SNMPINDEX}])>=0 and last(/Xerox Printer by SNMP/xerox.supply.pct[{#SNMPINDEX}])<={$XEROX.SUPPLY.WARN}
        name: '[{#SUPPLY_NAME}] is below {$XEROX.SUPPLY.WARN}% (warning)'
        opdata: '{ITEM.LASTVALUE1}'
        priority: WARNING
        dependencies:
        - name: '[{#SUPPLY_NAME}] is below {$XEROX.SUPPLY.CRIT}% (critical)'
          expression: last(/Xerox Printer by SNMP/xerox.supply.pct[{#SNMPINDEX}])>=0 and last(/Xerox Printer by SNMP/xerox.supply.pct[{#SNMPINDEX}])<={$XEROX.SUPPLY.CRIT}
        tags:
        - tag: scope
          value: capacity
      overrides:
      - name: No triggers for supplies matching {$XEROX.SUPPLY.NOALERT}
        step: '1'
        filter:
          evaltype: AND_OR
          conditions:
          - macro: '{#SUPPLY_NAME}'
            value: '{$XEROX.SUPPLY.NOALERT}'
            formulaid: A
        operations:
        - operationobject: TRIGGER_PROTOTYPE
          operator: REGEXP
          value: .*
          discover: NO_DISCOVER
    - uuid: 85b56e06610e435aba630c4279de1945
      name: Input trays discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TRAY_NAME},1.3.6.1.2.1.43.8.2.1.13]
      key: xerox.trays.discovery
      delay: 1h
      item_prototypes:
      - uuid: 544af2c53eda4d14b8431a8fbff2a295
        name: 'Tray [{#TRAY_NAME}]: level'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.8.2.1.10.{#SNMPINDEX}
        key: xerox.tray.level[{#SNMPINDEX}]
        delay: 5m
        history: 31d
        trends: 365d
        value_type: FLOAT
        description: prtInputCurrentLevel. 0 = empty, -2 unknown, -3 some paper remaining.
        tags:
        - tag: component
          value: tray
        - tag: tray
          value: '{#TRAY_NAME}'
      overrides:
      - name: No triggers for trays matching {$XEROX.TRAY.NOALERT}
        step: '1'
        filter:
          evaltype: AND_OR
          conditions:
          - macro: '{#TRAY_NAME}'
            value: '{$XEROX.TRAY.NOALERT}'
            formulaid: A
        operations:
        - operationobject: TRIGGER_PROTOTYPE
          operator: REGEXP
          value: .*
          discover: NO_DISCOVER
      trigger_prototypes:
      - uuid: 9e63d0e4dae046098be68edfc6bd8c67
        expression: last(/Xerox Printer by SNMP/xerox.tray.level[{#SNMPINDEX}])=0
        name: Tray [{#TRAY_NAME}] is empty
        priority: WARNING
        tags:
        - tag: scope
          value: capacity
    - uuid: c6dd03f5f0554b26a6cedb543f92e297
      name: Printer alerts discovery (prtAlert)
      type: SNMP_AGENT
      snmp_oid: discovery[{#ALERT_DESC},1.3.6.1.2.1.43.18.1.1.8]
      key: xerox.alerts.discovery
      delay: 5m
      lifetime_type: DELETE_IMMEDIATELY
      item_prototypes:
      - uuid: f8225b1f5e9b4d49b6789f1cf395fe8b
        name: Alert severity [{#ALERT_DESC}]
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.18.1.1.2.{#SNMPINDEX}
        key: xerox.alert.severity[{#SNMPINDEX}]
        delay: 1m
        history: 31d
        trends: 365d
        value_type: UNSIGNED
        valuemap:
          name: Printer-MIB::prtAlertSeverityLevel
        tags:
        - tag: component
          value: alert
      - uuid: bd1a7c54042249f7853583d274d00552
        name: Alert description [{#SNMPINDEX}]
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.43.18.1.1.8.{#SNMPINDEX}
        key: xerox.alert.desc[{#SNMPINDEX}]
        delay: 1m
        history: 31d
        trends: '0'
        value_type: TEXT
        tags:
        - tag: component
          value: alert
      trigger_prototypes:
      - uuid: 56a07b3cf8a44a759f6368888a721cb6
        expression: last(/Xerox Printer by SNMP/xerox.alert.severity[{#SNMPINDEX}])=3
        name: 'Critical alert: {#ALERT_DESC}'
        priority: AVERAGE
        tags:
        - tag: scope
          value: alert
      - uuid: d72ea81db1194731a8b8a58d4551a3e6
        expression: find(/Xerox Printer by SNMP/xerox.alert.desc[{#SNMPINDEX}],,"regexp","{$XEROX.ALERT.CODES}")=1
        name: 'Watched alert code: {#ALERT_DESC}'
        priority: HIGH
        tags:
        - tag: scope
          value: alert
    tags:
    - tag: class
      value: hardware
    - tag: target
      value: xerox
    macros:
    - macro: '{$SNMP_COMMUNITY}'
      value: public
      description: SNMP v1/v2c community.
    - macro: '{$XEROX.HRIDX}'
      value: '1'
      description: hrDeviceIndex of the printer in HOST-RESOURCES-MIB (usually 1).
    - macro: '{$XEROX.NODATA}'
      value: 5m
      description: Period without data before the "No SNMP data collection" trigger fires.
    - macro: '{$XEROX.SUPPLY.CRIT}'
      value: '10'
      description: Supply critical threshold (%).
    - macro: '{$XEROX.SUPPLY.WARN}'
      value: '20'
      description: Supply warning threshold (%).
    - macro: '{$XEROX.SUPPLY.MATCHES}'
      value: .*
      description: 'Supplies LLD: supply names to include (regex).'
    - macro: '{$XEROX.SUPPLY.NOT_MATCHES}'
      value: CHANGE_IF_NEEDED
      description: 'Supplies LLD: supply names to exclude (regex).'
    - macro: '{$XEROX.SUPPLY.NOALERT}'
      value: (?i)waste
      description: 'Supplies that are collected but get no triggers (waste containers by default: the level semantics may differ between models).'
    - macro: '{$XEROX.TRAY.NOALERT}'
      value: (?i)bypass|manual|multi
      description: Input trays that are collected but get no "empty" trigger (bypass / manual feed trays are normally empty).
    - macro: '{$XEROX.ALERT.CODES}'
      value: CHANGE_IF_NEEDED
      description: 'Regex matched against prtAlertDescription; a HIGH trigger fires on match. Example: 010-421|091-446'
    valuemaps:
    - uuid: bb926a5a04994238bba47b599afd713b
      name: HOST-RESOURCES-MIB::hrDeviceStatus
      mappings:
      - value: '1'
        newvalue: unknown
      - value: '2'
        newvalue: running
      - value: '3'
        newvalue: warning
      - value: '4'
        newvalue: testing
      - value: '5'
        newvalue: down
    - uuid: e9e20171ef3b453daf0b288989a2158a
      name: HOST-RESOURCES-MIB::hrPrinterStatus
      mappings:
      - value: '1'
        newvalue: other
      - value: '2'
        newvalue: unknown
      - value: '3'
        newvalue: idle
      - value: '4'
        newvalue: printing
      - value: '5'
        newvalue: warmup
    - uuid: ff2d29253468492a9f1b9b6875f5b9a5
      name: Printer-MIB::prtAlertSeverityLevel
      mappings:
      - value: '1'
        newvalue: other
      - value: '3'
        newvalue: critical
      - value: '4'
        newvalue: warning
      - value: '5'
        newvalue: warningBinaryChangeEvent
    - uuid: 49b195db028449a3b43e6a7c623e2871
      name: Xerox flag
      mappings:
      - value: '0'
        newvalue: OK
      - value: '1'
        newvalue: Active
