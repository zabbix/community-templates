        - uuid: 8dfacd8bfb024096bba858ec07e01429
          name: 'PDU: Energy'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.3808.1.1.3.2.3.1.1.10.1
          key: pdu.energy
          value_type: FLOAT
          units: kWh
          description: ePDULoadStatusEnergy. Reported by the device in 0.1 kWh.
          preprocessing:
