        - uuid: 491a70b65c9f472db692bf91551b512e
          name: 'PDU: Load state'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.3808.1.1.3.2.3.1.1.3.1
          key: pdu.load.state
