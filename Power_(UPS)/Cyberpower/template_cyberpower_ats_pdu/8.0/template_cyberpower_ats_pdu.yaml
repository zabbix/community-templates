zabbix_export:
  version: '8.0'
  template_groups:
    - uuid: 3dcd5bbe90534f9e8eb5c2d53756af63
      name: Templates/Power
  templates:
    - uuid: c310da5426da47bb83956327197a14fa
      template: CyberPower ATS PDU by SNMP
      name: CyberPower ATS PDU by SNMP
      description: |-
        Template for CyberPower Switched ATS PDU (e.g. PDU44004) monitored by SNMP (v1/v2c/v3).

        Uses CPS-MIB: ePDULoadStatus (bank/phase load), ePDU2SourceStatus (ATS sources A/B) and ePDUOutlet (outlets 1-12).

        Setup: enable SNMP on the PDU, add a host with an SNMP interface and link this template.
        Adjust {$ATS.VOLT.MIN}, {$ATS.VOLT.MAX} and {$ATS.PREFERRED_SOURCE} if needed.

        Author: Splunner (https://github.com/Splunner)
        Template version: 1.0
      groups:
        - name: Templates/Power
      items:
        - uuid: 99fffc89f38f485ba04adf8f39bd6f7b
          name: 'ATS: Phase sync'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.3808.1.1.6.9.4.1.13.1
          key: ats.phase.sync
          description: ePDU2SourceStatusSourcePhaseSync.
          valuemap:
            name: CyberPower ATS phase sync
          tags:
            - tag: component
              value: ats
          triggers:
            - uuid: 64e49ef925154b94b02d7ec85d30c2f4
              expression: last(/CyberPower ATS PDU by SNMP/ats.phase.sync)<>1
              name: 'ATS: Sources are not in phase sync'
              priority: WARNING
        - uuid: 51aa603438e941348e2700791b5a0a6a
          name: 'ATS: Power supply A status'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.3808.1.1.6.9.4.1.14.1
          key: ats.psuA.status
          description: ePDU2SourceStatusPowerSupplySourceAStatus.
          valuemap:
            name: CyberPower ATS status
          tags:
            - tag: component
              value: ats
        - uuid: 28862ea45b174b458672404f4c6c1963
          name: 'ATS: Power supply B status'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.3808.1.1.6.9.4.1.15.1
          key: ats.psuB.status
          description: ePDU2SourceStatusPowerSupplySourceBStatus.
          valuemap:
            name: CyberPower ATS status
          tags:
            - tag: component
              value: ats
        - uuid: c655c0d207ec4749898389f43f31da57
          name: 'ATS: Selected source'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.3808.1.1.6.9.4.1.3.1
          key: ats.source.selected
          description: ePDU2SourceStatusSelectedSource.
          valuemap:
            name: CyberPower ATS source
          tags:
            - tag: component
              value: ats
          triggers:
            - uuid: 6a88e9f1109b43159e5ffe5e102e4634
              expression: last(/CyberPower ATS PDU by SNMP/ats.source.selected)<>{$ATS.PREFERRED_SOURCE}
              name: 'ATS: Load is not on the preferred source'
              opdata: 'Current source: {ITEM.LASTVALUE1}'
              priority: HIGH
              description: The ATS has switched away from the preferred source set in {$ATS.PREFERRED_SOURCE} (1 = Source A, 2 = Source B).
        - uuid: 55cb815e575c414381f25d0af627cd37
          name: 'Source A: Frequency status'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.3808.1.1.6.9.4.1.11.1
          key: ats.sourceA.freq.status
          description: ePDU2SourceStatusSourceAFreqStatus.
          valuemap:
            name: CyberPower ATS status
          tags:
            - tag: component
              value: ats
            - tag: source
              value: A
        - uuid: 3b16e801ecb64904a0610703dd9b07ee
          name: 'Source A: Frequency'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.3808.1.1.6.9.4.1.7.1
          key: ats.sourceA.frequency
          units: Hz
          description: ePDU2SourceStatusSourceAFrequency. Reported in whole hertz.
          tags:
            - tag: component
              value: ats
            - tag: source
              value: A
        - uuid: a25bb54d4de3403489ca2fc48d6fcec5
          name: 'Source A: Voltage status'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.3808.1.1.6.9.4.1.9.1
          key: ats.sourceA.volt.status
          description: ePDU2SourceStatusSourceAVolStatus.
          valuemap:
            name: CyberPower ATS status
          tags:
            - tag: component
              value: ats
            - tag: source
              value: A
          triggers:
            - uuid: 4bae9eb0c5274128b48f29542e101519
              expression: last(/CyberPower ATS PDU by SNMP/ats.sourceA.volt.status)<>1
              name: 'Source A: Voltage status is not OK'
              priority: HIGH
        - uuid: d5fa96d0efa4409f9c853ef495bebc91
          name: 'Source A: Voltage'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.3808.1.1.6.9.4.1.5.1
          key: ats.sourceA.voltage
          units: V
          description: ePDU2SourceStatusSourceAVoltage. Reported in whole volts.
          tags:
            - tag: component
              value: ats
            - tag: source
              value: A
          triggers:
            - uuid: 437adfa941814d45a144117a12cd3b84
              expression: min(/CyberPower ATS PDU by SNMP/ats.sourceA.voltage,3m)>{$ATS.VOLT.MAX} or max(/CyberPower ATS PDU by SNMP/ats.sourceA.voltage,3m)<{$ATS.VOLT.MIN}
              name: 'Source A: Voltage is out of range for 3m'
              opdata: 'Current: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: Voltage has been outside {$ATS.VOLT.MIN}..{$ATS.VOLT.MAX} V for the last 3 minutes.
              dependencies:
                - name: 'Source A: Voltage status is not OK'
                  expression: last(/CyberPower ATS PDU by SNMP/ats.sourceA.volt.status)<>1
        - uuid: 1d637ef3ba4146369a4004bcba106c35
          name: 'Source B: Frequency status'
