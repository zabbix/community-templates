          preprocessing: *id001
          tags:
            - tag: component
              value: system
        - uuid: 28f82d9caf7b48ca865ec7c0c76f320d
          name: 'System: Uptime'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.3.0
          key: system.uptime
          units: uptime
          description: SNMPv2-MIB::sysUpTime.0 (time since the network management part was last re-initialized).
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: ee0f7774a70f4d24a4f30e8593cd2f35
              expression: last(/CyberPower ATS PDU by SNMP/system.uptime)>0 and last(/CyberPower ATS PDU by SNMP/system.uptime)<10m
              name: 'System: Device has been restarted'
              opdata: 'Uptime: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: Uptime is less than 10 minutes.
              manual_close: 'YES'
      tags:
        - tag: class
          value: power
        - tag: target
          value: cyberpower
        - tag: target
          value: ats-pdu
      macros:
        - macro: '{$ATS.PREFERRED_SOURCE}'
          value: '1'
          description: 'Preferred ATS source: 1 = Source A, 2 = Source B. A trigger fires when the load is on the other source.'
        - macro: '{$ATS.VOLT.MAX}'
          value: '253'
          description: Upper source voltage threshold, V.
        - macro: '{$ATS.VOLT.MIN}'
          value: '207'
          description: Lower source voltage threshold, V.
      valuemaps:
        - uuid: f481ed8403ce4de4a57d0ba5f549b9e3
          name: CyberPower load state
          mappings:
            - value: '1'
              newvalue: Normal
            - value: '2'
              newvalue: Low
            - value: '3'
              newvalue: Near overload
            - value: '4'
              newvalue: Overload
        - uuid: 47e4a264ee0b497b8862060d4e499561
          name: CyberPower ATS source
          mappings:
            - value: '1'
              newvalue: Source A
            - value: '2'
              newvalue: Source B
        - uuid: b4a2d883ba8647e8a2f914e7f6b5ce44
          name: CyberPower ATS status
          mappings:
            - value: '1'
              newvalue: OK
            - value: '2'
              newvalue: Error
        - uuid: 661f4cf3b1674be797197be5d17a64e5
          name: CyberPower ATS phase sync
          mappings:
            - value: '1'
              newvalue: In sync
            - value: '2'
              newvalue: Out of sync
        - uuid: d918afc2884f47e8bfb5b4caeeb47152
          name: CyberPower outlet state
          mappings:
            - value: '1'
              newvalue: 'On'
            - value: '2'
              newvalue: 'Off'
  triggers:
    - uuid: 5572a7aa3b34421d8307321d2606feee
      expression: last(/CyberPower ATS PDU by SNMP/ats.psuA.status)<>1 or last(/CyberPower ATS PDU by SNMP/ats.psuB.status)<>1
      name: 'ATS: Internal power supply A or B is not OK'
      opdata: 'PSU A: {ITEM.LASTVALUE1}, PSU B: {ITEM.LASTVALUE2}'
      priority: AVERAGE
