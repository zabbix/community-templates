          key: pdu.outlet1.name
          delay: 1h
          value_type: CHAR
          description: ePDUOutletStatusOutletName.
          preprocessing: *id001
          tags:
            - tag: component
              value: outlet
            - tag: outlet
              value: '1'
        - uuid: 4b020e6b48254f92acd3d9eec6ff48a4
          name: 'Outlet 1: State'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.3808.1.1.3.3.3.1.1.4.1
          key: pdu.outlet1.status
          description: ePDUOutletControlOutletCommand. Read returns 1 when the outlet is on, 2 when it is off.
          valuemap:
            name: CyberPower outlet state
          tags:
            - tag: component
              value: outlet
            - tag: outlet
              value: '1'
          triggers:
            - uuid: a2eebbd846c84130a7232e112bd60fb3
              expression: last(/CyberPower ATS PDU by SNMP/pdu.outlet1.status)=2 and count(/CyberPower ATS PDU by SNMP/pdu.outlet1.status,5m,"eq",1)>0
              name: 'Outlet 1: Switched OFF (last 5m)'
              priority: WARNING
              description: The outlet was on during the last 5 minutes and is now off. The problem resolves itself after 5 minutes.
            - uuid: 209d4901fb974035a6e3065f89b56b18
              expression: last(/CyberPower ATS PDU by SNMP/pdu.outlet1.status)=1 and count(/CyberPower ATS PDU by SNMP/pdu.outlet1.status,5m,"eq",2)>0
