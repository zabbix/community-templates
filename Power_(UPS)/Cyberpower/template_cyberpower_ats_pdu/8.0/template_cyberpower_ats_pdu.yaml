              name: 'PDU: Load is in overload state'
              opdata: 'Current: {ITEM.LASTVALUE1}'
              priority: HIGH
            - uuid: af3e1fad3d81453991830b0d40cfb523
              expression: last(/CyberPower ATS PDU by SNMP/pdu.load.state)=3
              name: 'PDU: Load is near overload'
              opdata: 'Current: {ITEM.LASTVALUE1}'
              priority: WARNING
              dependencies:
                - name: 'PDU: Load is in overload state'
                  expression: last(/CyberPower ATS PDU by SNMP/pdu.load.state)=4
        - uuid: 7964d425a8954415982c4003042290b4
