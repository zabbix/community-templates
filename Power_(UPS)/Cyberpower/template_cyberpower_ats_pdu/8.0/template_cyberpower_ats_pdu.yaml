            - uuid: 3fec1d1584124b879d0eee088635f64a
              expression: min(/CyberPower ATS PDU by SNMP/ats.sourceB.voltage,3m)>{$ATS.VOLT.MAX} or max(/CyberPower ATS PDU by SNMP/ats.sourceB.voltage,3m)<{$ATS.VOLT.MIN}
              name: 'Source B: Voltage is out of range for 3m'
              opdata: 'Current: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: Voltage has been outside {$ATS.VOLT.MIN}..{$ATS.VOLT.MAX} V for the last 3 minutes.
              dependencies:
                - name: 'Source B: Voltage status is not OK'
