                  name: 'UPS Load Changed phase {#SNMPINDEX} (+/-1000W)'
                  priority: INFO
                  description: 'On {HOST.NAME} a big load change was detected - the output power changed by more than 1000 W between two checks.'
                  dependencies:
                    - name: 'HOST DOWN ! (Unavailable by ICMP ping)'
