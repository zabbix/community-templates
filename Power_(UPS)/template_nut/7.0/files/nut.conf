# Zabbix NUT monitoring
#
# Flexible UserParameters. The helper builds <upsname>@<host> internally,
# so UnsafeUserParameters=1 is not required for the '@' character.

UserParameter=nut.get[*],/usr/local/bin/nut_zabbix.sh get "$1" "$2" "$3"
UserParameter=nut.comm[*],/usr/local/bin/nut_zabbix.sh comm "$1" "$2"
UserParameter=nut.usb.present[*],/usr/local/bin/nut_zabbix.sh usb-present "$1" "$2" "$3"
