zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: f834e94b43ee4327888fba629cc49b6d
      name: Templates/Power
  templates:
    - uuid: 822a8a74f6f644aaad960b0ddfd623f2
      template: 'NUT UPS'
      name: 'NUT UPS'
      description: |
        NUT monitoring for Zabbix 7.0.
        Supports local or remote NUT endpoints and optional USB presence monitoring.
      groups:
        - name: Templates/Power
      items:
        - uuid: 4a93c1aea19241f7a7bc80f740aec2de
          name: 'NUT: Communication with UPS'
          type: ZABBIX_PASSIVE
          key: 'nut.comm[{$NUT.UPS.NAME},{$NUT.UPS.HOST}]'
          delay: 30s
          history: 30d
          trends: 90d
          value_type: UNSIGNED
          valuemap:
            name: 'NUT Communication'
          tags:
            - tag: component
              value: nut
        - uuid: a41cb97acf2e4bc6ac9b794f09656fcb
          name: 'NUT: Battery charge'
          type: ZABBIX_PASSIVE
          key: 'nut.get[{$NUT.UPS.NAME},{$NUT.UPS.HOST},battery.charge]'
          delay: 60s
          history: 30d
          trends: 365d
          value_type: FLOAT
          units: '%'
          tags:
            - tag: component
              value: battery
          triggers:
            - uuid: b6a42cce4e7446e1987bc22b0aa2aa00
              expression: 'last(/NUT UPS/nut.get[{$NUT.UPS.NAME},{$NUT.UPS.HOST},battery.charge])<20'
              name: 'NUT: Battery charge below 20% on {HOST.NAME}'
              priority: HIGH
        - uuid: 994a065f19594a638e8d5612e6c40e56
          name: 'NUT: Battery runtime'
          type: ZABBIX_PASSIVE
          key: 'nut.get[{$NUT.UPS.NAME},{$NUT.UPS.HOST},battery.runtime]'
          delay: 60s
          history: 30d
          trends: 365d
          value_type: UNSIGNED
          units: s
          tags:
            - tag: component
              value: battery
          triggers:
            - uuid: fdd6bcfce87743de9d6483afaf710ae9
              expression: 'last(/NUT UPS/nut.get[{$NUT.UPS.NAME},{$NUT.UPS.HOST},battery.runtime])<600'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'last(/NUT UPS/nut.get[{$NUT.UPS.NAME},{$NUT.UPS.HOST},battery.runtime])>=720'
              name: 'NUT: Battery runtime below 10 minutes on {HOST.NAME}'
              priority: HIGH
            - uuid: 3f03bb3bbf9e4f8885b762b0543aa678
              expression: 'last(/NUT UPS/nut.get[{$NUT.UPS.NAME},{$NUT.UPS.HOST},battery.runtime])<900'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'last(/NUT UPS/nut.get[{$NUT.UPS.NAME},{$NUT.UPS.HOST},battery.runtime])>=1000'
              name: 'NUT: Battery runtime below 15 minutes on {HOST.NAME}'
              priority: WARNING
        - uuid: 92b5797a7a78496da51bae06ee965ce5
          name: 'NUT: Battery voltage'
          type: ZABBIX_PASSIVE
          key: 'nut.get[{$NUT.UPS.NAME},{$NUT.UPS.HOST},battery.voltage]'
          delay: 60s
          history: 30d
          trends: 365d
          value_type: FLOAT
          units: V
          tags:
            - tag: component
              value: battery
        - uuid: 555084eed04844958157a4b9ea90cce7
          name: 'NUT: Input voltage'
          type: ZABBIX_PASSIVE
          key: 'nut.get[{$NUT.UPS.NAME},{$NUT.UPS.HOST},input.voltage]'
          delay: 60s
          history: 30d
          trends: 365d
          value_type: FLOAT
          units: V
          tags:
            - tag: component
              value: ups
        - uuid: 7c033ff90c38470c9863ed4e92913a7e
          name: 'NUT: Input frequency'
          type: ZABBIX_PASSIVE
          key: 'nut.get[{$NUT.UPS.NAME},{$NUT.UPS.HOST},input.frequency]'
          delay: 60s
          history: 30d
          trends: 365d
          value_type: FLOAT
          units: Hz
          tags:
            - tag: component
              value: ups
        - uuid: f79a56a22c3242e2bba13161afdae4ce
          name: 'NUT: Output voltage'
          type: ZABBIX_PASSIVE
          key: 'nut.get[{$NUT.UPS.NAME},{$NUT.UPS.HOST},output.voltage]'
          delay: 60s
          history: 30d
          trends: 365d
          value_type: FLOAT
          units: V
          tags:
            - tag: component
              value: ups
        - uuid: ae27116ccf9a4929b07fca6d7ccdf625
          name: 'NUT: UPS load'
          type: ZABBIX_PASSIVE
          key: 'nut.get[{$NUT.UPS.NAME},{$NUT.UPS.HOST},ups.load]'
          delay: 60s
          history: 30d
          trends: 365d
          value_type: FLOAT
          units: '%'
          tags:
            - tag: component
              value: ups
          triggers:
            - uuid: c8e8ae18160d4c6883d8505fb4b0ab7a
              expression: 'last(/NUT UPS/nut.get[{$NUT.UPS.NAME},{$NUT.UPS.HOST},ups.load])>90'
              name: 'NUT: UPS load above 90% on {HOST.NAME}'
              priority: HIGH
        - uuid: acca8a7c7d37438ca08427bc05535bfe
          name: 'NUT: UPS status'
          type: ZABBIX_PASSIVE
          key: 'nut.get[{$NUT.UPS.NAME},{$NUT.UPS.HOST},ups.status]'
          delay: 15s
          history: 30d
          value_type: TEXT
          tags:
            - tag: component
              value: ups
          triggers:
            - uuid: 5305e06575544c8fa09153a348fc6729
              expression: 'find(/NUT UPS/nut.get[{$NUT.UPS.NAME},{$NUT.UPS.HOST},ups.status],,"regexp","(^| )OB( |$)")=1'
              name: 'NUT: UPS on battery on {HOST.NAME}'
              priority: WARNING
            - uuid: b40c3f78ab434ee5a8b9341a761d024b
              expression: 'find(/NUT UPS/nut.get[{$NUT.UPS.NAME},{$NUT.UPS.HOST},ups.status],,"regexp","(^| )LB( |$)")=1'
              name: 'NUT: UPS low battery on {HOST.NAME}'
              priority: HIGH
            - uuid: 0f0723442a9b4b0cb68c739fcd85a449
              expression: 'find(/NUT UPS/nut.get[{$NUT.UPS.NAME},{$NUT.UPS.HOST},ups.status],,"regexp","(^| )FSD( |$)")=1'
              name: 'NUT: FSD asserted on {HOST.NAME}'
              priority: DISASTER
        - uuid: fa9cd167bffb4ffebd75ecfac7dd2c9f
          name: 'NUT: UPS USB present'
          type: ZABBIX_PASSIVE
          key: 'nut.usb.present[{$NUT.UPS.NAME},{$NUT.UPS.HOST},{$NUT.USB.CHECK}]'
          delay: 30s
          history: 30d
          trends: 90d
          value_type: UNSIGNED
          valuemap:
            name: 'NUT USB Presence'
          tags:
            - tag: component
              value: nut
          triggers:
            - uuid: 655bcba60b6844289fe5a1371a340b1f
              expression: '{$NUT.USB.CHECK}=1 and last(/NUT UPS/nut.usb.present[{$NUT.UPS.NAME},{$NUT.UPS.HOST},{$NUT.USB.CHECK}])=0'
              name: 'NUT: USB device for UPS missing on {HOST.NAME}'
              priority: HIGH
      macros:
        - macro: '{$NUT.UPS.NAME}'
          value: ups
          description: 'NUT UPS name as defined by upsd, for example ups or ups01.'
        - macro: '{$NUT.UPS.HOST}'
          value: localhost
          description: 'NUT server host. Use localhost for a local NUT server, or a remote hostname/IP. An optional non-default port may be appended as host:port.'
        - macro: '{$NUT.USB.CHECK}'
          value: '0'
          description: 'Enables the optional USB presence check. Set to 1 only when the monitored UPS is locally attached over USB; set to 0 for remote, SNMP, serial, or other NUT configurations.'
      valuemaps:
        - uuid: 2e0e07da201d4b389797613dbea18b6f
          name: 'NUT Communication'
          mappings:
            - value: '0'
              newvalue: Failed
            - value: '1'
              newvalue: Available
        - uuid: c74e400f49d5442691394cdd67aa42ce
          name: 'NUT USB Presence'
          mappings:
            - value: '0'
              newvalue: Missing
            - value: '1'
              newvalue: Present
            - value: '2'
              newvalue: Disabled
  triggers:
    - uuid: 21e00975552a46bc8574aaba017392dd
      expression: |
        last(/NUT UPS/nut.comm[{$NUT.UPS.NAME},{$NUT.UPS.HOST}])=0
        and
        (
        {$NUT.USB.CHECK}=0
        or
        last(/NUT UPS/nut.usb.present[{$NUT.UPS.NAME},{$NUT.UPS.HOST},{$NUT.USB.CHECK}])=1
        )
      name: 'NUT: Communication with UPS lost on {HOST.NAME}'
      priority: HIGH
  graphs:
    - uuid: d137014560cc4a7f82e58dcbba7470ff
      name: 'NUT: Battery charge and UPS load'
      ymin_type_1: FIXED
      ymax_type_1: FIXED
      graph_items:
        - color: 199C0D
          calc_fnc: ALL
          item:
            host: 'NUT UPS'
            key: 'nut.get[{$NUT.UPS.NAME},{$NUT.UPS.HOST},battery.charge]'
        - sortorder: '1'
          color: F63100
          calc_fnc: ALL
          item:
            host: 'NUT UPS'
            key: 'nut.get[{$NUT.UPS.NAME},{$NUT.UPS.HOST},ups.load]'
    - uuid: 79a6821ef35c4213b18166f76469992b
      name: 'NUT: Battery runtime'
      graph_items:
        - color: 199C0D
          calc_fnc: ALL
          item:
            host: 'NUT UPS'
            key: 'nut.get[{$NUT.UPS.NAME},{$NUT.UPS.HOST},battery.runtime]'
    - uuid: 3dea5594927e4336ace9a2a4474f742e
      name: 'NUT: Battery voltage'
      graph_items:
        - color: 199C0D
          calc_fnc: ALL
          item:
            host: 'NUT UPS'
            key: 'nut.get[{$NUT.UPS.NAME},{$NUT.UPS.HOST},battery.voltage]'
    - uuid: 4dfc6e23c47f46629c13bc8c33f583bc
      name: 'NUT: Input and output voltage'
      graph_items:
        - color: 199C0D
          calc_fnc: ALL
          item:
            host: 'NUT UPS'
            key: 'nut.get[{$NUT.UPS.NAME},{$NUT.UPS.HOST},input.voltage]'
        - sortorder: '1'
          color: F63100
          calc_fnc: ALL
          item:
            host: 'NUT UPS'
            key: 'nut.get[{$NUT.UPS.NAME},{$NUT.UPS.HOST},output.voltage]'
