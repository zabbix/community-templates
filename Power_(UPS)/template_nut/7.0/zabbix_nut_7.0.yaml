zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: f834e94b43ee4327888fba629cc49b6d
      name: Templates/Power
  templates:
    - uuid: 822a8a74f6f644aaad960b0ddfd623f2
      template: 'NUT UPS'
      name: 'NUT UPS'
      description: |
        NUT monitoring (Zabbix 7.0).
      groups:
        - name: Templates/Power
      items:
        - uuid: 4a93c1aea19241f7a7bc80f740aec2de
          name: 'NUT: Communication with UPS'
          type: ZABBIX_PASSIVE
          key: nut.comm
          delay: 30s
          history: 30d
          trends: 90d
          value_type: UNSIGNED
          valuemap:
            name: 'NUT Communication'
          tags:
            - tag: component
              value: nut
          triggers:
            - uuid: 21e00975552a46bc8574aaba017392dd
              expression: 'last(/NUT UPS/nut.comm)=0'
              name: 'NUT: Communication with UPS lost on {HOST.NAME}'
              priority: HIGH
        - uuid: acca8a7c7d37438ca08427bc05535bfe9
          name: 'NUT: UPS status'
          type: ZABBIX_PASSIVE
          key: nut.ups.status
          delay: 15s
          history: 30d
          value_type: TEXT
          tags:
            - tag: component
              value: ups
          triggers:
            - uuid: 5305e06575544c8fa09153a348fc6729
              expression: 'find(/NUT UPS/nut.ups.status,,"regexp","(^| )OB( |$)")=1'
              name: 'NUT: UPS on battery on {HOST.NAME}'
              priority: WARNING
            - uuid: b40c3f78ab434ee5a8b9341a761d024b
              expression: 'find(/NUT UPS/nut.ups.status,,"regexp","(^| )LB( |$)")=1'
              name: 'NUT: UPS low battery on {HOST.NAME}'
              priority: HIGH
            - uuid: 0f0723442a9b4b0cb68c739fcd85a449
              expression: 'find(/NUT UPS/nut.ups.status,,"regexp","(^| )FSD( |$)")=1'
              name: 'NUT: FSD asserted on {HOST.NAME}'
              priority: DISASTER
        - uuid: a41cb97acf2e4bc6ac9b794f09656fcb
          name: 'NUT: Battery charge'
          type: ZABBIX_PASSIVE
          key: nut.battery.charge
          delay: 60s
          history: 30d
          trends: 365d
          value_type: FLOAT
          units: '%'
          tags:
            - tag: component
              value: battery
          triggers:
            - uuid: b6a42cce4e7446e1987bc22b0aa2aa00
              expression: 'last(/NUT UPS/nut.battery.charge)<20'
              name: 'NUT: Battery charge below 20% on {HOST.NAME}'
              priority: HIGH
        - uuid: 92b5797a7a78496da51bae06ee965ce5
          name: 'NUT: Battery voltage'
          type: ZABBIX_PASSIVE
          key: nut.battery.voltage
          delay: 60s
          history: 30d
          trends: 365d
          value_type: FLOAT
          units: V
          tags:
            - tag: component
              value: battery
        - uuid: 555084eed04844958157a4b9ea90cce7
          name: 'NUT: Input voltage'
          type: ZABBIX_PASSIVE
          key: nut.input.voltage
          delay: 60s
          history: 30d
          trends: 365d
          value_type: FLOAT
          units: V
          tags:
            - tag: component
              value: ups
        - uuid: 7c033ff90c38470c9863ed4e92913a7e
          name: 'NUT: Input frequency'
          type: ZABBIX_PASSIVE
          key: nut.input.frequency
          delay: 60s
          history: 30d
          trends: 365d
          value_type: FLOAT
          units: Hz
          tags:
            - tag: component
              value: ups
        - uuid: f79a56a22c3242e2bba13161afdae4ce7
          name: 'NUT: Output voltage'
          type: ZABBIX_PASSIVE
          key: nut.output.voltage
          delay: 60s
          history: 30d
          trends: 365d
          value_type: FLOAT
          units: V
          tags:
            - tag: component
              value: ups
        - uuid: ae27116ccf9a4929b07fca6d7ccdf625
          name: 'NUT: UPS load'
          type: ZABBIX_PASSIVE
          key: nut.ups.load
          delay: 60s
          history: 30d
          trends: 365d
          value_type: FLOAT
          units: '%'
          tags:
            - tag: component
              value: ups
          triggers:
            - uuid: c8e8ae18160d4c6883d8505fb4b0ab7a
              expression: 'last(/NUT UPS/nut.ups.load)>90'
              name: 'NUT: UPS load above 90% on {HOST.NAME}'
              priority: HIGH
      valuemaps:
        - uuid: 2e0e07da201d4b389797613dbea18b6f
          name: 'NUT Communication'
          mappings:
            - value: '0'
              newvalue: Failed
            - value: '1'
              newvalue: Available
