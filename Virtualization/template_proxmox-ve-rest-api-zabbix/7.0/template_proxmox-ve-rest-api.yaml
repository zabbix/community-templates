                  expression: |
                    max(/Proxmox VE Cluster by REST API/lxc.status[{#VMID}],900)=0
                    and {$ENABLE_VM_STOP_ALERT:"{#VMID}"}=1
                    and count(/Proxmox VE Cluster by REST API/lxc.status[{#VMID}],24h,"eq","1")>0
