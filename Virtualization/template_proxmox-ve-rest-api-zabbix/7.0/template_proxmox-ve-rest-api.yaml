                name: 'VM  and LXC status'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.data[?(@.vmid=={#VMID} && @.type=="lxc")].status.first()'
                  error_handler: DISCARD_VALUE
                - type: STR_REPLACE
                  parameters:
                    - stopped
                    - '0'
                - type: STR_REPLACE
                  parameters:
                    - running
                    - '1'
                - type: STR_REPLACE
                  parameters:
                    - paused
                    - '2'
                - type: STR_REPLACE
                  parameters:
                    - unknown
                    - '3'
              master_item:
                key: pve.cluster.resources.raw
              tags:
