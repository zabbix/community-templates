              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.data[?(@.storage=="{#STORAGE_NAME}")].type.first()'
              master_item:
                key: pve.storage.raw
              tags:
                - tag: PVE
                  value: Storage
                - tag: PVE
                  value: '{#STORAGE_NAME}'
            - uuid: 37b0fd0f4af0451c9b4b6bae31ed0ab2
              name: 'Storage shared status {#STORAGE_NAME}'
