            - uuid: 23fbf7d228b544d58f95ccb0cd8230f5
              name: 'VM status {#VMID}'
              graph_items:
                - color: 5E35B1
                  calc_fnc: ALL
                  item:
                    host: 'Proxmox VE Cluster by REST API'
