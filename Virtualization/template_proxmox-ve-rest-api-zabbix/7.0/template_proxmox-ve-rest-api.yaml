                - uuid: 4037a5aac12246b2b4a0670482010837
                  expression: 'last(/Proxmox VE Node by REST API/zfs.util[{#ZPOOL}])>{$ZFS.UTIL.WARN:"{#ZPOOL}"}'
                  name: 'ZFS pool {#ZPOOL} usage above {$ZFS.UTIL.WARN:"{#ZPOOL}"}% on {HOST.NAME}'
                  priority: AVERAGE
