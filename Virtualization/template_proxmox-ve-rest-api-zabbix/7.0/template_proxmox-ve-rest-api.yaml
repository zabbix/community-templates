        - uuid: 235e7e42e382487085fdf54efa040b65
          name: 'Discover HA resources'
          type: DEPENDENT
          key: discover.ha.resources
          delay: '0'
          description: 'Discovers HA-managed resources (VMs and containers) from the service entries of /cluster/ha/status/current. Discovers nothing when HA is not configured, without turning the rule unsupported.'
          item_prototypes:
            - uuid: 1c9ba7d377414184b53b3ed14b57ef26
              name: 'HA state of {#HA_SID}'
              type: DEPENDENT
              key: 'ha.resource.state[{#HA_SID}]'
              delay: '0'
              value_type: CHAR
              trends: '0'
              description: 'Current HA state of resource {#HA_SID} as reported by the CRM, for example started, stopped, error, freeze or ignored. Source: /cluster/ha/status/current, service entry for this SID. Returns "unknown" while the resource is not present in the HA status.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.data[?(@.sid=="{#HA_SID}")].state.first()'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: unknown
              master_item:
                key: pve.ha.raw
              tags:
                - tag: PVE
                  value: HA
                - tag: PVE
                  value: '{#HA_SID}'
              trigger_prototypes:
                - uuid: 1e1ce9abf20f4d0eb649fbfe8d50d884
                  expression: 'last(/Template Proxmox VE REST API/ha.resource.state[{#HA_SID}])="error"'
                  name: 'HA resource {#HA_SID} is in error state'
                  priority: HIGH
                  description: 'The HA-managed resource {#HA_SID} has entered error state. Check the PVE HA log for details.'
                  manual_close: 'YES'
          master_item:
            key: pve.ha.raw
          lld_macro_paths:
            - lld_macro: '{#HA_SID}'
              path: $.sid
            - lld_macro: '{#HA_TYPE}'
              path: $.ha_type
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  // Keep only the service entries and expose the resource type (vm or ct) from the SID.
                  try {
                    var d = JSON.parse(value).data;
                    if (!d || !Array.isArray(d)) return '[]';
                    var out = [];
                    for (var i = 0; i < d.length; i++) {
                      if (d[i].type !== 'service' || !d[i].sid) continue;
                      var parts = String(d[i].sid).split(':');
                      out.push({ sid: d[i].sid, ha_type: parts.length > 1 ? parts[0] : '' });
                    }
                    return JSON.stringify(out);
                  } catch (e) {
                    return '[]';
                  }
