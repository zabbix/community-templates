              master_item:
                key: pve.replication.raw
              tags:
                - tag: PVE
                  value: Replication
                - tag: PVE
                  value: '{#REPL_ID}'
            - uuid: 8e1d7e7e6baf449192b2664314fd749a
              name: 'Replication fail count {#REPL_ID}'
              type: DEPENDENT
