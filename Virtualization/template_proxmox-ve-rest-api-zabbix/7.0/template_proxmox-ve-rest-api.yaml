          master_item:
            key: pve.status
          tags:
            - tag: PVE
              value: CPU
        - uuid: 86a2555f26f04ef99e267d5045947de1
          name: 'PVE localtime'
          type: DEPENDENT
          key: pve.localtime
          delay: '0'
          trends: '0'
          units: unixtime
          description: 'Current Unix timestamp on the PVE host. Source: /nodes/{node}/time → data.localtime.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.data.localtime
          master_item:
            key: pve.time.raw
          tags:
            - tag: PVE
              value: Localtime
        - uuid: 05dec93dcbcc4c4c8db9642f51016ee0
          name: 'PVE machine type'
          type: DEPENDENT
          key: pve.machine.type
          delay: '0'
          value_type: CHAR
          trends: '0'
          description: 'Host kernel machine architecture (e.g. x86_64). Source: /nodes/{node}/status → data["current-kernel"].machine.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.data["current-kernel"].machine'
          master_item:
            key: pve.status
          tags:
            - tag: PVE
              value: Kernel
        - uuid: 7a0e1ff3f96c4695a2642bf3aa80e092
          name: 'PVE memory available'
          type: DEPENDENT
          key: pve.memory.free
          delay: '0'
          trends: '0'
          units: Bytes
          description: 'Free (available) RAM on the PVE host in bytes. Source: /nodes/{node}/status → data.memory.free.'
          preprocessing:
