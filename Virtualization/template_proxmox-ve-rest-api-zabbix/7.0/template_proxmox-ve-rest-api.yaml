                  item:
                    host: 'Template Proxmox VE REST API'
                    key: 'node.uptime[{#NODE_NAME}]'
          master_item:
            key: pve.nodes.raw
          lld_macro_paths:
            - lld_macro: '{#NODE_NAME}'
              path: $.node
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.data[*]'
