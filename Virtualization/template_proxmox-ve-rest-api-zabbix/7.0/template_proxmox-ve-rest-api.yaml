          tags:
            - tag: PVE
              value: CPU
        - uuid: e30e7acbdeb144f1a9b2ef6147df229b
          name: 'PVE load average (1 min)'
          type: DEPENDENT
          key: pve.loadaverage.oneminute
          delay: '0'
