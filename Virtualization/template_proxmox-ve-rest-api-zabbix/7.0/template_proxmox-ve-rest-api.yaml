              valuemap:
                name: 'Tasks status'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.body.data[?(@.grpid=="{#GRPID}" && @.type=="{#TYPE}")].endtime.first()'
                  error_handler: DISCARD_VALUE
              master_item:
                key: pve.tasks.raw
              tags:
