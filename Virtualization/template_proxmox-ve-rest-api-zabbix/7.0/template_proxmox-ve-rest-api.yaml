                  value: Service
                - tag: PVE
                  value: '{#SERVICE}'
            - uuid: 7389a5ef4bb143c582b405caab67bcc2
              name: 'Service state {#SERVICE}'
              type: DEPENDENT
              key: 'pve.service.state[{#SERVICE}]'
