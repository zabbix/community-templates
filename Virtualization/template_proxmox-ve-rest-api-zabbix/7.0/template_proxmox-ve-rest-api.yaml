              trends: '0'
              description: 'SSL certificate fingerprint (SHA-256) of cluster node {#NODE_NAME}. Source: /nodes.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.data[?(@.node=="{#NODE_NAME}")].ssl_fingerprint.first()'
              master_item:
                key: pve.nodes.raw
              tags:
                - tag: PVE
                  value: Node
                - tag: PVE
                  value: '{#NODE_NAME}'
            - uuid: 1979ad3ae5fe4a0da27b22efbf783b68
              name: 'Node status {#NODE_NAME}'
              type: DEPENDENT
              key: 'node.status[{#NODE_NAME}]'
              delay: '0'
              trends: '0'
              description: 'Online status of cluster node {#NODE_NAME}. 1 = online, 0 = offline. Source: /nodes → data[node].status.'
              valuemap:
                name: 'Node status'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.data[?(@.node=="{#NODE_NAME}")].status.first()'
                - type: STR_REPLACE
                  parameters:
                    - online
                    - '1'
                - type: STR_REPLACE
                  parameters:
                    - offline
                    - '0'
              master_item:
                key: pve.nodes.raw
              tags:
                - tag: PVE
                  value: Node
                - tag: PVE
                  value: '{#NODE_NAME}'
              trigger_prototypes:
                - uuid: e85b8277a1824f2daf365df1a8ce8de2
                  expression: 'min(/Template Proxmox VE REST API/node.status[{#NODE_NAME}],900)=0 and {$ENABLE_NODE_STATUS_ALERT:"{#NODE_ID}"}=1'
                  name: 'Node status {#NODE_NAME} offline'
                  priority: HIGH
                  description: |
                    Use the following host macros to control the "Node status" trigger for each Proxmox node:
                    {$ENABLE_NODE_STATUS_ALERT:"{#NODE_ID}"}=1 activates the "Node status" trigger
                    {$ENABLE_NODE_STATUS_ALERT:"{#NODE_ID}"}=0 deactivates (suppresses) the "Node status" trigger
            - uuid: 635870600dec41d382d8aab1217591e2
              name: 'Node uptime {#NODE_NAME}'
              type: DEPENDENT
              key: 'node.uptime[{#NODE_NAME}]'
              delay: '0'
              trends: '0'
              units: s
              description: 'Uptime of cluster node {#NODE_NAME} in seconds. Source: /nodes → data[node].uptime.'
              valuemap:
                name: 'Node status'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.data[?(@.node=="{#NODE_NAME}")].uptime.first()'
                - type: LTRIM
                  parameters:
                    - '["'
                - type: RTRIM
                  parameters:
                    - '"]'
              master_item:
                key: pve.nodes.raw
              tags:
                - tag: PVE
                  value: Node
                - tag: PVE
                  value: '{#NODE_NAME}'
          graph_prototypes:
            - uuid: 98596bad3f0e48b8a8dad405d1ee1ae9
              name: 'Node status {#NODE_NAME}'
              graph_items:
                - color: 1A7C11
                  calc_fnc: ALL
                  item:
                    host: 'Template Proxmox VE REST API'
                    key: 'node.status[{#NODE_NAME}]'
            - uuid: 4ba4071765ef4551b01cd57a588d8bff
              name: 'Node uptime {#NODE_NAME}'
              graph_items:
                - color: 0040FF
