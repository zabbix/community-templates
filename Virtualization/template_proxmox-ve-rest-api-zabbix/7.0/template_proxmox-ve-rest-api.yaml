        - uuid: 14efa82386b54af18a8e26377422dd57
          name: 'Discover storage'
          type: DEPENDENT
          key: discover.storage
          delay: '0'
          enabled_lifetime_type: DISABLE_AFTER
          enabled_lifetime: 2d
          item_prototypes:
