              name: 'Ceph health'
              type: DEPENDENT
              key: 'ceph.health[{#FSID}]'
              delay: '0'
              history: 7d
              description: 'Overall Ceph health: 0 HEALTH_OK, 1 HEALTH_WARN, 2 HEALTH_ERR.'
              valuemap:
                name: 'Ceph health'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.data.health.status
                - type: STR_REPLACE
                  parameters:
                    - HEALTH_OK
                    - '0'
                - type: STR_REPLACE
                  parameters:
                    - HEALTH_WARN
                    - '1'
                - type: STR_REPLACE
                  parameters:
