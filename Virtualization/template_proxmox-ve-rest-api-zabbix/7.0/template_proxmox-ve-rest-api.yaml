          key: discover.nodes
          delay: '0'
          enabled_lifetime_type: DISABLE_AFTER
          enabled_lifetime: 2d
          item_prototypes:
            - uuid: c9e02f2d6c5b4cebacf8a212ef76da59
              name: 'Node fingerprint {#NODE_NAME}'
              type: DEPENDENT
              key: 'node.fingerprint[{#NODE_NAME}]'
              delay: '0'
              value_type: CHAR
              trends: '0'
              description: 'SSL certificate fingerprint (SHA-256) of cluster node {#NODE_NAME}. Source: /nodes.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.data[?(@.node=="{#NODE_NAME}")].ssl_fingerprint.first()'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: pve.nodes.raw
              tags:
                - tag: PVE
                  value: Node
                - tag: PVE
                  value: '{#NODE_NAME}'
            - uuid: 1979ad3ae5fe4a0da27b22efbf783b68
              name: 'Node status {#NODE_NAME}'
              type: DEPENDENT
              key: 'node.status[{#NODE_NAME}]'
              delay: '0'
              trends: '0'
              description: 'Online status of cluster node {#NODE_NAME}. 1 = online, 0 = offline, 2 = unknown. Source: /nodes → data[node].status. The API returns the enum online, offline or unknown, so unknown is mapped instead of leaving a string that an unsigned item cannot store.'
              valuemap:
                name: 'Node status'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.data[?(@.node=="{#NODE_NAME}")].status.first()'
                - type: MATCHES_REGEX
                  parameters:
                    - ^(online|offline|unknown)$
                  error_handler: CUSTOM_VALUE
                  error_handler_params: unknown
                - type: STR_REPLACE
                  parameters:
                    - online
                    - '1'
                - type: STR_REPLACE
                  parameters:
                    - offline
                    - '0'
                - type: STR_REPLACE
                  parameters:
                    - unknown
                    - '2'
              master_item:
                key: pve.nodes.raw
              tags:
                - tag: PVE
                  value: Node
                - tag: PVE
                  value: '{#NODE_NAME}'
              trigger_prototypes:
                - uuid: e85b8277a1824f2daf365df1a8ce8de2
                  expression: |
                    (min(/Proxmox VE Cluster by REST API/node.status[{#NODE_NAME}],900)=0
                    or max(/Proxmox VE Cluster by REST API/node.status[{#NODE_NAME}],900)=2)
                    and {$ENABLE_NODE_STATUS_ALERT:"{#NODE_NAME}"}=1
                  name: 'Node status {#NODE_NAME} not online'
