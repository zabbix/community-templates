        - uuid: d49c0f8dbbca4c29bf5b899b284dbde2
          name: 'Image discovery'
          type: DEPENDENT
          key: podman.images.discovery
          delay: '0'
          filter:
            evaltype: AND
            conditions:
              - macro: '{#IMAGE_NAME}'
                value: '{$PODMAN.IMAGE.MATCHES}'
                formulaid: A
              - macro: '{#IMAGE_NAME}'
                value: '{$PODMAN.IMAGE.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
              - macro: '{#USER}'
                value: '{$PODMAN.IMAGE.USER.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: C
          description: |
            Discovers all images across all rootless Podman users.
            Root user is excluded by default via {$PODMAN.IMAGE.USER.NOT_MATCHES}.
          item_prototypes:
            - uuid: 1137e86ec5ee47e0833d719d21f4d8f6
              name: 'Image [{#IMAGE_NAME}] ({#USER}): created'
              type: DEPENDENT
              key: 'podman.image.created[{#IMAGE_NAME},{#USER}]'
              delay: '0'
              history: 7d
              trends: '0'
              units: unixtime
              description: 'Image creation timestamp (ISO 8601).'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var d = JSON.parse(value);
                      for (var i = 0; i < d.users.length; i++) {
                        if (d.users[i].user !== '{#USER}') continue;
                        var imgs = d.users[i].images || [];
                        for (var j = 0; j < imgs.length; j++) {
                          var names = imgs[j].Names || [];
                          if ((names[0] || '') === '{#IMAGE_NAME}')
                            return String(imgs[j].Created || '');
                        }
                      }
                      return '';
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: 'vfs.file.contents[/var/log/podman.json]'
              tags:
                - tag: component
                  value: image
                - tag: image
                  value: '{#IMAGE_NAME}'
            - uuid: 934e8ddd1a094dd88431933424d6240a
              name: 'Image [{#IMAGE_NAME}] ({#USER}): size'
              type: DEPENDENT
              key: 'podman.image.size[{#IMAGE_NAME},{#USER}]'
              delay: '0'
              history: 7d
              units: B
              description: 'Image size in bytes.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var d = JSON.parse(value);
                      for (var i = 0; i < d.users.length; i++) {
                        if (d.users[i].user !== '{#USER}') continue;
                        var imgs = d.users[i].images || [];
                        for (var j = 0; j < imgs.length; j++) {
                          var names = imgs[j].Names || [];
                          if ((names[0] || '') === '{#IMAGE_NAME}')
                            return String(imgs[j].Size || 0);
                        }
                      }
                      return '0';
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: 'vfs.file.contents[/var/log/podman.json]'
              tags:
                - tag: component
                  value: image
                - tag: image
                  value: '{#IMAGE_NAME}'
          master_item:
            key: 'vfs.file.contents[/var/log/podman.json]'
          lld_macro_paths:
            - lld_macro: '{#IMAGE_ID}'
              path: $.id
            - lld_macro: '{#IMAGE_NAME}'
              path: $.name
            - lld_macro: '{#USER}'
              path: $.user
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  var result = [];
                  data.users.forEach(function(u) {
                    (u.images || []).forEach(function(img) {
                      var names = img.Names || [];
                      var name = Array.isArray(names) && names.length > 0
                        ? names[0] : '<none>:<none>';
                      result.push({
                        name: name,
                        id: typeof img.Id === 'string'
                          ? img.Id.replace('sha256:','').substring(0,12) : '',
                        user: u.user
                      });
                    });
                  });
                  return JSON.stringify(result);
