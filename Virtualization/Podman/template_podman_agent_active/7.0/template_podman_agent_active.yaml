            key: 'vfs.file.contents[/var/log/podman.json]'
          lld_macro_paths:
            - lld_macro: '{#NETWORK_ID}'
              path: $.id
            - lld_macro: '{#NETWORK_NAME}'
              path: $.name
            - lld_macro: '{#USER}'
              path: $.user
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  var result = [];
                  data.users.forEach(function(u) {
                    (u.networks || []).forEach(function(n) {
                      result.push({
                        name: n.name,
                        id: n.id ? n.id.substring(0, 12) : '',
                        user: u.user
                      });
                    });
                  });
                  return JSON.stringify(result);
        - uuid: 8a8795c6731b4200bfc2d94c76672504
          name: 'Pod discovery'
          type: DEPENDENT
          key: podman.pods.discovery
          delay: '0'
          description: 'Discovers all pods across all rootless Podman users.'
          item_prototypes:
            - uuid: 705bfb9f6920475cbb411542fd9db437
              name: 'Pod [{#POD_NAME}]: container count'
              type: DEPENDENT
              key: 'podman.pod.containers[{#POD_NAME},{#USER}]'
              delay: '0'
              history: 7d
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var d = JSON.parse(value);
                      for (var i = 0; i < d.users.length; i++) {
                        if (d.users[i].user !== '{#USER}') continue;
                        var pods = d.users[i].pods || [];
                        for (var j = 0; j < pods.length; j++) {
                          if (pods[j].Name === '{#POD_NAME}')
                            return String((pods[j].Containers || []).length);
                        }
                      }
                      return '0';
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: 'vfs.file.contents[/var/log/podman.json]'
              tags:
                - tag: component
                  value: pod
                - tag: pod
                  value: '{#POD_NAME}'
            - uuid: 8b9af4da4b334e41a44072fb48b17b0f
              name: 'Pod [{#POD_NAME}]: status'
              type: DEPENDENT
              key: 'podman.pod.status[{#POD_NAME},{#USER}]'
              delay: '0'
              history: 7d
              value_type: FLOAT
              trends: '0'
              valuemap:
                name: 'Pod status'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.users[?(@.user=="{#USER}")].pods[?(@.Name=="{#POD_NAME}")].Status.first()'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: unknown
                - type: STR_REPLACE
                  parameters:
                    - Running
                    - '0'
                - type: STR_REPLACE
                  parameters:
                    - Created
                    - '1'
                - type: STR_REPLACE
                  parameters:
                    - Stopped
                    - '2'
                - type: STR_REPLACE
                  parameters:
                    - Exited
                    - '3'
                - type: STR_REPLACE
                  parameters:
                    - Paused
                    - '4'
                - type: STR_REPLACE
                  parameters:
                    - Dead
                    - '5'
                - type: STR_REPLACE
                  parameters:
                    - Degraded
                    - '6'
                - type: STR_REPLACE
                  parameters:
                    - Error
                    - '7'
              master_item:
                key: 'vfs.file.contents[/var/log/podman.json]'
              tags:
                - tag: component
                  value: pod
                - tag: pod
                  value: '{#POD_NAME}'
              trigger_prototypes:
                - uuid: 17c4c1a2c75f442ea89d0d55a9191d9e
                  expression: 'min(/Podman by Zabbix Agent Active/podman.pod.status[{#POD_NAME},{#USER}],5m)=6'
                  name: 'Pod [{#POD_NAME}] ({#USER}): degraded (some containers not running)'
                  priority: AVERAGE
                  description: 'One or more containers in the pod are not running. Check pod status: podman pod inspect {#POD_NAME}. Check individual container states: podman ps -a --pod'
                  manual_close: 'YES'
                  tags:
                    - tag: component
                      value: pod
                    - tag: pod
                      value: '{#POD_NAME}'
                - uuid: 50adad9c79294690841fa04a012e261c
                  expression: 'min(/Podman by Zabbix Agent Active/podman.pod.status[{#POD_NAME},{#USER}],5m)>0 and min(/Podman by Zabbix Agent Active/podman.pod.status[{#POD_NAME},{#USER}],5m)<>6'
                  name: 'Pod [{#POD_NAME}] ({#USER}): not running (status: {ITEM.LASTVALUE1})'
                  priority: HIGH
                  description: 'Pod is not in Running or Degraded state. Current status: {ITEM.LASTVALUE1}. Start the pod: podman pod start {#POD_NAME}. Check pod details: podman pod inspect {#POD_NAME}'
                  manual_close: 'YES'
                  tags:
                    - tag: component
                      value: pod
                    - tag: pod
                      value: '{#POD_NAME}'
          master_item:
            key: 'vfs.file.contents[/var/log/podman.json]'
          lld_macro_paths:
            - lld_macro: '{#POD_ID}'
              path: $.id
            - lld_macro: '{#POD_NAME}'
              path: $.name
            - lld_macro: '{#USER}'
              path: $.user
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  var result = [];
                  data.users.forEach(function(u) {
                    (u.pods || []).forEach(function(p) {
                      result.push({
                        name: p.Name || '',
                        id: p.Id || '',
                        user: u.user
                      });
                    });
                  });
                  return JSON.stringify(result);
