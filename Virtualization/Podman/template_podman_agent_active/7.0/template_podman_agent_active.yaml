            - uuid: 17992d30f96146e5b4cb71866f22035a
              name: 'Network [{#NETWORK_NAME}] ({#USER}): subnet'
              type: DEPENDENT
              key: 'podman.network.subnet[{#NETWORK_NAME},{#USER}]'
              delay: '0'
              history: 7d
              value_type: TEXT
              trends: '0'
              description: 'Primary subnet in CIDR notation.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var d = JSON.parse(value);
                      for (var i = 0; i < d.users.length; i++) {
                        if (d.users[i].user !== '{#USER}') continue;
                        var nets = d.users[i].networks || [];
                        for (var j = 0; j < nets.length; j++) {
                          if (nets[j].name !== '{#NETWORK_NAME}') continue;
                          var s = nets[j].subnets || [];
                          return s.length > 0 ? (s[0].subnet || '') : '';
                        }
                      }
                      return '';
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: 'vfs.file.contents[/var/log/podman.json]'
