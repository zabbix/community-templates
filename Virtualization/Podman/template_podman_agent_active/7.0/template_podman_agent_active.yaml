                  name: 'User [{#USER}]: {ITEM.LASTVALUE1} unused images'
                  priority: INFO
                  description: |
                    {ITEM.LASTVALUE1} images for user {#USER} have no associated containers and are wasting disk space.
                    List unused images: podman images --filter dangling=false
                    Remove unused images (safe — only images with no containers): podman image prune -a
                    WARNING: "podman image prune -a" removes ALL images not currently used by a container, including base images. Running containers will not be affected, but stopped containers that need their image to restart will lose it.
                  manual_close: 'YES'
                  tags:
                    - tag: component
                      value: user
                    - tag: user
                      value: '{#USER}'
