              name: 'User [{#USER}]: unused images'
              type: DEPENDENT
              key: 'podman.user.images.unused[{#USER}]'
              delay: '0'
              history: 7d
              description: 'Images with no active containers — candidates for cleanup.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var d = JSON.parse(value);
                      for (var i = 0; i < d.users.length; i++) {
                        if (d.users[i].user !== '{#USER}') continue;
                        var imgs = d.users[i].images || [];
                        var unused = 0;
                        for (var j = 0; j < imgs.length; j++) {
                          if ((imgs[j].Containers || 0) === 0) unused++;
                        }
                        return unused;
                      }
                      return 0;
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
