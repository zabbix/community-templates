          value: ^root$
          description: 'LLD filter: skip images owned by these users (regex, default: root)'
        - macro: '{$PODMAN.IMAGES.UNUSED.MAX}'
          value: '3'
          description: 'INFO trigger if unused images per user exceed this count'
        - macro: '{$PODMAN.MEM.CRIT}'
          value: '90'
          description: 'Container memory usage threshold for trigger (%)'
        - macro: '{$PODMAN.NODATA.TIMEOUT}'
          value: 5m
          description: 'Alert if collector JSON is not updated within this period'
        - macro: '{$PODMAN.UPDATE.INTERVAL}'
          value: 60s
          description: 'How often Zabbix reads the JSON file written by the collector script. Zabbix requires a single macro to fill the whole update interval field, so keep this a plain time value such as 60s or 2m.'
        - macro: '{$PODMAN.STORE.CRIT}'
          value: '90'
          description: 'Storage usage threshold per user for trigger (%)'
