            - uuid: 4bbd5dc0b2714acc9c122ff1f17d592a
              name: 'Container [{#CONTAINER_NAME}]: raw data'
              type: DEPENDENT
              key: 'podman.container.raw[{#CONTAINER_NAME},{#USER}]'
              delay: '0'
              history: '0'
              value_type: TEXT
              trends: '0'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var data = JSON.parse(value);
                      for (var i = 0; i < data.users.length; i++) {
                        var u = data.users[i];
                        if (u.user !== '{#USER}') continue;
                        var ins = u.container_inspects || [];
                        for (var j = 0; j < ins.length; j++) {
                          if (ins[j].Id !== '{#CONTAINER_ID}') continue;
                          var inspect = ins[j];
                          var stats = {};
                          var st = u.stats || [];
                          for (var k = 0; k < st.length; k++) {
                            if ((st[k].Name || st[k].name) === '{#CONTAINER_NAME}') { stats = st[k]; break; }
                          }
                          var state = 'unknown', exitcode = 0, ports = [];
                          var cs = u.containers || [];
                          for (var l = 0; l < cs.length; l++) {
                            if (cs[l].Id !== '{#CONTAINER_ID}') continue;
                            state = (typeof cs[l].State === 'object' && cs[l].State !== null)
                              ? (cs[l].State.Status || '') : (cs[l].State || '');
                            exitcode = cs[l].ExitCode || 0;
                            ports = cs[l].Ports || [];
                            break;
                          }
                          return JSON.stringify({state: state, exitcode: exitcode, ports: ports, stats: stats, inspect: inspect});
                        }
                      }
                      return JSON.stringify({state:'unknown',stats:{},inspect:{}});
              master_item:
                key: 'vfs.file.contents[/var/log/podman.json]'
              tags:
                - tag: component
                  value: container
                - tag: container
                  value: '{#CONTAINER_NAME}'
