              name: 'Container [{#CONTAINER_NAME}]: ports'
              type: DEPENDENT
              key: 'podman.container.ports[{#CONTAINER_NAME},{#USER}]'
              delay: '0'
              history: 7d
              value_type: TEXT
              trends: '0'
              description: 'Port mappings as JSON array (host_port → container_port/protocol).'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var d=JSON.parse(value);
                      for(var i=0;i<d.users.length;i++){
                        if(d.users[i].user!=='{#USER}')continue;
                        var cs=d.users[i].containers||[];
                        for(var j=0;j<cs.length;j++){
                          if(cs[j].Id!=='{#CONTAINER_ID}')continue;
                          return JSON.stringify(cs[j].Ports||[]);
                        }
                      }return'[]';
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: 'vfs.file.contents[/var/log/podman.json]'
