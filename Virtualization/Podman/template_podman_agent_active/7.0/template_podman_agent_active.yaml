zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 02e4df4f20b848e79267641790f241da
      name: Templates/Virtualization
  templates:
    - uuid: 72a442f0d62e4baca1a5130fb35ae1f0
      template: 'Podman by Zabbix Agent Active'
      name: 'Podman by Zabbix Agent Active'
      description: |
        Monitors rootful and rootless Podman containers via a central JSON collector script.
        
        Collector output: /var/log/podman.json
        Supports multiple rootless users + root on the same host.
        If you need help, visit https://github.com/Garfieldttt/Podman-by-Zabbix-Agent-Active
      groups:
        - name: Templates/Virtualization
      items:
        - uuid: 16996ac90ce041fd89b86d63c6f6106d
          name: 'Podman: last collection timestamp'
          type: DEPENDENT
          key: podman.collected_at
          delay: '0'
          history: 7d
          value_type: TEXT
          trends: '0'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.collected_at
          master_item:
            key: 'vfs.file.contents[/var/log/podman.json]'
          tags:
            - tag: component
              value: system
        - uuid: ad7dc3b5f06f4900b01558dddcbf0b2b
          name: 'Podman: collector version'
          type: DEPENDENT
          key: podman.collector.version
          delay: '0'
          history: 7d
          value_type: TEXT
          trends: '0'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.collector_version
          master_item:
            key: 'vfs.file.contents[/var/log/podman.json]'
          tags:
            - tag: component
              value: system
        - uuid: f7688eb26ecc47b1af960b6b3a00a05f
          name: 'Podman: raw data'
          type: ZABBIX_ACTIVE
          key: 'vfs.file.contents[/var/log/podman.json]'
          delay: '{$PODMAN.UPDATE.INTERVAL}'
          history: '0'
          value_type: TEXT
          trends: '0'
          description: 'JSON from zabbix_podman_collect.sh — master item for all dependent items and LLD'
          tags:
            - tag: component
              value: raw
          triggers:
            - uuid: f1854bfdda4f446bb19b279de4e6b05e
              expression: 'nodata(/Podman by Zabbix Agent Active/vfs.file.contents[/var/log/podman.json],{$PODMAN.NODATA.TIMEOUT})=1'
              name: 'Podman: collector data not updated for {$PODMAN.NODATA.TIMEOUT}'
              priority: WARNING
              description: 'The collector script has not written a new /var/log/podman.json for {$PODMAN.NODATA.TIMEOUT}. Check if the cron job is running: systemctl status cron, and verify the script manually: /usr/local/bin/zabbix_podman_collect.sh'
              manual_close: 'YES'
              tags:
                - tag: component
                  value: system
      discovery_rules:
        - uuid: feac06cd55dc4d82b43414991f518577
          name: 'Container discovery'
          type: DEPENDENT
          key: podman.containers.discovery
          delay: '0'
          filter:
            evaltype: AND
            conditions:
              - macro: '{#CONTAINER_NAME}'
                value: '{$PODMAN.CONTAINER.MATCHES}'
                formulaid: A
              - macro: '{#CONTAINER_NAME}'
                value: '{$PODMAN.CONTAINER.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
          description: |
            Discovers all containers across all rootless Podman users.
            Infra containers (pod infrastructure) are automatically excluded.
          item_prototypes:
            - uuid: b9e5730650ba44bd94bf81304f863b51
              name: 'Container [{#CONTAINER_NAME}]: avg CPU usage'
              type: DEPENDENT
              key: 'podman.container.avg_cpu[{#CONTAINER_NAME},{#USER}]'
              delay: '0'
              history: 7d
              value_type: FLOAT
              units: '%'
              description: 'Average CPU usage percent since container start.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.users[?(@.user=="{#USER}")].stats[?(@.name=="{#CONTAINER_NAME}")].avg_cpu.first()'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: 0%
                - type: REGEX
                  parameters:
                    - '(\d+\.?\d*)%'
                    - \1
              master_item:
                key: 'vfs.file.contents[/var/log/podman.json]'
              tags:
                - tag: component
                  value: container
                - tag: container
                  value: '{#CONTAINER_NAME}'
            - uuid: ad6edc85f05e48189474abdaa91ae3a0
              name: 'Container [{#CONTAINER_NAME}]: block read'
              type: DEPENDENT
              key: 'podman.container.block.in[{#CONTAINER_NAME},{#USER}]'
              delay: '0'
              history: 7d
              units: Bps
              description: 'Cumulative block device bytes read.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.users[?(@.user=="{#USER}")].stats[?(@.name=="{#CONTAINER_NAME}")].block_input.first()'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: 'vfs.file.contents[/var/log/podman.json]'
              tags:
                - tag: component
                  value: container
                - tag: container
                  value: '{#CONTAINER_NAME}'
            - uuid: 739c00eb959f48b8bff173435f676517
              name: 'Container [{#CONTAINER_NAME}]: block write'
              type: DEPENDENT
              key: 'podman.container.block.out[{#CONTAINER_NAME},{#USER}]'
              delay: '0'
              history: 7d
              units: Bps
              description: 'Cumulative block device bytes written.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.users[?(@.user=="{#USER}")].stats[?(@.name=="{#CONTAINER_NAME}")].block_output.first()'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: 'vfs.file.contents[/var/log/podman.json]'
              tags:
                - tag: component
                  value: container
                - tag: container
                  value: '{#CONTAINER_NAME}'
            - uuid: e5c57ac1fa354be7a2eee25b9d48fe79
              name: 'Container [{#CONTAINER_NAME}]: block I/O'
              type: DEPENDENT
              key: 'podman.container.blockio[{#CONTAINER_NAME},{#USER}]'
              delay: '0'
              history: 7d
              value_type: TEXT
              trends: '0'
              description: 'Block I/O as reported by the collector (e.g. "10MB / 2MB").'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.users[?(@.user=="{#USER}")].stats[?(@.name=="{#CONTAINER_NAME}")].block_io.first()'
                  error_handler: CUSTOM_VALUE
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: 'vfs.file.contents[/var/log/podman.json]'
              tags:
                - tag: component
                  value: container
                - tag: container
                  value: '{#CONTAINER_NAME}'
            - uuid: 825bbd89f3ee4c9f902f08174b2f8f8c
              name: 'Container [{#CONTAINER_NAME}]: CPU usage'
              type: DEPENDENT
              key: 'podman.container.cpu[{#CONTAINER_NAME},{#USER}]'
              delay: '0'
              history: 7d
              value_type: FLOAT
              units: '%'
              description: 'CPU usage percent. 0 if container is stopped or stats unavailable.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.users[?(@.user=="{#USER}")].stats[?(@.name=="{#CONTAINER_NAME}")].cpu_percent.first()'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
              master_item:
                key: 'vfs.file.contents[/var/log/podman.json]'
              tags:
                - tag: component
                  value: container
                - tag: container
                  value: '{#CONTAINER_NAME}'
              trigger_prototypes:
                - uuid: 833852977d2c4c8b9a7fd69fff6e25ac
                  expression: 'avg(/Podman by Zabbix Agent Active/podman.container.cpu[{#CONTAINER_NAME},{#USER}],5m)>{$PODMAN.CPU.CRIT}'
                  name: 'Container [{#CONTAINER_NAME}] ({#USER}): CPU high (>{$PODMAN.CPU.CRIT}% for 5m)'
                  priority: WARNING
                  description: 'Container CPU usage has exceeded {$PODMAN.CPU.CRIT}% on average over 5 minutes. Check logs: podman logs {#CONTAINER_NAME}. Adjust the threshold via macro {$PODMAN.CPU.CRIT} if the container is expected to run at high CPU.'
                  manual_close: 'YES'
                  tags:
                    - tag: component
                      value: container
                    - tag: container
                      value: '{#CONTAINER_NAME}'
            - uuid: 4fd6e174ad2e47da9e6d4d35e34b9538
              name: 'Container [{#CONTAINER_NAME}]: exit code'
              type: DEPENDENT
              key: 'podman.container.exitcode[{#CONTAINER_NAME},{#USER}]'
              delay: '0'
              history: 7d
              description: 'Exit code of the container process. 0 = clean exit or running.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.users[?(@.user=="{#USER}")].containers[?(@.Id=="{#CONTAINER_ID}")].ExitCode.first()'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
              master_item:
                key: 'vfs.file.contents[/var/log/podman.json]'
              tags:
                - tag: component
                  value: container
                - tag: container
                  value: '{#CONTAINER_NAME}'
            - uuid: 7ea6acad4f9b43eeb91374d5ad54041f
              name: 'Container [{#CONTAINER_NAME}]: finished at'
              type: DEPENDENT
              key: 'podman.container.finished_at[{#CONTAINER_NAME},{#USER}]'
              delay: '0'
              history: 7d
              value_type: TEXT
              trends: '0'
              description: 'Timestamp when the container last stopped (ISO 8601).'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.users[?(@.user=="{#USER}")].container_inspects[?(@.Id=="{#CONTAINER_ID}")].State.FinishedAt.first()'
                  error_handler: CUSTOM_VALUE
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: 'vfs.file.contents[/var/log/podman.json]'
              tags:
                - tag: component
                  value: container
                - tag: container
                  value: '{#CONTAINER_NAME}'
            - uuid: f29ae8ca0a69446abbac13694e595bde
              name: 'Container [{#CONTAINER_NAME}]: health check status'
              type: DEPENDENT
              key: 'podman.container.health[{#CONTAINER_NAME},{#USER}]'
              delay: '0'
              history: 7d
              value_type: TEXT
              trends: '0'
              description: 'Health check status: healthy / unhealthy / starting. Empty if no health check configured.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.users[?(@.user=="{#USER}")].container_inspects[?(@.Id=="{#CONTAINER_ID}")].State.Health.Status.first()'
                  error_handler: CUSTOM_VALUE
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: 'vfs.file.contents[/var/log/podman.json]'
              tags:
                - tag: component
                  value: container
                - tag: container
                  value: '{#CONTAINER_NAME}'
              trigger_prototypes:
                - uuid: a19f72a6e7bc4e3f977b83aa1bccd6ed
                  expression: 'last(/Podman by Zabbix Agent Active/podman.container.health[{#CONTAINER_NAME},{#USER}])="unhealthy"'
                  name: 'Container [{#CONTAINER_NAME}] ({#USER}): health check failing'
                  priority: AVERAGE
                  description: 'The container health check is reporting "unhealthy". Check the health check output: podman inspect --format "{{"{{"}}json .State.Health{{"}}"}}" {#CONTAINER_NAME}. Review container logs: podman logs {#CONTAINER_NAME}'
                  manual_close: 'YES'
                  tags:
                    - tag: component
                      value: container
                    - tag: container
                      value: '{#CONTAINER_NAME}'
            - uuid: e30a3dd98ac644ac89ade0dcdad339a9
              name: 'Container [{#CONTAINER_NAME}]: image'
              type: DEPENDENT
              key: 'podman.container.image[{#CONTAINER_NAME},{#USER}]'
              delay: '0'
              history: 7d
              value_type: TEXT
              trends: '0'
              description: 'Full image name including registry and tag (e.g. ghcr.io/user/app:latest).'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.users[?(@.user=="{#USER}")].container_inspects[?(@.Id=="{#CONTAINER_ID}")].Config.Image.first()'
                  error_handler: CUSTOM_VALUE
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: 'vfs.file.contents[/var/log/podman.json]'
              tags:
                - tag: component
                  value: container
                - tag: container
                  value: '{#CONTAINER_NAME}'
            - uuid: 2085c64e0a994fed8776bea128f0aff7
              name: 'Container [{#CONTAINER_NAME}]: IP address'
              type: DEPENDENT
              key: 'podman.container.ip[{#CONTAINER_NAME},{#USER}]'
              delay: '0'
              history: 7d
              value_type: TEXT
              trends: '0'
              description: 'IP address of the first network interface. Empty if container is stopped or uses host networking.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var d=JSON.parse(value);
                      for(var i=0;i<d.users.length;i++){
                        if(d.users[i].user!=='{#USER}')continue;
                        var ins=d.users[i].container_inspects||[];
                        for(var j=0;j<ins.length;j++){
                          if(ins[j].Id!=='{#CONTAINER_ID}')continue;
                          var nets=((ins[j].NetworkSettings||{}).Networks)||{};
                          var keys=Object.keys(nets);
                          for(var k=0;k<keys.length;k++){
                            var ip=(nets[keys[k]].IPAddress||'');
                            if(ip)return ip;
                          }
                          return'';
                        }
                      }return'';
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: 'vfs.file.contents[/var/log/podman.json]'
              tags:
                - tag: component
                  value: container
                - tag: container
                  value: '{#CONTAINER_NAME}'
            - uuid: 6339551cfcfd49f79acb04cfc019e8ba
              name: 'Container [{#CONTAINER_NAME}]: memory limit'
              type: DEPENDENT
              key: 'podman.container.mem.limit[{#CONTAINER_NAME},{#USER}]'
              delay: '0'
              history: 7d
              units: B
              description: 'Memory limit in bytes. 0 = unlimited.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.users[?(@.user=="{#USER}")].container_inspects[?(@.Id=="{#CONTAINER_ID}")].HostConfig.Memory.first()'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: 'vfs.file.contents[/var/log/podman.json]'
              tags:
                - tag: component
                  value: container
                - tag: container
                  value: '{#CONTAINER_NAME}'
            - uuid: 8060506dd770457d86bf0e9efed60237
              name: 'Container [{#CONTAINER_NAME}]: memory usage'
              type: DEPENDENT
              key: 'podman.container.mem.pct[{#CONTAINER_NAME},{#USER}]'
              delay: '0'
              history: 7d
              value_type: FLOAT
              units: '%'
              description: 'Memory usage percent. 0 if container is stopped or stats unavailable.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.users[?(@.user=="{#USER}")].stats[?(@.name=="{#CONTAINER_NAME}")].mem_percent.first()'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
              master_item:
                key: 'vfs.file.contents[/var/log/podman.json]'
              tags:
                - tag: component
                  value: container
                - tag: container
                  value: '{#CONTAINER_NAME}'
              trigger_prototypes:
                - uuid: b5216e6bfaad49c985ee24264c6c31cb
                  expression: 'avg(/Podman by Zabbix Agent Active/podman.container.mem.pct[{#CONTAINER_NAME},{#USER}],5m)>{$PODMAN.MEM.CRIT}'
                  name: 'Container [{#CONTAINER_NAME}] ({#USER}): memory high (>{$PODMAN.MEM.CRIT}% for 5m)'
                  priority: WARNING
                  description: 'Container memory usage has exceeded {$PODMAN.MEM.CRIT}% of its limit on average over 5 minutes. Check current usage: podman stats --no-stream {#CONTAINER_NAME}. Consider increasing the memory limit or investigating a memory leak.'
                  manual_close: 'YES'
                  tags:
                    - tag: component
                      value: container
                    - tag: container
                      value: '{#CONTAINER_NAME}'
            - uuid: 5933312ac93c41f59a8640a473841e20
              name: 'Container [{#CONTAINER_NAME}]: memory used'
              type: DEPENDENT
              key: 'podman.container.mem.used[{#CONTAINER_NAME},{#USER}]'
              delay: '0'
              history: 7d
              units: B
              description: 'Memory usage in bytes.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.users[?(@.user=="{#USER}")].stats[?(@.name=="{#CONTAINER_NAME}")].mem_usage.first()'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: 'vfs.file.contents[/var/log/podman.json]'
              tags:
                - tag: component
                  value: container
                - tag: container
                  value: '{#CONTAINER_NAME}'
            - uuid: 7d5603af28b24e57a1703dfe1b932d1f
              name: 'Container [{#CONTAINER_NAME}]: mounts'
              type: DEPENDENT
              key: 'podman.container.mounts[{#CONTAINER_NAME},{#USER}]'
              delay: '0'
              history: 7d
              value_type: TEXT
              trends: '0'
              description: 'Bind mounts and volumes: source->destination (comma-separated).'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var d=JSON.parse(value);
                      for(var i=0;i<d.users.length;i++){
                        if(d.users[i].user!=='{#USER}')continue;
                        var ins=d.users[i].container_inspects||[];
                        for(var j=0;j<ins.length;j++){
                          if(ins[j].Id!=='{#CONTAINER_ID}')continue;
                          var mounts=(ins[j].Mounts||[]);
                          return mounts.map(function(m){return(m.Source||'')+'→'+(m.Destination||'');}).join(', ');
                        }
                      }return'';
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: 'vfs.file.contents[/var/log/podman.json]'
              tags:
                - tag: component
                  value: container
                - tag: container
                  value: '{#CONTAINER_NAME}'
            - uuid: c15f501d1725410e8747a8f4f428f32a
              name: 'Container [{#CONTAINER_NAME}]: network in'
              type: DEPENDENT
              key: 'podman.container.net.in[{#CONTAINER_NAME},{#USER}]'
              delay: '0'
              history: 7d
              units: Bps
              description: 'Cumulative network bytes received.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.users[?(@.user=="{#USER}")].stats[?(@.name=="{#CONTAINER_NAME}")].net_input.first()'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: 'vfs.file.contents[/var/log/podman.json]'
              tags:
                - tag: component
                  value: container
                - tag: container
                  value: '{#CONTAINER_NAME}'
            - uuid: 7322d4305ec74b42ba1f49e5113b1de8
              name: 'Container [{#CONTAINER_NAME}]: network out'
              type: DEPENDENT
              key: 'podman.container.net.out[{#CONTAINER_NAME},{#USER}]'
              delay: '0'
              history: 7d
              units: Bps
              description: 'Cumulative network bytes sent.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.users[?(@.user=="{#USER}")].stats[?(@.name=="{#CONTAINER_NAME}")].net_output.first()'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: 'vfs.file.contents[/var/log/podman.json]'
              tags:
                - tag: component
                  value: container
                - tag: container
                  value: '{#CONTAINER_NAME}'
            - uuid: 07dea4cbbc4c459bbacc6e2ad1dc6317
              name: 'Container [{#CONTAINER_NAME}]: network I/O'
              type: DEPENDENT
              key: 'podman.container.netio[{#CONTAINER_NAME},{#USER}]'
              delay: '0'
              history: 7d
              value_type: TEXT
              trends: '0'
              description: 'Network I/O as reported by the collector (e.g. "1.2MB / 500kB").'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.users[?(@.user=="{#USER}")].stats[?(@.name=="{#CONTAINER_NAME}")].net_io.first()'
                  error_handler: CUSTOM_VALUE
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: 'vfs.file.contents[/var/log/podman.json]'
              tags:
                - tag: component
                  value: container
                - tag: container
                  value: '{#CONTAINER_NAME}'
            - uuid: b95717f115bb41c69d4306cc6918e109
              name: 'Container [{#CONTAINER_NAME}]: network'
              type: DEPENDENT
              key: 'podman.container.network[{#CONTAINER_NAME},{#USER}]'
              delay: '0'
              history: 7d
              value_type: TEXT
              trends: '0'
              description: 'Names of networks the container is connected to (comma-separated).'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var d=JSON.parse(value);
                      for(var i=0;i<d.users.length;i++){
                        if(d.users[i].user!=='{#USER}')continue;
                        var ins=d.users[i].container_inspects||[];
                        for(var j=0;j<ins.length;j++){
                          if(ins[j].Id!=='{#CONTAINER_ID}')continue;
                          var nets=((ins[j].NetworkSettings||{}).Networks)||{};
                          return Object.keys(nets).join(', ');
                        }
                      }return'';
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: 'vfs.file.contents[/var/log/podman.json]'
              tags:
                - tag: component
                  value: container
                - tag: container
                  value: '{#CONTAINER_NAME}'
            - uuid: 2118267d5c3c4a76aace5b67189d879f
              name: 'Container [{#CONTAINER_NAME}]: OOM killed'
              type: DEPENDENT
              key: 'podman.container.oom_killed[{#CONTAINER_NAME},{#USER}]'
              delay: '0'
              history: 7d
              description: '1 if the container was killed by the OOM killer, 0 otherwise.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.users[?(@.user=="{#USER}")].container_inspects[?(@.Id=="{#CONTAINER_ID}")].State.OOMKilled.first()'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: 'false'
                - type: BOOL_TO_DECIMAL
                  parameters:
                    - ''
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: 'vfs.file.contents[/var/log/podman.json]'
              tags:
                - tag: component
                  value: container
                - tag: container
