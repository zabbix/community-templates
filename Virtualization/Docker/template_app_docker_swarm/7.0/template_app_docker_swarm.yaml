zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: a571c0d144b14fd4a87a9d9b2aa9fcd6
      name: Templates/Applications
  templates:
    - uuid: d80053dc250f4b13a31328875e844f98
      template: 'Docker Swarm by Zabbix agent 2'
      name: 'Docker Swarm by Zabbix agent 2'
      description: |
        The template to monitor Docker Swarm services by Zabbix agent 2.
        Items are keyed by service name, so redeploys and updates do not create new items.
        Links Docker by Zabbix agent 2 for the Docker engine metrics and excludes swarm task containers from its container discovery.
        Swarm-wide metrics (replicas, update state, failed tasks) are collected on manager nodes only.

        Requires files/swarm.sh and files/swarm.conf on every swarm node, see README.md.

        Author: noakky
        https://github.com/noakky/zabbix-template-docker-swarm
      vendor:
        name: noakky
        version: 7.0-1
      templates:
        - name: 'Docker by Zabbix agent 2'
      groups:
        - name: Templates/Applications
      items:
        - uuid: db0ba900a3144eb9a79afff82d2eb4dd
          name: 'Get swarm snapshot'
          key: swarm.services.get
          history: '0'
          value_type: TEXT
          trends: '0'
          timeout: 20s
          description: 'Output of swarm.sh: task containers of this node with their stats, services, update states and failed tasks.'
          tags:
            - tag: app
              value: swarm
            - tag: component
              value: raw
        - uuid: 03fe9d971dd6440b94b2daf77556afac
          name: 'Swarm services data'
          type: DEPENDENT
          key: swarm.services.aggr
          delay: '0'
          history: '0'
          value_type: TEXT
          trends: '0'
          description: 'Snapshot aggregated per service.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = JSON.parse(value);
                  if (!d.containers) {
                      throw 'Unexpected output of swarm.sh: ' + value.substring(0, 200);
                  }

                  function num(v) {
                      v = parseFloat(v);
                      return isNaN(v) ? 0 : v;
                  }
                  function unixtime(ts) {
                      var t = Date.parse(String(ts).substring(0, 19) + 'Z');
                      return isNaN(t) || t <= 0 ? 0 : Math.floor(t / 1000);
                  }
                  function round(v) {
                      return Math.round(v * 10000) / 10000;
                  }

                  var services = {};
                  function get(name) {
                      if (!services[name]) {
                          services[name] = {
                              stack: '', mode: '', image: '', update_state: 'none',
                              replicas_running: 0, replicas_desired: 0,
                              tasks_running: 0, tasks_unhealthy: 0, tasks_oom: 0, health_failing: 0,
                              started: 0, finished: 0, last_exit_code: 0, last_error: '',
                              task_failed_time: 0, task_failed_error: '',
                              cpu: 0, cpu_kernel: 0, cpu_user: 0, cpu_throttled: 0, online_cpus: 0,
                              mem: 0, mem_total: 0, mem_inactive: 0, mem_limit: 0, mem_pct: 0, pids: 0,
                              net_rx: 0, net_tx: 0, net_rx_packets: 0, net_tx_packets: 0,
                              net_rx_errors: 0, net_tx_errors: 0, net_rx_dropped: 0, net_tx_dropped: 0,
                              blk_read: 0, blk_write: 0
                          };
                      }
                      return services[name];
                  }

                  // Task containers on this node.
                  var byId = {};
                  d.containers.forEach(function (c) {
                      var s = get(c.service), st = c.state || {}, health = st.Health || {};
                      s.stack = s.stack || c.stack || '';
                      if (st.OOMKilled) {
                          s.tasks_oom++;
                      }
                      if (st.Status === 'running') {
                          byId[c.id] = s;
                          s.tasks_running++;
                          s.image = s.image || String(c.image).split('@')[0];
                          if (health.Status === 'unhealthy') {
                              s.tasks_unhealthy++;
                          }
                          s.health_failing = Math.max(s.health_failing, num(health.FailingStreak));
                          s.started = Math.max(s.started, unixtime(st.StartedAt));
                      }
                      else {
                          var finished = unixtime(st.FinishedAt);
                          if (finished >= s.finished) {
                              s.finished = finished;
                              s.last_exit_code = num(st.ExitCode);
                              s.last_error = st.Error || '';
                          }
                      }
                  });

                  // Resource usage of running tasks.
                  (d.stats || []).forEach(function (x) {
                      var s = byId[x.id];
                      if (!s) {
                          return;
                      }
                      var cpu = x.cpu_stats || {}, pre = x.precpu_stats || {};
                      var cu = cpu.cpu_usage || {}, pu = pre.cpu_usage || {};
                      var ncpu = num(cpu.online_cpus) || 1;
                      var wall = (num(cpu.system_cpu_usage) - num(pre.system_cpu_usage)) / ncpu;
                      if (wall > 0) {
                          s.cpu += Math.max(num(cu.total_usage) - num(pu.total_usage), 0) / wall * 100;
                          s.cpu_kernel += Math.max(num(cu.usage_in_kernelmode) - num(pu.usage_in_kernelmode), 0) / wall;
                          s.cpu_user += Math.max(num(cu.usage_in_usermode) - num(pu.usage_in_usermode), 0) / wall;
                          var th = cpu.throttling_data || {}, pth = pre.throttling_data || {};
                          s.cpu_throttled = Math.max(s.cpu_throttled,
                              Math.max(num(th.throttled_time) - num(pth.throttled_time), 0) / wall * 100);
                      }
                      s.online_cpus = Math.max(s.online_cpus, ncpu);

                      var mem = x.memory_stats || {}, ms = mem.stats || {};
                      var usage = num(mem.usage), limit = num(mem.limit);
                      var inactive = num(ms.inactive_file !== undefined ? ms.inactive_file : ms.total_inactive_file);
                      s.mem_total += usage;
                      s.mem_inactive += inactive;
                      s.mem += Math.max(usage - inactive, 0);
                      s.mem_limit += limit;
                      if (limit > 0) {
                          s.mem_pct = Math.max(s.mem_pct, (usage - inactive) / limit * 100);
                      }
                      s.pids += num((x.pids_stats || {}).current);

                      var nets = x.networks || {};
                      Object.keys(nets).forEach(function (k) {
                          var n = nets[k];
                          s.net_rx += num(n.rx_bytes);
                          s.net_tx += num(n.tx_bytes);
                          s.net_rx_packets += num(n.rx_packets);
                          s.net_tx_packets += num(n.tx_packets);
                          s.net_rx_errors += num(n.rx_errors);
                          s.net_tx_errors += num(n.tx_errors);
                          s.net_rx_dropped += num(n.rx_dropped);
                          s.net_tx_dropped += num(n.tx_dropped);
                      });
                      ((x.blkio_stats || {}).io_service_bytes_recursive || []).forEach(function (io) {
                          var op = String(io.op).toLowerCase();
                          if (op === 'read') {
                              s.blk_read += num(io.value);
                          }
                          else if (op === 'write') {
                              s.blk_write += num(io.value);
                          }
                      });
                  });

                  // Swarm-wide state (managers only).
                  (d.services || []).forEach(function (x) {
                      var s = get(x.name), r = String(x.replicas).split('/');
                      s.mode = x.mode;
                      s.image = String(x.image).split('@')[0];
                      s.replicas_running = num(r[0]);
                      s.replicas_desired = num(r[1]);
                  });

                  var names = {};
                  (d.updates || []).forEach(function (x) {
                      var s = get(x.name);
                      names[x.id] = x.name;
                      s.stack = s.stack || x.stack || '';
                      s.update_state = x.state || 'none';
                  });

                  (d.tasks || []).forEach(function (t) {
                      var name = names[t.service];
                      if (!name || (t.state !== 'failed' && t.state !== 'rejected') || /^No such container/.test(t.err)) {
                          return;
                      }
                      var s = services[name];
                      if (t.ts > s.task_failed_time) {
                          s.task_failed_time = t.ts;
                          s.task_failed_error = t.err;
                      }
                  });

                  Object.keys(services).forEach(function (name) {
                      var s = services[name];
                      s.cpu = round(s.cpu);
                      s.cpu_kernel = round(s.cpu_kernel);
                      s.cpu_user = round(s.cpu_user);
                      s.cpu_throttled = round(s.cpu_throttled);
                      s.mem_pct = round(s.mem_pct);
                  });

                  return JSON.stringify({
                      manager: d.manager === true,
                      count: Object.keys(services).length,
                      services: services
                  });
          master_item:
            key: swarm.services.get
          tags:
            - tag: app
              value: swarm
            - tag: component
              value: raw
        - uuid: c162093e6b0e4405b42e6ef2914483bb
          name: 'Swarm services count'
          type: DEPENDENT
          key: swarm.services.count
          delay: '0'
          description: 'Number of swarm services seen by this node.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.count'
          master_item:
            key: swarm.services.aggr
          tags:
            - tag: app
              value: swarm
            - tag: component
              value: swarm
          triggers:
            - uuid: a2b92afb6817409ba428a10903c3e0d8
              expression: 'nodata(/Docker Swarm by Zabbix agent 2/swarm.services.count,{$SWARM.NODATA.TIMEOUT})=1'
              name: 'Swarm: Failed to fetch swarm data'
              priority: WARNING
              description: 'Zabbix has not received data for items for the last {$SWARM.NODATA.TIMEOUT}.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
      discovery_rules:
        - uuid: 265bf5ba15c349b490b1c9ab1b6a582e
          name: 'Swarm services discovery'
          type: DEPENDENT
          key: swarm.services.discovery
          delay: '0'
          filter:
            evaltype: AND
            conditions:
              - macro: '{#SERVICE}'
                value: '{$SWARM.LLD.FILTER.SERVICE.MATCHES}'
                formulaid: A
              - macro: '{#SERVICE}'
                value: '{$SWARM.LLD.FILTER.SERVICE.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
          lifetime: 30d
          enabled_lifetime_type: DISABLE_AFTER
          enabled_lifetime: 1h
          description: 'Discovery of swarm services.'
          item_prototypes:
            - uuid: e72e8f7550844e60b071221606552f80
              name: 'Service {#SERVICE}: Tasks running'
              type: DEPENDENT
              key: 'swarm.service.tasks.running[{#SERVICE}]'
              delay: '0'
              description: 'Running tasks of the service on this node.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.services[''{#SERVICE}''].tasks_running'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
              master_item:
                key: swarm.services.aggr
              tags:
                - tag: app
                  value: swarm
                - tag: component
                  value: tasks
                - tag: service
                  value: '{#SERVICE}'
                - tag: stack
                  value: '{#STACK}'
            - uuid: 721829970b914502b29918a17047dd7d
              name: 'Service {#SERVICE}: Tasks unhealthy'
              type: DEPENDENT
              key: 'swarm.service.tasks.unhealthy[{#SERVICE}]'
              delay: '0'
              description: 'Running tasks of the service on this node with a failing healthcheck.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.services[''{#SERVICE}''].tasks_unhealthy'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
              master_item:
                key: swarm.services.aggr
              tags:
                - tag: app
                  value: swarm
                - tag: component
                  value: health
                - tag: service
                  value: '{#SERVICE}'
                - tag: stack
                  value: '{#STACK}'
              trigger_prototypes:
                - uuid: 783f38e2416f4f209e330ae4dea89e5e
                  expression: 'min(/Docker Swarm by Zabbix agent 2/swarm.service.tasks.unhealthy[{#SERVICE}],{$SWARM.SERVICE.UNHEALTHY.TIMEOUT:"{#SERVICE}"})>0'
                  name: 'Swarm: Service {#SERVICE}: Unhealthy tasks'
                  opdata: 'Unhealthy: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: 'Service tasks have had a failing healthcheck for {$SWARM.SERVICE.UNHEALTHY.TIMEOUT}.'
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: availability
            - uuid: bb518c32837346daa7a0c4761552a1fb
              name: 'Service {#SERVICE}: Health failing streak'
              type: DEPENDENT
              key: 'swarm.service.health.failing[{#SERVICE}]'
              delay: '0'
              description: 'Max number of consecutive failed healthchecks among running tasks.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.services[''{#SERVICE}''].health_failing'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
              master_item:
                key: swarm.services.aggr
              tags:
                - tag: app
                  value: swarm
                - tag: component
                  value: health
                - tag: service
                  value: '{#SERVICE}'
                - tag: stack
                  value: '{#STACK}'
            - uuid: 22a8fa39a3a24a17b95108a912dcc834
              name: 'Service {#SERVICE}: OOM killed tasks'
              type: DEPENDENT
              key: 'swarm.service.tasks.oom[{#SERVICE}]'
              delay: '0'
              description: 'Task containers on this node killed by the OOM killer.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.services[''{#SERVICE}''].tasks_oom'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
              master_item:
                key: swarm.services.aggr
              tags:
                - tag: app
                  value: swarm
                - tag: component
                  value: memory
                - tag: service
                  value: '{#SERVICE}'
                - tag: stack
                  value: '{#STACK}'
              trigger_prototypes:
                - uuid: a65ae6e44f5b4a7880d6265d5e42cac3
                  expression: 'last(/Docker Swarm by Zabbix agent 2/swarm.service.tasks.oom[{#SERVICE}])>last(/Docker Swarm by Zabbix agent 2/swarm.service.tasks.oom[{#SERVICE}],#2)'
                  name: 'Swarm: Service {#SERVICE}: Task was OOM killed'
                  priority: AVERAGE
                  description: 'A task of the service was killed by the OOM killer.'
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: capacity
            - uuid: 3f1f82aeaa274dbb96fb1ab378018d02
              name: 'Service {#SERVICE}: Task started at'
              type: DEPENDENT
              key: 'swarm.service.task.started[{#SERVICE}]'
              delay: '0'
              units: 'unixtime'
              description: 'Start time of the newest running task on this node.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.services[''{#SERVICE}''].started'
                  error_handler: DISCARD_VALUE
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: swarm.services.aggr
              tags:
                - tag: app
                  value: swarm
                - tag: component
                  value: tasks
                - tag: service
                  value: '{#SERVICE}'
                - tag: stack
                  value: '{#STACK}'
            - uuid: c63bc9eee0ff46ce8574970004df2727
              name: 'Service {#SERVICE}: Last task finished at'
              type: DEPENDENT
              key: 'swarm.service.task.finished[{#SERVICE}]'
              delay: '0'
              units: 'unixtime'
              description: 'Finish time of the last stopped task on this node.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.services[''{#SERVICE}''].finished'
                  error_handler: DISCARD_VALUE
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: swarm.services.aggr
              tags:
                - tag: app
                  value: swarm
                - tag: component
                  value: tasks
                - tag: service
                  value: '{#SERVICE}'
                - tag: stack
                  value: '{#STACK}'
            - uuid: 62111d89ffa94634a1cf3cbb077bb6b0
              name: 'Service {#SERVICE}: Last task exit code'
              type: DEPENDENT
              key: 'swarm.service.task.exitcode[{#SERVICE}]'
              delay: '0'
              description: 'Exit code of the last stopped task on this node.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.services[''{#SERVICE}''].last_exit_code'
                  error_handler: DISCARD_VALUE
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: swarm.services.aggr
              tags:
                - tag: app
                  value: swarm
                - tag: component
                  value: tasks
                - tag: service
                  value: '{#SERVICE}'
                - tag: stack
                  value: '{#STACK}'
            - uuid: 370ddb1b60814d069f51ceca015bd153
              name: 'Service {#SERVICE}: Last task error'
              type: DEPENDENT
              key: 'swarm.service.task.error[{#SERVICE}]'
              delay: '0'
              history: 30d
              value_type: TEXT
              trends: '0'
              description: 'Docker error of the last stopped task on this node.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.services[''{#SERVICE}''].last_error'
                  error_handler: DISCARD_VALUE
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: swarm.services.aggr
              tags:
                - tag: app
                  value: swarm
                - tag: component
                  value: tasks
                - tag: service
                  value: '{#SERVICE}'
                - tag: stack
                  value: '{#STACK}'
            - uuid: e1d3d133e43a4efb97435cbe947e69b2
              name: 'Service {#SERVICE}: Replicas running'
              type: DEPENDENT
              key: 'swarm.service.replicas.running[{#SERVICE}]'
              delay: '0'
              description: 'Running replicas across the swarm. Managers only.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.services[''{#SERVICE}''].replicas_running'
                  error_handler: DISCARD_VALUE
              master_item:
                key: swarm.services.aggr
              tags:
                - tag: app
                  value: swarm
                - tag: component
                  value: replicas
                - tag: service
                  value: '{#SERVICE}'
                - tag: stack
                  value: '{#STACK}'
            - uuid: 692c53691f4c4d6d98fa9ca40496b2ba
              name: 'Service {#SERVICE}: Replicas desired'
              type: DEPENDENT
              key: 'swarm.service.replicas.desired[{#SERVICE}]'
              delay: '0'
              description: 'Desired replicas across the swarm; for global services - number of eligible nodes. Managers only.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.services[''{#SERVICE}''].replicas_desired'
                  error_handler: DISCARD_VALUE
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: swarm.services.aggr
              tags:
                - tag: app
                  value: swarm
                - tag: component
                  value: replicas
                - tag: service
                  value: '{#SERVICE}'
                - tag: stack
                  value: '{#STACK}'
            - uuid: 2889265e313140f09d0b07122d42ef2e
              name: 'Service {#SERVICE}: Update state'
              type: DEPENDENT
              key: 'swarm.service.update.state[{#SERVICE}]'
              delay: '0'
              history: 30d
              value_type: CHAR
              trends: '0'
              description: 'State of the last service update: none, updating, completed, paused, rollback_started, rollback_paused, rollback_completed. Managers only.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.services[''{#SERVICE}''].update_state'
                  error_handler: DISCARD_VALUE
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: swarm.services.aggr
              tags:
                - tag: app
                  value: swarm
                - tag: component
                  value: deploy
                - tag: service
                  value: '{#SERVICE}'
                - tag: stack
                  value: '{#STACK}'
              trigger_prototypes:
                - uuid: 41aecbc7ed99439fae8c15177fea3b71
                  expression: 'find(/Docker Swarm by Zabbix agent 2/swarm.service.update.state[{#SERVICE}],,"regexp","^(paused|rollback_started|rollback_paused|rollback_completed)$")=1'
                  name: 'Swarm: Service {#SERVICE}: Update failed ({ITEM.LASTVALUE1})'
                  priority: AVERAGE
                  description: 'The last service update was paused or rolled back. Resolves with the next successful update.'
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: availability
            - uuid: 155c5be155aa40e39f5ea4ba2974954b
              name: 'Service {#SERVICE}: Image'
              type: DEPENDENT
              key: 'swarm.service.image[{#SERVICE}]'
              delay: '0'
              history: 90d
              value_type: CHAR
              trends: '0'
              description: 'Image of the service.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.services[''{#SERVICE}''].image'
                  error_handler: DISCARD_VALUE
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: swarm.services.aggr
              tags:
                - tag: app
                  value: swarm
                - tag: component
                  value: deploy
                - tag: service
                  value: '{#SERVICE}'
                - tag: stack
                  value: '{#STACK}'
            - uuid: 4b79fc065a724267901fc723e6011e59
              name: 'Service {#SERVICE}: Last failed task time'
              type: DEPENDENT
              key: 'swarm.service.task.failed.time[{#SERVICE}]'
              delay: '0'
              units: 'unixtime'
              description: 'Time of the last failed or rejected task of the service (crash, failed healthcheck, image pull error). Managers only.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.services[''{#SERVICE}''].task_failed_time'
                  error_handler: DISCARD_VALUE
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: swarm.services.aggr
              tags:
                - tag: app
                  value: swarm
                - tag: component
                  value: tasks
                - tag: service
                  value: '{#SERVICE}'
                - tag: stack
                  value: '{#STACK}'
            - uuid: f2dc98090d644879a776195f6ef24ab5
              name: 'Service {#SERVICE}: Last failed task error'
              type: DEPENDENT
              key: 'swarm.service.task.failed.error[{#SERVICE}]'
              delay: '0'
              history: 30d
              value_type: TEXT
              trends: '0'
              description: 'Swarm error of the last failed or rejected task of the service. Managers only.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.services[''{#SERVICE}''].task_failed_error'
                  error_handler: DISCARD_VALUE
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: swarm.services.aggr
              tags:
                - tag: app
                  value: swarm
                - tag: component
                  value: tasks
                - tag: service
                  value: '{#SERVICE}'
                - tag: stack
                  value: '{#STACK}'
            - uuid: b4f13d0bbe8546f7a5c946c0d6e804a2
              name: 'Service {#SERVICE}: CPU usage'
              type: DEPENDENT
              key: 'swarm.service.cpu[{#SERVICE}]'
              delay: '0'
              value_type: FLOAT
              units: '%'
              description: 'CPU usage of all service tasks on this node, % of one core.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.services[''{#SERVICE}''].cpu'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
              master_item:
                key: swarm.services.aggr
              tags:
                - tag: app
                  value: swarm
                - tag: component
                  value: cpu
                - tag: service
                  value: '{#SERVICE}'
                - tag: stack
                  value: '{#STACK}'
              trigger_prototypes:
                - uuid: 207ae81adf94457a80e58a704da067a3
                  expression: 'min(/Docker Swarm by Zabbix agent 2/swarm.service.cpu[{#SERVICE}],{$SWARM.SERVICE.CPU.UTIL.TIME:"{#SERVICE}"})>{$SWARM.SERVICE.CPU.UTIL.MAX:"{#SERVICE}"}'
                  name: 'Swarm: Service {#SERVICE}: High CPU usage'
