                    key: 'swarm.service.net.tx.packets[{#SERVICE}]'
            - uuid: f43b13e788e64a12a95dc48ddce2d46a
              name: 'Service {#SERVICE}: Disk I/O'
              graph_items:
                - color: 199C0D
                  item:
                    host: 'Docker Swarm by Zabbix agent 2'
                    key: 'swarm.service.blk.read[{#SERVICE}]'
                - sortorder: '1'
                  color: F63100
                  item:
                    host: 'Docker Swarm by Zabbix agent 2'
                    key: 'swarm.service.blk.write[{#SERVICE}]'
          master_item:
            key: swarm.services.aggr
          lld_macro_paths:
            - lld_macro: '{#MANAGER}'
              path: $.manager
            - lld_macro: '{#MODE}'
              path: $.mode
            - lld_macro: '{#SERVICE}'
              path: $.service
            - lld_macro: '{#STACK}'
              path: $.stack
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = JSON.parse(value);
                  return JSON.stringify(Object.keys(d.services).map(function (name) {
                      var s = d.services[name];
                      return {service: name, stack: s.stack, mode: s.mode, manager: d.manager ? 1 : 0};
                  }));
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 15m
          overrides:
            - name: 'Worker node: no swarm-wide metrics'
              step: '1'
              filter:
                conditions:
                  - macro: '{#MANAGER}'
                    value: ^0$
                    formulaid: A
              operations:
                - operationobject: ITEM_PROTOTYPE
                  operator: REGEXP
                  value: 'Replicas|Update state|Last failed task'
                  discover: NO_DISCOVER
                - operationobject: TRIGGER_PROTOTYPE
                  operator: REGEXP
                  value: '(?i)replicas|update failed|task failed'
                  discover: NO_DISCOVER
            - name: 'Job services: no replica triggers'
              step: '2'
              filter:
                conditions:
                  - macro: '{#MODE}'
                    value: job
                    formulaid: A
              operations:
                - operationobject: TRIGGER_PROTOTYPE
                  operator: REGEXP
                  value: '(?i)replicas'
                  discover: NO_DISCOVER
      tags:
        - tag: class
          value: software
        - tag: target
          value: docker-swarm
      macros:
        - macro: '{$SWARM.LLD.FILTER.SERVICE.MATCHES}'
          value: '.*'
          description: 'Filter of discoverable swarm services.'
        - macro: '{$SWARM.LLD.FILTER.SERVICE.NOT_MATCHES}'
          value: 'CHANGE_IF_NEEDED'
          description: 'Filter to exclude discovered swarm services.'
        - macro: '{$SWARM.NODATA.TIMEOUT}'
          value: '10m'
          description: 'Period without data after which the "Failed to fetch swarm data" trigger fires.'
        - macro: '{$SWARM.SERVICE.CPU.UTIL.MAX}'
          value: '90'
          description: 'Threshold of the service CPU usage, % of one core. Supports context: {$SWARM.SERVICE.CPU.UTIL.MAX:"stack_service"}.'
        - macro: '{$SWARM.SERVICE.CPU.UTIL.TIME}'
          value: '15m'
          description: 'Period of the high CPU usage trigger.'
        - macro: '{$SWARM.SERVICE.MEM.UTIL.MAX}'
          value: '90'
          description: 'Threshold of the service task memory utilization, %. Supports context.'
        - macro: '{$SWARM.SERVICE.MEM.UTIL.TIME}'
          value: '15m'
          description: 'Period of the high memory utilization trigger.'
        - macro: '{$SWARM.SERVICE.REPLICAS.TIMEOUT}'
          value: '5m'
          description: 'How long a service may run below desired replicas before the triggers fire. Supports context.'
        - macro: '{$SWARM.SERVICE.UNHEALTHY.TIMEOUT}'
          value: '5m'
          description: 'How long service tasks may be unhealthy before the trigger fires. Supports context.'
        - macro: '{$SWARM.SERVICE.TASK.FAILED.PERIOD}'
          value: '15m'
          description: 'How long the task failure problem stays open. Supports context.'
        - macro: '{$DOCKER.LLD.FILTER.CONTAINER.NOT_MATCHES}'
          value: '\.([0-9]+|[a-z0-9]{25})\.[a-z0-9]{25}$'
          description: 'Overrides the macro of Docker by Zabbix agent 2: excludes swarm task containers from its container discovery, they are monitored per service.'
