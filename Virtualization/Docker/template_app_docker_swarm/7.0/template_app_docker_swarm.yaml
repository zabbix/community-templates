              name: 'Service {#SERVICE}: Disk write per second'
              type: DEPENDENT
              key: 'swarm.service.blk.write[{#SERVICE}]'
              delay: '0'
              value_type: FLOAT
              units: 'Bps'
              description: 'Sum over all service tasks on this node.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.services[''{#SERVICE}''].blk_write'
                  error_handler: DISCARD_VALUE
                - type: CHANGE_PER_SECOND
