                - tag: stack
                  value: '{#STACK}'
          trigger_prototypes:
            - uuid: 5df266c545284032a74b3b575c29ab3f
              expression: 'last(/Docker Swarm by Zabbix agent 2/swarm.service.task.failed.time[{#SERVICE}])>now()-{$SWARM.SERVICE.TASK.FAILED.PERIOD:"{#SERVICE}"} and length(last(/Docker Swarm by Zabbix agent 2/swarm.service.task.failed.error[{#SERVICE}]))>=0'
              name: 'Swarm: Service {#SERVICE}: Task failed'
              opdata: '{ITEM.LASTVALUE2}'
              priority: WARNING
              description: 'A task of the service crashed, was killed as unhealthy or could not start. Resolves after {$SWARM.SERVICE.TASK.FAILED.PERIOD}.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
            - uuid: e722558726f140ef91b8e5c7eccb67b2
              expression: 'max(/Docker Swarm by Zabbix agent 2/swarm.service.replicas.running[{#SERVICE}],{$SWARM.SERVICE.REPLICAS.TIMEOUT:"{#SERVICE}"})=0 and last(/Docker Swarm by Zabbix agent 2/swarm.service.replicas.desired[{#SERVICE}])>0'
              name: 'Swarm: Service {#SERVICE}: No running replicas'
              opdata: 'Running: {ITEM.LASTVALUE1} of {ITEM.LASTVALUE2}'
              priority: HIGH
              description: 'The service has had no running replicas for {$SWARM.SERVICE.REPLICAS.TIMEOUT}. A redeploy that completes within this period does not fire the trigger.'
              tags:
                - tag: scope
                  value: availability
            - uuid: 5d31aa62cf5642a7b47ac3f8e679f376
              expression: 'max(/Docker Swarm by Zabbix agent 2/swarm.service.replicas.running[{#SERVICE}],{$SWARM.SERVICE.REPLICAS.TIMEOUT:"{#SERVICE}"})<last(/Docker Swarm by Zabbix agent 2/swarm.service.replicas.desired[{#SERVICE}])'
              name: 'Swarm: Service {#SERVICE}: Replicas below desired'
              opdata: 'Running: {ITEM.LASTVALUE1} of {ITEM.LASTVALUE2}'
              priority: AVERAGE
              description: 'The service has had fewer running replicas than desired for {$SWARM.SERVICE.REPLICAS.TIMEOUT}.'
              dependencies:
                - name: 'Swarm: Service {#SERVICE}: No running replicas'
                  expression: 'max(/Docker Swarm by Zabbix agent 2/swarm.service.replicas.running[{#SERVICE}],{$SWARM.SERVICE.REPLICAS.TIMEOUT:"{#SERVICE}"})=0 and last(/Docker Swarm by Zabbix agent 2/swarm.service.replicas.desired[{#SERVICE}])>0'
              tags:
