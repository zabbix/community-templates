zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 34d15b0c5cc640108770a585ffa37b86
      name: Templates/Virtualization
  templates:
    - uuid: 18b1c8266ef746229bade910a61392ca
      template: XenServer
      name: 'XenServer by script'
      description: 'Agentless monitoring of XenServer and XCP-ng pools. The Zabbix server calls the XAPI endpoint directly. Set {$XENSERVER.URL}, {$XENSERVER.USER} and {$XENSERVER.PASSWORD} on the host. Author: Marshall Wu.'
      groups:
        - name: Templates/Virtualization
      items:
        - uuid: 5e2a9c1d7b3f4a6e8d0c1b2a3f4e5d6c
          name: 'Collect XenServer data'
          type: SCRIPT
          key: xenserver.collect
          delay: 5m
          value_type: TEXT
          timeout: 30s
          parameters:
            - name: url
              value: '{$XENSERVER.URL}'
            - name: user
              value: '{$XENSERVER.USER}'
            - name: password
              value: '{$XENSERVER.PASSWORD}'
          params: |
            var p = JSON.parse(value);
            var endpoint = p.url + '/jsonrpc';
            var scheme = p.url.substring(0, p.url.indexOf('://') + 3);

            function rpc(method, params) {
                var req = new HttpRequest();
                req.addHeader('Content-Type: application/json');
                var resp = req.post(endpoint, JSON.stringify({jsonrpc: '2.0', method: method, params: params, id: 1}));
                if (req.getStatus() !== 200) {
                    throw 'HTTP ' + req.getStatus() + ' from ' + endpoint;
                }
                var result = JSON.parse(resp);
                if (result.error) {
                    throw 'XAPI error: ' + JSON.stringify(result.error);
                }
                var r = result.result;
                if (r && typeof r === 'object' && r.Status === 'Failure') {
                    throw 'XAPI failure: ' + JSON.stringify(r.ErrorDescription || r);
                }
                return r;
            }

            function num(v) {
                if (v === undefined || v === null || v === '') {
                    return undefined;
                }
                var n = Number(v);
                return isNaN(n) ? undefined : n;
            }

            function rrdFetch(base, session, withHost) {
                var req = new HttpRequest();
                var since = Math.floor(Date.now() / 1000) - 600;
                var url = base + '/rrd_updates?session_id=' + encodeURIComponent(session) +
                    '&start=' + since + '&cf=AVERAGE&host=' + (withHost ? 'true' : 'false') + '&json=true';
                var body = req.get(url);
                if (req.getStatus() !== 200) {
                    throw 'HTTP ' + req.getStatus() + ' from ' + base + '/rrd_updates';
                }
                var rrd = JSON.parse(body);
                rrd.col = {};
                for (var li = 0; li < rrd.meta.legend.length; li++) {
                    rrd.col[rrd.meta.legend[li]] = li;
                }
                return rrd;
            }

            function rrdLatest(rrd, name) {
                var c = rrd.col[name];
                if (c === undefined) {
                    throw 'counter ' + name + ' missing from rrd_updates';
                }
                var best = undefined;
                var bestT = -1;
                for (var di = 0; di < rrd.data.length; di++) {
                    var raw = rrd.data[di].values[c];
                    if (raw === null || raw === undefined || raw === '') {
                        continue;
                    }
                    var n = Number(raw);
                    var t = Number(rrd.data[di].t);
                    if (isFinite(n) && t > bestT) {
                        best = n;
                        bestT = t;
                    }
                }
                if (best === undefined) {
                    throw 'no recent sample for ' + name + ' in ' + rrd.data.length + ' rows';
                }
                return best;
            }

            function addRrdError(msg) {
                out.rrd_error = out.rrd_error ? out.rrd_error + '; ' + msg : msg;
            }

            var out = {api_available: 0, error: '', rrd_error: '', pool: {}, hosts: {}, vms: {}, srs: {}, host_lld: [], vm_lld: [], sr_lld: []};
            var session;
            try {
                session = rpc('session.login_with_password', [p.user, p.password, '1.3', 'zabbix']);
            } catch (e) {
                out.error = String(e);
                return JSON.stringify(out);
            }
            out.api_available = 1;

            try {
                var pools = rpc('pool.get_all_records', [session]);
                var hosts = rpc('host.get_all_records', [session]);
                var metrics = rpc('host_metrics.get_all_records', [session]);
                var vms = rpc('VM.get_all_records', [session]);
                var vmMetrics = rpc('VM_metrics.get_all_records', [session]);
                var srs = rpc('SR.get_all_records', [session]);

                var pool = {};
                for (var pref in pools) {
                    pool = pools[pref];
                }

                var hostBase = {};
                var hostsTotal = 0;
                var hostsLive = 0;
                var masterUUID = '';
                for (var href in hosts) {
                    var h = hosts[href];
                    var m = metrics[h.metrics] || {};
                    var live = m.live === undefined ? undefined : m.live === true;
                    hostsTotal++;
                    if (live === true) {
                        hostsLive++;
                    }
                    if (href === pool.master) {
                        masterUUID = h.uuid;
                    }
                    out.hosts[h.uuid] = {
                        name: h.name_label,
                        live: live,
                        cpu_count: num(h.cpu_info ? h.cpu_info.cpu_count : 0),
                        memory_total_bytes: num(m.memory_total),
                        memory_free_bytes: num(m.memory_free)
                    };
                    hostBase[href] = scheme + h.address;
                    out.host_lld.push({uuid: h.uuid, name: h.name_label});
                }

                var vmsTotal = 0;
                var vmsRunning = 0;
                var vmPending = [];
                for (var vref in vms) {
                    var vm = vms[vref];
                    if (vm.is_a_template || vm.is_a_snapshot || vm.is_control_domain) {
                        continue;
                    }
                    vmsTotal++;
                    if (vm.power_state === 'Running') {
                        vmsRunning++;
                    }
                    var vmm = vmMetrics[vm.metrics] || {};
                    var util = vmm.VCPUs_utilisation || {};
                    var utilKeys = Object.keys(util);
                    var utilSum = 0;
                    for (var k = 0; k < utilKeys.length; k++) {
                        utilSum += Number(util[utilKeys[k]]);
                    }
                    var cpuPct = utilKeys.length > 0 ? Math.round(utilSum / utilKeys.length * 10000) / 100 : undefined;
                    if (cpuPct === undefined && vm.power_state !== 'Running') {
                        cpuPct = 0;
                    }
                    if (cpuPct === undefined && vm.power_state === 'Running') {
                        vmPending.push({uuid: vm.uuid, host: vm.resident_on});
                    }
                    out.vms[vm.uuid] = {
                        name: vm.name_label,
                        power_state: vm.power_state,
                        vcpus_max: num(vm.VCPUs_max),
                        memory_max_bytes: num(vm.memory_dynamic_max),
                        memory_actual_bytes: num(vmm.memory_actual),
                        cpu_utilisation_pct: cpuPct
                    };
                    out.vm_lld.push({uuid: vm.uuid, name: vm.name_label});
                }

                // XAPI VCPUs_utilisation is empty for VMs on other pool members; their CPU is only in that member's RRD.
                var pendingByHost = {};
                for (var pi = 0; pi < vmPending.length; pi++) {
                    var pendHost = vmPending[pi].host;
                    pendingByHost[pendHost] = pendingByHost[pendHost] || [];
                    pendingByHost[pendHost].push(vmPending[pi].uuid);
                }
                for (var ph in pendingByHost) {
                    try {
                        if (hostBase[ph] === undefined) {
                            throw 'unknown host ' + ph;
                        }
                        var vrrd = rrdFetch(hostBase[ph], session, false);
                        for (var vi = 0; vi < pendingByHost[ph].length; vi++) {
                            var vmUuid = pendingByHost[ph][vi];
                            var vmKey = 'AVERAGE:vm:' + vmUuid + ':cpu_usage';
                            if (vrrd.col[vmKey] !== undefined) {
                                out.vms[vmUuid].cpu_utilisation_pct = Math.round(rrdLatest(vrrd, vmKey) * 10000) / 100;
                            }
                        }
                    } catch (e) {
                        addRrdError('VM CPU: ' + String(e));
                    }
                }

                for (var sref in srs) {
                    var sr = srs[sref];
                    var size = num(sr.physical_size);
                    var used = num(sr.physical_utilisation);
                    var pct = undefined;
                    if (size !== undefined && used !== undefined) {
                        pct = size > 0 ? Math.round(used / size * 10000) / 100 : 0;
                    }
                    out.srs[sr.uuid] = {
                        name: sr.name_label,
                        size_bytes: size,
                        used_bytes: used,
                        utilisation_pct: pct
                    };
                    out.sr_lld.push({uuid: sr.uuid, name: sr.name_label});
                }

                out.pool = {
                    uuid: pool.uuid,
                    name: pool.name_label,
                    ha_enabled: pool.ha_enabled === true,
                    master_uuid: masterUUID,
                    hosts_total: hostsTotal,
                    hosts_live: hostsLive,
                    vms_total: vmsTotal,
                    vms_running: vmsRunning
                };

                for (var hk in hostBase) {
                    var hrec = hosts[hk];
                    var hout = out.hosts[hrec.uuid];
                    if (hout.live !== true) {
                        continue;
                    }
                    try {
                        var hrrd = rrdFetch(hostBase[hk], session, true);
                        var hprefix = 'AVERAGE:host:' + hrec.uuid + ':';
                        hout.cpu_avg_pct = Math.round(rrdLatest(hrrd, hprefix + 'cpu_avg') * 10000) / 100;
                        hout.net_rx_bytes_s = Math.round(rrdLatest(hrrd, hprefix + 'pif_aggr_rx'));
                        hout.net_tx_bytes_s = Math.round(rrdLatest(hrrd, hprefix + 'pif_aggr_tx'));
                        if (hk === pool.master) {
                            out.host_rrd = {
                                cpu_avg_pct: hout.cpu_avg_pct,
                                net_rx_bytes_s: hout.net_rx_bytes_s,
                                net_tx_bytes_s: hout.net_tx_bytes_s
                            };
                        }
                    } catch (e) {
                        addRrdError(hrec.name_label + ': ' + String(e));
                    }
                }
            } finally {
                rpc('session.logout', [session]);
            }

            return JSON.stringify(out);
          description: 'One XAPI pass returning pool, host, VM and SR data as JSON. Dependent items extract the individual values.'
        - uuid: 97bc6f0b1af249adbff0c4dfd111c778
