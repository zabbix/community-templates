        - uuid: 29bc1249e0094b5a958e792815b3f81a
          name: 'Number of suspended VMs'
          type: DEPENDENT
          key: 'vmware.vm.count[suspended]'
          description: |
            MIB: VMWARE-VMINFO-MIB
            Number of VMs whose vmwVmState is suspended.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$[?(@.state =~ "(?i)^suspended$")].length()'
              error_handler: CUSTOM_VALUE
