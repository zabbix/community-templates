zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 02e4df4f20b848e79267641790f241da
      name: Templates/Virtualization
  templates:
    - uuid: 45f49ed2786642c19bf029992da75831
      template: 'VMware ESXi 8 by SNMP'
      name: 'VMware ESXi 8 by SNMP'
      description: |
        VMware ESXi 8.0 host monitoring over SNMP for Zabbix 7.0.
        Rewritten from scratch against the MIB modules VMware ships for ESXi 8.0
        (VMWARE-ESX-AGENTCAP-MIB vmwESX80x lists what the agent implements).

        MIBs: SNMPv2-MIB, HOST-RESOURCES-MIB, IF-MIB, VMWARE-SYSTEM-MIB,
        VMWARE-RESOURCES-MIB, VMWARE-VMINFO-MIB, VMWARE-ENV-MIB.
        Monitors availability, uptime, ESXi version/build, CPU and memory
        utilization, datastores, host bus adapters, disk devices, physical and
        VMkernel network interfaces, the hostd/vpxa management agents, and the
        power and guest state of every registered virtual machine.

        Enable the agent on the host first, for example:
          esxcli system snmp set --communities <community> --enable true
          esxcli system snmp set --largestorage true
        --largestorage is needed for datastores larger than 2 TB, otherwise
        hrStorageSize saturates at INT_MAX. For SNMPv3 configure the user with
        esxcli system snmp set --authentication/--privacy/--users.
        SNMP version and credentials belong to the host interface.
        The SNMP trap items need snmptrapd + Zabbix SNMP trapper and the host
        configured as a trap target (esxcli system snmp set --targets).

        See README.md for the full list of items, triggers and macros.
      vendor:
        name: Community
        version: 7.0-1
      groups:
        - name: Templates/Virtualization
      items:
        - uuid: 7ea204be485d41ac827cdcdbbcf93511
          name: 'ICMP ping'
          type: SIMPLE
          key: icmpping
          description: |
            The host accessibility by ICMP ping.

            0 - ICMP ping fails;
            1 - ICMP ping successful.
          valuemap:
            name: 'Service state'
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: 8a9797ab66ca4b2493f52207fae454d9
              expression: 'max(/VMware ESXi 8 by SNMP/icmpping,#3)=0'
              name: 'VMware ESXi: Unavailable by ICMP ping'
              priority: HIGH
              description: 'Last three attempts returned timeout. Please check host connectivity.'
              tags:
                - tag: scope
                  value: availability
        - uuid: 36d532a6cbfb49e683b470fe572d9409
          name: 'ICMP loss'
          type: SIMPLE
          key: icmppingloss
          value_type: FLOAT
          units: '%'
          description: 'The percentage of lost packets.'
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: eb94b0b786934b07a81e7c212b5ed190
              expression: 'min(/VMware ESXi 8 by SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/VMware ESXi 8 by SNMP/icmppingloss,5m)<100'
              name: 'VMware ESXi: High ICMP ping loss'
              opdata: 'Loss: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'ICMP packets loss detected.'
              dependencies:
                - name: 'VMware ESXi: Unavailable by ICMP ping'
                  expression: 'max(/VMware ESXi 8 by SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: 14cf74d69d8449439faf97f2cc210c5d
          name: 'ICMP response time'
          type: SIMPLE
          key: icmppingsec
          value_type: FLOAT
          units: s
          description: 'The ICMP ping response time (in seconds).'
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: c1384759d300476f9be59b5737aa98c1
              expression: 'avg(/VMware ESXi 8 by SNMP/icmppingsec,5m)>{$ICMP_RESPONSE_TIME_WARN}'
              name: 'VMware ESXi: High ICMP ping response time'
              opdata: 'Value: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'Average ICMP response time is too high.'
              dependencies:
                - name: 'VMware ESXi: High ICMP ping loss'
                  expression: 'min(/VMware ESXi 8 by SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/VMware ESXi 8 by SNMP/icmppingloss,5m)<100'
                - name: 'VMware ESXi: Unavailable by ICMP ping'
                  expression: 'max(/VMware ESXi 8 by SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: 8e7639f2ed1a4b599eb7439de600734a
          name: 'SNMP agent availability'
          type: INTERNAL
          key: 'zabbix[host,snmp,available]'
          description: |
            Availability of SNMP checks on the host. The value of this item corresponds to availability icons in the host list.
            Possible values:
            0 - not available
            1 - available
            2 - unknown
          valuemap:
            name: zabbix.host.available
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: c1f9ff9038b447b6a78dbec2103d4baa
              expression: 'max(/VMware ESXi 8 by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              name: 'VMware ESXi: No SNMP data collection'
              opdata: 'Current state: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: |
                SNMP is not available for polling. Check that the agent is enabled
                (esxcli system snmp get), that UDP 161 is allowed by the ESXi firewall
                (esxcli network firewall ruleset list -r snmp) and the credentials match.
              dependencies:
                - name: 'VMware ESXi: Unavailable by ICMP ping'
                  expression: 'max(/VMware ESXi 8 by SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
        - uuid: 50ec50a4b0e545c58bf74e1bcda13609
          name: 'SNMP traps (fallback)'
          type: SNMP_TRAP
          key: snmptrap.fallback
          value_type: LOG
          description: 'The item is used to collect all SNMP traps unmatched by other snmptrap items.'
          logtimefmt: 'hh:mm:sszyyyy/MM/dd'
          tags:
            - tag: component
              value: network
        - uuid: 617e7db66e8e4ff0a96209b5830916b2
          name: 'IPMI SEL event raised (trap)'
          type: SNMP_TRAP
          key: 'snmptrap["(vmwEnvIpmiSel(Full|MemoryRaised|PowerSupplyRaised|FanRaised|CpuRaised)|[.]1[.]3[.]6[.]1[.]4[.]1[.]6876[.]4[.]1[.]0[.](390|400|410|420|430))([^0-9A-Za-z]|$)"]'
          value_type: LOG
          description: |
            MIB: VMWARE-ENV-MIB
            Collects the IPMI System Event Log notifications that report a problem:
            vmwEnvIpmiSelFull (.390), vmwEnvIpmiSelMemoryRaised (.400),
            vmwEnvIpmiSelPowerSupplyRaised (.410), vmwEnvIpmiSelFanRaised (.420),
            vmwEnvIpmiSelCpuRaised (.430), under 1.3.6.1.4.1.6876.4.1.0.
            Matches the notification by name (MIBs loaded in snmptrapd) or by numeric OID.
          logtimefmt: 'hh:mm:sszyyyy/MM/dd'
          tags:
            - tag: component
              value: hardware
          triggers:
            - uuid: d92eaae4e92d4227b9946cee5d69a425
              expression: 'nodata(/VMware ESXi 8 by SNMP/snmptrap["(vmwEnvIpmiSel(Full|MemoryRaised|PowerSupplyRaised|FanRaised|CpuRaised)|[.]1[.]3[.]6[.]1[.]4[.]1[.]6876[.]4[.]1[.]0[.](390|400|410|420|430))([^0-9A-Za-z]|$)"],{$ESXI.TRAP.EVENT.HOLD})=0'
              name: 'VMware ESXi: IPMI hardware event raised'
              opdata: '{ITEM.LASTVALUE1}'
              priority: WARNING
              description: |
                The host sent an IPMI SEL notification for memory, power supply, fan or CPU,
                or reported that the SEL is full. Check the event with
                localcli hardware ipmi sel list
                The problem closes by itself {$ESXI.TRAP.EVENT.HOLD} after the last such trap,
                or can be closed manually.
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
        - uuid: 44c7fd4b32c6491c857b9bf51200efbb
          name: 'IPMI SEL event cleared (trap)'
          type: SNMP_TRAP
          key: 'snmptrap["(vmwEnvIpmiSel(MemoryCleared|PowerSupplyCleared|FanCleared|CpuCleared)|[.]1[.]3[.]6[.]1[.]4[.]1[.]6876[.]4[.]1[.]0[.](401|411|421|431))([^0-9A-Za-z]|$)"]'
          value_type: LOG
          description: |
            MIB: VMWARE-ENV-MIB
            Collects vmwEnvIpmiSel*Cleared notifications (.401, .411, .421, .431): a previously
            asserted IPMI sensor has been deasserted. Kept for history; no trigger.
          logtimefmt: 'hh:mm:sszyyyy/MM/dd'
          tags:
            - tag: component
              value: hardware
        - uuid: 7a0f1b2df95241c5867873542b78d91d
          name: 'VM power state change (trap)'
          type: SNMP_TRAP
          key: 'snmptrap["(vmwVmPoweredOn|vmwVmPoweredOff|vmwVmSuspended|[.]1[.]3[.]6[.]1[.]4[.]1[.]6876[.]4[.]1[.]0[.](1|2|5))([^0-9A-Za-z]|$)"]'
          value_type: LOG
          description: |
            MIB: VMWARE-VMINFO-MIB
            vmwVmPoweredOn (.1), vmwVmPoweredOff (.2), vmwVmSuspended (.5). Kept for history;
            the VM discovery rule raises the alerts from polled state.
          logtimefmt: 'hh:mm:sszyyyy/MM/dd'
          tags:
            - tag: component
              value: vm
        - uuid: 2a578440748744ba938046f54a4c304d
          name: 'VM heartbeat lost (trap)'
          type: SNMP_TRAP
          key: 'snmptrap["(vmwVmHBLost|[.]1[.]3[.]6[.]1[.]4[.]1[.]6876[.]4[.]1[.]0[.]3)([^0-9A-Za-z]|$)"]'
          value_type: LOG
          description: |
            MIB: VMWARE-VMINFO-MIB
            vmwVmHBLost (.3): a virtual machine stopped sending VMware Tools heartbeats.
          logtimefmt: 'hh:mm:sszyyyy/MM/dd'
          tags:
            - tag: component
              value: vm
          triggers:
            - uuid: 83a879d57131481f9b80afdb6816c641
              expression: 'nodata(/VMware ESXi 8 by SNMP/snmptrap["(vmwVmHBLost|[.]1[.]3[.]6[.]1[.]4[.]1[.]6876[.]4[.]1[.]0[.]3)([^0-9A-Za-z]|$)"],{$ESXI.TRAP.EVENT.HOLD})=0'
              name: 'VMware ESXi: Virtual machine guest heartbeat lost'
              opdata: '{ITEM.LASTVALUE1}'
              priority: WARNING
              description: |
                A VM stopped sending VMware Tools heartbeats - the guest OS may be hung.
                The trap text carries vmwVmDisplayName. Closes by itself {$ESXI.TRAP.EVENT.HOLD}
                after the last such trap, or manually.
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
        - uuid: 8403a08ee22a44bc9a58dbd179c34f2f
          name: 'System contact details'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.4.0]'
          key: 'system.contact[sysContact.0]'
          delay: 15m
          value_type: CHAR
          description: |
            MIB: SNMPv2-MIB
            Set on ESXi with: esxcli system snmp set --syscontact "<text>"
          inventory_link: CONTACT
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: component
              value: system
        - uuid: ad9477856276438282bb2d3bebfc385c
          name: 'System description'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.1.0]'
          key: 'system.descr[sysDescr.0]'
          delay: 15m
          value_type: CHAR
          description: |
            MIB: SNMPv2-MIB
            On ESXi: "VMware ESXi <version> build-<build> VMware, Inc. x86_64".
          inventory_link: OS
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: component
              value: system
        - uuid: 107832b90b8941ca937647137f4fc26a
          name: 'System location'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.6.0]'
          key: 'system.location[sysLocation.0]'
          delay: 15m
          value_type: CHAR
          description: |
            MIB: SNMPv2-MIB
            Set on ESXi with: esxcli system snmp set --syslocation "<text>"
          inventory_link: LOCATION
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: component
              value: system
        - uuid: aaa32df9282e467c85ad159bdf9fdde6
          name: 'System name'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.5.0]'
          key: system.name
          delay: 15m
          value_type: CHAR
          description: |
            MIB: SNMPv2-MIB
            The host name of the ESXi host.
          inventory_link: NAME
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: 3b8619059d07422e9715d5e49fff8639
              expression: 'last(/VMware ESXi 8 by SNMP/system.name,#1)<>last(/VMware ESXi 8 by SNMP/system.name,#2) and length(last(/VMware ESXi 8 by SNMP/system.name))>0'
              name: 'VMware ESXi: System name has changed'
              event_name: 'VMware ESXi: System name has changed (new name: {ITEM.VALUE})'
              priority: INFO
              description: 'The name of the system has changed. Acknowledge to close the problem manually.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
                - tag: scope
                  value: security
        - uuid: 9995a9babdde4b5db550263ef34076d8
          name: 'System object ID'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.2.0]'
          key: 'system.objectid[sysObjectID.0]'
          delay: 15m
          value_type: CHAR
          description: |
            MIB: SNMPv2-MIB
            ESXi reports vmwESX, 1.3.6.1.4.1.6876.4.1 (VMWARE-PRODUCTS-MIB).
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: component
              value: system
        - uuid: 472fbdf11a8849108c7643db6035b64b
          name: 'Uptime (network)'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.3.0]'
          key: 'system.net.uptime[sysUpTime.0]'
          delay: 1m
          trends: '0'
          units: uptime
          description: |
            MIB: SNMPv2-MIB
            Time since the SNMP agent (snmpd) was last started. Restarting the agent, or
            changing its configuration with esxcli system snmp set, resets it while the host keeps
            running - use "Uptime (hardware)" for reboots.
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: system
        - uuid: 1f22e3653aa849a2a8f2b162c7a05f46
          name: 'Uptime (hardware)'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.25.1.1.0]'
          key: 'system.hw.uptime[hrSystemUptime.0]'
          delay: 1m
          trends: '0'
          units: uptime
          description: |
            MIB: HOST-RESOURCES-MIB
            The amount of time since the host was last initialized (booted).

            TimeTicks is an unsigned 32-bit count of hundredths of a second, so the value wraps
            to zero after 497 days with no reboot involved. The restart trigger guards against
            that with {$UPTIME.WRAP.THRESHOLD}.
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: dbf89bd0197a47bdb98604d7146b8430
              expression: 'last(/VMware ESXi 8 by SNMP/system.hw.uptime[hrSystemUptime.0])<10m and max(/VMware ESXi 8 by SNMP/system.hw.uptime[hrSystemUptime.0],15m)<{$UPTIME.WRAP.THRESHOLD}'
              name: 'VMware ESXi: Host has been restarted'
              event_name: 'VMware ESXi: {HOST.NAME} has been restarted (uptime < 10m)'
              priority: WARNING
              description: |
                Uptime is less than 10 minutes.
                The max() guard suppresses the false alert produced when the 32-bit TimeTicks
                counter wraps after 497 days.
              manual_close: 'YES'
              dependencies:
                - name: 'VMware ESXi: No SNMP data collection'
                  expression: 'max(/VMware ESXi 8 by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              tags:
                - tag: scope
                  value: notice
        - uuid: a5b6373d1e694373b1cfbde64a0a96ba
          name: 'ESXi Shell sessions'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.25.1.5.0]'
          key: 'system.users.num[hrSystemNumUsers.0]'
          delay: 5m
          description: |
            MIB: HOST-RESOURCES-MIB
            hrSystemNumUsers. On ESXi it reports the number of active ESXi Shell sessions
            (VMWARE-ESX-AGENTCAP-MIB).
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: 6e01059569254256aeba990575e6ec9f
              expression: 'last(/VMware ESXi 8 by SNMP/system.users.num[hrSystemNumUsers.0])>{$ESXI.SHELL.SESSIONS.MAX}'
              name: 'VMware ESXi: Active ESXi Shell sessions'
              opdata: 'Sessions: {ITEM.LASTVALUE1}'
              priority: INFO
              description: 'Someone is logged in to the ESXi Shell. Raise {$ESXI.SHELL.SESSIONS.MAX} if shell access is expected.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: security
        - uuid: 23478112589b4ec5bff4ec5a14b1d5f3
          name: 'Number of processes'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.25.1.6.0]'
          key: 'proc.num[hrSystemProcesses.0]'
          delay: 5m
          description: |
            MIB: HOST-RESOURCES-MIB
            The number of process contexts currently loaded or running on the host.
          tags:
            - tag: component
              value: system
        - uuid: 0e815e50f99b438587b2c25fd974f072
          name: 'Product name'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.6876.1.1.0]'
          key: 'vmware.product.name[vmwProdName.0]'
          delay: 1h
          value_type: CHAR
          description: |
            MIB: VMWARE-SYSTEM-MIB
            vmwProdName. VIM property AboutInfo.name.
          inventory_link: SOFTWARE
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: system
        - uuid: 385ecddf30a544f8aa467ed93c011514
          name: 'Product version'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.6876.1.2.0]'
          key: 'vmware.product.version[vmwProdVersion.0]'
          delay: 1h
          value_type: CHAR
          description: |
            MIB: VMWARE-SYSTEM-MIB
            vmwProdVersion, format Major.Minor.Update. VIM property AboutInfo.version.
          inventory_link: OS_SHORT
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: system
        - uuid: 8025cf8f5ff04d1ca6719790022e1dd4
          name: 'Product build'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.6876.1.4.0]'
          key: 'vmware.product.build[vmwProdBuild.0]'
          delay: 1h
          value_type: CHAR
          description: |
            MIB: VMWARE-SYSTEM-MIB
            vmwProdBuild, the most specific build identifier. VIM property AboutInfo.build.
          inventory_link: SOFTWARE_APP_A
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: 22ebda0b967648f89d97fb195edd34b1
              expression: 'last(/VMware ESXi 8 by SNMP/vmware.product.build[vmwProdBuild.0],#1)<>last(/VMware ESXi 8 by SNMP/vmware.product.build[vmwProdBuild.0],#2) and length(last(/VMware ESXi 8 by SNMP/vmware.product.build[vmwProdBuild.0]))>0'
              name: 'VMware ESXi: ESXi build has changed'
              event_name: 'VMware ESXi: ESXi build has changed (new build: {ITEM.VALUE})'
              priority: INFO
              description: 'The host has been patched or upgraded. Acknowledge to close the problem manually.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
        - uuid: c48429fe52294366b709e88f6801aede
          name: 'Product update level'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.6876.1.5.0]'
          key: 'vmware.product.update[vmwProdUpdate.0]'
          delay: 1h
          value_type: CHAR
          description: |
            MIB: VMWARE-SYSTEM-MIB
            vmwProdUpdate. Advanced option Misc.HostAgentUpdateLevel.
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: system
        - uuid: d27bde1edf5e4db4973a5d69014140fa
          name: 'Product patch level'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.6876.1.6.0]'
          key: 'vmware.product.patch[vmwProdPatch.0]'
          delay: 1h
          value_type: CHAR
          description: |
            MIB: VMWARE-SYSTEM-MIB
            vmwProdPatch. Same as the patch field of: esxcli system version get
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: system
        - uuid: 87dccfe193f848e2b569b5337762d9bc
          name: 'Number of physical CPUs'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.6876.3.1.1.0]'
          key: 'vmware.cpu.num[vmwNumCPUs.0]'
          delay: 1h
          description: |
            MIB: VMWARE-RESOURCES-MIB
            vmwNumCPUs, number of physical CPUs on the system.
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: cpu
        - uuid: 78a342ee036b4dcb9afe1cc95d95498f
          name: 'hrProcessorLoad walk'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.2.1.25.3.3.1.2]'
          key: 'system.cpu.walk[hrProcessorLoad]'
          history: '0'
          value_type: TEXT
          trends: '0'
          description: |
            MIB: HOST-RESOURCES-MIB
            Master item: walks hrProcessorLoad, one row per logical CPU, and converts it to JSON.
          preprocessing:
            - type: SNMP_WALK_TO_JSON
              parameters:
                - load
                - 1.3.6.1.2.1.25.3.3.1.2
                - '0'
          tags:
            - tag: component
              value: raw
        - uuid: ece153a9f0b844fb84dc43ad34bde0fb
          name: 'CPU utilization'
          type: DEPENDENT
          key: system.cpu.util
          value_type: FLOAT
          units: '%'
          description: |
            MIB: HOST-RESOURCES-MIB
            Average of hrProcessorLoad over all logical CPUs. Each hrProcessorLoad value is the
            average percentage of time that CPU was not idle over the last minute.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$..load.avg()'
          master_item:
            key: 'system.cpu.walk[hrProcessorLoad]'
          tags:
            - tag: component
              value: cpu
          triggers:
            - uuid: acd23931346c44da82213311a0d3fd4a
              expression: 'min(/VMware ESXi 8 by SNMP/system.cpu.util,5m)>{$CPU.UTIL.CRIT}'
              name: 'VMware ESXi: High CPU utilization'
              event_name: 'VMware ESXi: High CPU utilization (over {$CPU.UTIL.CRIT}% for 5m)'
              opdata: 'Current utilization: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'The CPU utilization of the host is too high. Virtual machines may see CPU ready time.'
              dependencies:
                - name: 'VMware ESXi: No SNMP data collection'
                  expression: 'max(/VMware ESXi 8 by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              tags:
                - tag: scope
                  value: performance
        - uuid: db31448406f24a8b8629b7d62753f30c
          name: 'Number of logical CPUs'
          type: DEPENDENT
          key: system.cpu.num
          description: |
            MIB: HOST-RESOURCES-MIB
            Number of rows in hrProcessorTable, one per logical CPU (thread).
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.length()'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: 'system.cpu.walk[hrProcessorLoad]'
          tags:
            - tag: component
              value: cpu
        - uuid: 9ad926a19fd74b50aa3458cb02c0aabd
          name: 'Total memory (VMware)'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.6876.3.2.1.0]'
          key: 'vmware.memory.size[vmwMemSize.0]'
          delay: 1h
          units: B
          description: |
            MIB: VMWARE-RESOURCES-MIB
            vmwMemSize, physical memory present on the machine as provided by the hypervisor
            (reported in kilobytes, converted to bytes).
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '1024'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: memory
        - uuid: c933ed8fade5491da624691fba72c7d9
          name: 'Memory available for VMs (VMware)'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.6876.3.2.3.0]'
          key: 'vmware.memory.avail[vmwMemAvail.0]'
          delay: 1h
          units: B
          description: |
            MIB: VMWARE-RESOURCES-MIB
            vmwMemAvail, memory available to run virtual machines and for hypervisor needs
            (vmwMemSize - vmwMemCOS). A configuration figure, not free memory - free memory is in
            the "Memory discovery" rule.
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '1024'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: memory
        - uuid: 233189342ad64be5ade074b290914c86
          name: 'Number of host bus adapters'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.6876.3.5.1.0]'
          key: 'vmware.hba.num[vmwHostBusAdapterNumber.0]'
          delay: 15m
          description: |
            MIB: VMWARE-RESOURCES-MIB
            vmwHostBusAdapterNumber, number of entries in vmwHostBusAdapterTable.
          tags:
            - tag: component
              value: storage
          triggers:
            - uuid: f790936244ca445999f89f2579deedb4
              expression: 'last(/VMware ESXi 8 by SNMP/vmware.hba.num[vmwHostBusAdapterNumber.0])<last(/VMware ESXi 8 by SNMP/vmware.hba.num[vmwHostBusAdapterNumber.0],#2)'
              name: 'VMware ESXi: Number of host bus adapters has decreased'
              opdata: 'Current: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'An HBA disappeared from the inventory - failed card, driver problem or hardware change. Acknowledge to close manually.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
        - uuid: b6d4f880261e4af583cf65997c090a90
          name: 'Hardware status source'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.6876.4.20.100.0]'
          key: 'vmware.env.source[vmwEnvSource.0]'
          delay: 1h
          trends: '0'
          description: |
            MIB: VMWARE-ENV-MIB
            vmwEnvSource: which source the agent uses for hardware state. ESXi 8 reports ipmi(4),
            meaning snmpd reads the IPMI System Event Log directly.
          valuemap:
            name: 'VMWARE-ENV-MIB::vmwEnvSource'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: hardware
        - uuid: 7c9d42216e0b4a9ca2490a0cd6f45e5f
          name: 'IPMI SEL entries'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.6876.4.20.1.0]'
          key: 'vmware.env.sel.num[vmwEnvNumber.0]'
          delay: 15m
          description: |
            MIB: VMWARE-ENV-MIB
            vmwEnvNumber, count of rows in vmwEnvTable (entries of the IPMI System Event Log).
          tags:
            - tag: component
              value: hardware
          triggers:
            - uuid: 62fd37c81a144123b98b4c962ce1e558
              expression: 'last(/VMware ESXi 8 by SNMP/vmware.env.sel.num[vmwEnvNumber.0])>last(/VMware ESXi 8 by SNMP/vmware.env.sel.num[vmwEnvNumber.0],#2)'
              name: 'VMware ESXi: New IPMI SEL entries'
              opdata: 'Entries: {ITEM.LASTVALUE1}'
              priority: INFO
              description: |
                The BMC wrote new entries in the IPMI System Event Log. Review them with
                localcli hardware ipmi sel list
                Works without SNMP traps. Acknowledge to close manually.
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
        - uuid: 9397ad3a6b844319ac9696c554ab8791
          name: 'IPMI SEL capacity'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.6876.4.20.30.0]'
          key: 'vmware.env.sel.capacity[vmwSELCapacity.0]'
          delay: 15m
          units: '%'
          description: |
            MIB: VMWARE-ENV-MIB
            vmwSELCapacity (0..100). The MIB is ambiguous: the object is described as "free space
            left", while the vmwEnvIpmiSelFull notification is sent when it "reaches 100% capacity".
            Compare the value with "localcli hardware ipmi sel get" on your hardware before
            enabling the trigger, which assumes percent used.
          tags:
            - tag: component
              value: hardware
          triggers:
            - uuid: 70c8673d33b94ad1adb4a91b6e557745
              expression: 'last(/VMware ESXi 8 by SNMP/vmware.env.sel.capacity[vmwSELCapacity.0])>={$ESXI.SEL.CAPACITY.MAX}'
              name: 'VMware ESXi: IPMI System Event Log is almost full'
              opdata: 'Capacity: {ITEM.LASTVALUE1}'
              priority: WARNING
              status: DISABLED
              description: |
                DISABLED by default - see the item description: the meaning of vmwSELCapacity
                (used or free) must be checked on your hardware first.
                When the SEL is full new hardware events are dropped. Clear it with
                localcli hardware ipmi sel clear
              tags:
                - tag: scope
                  value: capacity
        - uuid: 0be443f03d494580a35cc352b62e0213
          name: 'hrSWRunName walk'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.2.1.25.4.2.1.2]'
