                - '0'
                - guestos
                - 1.3.6.1.4.1.6876.2.1.1.4
                - '0'
                - memory
                - 1.3.6.1.4.1.6876.2.1.1.5
                - '0'
                - state
                - 1.3.6.1.4.1.6876.2.1.1.6
                - '0'
                - gueststate
                - 1.3.6.1.4.1.6876.2.1.1.8
                - '0'
                - cpus
                - 1.3.6.1.4.1.6876.2.1.1.9
                - '0'
                - uuid
                - 1.3.6.1.4.1.6876.2.1.1.10
                - '0'
          tags:
            - tag: component
              value: raw
        - uuid: 00bb752c84614fcb96d4d310a1350aa4
          name: 'Number of registered VMs'
          type: DEPENDENT
          key: vmware.vm.count
          description: |
            MIB: VMWARE-VMINFO-MIB
            Number of virtual machines registered on the host (rows in vmwVmTable).
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.length()'
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
          master_item:
