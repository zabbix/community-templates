          master_item:
            key: 'vmware.vm.walk[vmwVmTable]'
          tags:
            - tag: component
              value: vm
      discovery_rules:
        - uuid: ab21ef397f1f452e982cd97ac71c993e
          name: 'Memory discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#MEMNAME},1.3.6.1.2.1.25.2.3.1.3,{#MEMTYPE},1.3.6.1.2.1.25.2.3.1.2,{#ALLOC_UNITS},1.3.6.1.2.1.25.2.3.1.4]'
          key: vm.memory.discovery
          delay: 1h
          filter:
            evaltype: AND
            conditions:
              - macro: '{#MEMTYPE}'
                value: '{$MEMORY.TYPE.MATCHES}'
                formulaid: A
          description: |
            MIB: HOST-RESOURCES-MIB, hrStorageTable
            Discovers the physical memory row (hrStorageType = hrStorageRam, "Real Memory" on ESXi).
          item_prototypes:
            - uuid: 0b56c9d2f32b485695eeee7c33d548c8
              name: '{#MEMNAME}: Total memory'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.25.2.3.1.5.{#SNMPINDEX}]'
              key: 'vm.memory.total[hrStorageSize.{#SNMPINDEX}]'
              delay: 15m
              units: B
              description: |
                MIB: HOST-RESOURCES-MIB
                hrStorageSize multiplied by hrStorageAllocationUnits.
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '{#ALLOC_UNITS}'
              tags:
                - tag: component
                  value: memory
            - uuid: 0882ea1b2b6840d9b3bec2e7a298a989
              name: '{#MEMNAME}: Used memory'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.25.2.3.1.6.{#SNMPINDEX}]'
              key: 'vm.memory.used[hrStorageUsed.{#SNMPINDEX}]'
              units: B
              description: |
                MIB: HOST-RESOURCES-MIB
                hrStorageUsed multiplied by hrStorageAllocationUnits. Memory consumed by the
                VMkernel and virtual machines.
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '{#ALLOC_UNITS}'
              tags:
                - tag: component
                  value: memory
            - uuid: 9d706f0682f74e5ba0ed2506e30a569f
              name: '{#MEMNAME}: Memory utilization'
              type: CALCULATED
              key: 'vm.memory.util[memoryUsedPercentage.{#SNMPINDEX}]'
              value_type: FLOAT
              units: '%'
              params: 'last(//vm.memory.used[hrStorageUsed.{#SNMPINDEX}])/last(//vm.memory.total[hrStorageSize.{#SNMPINDEX}])*100'
              description: 'Memory utilization in %.'
              tags:
                - tag: component
                  value: memory
              trigger_prototypes:
                - uuid: ebad1b4c1ef343f98c4b81878722b985
                  expression: 'min(/VMware ESXi 8 by SNMP/vm.memory.util[memoryUsedPercentage.{#SNMPINDEX}],5m)>{$MEMORY.UTIL.MAX}'
                  name: 'VMware ESXi: High memory utilization'
                  event_name: 'VMware ESXi: High memory utilization (>{$MEMORY.UTIL.MAX}% for 5m)'
                  opdata: 'Current utilization: {ITEM.LASTVALUE1}'
                  priority: AVERAGE
                  description: 'The host is running out of free memory. Expect ballooning, compression and swapping on VMs.'
                  tags:
                    - tag: scope
                      value: capacity
                    - tag: scope
                      value: performance
          graph_prototypes:
            - uuid: 44c1facfd1714e64a55bda48c58e85f3
              name: 'VMware ESXi: {#MEMNAME}: Memory usage'
              ymin_type_1: FIXED
              graph_items:
                - drawtype: BOLD_LINE
                  color: 1A7C11
                  item:
                    host: 'VMware ESXi 8 by SNMP'
                    key: 'vm.memory.total[hrStorageSize.{#SNMPINDEX}]'
                - sortorder: '1'
                  drawtype: GRADIENT_LINE
                  color: 2774A4
                  item:
                    host: 'VMware ESXi 8 by SNMP'
                    key: 'vm.memory.used[hrStorageUsed.{#SNMPINDEX}]'
        - uuid: e5ca7cabcc8f4f2d97bf6ba848ae8ece
          name: 'Datastore discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#FSNAME},1.3.6.1.2.1.25.2.3.1.3,{#FSTYPE},1.3.6.1.2.1.25.2.3.1.2,{#ALLOC_UNITS},1.3.6.1.2.1.25.2.3.1.4]'
          key: vfs.fs.discovery
          delay: 1h
          filter:
            evaltype: AND
            conditions:
              - macro: '{#FSTYPE}'
                value: '{$VFS.FS.FSTYPE.MATCHES}'
                formulaid: A
              - macro: '{#FSNAME}'
                value: '{$VFS.FS.FSNAME.MATCHES}'
                formulaid: B
              - macro: '{#FSNAME}'
                value: '{$VFS.FS.FSNAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: C
              - macro: '{#FSUUID}'
                value: '{$VFS.FS.FSUUID.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: D
          description: |
            MIB: HOST-RESOURCES-MIB, hrStorageTable
            Discovers datastores (hrStorageType = hrStorageFixedDisk). ESXi does not report
            visorfs ramdisks here.

            Intended for host-local storage only. A SAN datastore is mounted by every host of the
            cluster and reported by each of them with the same UUID, so it would be polled N times
            and raise N identical problems. Shared datastores are monitored by a separate template:
            exclude them here with {$VFS.FS.FSUUID.NOT_MATCHES}, set on the cluster host group.
            SNMP cannot detect them automatically: hrPartitionFSIndex returns a per-device counter
            instead of the hrFSTable index, so a datastore cannot be linked to its LUN.

            ESXi SNMP has no friendly datastore name: hrStorageDescr and hrFSMountPoint both
            return /vmfs/volumes/<uuid>, and hrFSRemoteMountPoint is empty for VMFS.
            A JavaScript step strips the prefix into {#FSUUID}, which is used in names, tags and
            macro contexts. Map UUIDs to datastore names with: esxcli storage filesystem list

            hrStorageSize is an Integer32: without "esxcli system snmp set --largestorage true"
            a datastore larger than 2 TB is reported as INT_MAX allocation units and the
            percentages below are wrong.
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  var rows = Array.isArray(data) ? data : data.data;
                  if (!Array.isArray(rows)) {
                      throw 'Expected an SNMP discovery array';
                  }
                  for (var i = 0; i < rows.length; i++) {
                      var name = String(rows[i]['{#FSNAME}'] || '');
                      rows[i]['{#FSUUID}'] = name.replace(/^\/vmfs\/volumes\//, '') || ('index ' + rows[i]['{#SNMPINDEX}']);
                  }
                  return JSON.stringify(rows);
          item_prototypes:
            - uuid: d4a1054820294135be50a7f02740188c
              name: 'Datastore [{#FSUUID}]: Space utilization'
              type: CALCULATED
              key: 'vfs.fs.pused[storageUsedPercentage.{#SNMPINDEX}]'
              value_type: FLOAT
              units: '%'
              params: 'last(//vfs.fs.used[hrStorageUsed.{#SNMPINDEX}])/last(//vfs.fs.total[hrStorageSize.{#SNMPINDEX}])*100'
              description: 'Space utilization in % for datastore {#FSUUID} ({#FSNAME}).'
              tags:
                - tag: component
                  value: storage
                - tag: datastore
                  value: '{#FSUUID}'
              trigger_prototypes:
                - uuid: c0b62dcada9a4e9cb3f9b9d32cb48e11
                  expression: 'last(/VMware ESXi 8 by SNMP/vfs.fs.pused[storageUsedPercentage.{#SNMPINDEX}])>{$VFS.FS.PUSED.MAX.CRIT:"{#FSUUID}"}'
                  name: 'VMware ESXi: Datastore [{#FSUUID}]: Space is critically low'
                  event_name: 'VMware ESXi: Datastore [{#FSUUID}]: Space is critically low (used > {$VFS.FS.PUSED.MAX.CRIT:"{#FSUUID}"}%)'
                  opdata: 'Space used: {ITEM.LASTVALUE1}'
                  priority: AVERAGE
                  description: |
                    Thin-provisioned disks and snapshots keep growing; a full VMFS datastore
                    suspends the VMs that need to write to it.
                  manual_close: 'YES'
                  tags:
                    - tag: datastore
                      value: '{#FSUUID}'
                    - tag: scope
                      value: capacity
                - uuid: 4f25adfd65804754a2d094392d4010ce
                  expression: 'last(/VMware ESXi 8 by SNMP/vfs.fs.pused[storageUsedPercentage.{#SNMPINDEX}])>{$VFS.FS.PUSED.MAX.WARN:"{#FSUUID}"}'
                  name: 'VMware ESXi: Datastore [{#FSUUID}]: Space is low'
                  event_name: 'VMware ESXi: Datastore [{#FSUUID}]: Space is low (used > {$VFS.FS.PUSED.MAX.WARN:"{#FSUUID}"}%)'
                  opdata: 'Space used: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: 'Datastore usage is above the warning threshold.'
                  manual_close: 'YES'
                  dependencies:
                    - name: 'VMware ESXi: Datastore [{#FSUUID}]: Space is critically low'
                      expression: 'last(/VMware ESXi 8 by SNMP/vfs.fs.pused[storageUsedPercentage.{#SNMPINDEX}])>{$VFS.FS.PUSED.MAX.CRIT:"{#FSUUID}"}'
                  tags:
                    - tag: datastore
                      value: '{#FSUUID}'
                    - tag: scope
                      value: capacity
            - uuid: 99950803f8f04ce0bc0c7ee2a2e9025c
              name: 'Datastore [{#FSUUID}]: Total space'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.25.2.3.1.5.{#SNMPINDEX}]'
              key: 'vfs.fs.total[hrStorageSize.{#SNMPINDEX}]'
              delay: 15m
              units: B
              description: |
                MIB: HOST-RESOURCES-MIB
                hrStorageSize multiplied by hrStorageAllocationUnits.
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '{#ALLOC_UNITS}'
              tags:
                - tag: component
                  value: storage
                - tag: datastore
                  value: '{#FSUUID}'
            - uuid: c8a12777ee8245f9a756de844f96edb3
              name: 'Datastore [{#FSUUID}]: Used space'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.25.2.3.1.6.{#SNMPINDEX}]'
              key: 'vfs.fs.used[hrStorageUsed.{#SNMPINDEX}]'
              delay: 5m
              units: B
              description: |
                MIB: HOST-RESOURCES-MIB
                hrStorageUsed multiplied by hrStorageAllocationUnits.
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '{#ALLOC_UNITS}'
              tags:
                - tag: component
                  value: storage
                - tag: datastore
                  value: '{#FSUUID}'
          graph_prototypes:
            - uuid: 06acae54372a4ec7974657e830dc04d2
              name: 'VMware ESXi: Datastore [{#FSUUID}]: Space usage'
              ymin_type_1: FIXED
              graph_items:
                - drawtype: BOLD_LINE
                  color: 1A7C11
                  item:
                    host: 'VMware ESXi 8 by SNMP'
                    key: 'vfs.fs.total[hrStorageSize.{#SNMPINDEX}]'
                - sortorder: '1'
                  drawtype: GRADIENT_LINE
                  color: 2774A4
                  item:
                    host: 'VMware ESXi 8 by SNMP'
                    key: 'vfs.fs.used[hrStorageUsed.{#SNMPINDEX}]'
        - uuid: f2ff3d18bbe247adae447188b04ef72e
          name: 'Host bus adapter discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#HBA.NAME},1.3.6.1.4.1.6876.3.5.2.1.2,{#HBA.MODEL},1.3.6.1.4.1.6876.3.5.2.1.5,{#HBA.DRIVER},1.3.6.1.4.1.6876.3.5.2.1.6]'
          key: vmware.hba.discovery
          delay: 1h
          filter:
            evaltype: AND
            conditions:
              - macro: '{#HBA.NAME}'
                value: '{$ESXI.HBA.NAME.MATCHES}'
                formulaid: A
              - macro: '{#HBA.NAME}'
                value: '{$ESXI.HBA.NAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
          description: |
            MIB: VMWARE-RESOURCES-MIB, vmwHostBusAdapterTable (1.3.6.1.4.1.6876.3.5.2.1)
            Discovers the storage adapters (vmhbaN) - the same list as esxcfg-scsidevs -a.
          item_prototypes:
            - uuid: 814e0f8b033b4f5490e0c801c66badf7
              name: 'HBA {#HBA.NAME}: Status'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.6876.3.5.2.1.4.{#SNMPINDEX}]'
              key: 'vmware.hba.status[vmwHbaStatus.{#SNMPINDEX}]'
              delay: 3m
              trends: '0'
              description: |
                MIB: VMWARE-RESOURCES-MIB
                vmwHbaStatus, operational status of {#HBA.MODEL} (driver {#HBA.DRIVER}):
                unknown(1), normal(2), marginal(3), critical(4), failed(5).
                Software adapters (iSCSI, NVMe over TCP...) often report unknown(1).
              valuemap:
                name: 'VMWARE-TC-MIB::VmwSubsystemStatus'
              tags:
                - tag: component
                  value: storage
                - tag: hba
                  value: '{#HBA.NAME}'
              trigger_prototypes:
                - uuid: ecf0c94e61104fde99c5945958d8370d
                  expression: 'last(/VMware ESXi 8 by SNMP/vmware.hba.status[vmwHbaStatus.{#SNMPINDEX}])>={$ESXI.SUBSYSTEM.CRIT.STATUS}'
                  name: 'VMware ESXi: HBA {#HBA.NAME}: Adapter is in critical state'
                  opdata: 'Current state: {ITEM.LASTVALUE1}'
                  priority: HIGH
                  description: 'Storage adapter {#HBA.NAME} ({#HBA.MODEL}) reports critical(4) or failed(5). Paths through it are probably down.'
                  tags:
                    - tag: scope
                      value: availability
                - uuid: 80db0b110bce49f29e9cbfc46f818d8c
                  expression: 'last(/VMware ESXi 8 by SNMP/vmware.hba.status[vmwHbaStatus.{#SNMPINDEX}])={$ESXI.SUBSYSTEM.WARN.STATUS}'
                  name: 'VMware ESXi: HBA {#HBA.NAME}: Adapter is in warning state'
                  opdata: 'Current state: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: 'Storage adapter {#HBA.NAME} ({#HBA.MODEL}) reports marginal(3).'
                  dependencies:
                    - name: 'VMware ESXi: HBA {#HBA.NAME}: Adapter is in critical state'
                      expression: 'last(/VMware ESXi 8 by SNMP/vmware.hba.status[vmwHbaStatus.{#SNMPINDEX}])>={$ESXI.SUBSYSTEM.CRIT.STATUS}'
                  tags:
                    - tag: scope
                      value: availability
        - uuid: ff4b0d349a574b3683d5046d50fe6f76
          name: 'Disk device discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#DEV.DESCR},1.3.6.1.2.1.25.3.2.1.3,{#DEV.TYPE},1.3.6.1.2.1.25.3.2.1.2]'
          key: system.hw.device.discovery
          delay: 1h
          filter:
            evaltype: AND
            conditions:
              - macro: '{#DEV.TYPE}'
                value: '{$ESXI.HRDEVICE.TYPE.MATCHES}'
                formulaid: A
              - macro: '{#DEV.DESCR}'
                value: '{$ESXI.HRDEVICE.DESCR.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
          description: |
            MIB: HOST-RESOURCES-MIB, hrDeviceTable
            Discovers the devices whose hrDeviceType matches {$ESXI.HRDEVICE.TYPE.MATCHES}, by default
            disk storage (hrDeviceDiskStorage). ESXi reports running/warning/down/unknown for
            disks; CPUs always report unknown, so they are not discovered by default.
          item_prototypes:
            - uuid: 64b3bacaf33242e3b006c7317741c320
              name: 'Device [{#DEV.DESCR}]: Status'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.25.3.2.1.5.{#SNMPINDEX}]'
              key: 'system.hw.device.status[hrDeviceStatus.{#SNMPINDEX}]'
              delay: 3m
              trends: '0'
              description: |
                MIB: HOST-RESOURCES-MIB
                hrDeviceStatus: unknown(1), running(2), warning(3), testing(4), down(5).
              valuemap:
                name: 'HOST-RESOURCES-MIB::hrDeviceStatus'
              tags:
                - tag: component
                  value: storage
                - tag: device
                  value: '{#DEV.DESCR}'
              trigger_prototypes:
                - uuid: 1edfd14d8fd440b696144addbbc0ecf9
                  expression: 'last(/VMware ESXi 8 by SNMP/system.hw.device.status[hrDeviceStatus.{#SNMPINDEX}])={$ESXI.HRDEVICE.CRIT.STATUS}'
                  name: 'VMware ESXi: Device [{#DEV.DESCR}]: Device is down'
                  opdata: 'Current state: {ITEM.LASTVALUE1}'
                  priority: AVERAGE
                  description: 'The device reports down(5). Check the device and its paths: esxcli storage core device list'
                  tags:
                    - tag: scope
                      value: availability
                - uuid: eaa739a6ae2a4d4a82ececeffba365e7
                  expression: 'last(/VMware ESXi 8 by SNMP/system.hw.device.status[hrDeviceStatus.{#SNMPINDEX}])={$ESXI.HRDEVICE.WARN.STATUS}'
                  name: 'VMware ESXi: Device [{#DEV.DESCR}]: Device is in warning state'
                  opdata: 'Current state: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: 'The device reports warning(3), for example a degraded path or a disk reporting errors.'
                  dependencies:
                    - name: 'VMware ESXi: Device [{#DEV.DESCR}]: Device is down'
                      expression: 'last(/VMware ESXi 8 by SNMP/system.hw.device.status[hrDeviceStatus.{#SNMPINDEX}])={$ESXI.HRDEVICE.CRIT.STATUS}'
                  tags:
                    - tag: scope
                      value: availability
        - uuid: a75d070e2e1f44f383bde9b20a45c34f
          name: 'Virtual machine discovery'
          type: DEPENDENT
          key: vmware.vm.discovery
          delay: '0'
          lifetime: 7d
          enabled_lifetime_type: DISABLE_NEVER
          filter:
            evaltype: AND
            conditions:
              - macro: '{#VM.UUID}'
                value: '^.+$'
                formulaid: A
              - macro: '{#VM.NAME}'
                value: '{$ESXI.VM.NAME.MATCHES}'
                formulaid: B
              - macro: '{#VM.NAME}'
                value: '{$ESXI.VM.NAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: C
          description: |
            MIB: VMWARE-VMINFO-MIB, vmwVmTable (1.3.6.1.4.1.6876.2.1.1)
            Discovers the virtual machines registered on the host.

            vmwVmIdx may change when the host reboots, so the items are not keyed by SNMP index:
            each one is a dependent item of "vmwVmTable walk" that picks its row by vmwVmUUID.
            A VM that is unregistered or migrated away stops matching; its items become
            unsupported and are deleted after 7 days.
          item_prototypes:
            - uuid: 889f616c88aa47f7b61eaf85e831714c
              name: 'VM {#VM.NAME}: Power state'
              type: DEPENDENT
              key: 'vmware.vm.power.state["{#VM.UUID}"]'
              delay: '0'
              trends: '0'
              description: |
                MIB: VMWARE-VMINFO-MIB
                vmwVmState converted to a number: 0 powered off, 1 powered on, 2 suspended, 3 unknown.
              valuemap:
                name: 'VMware VM power state'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.uuid == "{#VM.UUID}")].state.first()'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var s = String(value).toLowerCase().replace(/[^a-z]/g, '');
                      if (s === 'poweredon') return 1;
                      if (s === 'poweredoff') return 0;
                      if (s === 'suspended') return 2;
                      return 3;
              master_item:
                key: 'vmware.vm.walk[vmwVmTable]'
              tags:
                - tag: component
                  value: vm
                - tag: vm
                  value: '{#VM.NAME}'
              trigger_prototypes:
                - uuid: 39d99f544e314815b95a5e30b10d60c2
                  expression: '{$ESXI.VM.POWER.CONTROL:"{#VM.NAME}"}=1 and last(/VMware ESXi 8 by SNMP/vmware.vm.power.state["{#VM.UUID}"])<>1 and last(/VMware ESXi 8 by SNMP/vmware.vm.power.state["{#VM.UUID}"],#2)=1'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'last(/VMware ESXi 8 by SNMP/vmware.vm.power.state["{#VM.UUID}"])=1 or {$ESXI.VM.POWER.CONTROL:"{#VM.NAME}"}=0'
                  name: 'VMware ESXi: VM {#VM.NAME}: Virtual machine is not powered on'
                  opdata: 'Current state: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: |
                    The VM left the powered on state (powered off or suspended).
                    Fires on the change only, so VMs that are kept off on purpose never alert. The
                    problem stays open until the VM is powered on again or closed manually.
                    Silence one VM with {$ESXI.VM.POWER.CONTROL:"<vm name>"}=0.
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: availability
            - uuid: 009203bd27fe4736b77a5135bcd720c7
              name: 'VM {#VM.NAME}: Guest state'
              type: DEPENDENT
              key: 'vmware.vm.guest.state["{#VM.UUID}"]'
              delay: '0'
              trends: '0'
              description: |
                MIB: VMWARE-VMINFO-MIB
                vmwVmGuestState converted to a number: 0 notrunning, 1 running, 2 shuttingdown,
                3 resetting, 4 standby, 5 unknown. Needs VMware Tools in the guest.
              valuemap:
                name: 'VMware VM guest state'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.uuid == "{#VM.UUID}")].gueststate.first()'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var s = String(value).toLowerCase().replace(/[^a-z]/g, '');
                      var map = {notrunning: 0, running: 1, shuttingdown: 2, resetting: 3, standby: 4};
                      return map.hasOwnProperty(s) ? map[s] : 5;
              master_item:
                key: 'vmware.vm.walk[vmwVmTable]'
              tags:
                - tag: component
                  value: vm
                - tag: vm
                  value: '{#VM.NAME}'
            - uuid: f3abc80729c64de598be292c7a19b22c
              name: 'VM {#VM.NAME}: Guest OS'
              type: DEPENDENT
              key: 'vmware.vm.guest.os["{#VM.UUID}"]'
              delay: '0'
              value_type: CHAR
              description: |
                MIB: VMWARE-VMINFO-MIB
                vmwVmGuestOS. Values starting with "E:" mean VMware Tools is not running.
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.uuid == "{#VM.UUID}")].guestos.first()'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: 'vmware.vm.walk[vmwVmTable]'
              tags:
                - tag: component
                  value: vm
                - tag: vm
                  value: '{#VM.NAME}'
            - uuid: 014dc92c489b49d9846ede4d5765b510
              name: 'VM {#VM.NAME}: Number of vCPUs'
              type: DEPENDENT
              key: 'vmware.vm.cpu.num["{#VM.UUID}"]'
              delay: '0'
              description: |
                MIB: VMWARE-VMINFO-MIB
                vmwVmCpus, virtual CPUs assigned to the VM.
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.uuid == "{#VM.UUID}")].cpus.first()'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: 'vmware.vm.walk[vmwVmTable]'
              tags:
                - tag: component
                  value: vm
                - tag: vm
                  value: '{#VM.NAME}'
            - uuid: 0b4da9a3ff134a7e8c6e1a174736a0e0
              name: 'VM {#VM.NAME}: Configured memory'
              type: DEPENDENT
              key: 'vmware.vm.memory.size["{#VM.UUID}"]'
              delay: '0'
              units: B
              description: |
                MIB: VMWARE-VMINFO-MIB
                vmwVmMemSize, memory configured for the VM (megabytes, converted to bytes).
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.uuid == "{#VM.UUID}")].memory.first()'
                - type: MULTIPLIER
                  parameters:
                    - '1048576'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: 'vmware.vm.walk[vmwVmTable]'
              tags:
                - tag: component
                  value: vm
                - tag: vm
                  value: '{#VM.NAME}'
          trigger_prototypes:
            - uuid: 02cdff089417458e8de3c25f4362329e
              expression: '{$ESXI.VM.GUEST.CONTROL:"{#VM.NAME}"}=1 and last(/VMware ESXi 8 by SNMP/vmware.vm.power.state["{#VM.UUID}"])=1 and last(/VMware ESXi 8 by SNMP/vmware.vm.guest.state["{#VM.UUID}"])<>1 and last(/VMware ESXi 8 by SNMP/vmware.vm.guest.state["{#VM.UUID}"],#2)=1'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'last(/VMware ESXi 8 by SNMP/vmware.vm.guest.state["{#VM.UUID}"])=1 or last(/VMware ESXi 8 by SNMP/vmware.vm.power.state["{#VM.UUID}"])<>1 or {$ESXI.VM.GUEST.CONTROL:"{#VM.NAME}"}=0'
              name: 'VMware ESXi: VM {#VM.NAME}: Guest OS is not running'
              opdata: 'Guest state: {ITEM.LASTVALUE2}'
              priority: WARNING
              description: |
                The VM is powered on but the guest state left running - the guest OS is shutting
                down, rebooting, hung, or VMware Tools stopped. Fires on the change only, so VMs
                without VMware Tools never alert. Silence one VM with
                {$ESXI.VM.GUEST.CONTROL:"<vm name>"}=0.
              manual_close: 'YES'
              dependencies:
                - name: 'VMware ESXi: VM {#VM.NAME}: Virtual machine is not powered on'
                  expression: '{$ESXI.VM.POWER.CONTROL:"{#VM.NAME}"}=1 and last(/VMware ESXi 8 by SNMP/vmware.vm.power.state["{#VM.UUID}"])<>1 and last(/VMware ESXi 8 by SNMP/vmware.vm.power.state["{#VM.UUID}"],#2)=1'
                  recovery_expression: 'last(/VMware ESXi 8 by SNMP/vmware.vm.power.state["{#VM.UUID}"])=1 or {$ESXI.VM.POWER.CONTROL:"{#VM.NAME}"}=0'
              tags:
                - tag: scope
                  value: availability
          master_item:
            key: 'vmware.vm.walk[vmwVmTable]'
          lld_macro_paths:
            - lld_macro: '{#VM.NAME}'
              path: $.name
            - lld_macro: '{#VM.UUID}'
              path: $.uuid
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var rows = JSON.parse(value);
                  if (!Array.isArray(rows)) {
                      throw 'Expected a JSON array from SNMP_WALK_TO_JSON';
                  }
                  var out = [];
                  for (var i = 0; i < rows.length; i++) {
                      out.push({name: String(rows[i].name || ''), uuid: String(rows[i].uuid || '')});
                  }
                  out.sort(function (a, b) { return a.uuid < b.uuid ? -1 : (a.uuid > b.uuid ? 1 : 0); });
                  return JSON.stringify(out);
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
        - uuid: 24bc03ab560f44caa828c00ff081cd6f
          name: 'Network interfaces discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#IFOPERSTATUS},1.3.6.1.2.1.2.2.1.8,{#IFADMINSTATUS},1.3.6.1.2.1.2.2.1.7,{#IFALIAS},1.3.6.1.2.1.31.1.1.1.18,{#IFNAME},1.3.6.1.2.1.31.1.1.1.1,{#IFDESCR},1.3.6.1.2.1.2.2.1.2,{#IFTYPE},1.3.6.1.2.1.2.2.1.3]'
          key: net.if.discovery
          delay: 1h
          filter:
            evaltype: AND
            conditions:
              - macro: '{#IFADMINSTATUS}'
                value: '{$NET.IF.IFADMINSTATUS.MATCHES}'
                formulaid: A
              - macro: '{#IFADMINSTATUS}'
                value: '{$NET.IF.IFADMINSTATUS.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
              - macro: '{#IFALIAS}'
                value: '{$NET.IF.IFALIAS.MATCHES}'
                formulaid: C
              - macro: '{#IFALIAS}'
                value: '{$NET.IF.IFALIAS.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: D
              - macro: '{#IFDESCR}'
                value: '{$NET.IF.IFDESCR.MATCHES}'
                formulaid: E
              - macro: '{#IFDESCR}'
                value: '{$NET.IF.IFDESCR.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: F
              - macro: '{#IFNAME}'
                value: '{$NET.IF.IFNAME.MATCHES}'
                formulaid: G
              - macro: '{#IFNAME}'
                value: '{$NET.IF.IFNAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: H
              - macro: '{#IFOPERSTATUS}'
                value: '{$NET.IF.IFOPERSTATUS.MATCHES}'
                formulaid: I
              - macro: '{#IFOPERSTATUS}'
                value: '{$NET.IF.IFOPERSTATUS.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: J
              - macro: '{#IFTYPE}'
                value: '{$NET.IF.IFTYPE.MATCHES}'
                formulaid: K
              - macro: '{#IFTYPE}'
                value: '{$NET.IF.IFTYPE.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: L
          description: |
            MIB: IF-MIB
            Discovers the physical NICs (vmnicN, ifType ethernetCsmacd(6)) and the VMkernel
            interfaces (vmkN). ifAdminStatus is read-only on ESXi. ifName falls back to ifDescr,
            then to the SNMP index.
          item_prototypes:
            - uuid: a3187a0ce163467e801b6544acc3251f
              name: 'Interface {#IFNAME}({#IFALIAS}): Inbound packets discarded'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}]'
              key: 'net.if.in.discards[ifInDiscards.{#SNMPINDEX}]'
              delay: 3m
              description: |
                MIB: IF-MIB
                The number of inbound packets which were chosen to be discarded even though no errors had been detected.
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 846a2239b40842f6ac98919d6f41c31e
              name: 'Interface {#IFNAME}({#IFALIAS}): Inbound packets with errors'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}]'
              key: 'net.if.in.errors[ifInErrors.{#SNMPINDEX}]'
              delay: 3m
              description: |
                MIB: IF-MIB
                The number of inbound packets that contained errors preventing them from being deliverable to a higher-layer protocol.
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 0c487666a6034ceab96369855ca85291
              name: 'Interface {#IFNAME}({#IFALIAS}): Bits received'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}]'
              key: 'net.if.in[ifHCInOctets.{#SNMPINDEX}]'
              delay: 3m
              units: bps
              description: |
                MIB: IF-MIB
                ifHCInOctets, 64-bit count of octets received (needs SNMPv2c or SNMPv3).
              preprocessing:
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 45d665dbd75e4a939f1422820c2419b9
              name: 'Interface {#IFNAME}({#IFALIAS}): Outbound packets discarded'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.2.2.1.19.{#SNMPINDEX}]'
              key: 'net.if.out.discards[ifOutDiscards.{#SNMPINDEX}]'
              delay: 3m
              description: |
                MIB: IF-MIB
                The number of outbound packets which were chosen to be discarded even though no errors had been detected.
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: d8a061a6e5854248907a03b0c4047fa8
              name: 'Interface {#IFNAME}({#IFALIAS}): Outbound packets with errors'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}]'
              key: 'net.if.out.errors[ifOutErrors.{#SNMPINDEX}]'
              delay: 3m
              description: |
                MIB: IF-MIB
                The number of outbound packets that could not be transmitted because of errors.
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 70a6febf1b4d431799993fa4f770eae1
              name: 'Interface {#IFNAME}({#IFALIAS}): Bits sent'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}]'
              key: 'net.if.out[ifHCOutOctets.{#SNMPINDEX}]'
              delay: 3m
              units: bps
              description: |
                MIB: IF-MIB
                ifHCOutOctets, 64-bit count of octets transmitted (needs SNMPv2c or SNMPv3).
              preprocessing:
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 77df489c595a4fcdad0996836d8c30bd
              name: 'Interface {#IFNAME}({#IFALIAS}): Speed'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.31.1.1.1.15.{#SNMPINDEX}]'
              key: 'net.if.speed[ifHighSpeed.{#SNMPINDEX}]'
              delay: 5m
              trends: '0'
              units: bps
              description: |
                MIB: IF-MIB
                ifHighSpeed, current bandwidth in Mbit/s, converted to bits per second.
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '1000000'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 1e1df18aa8124ceeb7c8c5e44d3ed995
              name: 'Interface {#IFNAME}({#IFALIAS}): Operational status'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}]'
              key: 'net.if.status[ifOperStatus.{#SNMPINDEX}]'
              trends: '0'
              description: |
                MIB: IF-MIB
                ifOperStatus: up(1), down(2), testing(3), unknown(4), dormant(5), notPresent(6), lowerLayerDown(7).
              valuemap:
                name: 'IF-MIB::ifOperStatus'
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
              trigger_prototypes:
                - uuid: 3f34d3f0fae44af095bfb29c7a1638fb
                  expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/VMware ESXi 8 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=2 and (last(/VMware ESXi 8 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#1)<>last(/VMware ESXi 8 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#2))'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'last(/VMware ESXi 8 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2 or {$IFCONTROL:"{#IFNAME}"}=0'
                  name: 'VMware ESXi: Interface {#IFNAME}({#IFALIAS}): Link down'
                  opdata: 'Current state: {ITEM.LASTVALUE1}'
                  priority: AVERAGE
                  description: |
                    The interface went down. Fires on the change to down(2) only, so unused NICs
                    that were never up raise nothing. An uplink going down removes redundancy from
                    its vSwitch or leaves port groups without network.
                    Silence one interface with {$IFCONTROL:"<ifName>"}=0.
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: availability
            - uuid: 13715667c8584d919755cb59e470e2f5
              name: 'Interface {#IFNAME}({#IFALIAS}): Interface type'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.2.2.1.3.{#SNMPINDEX}]'
              key: 'net.if.type[ifType.{#SNMPINDEX}]'
              delay: 1h
              trends: '0'
              description: |
                MIB: IF-MIB
                ifType. Physical NICs report ethernetCsmacd(6).
              valuemap:
                name: 'IF-MIB::ifType'
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
          trigger_prototypes:
            - uuid: bfe6959a7c534a479257b89e5d13f9e1
              expression: |
                (avg(/VMware ESXi 8 by SNMP/net.if.in[ifHCInOctets.{#SNMPINDEX}],15m)>({$IF.UTIL.MAX:"{#IFNAME}"}/100)*last(/VMware ESXi 8 by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}]) or
                avg(/VMware ESXi 8 by SNMP/net.if.out[ifHCOutOctets.{#SNMPINDEX}],15m)>({$IF.UTIL.MAX:"{#IFNAME}"}/100)*last(/VMware ESXi 8 by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}])) and
                last(/VMware ESXi 8 by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}])>0
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: |
                avg(/VMware ESXi 8 by SNMP/net.if.in[ifHCInOctets.{#SNMPINDEX}],15m)<(({$IF.UTIL.MAX:"{#IFNAME}"}-3)/100)*last(/VMware ESXi 8 by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}]) and
                avg(/VMware ESXi 8 by SNMP/net.if.out[ifHCOutOctets.{#SNMPINDEX}],15m)<(({$IF.UTIL.MAX:"{#IFNAME}"}-3)/100)*last(/VMware ESXi 8 by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}])
              name: 'VMware ESXi: Interface {#IFNAME}({#IFALIAS}): High bandwidth usage'
              event_name: 'VMware ESXi: Interface {#IFNAME}({#IFALIAS}): High bandwidth usage (>{$IF.UTIL.MAX:"{#IFNAME}"}%)'
              opdata: 'In: {ITEM.LASTVALUE1}, out: {ITEM.LASTVALUE3}, speed: {ITEM.LASTVALUE2}'
              priority: WARNING
              description: 'The network interface utilization is close to its estimated maximum bandwidth.'
              manual_close: 'YES'
              dependencies:
                - name: 'VMware ESXi: Interface {#IFNAME}({#IFALIAS}): Link down'
                  expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/VMware ESXi 8 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=2 and (last(/VMware ESXi 8 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#1)<>last(/VMware ESXi 8 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#2))'
                  recovery_expression: 'last(/VMware ESXi 8 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2 or {$IFCONTROL:"{#IFNAME}"}=0'
              tags:
                - tag: scope
                  value: performance
            - uuid: 149d8c55f3b440379c24d8b8cc11eb4c
              expression: |
                min(/VMware ESXi 8 by SNMP/net.if.in.errors[ifInErrors.{#SNMPINDEX}],5m)>{$IF.ERRORS.WARN:"{#IFNAME}"} or
                min(/VMware ESXi 8 by SNMP/net.if.out.errors[ifOutErrors.{#SNMPINDEX}],5m)>{$IF.ERRORS.WARN:"{#IFNAME}"}
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: |
                max(/VMware ESXi 8 by SNMP/net.if.in.errors[ifInErrors.{#SNMPINDEX}],5m)<{$IF.ERRORS.WARN:"{#IFNAME}"}*0.8 and
                max(/VMware ESXi 8 by SNMP/net.if.out.errors[ifOutErrors.{#SNMPINDEX}],5m)<{$IF.ERRORS.WARN:"{#IFNAME}"}*0.8
              name: 'VMware ESXi: Interface {#IFNAME}({#IFALIAS}): High error rate'
              event_name: 'VMware ESXi: Interface {#IFNAME}({#IFALIAS}): High error rate (>{$IF.ERRORS.WARN:"{#IFNAME}"} for 5m)'
              opdata: 'errors in: {ITEM.LASTVALUE1}, errors out: {ITEM.LASTVALUE2}'
              priority: WARNING
              description: 'Errors on the interface are above {$IF.ERRORS.WARN:"{#IFNAME}"} per second. Check cable, SFP and switch port.'
              manual_close: 'YES'
              dependencies:
                - name: 'VMware ESXi: Interface {#IFNAME}({#IFALIAS}): Link down'
                  expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/VMware ESXi 8 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=2 and (last(/VMware ESXi 8 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#1)<>last(/VMware ESXi 8 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#2))'
                  recovery_expression: 'last(/VMware ESXi 8 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2 or {$IFCONTROL:"{#IFNAME}"}=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
            - uuid: 6e89a7c2067940b983440e7abf4f04a0
              expression: |
                change(/VMware ESXi 8 by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}])<0 and
                last(/VMware ESXi 8 by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}])>0 and
                last(/VMware ESXi 8 by SNMP/net.if.type[ifType.{#SNMPINDEX}])=6 and
                last(/VMware ESXi 8 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: |
                (change(/VMware ESXi 8 by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}])>0 and last(/VMware ESXi 8 by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}],#2)>0) or
                last(/VMware ESXi 8 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=2
              name: 'VMware ESXi: Interface {#IFNAME}({#IFALIAS}): Ethernet has changed to lower speed than it was before'
              opdata: 'Current reported speed: {ITEM.LASTVALUE1}'
              priority: INFO
              description: 'The physical NIC negotiated a lower speed than before - check autonegotiation, cable and switch port.'
              manual_close: 'YES'
              dependencies:
                - name: 'VMware ESXi: Interface {#IFNAME}({#IFALIAS}): Link down'
                  expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/VMware ESXi 8 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=2 and (last(/VMware ESXi 8 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#1)<>last(/VMware ESXi 8 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#2))'
                  recovery_expression: 'last(/VMware ESXi 8 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2 or {$IFCONTROL:"{#IFNAME}"}=0'
              tags:
                - tag: scope
                  value: performance
          graph_prototypes:
            - uuid: a295354bf318481db1237180b19bf22d
              name: 'VMware ESXi: Interface {#IFNAME}({#IFALIAS}): Network traffic'
              graph_items:
                - drawtype: GRADIENT_LINE
                  color: 1A7C11
                  item:
                    host: 'VMware ESXi 8 by SNMP'
                    key: 'net.if.in[ifHCInOctets.{#SNMPINDEX}]'
                - sortorder: '1'
                  drawtype: BOLD_LINE
                  color: 2774A4
                  item:
                    host: 'VMware ESXi 8 by SNMP'
                    key: 'net.if.out[ifHCOutOctets.{#SNMPINDEX}]'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  var rows = Array.isArray(data) ? data : data.data;
                  if (!Array.isArray(rows)) {
                      throw 'Expected an SNMP discovery array';
                  }
                  for (var i = 0; i < rows.length; i++) {
                      var row = rows[i];
                      row['{#IFALIAS}'] = row['{#IFALIAS}'] || '';
                      row['{#IFDESCR}'] = row['{#IFDESCR}'] || '';
                      row['{#IFNAME}'] = row['{#IFNAME}'] || row['{#IFDESCR}'] || ('ifIndex ' + row['{#SNMPINDEX}']);
                  }
                  return JSON.stringify(rows);
      tags:
        - tag: class
          value: software
        - tag: target
          value: esxi
        - tag: target
          value: vmware
      macros:
        - macro: '{$CPU.UTIL.CRIT}'
          value: '90'
          description: 'CPU utilization threshold (%), 5-minute minimum.'
        - macro: '{$ESXI.HBA.NAME.MATCHES}'
          value: '.*'
          description: 'HBA discovery: include adapters whose name matches.'
        - macro: '{$ESXI.HBA.NAME.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
          description: 'HBA discovery: exclude adapters whose name matches.'
        - macro: '{$ESXI.HRDEVICE.CRIT.STATUS}'
          value: '5'
          description: 'hrDeviceStatus down(5).'
        - macro: '{$ESXI.HRDEVICE.DESCR.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
          description: 'Disk device discovery: exclude devices whose description matches.'
        - macro: '{$ESXI.HRDEVICE.TYPE.MATCHES}'
          value: '.*(\.6|hrDeviceDiskStorage)$'
          description: 'Disk device discovery: hrDeviceType to include (disk storage by default).'
        - macro: '{$ESXI.HRDEVICE.WARN.STATUS}'
          value: '3'
          description: 'hrDeviceStatus warning(3).'
        - macro: '{$ESXI.PROC.HOSTD.MATCHES}'
          value: '^hostd'
          description: 'Regex on hrSWRunName that identifies the hostd process.'
        - macro: '{$ESXI.PROC.VPXA.MATCHES}'
          value: '^vpxa'
          description: 'Regex on hrSWRunName that identifies the vpxa process.'
        - macro: '{$ESXI.SEL.CAPACITY.MAX}'
          value: '90'
          description: 'IPMI SEL capacity threshold (%), for the disabled SEL trigger.'
        - macro: '{$ESXI.SHELL.SESSIONS.MAX}'
          value: '0'
          description: 'Number of ESXi Shell sessions allowed before alerting.'
        - macro: '{$ESXI.SUBSYSTEM.CRIT.STATUS}'
          value: '4'
          description: 'VmwSubsystemStatus from which a HBA is critical: critical(4) and failed(5).'
        - macro: '{$ESXI.SUBSYSTEM.WARN.STATUS}'
          value: '3'
          description: 'VmwSubsystemStatus marginal(3).'
        - macro: '{$ESXI.TRAP.EVENT.HOLD}'
          value: 1h
          description: 'How long a trap-based problem stays open after the last matching trap.'
        - macro: '{$ESXI.VM.GUEST.CONTROL}'
          value: '1'
          description: 'Set {$ESXI.VM.GUEST.CONTROL:"<vm name>"}=0 to disable the guest state trigger of a VM.'
        - macro: '{$ESXI.VM.NAME.MATCHES}'
          value: '.*'
          description: 'VM discovery: include VMs whose name matches.'
        - macro: '{$ESXI.VM.NAME.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
          description: 'VM discovery: exclude VMs whose name matches, e.g. ^vCLS'
        - macro: '{$ESXI.VM.POWER.CONTROL}'
          value: '1'
          description: 'Set {$ESXI.VM.POWER.CONTROL:"<vm name>"}=0 to disable the power state trigger of a VM.'
        - macro: '{$ESXI.VPXA.CONTROL}'
          value: '1'
          description: 'Set to 0 on standalone hosts not managed by vCenter.'
        - macro: '{$ICMP_LOSS_WARN}'
          value: '20'
          description: 'ICMP packet loss threshold (%).'
        - macro: '{$ICMP_RESPONSE_TIME_WARN}'
          value: '0.15'
          description: 'ICMP response time threshold (seconds).'
        - macro: '{$IF.ERRORS.WARN}'
          value: '2'
          description: 'Interface error threshold (packets/second).'
        - macro: '{$IF.UTIL.MAX}'
          value: '90'
          description: 'Interface bandwidth threshold (%).'
        - macro: '{$IFCONTROL}'
          value: '1'
          description: 'Set {$IFCONTROL:"<ifName>"}=0 to disable the Link down trigger of an interface.'
        - macro: '{$MEMORY.TYPE.MATCHES}'
          value: '.*(\.2|hrStorageRam)$'
          description: 'hrStorageType of the physical memory row.'
        - macro: '{$MEMORY.UTIL.MAX}'
          value: '90'
          description: 'Memory utilization threshold (%), 5-minute minimum.'
        - macro: '{$NET.IF.IFADMINSTATUS.MATCHES}'
          value: '^.*'
        - macro: '{$NET.IF.IFADMINSTATUS.NOT_MATCHES}'
          value: '^2$'
          description: 'Skip interfaces with ifAdminStatus down(2).'
        - macro: '{$NET.IF.IFALIAS.MATCHES}'
          value: '.*'
        - macro: '{$NET.IF.IFALIAS.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
        - macro: '{$NET.IF.IFDESCR.MATCHES}'
          value: '.*'
        - macro: '{$NET.IF.IFDESCR.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
        - macro: '{$NET.IF.IFNAME.MATCHES}'
          value: '^.*$'
        - macro: '{$NET.IF.IFNAME.NOT_MATCHES}'
          value: '(^Software Loopback Interface|^NULL[0-9.]*$|^[Ll]o[0-9.]*$|^[Ss]ystem$|^Nu[0-9.]*$)'
          description: 'Filter out loopbacks.'
        - macro: '{$NET.IF.IFOPERSTATUS.MATCHES}'
          value: '^.*$'
        - macro: '{$NET.IF.IFOPERSTATUS.NOT_MATCHES}'
          value: '^6$'
          description: 'Skip interfaces in notPresent(6).'
        - macro: '{$NET.IF.IFTYPE.MATCHES}'
          value: '.*'
        - macro: '{$NET.IF.IFTYPE.NOT_MATCHES}'
          value: '^24$'
          description: 'Skip softwareLoopback(24).'
        - macro: '{$SNMP.TIMEOUT}'
          value: 5m
          description: 'Time window of the SNMP availability trigger.'
        - macro: '{$UPTIME.WRAP.THRESHOLD}'
          value: 496d
          description: 'Uptime above which a drop to zero is read as the TimeTicks counter wrapping, not as a reboot.'
        - macro: '{$VFS.FS.FSNAME.MATCHES}'
          value: '.+'
          description: 'Datastore discovery: include mount paths that match.'
        - macro: '{$VFS.FS.FSNAME.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
          description: 'Datastore discovery: exclude mount paths that match.'
        - macro: '{$VFS.FS.FSTYPE.MATCHES}'
          value: '.*(\.4|hrStorageFixedDisk)$'
          description: 'hrStorageType of datastores.'
        - macro: '{$VFS.FS.FSUUID.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
          description: 'Datastore discovery: exclude datastores by UUID. List the shared (SAN) datastores here, on the cluster host group, e.g. ^(uuid1|uuid2)$ - they are monitored by a separate template.'
        - macro: '{$VFS.FS.PUSED.MAX.CRIT}'
          value: '90'
          description: 'Datastore critical threshold (%). Accepts the mount path as context.'
        - macro: '{$VFS.FS.PUSED.MAX.WARN}'
          value: '80'
          description: 'Datastore warning threshold (%). Accepts the mount path as context.'
      valuemaps:
