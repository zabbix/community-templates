          delay: 5m
          history: '0'
          value_type: TEXT
          trends: '0'
          description: |
            MIB: HOST-RESOURCES-MIB
            Master item: walks the names of the running processes and converts them to JSON.
          preprocessing:
            - type: SNMP_WALK_TO_JSON
              parameters:
                - name
                - 1.3.6.1.2.1.25.4.2.1.2
                - '0'
          tags:
            - tag: component
              value: raw
        - uuid: 5951e8854cfa492f971a0d0f53bf05b8
          name: 'Number of hostd processes'
          type: DEPENDENT
          key: 'proc.num[hostd]'
          description: |
            MIB: HOST-RESOURCES-MIB
            Number of hrSWRunName entries matching {$ESXI.PROC.HOSTD.MATCHES}. hostd is the host
            management agent: without it vSphere Client, vCenter and the API cannot manage the host.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$[?(@.name =~ "{$ESXI.PROC.HOSTD.MATCHES}")].length()'
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
          master_item:
            key: 'system.sw.walk[hrSWRunName]'
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: 754c5be851df4e2fa393ad0fe7ca9cc4
              expression: 'max(/VMware ESXi 8 by SNMP/proc.num[hostd],10m)=0'
              name: 'VMware ESXi: Management agent hostd is not running'
              priority: HIGH
              description: |
                No process matching {$ESXI.PROC.HOSTD.MATCHES} for 10 minutes. The host cannot be
                managed. Restart it from the DCUI or ESXi Shell: /etc/init.d/hostd restart
              dependencies:
                - name: 'VMware ESXi: No SNMP data collection'
                  expression: 'max(/VMware ESXi 8 by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              tags:
                - tag: scope
                  value: availability
        - uuid: c8200c107956408ca759567340931fa0
          name: 'Number of vpxa processes'
          type: DEPENDENT
          key: 'proc.num[vpxa]'
          description: |
            MIB: HOST-RESOURCES-MIB
            Number of hrSWRunName entries matching {$ESXI.PROC.VPXA.MATCHES}. vpxa is the vCenter
            agent; it only runs on a host that has been added to vCenter.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$[?(@.name =~ "{$ESXI.PROC.VPXA.MATCHES}")].length()'
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
          master_item:
            key: 'system.sw.walk[hrSWRunName]'
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: d3a9b893a20a44779ae3782f5d122d0e
              expression: '{$ESXI.VPXA.CONTROL}=1 and max(/VMware ESXi 8 by SNMP/proc.num[vpxa],10m)=0'
              name: 'VMware ESXi: vCenter agent vpxa is not running'
              priority: AVERAGE
              description: |
                No process matching {$ESXI.PROC.VPXA.MATCHES} for 10 minutes: vCenter sees the host
                as disconnected. Set {$ESXI.VPXA.CONTROL} to 0 on standalone hosts.
                Restart it with: /etc/init.d/vpxa restart
              dependencies:
                - name: 'VMware ESXi: Management agent hostd is not running'
                  expression: 'max(/VMware ESXi 8 by SNMP/proc.num[hostd],10m)=0'
              tags:
                - tag: scope
                  value: availability
        - uuid: 0ed368b4e5c142289bb1485d9e86db0a
          name: 'vmwVmTable walk'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.6876.2.1.1.2,1.3.6.1.4.1.6876.2.1.1.4,1.3.6.1.4.1.6876.2.1.1.5,1.3.6.1.4.1.6876.2.1.1.6,1.3.6.1.4.1.6876.2.1.1.8,1.3.6.1.4.1.6876.2.1.1.9,1.3.6.1.4.1.6876.2.1.1.10]'
          key: 'vmware.vm.walk[vmwVmTable]'
          delay: 3m
          history: '0'
          value_type: TEXT
          trends: '0'
          description: |
            MIB: VMWARE-VMINFO-MIB
