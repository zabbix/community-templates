          value: '90'
        - macro: '{$FAN_CRIT_STATUS}'
          value: '2'
        - macro: '{$FAN_OK_STATUS}'
          value: '4'
        - macro: '{$FC.C3DISCARD.WARN}'
          value: '1'
          description: 'Warning threshold for the Class 3 discard rate on an FC port, in frames per second. Can be used with the port label as context.'
        - macro: '{$FC.IF.ERRORS.WARN}'
          value: '2'
          description: 'Warning threshold for the CRC and encoding error rate on an FC port. Can be used with the port label as context.'
        - macro: '{$FC.IF.UTIL.MAX}'
          value: '90'
          description: 'Bandwidth utilization threshold in % for FC ports, measured against the nominal bitrate of the reported port speed.'
        - macro: '{$FC.PORT.ADMSTATUS.MATCHES}'
          value: '^.*$'
          description: 'FC port discovery filter on swFCPortAdmStatus.'
        - macro: '{$FC.PORT.ADMSTATUS.NOT_MATCHES}'
          value: ^2$
