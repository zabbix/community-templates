        - uuid: 4119a22fc88e45c3aa3052d1b04a3746
          name: 'FC port traffic discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#FCSTATRX},1.3.6.1.3.94.4.5.1.7]'
          key: fcstat.discovery
          delay: 1h
          filter:
            evaltype: AND
            conditions:
              - macro: '{#FCPORTNUM}'
                formulaid: A
                value: '{$FC.TRAFFIC.PORT.MATCHES}'
              - macro: '{#FCPORTNUM}'
                formulaid: B
                value: '{$FC.TRAFFIC.PORT.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
          description: |
            MIB: FCMGMT-MIB / FA-MIB, connUnitPortStatTable (1.3.6.1.3.94.4.5.1)
            Fibre Channel throughput for firmware where Fabric OS removed the 32-bit word counters
            swFCPortTxWords/swFCPortRxWords from swFCPortTable, which is every release from 8.x on.
            connUnitPortStatCountTxElements/RxElements count octets, are 64-bit, and are returned as
            an 8-byte OCTET STRING, so they are readable over SNMPv1 as well - unlike Counter64.

            The table is indexed by connUnitId (a 16-byte switch WWN, identical on every row) followed
            by the port index, for example 16.0.136.148.113.70.52.128.0.0.0.0.0.0.0.0.1. That index has
            nothing in common with swFCPortIndex, so this has to be its own discovery rule. The last
            component matches swFCPortIndex, so {#FCPORTNUM} is derived from it and equals the
            Fabric OS port number: index 1 is port 0.

            This table has no administrative status column, so every port present in the switch is
            discovered. Use {$FC.TRAFFIC.PORT.NOT_MATCHES} to drop ports that are not in use.
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  var rows = Array.isArray(data) ? data : data.data;
                  if (!Array.isArray(rows)) {
                      throw 'Expected an SNMP discovery array';
                  }
                  for (var i = 0; i < rows.length; i++) {
                      var row = rows[i];
                      var parts = String(row['{#SNMPINDEX}']).split('.');
                      var port = Number(parts[parts.length - 1]) - 1;
                      if (!isFinite(port) || port < 0) {
                          throw 'Unexpected connUnitPortStat index: ' + row['{#SNMPINDEX}'];
                      }
                      row['{#FCPORTNUM}'] = String(port);
                  }
                  return JSON.stringify(rows);
          item_prototypes:
            - uuid: be94f8b8703d48e499d2b6cde9b2ec1d
              name: 'FC port {#FCPORTNUM}: Bits received'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.3.94.4.5.1.7.{#SNMPINDEX}]'
              key: 'fcstat.in[connUnitPortStatCountRxElements.{#FCPORTNUM}]'
              delay: 1m
              value_type: FLOAT
              units: bps
              description: |
                MIB: FCMGMT-MIB, connUnitPortStatCountRxElements
                The number of octets received by this port, as a 64-bit counter carried in an
                8-byte OCTET STRING. The JavaScript step converts that hex dump to a number,
                then the rate is taken and multiplied by 8 to get bits per second.

                Octets, not FC words: no multiplication by 4 as with the old swFCPortRxWords.
                JavaScript numbers are doubles, so the conversion is exact up to 2^53 bytes (9 PB)
                and rounds above that. The rounding error stays far below the number of bytes moved
                between two polls, so the rate remains accurate for the whole life of the counter.
                A counter reset by portstatsclear or a reboot produces a negative delta, which
                Zabbix discards - expect one missing sample, not a spike.
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var hex = value.replace(/[^0-9A-Fa-f]/g, '');
                      if (hex.length === 0 || hex.length % 2 !== 0) {
                          throw 'Unexpected octet string: ' + value;
                      }
                      var n = 0;
                      for (var i = 0; i < hex.length; i += 2) {
                          n = n * 256 + parseInt(hex.substr(i, 2), 16);
                      }
                      return n;
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: 'port{#FCPORTNUM}'
                - tag: port
                  value: '{#FCPORTNUM}'
            - uuid: 575f5ac825f843feab2af08fbf699a36
              name: 'FC port {#FCPORTNUM}: Bits sent'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.3.94.4.5.1.6.{#SNMPINDEX}]'
              key: 'fcstat.out[connUnitPortStatCountTxElements.{#FCPORTNUM}]'
              delay: 1m
              value_type: FLOAT
              units: bps
              description: |
                MIB: FCMGMT-MIB, connUnitPortStatCountTxElements
                The number of octets transmitted by this port, in the same 8-byte OCTET STRING
                form as the receive counter. See that item for the conversion and its limits.
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var hex = value.replace(/[^0-9A-Fa-f]/g, '');
                      if (hex.length === 0 || hex.length % 2 !== 0) {
                          throw 'Unexpected octet string: ' + value;
                      }
                      var n = 0;
                      for (var i = 0; i < hex.length; i += 2) {
                          n = n * 256 + parseInt(hex.substr(i, 2), 16);
                      }
                      return n;
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: 'port{#FCPORTNUM}'
                - tag: port
                  value: '{#FCPORTNUM}'
            - uuid: 464277dd631244c79d7349a2c777e25c
              name: 'FC port {#FCPORTNUM}: Speed'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.3.94.1.10.1.15.{#SNMPINDEX}]'
              key: 'fcstat.speed[connUnitPortSpeed.{#FCPORTNUM}]'
              delay: 5m
              value_type: FLOAT
              trends: '0'
              units: bps
              description: |
                MIB: FCMGMT-MIB, connUnitPortSpeed - the speed of the port in kilobytes per second.
                connUnitPortTable shares the index of connUnitPortStatTable, so the same {#SNMPINDEX}
                addresses both. It replaces swFCPortSpeed, which Fabric OS 8.x removed.

                The multiplier 8000 converts KB/s to bits per second (x1000 bytes, x8 bits), which
                gives the speed the way Fibre Channel names it and the way switchshow reports it:
                2000000 becomes 16 Gbps, 1000000 becomes 8 Gbps, 4000000 becomes 32 Gbps.

                This is the signalling rate on the wire, not the amount of frame data the port can
                carry. The bandwidth trigger multiplies it by {$FC.SPEED.PAYLOAD.RATIO} (0.8 by
                default) to get the throughput figure the Fibre Channel standard publishes, because
                the traffic items count frame octets: 16 Gbps here means 12.8 Gbps of frame data,
                the 1600 MB/s a 16GFC port moves in one direction.

                VERIFY THIS: on some Fabric OS releases connUnitPortSpeed reports the maximum speed
                the port supports rather than the speed it negotiated. Compare against switchshow,
                which lists the real negotiated speed per port. If every port reports the same value
                while switchshow shows mixed speeds, treat the utilization trigger as approximate.
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '8000'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: 'port{#FCPORTNUM}'
                - tag: port
                  value: '{#FCPORTNUM}'
          trigger_prototypes:
            - uuid: cb2e7b3014e7454fa722b74248469e4e
              expression: |
                (avg(/Brocade 6505 by SNMPv3/fcstat.in[connUnitPortStatCountRxElements.{#FCPORTNUM}],15m)>({$FC.IF.UTIL.MAX:"{#FCPORTNUM}"}/100)*{$FC.SPEED.PAYLOAD.RATIO:"{#FCPORTNUM}"}*last(/Brocade 6505 by SNMPv3/fcstat.speed[connUnitPortSpeed.{#FCPORTNUM}]) or
                avg(/Brocade 6505 by SNMPv3/fcstat.out[connUnitPortStatCountTxElements.{#FCPORTNUM}],15m)>({$FC.IF.UTIL.MAX:"{#FCPORTNUM}"}/100)*{$FC.SPEED.PAYLOAD.RATIO:"{#FCPORTNUM}"}*last(/Brocade 6505 by SNMPv3/fcstat.speed[connUnitPortSpeed.{#FCPORTNUM}])) and
                last(/Brocade 6505 by SNMPv3/fcstat.speed[connUnitPortSpeed.{#FCPORTNUM}])>0
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: |
                avg(/Brocade 6505 by SNMPv3/fcstat.in[connUnitPortStatCountRxElements.{#FCPORTNUM}],15m)<(({$FC.IF.UTIL.MAX:"{#FCPORTNUM}"}-3)/100)*{$FC.SPEED.PAYLOAD.RATIO:"{#FCPORTNUM}"}*last(/Brocade 6505 by SNMPv3/fcstat.speed[connUnitPortSpeed.{#FCPORTNUM}]) and
                avg(/Brocade 6505 by SNMPv3/fcstat.out[connUnitPortStatCountTxElements.{#FCPORTNUM}],15m)<(({$FC.IF.UTIL.MAX:"{#FCPORTNUM}"}-3)/100)*{$FC.SPEED.PAYLOAD.RATIO:"{#FCPORTNUM}"}*last(/Brocade 6505 by SNMPv3/fcstat.speed[connUnitPortSpeed.{#FCPORTNUM}])
              name: 'Brocade 6505: FC port {#FCPORTNUM}: High bandwidth usage'
              event_name: 'Brocade 6505: FC port {#FCPORTNUM}: High bandwidth usage (>{$FC.IF.UTIL.MAX:"{#FCPORTNUM}"}%)'
              opdata: 'In: {ITEM.LASTVALUE1}, out: {ITEM.LASTVALUE3}, speed: {ITEM.LASTVALUE2}'
              priority: WARNING
              description: |
                The port is close to the amount of frame data its link can carry.

                100% is not the speed itself but the speed multiplied by {$FC.SPEED.PAYLOAD.RATIO},
                because the traffic items count frame octets while connUnitPortSpeed reports the
                signalling rate on the wire. The default ratio 0.8 gives the throughput figure the
                Fibre Channel standard publishes: 8GFC 800 MB/s, 16GFC 1600 MB/s, 32GFC 3200 MB/s.
                It is exact for 1/2/4/8GFC, which use 8b/10b encoding. From 16GFC on the encoding is
                64b/66b and the real ceiling is a few percent higher, so a saturated port can read
                slightly above 100%.

                Accuracy also depends on connUnitPortSpeed reporting the negotiated speed rather than
                the maximum the port supports - see the description of the speed item.

                No dependency on the port state trigger is possible here, because that trigger belongs
                to the other discovery rule and Zabbix only allows dependencies within the same rule.
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: performance
          graph_prototypes:
            - uuid: 7882bd30fa224d90a258a3f0fabd985b
              name: 'FC port {#FCPORTNUM}: Bandwidth'
              graph_items:
                - drawtype: GRADIENT_LINE
                  color: 199C0D
                  item:
                    host: 'Brocade 6505 by SNMPv3'
                    key: 'fcstat.in[connUnitPortStatCountRxElements.{#FCPORTNUM}]'
                - sortorder: '1'
                  drawtype: BOLD_LINE
                  color: F63100
                  item:
                    host: 'Brocade 6505 by SNMPv3'
                    key: 'fcstat.out[connUnitPortStatCountTxElements.{#FCPORTNUM}]'
        - uuid: 1d5db1e90fca4ecaad9f81b0856848bf
          name: 'Network interfaces discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#IFOPERSTATUS},1.3.6.1.2.1.2.2.1.8,{#IFADMINSTATUS},1.3.6.1.2.1.2.2.1.7,{#IFALIAS},1.3.6.1.2.1.31.1.1.1.18,{#IFNAME},1.3.6.1.2.1.31.1.1.1.1,{#IFDESCR},1.3.6.1.2.1.2.2.1.2,{#IFTYPE},1.3.6.1.2.1.2.2.1.3]'
          key: net.if.discovery
          delay: 1h
          filter:
            evaltype: AND
            conditions:
              - macro: '{#IFADMINSTATUS}'
                formulaid: A
                value: '{$NET.IF.IFADMINSTATUS.MATCHES}'
              - macro: '{#IFADMINSTATUS}'
                formulaid: B
                value: '{$NET.IF.IFADMINSTATUS.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
              - macro: '{#IFALIAS}'
                formulaid: C
                value: '{$NET.IF.IFALIAS.MATCHES}'
              - macro: '{#IFALIAS}'
                formulaid: D
                value: '{$NET.IF.IFALIAS.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
              - macro: '{#IFDESCR}'
                formulaid: E
                value: '{$NET.IF.IFDESCR.MATCHES}'
              - macro: '{#IFDESCR}'
                formulaid: F
                value: '{$NET.IF.IFDESCR.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
              - macro: '{#IFNAME}'
                formulaid: G
                value: '{$NET.IF.IFNAME.MATCHES}'
              - macro: '{#IFNAME}'
                formulaid: H
                value: '{$NET.IF.IFNAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
              - macro: '{#IFOPERSTATUS}'
                formulaid: I
                value: '{$NET.IF.IFOPERSTATUS.MATCHES}'
              - macro: '{#IFOPERSTATUS}'
                formulaid: J
                value: '{$NET.IF.IFOPERSTATUS.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
              - macro: '{#IFTYPE}'
                formulaid: K
                value: '{$NET.IF.IFTYPE.MATCHES}'
              - macro: '{#IFTYPE}'
                formulaid: L
                value: '{$NET.IF.IFTYPE.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
          description: 'Discovering Fibre Channel and management Ethernet interfaces from IF-MIB; normalize optional interface names and aliases before filtering.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  var rows = Array.isArray(data) ? data : data.data;
                  if (!Array.isArray(rows)) {
                      throw 'Expected an SNMP discovery array';
                  }
                  for (var i = 0; i < rows.length; i++) {
                      var row = rows[i];
                      row['{#IFALIAS}'] = row['{#IFALIAS}'] || '';
                      row['{#IFDESCR}'] = row['{#IFDESCR}'] || '';
                      row['{#IFNAME}'] = row['{#IFNAME}'] || row['{#IFDESCR}'] || ('ifIndex ' + row['{#SNMPINDEX}']);
                  }
                  return JSON.stringify(rows);
          item_prototypes:
            - uuid: baefa244628d4376ad554d40f326b6d3
              name: 'Interface {#IFNAME}({#IFALIAS}): Inbound packets discarded'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}]'
              key: 'net.if.in.discards[ifInDiscards.{#SNMPINDEX}]'
              delay: 3m
              description: |
                MIB: IF-MIB
                The number of inbound packets which were chosen to be discarded
                even though no errors had been detected to prevent their being deliverable to a higher-layer protocol.
                One possible reason for discarding such a packet could be to free up buffer space.
                Discontinuities in the value of this counter can occur at re-initialization of the management system,
                and at other times as indicated by the value of ifCounterDiscontinuityTime.
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: aa14ff15003b4b0498fb9b8f2b242b53
              name: 'Interface {#IFNAME}({#IFALIAS}): Inbound packets with errors'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}]'
              key: 'net.if.in.errors[ifInErrors.{#SNMPINDEX}]'
              delay: 3m
              description: |
                MIB: IF-MIB
                For packet-oriented interfaces, the number of inbound packets that contained errors preventing them from being deliverable to a higher-layer protocol.  For character-oriented or fixed-length interfaces, the number of inbound transmission units that contained errors preventing them from being deliverable to a higher-layer protocol. Discontinuities in the value of this counter can occur at re-initialization of the management system, and at other times as indicated by the value of ifCounterDiscontinuityTime.
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: aa443b0c63ff49cb88c34f4615e68976
              name: 'Interface {#IFNAME}({#IFALIAS}): Bits received'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}]'
              key: 'net.if.in[ifHCInOctets.{#SNMPINDEX}]'
              delay: 3m
              units: bps
              description: |
                MIB: IF-MIB
                The total number of octets received on the interface, including framing characters. This object is a 64-bit version of ifInOctets. Discontinuities in the value of this counter can occur at re-initialization of the management system, and at other times as indicated by the value of ifCounterDiscontinuityTime.
              preprocessing:
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
