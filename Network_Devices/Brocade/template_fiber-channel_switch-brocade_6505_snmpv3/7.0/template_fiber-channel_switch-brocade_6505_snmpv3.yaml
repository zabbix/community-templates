                - sortorder: '3'
                  color: 00611C
                  yaxisside: RIGHT
                  item:
                    host: 'Brocade 6505 by SNMPv3'
                    key: 'fcport.errors.encout[swFCPortRxEncOutFrs.{#SNMPINDEX}]'
