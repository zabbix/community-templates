zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 36bff6c29af64692839d077febfc7079
      name: 'Templates/Network devices'
  templates:
    - uuid: 90da62af7e154fe69112e633e1ce9b07
      template: 'Brocade 6505 by SNMPv3'
      name: 'Brocade 6505 by SNMPv3'
      description: |
        Brocade 6505 Fibre Channel switch monitoring for Zabbix 7.0.
        Adapted from the official Zabbix Brocade FC by SNMP template.

        Tested against a Brocade 6505 running Fabric OS 8.0.2c, with Zabbix server 7.0.29.

        MIBs: SW-MIB, FCMGMT-MIB (FA-MIB), IF-MIB, SNMPv2-MIB and HOST-RESOURCES-MIB.
        Monitors system health, CPU, memory, uptime, firmware, serial number,
        fans, power supplies, temperatures, Fibre Channel ports and the
        management Ethernet interface.
        Fibre Channel traffic, errors and port state come from SW-MIB
        (swFCPortTable), because Fabric OS does not answer the 64-bit IF-MIB
        counters ifHCInOctets/ifHCOutOctets for FC ports on every release.
        IF-MIB discovery is limited to Ethernet by default and keeps the
        64-bit counters for the management port. It tolerates missing ifAlias
        and falls back from ifName to ifDescr, then to the SNMP index.
        No fixed port count is assumed.

        Configure the host SNMP interface for SNMPv3, UDP port 161. Set its
        security name, security level, authentication/privacy protocols and
        passphrases to match the Fabric OS SNMPv3 user. Credentials and SNMP
        version belong to the host interface and are not set by this template.
        Use authPriv when configured on the switch. Allow the Zabbix server
        or proxy to read the required MIBs. SNMP traps need a separate receiver.

        Validate available OIDs and sensor thresholds against the installed
        Fabric OS release: which swFCPortTable columns a switch answers, and
        which sensor slots are populated, differ between releases and models.
      vendor:
        name: Community
        version: 7.0-1
      groups:
        - name: 'Templates/Network devices'
      items:
        - uuid: 20559313284e4a08bc7b9f85b29864af
          name: 'ICMP ping'
          type: SIMPLE
          key: icmpping
          description: |
            The host accessibility by ICMP ping.
            
            0 - ICMP ping fails;
            1 - ICMP ping successful.
          valuemap:
            name: 'Service state'
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: 9430da2423164c7bb6f26fb22b744c04
              expression: 'max(/Brocade 6505 by SNMPv3/icmpping,#3)=0'
              name: 'Brocade 6505: Unavailable by ICMP ping'
              priority: HIGH
              description: 'Last three attempts returned timeout. Please check device connectivity.'
              tags:
                - tag: scope
                  value: availability
        - uuid: 1e5a9edffef04adcb33b55e783d890e0
          name: 'ICMP loss'
          type: SIMPLE
          key: icmppingloss
          value_type: FLOAT
          units: '%'
          description: 'The percentage of lost packets.'
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: 94156142d19345958ba3846a7c949804
              expression: 'min(/Brocade 6505 by SNMPv3/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/Brocade 6505 by SNMPv3/icmppingloss,5m)<100'
              name: 'Brocade 6505: High ICMP ping loss'
              opdata: 'Loss: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'ICMP packets loss detected.'
              dependencies:
                - name: 'Brocade 6505: Unavailable by ICMP ping'
                  expression: 'max(/Brocade 6505 by SNMPv3/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: f1136d027d734e0ab6f9702f1dcf6799
          name: 'ICMP response time'
          type: SIMPLE
          key: icmppingsec
          value_type: FLOAT
          units: s
          description: 'The ICMP ping response time (in seconds).'
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: 5f83edc3d5004fe3bec8d42f08b639e6
              expression: 'avg(/Brocade 6505 by SNMPv3/icmppingsec,5m)>{$ICMP_RESPONSE_TIME_WARN}'
              name: 'Brocade 6505: High ICMP ping response time'
              opdata: 'Value: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'Average ICMP response time is too high.'
              dependencies:
                - name: 'Brocade 6505: High ICMP ping loss'
                  expression: 'min(/Brocade 6505 by SNMPv3/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/Brocade 6505 by SNMPv3/icmppingloss,5m)<100'
                - name: 'Brocade 6505: Unavailable by ICMP ping'
                  expression: 'max(/Brocade 6505 by SNMPv3/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: 89ca0669c9cc40e1bc9fb3d76c71a680
          name: 'SNMP traps (fallback)'
          type: SNMP_TRAP
          key: snmptrap.fallback
          value_type: LOG
          description: 'The item is used to collect all SNMP traps unmatched by other snmptrap items'
          logtimefmt: 'hh:mm:sszyyyy/MM/dd'
          tags:
            - tag: component
              value: network
        - uuid: dc7237b38f3c43f8a43fba4eb8b615b9
          name: 'System contact details'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.4.0]'
          key: 'system.contact[sysContact.0]'
          delay: 15m
          value_type: CHAR
          description: |
            MIB: SNMPv2-MIB
            The textual identification of the contact person for this managed node, together with information on how to contact this person. If no contact information is known, the value is the zero-length string.
          inventory_link: CONTACT
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: component
              value: system
        - uuid: beac5c455f294bce8b941fc565024e01
          name: 'CPU utilization'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.1588.2.1.1.1.26.1.0]'
          key: 'system.cpu.util[swCpuUsage.0]'
          value_type: FLOAT
          units: '%'
          description: |
            MIB: SW-MIB
            System's CPU usage.
          tags:
            - tag: component
              value: cpu
          triggers:
            - uuid: 4dd9e8b63dd44a35b89a7c29133a77cb
              expression: 'min(/Brocade 6505 by SNMPv3/system.cpu.util[swCpuUsage.0],5m)>{$CPU.UTIL.CRIT}'
              name: 'Brocade 6505: High CPU utilization'
              event_name: 'Brocade 6505: High CPU utilization (over {$CPU.UTIL.CRIT}% for 5m)'
              opdata: 'Current utilization: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'The CPU utilization is too high. The system might be slow to respond.'
              tags:
                - tag: scope
                  value: performance
        - uuid: 4253dbde22e540148ee138cb228c2596
          name: 'System description'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.1.0]'
          key: 'system.descr[sysDescr.0]'
          delay: 15m
          value_type: CHAR
          description: |
            MIB: SNMPv2-MIB
            A textual description of the entity. This value should
            include the full name and version identification of the system's hardware type, software operating-system, and
            networking software.
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: component
              value: system
        - uuid: eb2535738240475891d357f43ef0ca4c
          name: 'Firmware version'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.1588.2.1.1.1.1.6.0]'
          key: system.hw.firmware
          delay: 1h
          value_type: CHAR
          description: 'MIB: SW-MIB'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: b0e7ae3a33f64dfab3eb56e93ba8b3c1
              expression: 'last(/Brocade 6505 by SNMPv3/system.hw.firmware,#1)<>last(/Brocade 6505 by SNMPv3/system.hw.firmware,#2) and length(last(/Brocade 6505 by SNMPv3/system.hw.firmware))>0'
              name: 'Brocade 6505: Firmware has changed'
              opdata: 'Current value: {ITEM.LASTVALUE1}'
              priority: INFO
              description: 'Firmware version has changed. Acknowledge to close the problem manually.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
        - uuid: 6241076fc84a442e94d256374ebd439c
          name: 'Factory serial number'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.1588.2.1.1.1.1.10.0]'
          key: system.hw.serialnumber
          delay: 1h
          value_type: CHAR
          description: 'MIB: SW-MIB'
          inventory_link: SERIALNO_A
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: 286dad0790914b8298580c84e2cb6a00
              expression: 'last(/Brocade 6505 by SNMPv3/system.hw.serialnumber,#1)<>last(/Brocade 6505 by SNMPv3/system.hw.serialnumber,#2) and length(last(/Brocade 6505 by SNMPv3/system.hw.serialnumber))>0'
              name: 'Brocade 6505: Device has been replaced'
              event_name: 'Brocade 6505: Device has been replaced (new serial number received)'
              priority: INFO
              description: 'Device serial number has changed. Acknowledge to close the problem manually.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
        - uuid: 126ced917efa40cc81e3b3b0ea04f297
          name: 'Uptime (hardware)'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.25.1.1.0]'
          key: 'system.hw.uptime[hrSystemUptime.0]'
          delay: 30s
          status: DISABLED
          trends: '0'
          units: uptime
          description: |
            MIB: HOST-RESOURCES-MIB
            The amount of time since this host was last initialized, that is since the device booted.
            Different from sysUpTime in SNMPv2-MIB, which only counts from the last restart of the
            SNMP agent: restarting the management daemon resets sysUpTime but not this object.

            DISABLED by default. Fabric OS does not implement HOST-RESOURCES-MIB on the releases this
            template was tested against - the switch answers noSuchName for this OID. The "Host has
            been restarted" trigger therefore reads sysUpTime alone. Check your firmware with
            snmpget -v2c -c <community> <switch> 1.3.6.1.2.1.25.1.1.0
            and if it returns a value, enable this item and add it back to the trigger expression:
            it is the better source, because it survives a restart of the SNMP agent.

            TimeTicks is an unsigned 32-bit count of hundredths of a second, so the value runs out
            after 2^32-1 ticks = 497 days and starts again from zero with no reboot involved.
            The "Host has been restarted" trigger guards against that with {$UPTIME.WRAP.THRESHOLD}.
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: system
        - uuid: 142bb53bb29f4128906980c298c17776
          name: 'System location'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.6.0]'
          key: 'system.location[sysLocation.0]'
          delay: 15m
          value_type: CHAR
          description: |
            MIB: SNMPv2-MIB
            Physical location of the node (e.g., `equipment room`, `3rd floor`). If not provided, the value is a zero-length string.
          inventory_link: LOCATION
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: component
              value: system
        - uuid: d057d4e486a740ea848593e97af75f23
          name: 'System name'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.5.0]'
          key: system.name
          delay: 15m
          value_type: CHAR
          description: |
            MIB: SNMPv2-MIB
            An administratively-assigned name for this managed node.By convention, this is the node's fully-qualified domain name. If the name is unknown, the value is the zero-length string.
          inventory_link: NAME
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: 7638115a1ee84f8f9767b52f16bcc5d5
              expression: 'last(/Brocade 6505 by SNMPv3/system.name,#1)<>last(/Brocade 6505 by SNMPv3/system.name,#2) and length(last(/Brocade 6505 by SNMPv3/system.name))>0'
              name: 'Brocade 6505: System name has changed'
              event_name: 'Brocade 6505: System name has changed (new name: {ITEM.VALUE})'
              priority: INFO
              description: 'The name of the system has changed. Acknowledge to close the problem manually.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
                - tag: scope
                  value: security
        - uuid: 30f53fedaa6e4214a71c86f122649fd9
          name: 'Uptime (network)'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.3.0]'
          key: 'system.net.uptime[sysUpTime.0]'
          delay: 30s
          trends: '0'
          units: uptime
          description: |
            MIB: SNMPv2-MIB
            Time since the network management portion of the system was last re-initialized, that is
            since the SNMP agent started. It is not the device uptime: restarting the SNMP daemon on
            the switch resets this to zero while the switch keeps running. On Fabric OS the agent
            normally starts at boot, so in practice it tracks the boot time - until the agent is
            restarted on its own, for example by snmpconfig changes.

            Same 32-bit TimeTicks limit as the hardware uptime: it wraps to zero after 497 days.
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: system
        - uuid: b8bbbe73638246098568ce7da7803289
          name: 'System object ID'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.2.0]'
          key: 'system.objectid[sysObjectID.0]'
          delay: 15m
          value_type: CHAR
          description: |
            MIB: SNMPv2-MIB
            The vendor's authoritative identification of the network management subsystem contained in the entity. This value is allocated within the SMI enterprises subtree (1.3.6.1.4.1) and provides an easy and unambiguous means for determining`what kind of box' is being managed.  For example, if vendor`Flintstones, Inc.' was assigned the subtree1.3.6.1.4.1.4242, it could assign the identifier 1.3.6.1.4.1.4242.1.1 to its `Fred Router'.
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: component
              value: system
        - uuid: 4387d3a47536424ca133e905c7d810df
          name: 'Overall system health status'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.1588.2.1.1.1.1.7.0]'
          key: 'system.status[swOperStatus.0]'
          delay: 30s
          trends: '0'
          description: |
            MIB: SW-MIB
            The current operational status of the switch.The states are as follow:
            online(1) means the switch is accessible by an external Fibre Channel port
            offline(2) means the switch is not accessible
            testing(3) means the switch is in a built-in test mode and is not accessible by an external Fibre Channel port
            faulty(4) means the switch is not operational.
          valuemap:
            name: 'SW-MIB::swOperStatus'
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: e49a926d662f4c729eed60d09a96046f
              expression: 'count(/Brocade 6505 by SNMPv3/system.status[swOperStatus.0],#1,"eq","{$HEALTH_CRIT_STATUS}")=1'
              name: 'Brocade 6505: System status is in critical state'
              opdata: 'Current state: {ITEM.LASTVALUE1}'
              priority: HIGH
              description: 'Please check the device for errors'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
            - uuid: 9e4eab4dcdd744bcafb9631bec2c4d69
              expression: 'count(/Brocade 6505 by SNMPv3/system.status[swOperStatus.0],#1,"eq","{$HEALTH_WARN_STATUS:\"offline\"}")=1 or count(/Brocade 6505 by SNMPv3/system.status[swOperStatus.0],#1,"eq","{$HEALTH_WARN_STATUS:\"testing\"}")=1'
              name: 'Brocade 6505: System status is in warning state'
              opdata: 'Current state: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'Please check the device for warnings'
              dependencies:
                - name: 'Brocade 6505: System status is in critical state'
                  expression: 'count(/Brocade 6505 by SNMPv3/system.status[swOperStatus.0],#1,"eq","{$HEALTH_CRIT_STATUS}")=1'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: fba308e6b4c64d0fb3bb20fdba593e91
          name: 'Memory utilization'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.1588.2.1.1.1.26.6.0]'
          key: 'vm.memory.util[swMemUsage.0]'
          value_type: FLOAT
          units: '%'
          description: |
            MIB: SW-MIB
            Memory utilization in %.
          tags:
            - tag: component
              value: memory
          triggers:
            - uuid: 7a2824d12160460d9dc6779640e820ec
              expression: 'min(/Brocade 6505 by SNMPv3/vm.memory.util[swMemUsage.0],5m)>{$MEMORY.UTIL.MAX}'
              name: 'Brocade 6505: High memory utilization'
              event_name: 'Brocade 6505: High memory utilization (>{$MEMORY.UTIL.MAX}% for 5m)'
              priority: AVERAGE
              description: 'The system is running out of free memory.'
              tags:
                - tag: scope
                  value: capacity
                - tag: scope
                  value: performance
        - uuid: 00d3464d53de40359033b4b4bb6a568b
          name: 'SNMP agent availability'
          type: INTERNAL
          key: 'zabbix[host,snmp,available]'
          description: |
            Availability of SNMP checks on the host. The value of this item corresponds to availability icons in the host list.
            Possible values:
            0 - not available
            1 - available
            2 - unknown
          valuemap:
            name: zabbix.host.available
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: 579f76aa1c4247b88c9f6595e0e06db3
              expression: 'max(/Brocade 6505 by SNMPv3/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              name: 'Brocade 6505: No SNMP data collection'
              opdata: 'Current state: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'SNMP is not available for polling. Please check device connectivity and SNMP settings.'
              dependencies:
                - name: 'Brocade 6505: Unavailable by ICMP ping'
                  expression: 'max(/Brocade 6505 by SNMPv3/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
      discovery_rules:
        - uuid: 8e42237796e74c44bae5a0a078b1f0c9
          name: 'FAN Discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#SNMPVALUE},1.3.6.1.4.1.1588.2.1.1.1.1.22.1.1,{#SENSOR_TYPE},1.3.6.1.4.1.1588.2.1.1.1.1.22.1.2,{#SENSOR_INFO},1.3.6.1.4.1.1588.2.1.1.1.1.22.1.5,{#SENSOR_STATUS},1.3.6.1.4.1.1588.2.1.1.1.1.22.1.3]'
          key: fan.discovery
          delay: 1h
          description: |
            MIB: SW-MIB, swSensorTable (1.3.6.1.4.1.1588.2.1.1.1.1.22.1)
            Discovers fan sensors, swSensorType = fan(2). Rows whose swSensorStatus matches
            {$SENSOR.STATUS.NOT_MATCHES} are skipped: the table lists every sensor slot the platform
            can have, so a switch populated with one fan still exposes rows for the empty slots.
          filter:
            evaltype: AND
            conditions:
              - macro: '{#SENSOR_TYPE}'
                formulaid: A
                value: '2'
              - macro: '{#SENSOR_STATUS}'
                formulaid: B
                value: '{$SENSOR.STATUS.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  var rows = Array.isArray(data) ? data : data.data;
                  if (!Array.isArray(rows)) {
                      throw 'Expected an SNMP discovery array';
                  }
                  for (var i = 0; i < rows.length; i++) {
                      rows[i]['{#SENSOR_INFO}'] = String(rows[i]['{#SENSOR_INFO}'] || '').replace(/^\s+|\s+$/g, '');
                  }
                  return JSON.stringify(rows);
          item_prototypes:
            - uuid: f69b9e5d1bd4471399f2a453489948c8
              name: '{#SENSOR_INFO}: Fan speed'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.1588.2.1.1.1.1.22.1.4.{#SNMPINDEX}]'
              key: 'sensor.fan.speed[swSensorValue.{#SNMPINDEX}]'
              units: rpm
              description: |
                MIB: SW-MIB
                The current value (reading) of the sensor.
                The value, -2147483648, represents an unknown quantity.
                The fan value will be in RPM(revolution per minute)
              tags:
                - tag: component
                  value: fan
            - uuid: 7d2281e820ea473abb95443101203b87
              name: '{#SENSOR_INFO}: Fan status'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.1588.2.1.1.1.1.22.1.3.{#SNMPINDEX}]'
              key: 'sensor.fan.status[swSensorStatus.{#SNMPINDEX}]'
              delay: 3m
              trends: '0'
              description: 'MIB: SW-MIB'
              valuemap:
                name: 'SW-MIB::swSensorStatus'
              tags:
                - tag: component
                  value: fan
              trigger_prototypes:
                - uuid: 12874d0bd56d48eb95a0ff17ea971058
                  expression: 'count(/Brocade 6505 by SNMPv3/sensor.fan.status[swSensorStatus.{#SNMPINDEX}],#1,"eq","{$FAN_CRIT_STATUS}")=1'
                  name: 'Brocade 6505: {#SENSOR_INFO}: Fan is in critical state'
                  opdata: 'Current state: {ITEM.LASTVALUE1}'
                  priority: AVERAGE
                  description: |
                    Please check the fan unit.

                    Deliberately not a state-change trigger: faulty(2) is unambiguously a fault, never
                    an empty slot, so it must alert even for a fan that is already faulty the first
                    time it is polled. Close it manually to silence it until the fan leaves faulty(2).
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: availability
                    - tag: scope
                      value: performance
                - uuid: 2a6360ea11c04e09b961fe81d7b9166e
                  expression: 'count(/Brocade 6505 by SNMPv3/sensor.fan.status[swSensorStatus.{#SNMPINDEX}],#1,"ne","{$FAN_OK_STATUS}")=1 and (last(/Brocade 6505 by SNMPv3/sensor.fan.status[swSensorStatus.{#SNMPINDEX}],#1)<>last(/Brocade 6505 by SNMPv3/sensor.fan.status[swSensorStatus.{#SNMPINDEX}],#2))'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'count(/Brocade 6505 by SNMPv3/sensor.fan.status[swSensorStatus.{#SNMPINDEX}],#1,"eq","{$FAN_OK_STATUS}")=1'
                  name: 'Brocade 6505: {#SENSOR_INFO}: Fan is not in normal state'
                  opdata: 'Current state: {ITEM.LASTVALUE1}'
                  priority: INFO
                  description: |
                    Please check the fan unit.

                    Fires on the change out of nominal(4), not on the state itself, so a sensor that
                    simply sits in a non-nominal state - an empty slot reporting absent(6) - never
                    raises anything. The problem stays open until the sensor reports nominal(4) again
                    or you close it manually.

                    It needs two samples before it can be evaluated, so it stays Unknown for one poll
                    after the item is created.
                  manual_close: 'YES'
                  dependencies:
                    - name: 'Brocade 6505: {#SENSOR_INFO}: Fan is in critical state'
                      expression: 'count(/Brocade 6505 by SNMPv3/sensor.fan.status[swSensorStatus.{#SNMPINDEX}],#1,"eq","{$FAN_CRIT_STATUS}")=1'
                  tags:
                    - tag: scope
                      value: notice
        - uuid: 2bf57fc58e8a47c187f3029cf145b38d
          name: 'FC port discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#FCPORTADMSTATUS},1.3.6.1.4.1.1588.2.1.1.1.6.2.1.5,{#FCPORTPHYSTATE},1.3.6.1.4.1.1588.2.1.1.1.6.2.1.3,{#FCPORTNAME},1.3.6.1.4.1.1588.2.1.1.1.6.2.1.36,{#FCPORTSPEC},1.3.6.1.4.1.1588.2.1.1.1.6.2.1.37]'
          key: fcport.discovery
          delay: 1h
          filter:
            evaltype: AND
            conditions:
              - macro: '{#FCPORTADMSTATUS}'
                formulaid: A
                value: '{$FC.PORT.ADMSTATUS.MATCHES}'
              - macro: '{#FCPORTADMSTATUS}'
                formulaid: B
                value: '{$FC.PORT.ADMSTATUS.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
              - macro: '{#FCPORTLABEL}'
                formulaid: C
                value: '{$FC.PORT.NAME.MATCHES}'
              - macro: '{#FCPORTLABEL}'
                formulaid: D
                value: '{$FC.PORT.NAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
          description: |
            MIB: SW-MIB, swFCPortTable (1.3.6.1.4.1.1588.2.1.1.1.6.2.1)
            Discovers Fibre Channel ports from the vendor MIB instead of IF-MIB.
            Fabric OS does not expose the 64-bit IF-MIB counters (ifHCInOctets/ifHCOutOctets)
            for FC ports on every release; a poll then fails with noSuchName or noSuchObject.
            Traffic is therefore taken from swFCPortRxWords/swFCPortTxWords.
            {#SNMPINDEX} is swFCPortIndex and starts at 1, while the Fabric OS port number
            starts at 0, so swFCPortIndex 1 is port 0. {#FCPORTSPEC} carries the slot/port
            string reported by the switch and {#FCPORTNAME} the configured port name.
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  var rows = Array.isArray(data) ? data : data.data;
                  if (!Array.isArray(rows)) {
                      throw 'Expected an SNMP discovery array';
                  }
                  for (var i = 0; i < rows.length; i++) {
                      var row = rows[i];
                      row['{#FCPORTADMSTATUS}'] = row['{#FCPORTADMSTATUS}'] || '';
                      row['{#FCPORTPHYSTATE}'] = row['{#FCPORTPHYSTATE}'] || '';
                      row['{#FCPORTNAME}'] = row['{#FCPORTNAME}'] || '';
                      row['{#FCPORTSPEC}'] = row['{#FCPORTSPEC}'] || '';
                      row['{#FCPORTNUM}'] = String(Number(row['{#SNMPINDEX}']) - 1);
                      var label = row['{#FCPORTSPEC}'] || ('port' + row['{#FCPORTNUM}']);
                      if (row['{#FCPORTNAME}'] !== '' && row['{#FCPORTNAME}'] !== label) {
                          label = label + ' ' + row['{#FCPORTNAME}'];
                      }
                      row['{#FCPORTLABEL}'] = label;
                  }
                  return JSON.stringify(rows);
          item_prototypes:
            - uuid: bb0a1e1aa19f442ebf63c93c7dca6cfc
              name: 'FC port {#FCPORTLABEL}: Bits received'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.1588.2.1.1.1.6.2.1.12.{#SNMPINDEX}]'
              key: 'fcport.in[swFCPortRxWords.{#SNMPINDEX}]'
              delay: 1m
              status: DISABLED
              units: bps
              description: |
                MIB: SW-MIB
                swFCPortRxWords: the number of Fibre Channel words received by this port.
                One FC word is 4 bytes, so the per-second rate is multiplied by 32 to get bits per second.

                DISABLED by default. Fabric OS 8.x removed the 32-bit word counters from swFCPortTable;
                the switch then answers noSuchName for this OID. Check with
                snmpwalk <switch> 1.3.6.1.4.1.1588.2.1.1.1.6.2.1.12 and enable this prototype only on
                firmware that still implements it. On Fabric OS 8.x and later use the 64-bit octet
                counters of FCMGMT-MIB connUnitPortStatTable instead - see the README.

                The counter is 32-bit: at 8GFC line rate it wraps in about 21 seconds and at 16GFC
                in about 11 seconds. Zabbix drops the sample when a wrap is detected, so a fully loaded
                port shows gaps.
              preprocessing:
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '32'
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#FCPORTLABEL}'
                - tag: port
                  value: '{#FCPORTNUM}'
            - uuid: daee0c019a3b42a4b86f0c5ebb9e553a
              name: 'FC port {#FCPORTLABEL}: Bits sent'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.1588.2.1.1.1.6.2.1.11.{#SNMPINDEX}]'
              key: 'fcport.out[swFCPortTxWords.{#SNMPINDEX}]'
              delay: 1m
              status: DISABLED
              units: bps
              description: |
                MIB: SW-MIB
                swFCPortTxWords: the number of Fibre Channel words transmitted by this port.
                One FC word is 4 bytes, so the per-second rate is multiplied by 32 to get bits per second.

                DISABLED by default for the same reason as the receive counter: Fabric OS 8.x removed
                swFCPortTxWords from swFCPortTable. The same 32-bit counter wrap applies.
              preprocessing:
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '32'
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#FCPORTLABEL}'
                - tag: port
                  value: '{#FCPORTNUM}'
            - uuid: 33bcbf6c657c4a9e8b6c7c64a1d7700e
              name: 'FC port {#FCPORTLABEL}: Frames received'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.1588.2.1.1.1.6.2.1.14.{#SNMPINDEX}]'
              key: 'fcport.in.frames[swFCPortRxFrames.{#SNMPINDEX}]'
              delay: 1m
              units: fps
              description: |
                MIB: SW-MIB
                swFCPortRxFrames: the number of Fibre Channel frames received by this port.
                Frame rate, not a bit rate: an FC frame carries between 0 and 2112 bytes of payload,
                so this cannot be converted to bandwidth. Fabric OS keeps this counter on releases
                where the word counters were removed, which makes it the traffic indicator that is
                always available from swFCPortTable.
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#FCPORTLABEL}'
                - tag: port
                  value: '{#FCPORTNUM}'
            - uuid: 595895524ef94205816375e97136e42d
              name: 'FC port {#FCPORTLABEL}: Frames sent'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.1588.2.1.1.1.6.2.1.13.{#SNMPINDEX}]'
              key: 'fcport.out.frames[swFCPortTxFrames.{#SNMPINDEX}]'
              delay: 1m
              units: fps
              description: |
                MIB: SW-MIB
                swFCPortTxFrames: the number of Fibre Channel frames transmitted by this port.
                Frame rate, not a bit rate. See the receive counter for details.
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#FCPORTLABEL}'
                - tag: port
                  value: '{#FCPORTNUM}'
            - uuid: be3fbc47ca604beeb0c80910d9a89981
              name: 'FC port {#FCPORTLABEL}: Port type'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.1588.2.1.1.1.6.2.1.39.{#SNMPINDEX}]'
              key: 'fcport.brcdtype[swFCPortBrcdType.{#SNMPINDEX}]'
              delay: 5m
              trends: '0'
              description: |
                MIB: SW-MIB
                swFCPortBrcdType: the Brocade port type, for example f-port for an attached host or
                storage array, e-port for an ISL to another switch, g-port when the type is not
                yet negotiated.
              valuemap:
                name: 'SW-MIB::swFCPortBrcdType'
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#FCPORTLABEL}'
                - tag: port
                  value: '{#FCPORTNUM}'
            - uuid: d4013c5f56fc49a59299850755b37936
              name: 'FC port {#FCPORTLABEL}: CRC errors'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.1588.2.1.1.1.6.2.1.22.{#SNMPINDEX}]'
              key: 'fcport.errors.crc[swFCPortRxCrcs.{#SNMPINDEX}]'
              delay: 1m
              description: |
                MIB: SW-MIB
                swFCPortRxCrcs: the number of CRC errors detected for frames received by this port.
                A rising rate usually means a bad cable, SFP or patch panel connection.
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#FCPORTLABEL}'
                - tag: port
                  value: '{#FCPORTNUM}'
            - uuid: 74a24807288048feb9f6558edc6c5d99
              name: 'FC port {#FCPORTLABEL}: Encoding errors outside of frames'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.1588.2.1.1.1.6.2.1.26.{#SNMPINDEX}]'
              key: 'fcport.errors.encout[swFCPortRxEncOutFrs.{#SNMPINDEX}]'
              delay: 1m
              description: |
                MIB: SW-MIB
                swFCPortRxEncOutFrs: the number of encoding or disparity errors received outside of frames.
                Together with CRC errors this points at physical layer problems.
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#FCPORTLABEL}'
                - tag: port
                  value: '{#FCPORTNUM}'
            - uuid: e340f05aeb7941928e2d92361a668484
              name: 'FC port {#FCPORTLABEL}: Class 3 frames discarded'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.1588.2.1.1.1.6.2.1.28.{#SNMPINDEX}]'
              key: 'fcport.discards.c3[swFCPortC3Discards.{#SNMPINDEX}]'
              delay: 1m
              description: |
                MIB: SW-MIB
                swFCPortC3Discards: the number of Class 3 frames the port discarded.
                Frames are dropped on timeout, which is typically caused by congestion
                or by a slow drain device behind this port.
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#FCPORTLABEL}'
                - tag: port
                  value: '{#FCPORTNUM}'
            - uuid: 208aab4bd2654f48b99d088ae8786236
              name: 'FC port {#FCPORTLABEL}: Transmit credit shortage'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.1588.2.1.1.1.6.2.1.20.{#SNMPINDEX}]'
              key: 'fcport.notxcredits[swFCPortNoTxCredits.{#SNMPINDEX}]'
              delay: 1m
              description: |
                MIB: SW-MIB
                swFCPortNoTxCredits: the number of times the transmit credit dropped to zero.
                A high rate means the attached device is not returning buffer credits fast enough.
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#FCPORTLABEL}'
                - tag: port
                  value: '{#FCPORTNUM}'
            - uuid: 37151d1d284b4091899dee9d6667812d
              name: 'FC port {#FCPORTLABEL}: Operational status'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.1588.2.1.1.1.6.2.1.4.{#SNMPINDEX}]'
              key: 'fcport.status[swFCPortOpStatus.{#SNMPINDEX}]'
              trends: '0'
              description: |
                MIB: SW-MIB
                swFCPortOpStatus: the operational status of the port.
                unknown(0), online(1) - up and running, offline(2) - no light or no sync,
                testing(3) - running in a diagnostic mode, faulty(4) - not operational.
              valuemap:
                name: 'SW-MIB::swFCPortOpStatus'
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#FCPORTLABEL}'
                - tag: port
                  value: '{#FCPORTNUM}'
              trigger_prototypes:
                - uuid: 53b68a29fb5d4b3a9f0c3ef1046fc05a
                  expression: '{$FC.PORTCONTROL:"{#FCPORTLABEL}"}=1 and last(/Brocade 6505 by SNMPv3/fcport.status[swFCPortOpStatus.{#SNMPINDEX}])<>1 and (last(/Brocade 6505 by SNMPv3/fcport.status[swFCPortOpStatus.{#SNMPINDEX}],#1)<>last(/Brocade 6505 by SNMPv3/fcport.status[swFCPortOpStatus.{#SNMPINDEX}],#2))'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'last(/Brocade 6505 by SNMPv3/fcport.status[swFCPortOpStatus.{#SNMPINDEX}])=1 or {$FC.PORTCONTROL:"{#FCPORTLABEL}"}=0'
                  name: 'Brocade 6505: FC port {#FCPORTLABEL}: Port is not online'
                  opdata: 'Current state: {ITEM.LASTVALUE1}'
                  priority: AVERAGE
                  description: |
                    The port left the online(1) state after having been in another state before,
                    so it does not fire for ports that were never online.
                    Set {$FC.PORTCONTROL:"<port label>"} to 0 to silence a port that is not in use.

                    WARNING: if closed manually it will not fire again on the next poll, because of .diff.
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: availability
            - uuid: d71be3d244bf4234b5ae3c04c4031076
              name: 'FC port {#FCPORTLABEL}: Physical state'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.1588.2.1.1.1.6.2.1.3.{#SNMPINDEX}]'
              key: 'fcport.phystate[swFCPortPhyState.{#SNMPINDEX}]'
              delay: 3m
              trends: '0'
              description: |
                MIB: SW-MIB
                swFCPortPhyState: the physical state of the port, for example noCard(1),
                noTransceiver(2), noLight(4), noSync(5) or inSync(6).
              valuemap:
                name: 'SW-MIB::swFCPortPhyState'
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#FCPORTLABEL}'
                - tag: port
                  value: '{#FCPORTNUM}'
            - uuid: 66052933e8c34c7cb19f67bed953b41c
              name: 'FC port {#FCPORTLABEL}: Speed'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.1588.2.1.1.1.6.2.1.35.{#SNMPINDEX}]'
              key: 'fcport.speed[swFCPortSpeed.{#SNMPINDEX}]'
              delay: 5m
              status: DISABLED
              trends: '0'
              description: |
                DISABLED by default. Fabric OS 8.x removed swFCPortSpeed together with the word
                counters; use "Speed, nominal bitrate" from FC port traffic discovery, which reads
                connUnitPortSpeed. Enable this only on firmware that still implements column 35.


                MIB: SW-MIB
                swFCPortSpeed: the baud rate of the port as an enumeration, not a bit rate.
                Some Fabric OS releases report auto-Negotiate(3) instead of the negotiated speed,
                and on releases where the object was dropped the switch answers noSuchName or
                noSuchObject. That case is mapped to unknown(7) instead of leaving the item
                unsupported, which sets the nominal bitrate to 0 and disables the bandwidth trigger.
              valuemap:
                name: 'SW-MIB::swFCPortSpeed'
              preprocessing:
                - type: CHECK_NOT_SUPPORTED
                  parameters:
                    - '-1'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '7'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#FCPORTLABEL}'
                - tag: port
                  value: '{#FCPORTNUM}'
            - uuid: 2858c21b214c4122890e393da5d726af
              name: 'FC port {#FCPORTLABEL}: Speed, nominal bitrate'
              type: DEPENDENT
              key: 'fcport.speed.bps[swFCPortSpeed.{#SNMPINDEX}]'
              value_type: FLOAT
              status: DISABLED
              trends: '0'
              units: bps
              description: |
                The nominal one-way data rate that matches swFCPortSpeed, used as the reference
                for the bandwidth utilization trigger: 1GFC 800 Mbps, 2GFC 1.6 Gbps, 4GFC 3.2 Gbps,
                8GFC 6.4 Gbps, 10GFC 9.6 Gbps, 16GFC 12.8 Gbps.
                auto-Negotiate(3) and unknown(7) map to 0, which disables the utilization trigger
                for that port because the real speed cannot be derived from this object.
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var rates = {
                          '1': 800000000,
                          '2': 1600000000,
                          '4': 3200000000,
                          '5': 6400000000,
                          '6': 9600000000,
                          '8': 12800000000
                      };
                      return rates[value.trim()] || 0;
              master_item:
                key: 'fcport.speed[swFCPortSpeed.{#SNMPINDEX}]'
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#FCPORTLABEL}'
                - tag: port
                  value: '{#FCPORTNUM}'
          trigger_prototypes:
            - uuid: f6a4b0618e864ccfbc16c1913cab8a07
              expression: |
                (avg(/Brocade 6505 by SNMPv3/fcport.in[swFCPortRxWords.{#SNMPINDEX}],15m)>({$FC.IF.UTIL.MAX:"{#FCPORTLABEL}"}/100)*last(/Brocade 6505 by SNMPv3/fcport.speed.bps[swFCPortSpeed.{#SNMPINDEX}]) or
                avg(/Brocade 6505 by SNMPv3/fcport.out[swFCPortTxWords.{#SNMPINDEX}],15m)>({$FC.IF.UTIL.MAX:"{#FCPORTLABEL}"}/100)*last(/Brocade 6505 by SNMPv3/fcport.speed.bps[swFCPortSpeed.{#SNMPINDEX}])) and
                last(/Brocade 6505 by SNMPv3/fcport.speed.bps[swFCPortSpeed.{#SNMPINDEX}])>0
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: |
                avg(/Brocade 6505 by SNMPv3/fcport.in[swFCPortRxWords.{#SNMPINDEX}],15m)<(({$FC.IF.UTIL.MAX:"{#FCPORTLABEL}"}-3)/100)*last(/Brocade 6505 by SNMPv3/fcport.speed.bps[swFCPortSpeed.{#SNMPINDEX}]) and
                avg(/Brocade 6505 by SNMPv3/fcport.out[swFCPortTxWords.{#SNMPINDEX}],15m)<(({$FC.IF.UTIL.MAX:"{#FCPORTLABEL}"}-3)/100)*last(/Brocade 6505 by SNMPv3/fcport.speed.bps[swFCPortSpeed.{#SNMPINDEX}])
              name: 'Brocade 6505: FC port {#FCPORTLABEL}: High bandwidth usage'
              event_name: 'Brocade 6505: FC port {#FCPORTLABEL}: High bandwidth usage (>{$FC.IF.UTIL.MAX:"{#FCPORTLABEL}"}%)'
              opdata: 'In: {ITEM.LASTVALUE1}, out: {ITEM.LASTVALUE3}, speed: {ITEM.LASTVALUE2}'
              status: DISABLED
              priority: WARNING
              description: 'The port is close to the nominal bitrate of its negotiated speed. DISABLED together with the swFCPortRxWords/swFCPortTxWords items it reads: enable all three only on firmware that still implements those counters. It is also inactive when the switch reports auto-Negotiate or unknown speed.'
              manual_close: 'YES'
              dependencies:
                - name: 'Brocade 6505: FC port {#FCPORTLABEL}: Port is not online'
                  expression: '{$FC.PORTCONTROL:"{#FCPORTLABEL}"}=1 and last(/Brocade 6505 by SNMPv3/fcport.status[swFCPortOpStatus.{#SNMPINDEX}])<>1 and (last(/Brocade 6505 by SNMPv3/fcport.status[swFCPortOpStatus.{#SNMPINDEX}],#1)<>last(/Brocade 6505 by SNMPv3/fcport.status[swFCPortOpStatus.{#SNMPINDEX}],#2))'
                  recovery_expression: 'last(/Brocade 6505 by SNMPv3/fcport.status[swFCPortOpStatus.{#SNMPINDEX}])=1 or {$FC.PORTCONTROL:"{#FCPORTLABEL}"}=0'
              tags:
                - tag: scope
                  value: performance
            - uuid: 2657debcce2d487b8cdad967906a92b5
              expression: |
                min(/Brocade 6505 by SNMPv3/fcport.errors.crc[swFCPortRxCrcs.{#SNMPINDEX}],5m)>{$FC.IF.ERRORS.WARN:"{#FCPORTLABEL}"}
                or min(/Brocade 6505 by SNMPv3/fcport.errors.encout[swFCPortRxEncOutFrs.{#SNMPINDEX}],5m)>{$FC.IF.ERRORS.WARN:"{#FCPORTLABEL}"}
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: |
                max(/Brocade 6505 by SNMPv3/fcport.errors.crc[swFCPortRxCrcs.{#SNMPINDEX}],5m)<{$FC.IF.ERRORS.WARN:"{#FCPORTLABEL}"}*0.8
                and max(/Brocade 6505 by SNMPv3/fcport.errors.encout[swFCPortRxEncOutFrs.{#SNMPINDEX}],5m)<{$FC.IF.ERRORS.WARN:"{#FCPORTLABEL}"}*0.8
              name: 'Brocade 6505: FC port {#FCPORTLABEL}: High error rate'
              event_name: 'Brocade 6505: FC port {#FCPORTLABEL}: High error rate (>{$FC.IF.ERRORS.WARN:"{#FCPORTLABEL}"} for 5m)'
              opdata: 'CRC: {ITEM.LASTVALUE1}, encoding out: {ITEM.LASTVALUE2}'
              priority: WARNING
              description: 'CRC or encoding errors on the link. Check the cable, the SFP and the attached device. It recovers when both rates are below 80% of the `{$FC.IF.ERRORS.WARN:"{#FCPORTLABEL}"}` threshold.'
              manual_close: 'YES'
              dependencies:
                - name: 'Brocade 6505: FC port {#FCPORTLABEL}: Port is not online'
                  expression: '{$FC.PORTCONTROL:"{#FCPORTLABEL}"}=1 and last(/Brocade 6505 by SNMPv3/fcport.status[swFCPortOpStatus.{#SNMPINDEX}])<>1 and (last(/Brocade 6505 by SNMPv3/fcport.status[swFCPortOpStatus.{#SNMPINDEX}],#1)<>last(/Brocade 6505 by SNMPv3/fcport.status[swFCPortOpStatus.{#SNMPINDEX}],#2))'
                  recovery_expression: 'last(/Brocade 6505 by SNMPv3/fcport.status[swFCPortOpStatus.{#SNMPINDEX}])=1 or {$FC.PORTCONTROL:"{#FCPORTLABEL}"}=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
            - uuid: 115a5471d12a4acb891052333363498f
              expression: 'min(/Brocade 6505 by SNMPv3/fcport.discards.c3[swFCPortC3Discards.{#SNMPINDEX}],5m)>{$FC.C3DISCARD.WARN:"{#FCPORTLABEL}"}'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'max(/Brocade 6505 by SNMPv3/fcport.discards.c3[swFCPortC3Discards.{#SNMPINDEX}],5m)<{$FC.C3DISCARD.WARN:"{#FCPORTLABEL}"}*0.8'
              name: 'Brocade 6505: FC port {#FCPORTLABEL}: Class 3 frames are being discarded'
              event_name: 'Brocade 6505: FC port {#FCPORTLABEL}: Class 3 frames are being discarded (>{$FC.C3DISCARD.WARN:"{#FCPORTLABEL}"} for 5m)'
              opdata: 'Discards: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'Frames timed out before they could be transmitted. This is usually congestion or a slow drain device on this port.'
              manual_close: 'YES'
              dependencies:
