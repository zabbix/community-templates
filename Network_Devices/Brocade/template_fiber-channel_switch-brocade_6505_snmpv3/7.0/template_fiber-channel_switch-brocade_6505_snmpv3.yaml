            - uuid: 9244cefe497147758debf582daadc4bc
              name: 'Interface {#IFNAME}({#IFALIAS}): Operational status'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}]'
              key: 'net.if.status[ifOperStatus.{#SNMPINDEX}]'
              trends: '0'
              description: |
                MIB: IF-MIB
                The current operational state of the interface.
                - The testing(3) state indicates that no operational packet scan be passed
                - If ifAdminStatus is down(2) then ifOperStatus should be down(2)
                - If ifAdminStatus is changed to up(1) then ifOperStatus should change to up(1) if the interface is ready to transmit and receive network traffic
                - It should change todormant(5) if the interface is waiting for external actions (such as a serial line waiting for an incoming connection)
                - It should remain in the down(2) state if and only if there is a fault that prevents it from going to the up(1) state
                - It should remain in the notPresent(6) state if the interface has missing(typically, hardware) components.
              valuemap:
                name: 'IF-MIB::ifOperStatus'
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
              trigger_prototypes:
                - uuid: 3b4da8ea5fb64866bf4c8b766e63e397
                  expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/Brocade 6505 by SNMPv3/net.if.status[ifOperStatus.{#SNMPINDEX}])=2 and (last(/Brocade 6505 by SNMPv3/net.if.status[ifOperStatus.{#SNMPINDEX}],#1)<>last(/Brocade 6505 by SNMPv3/net.if.status[ifOperStatus.{#SNMPINDEX}],#2))'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'last(/Brocade 6505 by SNMPv3/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2 or {$IFCONTROL:"{#IFNAME}"}=0'
                  name: 'Brocade 6505: Interface {#IFNAME}({#IFALIAS}): Link down'
                  opdata: 'Current state: {ITEM.LASTVALUE1}'
                  priority: AVERAGE
                  description: |
                    This trigger expression works as follows:
                    1. It can be triggered if the operations status is down.
                    2. `{$IFCONTROL:"{#IFNAME}"}=1` - a user can redefine the context macro to "0", marking this interface as not important. No new trigger will be fired if this interface is down.
                    3. `{TEMPLATE_NAME:METRIC.diff()}=1` - the trigger fires only if the operational status was up to (1) sometime before (so, does not fire for "eternal off" interfaces.)
                    
                    WARNING: if closed manually - it will not fire again on the next poll, because of .diff.
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: availability
            - uuid: 784f7ac392fd432e8846eba63f89fc95
              name: 'Interface {#IFNAME}({#IFALIAS}): Interface type'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.2.2.1.3.{#SNMPINDEX}]'
              key: 'net.if.type[ifType.{#SNMPINDEX}]'
              delay: 1h
              trends: '0'
              description: |
                MIB: IF-MIB
                The type of interface.
                Additional values for ifType are assigned by the Internet Assigned Numbers Authority (IANA),
                through updating the syntax of the IANAifType textual convention.
              valuemap:
                name: 'IF-MIB::ifType'
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
          trigger_prototypes:
            - uuid: 2ba7862fa4fc452cb2f892c5fa60ec58
              expression: |
                change(/Brocade 6505 by SNMPv3/net.if.speed[ifHighSpeed.{#SNMPINDEX}])<0 and last(/Brocade 6505 by SNMPv3/net.if.speed[ifHighSpeed.{#SNMPINDEX}])>0
                and (
                last(/Brocade 6505 by SNMPv3/net.if.type[ifType.{#SNMPINDEX}])=6 or
                last(/Brocade 6505 by SNMPv3/net.if.type[ifType.{#SNMPINDEX}])=7 or
                last(/Brocade 6505 by SNMPv3/net.if.type[ifType.{#SNMPINDEX}])=11 or
                last(/Brocade 6505 by SNMPv3/net.if.type[ifType.{#SNMPINDEX}])=62 or
                last(/Brocade 6505 by SNMPv3/net.if.type[ifType.{#SNMPINDEX}])=69 or
                last(/Brocade 6505 by SNMPv3/net.if.type[ifType.{#SNMPINDEX}])=117
                )
                and
                (last(/Brocade 6505 by SNMPv3/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2)
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: |
                (change(/Brocade 6505 by SNMPv3/net.if.speed[ifHighSpeed.{#SNMPINDEX}])>0 and last(/Brocade 6505 by SNMPv3/net.if.speed[ifHighSpeed.{#SNMPINDEX}],#2)>0) or
                (last(/Brocade 6505 by SNMPv3/net.if.status[ifOperStatus.{#SNMPINDEX}])=2)
              name: 'Brocade 6505: Interface {#IFNAME}({#IFALIAS}): Ethernet has changed to lower speed than it was before'
              opdata: 'Current reported speed: {ITEM.LASTVALUE1}'
              priority: INFO
              description: 'This Ethernet connection has transitioned down from its known maximum speed. This might be a sign of autonegotiation issues. Acknowledge to close the problem manually.'
              manual_close: 'YES'
              dependencies:
                - name: 'Brocade 6505: Interface {#IFNAME}({#IFALIAS}): Link down'
                  expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/Brocade 6505 by SNMPv3/net.if.status[ifOperStatus.{#SNMPINDEX}])=2 and (last(/Brocade 6505 by SNMPv3/net.if.status[ifOperStatus.{#SNMPINDEX}],#1)<>last(/Brocade 6505 by SNMPv3/net.if.status[ifOperStatus.{#SNMPINDEX}],#2))'
                  recovery_expression: 'last(/Brocade 6505 by SNMPv3/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2 or {$IFCONTROL:"{#IFNAME}"}=0'
              tags:
                - tag: scope
                  value: performance
            - uuid: 6fbc02c0d94243f5a50c3b64b4c51b55
              expression: |
                (avg(/Brocade 6505 by SNMPv3/net.if.in[ifHCInOctets.{#SNMPINDEX}],15m)>({$IF.UTIL.MAX:"{#IFNAME}"}/100)*last(/Brocade 6505 by SNMPv3/net.if.speed[ifHighSpeed.{#SNMPINDEX}]) or
                avg(/Brocade 6505 by SNMPv3/net.if.out[ifHCOutOctets.{#SNMPINDEX}],15m)>({$IF.UTIL.MAX:"{#IFNAME}"}/100)*last(/Brocade 6505 by SNMPv3/net.if.speed[ifHighSpeed.{#SNMPINDEX}])) and
                last(/Brocade 6505 by SNMPv3/net.if.speed[ifHighSpeed.{#SNMPINDEX}])>0
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: |
                avg(/Brocade 6505 by SNMPv3/net.if.in[ifHCInOctets.{#SNMPINDEX}],15m)<(({$IF.UTIL.MAX:"{#IFNAME}"}-3)/100)*last(/Brocade 6505 by SNMPv3/net.if.speed[ifHighSpeed.{#SNMPINDEX}]) and
                avg(/Brocade 6505 by SNMPv3/net.if.out[ifHCOutOctets.{#SNMPINDEX}],15m)<(({$IF.UTIL.MAX:"{#IFNAME}"}-3)/100)*last(/Brocade 6505 by SNMPv3/net.if.speed[ifHighSpeed.{#SNMPINDEX}])
              name: 'Brocade 6505: Interface {#IFNAME}({#IFALIAS}): High bandwidth usage'
              event_name: 'Brocade 6505: Interface {#IFNAME}({#IFALIAS}): High bandwidth usage (>{$IF.UTIL.MAX:"{#IFNAME}"}%)'
              opdata: 'In: {ITEM.LASTVALUE1}, out: {ITEM.LASTVALUE3}, speed: {ITEM.LASTVALUE2}'
              priority: WARNING
              description: 'The utilization of the network interface is close to its estimated maximum bandwidth.'
              manual_close: 'YES'
              dependencies:
                - name: 'Brocade 6505: Interface {#IFNAME}({#IFALIAS}): Link down'
                  expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/Brocade 6505 by SNMPv3/net.if.status[ifOperStatus.{#SNMPINDEX}])=2 and (last(/Brocade 6505 by SNMPv3/net.if.status[ifOperStatus.{#SNMPINDEX}],#1)<>last(/Brocade 6505 by SNMPv3/net.if.status[ifOperStatus.{#SNMPINDEX}],#2))'
                  recovery_expression: 'last(/Brocade 6505 by SNMPv3/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2 or {$IFCONTROL:"{#IFNAME}"}=0'
              tags:
                - tag: scope
                  value: performance
            - uuid: 10be93f3dea64e7d9e32c72793de3a41
              expression: |
                min(/Brocade 6505 by SNMPv3/net.if.in.errors[ifInErrors.{#SNMPINDEX}],5m)>{$IF.ERRORS.WARN:"{#IFNAME}"}
                or min(/Brocade 6505 by SNMPv3/net.if.out.errors[ifOutErrors.{#SNMPINDEX}],5m)>{$IF.ERRORS.WARN:"{#IFNAME}"}
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: |
                max(/Brocade 6505 by SNMPv3/net.if.in.errors[ifInErrors.{#SNMPINDEX}],5m)<{$IF.ERRORS.WARN:"{#IFNAME}"}*0.8
                and max(/Brocade 6505 by SNMPv3/net.if.out.errors[ifOutErrors.{#SNMPINDEX}],5m)<{$IF.ERRORS.WARN:"{#IFNAME}"}*0.8
              name: 'Brocade 6505: Interface {#IFNAME}({#IFALIAS}): High error rate'
              event_name: 'Brocade 6505: Interface {#IFNAME}({#IFALIAS}): High error rate (>{$IF.ERRORS.WARN:"{#IFNAME}"} for 5m)'
              opdata: 'errors in: {ITEM.LASTVALUE1}, errors out: {ITEM.LASTVALUE2}'
              priority: WARNING
              description: 'It recovers when it is below 80% of the `{$IF.ERRORS.WARN:"{#IFNAME}"}` threshold.'
              manual_close: 'YES'
              dependencies:
                - name: 'Brocade 6505: Interface {#IFNAME}({#IFALIAS}): Link down'
                  expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/Brocade 6505 by SNMPv3/net.if.status[ifOperStatus.{#SNMPINDEX}])=2 and (last(/Brocade 6505 by SNMPv3/net.if.status[ifOperStatus.{#SNMPINDEX}],#1)<>last(/Brocade 6505 by SNMPv3/net.if.status[ifOperStatus.{#SNMPINDEX}],#2))'
                  recovery_expression: 'last(/Brocade 6505 by SNMPv3/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2 or {$IFCONTROL:"{#IFNAME}"}=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
          graph_prototypes:
            - uuid: c1098bb0b3194b8a96b4adbddb3484c5
              name: 'Interface {#IFNAME}({#IFALIAS}): Network traffic'
              graph_items:
                - drawtype: GRADIENT_LINE
                  color: 199C0D
                  item:
                    host: 'Brocade 6505 by SNMPv3'
                    key: 'net.if.in[ifHCInOctets.{#SNMPINDEX}]'
                - sortorder: '1'
                  drawtype: BOLD_LINE
                  color: F63100
                  item:
                    host: 'Brocade 6505 by SNMPv3'
                    key: 'net.if.out[ifHCOutOctets.{#SNMPINDEX}]'
                - sortorder: '2'
                  color: 00611C
                  yaxisside: RIGHT
                  item:
                    host: 'Brocade 6505 by SNMPv3'
                    key: 'net.if.out.errors[ifOutErrors.{#SNMPINDEX}]'
                - sortorder: '3'
                  color: F7941D
                  yaxisside: RIGHT
                  item:
                    host: 'Brocade 6505 by SNMPv3'
                    key: 'net.if.in.errors[ifInErrors.{#SNMPINDEX}]'
                - sortorder: '4'
                  color: FC6EA3
                  yaxisside: RIGHT
                  item:
                    host: 'Brocade 6505 by SNMPv3'
                    key: 'net.if.out.discards[ifOutDiscards.{#SNMPINDEX}]'
                - sortorder: '5'
                  color: 6C59DC
                  yaxisside: RIGHT
                  item:
                    host: 'Brocade 6505 by SNMPv3'
                    key: 'net.if.in.discards[ifInDiscards.{#SNMPINDEX}]'
        - uuid: d843af14957144adb09a8ae4ea291550
          name: 'PSU Discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#SNMPVALUE},1.3.6.1.4.1.1588.2.1.1.1.1.22.1.1,{#SENSOR_TYPE},1.3.6.1.4.1.1588.2.1.1.1.1.22.1.2,{#SENSOR_INFO},1.3.6.1.4.1.1588.2.1.1.1.1.22.1.5,{#SENSOR_STATUS},1.3.6.1.4.1.1588.2.1.1.1.1.22.1.3]'
          key: psu.discovery
          delay: 1h
          description: |
            MIB: SW-MIB, swSensorTable (1.3.6.1.4.1.1588.2.1.1.1.1.22.1)
            Discovers power supply sensors, swSensorType = power-supply(3). Rows whose swSensorStatus
            matches {$SENSOR.STATUS.NOT_MATCHES} are skipped, so the empty bays of a switch shipped
            with a single power supply do not turn into items that alarm at once.
          filter:
            evaltype: AND
            conditions:
              - macro: '{#SENSOR_TYPE}'
                formulaid: A
                value: '3'
              - macro: '{#SENSOR_STATUS}'
                formulaid: B
                value: '{$SENSOR.STATUS.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  var rows = Array.isArray(data) ? data : data.data;
                  if (!Array.isArray(rows)) {
                      throw 'Expected an SNMP discovery array';
                  }
                  for (var i = 0; i < rows.length; i++) {
                      rows[i]['{#SENSOR_INFO}'] = String(rows[i]['{#SENSOR_INFO}'] || '').replace(/^\s+|\s+$/g, '');
                  }
                  return JSON.stringify(rows);
          item_prototypes:
            - uuid: 16189d17d3a0488b920f13a7f92ce429
              name: '{#SENSOR_INFO}: Power supply status'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.1588.2.1.1.1.1.22.1.3.{#SNMPINDEX}]'
              key: 'sensor.psu.status[swSensorStatus.{#SNMPINDEX}]'
              delay: 3m
              trends: '0'
              description: 'MIB: SW-MIB'
              valuemap:
                name: 'SW-MIB::swSensorStatus'
              tags:
                - tag: component
                  value: power
              trigger_prototypes:
                - uuid: 8b33039bd718404ebcf26df02d573ffa
                  expression: 'count(/Brocade 6505 by SNMPv3/sensor.psu.status[swSensorStatus.{#SNMPINDEX}],#1,"eq","{$PSU_CRIT_STATUS}")=1'
                  name: 'Brocade 6505: {#SENSOR_INFO}: Power supply is in critical state'
                  opdata: 'Current state: {ITEM.LASTVALUE1}'
                  priority: AVERAGE
                  description: |
                    Please check the power supply unit for errors.

                    Deliberately not a state-change trigger: faulty(2) is unambiguously a fault, never
                    an empty bay, so it must alert even for a unit that is already faulty the first
                    time it is polled. Close it manually to silence it until it leaves faulty(2).
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: availability
                    - tag: scope
                      value: performance
                - uuid: 70997034aee1477bbc464bbaa5cdd71e
                  expression: 'count(/Brocade 6505 by SNMPv3/sensor.psu.status[swSensorStatus.{#SNMPINDEX}],#1,"ne","{$PSU_OK_STATUS}")=1 and (last(/Brocade 6505 by SNMPv3/sensor.psu.status[swSensorStatus.{#SNMPINDEX}],#1)<>last(/Brocade 6505 by SNMPv3/sensor.psu.status[swSensorStatus.{#SNMPINDEX}],#2))'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'count(/Brocade 6505 by SNMPv3/sensor.psu.status[swSensorStatus.{#SNMPINDEX}],#1,"eq","{$PSU_OK_STATUS}")=1'
                  name: 'Brocade 6505: {#SENSOR_INFO}: Power supply is not in normal state'
                  opdata: 'Current state: {ITEM.LASTVALUE1}'
                  priority: INFO
                  description: |
                    Please check the power supply unit for errors.

                    Fires on the change out of nominal(4), not on the state itself, so a bay that
                    simply sits in a non-nominal state - an empty bay reporting absent(6) - never
                    raises anything. The problem stays open until the sensor reports nominal(4) again
                    or you close it manually.

                    It needs two samples before it can be evaluated, so it stays Unknown for one poll
                    after the item is created.
                  manual_close: 'YES'
                  dependencies:
                    - name: 'Brocade 6505: {#SENSOR_INFO}: Power supply is in critical state'
                      expression: 'count(/Brocade 6505 by SNMPv3/sensor.psu.status[swSensorStatus.{#SNMPINDEX}],#1,"eq","{$PSU_CRIT_STATUS}")=1'
                  tags:
                    - tag: scope
                      value: notice
        - uuid: bc3ef08b1aff475dad76a5ece035aa9a
          name: 'Temperature Discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#SNMPVALUE},1.3.6.1.4.1.1588.2.1.1.1.1.22.1.1,{#SENSOR_TYPE},1.3.6.1.4.1.1588.2.1.1.1.1.22.1.2,{#SENSOR_INFO},1.3.6.1.4.1.1588.2.1.1.1.1.22.1.5,{#SENSOR_STATUS},1.3.6.1.4.1.1588.2.1.1.1.1.22.1.3]'
          key: temperature.discovery
          delay: 1h
          description: |
            MIB: SW-MIB, swSensorTable (1.3.6.1.4.1.1588.2.1.1.1.1.22.1)
