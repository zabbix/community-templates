          filter:
            evaltype: AND
            conditions:
              - macro: '{#SENSOR_TYPE}'
                formulaid: A
                value: '1'
              - macro: '{#SENSOR_STATUS}'
                formulaid: B
                value: '{$SENSOR.STATUS.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  var rows = Array.isArray(data) ? data : data.data;
                  if (!Array.isArray(rows)) {
                      throw 'Expected an SNMP discovery array';
                  }
                  for (var i = 0; i < rows.length; i++) {
                      rows[i]['{#SENSOR_INFO}'] = String(rows[i]['{#SENSOR_INFO}'] || '').replace(/^\s+|\s+$/g, '');
                  }
                  return JSON.stringify(rows);
          item_prototypes:
            - uuid: 932aa9ff30ba423390a40846c8c83333
              name: '{#SENSOR_INFO}: Temperature status'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.1588.2.1.1.1.1.22.1.3.{#SNMPINDEX}]'
              key: 'sensor.temp.status[swSensorStatus.{#SNMPINDEX}]'
              delay: 3m
              trends: '0'
              description: |
                MIB: SW-MIB
                Temperature status of testpoint: {#SENSOR_INFO}
              valuemap:
                name: 'SW-MIB::swSensorStatus'
              tags:
                - tag: component
                  value: temperature
            - uuid: dd2a941c11b1446cba66a6706d20604e
              name: '{#SENSOR_INFO}: Temperature'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.1588.2.1.1.1.1.22.1.4.{#SNMPINDEX}]'
              key: 'sensor.temp.value[swSensorValue.{#SNMPINDEX}]'
              delay: 3m
              value_type: FLOAT
              units: °C
              description: |
                MIB: SW-MIB
                Temperature readings of testpoint: {#SENSOR_INFO}
              tags:
                - tag: component
                  value: temperature
              trigger_prototypes:
                - uuid: ce3f975c53494991955050eb3291494a
                  expression: 'avg(/Brocade 6505 by SNMPv3/sensor.temp.value[swSensorValue.{#SNMPINDEX}],5m)>{$TEMP_CRIT:"{#SENSOR_INFO}"}'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'max(/Brocade 6505 by SNMPv3/sensor.temp.value[swSensorValue.{#SNMPINDEX}],5m)<{$TEMP_CRIT:"{#SENSOR_INFO}"}-3'
                  name: 'Brocade 6505: {#SENSOR_INFO}: Temperature is above critical threshold'
                  event_name: 'Brocade 6505: {#SENSOR_INFO}: Temperature is above critical threshold: >{$TEMP_CRIT:"{#SENSOR_INFO}"}'
                  opdata: 'Current value: {ITEM.LASTVALUE1}'
                  priority: HIGH
                  description: 'This trigger uses temperature sensor values as well as temperature sensor status if available'
                  tags:
                    - tag: scope
                      value: availability
                    - tag: scope
                      value: performance
                - uuid: 5edb9c59bf48443191c934f2ea223272
                  expression: 'avg(/Brocade 6505 by SNMPv3/sensor.temp.value[swSensorValue.{#SNMPINDEX}],5m)<{$TEMP_CRIT_LOW:"{#SENSOR_INFO}"}'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'min(/Brocade 6505 by SNMPv3/sensor.temp.value[swSensorValue.{#SNMPINDEX}],5m)>{$TEMP_CRIT_LOW:"{#SENSOR_INFO}"}+3'
                  name: 'Brocade 6505: {#SENSOR_INFO}: Temperature is too low'
                  event_name: 'Brocade 6505: {#SENSOR_INFO}: Temperature is too low: <{$TEMP_CRIT_LOW:"{#SENSOR_INFO}"}'
                  opdata: 'Current value: {ITEM.LASTVALUE1}'
                  priority: AVERAGE
                  tags:
                    - tag: scope
                      value: availability
                    - tag: scope
                      value: performance
          trigger_prototypes:
            - uuid: 943a81a4d4b84a749661f41f3185ca2f
              expression: |
                avg(/Brocade 6505 by SNMPv3/sensor.temp.value[swSensorValue.{#SNMPINDEX}],5m)>{$TEMP_WARN:"{#SENSOR_INFO}"}
                or
                last(/Brocade 6505 by SNMPv3/sensor.temp.status[swSensorStatus.{#SNMPINDEX}])={$TEMP_WARN_STATUS}
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'max(/Brocade 6505 by SNMPv3/sensor.temp.value[swSensorValue.{#SNMPINDEX}],5m)<{$TEMP_WARN:"{#SENSOR_INFO}"}-3'
              name: 'Brocade 6505: {#SENSOR_INFO}: Temperature is above warning threshold'
              event_name: 'Brocade 6505: {#SENSOR_INFO}: Temperature is above warning threshold: >{$TEMP_WARN:"{#SENSOR_INFO}"}'
              opdata: 'Current value: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'This trigger uses temperature sensor values as well as temperature sensor status if available'
              dependencies:
                - name: 'Brocade 6505: {#SENSOR_INFO}: Temperature is above critical threshold'
                  expression: 'avg(/Brocade 6505 by SNMPv3/sensor.temp.value[swSensorValue.{#SNMPINDEX}],5m)>{$TEMP_CRIT:"{#SENSOR_INFO}"}'
                  recovery_expression: 'max(/Brocade 6505 by SNMPv3/sensor.temp.value[swSensorValue.{#SNMPINDEX}],5m)<{$TEMP_CRIT:"{#SENSOR_INFO}"}-3'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
      tags:
        - tag: class
          value: network
        - tag: target
          value: brocade
        - tag: target
          value: brocade-fc
      macros:
