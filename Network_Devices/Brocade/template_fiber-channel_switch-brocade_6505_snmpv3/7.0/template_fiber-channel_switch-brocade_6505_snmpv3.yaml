          description: 'FC port discovery exclusion filter on the generated port label.'
        - macro: '{$FC.SPEED.PAYLOAD.RATIO}'
          value: '0.8'
          description: 'Fraction of the port signalling rate that carries frame data, used as the 100% reference of the FC bandwidth trigger. 0.8 comes from 8b/10b encoding and matches the throughput the Fibre Channel standard publishes for every speed: 8GFC 800 MB/s, 16GFC 1600 MB/s, 32GFC 3200 MB/s. Can be used with the port number as context.'
        - macro: '{$FC.PORTCONTROL}'
          value: '1'
          description: 'Set {$FC.PORTCONTROL:"<port label>"}=0 to disable the "Port is not online" trigger for a port that is not in use.'
        - macro: '{$FC.TRAFFIC.PORT.MATCHES}'
          value: '^[0-9]+$'
          description: 'FC port traffic discovery filter on the Fabric OS port number derived from the connUnitPortStat index.'
        - macro: '{$FC.TRAFFIC.PORT.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
          description: 'Exclude ports from FC traffic discovery by number, for example ^(1[2-9]|2[0-3])$ to drop ports 12-23. connUnitPortStatTable has no administrative status column, so every port of the switch is discovered unless it is filtered here.'
        - macro: '{$HEALTH_CRIT_STATUS}'
          value: '4'
        - macro: '{$HEALTH_WARN_STATUS:"offline"}'
          value: '2'
        - macro: '{$HEALTH_WARN_STATUS:"testing"}'
          value: '3'
        - macro: '{$ICMP_LOSS_WARN}'
          value: '20'
          description: 'Warning threshold of ICMP packet loss in %.'
        - macro: '{$ICMP_RESPONSE_TIME_WARN}'
          value: '0.15'
          description: 'Warning threshold of the average ICMP response time in seconds.'
        - macro: '{$IF.ERRORS.WARN}'
          value: '2'
          description: 'Warning threshold of error packet rate. Can be used with interface name as context.'
        - macro: '{$IF.UTIL.MAX}'
          value: '90'
        - macro: '{$IFCONTROL}'
          value: '1'
        - macro: '{$MEMORY.UTIL.MAX}'
          value: '90'
        - macro: '{$NET.IF.IFADMINSTATUS.MATCHES}'
          value: '^.*'
        - macro: '{$NET.IF.IFADMINSTATUS.NOT_MATCHES}'
          value: ^2$
          description: 'Ignore down(2) administrative status'
        - macro: '{$NET.IF.IFALIAS.MATCHES}'
          value: '.*'
        - macro: '{$NET.IF.IFALIAS.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
        - macro: '{$NET.IF.IFDESCR.MATCHES}'
          value: '.*'
        - macro: '{$NET.IF.IFDESCR.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
        - macro: '{$NET.IF.IFNAME.MATCHES}'
          value: '^.*$'
        - macro: '{$NET.IF.IFNAME.NOT_MATCHES}'
          value: '(^Software Loopback Interface|^NULL[0-9.]*$|^[Ll]o[0-9.]*$|^[Ss]ystem$|^Nu[0-9.]*$|^veth[0-9a-z]+$|docker[0-9]+|br-[a-z0-9]{12})'
          description: 'Filter out loopbacks, nulls, docker veth links and docker0 bridge by default'
        - macro: '{$NET.IF.IFOPERSTATUS.MATCHES}'
          value: '^.*$'
        - macro: '{$NET.IF.IFOPERSTATUS.NOT_MATCHES}'
          value: ^6$
          description: 'Ignore notPresent(6)'
        - macro: '{$NET.IF.IFTYPE.MATCHES}'
          value: ^6$
          description: 'Discover Ethernet (6) interfaces only, which on this switch is the management port. Fibre Channel ports are covered by "FC port discovery" through SW-MIB, because Fabric OS does not answer the 64-bit IF-MIB counters for them on every release. Set to ^(6|56)$ to add the FC ports to IF-MIB discovery as well, after checking that snmpwalk on 1.3.6.1.2.1.31.1.1.1.6 returns values for those interfaces.'
        - macro: '{$NET.IF.IFTYPE.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
        - macro: '{$PSU_CRIT_STATUS}'
          value: '2'
        - macro: '{$PSU_OK_STATUS}'
          value: '4'
        - macro: '{$SENSOR.STATUS.NOT_MATCHES}'
          value: '^(1|6)$'
          description: 'swSensorStatus values that mean there is no hardware behind the sensor row, so fan, PSU and temperature discovery skip them: unknown(1) and absent(6). swSensorTable lists every sensor slot the platform can have, not only the ones populated, so a switch shipped with one fan and one power supply still exposes rows for the others. Without this filter those rows are discovered and immediately raise "is not in normal state". Set to CHANGE_IF_NEEDED to discover them anyway.'
        - macro: '{$SNMP.TIMEOUT}'
          value: 5m
          description: 'Time interval for the SNMP availability trigger.'
        - macro: '{$TEMP_CRIT}'
          value: '75'
        - macro: '{$TEMP_CRIT_LOW}'
          value: '5'
        - macro: '{$TEMP_WARN}'
          value: '65'
        - macro: '{$TEMP_WARN_STATUS}'
          value: '5'
        - macro: '{$UPTIME.WRAP.THRESHOLD}'
          value: 496d
          description: 'Uptime value above which a drop to zero is treated as the SNMP TimeTicks counter wrapping rather than a reboot. TimeTicks is an unsigned 32-bit count of hundredths of a second, so it runs out after 497 days.'
