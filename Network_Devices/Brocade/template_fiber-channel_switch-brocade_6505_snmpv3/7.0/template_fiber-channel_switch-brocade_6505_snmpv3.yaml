  triggers:
    - uuid: a82078258de94035894facd79376f84c
      expression: |
        last(/Brocade 6505 by SNMPv3/system.net.uptime[sysUpTime.0])<10m and
        max(/Brocade 6505 by SNMPv3/system.net.uptime[sysUpTime.0],15m)<{$UPTIME.WRAP.THRESHOLD}
      name: 'Brocade 6505: Host has been restarted'
      event_name: 'Brocade 6505: {HOST.NAME} has been restarted (uptime < 10m)'
      priority: WARNING
      description: |
        Uptime is less than 10 minutes.

        Reads sysUpTime only, because Fabric OS does not implement HOST-RESOURCES-MIB and the
        "Uptime (hardware)" item is disabled. That has one consequence to be aware of: sysUpTime
        counts from the last start of the SNMP agent, not from boot, so restarting the agent - for
        example after an snmpconfig change - looks like a reboot here. If your firmware does answer
        hrSystemUptime, enable that item and prefer it, since it is immune to that.

        SNMP TimeTicks is an unsigned 32-bit counter of hundredths of a second. It runs out after
        2^32-1 ticks, which is 497 days, and starts again from zero without the device having
        rebooted. The max() guard suppresses the alert when a value close to the wrap point was seen
        in the last 15 minutes, so the counter rolling over does not raise a false restart. The blind
        spot is a real reboot of a device whose uptime was already past {$UPTIME.WRAP.THRESHOLD}.
      manual_close: 'YES'
      dependencies:
        - name: 'Brocade 6505: No SNMP data collection'
          expression: 'max(/Brocade 6505 by SNMPv3/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
      tags:
        - tag: scope
          value: notice
