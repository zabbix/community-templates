zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: e5be8e009c61477ca38b16ae08352a19
      name: 自宅ラックテンプレート
  templates:
    - uuid: 99041a2603aa4dc6abbae31f9f2976a5
      template: ASUS-Router
      name: ASUS-Router
      description: 'ASUS RT-AX89X All-in-One Template: Single SSH Master (30s) collecting CPU, Memory, Ping, Uptime, LoadAvg, WAN IP, Thermal Zones (15), and Wi-Fi Quality (Clients, RSSI, SNR, Noise).'
      groups:
        - name: 自宅ラックテンプレート
      items:
        - uuid: 3cda1836157b4ba49e553f74421ebd1a
          name: CPU(idle)
          type: DEPENDENT
          key: cpu.idle
          delay: '0'
          value_type: FLOAT
          units: '%'
          preprocessing:
            - type: REGEX
              parameters:
                - 'CPU:.*?(\d+(?:\.\d+)?)%\s*idle'
                - \1
          master_item:
            key: 'ssh.run[router_master]'
          tags:
            - tag: component
              value: cpu
        - uuid: f1554c5177e341848756f2957acef3c9
          name: CPU(io)
          type: DEPENDENT
          key: cpu.io
          delay: '0'
          value_type: FLOAT
          units: '%'
          preprocessing:
            - type: REGEX
              parameters:
                - 'CPU:.*?(\d+(?:\.\d+)?)%\s*io'
                - \1
          master_item:
            key: 'ssh.run[router_master]'
          tags:
            - tag: component
              value: cpu
        - uuid: fe7884bfe08a4b49a3b6b5c8a9c75582
          name: CPU(irq)
          type: DEPENDENT
          key: cpu.irq
          delay: '0'
          value_type: FLOAT
          units: '%'
          preprocessing:
            - type: REGEX
              parameters:
                - 'CPU:.*?(\d+(?:\.\d+)?)%\s*irq'
                - \1
          master_item:
            key: 'ssh.run[router_master]'
          tags:
            - tag: component
              value: cpu
        - uuid: d59c5458917a403398f6a52e5967a686
          name: CPU(nic)
          type: DEPENDENT
          key: cpu.nic
          delay: '0'
          value_type: FLOAT
          units: '%'
          preprocessing:
            - type: REGEX
              parameters:
                - 'CPU:.*?(\d+(?:\.\d+)?)%\s*nic'
                - \1
          master_item:
            key: 'ssh.run[router_master]'
          tags:
            - tag: component
              value: cpu
        - uuid: 93aaf71c057a4524a512cca4832af934
          name: CPU(sirq)
          type: DEPENDENT
          key: cpu.sirq
          delay: '0'
          value_type: FLOAT
          units: '%'
          preprocessing:
            - type: REGEX
              parameters:
                - 'CPU:.*?(\d+(?:\.\d+)?)%\s*sirq'
                - \1
          master_item:
            key: 'ssh.run[router_master]'
          tags:
            - tag: component
              value: cpu
        - uuid: 6e4f86b1229944c78a68ccd849dc7a3c
          name: CPU(sys)
          type: DEPENDENT
          key: cpu.sys
          delay: '0'
          value_type: FLOAT
          units: '%'
          preprocessing:
            - type: REGEX
              parameters:
                - 'CPU:.*?(\d+(?:\.\d+)?)%\s*sys'
                - \1
          master_item:
            key: 'ssh.run[router_master]'
          tags:
            - tag: component
              value: cpu
        - uuid: 0ff6fd7f464d44d6a1ed35b6b2968785
          name: CPU(usr)
          type: DEPENDENT
          key: cpu.usr
          delay: '0'
          value_type: FLOAT
          units: '%'
          preprocessing:
            - type: REGEX
              parameters:
                - 'CPU:.*?(\d+(?:\.\d+)?)%\s*usr'
                - \1
          master_item:
            key: 'ssh.run[router_master]'
          tags:
            - tag: component
              value: cpu
        - uuid: b6b9531a69a541228c41ec93b20a3839
          name: 'CPU使用率 (Util)'
          type: DEPENDENT
          key: cpu.util
          delay: '0'
          value_type: FLOAT
          units: '%'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var m = value.match(/CPU:.*?(\d+(?:\.\d+)?)%\s*idle/);
                  if (m) {
                      var idle = parseFloat(m[1]);
                      return Math.max(0, Math.min(100, 100 - idle)).toFixed(1);
                  }
                  return null;
          master_item:
            key: 'ssh.run[router_master]'
          tags:
            - tag: component
              value: cpu
          triggers:
            - uuid: a727c70426ab408c9c50e477706d9630
              expression: 'min(/ASUS-Router/cpu.util,5m)>90'
              name: 'High CPU utilization on RT-AX89X (> 90% for 5m)'
              priority: WARNING
        - uuid: eb47145295a14b22a866364c4b8db01f
          name: Memory(buff)
          type: DEPENDENT
          key: mem.buff
          delay: '0'
          units: B
          preprocessing:
            - type: REGEX
              parameters:
                - 'Mem:.*?(\d+)K\s*buff'
                - \1
            - type: MULTIPLIER
              parameters:
                - '1024'
          master_item:
            key: 'ssh.run[router_master]'
          tags:
            - tag: component
              value: memory
        - uuid: 0e54a4ca777e4bb0a2d2d0508fd54cfc
          name: Memory(cached)
          type: DEPENDENT
          key: mem.cached
          delay: '0'
          units: B
          preprocessing:
            - type: REGEX
              parameters:
                - 'Mem:.*?(\d+)K\s*cached'
                - \1
            - type: MULTIPLIER
              parameters:
                - '1024'
          master_item:
            key: 'ssh.run[router_master]'
          tags:
            - tag: component
              value: memory
        - uuid: 7e3612fdcf3342289d9a2d620716e797
          name: Memory(free)
          type: DEPENDENT
          key: mem.free
          delay: '0'
          units: B
          preprocessing:
            - type: REGEX
              parameters:
                - 'Mem:.*?(\d+)K\s*free'
                - \1
            - type: MULTIPLIER
              parameters:
                - '1024'
          master_item:
            key: 'ssh.run[router_master]'
          tags:
            - tag: component
              value: memory
        - uuid: 988507124a64499eabd02e9354f872cf
          name: 'メモリ使用率 (%)'
          type: DEPENDENT
          key: mem.pused
          delay: '0'
          value_type: FLOAT
          units: '%'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var m = value.match(/Mem:\s*(\d+)K\s*used,\s*(\d+)K\s*free/);
                  if (m) {
                      var used = parseFloat(m[1]);
                      var free = parseFloat(m[2]);
                      var total = used + free;
                      return total > 0 ? ((used / total) * 100).toFixed(1) : 0;
                  }
                  return null;
          master_item:
            key: 'ssh.run[router_master]'
          tags:
            - tag: component
              value: memory
        - uuid: bbdb528ed8fa438ebb94a43fec9fd291
          name: Memory(shrd)
          type: DEPENDENT
          key: mem.shrd
          delay: '0'
          units: B
          preprocessing:
            - type: REGEX
              parameters:
                - 'Mem:.*?(\d+)K\s*shrd'
                - \1
            - type: MULTIPLIER
              parameters:
                - '1024'
          master_item:
            key: 'ssh.run[router_master]'
          tags:
            - tag: component
              value: memory
        - uuid: 3d9c790c772349ed8c0252ada1042821
          name: Memory(used)
          type: DEPENDENT
          key: mem.used
          delay: '0'
          units: B
          preprocessing:
            - type: REGEX
              parameters:
                - 'Mem:\s*(\d+)K\s*used'
                - \1
            - type: MULTIPLIER
              parameters:
                - '1024'
          master_item:
            key: 'ssh.run[router_master]'
          tags:
            - tag: component
              value: memory
        - uuid: 561f74428d37466b89ccd801de27dc54
          name: 'WAN IP アドレス'
          type: DEPENDENT
          key: net.wan.ip
          delay: '0'
          value_type: CHAR
          trends: '0'
          preprocessing:
            - type: REGEX
              parameters:
                - '===WANIP===\s*([0-9.]+)'
                - \1
          master_item:
            key: 'ssh.run[router_master]'
          tags:
            - tag: component
              value: network
          triggers:
            - uuid: 8e71d5cae5b64dd2a47615727d8d9f39
              expression: change(/ASUS-Router/net.wan.ip)=1
              name: 'WAN IP address changed on RT-AX89X'
              priority: INFO
        - uuid: 5a29133c564c42789114a75c7d9eff76
          name: 'google ping'
          type: DEPENDENT
          key: 'ssh.run[ping_to_google]'
          delay: '0'
          value_type: FLOAT
          units: s
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var m = value.match(/time=(\d+(?:\.\d+)?)\s*ms/);
                  return m ? (parseFloat(m[1]) / 1000.0).toFixed(4) : null;
          master_item:
            key: 'ssh.run[router_master]'
          tags:
            - tag: component
              value: network
        - uuid: 2739571323fe425e868e468217509f2a
          name: 'Router All-in-One Master Data'
          type: SSH
          key: 'ssh.run[router_master]'
          delay: 30s
          history: '0'
          value_type: TEXT
          trends: '0'
          params: |
            echo '===TOP==='
            top -b -n1 | head -n 5
            echo '===UPTIME==='
            cat /proc/uptime
            echo '===LOADAVG==='
            cat /proc/loadavg
            echo '===WANIP==='
            nvram get wan0_ipaddr
            echo '===PING==='
            ping -c 1 -W 2 google.com 2>&1
            echo '===THERMAL==='
            for z in /sys/class/thermal/thermal_zone*; do echo -n "$(basename $z)|"; tr -d '\n' < $z/type 2>/dev/null || echo -n "unknown"; echo -n "|"; cat $z/temp 2>/dev/null || echo 0; done
            echo '===WIFI_IW==='; iwconfig ath0 2>/dev/null | grep -E 'Signal level|Noise level|Bit Rate'; iwconfig ath1 2>/dev/null | grep -E 'Signal level|Noise level|Bit Rate'
            echo '===WIFI_STA5G==='; wlanconfig ath0 list sta 2>/dev/null
            echo '===WIFI_STA2G==='; wlanconfig ath1 list sta 2>/dev/null
          username: '{$SSH_USER}'
          password: '{$SSH_PASS}'
          description: 'Single SSH connection every 30s collecting all router metrics to minimize router CPU overhead.'
        - uuid: 9a3771bfb4ba4ecbb9a0d70aee3e7ab0
          name: 'ロードアベレージ (1分)'
          type: DEPENDENT
          key: 'system.cpu.load[percpu,avg1]'
          delay: '0'
          value_type: FLOAT
          preprocessing:
            - type: REGEX
              parameters:
                - '===LOADAVG===\s*(\S+)'
                - \1
          master_item:
            key: 'ssh.run[router_master]'
          tags:
            - tag: component
              value: system
        - uuid: e798455dae5240988666354f4c5cef0e
          name: 'ロードアベレージ (5分)'
          type: DEPENDENT
          key: 'system.cpu.load[percpu,avg5]'
          delay: '0'
          value_type: FLOAT
          preprocessing:
            - type: REGEX
              parameters:
                - '===LOADAVG===\s*\S+\s+(\S+)'
                - \1
          master_item:
            key: 'ssh.run[router_master]'
          tags:
            - tag: component
              value: system
        - uuid: c4d469226ecb4118bb21ae0fef42f532
          name: 'ロードアベレージ (15分)'
          type: DEPENDENT
          key: 'system.cpu.load[percpu,avg15]'
          delay: '0'
          value_type: FLOAT
          preprocessing:
            - type: REGEX
              parameters:
                - '===LOADAVG===\s*\S+\s+\S+\s+(\S+)'
                - \1
          master_item:
            key: 'ssh.run[router_master]'
          tags:
            - tag: component
              value: system
        - uuid: 2a38f53b648145b7bde9900215ceeea7
          name: 'システム稼働時間 (Uptime)'
          type: DEPENDENT
          key: system.uptime
          delay: '0'
          value_type: FLOAT
          units: uptime
          preprocessing:
            - type: REGEX
              parameters:
                - '===UPTIME===\s*(\d+(?:\.\d+)?)'
                - \1
          master_item:
            key: 'ssh.run[router_master]'
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: c5788239c53f44f1906262d0d8767fe6
              expression: last(/ASUS-Router/system.uptime)<10m
              name: 'RT-AX89X has been restarted (uptime < 10m)'
              priority: INFO
        - uuid: 5f50cea82e7c48d992ab3960bd889548
          name: 'Wi-Fi 接続台数 (5GHz)'
          type: DEPENDENT
          key: 'wifi.clients[5g]'
          delay: '0'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var pos = value.indexOf('===WIFI_STA5G===');
                  if (pos === -1) return 0;
                  var text = value.substring(pos + 16);
                  var endPos = text.indexOf('===');
                  if (endPos !== -1) text = text.substring(0, endPos);
                  var lines = text.trim().split('\n');
                  var count = 0;
                  for (var i = 0; i < lines.length; i++) {
                      if (lines[i].match(/^[0-9a-f]{2}:[0-9a-f]{2}:[0-9a-f]{2}/i)) count++;
                  }
                  return count;
          master_item:
            key: 'ssh.run[router_master]'
          tags:
            - tag: component
              value: wifi
        - uuid: d52c272b62b74bf692a5ad7a85dfa379
          name: 'Wi-Fi 接続台数 (2.4GHz)'
          type: DEPENDENT
          key: 'wifi.clients[24g]'
          delay: '0'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var pos = value.indexOf('===WIFI_STA2G===');
                  if (pos === -1) return 0;
                  var text = value.substring(pos + 16);
                  var lines = text.trim().split('\n');
                  var count = 0;
                  for (var i = 0; i < lines.length; i++) {
                      if (lines[i].match(/^[0-9a-f]{2}:[0-9a-f]{2}:[0-9a-f]{2}/i)) count++;
                  }
                  return count;
          master_item:
            key: 'ssh.run[router_master]'
          tags:
            - tag: component
              value: wifi
        - uuid: 1cb241c5a713461ead1efdf6fbab774a
          name: 'Wi-Fi 接続総端末数'
          type: CALCULATED
          key: 'wifi.clients[total]'
          params: 'last(//wifi.clients[5g]) + last(//wifi.clients[24g])'
          tags:
            - tag: component
              value: wifi
        - uuid: b558e25360bc4fa4880b8a0e687d5f79
          name: 'Wi-Fi フロアノイズ (5GHz)'
          type: DEPENDENT
          key: 'wifi.noise[5g]'
          delay: '0'
          value_type: FLOAT
          units: dBm
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var pos = value.indexOf('===WIFI_IW===');
                  if (pos === -1) return null;
                  var text = value.substring(pos);
                  var matches = text.match(/Noise level=(-?\d+)/);
                  return matches ? parseFloat(matches[1]) : null;
          master_item:
            key: 'ssh.run[router_master]'
          tags:
            - tag: component
              value: wifi
        - uuid: e4bc4eadbd2447739517a4fc3464da7f
          name: 'Wi-Fi フロアノイズ (2.4GHz)'
          type: DEPENDENT
          key: 'wifi.noise[24g]'
          delay: '0'
          value_type: FLOAT
          units: dBm
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var pos = value.indexOf('===WIFI_IW===');
                  if (pos === -1) return null;
                  var text = value.substring(pos);
                  var matches = text.match(/Noise level=(-?\d+)/g);
                  if (matches && matches.length >= 2) {
                      return parseFloat(matches[1].split('=')[1]);
                  }
                  return null;
          master_item:
            key: 'ssh.run[router_master]'
          tags:
            - tag: component
              value: wifi
        - uuid: d289ae50f2804fbc96101f4b2043a31a
          name: 'Wi-Fi 平均電波強度 RSSI (5GHz)'
          type: DEPENDENT
          key: 'wifi.rssi.avg[5g]'
          delay: '0'
          value_type: FLOAT
          units: dBm
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var pos = value.indexOf('===WIFI_STA5G===');
                  if (pos === -1) return null;
                  var text = value.substring(pos + 16);
                  var endPos = text.indexOf('===');
                  if (endPos !== -1) text = text.substring(0, endPos);
                  var lines = text.trim().split('\n');
                  var sum = 0, count = 0;
                  for (var i = 0; i < lines.length; i++) {
                      var m = lines[i].match(/^[0-9a-f]{2}:[0-9a-f]{2}:[0-9a-f]{2}:\S+\s+\d+\s+\d+\s+\S+\s+\S+\s+(-?\d+)/i);
                      if (m) {
                          sum += parseFloat(m[1]);
                          count++;
                      }
                  }
                  return count > 0 ? (sum / count).toFixed(1) : null;
          master_item:
            key: 'ssh.run[router_master]'
          tags:
            - tag: component
              value: wifi
        - uuid: aabf2544dba14018a42478e9d9728032
          name: 'Wi-Fi 平均電波強度 RSSI (2.4GHz)'
          type: DEPENDENT
          key: 'wifi.rssi.avg[24g]'
          delay: '0'
          value_type: FLOAT
          units: dBm
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var pos = value.indexOf('===WIFI_STA2G===');
                  if (pos === -1) return null;
                  var text = value.substring(pos + 16);
                  var lines = text.trim().split('\n');
                  var sum = 0, count = 0;
                  for (var i = 0; i < lines.length; i++) {
                      var m = lines[i].match(/^[0-9a-f]{2}:[0-9a-f]{2}:[0-9a-f]{2}:\S+\s+\d+\s+\d+\s+\S+\s+\S+\s+(-?\d+)/i);
                      if (m) {
                          sum += parseFloat(m[1]);
                          count++;
                      }
                  }
                  return count > 0 ? (sum / count).toFixed(1) : null;
          master_item:
            key: 'ssh.run[router_master]'
          tags:
            - tag: component
              value: wifi
        - uuid: 73dad442099b4a53abded117d987003c
          name: 'Wi-Fi 最低電波強度 RSSI (5GHz)'
          type: DEPENDENT
          key: 'wifi.rssi.min[5g]'
          delay: '0'
          value_type: FLOAT
          units: dBm
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var pos = value.indexOf('===WIFI_STA5G===');
                  if (pos === -1) return null;
                  var text = value.substring(pos + 16);
                  var endPos = text.indexOf('===');
                  if (endPos !== -1) text = text.substring(0, endPos);
                  var lines = text.trim().split('\n');
                  var minRssi = null;
                  for (var i = 0; i < lines.length; i++) {
                      var m = lines[i].match(/^[0-9a-f]{2}:[0-9a-f]{2}:[0-9a-f]{2}:\S+\s+\d+\s+\d+\s+\S+\s+\S+\s+(-?\d+)/i);
                      if (m) {
                          var val = parseFloat(m[1]);
                          if (minRssi === null || val < minRssi) minRssi = val;
                      }
                  }
                  return minRssi;
          master_item:
            key: 'ssh.run[router_master]'
          tags:
            - tag: component
              value: wifi
        - uuid: a00a355412e74f53a6d419095771ca84
          name: 'Wi-Fi 最低電波強度 RSSI (2.4GHz)'
          type: DEPENDENT
          key: 'wifi.rssi.min[24g]'
          delay: '0'
          value_type: FLOAT
          units: dBm
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var pos = value.indexOf('===WIFI_STA2G===');
                  if (pos === -1) return null;
                  var text = value.substring(pos + 16);
                  var lines = text.trim().split('\n');
                  var minRssi = null;
                  for (var i = 0; i < lines.length; i++) {
                      var m = lines[i].match(/^[0-9a-f]{2}:[0-9a-f]{2}:[0-9a-f]{2}:\S+\s+\d+\s+\d+\s+\S+\s+\S+\s+(-?\d+)/i);
                      if (m) {
                          var val = parseFloat(m[1]);
                          if (minRssi === null || val < minRssi) minRssi = val;
                      }
                  }
                  return minRssi;
          master_item:
            key: 'ssh.run[router_master]'
          tags:
            - tag: component
              value: wifi
        - uuid: 39c39ecc851841ed8503a588e57e75a3
          name: 'Wi-Fi 平均信号品質 SNR (5GHz)'
          type: DEPENDENT
          key: 'wifi.snr.avg[5g]'
          delay: '0'
          value_type: FLOAT
          units: dB
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var pos = value.indexOf('===WIFI_STA5G===');
                  if (pos === -1) return null;
                  var text = value.substring(pos + 16);
                  var endPos = text.indexOf('===');
                  if (endPos !== -1) text = text.substring(0, endPos);
                  var matches = text.match(/SNR\s*:\s*(\d+)/g);
                  if (!matches || matches.length === 0) return null;
                  var sum = 0;
                  for (var i = 0; i < matches.length; i++) {
                      sum += parseFloat(matches[i].split(':')[1].trim());
                  }
                  return (sum / matches.length).toFixed(1);
          master_item:
            key: 'ssh.run[router_master]'
          tags:
            - tag: component
              value: wifi
        - uuid: ffd027846d3b407893b64b6073cef45f
          name: 'Wi-Fi 平均信号品質 SNR (2.4GHz)'
          type: DEPENDENT
          key: 'wifi.snr.avg[24g]'
          delay: '0'
          value_type: FLOAT
          units: dB
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var pos = value.indexOf('===WIFI_STA2G===');
                  if (pos === -1) return null;
                  var text = value.substring(pos + 16);
                  var matches = text.match(/SNR\s*:\s*(\d+)/g);
                  if (!matches || matches.length === 0) return null;
                  var sum = 0;
                  for (var i = 0; i < matches.length; i++) {
                      sum += parseFloat(matches[i].split(':')[1].trim());
                  }
                  return (sum / matches.length).toFixed(1);
          master_item:
            key: 'ssh.run[router_master]'
          tags:
            - tag: component
              value: wifi
      discovery_rules:
        - uuid: b7dcc9c08de344ddb61ecd9d9343261c
          name: 'Thermal Zones Discovery'
          type: DEPENDENT
          key: thermal.discovery
          delay: '0'
          item_prototypes:
            - uuid: 4f7e2a91b4c845d098e21a4f891b2c34
              name: '温度: {#JPNAME}'
              type: DEPENDENT
              key: 'thermal.temp[{#ZONE}]'
              delay: '0'
              value_type: FLOAT
              units: ℃
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var pos = value.indexOf('===THERMAL===');
                      if (pos === -1) return null;
                      var text = value.substring(pos + 13);
                      var endPos = text.indexOf('===');
                      if (endPos !== -1) text = text.substring(0, endPos);
                      var lines = text.trim().split('\n');
                      for (var i = 0; i < lines.length; i++) {
                          var parts = lines[i].trim().split('|');
                          if (parts[0] === '{#ZONE}') {
                              var raw = parseFloat(parts[2]);
                              if (isNaN(raw) || raw < 0) return null;
                              if (raw > 200) raw = raw / 10.0;
                              if (raw > 150) return null;
                              return raw;
                          }
                      }
                      return null;
              master_item:
                key: 'ssh.run[router_master]'
              tags:
                - tag: component
                  value: temperature
                - tag: sensor
                  value: '{#JPNAME}'
              trigger_prototypes:
                - uuid: 4df73c936d454c00ab9094da26f46a05
                  expression: 'last(/ASUS-Router/thermal.temp[{#ZONE}])>{$AX89X.TEMP.WARN}'
                  name: 'RT-AX89X 高温警告: {#JPNAME} (> {$AX89X.TEMP.WARN}℃)'
                  priority: WARNING
                  description: '{#JPNAME} の温度が {$AX89X.TEMP.WARN} ℃を超過しました。'
          graph_prototypes:
            - uuid: 1a4f891b2c3445d098e24f7e2a91b4c8
              name: '温度推移: {#JPNAME}'
              graph_items:
                - color: 1F77B4
                  item:
                    host: ASUS-Router
                    key: 'thermal.temp[{#ZONE}]'
          master_item:
            key: 'ssh.run[router_master]'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var pos = value.indexOf('===THERMAL===');
                  if (pos === -1) return '[]';
                  var text = value.substring(pos + 13);
                  var endPos = text.indexOf('===');
                  if (endPos !== -1) text = text.substring(0, endPos);
                  var lines = text.trim().split('\n');
                  var data = [];
                  var map = {
                      'pa_therm1': '無線PA #1 (2.4GHz)',
                      'pa_therm2': '無線PA #2 (5GHz-1)',
                      'pa_therm3': '無線PA #3 (5GHz-2)',
                      'tsens_tz_sensor4': 'NSS パケット処理 (Top)',
                      'tsens_tz_sensor5': 'NSS コア 0',
                      'tsens_tz_sensor6': 'NSS コア 1',
                      'tsens_tz_sensor7': 'SoC 内部バス',
                      'tsens_tz_sensor8': 'SoC システム部',
                      'tsens_tz_sensor9': 'CPU コア 0',
                      'tsens_tz_sensor10': 'CPU コア 1',
                      'tsens_tz_sensor11': 'CPU コア 2',
                      'tsens_tz_sensor12': 'CPU コア 3',
                      'tsens_tz_sensor13': 'SoC チップセット #1',
                      'tsens_tz_sensor14': 'SoC チップセット #2',
                      'tsens_tz_sensor15': 'SoC チップセット #3'
                  };
                  for (var i = 0; i < lines.length; i++) {
                      var line = lines[i].trim();
                      if (!line) continue;
                      var parts = line.split('|');
                      if (parts.length >= 3 && parts[0].indexOf('thermal_zone') === 0) {
                          var zone = parts[0];
                          var type = parts[1];
                          var jpName = map[type] || type;
                          data.push({
                              '{#ZONE}': zone,
                              '{#TYPE}': type,
                              '{#JPNAME}': jpName
                          });
                      }
                  }
                  return JSON.stringify(data);
      macros:
        - macro: '{$AX89X.TEMP.WARN}'
          value: '80'
          description: 'Warning threshold for router temperatures in Celsius.'
        - macro: '{$SSH_PASS}'
          type: SECRET_TEXT
        - macro: '{$SSH_USER}'
