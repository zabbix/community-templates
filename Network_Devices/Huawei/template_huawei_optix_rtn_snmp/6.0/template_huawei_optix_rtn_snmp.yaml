          expression: last(/Huawei OptiX RTN by SNMP/rtn.alarm.severity[{#SNMPINDEX}])=3 and nodata(/Huawei OptiX RTN by SNMP/rtn.alarm.severity[{#SNMPINDEX}],{$RTN.ALARM.NODATA})=0 and count(/Huawei OptiX RTN by SNMP/rtn.alarm.severity[{#SNMPINDEX}],{$RTN.ALARM.MIN.ACTIVE})>={$RTN.ALARM.MIN.SAMPLES}
          name: '{#ALM.NAME} ({#ALM.LOCATION}) [minor]'
          priority: WARNING
          description: Active alarm on the NE (curAlmDataTable). It opens once the alarm has been seen in {$RTN.ALARM.MIN.SAMPLES} polls within {$RTN.ALARM.MIN.ACTIVE} (the alarm item is polled every minute), so short flaps do not raise problems. It clears when the alarm leaves the table.
    tags:
    - tag: class
      value: network
    - tag: target
      value: huawei-rtn
    macros:
    - macro: '{$RTN.INTERVAL.RADIO}'
      value: 1m
      description: Poll interval for radio values (ODU power, modulation, capacity).
    - macro: '{$RTN.INTERVAL.TRAFFIC}'
      value: 5m
      description: Poll interval for Ethernet/radio port traffic.
    - macro: '{$RTN.INTERVAL.PM}'
      value: 5m
      description: Poll interval for 15-minute performance values (RSL/TSL, SNR, MSE).
    - macro: '{$RTN.INTERVAL.STATUS}'
      value: 5m
      description: Poll interval for boards, temperatures and status values.
    - macro: '{$RTN.INTERVAL.ALARM}'
      value: 5m
      description: How often active alarms are discovered (Zabbix 6.0 template; each run loads the server's LLD workers).
    - macro: '{$RTN.INTERVAL.INVENTORY}'
      value: 1h
      description: Poll interval for configuration and inventory values.
    - macro: '{$RTN.INTERVAL.VERSION}'
      value: 1d
      description: Poll interval for board versions and ODU bar codes.
    - macro: '{$RTN.INTERVAL.SERVICE}'
      value: 1d
      description: Poll interval for E-LAN service settings and port VLAN lists.
    - macro: '{$RTN.SNMP.TIMEOUT}'
      value: 15s
      description: 'Zabbix 7 template only: timeout of the active-alarm walk (walk[] item). All other items use classic OIDs, which take the proxy''s Timeout= setting (set it to 15).'
    - macro: '{$RTN.ODU.RX.WARN}'
      value: '-65'
      description: RSL (dBm) below which a warning is raised. Per ODU with the ODU number as context, e.g. {$RTN.ODU.RX.WARN:27}.
    - macro: '{$RTN.ODU.RX.NOSIGNAL}'
      value: '-85'
      description: RSL (dBm) below which the link is considered down.
    - macro: '{$RTN.ODU.RX.DROP}'
      value: '10'
      description: RSL drop (dB) below the 1-day average that raises a warning.
    - macro: '{$RTN.RSL.FADE}'
      value: '10'
      description: Gap (dB) between 15-minute average and minimum RSL that counts as fading.
    - macro: '{$RTN.TEMP.MARGIN}'
      value: '10'
      description: Warn when a board is within this many °C of its own high threshold.
    - macro: '{$RTN.ETH.UTIL.WARN}'
      value: '70'
      description: Port utilization (%) that raises a Warning after {$RTN.ETH.UTIL.PERIOD}. Per port with slot/port as context, e.g. {$RTN.ETH.UTIL.WARN:17/5}.
    - macro: '{$RTN.ETH.UTIL.HIGH}'
      value: '80'
      description: Port utilization (%) that raises an Average problem after {$RTN.ETH.UTIL.PERIOD}. Per port, e.g. {$RTN.ETH.UTIL.HIGH:17/5}.
    - macro: '{$RTN.ETH.UTIL.PERIOD}'
      value: 5m
      description: How long utilization must stay above a level before a problem opens.
    - macro: '{$RTN.ALARM.EID.IGNORE}'
      value: ^$
      description: 'Alarm IDs (curAlmEID) that never raise problems, as a regex. The default ignores nothing. Example for alarms that are often standing conditions: ^(13047|412|333)$ = almPassWordNeedChange, almPowerAbnormal (one power input not connected) and almClkNoTraceMode (clock free-run). The alarm value map lists every ID.'
    - macro: '{$RTN.ALARM.MIN.ACTIVE}'
      value: 5m
      description: 'Flap protection: window in which an alarm must be seen {$RTN.ALARM.MIN.SAMPLES} times.'
    - macro: '{$RTN.ALARM.MIN.SAMPLES}'
      value: '4'
      description: 'Flap protection: polls (one per minute) an alarm must be seen in before its problem opens.'
    - macro: '{$RTN.ALARM.NODATA}'
      value: 5m
      description: An alarm problem closes when its row has been gone from the alarm table this long.
    - macro: '{$RTN.CLOCK.ALERT}'
      value: '1'
      description: 1 = raise clock problems (system clock not tracing, PTP not locked, PTP port faulty). Set 0 on a host whose clock or time runs free by design.
    - macro: '{$RTN.CLOCK.PERIOD}'
      value: 10m
      description: How long a clock must stay out of the tracing/locked state before a problem opens.
    - macro: '{$RTN.ICMP.LOSS.WARN}'
      value: '20'
      description: ICMP loss (%) warning threshold.
    - macro: '{$RTN.ICMP.RESPONSE.WARN}'
      value: '0.3'
      description: ICMP response time (s) warning threshold.
    - macro: '{$SNMP.TIMEOUT}'
      value: 5m
      description: No SNMP answer for this long raises a problem.
