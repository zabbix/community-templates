zabbix_export:
  version: '6.0'
  groups:
  - uuid: ed9784ae40394228bf0e276907e6d5d0
    name: Templates/Network devices
  templates:
  - uuid: 13e58631119142378a74f85efa6b4132
    template: Huawei OptiX RTN by SNMP
    name: Huawei OptiX RTN by SNMP
    description: |-
      Huawei OptiX RTN microwave radios (RTN 905, 910A, 950A, 980, 380H) by SNMP.
      Common items for all models: NE info, boards and temperatures, ODU power and frequencies, IF modulation and capacity, 15-minute radio performance (RSL/TSL, SNR, MSE), Ethernet/radio port traffic and active alarms.
      Link the model template (e.g. 'Huawei OptiX RTN 950A by SNMP') instead of this one to get model-specific items too.
      OIDs from the Huawei OPTIX MIBs, checked against SNMP walks of RTN 905, 910A, 950A, 980 and 380H NEs.
      Set the SNMP timeout of the server or proxy (Timeout=) to 15 seconds: some NEs answer slowly.
    groups:
    - name: Templates/Network devices
    items:
    - uuid: 61676a308c4c4d0395a9b42bc772f5e2
      name: NE name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.4.1.2011.2.25.4.30.21.1.1.0
      key: rtn.ne.name
      delay: '{$RTN.INTERVAL.INVENTORY}'
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      value_type: CHAR
      trends: '0'
      description: NE name configured on the device (optixNeName). sysName is always "Optix product" on these radios.
      inventory_link: NAME
      tags:
      - tag: component
        value: system
    - uuid: 07f6d242d9194956a98be71f03dcf4ec
      name: NE ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.4.1.2011.2.25.3.40.2.1.1.0
      key: rtn.ne.id
      delay: '{$RTN.INTERVAL.INVENTORY}'
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      description: NE ID (optixNeID). Extended ID = value / 65536, basic ID = value % 65536.
      tags:
      - tag: component
        value: system
    - uuid: abb4efb650634a7bbbbc13e2dec6995d
      name: NE IP address
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.4.1.2011.2.25.3.40.2.2.1.0
      key: rtn.ne.ip
      delay: '{$RTN.INTERVAL.INVENTORY}'
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      value_type: CHAR
      trends: '0'
      description: NE IP address (optixNeIP).
      tags:
      - tag: component
        value: system
    - uuid: d568bb9bd2344767b38ce8ee4469932f
      name: Device model
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.4.1.2011.2.25.4.30.21.1.8.0
      key: rtn.ne.model
      delay: '{$RTN.INTERVAL.INVENTORY}'
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      description: Device type (optixNeDeviceType).
      valuemap:
        name: Huawei RTN device type
      tags:
      - tag: component
        value: system
    - uuid: 99608987c49f40ca95d63095c778e39f
      name: NE state
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.4.1.2011.2.25.4.30.21.1.7.0
      key: rtn.ne.state
      delay: '{$RTN.INTERVAL.STATUS}'
      description: 'NE status (optixNeState): installing or running.'
      valuemap:
        name: Huawei RTN NE state
      tags:
      - tag: component
        value: system
      triggers:
      - uuid: 46f02e9a3ddf41d285fb97c4ce186259
        expression: last(/Huawei OptiX RTN by SNMP/rtn.ne.state)=0
        name: NE is not in running state
        priority: AVERAGE
        description: The NE reports the install state (optixNeState=0), e.g. during a software load.
    - uuid: 893b29b752954ea78721df47d9206104
      name: Software version
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: rtn.ne.software
      delay: '{$RTN.INTERVAL.INVENTORY}'
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      value_type: CHAR
      trends: '0'
      description: sysDescr. Many NEs leave it empty; where set it holds the software version (e.g. V100R019C10SPC300).
      inventory_link: OS
      tags:
      - tag: component
        value: system
    - uuid: 4f3e3263b180438a84ee28bd826df473
      name: Uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: rtn.ne.uptime
      delay: '{$RTN.INTERVAL.STATUS}'
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      value_type: FLOAT
      units: uptime
      description: 'sysUpTime. Note: the 32-bit counter wraps after 497 days, which looks like a restart.'
      tags:
      - tag: component
        value: system
      triggers:
      - uuid: a90ba836671341eaac95391297196112
        expression: last(/Huawei OptiX RTN by SNMP/rtn.ne.uptime)<10m
        name: Device has been restarted (uptime < 10m)
        priority: WARNING
        description: Uptime is under 10 minutes. A sysUpTime wrap after 497 days also triggers this.
        manual_close: 'YES'
    - uuid: 89c973b0156841e2a9dc38e67c1f19ad
      name: SNMP agent availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      description: 'Zabbix internal check: 0 = SNMP not available, 1 = available.'
      tags:
      - tag: component
        value: system
      triggers:
      - uuid: ee1ca4a0ad6d42dc88528cc94d9d88fa
        expression: max(/Huawei OptiX RTN by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: No SNMP data collection
        priority: AVERAGE
        description: The SNMP agent has not answered for {$SNMP.TIMEOUT}.
        dependencies:
        - name: Unavailable by ICMP ping
          expression: max(/Huawei OptiX RTN by SNMP/icmpping,#3)=0
    - uuid: cc1b6f3ae7d6454bb577ebe32fe0992f
      name: ICMP ping
      type: SIMPLE
      key: icmpping
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: 7b31d556a8754c47917281e086abbee0
        expression: max(/Huawei OptiX RTN by SNMP/icmpping,#3)=0
        name: Unavailable by ICMP ping
        priority: HIGH
        description: Last three ICMP checks failed.
    - uuid: cccc399de01a4b81909b82e049cdc7b9
      name: ICMP loss
      type: SIMPLE
      key: icmppingloss
      value_type: FLOAT
      units: '%'
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: 7602f04e646240919eea5efa1cf925fa
        expression: min(/Huawei OptiX RTN by SNMP/icmppingloss,5m)>{$RTN.ICMP.LOSS.WARN} and min(/Huawei OptiX RTN by SNMP/icmppingloss,5m)<100
        name: High ICMP ping loss
        priority: WARNING
        dependencies:
        - name: Unavailable by ICMP ping
          expression: max(/Huawei OptiX RTN by SNMP/icmpping,#3)=0
    - uuid: 47da301d16854765bd17bc50ec2e1d9e
      name: ICMP response time
      type: SIMPLE
      key: icmppingsec
      value_type: FLOAT
      units: s
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: 116e3e1fd5324b8fb7b5cd918825bf0a
        expression: avg(/Huawei OptiX RTN by SNMP/icmppingsec,5m)>{$RTN.ICMP.RESPONSE.WARN}
        name: High ICMP ping response time
        priority: WARNING
        dependencies:
        - name: High ICMP ping loss
          expression: min(/Huawei OptiX RTN by SNMP/icmppingloss,5m)>{$RTN.ICMP.LOSS.WARN} and min(/Huawei OptiX RTN by SNMP/icmppingloss,5m)<100
        - name: Unavailable by ICMP ping
          expression: max(/Huawei OptiX RTN by SNMP/icmpping,#3)=0
    discovery_rules:
    - uuid: b6c6917cbec947398695d8ef046bef68
      name: Board discovery
      key: rtn.board.discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#BOARD.TYPE},1.3.6.1.4.1.2011.2.25.4.30.14.1.1.1.2,{#BOARD.STATE},1.3.6.1.4.1.2011.2.25.4.30.14.1.2.1.3]
      delay: '3667'
      lifetime: 7d
      description: Boards in the subrack (optixLogBoardTable).
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          function rows(value) {
              var d = JSON.parse(value), r = Array.isArray(d) ? d : (d.data || []);
              // a Zabbix 7 walk can carry "No Such Instance/Object ..." for a column the NE lacks: treat it as absent
              r.forEach(function (o) {
                  for (var k in o) if (/^No Such (Instance|Object)/.test(String(o[k]))) delete o[k];
              });
              return r;
          }
          // index "26.26.98.111..." or "26.98.111..." -> the ASCII string it encodes
          function idxString(idx) {
              var p = String(idx).split('.');
              for (var i = 0; i < p.length; i++) {
                  if (p.length - i - 1 === parseInt(p[i], 10)) {
                      var s = '';
                      for (var j = i + 1; j < p.length; j++) s += String.fromCharCode(parseInt(p[j], 10));
                      return s;
                  }
              }
              return String(idx);
          }
          // "board=17,subcard=255,port=5" -> {board: 17, subcard: 255, port: 5}
          function location(s) {
              var o = {};
              String(s).split(',').forEach(function (kv) {
                  var a = kv.split('=');
                  if (a.length === 2) o[a[0].trim()] = parseInt(a[1], 10);
              });
              return o;
          }
          // ODU slot -> IF slot/port: +20/+40 on RTN 905/910A/950A, +50/+70 on RTN 980, same slot on RTN 380H
          function oduIf(slot) {
              var b = [[70, 2], [50, 1], [40, 2], [20, 1]];
              for (var i = 0; i < b.length; i++)
                  if (slot > b[i][0]) return [slot - b[i][0], b[i][1]];
              return [slot, 1];
          }
          function oduName(slot) {
              var p = oduIf(slot);
              return 'ODU ' + slot + ' (IF ' + p[0] + '/' + p[1] + ')';
          }
          // Destination of a port: the neighbour NE name the radio learns over the link ({#P.NB}),
          // else the port name engineers typed on the NE ({#P.NAME}). Both tables are indexed slot.255.port
          // and arrive as extra discovery rows next to the rule's own rows.
          // factory-default port labels (RTN 380H and others) name the port type, not a destination
          var DEFAULT_PORT_NAMES = /^(IF|P&E|COMBO(\(e\))?|\d*0?GE\d*|NMS)$/i;
          function labels(R) {
              var L = {};
              R.forEach(function (r) {
                  var nb = String(r['{#P.NB}'] || '').trim(), pn = String(r['{#P.NAME}'] || '').trim();
                  if (DEFAULT_PORT_NAMES.test(pn)) pn = '';
                  if (nb || pn) L[String(r['{#SNMPINDEX}'])] = nb || pn;
              });
              return function (slot, port) { return L[slot + '.255.' + port] || ''; };
          }
          function withName(id, n) { return n ? id + ' (' + n + ')' : id; }
          function oduLabel(slot, lab) {
              var p = oduIf(slot), n = lab(p[0], p[1]);
              return 'ODU ' + slot + ' (IF ' + p[0] + '/' + p[1] + (n ? ', ' + n : '') + ')';
          }

          var out = [];
          rows(value).forEach(function (r) {
              // configured but physically absent boards (BdStatus alarm) have no physical state row
              if (r['{#BOARD.STATE}'] === undefined || r['{#BOARD.STATE}'] === '') return;
              out.push({'{#SNMPINDEX}': r['{#SNMPINDEX}'], '{#BOARD.SLOT}': r['{#SNMPINDEX}'],
                        '{#BOARD.TYPE}': String(r['{#BOARD.TYPE}']).toUpperCase(),
                        '{#BOARD.NAME}': 'Slot ' + r['{#SNMPINDEX}'] + ' (' + String(r['{#BOARD.TYPE}']).toUpperCase() + ')'});
          });
          return JSON.stringify(out);
      item_prototypes:
      - uuid: c89e024d8f884f7fa36220885f341f24
        name: '{#BOARD.NAME}: State'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.4.1.2011.2.25.4.30.14.1.2.1.3.{#SNMPINDEX}
        key: rtn.board.state[{#SNMPINDEX}]
        delay: '{$RTN.INTERVAL.STATUS}'
        description: Board working status (optixPhyBoardState).
        valuemap:
          name: Huawei RTN board state
        tags:
        - tag: component
          value: board
        - tag: board
          value: '{#BOARD.NAME}'
        trigger_prototypes:
        - uuid: 4b72b41087ac485eb4ac4cb7635c1438
          expression: last(/Huawei OptiX RTN by SNMP/rtn.board.state[{#SNMPINDEX}])=0
          name: '{#BOARD.NAME}: Board is not working'
          priority: HIGH
          description: optixPhyBoardState reports notWork(0).
    - uuid: 10cb8923935d44a992a1ebdd5862951f
      name: Board version discovery
      key: rtn.board.version.discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#BOARD.TYPE},1.3.6.1.4.1.2011.2.25.4.30.14.1.1.1.2,{#BOARD.VER},1.3.6.1.4.1.2011.2.25.4.30.14.1.2.1.7]
      delay: '3801'
      lifetime: 7d
      description: Hardware (PCB), software and FPGA version of each board (optixPhyBDVerInfo).
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          function rows(value) {
              var d = JSON.parse(value), r = Array.isArray(d) ? d : (d.data || []);
              // a Zabbix 7 walk can carry "No Such Instance/Object ..." for a column the NE lacks: treat it as absent
              r.forEach(function (o) {
                  for (var k in o) if (/^No Such (Instance|Object)/.test(String(o[k]))) delete o[k];
              });
              return r;
          }
          // index "26.26.98.111..." or "26.98.111..." -> the ASCII string it encodes
          function idxString(idx) {
              var p = String(idx).split('.');
              for (var i = 0; i < p.length; i++) {
                  if (p.length - i - 1 === parseInt(p[i], 10)) {
                      var s = '';
                      for (var j = i + 1; j < p.length; j++) s += String.fromCharCode(parseInt(p[j], 10));
                      return s;
                  }
              }
              return String(idx);
          }
          // "board=17,subcard=255,port=5" -> {board: 17, subcard: 255, port: 5}
          function location(s) {
              var o = {};
              String(s).split(',').forEach(function (kv) {
                  var a = kv.split('=');
                  if (a.length === 2) o[a[0].trim()] = parseInt(a[1], 10);
              });
              return o;
          }
          // ODU slot -> IF slot/port: +20/+40 on RTN 905/910A/950A, +50/+70 on RTN 980, same slot on RTN 380H
          function oduIf(slot) {
              var b = [[70, 2], [50, 1], [40, 2], [20, 1]];
              for (var i = 0; i < b.length; i++)
                  if (slot > b[i][0]) return [slot - b[i][0], b[i][1]];
              return [slot, 1];
          }
          function oduName(slot) {
              var p = oduIf(slot);
              return 'ODU ' + slot + ' (IF ' + p[0] + '/' + p[1] + ')';
          }
          // Destination of a port: the neighbour NE name the radio learns over the link ({#P.NB}),
          // else the port name engineers typed on the NE ({#P.NAME}). Both tables are indexed slot.255.port
          // and arrive as extra discovery rows next to the rule's own rows.
          // factory-default port labels (RTN 380H and others) name the port type, not a destination
          var DEFAULT_PORT_NAMES = /^(IF|P&E|COMBO(\(e\))?|\d*0?GE\d*|NMS)$/i;
          function labels(R) {
              var L = {};
              R.forEach(function (r) {
                  var nb = String(r['{#P.NB}'] || '').trim(), pn = String(r['{#P.NAME}'] || '').trim();
                  if (DEFAULT_PORT_NAMES.test(pn)) pn = '';
                  if (nb || pn) L[String(r['{#SNMPINDEX}'])] = nb || pn;
              });
              return function (slot, port) { return L[slot + '.255.' + port] || ''; };
          }
          function withName(id, n) { return n ? id + ' (' + n + ')' : id; }
          function oduLabel(slot, lab) {
              var p = oduIf(slot), n = lab(p[0], p[1]);
              return 'ODU ' + slot + ' (IF ' + p[0] + '/' + p[1] + (n ? ', ' + n : '') + ')';
          }

          var FIELDS = [[/PCB\s+Version\s*:/, 'PCB', 'hw', 'Hardware'], [/Software\s+Version\s*:/, 'Software', 'sw', 'Software'],
                        [/FPGA\s+Version\s*:/, 'FPGA', 'fpga', 'FPGA']];
          var out = [];
          rows(value).forEach(function (r) {
              var v = r['{#BOARD.VER}'];
              if (v === undefined || v === '' || r['{#BOARD.TYPE}'] === undefined) return;
              var name = 'Slot ' + r['{#SNMPINDEX}'] + ' (' + String(r['{#BOARD.TYPE}']).toUpperCase() + ')';
              FIELDS.forEach(function (f) {
                  if (!f[0].test(v)) return;
                  out.push({'{#SNMPINDEX}': r['{#SNMPINDEX}'], '{#BOARD.NAME}': name,
                            '{#VER.RE}': f[1], '{#VER.KEY}': f[2], '{#VER.FIELD}': f[3]});
              });
          });
          return JSON.stringify(out);
      item_prototypes:
      - uuid: 6e1fe6c17d1c465ebf1515e72bfde22e
        name: '{#BOARD.NAME}: {#VER.FIELD} version'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.4.1.2011.2.25.4.30.14.1.2.1.7.{#SNMPINDEX}
        key: rtn.board.version[{#SNMPINDEX},{#VER.KEY}]
        delay: '{$RTN.INTERVAL.VERSION}'
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - |-
            // the agent may return the string as hex bytes ("50 43 42 ...")
            if (/^([0-9A-F]{2}\s+)+[0-9A-F]{0,2}\s*$/i.test(value) && value.indexOf(':') < 0)
                value = value.trim().split(/\s+/).map(function (h) { return String.fromCharCode(parseInt(h, 16)); }).join('');
            var m = value.match(/{#VER.RE}\s+Version\s*:\s*([^\r\n]+)/);
            if (!m) throw 'no {#VER.RE} version line in: ' + value;
            return m[1].trim();
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 23h
        value_type: CHAR
        trends: '0'
        description: '{#VER.FIELD} version of the board, from its version information (optixPhyBDVerInfo).'
        tags:
        - tag: component
          value: inventory
        - tag: board
          value: '{#BOARD.NAME}'
        trigger_prototypes:
        - uuid: 4b481b45a976421ab3b33775aac2a2a8
          expression: change(/Huawei OptiX RTN by SNMP/rtn.board.version[{#SNMPINDEX},{#VER.KEY}])=1
          name: '{#BOARD.NAME}: {#VER.FIELD} version changed'
          priority: INFO
          description: 'The board reports a different version than before: a software upgrade or a replaced board.'
          manual_close: 'YES'
    - uuid: 963d625c9bf9465cb9b814f09c4cd641
      name: Board temperature discovery
      key: rtn.board.temp.discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#BOARD.TYPE},1.3.6.1.4.1.2011.2.25.4.30.14.1.1.1.2,{#BOARD.TEMP},1.3.6.1.4.1.2011.2.25.4.30.14.1.1.1.5]
      delay: '3734'
      lifetime: 7d
      description: Boards that report a temperature.
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          function rows(value) {
              var d = JSON.parse(value), r = Array.isArray(d) ? d : (d.data || []);
