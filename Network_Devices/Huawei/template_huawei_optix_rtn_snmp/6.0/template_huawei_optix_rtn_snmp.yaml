      - uuid: 25c9348d22d84c579039e340df1b7a65
        name: '{#ELAN.LABEL}: {#UNI.NAME}: VLANs'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.4.1.2011.2.25.4.50.3.1.5.1.6.{#SNMPINDEX}
        key: rtn.elan.uni.vlanlist[{#SNMPINDEX}]
        delay: '{$RTN.INTERVAL.SERVICE}'
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - |-
            // optixElanUniVlanlist: 512-byte bitmap, first bit = VLAN 1. Zabbix returns it as hex bytes.
            var h = String(value).replace(/^[A-Za-z-]+:\s*/, '');
            var b = /^[\s0-9A-Fa-f]+$/.test(h) ? h.replace(/\s+/g, '').match(/../g) || [] : [];
            if (!b.length) for (var i = 0; i < h.length; i++) b.push(h.charCodeAt(i).toString(16));
            var v = [];
            b.forEach(function (x, n) {
                var byte = parseInt(x, 16);
                for (var k = 0; k < 8; k++) if (byte & (0x80 >> k)) v.push(n * 8 + k + 1);
            });
            // 3,8,11-12,14 as in Web LCT
            var out = [];
            for (var i = 0; i < v.length; i++) {
                var j = i;
                while (j + 1 < v.length && v[j + 1] === v[j] + 1) j++;
                out.push(j > i ? v[i] + '-' + v[j] : String(v[i]));
                i = j;
            }
            return out.length ? out.join(',') : 'none';
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 23h
        value_type: CHAR
        trends: '0'
        description: VLANs this port carries in the E-LAN service, e.g. 3,8,11-12,14 (optixElanUniVlanlist).
