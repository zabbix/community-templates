          name: Clock is not tracing (slot {#SNMPINDEX})
          priority: WARNING
          description: The system clock has not been tracing a reference for {$RTN.CLOCK.PERIOD} (holdover or free-run). Set {$RTN.CLOCK.ALERT}=0 on a host whose clock runs free by design.
