          expression: change(/Huawei OptiX RTN by SNMP/rtn.elan.uni.vlanlist[{#SNMPINDEX}])=1
          name: '{#ELAN.LABEL}: {#UNI.ID}: VLANs changed to {ITEM.LASTVALUE}'
          priority: INFO
          description: 'The VLAN list of this E-LAN port changed: a service reconfiguration.'
          manual_close: 'YES'
