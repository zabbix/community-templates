  - uuid: 3a42443916714172b13d15409ec9155d
    template: Huawei OptiX RTN 905 by SNMP
    name: Huawei OptiX RTN 905 by SNMP
    description: 'Huawei OptiX RTN 905 by SNMP. Links ''Huawei OptiX RTN by SNMP'' and adds the subrack items: fan, system clock, PLA groups, IF 1+1 protection and FEC counters.'
    templates:
    - name: Huawei OptiX RTN by SNMP
    groups:
    - name: Templates/Network devices
    items:
    - uuid: a782e2d63c204f699b0dec1d163a42b3
      name: Fan speed
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.4.1.2011.2.25.4.30.39.1.1.0
      key: rtn.fan.speed
      delay: '{$RTN.INTERVAL.STATUS}'
      description: Fan speed (optixFanSpeed).
      valuemap:
        name: Huawei RTN fan speed
      tags:
      - tag: component
        value: environment
      triggers:
      - uuid: 150c06602bcf49eabb3e13ade72445f7
        expression: last(/Huawei OptiX RTN 905 by SNMP/rtn.fan.speed)=4
        name: Fan has stopped
        priority: AVERAGE
        description: optixFanSpeed reports stop(4).
    discovery_rules:
    - uuid: cb9d0d5c72e241648e24c86521c29b5c
      name: System clock discovery
      key: rtn.clock.discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#CLK.MODE},1.3.6.1.4.1.2011.2.25.4.10.48.1.1.1.6]
      delay: '3868'
      lifetime: 7d
      description: System clock (one row, indexed by the control board slot).
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          function rows(value) {
              var d = JSON.parse(value), r = Array.isArray(d) ? d : (d.data || []);
              // a Zabbix 7 walk can carry "No Such Instance/Object ..." for a column the NE lacks: treat it as absent
              r.forEach(function (o) {
                  for (var k in o) if (/^No Such (Instance|Object)/.test(String(o[k]))) delete o[k];
              });
              return r;
          }
          // index "26.26.98.111..." or "26.98.111..." -> the ASCII string it encodes
          function idxString(idx) {
              var p = String(idx).split('.');
              for (var i = 0; i < p.length; i++) {
                  if (p.length - i - 1 === parseInt(p[i], 10)) {
                      var s = '';
                      for (var j = i + 1; j < p.length; j++) s += String.fromCharCode(parseInt(p[j], 10));
                      return s;
                  }
              }
              return String(idx);
          }
          // "board=17,subcard=255,port=5" -> {board: 17, subcard: 255, port: 5}
          function location(s) {
              var o = {};
              String(s).split(',').forEach(function (kv) {
                  var a = kv.split('=');
                  if (a.length === 2) o[a[0].trim()] = parseInt(a[1], 10);
              });
              return o;
          }
          // ODU slot -> IF slot/port: +20/+40 on RTN 905/910A/950A, +50/+70 on RTN 980, same slot on RTN 380H
          function oduIf(slot) {
              var b = [[70, 2], [50, 1], [40, 2], [20, 1]];
              for (var i = 0; i < b.length; i++)
                  if (slot > b[i][0]) return [slot - b[i][0], b[i][1]];
              return [slot, 1];
          }
          function oduName(slot) {
              var p = oduIf(slot);
              return 'ODU ' + slot + ' (IF ' + p[0] + '/' + p[1] + ')';
          }
          // Destination of a port: the neighbour NE name the radio learns over the link ({#P.NB}),
          // else the port name engineers typed on the NE ({#P.NAME}). Both tables are indexed slot.255.port
          // and arrive as extra discovery rows next to the rule's own rows.
          // factory-default port labels (RTN 380H and others) name the port type, not a destination
          var DEFAULT_PORT_NAMES = /^(IF|P&E|COMBO(\(e\))?|\d*0?GE\d*|NMS)$/i;
          function labels(R) {
              var L = {};
              R.forEach(function (r) {
                  var nb = String(r['{#P.NB}'] || '').trim(), pn = String(r['{#P.NAME}'] || '').trim();
                  if (DEFAULT_PORT_NAMES.test(pn)) pn = '';
                  if (nb || pn) L[String(r['{#SNMPINDEX}'])] = nb || pn;
              });
              return function (slot, port) { return L[slot + '.255.' + port] || ''; };
          }
          function withName(id, n) { return n ? id + ' (' + n + ')' : id; }
          function oduLabel(slot, lab) {
              var p = oduIf(slot), n = lab(p[0], p[1]);
              return 'ODU ' + slot + ' (IF ' + p[0] + '/' + p[1] + (n ? ', ' + n : '') + ')';
          }

          var out = [];
          rows(value).forEach(function (r) {
              if (r['{#CLK.MODE}'] === undefined) return;
              out.push({'{#SNMPINDEX}': r['{#SNMPINDEX}']});
          });
          return JSON.stringify(out);
      item_prototypes:
      - uuid: 8339f2c5c481476d802737b149b6fdc3
        name: Clock work mode
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.4.1.2011.2.25.4.10.48.1.1.1.6.{#SNMPINDEX}
        key: rtn.clock.mode[{#SNMPINDEX}]
        delay: '{$RTN.INTERVAL.STATUS}'
        description: 'System clock work mode (optixSdhSysSynWorkMode) on the control board in slot {#SNMPINDEX}: tracing, holdover or free-run.'
        valuemap:
          name: Huawei RTN clock work mode
        tags:
        - tag: component
          value: clock
        trigger_prototypes:
        - uuid: 2e544c514b5a4cabb356e8b43e08c281
          expression: (count(/Huawei OptiX RTN 905 by SNMP/rtn.clock.mode[{#SNMPINDEX}],{$RTN.CLOCK.PERIOD},"eq",1)=0 and count(/Huawei OptiX RTN 905 by SNMP/rtn.clock.mode[{#SNMPINDEX}],{$RTN.CLOCK.PERIOD})>0) and {$RTN.CLOCK.ALERT}=1
          name: Clock is not tracing (slot {#SNMPINDEX})
          priority: WARNING
          description: The system clock has not been tracing a reference for {$RTN.CLOCK.PERIOD} (holdover or free-run). Set {$RTN.CLOCK.ALERT}=0 on a host whose clock runs free by design.
    - uuid: 9208db8b6cfb466c8154e42aaed9e74d
      name: PLA group discovery
      key: rtn.pla.discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#PLA.BOARD},1.3.6.1.4.1.2011.2.25.4.40.5.10.100.1.1,{#PLA.PORT},1.3.6.1.4.1.2011.2.25.4.40.5.10.100.1.3]
      delay: '5342'
      lifetime: 7d
      description: Physical link aggregation (PLA/EPLA) groups.
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          function rows(value) {
              var d = JSON.parse(value), r = Array.isArray(d) ? d : (d.data || []);
              // a Zabbix 7 walk can carry "No Such Instance/Object ..." for a column the NE lacks: treat it as absent
              r.forEach(function (o) {
                  for (var k in o) if (/^No Such (Instance|Object)/.test(String(o[k]))) delete o[k];
              });
              return r;
          }
          // index "26.26.98.111..." or "26.98.111..." -> the ASCII string it encodes
          function idxString(idx) {
              var p = String(idx).split('.');
              for (var i = 0; i < p.length; i++) {
                  if (p.length - i - 1 === parseInt(p[i], 10)) {
                      var s = '';
                      for (var j = i + 1; j < p.length; j++) s += String.fromCharCode(parseInt(p[j], 10));
                      return s;
                  }
              }
              return String(idx);
          }
          // "board=17,subcard=255,port=5" -> {board: 17, subcard: 255, port: 5}
          function location(s) {
              var o = {};
