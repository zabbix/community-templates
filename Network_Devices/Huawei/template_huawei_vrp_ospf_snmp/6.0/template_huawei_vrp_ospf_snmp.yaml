zabbix_export:
  version: '6.0'
  date: '2026-09-23T20:08:11Z'
  groups:
  - uuid: 7df96b18c230490a9a0a9e2307226338
    name: Templates
  templates:
  - uuid: 97809fd31d5e41c1b86d63fa816d1bfe
    template: Huawei VRP OSPF by SNMP
    name: Huawei VRP OSPF by SNMP
    description: "Monitors OSPFv2 (RFC 4750 OSPF-MIB) on Huawei VRP devices (validated on S5700/S6700/S6730 running VRP, S6730\
      \ tested on V200R022C00) via SNMP.\n\nPREREQUISITE (mandatory, done on the device, not in Zabbix):\nBy default a Huawei\
      \ OSPF process is NOT bound to SNMP, so this MIB stays empty until you run, for each OSPF process to monitor:\n  system-view\n\
      \  ospf <process-id>\n  quit\n  ospf mib-binding <process-id>\nThis only enables SNMP visibility for that process; it\
      \ does not affect OSPF operation, adjacencies or convergence.\n\nDiscovers and monitors:\n- OSPF neighbors (ospfNbrTable):\
      \ adjacency state, Router ID, state-change counter, retransmission queue length\n- OSPF interfaces (ospfIfTable): interface\
      \ state, admin status, state-change counter, DR/BDR\n- OSPF areas (ospfAreaTable): SPF run counter, LSA count, ABR/ASBR\
      \ count\n- Process-wide scalars: Router ID, admin status, ABR/ASBR flag, external LSA count, LSA origination/reception\
      \ rate\n\nNote: the neighbor discovery index ({#SNMPINDEX}) is the neighbor's Hello source IP address (ospfNbrIpAddr),\
      \ which can differ from the Router ID shown by 'display ospf peer' on the CLI - both are exposed as separate items.\n\
      \nMIBs used:\nOSPF-MIB (RFC 4750)\n\nBuilt from the official Huawei S5700/S6700 V200R025C00 documentation (MIB Reference\
      \ > OSPF-MIB)."
    groups:
    - name: Templates
    items:
    - uuid: 7ca053828a3a438c85c5e0dda57c9131
      name: 'OSPF: Router ID'
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.14.1.1.0
      key: ospf.routerid[ospfRouterId.0]
      delay: 30m
      history: 7d
      trends: '0'
      value_type: CHAR
      description: 'MIB: OSPF-MIB

        ospfRouterId - 32-bit integer (IP address form) uniquely identifying the OSPF router.


        Before this template can read any data, the OSPF process on the Huawei VRP device must be bound to SNMP: system-view
        / ospf <process-id> / quit / ospf mib-binding <process-id>. By default OSPF processes are NOT bound to SNMP (RFC 4750
        OSPF-MIB stays empty otherwise).'
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: component
        value: ospf-process
    - uuid: 422b5d0c77234308bf919149e11c0049
      name: 'OSPF: Admin status'
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.14.1.2.0
      key: ospf.adminstat[ospfAdminStat.0]
      delay: 5m
      history: 7d
      valuemap:
        name: OSPF-MIB::ospfAdminStat
      description: 'MIB: OSPF-MIB

        ospfAdminStat - administrative status of OSPF on the device.'
      tags:
      - tag: component
        value: ospf-process
      triggers:
      - uuid: c229e6d1cae842458aacf0fffef48294
        expression: last(/Huawei VRP OSPF by SNMP/ospf.adminstat[ospfAdminStat.0])=2
        name: 'OSPF: Process administratively disabled'
        priority: HIGH
        description: The OSPF process was administratively disabled on this device.
        tags:
        - tag: scope
          value: availability
    - uuid: 0d822091181f440c95f9eb0661ebbd84
      name: 'OSPF: Area border router status'
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.14.1.4.0
      key: ospf.abrstatus[ospfAreaBdrRtrStatus.0]
      delay: 1h
      history: 7d
      valuemap:
        name: OSPF-MIB::ospfTrueFalse
      description: 'MIB: OSPF-MIB

        ospfAreaBdrRtrStatus - whether this device is an Area Border Router.'
      tags:
      - tag: component
        value: ospf-process
    - uuid: 6c8682c8832048b7b68ae2096bd595d3
      name: 'OSPF: AS border router status'
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.14.1.5.0
      key: ospf.asbrstatus[ospfASBdrRtrStatus.0]
      delay: 1h
      history: 7d
      valuemap:
        name: OSPF-MIB::ospfTrueFalse
      description: 'MIB: OSPF-MIB

        ospfASBdrRtrStatus - whether this device is configured as an AS Border Router.'
      tags:
      - tag: component
        value: ospf-process
    - uuid: 2a981011885f478c9889c98977d3de55
      name: 'OSPF: External LSA count'
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.14.1.6.0
      key: ospf.externlsacount[ospfExternLsaCount.0]
      delay: 15m
      history: 7d
      description: 'MIB: OSPF-MIB

        ospfExternLsaCount - number of external (type-5) LSAs in the link state database.'
      tags:
      - tag: component
        value: ospf-lsdb
    - uuid: 6a15b7c7ad9c4b93a3e0f53a6b494979
      name: 'OSPF: Originated LSAs rate'
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.14.1.9.0
      key: ospf.originatenewlsas.rate[ospfOriginateNewLsas.0]
      delay: 5m
      history: 7d
      value_type: FLOAT
      units: lsa/s
      description: 'MIB: OSPF-MIB

        ospfOriginateNewLsas - rate of new LSAs originated by this device. Sustained high rate indicates topology churn.'
      preprocessing:
      - type: CHANGE_PER_SECOND
        parameters:
        - ''
      tags:
      - tag: component
        value: ospf-lsdb
    - uuid: 392fc6612307465eb8fcfcc146123b6a
      name: 'OSPF: Received LSAs rate'
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.14.1.10.0
      key: ospf.rxnewlsas.rate[ospfRxNewLsas.0]
      delay: 5m
      history: 7d
      value_type: FLOAT
      units: lsa/s
      description: 'MIB: OSPF-MIB

        ospfRxNewLsas - rate of new (not self-originated) LSAs received. Sustained high rate indicates topology churn elsewhere
        in the AS.'
      preprocessing:
      - type: CHANGE_PER_SECOND
        parameters:
        - ''
      tags:
      - tag: component
        value: ospf-lsdb
      triggers:
      - uuid: ea444f3530ed4d8eabedc10ad3a39a9f
        expression: min(/Huawei VRP OSPF by SNMP/ospf.rxnewlsas.rate[ospfRxNewLsas.0],10m)>{$OSPF.LSA.RATE.MAX.WARN}
        name: 'OSPF: High LSA churn rate'
        event_name: 'OSPF: High LSA churn rate (over {$OSPF.LSA.RATE.MAX.WARN} lsa/s for 10m)'
        priority: WARNING
        description: Sustained high rate of received LSAs, usually a sign of instability somewhere in the OSPF domain.
        tags:
        - tag: scope
          value: availability
        - tag: scope
          value: performance
    - uuid: d63347ddf8f242bb8d924ccb1b1d4fb4
      name: 'OSPF: Total neighbors'
      type: CALCULATED
      key: ospf.nbr.count
      params: count(/Huawei VRP OSPF by SNMP/ospf.nbr.state[ospfNbrState.*],#1)
      delay: 1m
      history: 7d
      description: Number of OSPF neighbors currently discovered (any state), aggregated from the per-neighbor ospf.nbr.state[]
        items created by the neighbor discovery rule.
      tags:
      - tag: component
        value: ospf-neighbor
    - uuid: 70390d4afe5e4eba90042dda8a017dc3
      name: 'OSPF: Neighbors in Full state'
      type: CALCULATED
      key: ospf.nbr.count.full
      params: count(/Huawei VRP OSPF by SNMP/ospf.nbr.state[ospfNbrState.*],#1,"eq",8)
      delay: 1m
      history: 7d
      description: Number of OSPF neighbors currently in state full(8), aggregated from the per-neighbor ospf.nbr.state[]
        items created by the neighbor discovery rule.
      tags:
      - tag: component
        value: ospf-neighbor
      triggers:
      - uuid: 649b178a757d4f1797b6d19aef346cd1
        expression: last(/Huawei VRP OSPF by SNMP/ospf.nbr.count.full)<last(/Huawei VRP OSPF by SNMP/ospf.nbr.count) and last(/Huawei
          VRP OSPF by SNMP/ospf.nbr.count)>0
        name: 'OSPF: Not all neighbors are Full ({ITEM.LASTVALUE1}/{ITEM.LASTVALUE2})'
        opdata: 'Full: {ITEM.LASTVALUE1} / Total: {ITEM.LASTVALUE2}'
        priority: WARNING
        description: Summary trigger across all discovered OSPF neighbors. The individual "OSPF neighbor {#SNMPINDEX} is down"
          triggers already identify which neighbor is affected; this one is for a single at-a-glance NOC-style alert/dashboard
          tile.
        tags:
        - tag: scope
          value: availability
    - uuid: 1d0902a71901426782dc074eb117c555
      name: 'OSPF: SNMP agent availability'
      type: INTERNAL
      key: zabbix[host,snmp,available]
      history: 7d
      description: 'Availability of SNMP checks on the host. The value of this item corresponds to availability icons in the
        host list.

        Possible value:

        0 - not available

        1 - available

        2 - unknown'
      valuemap:
        name: zabbix.host.available
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: 4639fc92c2974117b89d403e9795f36f
        expression: max(/Huawei VRP OSPF by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'OSPF: No SNMP data collection'
        priority: WARNING
        description: SNMP is not available for polling. Check device connectivity, community string and the ospf mib-binding
          config.
        tags:
        - tag: scope
          value: availability
    discovery_rules:
    - uuid: d417cbd01e9c4abeab33a5c4b12b7e1a
      name: OSPF neighbor discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#NBR_STATE},1.3.6.1.2.1.14.10.1.6,{#NBR_RTRID},1.3.6.1.2.1.14.10.1.3]
      key: ospf.nbr.discovery
      delay: 10m
      description: 'OSPF-MIB::ospfNbrTable discovery. {#SNMPINDEX} = ospfNbrIpAddr.ospfNbrAddressLessIndex (the neighbor Hello
        source IP, not necessarily its Router ID). Before this template can read any data, the OSPF process on the Huawei
        VRP device must be bound to SNMP: system-view / ospf <process-id> / quit / ospf mib-binding <process-id>. By default
        OSPF processes are NOT bound to SNMP (RFC 4750 OSPF-MIB stays empty otherwise).'
      item_prototypes:
      - uuid: a9ea12a43f104f589ea3b17f09b63110
        name: 'OSPF neighbor {#SNMPINDEX}: State'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.14.10.1.6.{#SNMPINDEX}
        key: ospf.nbr.state[ospfNbrState.{#SNMPINDEX}]
        delay: 1m
        history: 7d
        valuemap:
          name: OSPF-MIB::ospfNbrState
        description: 'MIB: OSPF-MIB

          ospfNbrState - the state of the relationship with this neighbor (full(8) = adjacency up).'
        tags:
        - tag: component
          value: ospf-neighbor
        - tag: neighbor
          value: '{#SNMPINDEX}'
        trigger_prototypes:
        - uuid: 7b7fa42c40ae42b1a01f66d2e074ae3e
          expression: last(/Huawei VRP OSPF by SNMP/ospf.nbr.state[ospfNbrState.{#SNMPINDEX}])<>8
          name: OSPF neighbor {#SNMPINDEX} is down
          event_name: 'OSPF neighbor {#SNMPINDEX} is down (state: {ITEM.LASTVALUE1})'
          opdata: 'State: {ITEM.LASTVALUE1}'
          priority: HIGH
          description: The OSPF adjacency with this neighbor is not Full.
          tags:
          - tag: scope
            value: availability
      - uuid: 13d8b428d3a6470ca93b80947847b7c1
        name: 'OSPF neighbor {#SNMPINDEX}: Router ID'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.14.10.1.3.{#SNMPINDEX}
        key: ospf.nbr.rtrid[ospfNbrRtrId.{#SNMPINDEX}]
        delay: 30m
        history: 7d
        trends: '0'
        value_type: CHAR
        description: 'MIB: OSPF-MIB

          ospfNbrRtrId - Router ID of the neighboring router (informational, used for readable alerts).'
        preprocessing:
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1h
        tags:
        - tag: component
          value: ospf-neighbor
        - tag: neighbor
          value: '{#SNMPINDEX}'
      - uuid: 3f0d0d65b4804b5aba91138d21bcc32c
        name: 'OSPF neighbor {#SNMPINDEX}: State changes'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.14.10.1.7.{#SNMPINDEX}
        key: ospf.nbr.events[ospfNbrEvents.{#SNMPINDEX}]
        delay: 1m
        history: 7d
        description: 'MIB: OSPF-MIB

          ospfNbrEvents - cumulative count of state changes/errors for this neighbor.'
        tags:
        - tag: component
          value: ospf-neighbor
        - tag: neighbor
          value: '{#SNMPINDEX}'
        trigger_prototypes:
        - uuid: d70afaed0590436b905c47d8280f202c
          expression: (last(/Huawei VRP OSPF by SNMP/ospf.nbr.events[ospfNbrEvents.{#SNMPINDEX}])-min(/Huawei VRP OSPF by
            SNMP/ospf.nbr.events[ospfNbrEvents.{#SNMPINDEX}],10m))>{$OSPF.NBR.EVENTS.MAX.WARN}
          name: OSPF neighbor {#SNMPINDEX} is flapping
          event_name: OSPF neighbor {#SNMPINDEX} is flapping (>{$OSPF.NBR.EVENTS.MAX.WARN} state changes in 10m)
          priority: WARNING
          description: The neighbor relationship changed state too many times in a short period.
          tags:
          - tag: scope
            value: availability
          - tag: scope
            value: performance
      - uuid: a969b25fa3ad42a7a3f0d74f4b6c5c5a
        name: 'OSPF neighbor {#SNMPINDEX}: Retransmission queue length'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.14.10.1.8.{#SNMPINDEX}
        key: ospf.nbr.retransqlen[ospfNbrLsRetransQLen.{#SNMPINDEX}]
        delay: 5m
        history: 7d
        description: 'MIB: OSPF-MIB

          ospfNbrLsRetransQLen - current length of the LSA retransmission queue toward this neighbor.'
        tags:
        - tag: component
          value: ospf-neighbor
        - tag: neighbor
          value: '{#SNMPINDEX}'
        trigger_prototypes:
        - uuid: 84413c51d2424073b3f02e5f86254d06
          expression: min(/Huawei VRP OSPF by SNMP/ospf.nbr.retransqlen[ospfNbrLsRetransQLen.{#SNMPINDEX}],10m)>{$OSPF.NBR.RETRANSQLEN.MAX.WARN}
          name: 'OSPF neighbor {#SNMPINDEX}: Retransmission queue is growing'
          priority: WARNING
          description: LSA retransmission queue is not draining, possible congestion or an unstable adjacency.
          tags:
          - tag: scope
            value: performance
    - uuid: a1ed0bce1506495fb492259179228e8c
      name: OSPF interface discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#IF_STATE},1.3.6.1.2.1.14.7.1.12]
      key: ospf.if.discovery
      delay: 30m
      description: 'OSPF-MIB::ospfIfTable discovery. {#SNMPINDEX} = ospfIfIpAddress.ospfAddressLessIf. Before this template
        can read any data, the OSPF process on the Huawei VRP device must be bound to SNMP: system-view / ospf <process-id>
        / quit / ospf mib-binding <process-id>. By default OSPF processes are NOT bound to SNMP (RFC 4750 OSPF-MIB stays empty
        otherwise).'
      item_prototypes:
      - uuid: fc30428829324d6883c0088e6555f2a8
        name: 'OSPF interface {#SNMPINDEX}: State'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.14.7.1.12.{#SNMPINDEX}
        key: ospf.if.state[ospfIfState.{#SNMPINDEX}]
        delay: 1m
        history: 7d
        valuemap:
          name: OSPF-MIB::ospfIfState
        description: 'MIB: OSPF-MIB

          ospfIfState - OSPF interface state (down/waiting/pointToPoint/DR/BDR/otherDR).'
        tags:
        - tag: component
          value: ospf-interface
        - tag: interface
          value: '{#SNMPINDEX}'
      - uuid: 68797184d2694b65b413807dda04a51a
        name: 'OSPF interface {#SNMPINDEX}: Admin status'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.14.7.1.5.{#SNMPINDEX}
        key: ospf.if.adminstat[ospfIfAdminStat.{#SNMPINDEX}]
        delay: 15m
        history: 7d
        valuemap:
          name: OSPF-MIB::ospfAdminStat
        description: 'MIB: OSPF-MIB

          ospfIfAdminStat - administrative status of OSPF on this interface.'
        tags:
        - tag: component
          value: ospf-interface
        - tag: interface
          value: '{#SNMPINDEX}'
        trigger_prototypes:
        - uuid: 2842757a572d44369b1fd8fcd35153bc
          expression: last(/Huawei VRP OSPF by SNMP/ospf.if.state[ospfIfState.{#SNMPINDEX}])=1 and last(/Huawei VRP OSPF by
            SNMP/ospf.if.adminstat[ospfIfAdminStat.{#SNMPINDEX}])=1
          name: OSPF interface {#SNMPINDEX} is down
          priority: HIGH
          description: OSPF is administratively enabled on this interface but its OSPF state is down.
          tags:
          - tag: scope
            value: availability
      - uuid: 0ba28fced4524dfc86c3b608aa5164f7
        name: 'OSPF interface {#SNMPINDEX}: State changes'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.14.7.1.15.{#SNMPINDEX}
        key: ospf.if.events[ospfIfEvents.{#SNMPINDEX}]
        delay: 1m
        history: 7d
        description: 'MIB: OSPF-MIB

          ospfIfEvents - cumulative count of state changes/errors on this interface.'
        tags:
        - tag: component
          value: ospf-interface
        - tag: interface
          value: '{#SNMPINDEX}'
        trigger_prototypes:
        - uuid: 8f5ad12327f843b19028106a4cb89776
          expression: (last(/Huawei VRP OSPF by SNMP/ospf.if.events[ospfIfEvents.{#SNMPINDEX}])-min(/Huawei VRP OSPF by SNMP/ospf.if.events[ospfIfEvents.{#SNMPINDEX}],10m))>{$OSPF.IF.EVENTS.MAX.WARN}
          name: OSPF interface {#SNMPINDEX} is flapping
          event_name: OSPF interface {#SNMPINDEX} is flapping (>{$OSPF.IF.EVENTS.MAX.WARN} state changes in 10m)
          priority: WARNING
          description: The OSPF interface state changed too many times in a short period.
          tags:
          - tag: scope
            value: availability
          - tag: scope
            value: performance
      - uuid: 7641922dedb149928ce0398db4b695ac
        name: 'OSPF interface {#SNMPINDEX}: Designated router'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.14.7.1.23.{#SNMPINDEX}
        key: ospf.if.dr[ospfIfDesignatedRouterId.{#SNMPINDEX}]
        delay: 15m
        history: 7d
        trends: '0'
        value_type: CHAR
        description: 'MIB: OSPF-MIB

          ospfIfDesignatedRouterId - Router ID of the elected Designated Router on this network.'
        preprocessing:
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1h
        tags:
        - tag: component
          value: ospf-interface
        - tag: interface
          value: '{#SNMPINDEX}'
      - uuid: eb81ff14c0b1446da458d8415f1e626b
        name: 'OSPF interface {#SNMPINDEX}: Backup designated router'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.14.7.1.24.{#SNMPINDEX}
        key: ospf.if.bdr[ospfIfBackupDesignatedRouterId.{#SNMPINDEX}]
        delay: 15m
        history: 7d
        trends: '0'
        value_type: CHAR
        description: 'MIB: OSPF-MIB

          ospfIfBackupDesignatedRouterId - Router ID of the elected Backup Designated Router.'
        preprocessing:
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1h
        tags:
        - tag: component
          value: ospf-interface
        - tag: interface
          value: '{#SNMPINDEX}'
    - uuid: 8f00f28260bc40e79347f1b4e5ceccf1
      name: OSPF area discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#AREA_ID},1.3.6.1.2.1.14.2.1.1]
      key: ospf.area.discovery
      delay: 1h
      description: 'OSPF-MIB::ospfAreaTable discovery. {#SNMPINDEX} = ospfAreaId. Before this template can read any data,
        the OSPF process on the Huawei VRP device must be bound to SNMP: system-view / ospf <process-id> / quit / ospf mib-binding
        <process-id>. By default OSPF processes are NOT bound to SNMP (RFC 4750 OSPF-MIB stays empty otherwise).'
      item_prototypes:
      - uuid: 1d5a1bb905ab40bc815aa78f55bac235
        name: 'OSPF area {#SNMPINDEX}: SPF runs'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.14.2.1.4.{#SNMPINDEX}
        key: ospf.area.spfruns[ospfSpfRuns.{#SNMPINDEX}]
        delay: 1m
        history: 7d
        description: 'MIB: OSPF-MIB

          ospfSpfRuns - number of times the SPF (Dijkstra) calculation has run for this area.'
        tags:
        - tag: component
          value: ospf-area
        - tag: area
          value: '{#SNMPINDEX}'
        trigger_prototypes:
        - uuid: 9b8877aa08654ed3b4b287fddb91de7a
          expression: (last(/Huawei VRP OSPF by SNMP/ospf.area.spfruns[ospfSpfRuns.{#SNMPINDEX}])-min(/Huawei VRP OSPF by
            SNMP/ospf.area.spfruns[ospfSpfRuns.{#SNMPINDEX}],10m))>{$OSPF.AREA.SPFRUNS.MAX.WARN}
          name: 'OSPF area {#SNMPINDEX}: High SPF recalculation rate'
          event_name: 'OSPF area {#SNMPINDEX}: High SPF recalculation rate (>{$OSPF.AREA.SPFRUNS.MAX.WARN} runs in 10m)'
          priority: WARNING
          description: The area recalculated SPF too many times in a short period, indicating topology instability.
          tags:
          - tag: scope
            value: availability
          - tag: scope
            value: performance
      - uuid: 30f37f0c80254617a5f0bae9b1e895ce
        name: 'OSPF area {#SNMPINDEX}: LSA count'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.14.2.1.7.{#SNMPINDEX}
        key: ospf.area.lsacount[ospfAreaLsaCount.{#SNMPINDEX}]
        delay: 15m
        history: 7d
        description: 'MIB: OSPF-MIB

          ospfAreaLsaCount - total LSAs in this area link state database (excludes AS-external).'
        tags:
        - tag: component
          value: ospf-area
        - tag: area
          value: '{#SNMPINDEX}'
      - uuid: 1e57fd040ef24db69d72699e6804b52b
        name: 'OSPF area {#SNMPINDEX}: ABR count'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.14.2.1.5.{#SNMPINDEX}
        key: ospf.area.abrcount[ospfAreaBdrRtrCount.{#SNMPINDEX}]
        delay: 15m
        history: 7d
