                      data[i]['{#SENSOR_UNIT}'] = (kind === 'Fan speed') ? 'rpm' : (units[type] || '');
                      data[i]['{#SENSOR_KIND}'] = kind;
                  
                      // Descriptions come in a few shapes:
                      //   "DOM RX Power Sensor for Eth1/1/1" -> per-lane on a breakout port
                      //   "DOM Temperature Sensor for Eth1/1" -> per-port, real interface suffix
                      //   "Tachometers for FAN 1"            -> "for <id>", but not an interface
                      //   "Temperature for PSU 1"            -> same, and prefix just repeats the kind
