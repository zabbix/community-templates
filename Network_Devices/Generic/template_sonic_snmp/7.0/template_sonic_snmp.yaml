            No discovery-rule filter here (see sensor.discovery's description for why) - the JS preprocessing below filters the array directly instead.
            SONiC's sonic-snmpagent is the source of this table. Confirmed POPULATED on the hardware/build this template was authored against (DellEMC-S5232f-C32, Enterprise SONiC 4.6.0 Standard) - CPU/ASIC/system temperature, PSU temperature/voltage/current/power, fan tachometers, and per-port DOM temperature all present.
            entPhysicalTable also contains pure container/aggregate entries (chassis, fan tray, individual fan, PSU-as-a-whole, MGMT) that appear in this same walk but have neither an entPhySensorType nor an entPhySensorValue - polling them would immediately go "Not supported". The filter below requires both to look like real numbers before an item gets created; confirmed against a real walk (445 physical entities, 398 with an actual sensor row, 47 without - 47x2 = 94 "Not supported" items is what you'd see without this filter).
          item_prototypes:
            - uuid: ff61fd195baa4f02b0949008c41ed22a
              name: '{#SENSOR_DISPLAY}: Status'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.99.1.1.1.5.{#SNMPINDEX}'
              key: 'sonic.sensor.chassis.status[{#SNMPINDEX}]'
              delay: 5m
              trends: '0'
              description: |
                MIB: ENTITY-SENSOR-MIB
                entPhySensorOperStatus: ok(1), unavailable(2), nonoperational(3).
              valuemap:
                name: 'ENTITY-SENSOR-MIB::entPhySensorOperStatus'
              tags:
                - tag: component
                  value: '{#SENSOR_COMPONENT}'
                - tag: measurement
                  value: '{#SENSOR_KIND}'
                - tag: sensor
                  value: '{#SENSOR_LABEL}'
              trigger_prototypes:
                - uuid: 79374d6486194dab9d9ef0f4b98dd3d0
                  expression: 'last(/SONiC by SNMP/sonic.sensor.chassis.status[{#SNMPINDEX}])=3'
                  name: 'SONiC: {#SENSOR_DISPLAY} is non-operational'
                  priority: HIGH
                  tags:
                    - tag: scope
                      value: availability
                - uuid: d07f5e0405d64f1e865e2ea3c780a3bf
                  expression: 'last(/SONiC by SNMP/sonic.sensor.chassis.status[{#SNMPINDEX}])=2'
                  name: 'SONiC: {#SENSOR_DISPLAY} is unavailable'
                  priority: WARNING
                  dependencies:
                    - name: 'SONiC: {#SENSOR_DISPLAY} is non-operational'
                      expression: 'last(/SONiC by SNMP/sonic.sensor.chassis.status[{#SNMPINDEX}])=3'
                  tags:
                    - tag: scope
                      value: availability
            - uuid: fbbef933b20d4f639fde8a27ec320011
              name: '{#SENSOR_NAME}'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.99.1.1.1.4.{#SNMPINDEX}'
              key: 'sonic.sensor.chassis.value[{#SNMPINDEX}]'
              delay: 3m
              value_type: FLOAT
              units: '{#SENSOR_UNIT}'
              description: |
                MIB: ENTITY-SENSOR-MIB
