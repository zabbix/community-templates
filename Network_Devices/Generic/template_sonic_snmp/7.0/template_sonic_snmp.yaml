                          var suffix = m[2];
                          if (/^[A-Za-z]+[0-9]+(\/[0-9]+)*$/.test(suffix)) {
                              // A real interface name, possibly a specific lane on a breakout port
                              // (Eth1/1/1..4). Tag with just the parent port (first two segments) so it
                              // matches the ifName the linked "Linux by SNMP" template tags its own
                              // interface items with, but keep the full lane path in the display name.
                              ifname = suffix.split('/').slice(0, 2).join('/');
                              label = prefix;
                              display = suffix + ' ' + prefix;
                          } else if (prefix.toLowerCase() === kind.toLowerCase() || prefix === 'Tachometers') {
                              // prefix only repeats what {#SENSOR_KIND} already says - keep just the
                              // identifying part ("FAN 1", "PSU 1")
                              label = suffix;
                              display = suffix;
                          } else {
                              label = prefix + ' ' + suffix;
                              display = label;
                          }
                      }
                      label = label.replace(/ Sensor$/, '');
                      display = display.replace(/ Sensor$/, '');
                      // Merge every PSU sub-sensor ("PSU1 Airflow", "PSU 1 FAN 1", "PSU 1") into one
                      // "PSU 1" sensor tag value - the display name keeps the full detail, only the
                      // tag (used for grouping/filtering) collapses.
                      var psuMatch = label.match(/PSU\s?([0-9]+)/i);
                      if (psuMatch) {
                          label = 'PSU ' + psuMatch[1];
                      }
                      data[i]['{#SENSOR_IFNAME}'] = ifname;
                      data[i]['{#SENSOR_LABEL}'] = label;
                      data[i]['{#SENSOR_DISPLAY}'] = display;
                      // Only append the kind if it isn't already implied by the display text
                      // (avoids "DOM Temperature: Temperature" while still adding it to "CPU On-board").
                      data[i]['{#SENSOR_NAME}'] = (display.toLowerCase().indexOf(kind.toLowerCase()) !== -1) ? display : (display + ': ' + kind);

                      // Component classification, so these line up with the linked "Linux by SNMP"
                      // template's own component tags (e.g. filter component:cpu to see both CPU
                      // utilization and CPU On-board temperature together) instead of one flat "sensor".
                      var component = 'chassis';
                      if (descr === 'CPU On-board') component = 'cpu';
                      else if (descr === 'ASIC On-board') component = 'asic';
                      else if (/PSU/i.test(descr)) component = 'psu';
                      else if (/FAN|Tachometers/i.test(descr)) component = 'fan';
                      else if (ifname) component = 'network';
                      data[i]['{#SENSOR_COMPONENT}'] = component;
                  }
                  data = data.filter(function(row) {
                      return /^-?[0-9]+$/.test(row['{#SENSOR_HASVALUE}']) &&
                             /^[0-9]+$/.test(row['{#SENSOR_TYPE}']) &&
                             row['{#SENSOR_IFNAME}'] === '';
                  });
                  return JSON.stringify(data);
      tags:
        - tag: class
          value: network
        - tag: target
          value: sonic
      macros:
        - macro: '{$SENSOR.DOM.IGNORE}'
          value: '0'
          description: 'Set to 1 with an interface context (e.g. {$SENSOR.DOM.IGNORE:"Eth1/34"}=1 at the host level) to silence the "is unavailable" trigger for a port''s DOM sensors - useful for ports with a non-optical transceiver (e.g. an SFP-to-RJ45 copper module), which will always report RX/TX power and TX bias as unavailable(2) since there is no laser/photodiode to read. Does not affect non-operational(3), which still alerts.'
        - macro: '{$SENSOR.TEMP.CRIT}'
          value: '65'
          description: 'Critical temperature threshold (deg C) for ENTITY-SENSOR-MIB sensors of type celsius(8). Verify against real sensor readings before relying on it.'
        - macro: '{$SENSOR.TEMP.WARN}'
          value: '55'
          description: 'Warning temperature threshold (deg C) for ENTITY-SENSOR-MIB sensors of type celsius(8). Verify against real sensor readings before relying on it.'
        - macro: '{$VFS.FS.FSNAME.NOT_MATCHES}'
          value: ^(/dev|/sys|/run|/proc|/etc|/host|/tmp|/var/tmp|.+/shm$)
          description: 'Overrides the "Linux by SNMP" default. SONiC''s hrStorageTable reports numerous Docker bind-mount pseudo-filesystems (confirmed: /etc/hosts, /etc/resolv.conf, /etc/hostname, /host/reboot-cause, /tmp, /var/tmp) alongside real memory pools - these are filtered out here. Adjust if your build differs.'
      valuemaps:
        - uuid: 01c35e38a61340b28de01151df2186fc
          name: 'ENTITY-SENSOR-MIB::entPhySensorOperStatus'
          mappings:
            - value: '1'
              newvalue: ok
            - value: '2'
              newvalue: unavailable
            - value: '3'
              newvalue: nonoperational
