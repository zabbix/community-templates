              name: 'FS [{#FSNAME}]: Get data'
              type: DEPENDENT
              key: 'opns.disk.data[{#FSNAME},data]'
              history: 1h
              value_type: TEXT
              description: 'Intermediate data of `{#FSNAME}` filesystem.'
              preprocessing:
                - type: JSONPATH
