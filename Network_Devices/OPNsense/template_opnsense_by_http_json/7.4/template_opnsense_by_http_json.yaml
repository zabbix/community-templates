                - tag: fstype
                  value: '{#FSTYPE}'
          master_item:
            key: opns.raw.disk
          lld_macro_paths:
            - lld_macro: '{#FSNAME}'
              path: $.mountpoint
            - lld_macro: '{#FSTYPE}'
              path: $.type
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.devices
