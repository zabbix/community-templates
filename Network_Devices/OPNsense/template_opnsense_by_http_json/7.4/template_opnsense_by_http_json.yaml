zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 36bff6c29af64692839d077febfc7079
      name: 'Templates/Network devices'
    - uuid: 846977d1dfed4968bc5f8bdb363285bc
      name: 'Templates/Operating systems'
  templates:
    - uuid: dd3517f0536a49dc89e09fff62ec369b
      template: 'OPNsense by HTTP-JSON'
      name: 'OPNsense by HTTP-JSON'
      vendor:
        name: 'community'
        version: '0.34'
      groups:
        - name: 'Templates/Network devices'
        - name: 'Templates/Operating systems'
      items:
        - uuid: 1f53848b6556415bad14ca593e242312
          name: 'UPS Battery Charge'
          type: DEPENDENT
          key: nut.battery.charge
          units: '%'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.[''battery.charge'']'
          master_item:
            key: opns.ups.raw
          triggers:
            - uuid: fa0f6277664d4427a8674f572646653a
              expression: 'last(/OPNsense by HTTP-JSON/nut.battery.charge)<{$OPNS.NUT.BAT.LOW}'
              name: 'Battery charge is below {$OPNS.NUT.BAT.LOW}'
              opdata: '{ITEM.LASTVALUE}'
              priority: WARNING
        - uuid: 9905b20ba7b94ceaa89383fef9d65881
          name: 'UPS Battery Load'
          type: DEPENDENT
          key: nut.battery.load
          units: '%'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.[''ups.load'']'
          master_item:
            key: opns.ups.raw
          triggers:
            - uuid: 6d5a3fb4005e499e9431992e931435ba
              expression: 'last(/OPNsense by HTTP-JSON/nut.battery.load)>{$OPNS.NUT.HIGH.LOAD}'
              name: 'High Load on UPS Battery'
              opdata: '{ITEM.LASTVALUE}'
              priority: AVERAGE
        - uuid: 038a71496e2a48eaa790e5ef621e9a8b
          name: 'UPS Battery Runtime'
          type: DEPENDENT
          key: nut.battery.runtime
          units: s
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.[''battery.runtime'']'
          master_item:
            key: opns.ups.raw
          triggers:
            - uuid: 010e7496f772485e863eded1daa1b679
              expression: 'last(/OPNsense by HTTP-JSON/nut.battery.runtime)<{$OPNS.NUT.BAT.RUNTIME}'
              name: 'Remaining battery runtime is low'
              opdata: '{ITEM.LASTVALUE}'
              priority: HIGH
        - uuid: 4dc13074716e448ba307cf03701daaaf
          name: 'UPS Input Frequency'
          type: DEPENDENT
          key: nut.input.frequency
          units: Hz
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.[''input.frequency'']'
          master_item:
            key: opns.ups.raw
        - uuid: 4bdbb273b5eb45d190a07373868f2fa1
          name: 'UPS Input Voltage'
          type: DEPENDENT
          key: nut.input.voltage
          units: V
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.[''input.voltage'']'
          master_item:
            key: opns.ups.raw
        - uuid: 5cf8a50cf85a4be59946184960bc9baa
          name: 'UPS Model'
          type: DEPENDENT
          key: nut.model
          value_type: TEXT
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.[''ups.model'']'
          master_item:
            key: opns.ups.raw
        - uuid: 5e6a558e1c6d42ca9140213cb709d983
          name: 'UPS Output Voltage'
          type: DEPENDENT
          key: nut.output.voltage
          units: V
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.[''output.voltage'']'
          master_item:
            key: opns.ups.raw
        - uuid: 47bd34b6852b4bb292fa19a682359004
          name: 'UPS Status'
          type: DEPENDENT
          key: nut.status
          value_type: TEXT
          description: |
            OL = On Line = UPS is powered by mains electricity, supplying power to connected devices.
            OB = On Battery = UPS is running on battery power due to mains failure.
            LB = Low Battery = Battery charge is critically low. UPS will shut down soon.
            RB = Replace Battery = Battery needs replacement (age or health issue).
            HB = High Battery = Battery is fully charged (rare, but possible).
            CHRG = Charging = Battery is currently being charged.
            DISCHRG = Discharging = Battery is discharging (same as OB, but more specific).
            OVER = Overload = UPS is overloaded (load exceeds capacity).
            ALARM = Alarm Active = UPS has triggered an alarm (e.g., overload, battery fault).
            CAL = Calibrating = UPS is performing battery calibration.
            COMMLOST = Communication Lost = Communication with UPS is lost.
            OFF = Off = UPS is powered off.
            ONBATT = On Battery = Same as OB.
            TRIM = Trim = Mains voltage is low, UPS is reducing voltage (step-down).
            BOOST = Boost = Mains voltage is high, UPS is increasing voltage (step-up).
            SYNC = Synchronizing = UPS is synchronizing with mains (rare).
            TEST = Test = Running	UPS is running a self-test.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.[''ups.status'']'
          master_item:
            key: opns.ups.raw
          triggers:
            - uuid: 1e308c6da595465297a191b4f6abe7fb
              expression: 'find(/OPNsense by HTTP-JSON/nut.status,#1,"like","LB")=1'
              name: 'Battey low'
              priority: DISASTER
            - uuid: 7e29741d0a604e7f9f6a58f473285603
              expression: 'find(/OPNsense by HTTP-JSON/nut.status,#1,"like","OB")=1'
              name: 'UPS on Battery'
              priority: HIGH
        - uuid: bf7c17f8b2094ec391ae4c4f58f45be3
          name: 'CPU load'
          type: DEPENDENT
          key: opns.cpu.load
          history: 1d
          value_type: FLOAT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.loadavg
            - type: REGEX
              parameters:
                - ^(\d+\.\d+)
                - \1
          master_item:
            key: opns.raw.load
          triggers:
            - uuid: 139a626f4d2a486ba7eb21d3eda124bd
              expression: 'min(/OPNsense by HTTP-JSON/opns.cpu.load,5m)>{$OPNS.CPU.LOAD.MAX}'
              name: 'CPU load is high'
              opdata: '{ITEM.LASTVALUE}'
              priority: WARNING
        - uuid: e525a08df2e24efea29f8b9ceb1cd48a
          name: 'Firewall states current'
          type: DEPENDENT
          key: opns.fw.states.current
          history: 1d
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.current
          master_item:
            key: opns.raw.fw.states
          tags:
            - tag: component
              value: firewall
        - uuid: 54937ff84f994bfcba2b4cd2e1d9465d
          name: 'Firewall states max'
          type: DEPENDENT
          key: opns.fw.states.max
          history: 1d
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.limit
          master_item:
            key: opns.raw.fw.states
          tags:
            - tag: component
              value: firewall
        - uuid: f6fab497a5734651a596ef0752999120
          name: 'RAW IPsec Phase1'
          type: HTTP_AGENT
          key: opns.ipsec.phase1.raw
          delay: 5m
          history: 1d
          value_type: TEXT
          status: DISABLED
          authtype: BASIC
          username: '{$OPNS.KEY}'
          password: '{$OPNS.SECRET}'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.rows
          url: 'https://{HOST.IP}/api/ipsec/sessions/searchPhase1'
          tags:
            - tag: component
              value: raw
        - uuid: 863da87dd15b47e98e34ee5cb0ecefc0
          name: 'RAW IPsec Phase2'
          type: HTTP_AGENT
          key: opns.ipsec.phase2.raw
          delay: 5m
          history: 1d
          value_type: TEXT
          status: DISABLED
          authtype: BASIC
          username: '{$OPNS.KEY}'
          password: '{$OPNS.SECRET}'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.rows
          url: 'https://{HOST.IP}/api/ipsec/sessions/searchPhase2'
          tags:
            - tag: component
              value: raw
        - uuid: 7945ce5b7e174b9e8f6ea6da6dd64060
          name: 'RAW WireGuard'
          type: HTTP_AGENT
          key: opns.wireguard.raw
          delay: 1m
          history: 1d
          value_type: TEXT
          authtype: BASIC
          username: '{$OPNS.KEY}'
          password: '{$OPNS.SECRET}'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.rows
          url: 'https://{HOST.IP}:{$OPNS.PORT}/api/wireguard/service/show'
          tags:
            - tag: component
              value: raw
        - uuid: f8800baa079b46f485a049ee02d61b57
          name: 'ARC Memory'
          type: DEPENDENT
          key: opns.memory.arc
          history: 1d
          units: B
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.memory.arc
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
          description: 'ZFS ARC memory usage in bytes. Returns 0 when ARC data is absent, for example on UFS systems.'
          master_item:
            key: opns.raw.memory.status
        - uuid: 552ff5f7fb0f49f0aa069311a22fe282
          name: 'Total Memory'
          type: DEPENDENT
          key: opns.memory.total
          history: 1d
          units: B
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.memory.total
          master_item:
            key: opns.raw.memory.status
        - uuid: 3b0ee64a3c204c22a6d10662db8569ca
          name: 'Used Memory'
          type: DEPENDENT
          key: opns.memory.used
          history: 1d
          units: B
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.memory.used
          master_item:
            key: opns.raw.memory.status
        - uuid: bc1340c5c93f49f09608f02a06cbbb14
          name: 'Memory utilization in %'
          type: CALCULATED
          key: opns.memory.util
          units: '%'
          params: 'last(//opns.memory.used)*100/last(//opns.memory.total)'
          tags:
            - tag: component
              value: memory
          triggers:
            - uuid: 9da4ebacfb764e0b9c5942ceb86cc62d
              expression: 'min(/OPNsense by HTTP-JSON/opns.memory.util,5m)>{$OPNS.MEMORY.UTIL.MAX}'
              name: 'Memory utilization is high'
              opdata: '{ITEM.LASTVALUE}'
              priority: AVERAGE
        - uuid: 90c1c7dd19ed45038ec9281727d8a32b
          name: 'Licensed until'
          type: DEPENDENT
          key: opns.product.licenseuntil
          trends: '0'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.product.product_license.valid_to
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
            - type: JAVASCRIPT
              parameters:
                - |
                  function convertDateToUnixTimestamp(input) {
                      if (input === '0' || input === '' || input === null) {
                          return 0;
                      }
                      const date = new Date(input);
                      const unixTimestamp = Math.floor(date.getTime() / 1000);
                      if (isNaN(unixTimestamp)) {
                          return 0;
                      }
                      return unixTimestamp;
                  }
                  
                  return convertDateToUnixTimestamp(value);
          master_item:
            key: opns.raw.product.info
          triggers:
            - uuid: 740c029a6e7a49cb8eedc53e759eb6bb
              expression: 'last(/OPNsense by HTTP-JSON/opns.product.licenseuntil)>0 and (last(/OPNsense by HTTP-JSON/opns.product.licenseuntil) - now()) / 86400 < {$OPNS.LICENSE.EXPIRY.WARN}'
              name: 'OPNSense Business License expires soon'
              event_name: 'OPNSense Business License expires soon (less than {$OPNS.LICENSE.EXPIRY.WARN} days)'
              priority: AVERAGE
        - uuid: 6ebbcee115654039a5735c835bbdaa78
          name: 'Firmware update count'
          type: DEPENDENT
          key: opns.firmware.update.count
          history: 30d
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  if (data.status !== 'update' && data.status !== 'upgrade') {
                      return 0;
                  }
                  if (data.all_packages) {
                      return Object.keys(data.all_packages).length;
                  }
                  if (data.all_sets) {
                      return Object.keys(data.all_sets).length;
                  }
                  return 0;
          master_item:
            key: opns.raw.firmware.status
          tags:
            - tag: component
              value: firmware
        - uuid: daba216c1e654377982db23dfad0b0a0
          name: 'Firmware update packages'
          type: DEPENDENT
          key: opns.firmware.update.packages
          history: 30d
          value_type: TEXT
          trends: '0'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  var packages = data.all_packages || data.all_sets || {};
                  var result = [];
                  Object.keys(packages).sort().forEach(function (name) {
                      var pkg = packages[name];
                      result.push(pkg.name + ': ' + pkg.old + ' -> ' + pkg.new + ' (' + pkg.reason + ')');
                  });
                  return result.join('\n');
          master_item:
            key: opns.raw.firmware.status
          tags:
            - tag: component
              value: firmware
        - uuid: c38e9bd38f2749839673580d91239005
          name: 'Firmware update requires reboot'
          type: DEPENDENT
          key: opns.firmware.update.reboot
          history: 30d
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.status_reboot
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
          master_item:
            key: opns.raw.firmware.status
          tags:
            - tag: component
              value: firmware
        - uuid: ec1dbbdb46a1445f9c5595ab24a76083
          name: 'Firmware update status'
          type: DEPENDENT
          key: opns.firmware.update.status
          history: 30d
          value_type: TEXT
          trends: '0'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.status
          master_item:
            key: opns.raw.firmware.status
          tags:
            - tag: component
              value: firmware
          triggers:
            - uuid: 6003bfd5a8f44a6d9a04f08de932fef1
              expression: 'find(/OPNsense by HTTP-JSON/opns.firmware.update.status,#1,"regexp","^(update|upgrade)$")=1 and last(/OPNsense by HTTP-JSON/opns.firmware.update.count)>0'
              name: 'OPNsense firmware updates are available'
              event_name: 'OPNsense firmware updates are available ({ITEM.LASTVALUE})'
              opdata: 'Updates: {ITEM.LASTVALUE2}'
              priority: INFO
              description: 'A firmware update or major upgrade is available.'
            - uuid: a5755520c5e2491cb9b44cd9d1f438af
              expression: 'find(/OPNsense by HTTP-JSON/opns.firmware.update.status,#1,"eq","error")=1'
              name: 'OPNsense firmware update check failed'
              opdata: '{ITEM.LASTVALUE}'
              priority: WARNING
              description: 'The OPNsense firmware update check returned an error.'
        - uuid: 68ad33be2ee3422c8b711a243a860ca5
          name: 'Firmware update status message'
          type: DEPENDENT
          key: opns.firmware.update.status_msg
          history: 30d
          value_type: TEXT
          trends: '0'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.status_msg
          master_item:
            key: opns.raw.firmware.status
          tags:
            - tag: component
              value: firmware
        - uuid: 4d04720c72f4411fa5f7cd99cfad7f17
          name: 'CARP VIP count'
          type: DEPENDENT
          key: opns.ha.carp.vip.count
          history: 30d
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  var rows = data.rows || [];
                  var count = 0;
                  for (var i = 0; i < rows.length; i++) {
                      if (rows[i].mode === 'carp') {
                          count++;
                      }
                  }
                  return count;
          master_item:
            key: opns.raw.interfaces.carp
          tags:
            - tag: component
              value: ha
        - uuid: fd79a86e76414ca38d4a45f6d18ae9ae
          name: 'CARP is allowed'
          type: DEPENDENT
          key: opns.ha.carp.allowed
          history: 30d
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.carp.allow
          master_item:
            key: opns.raw.interfaces.carp
          tags:
            - tag: component
              value: ha
          triggers:
            - uuid: 7b99dad942d84c008e9531820d238976
              expression: '{$OPNS.HA.ENABLED}=1 and last(/OPNsense by HTTP-JSON/opns.ha.carp.allowed)=0 and last(/OPNsense by HTTP-JSON/opns.ha.carp.vip.count)>0'
              name: 'CARP is disabled'
              opdata: 'Allowed: {ITEM.LASTVALUE1}'
              priority: HIGH
              description: 'CARP is temporarily disabled while CARP VIPs are configured.'
        - uuid: 02db0d1b85944f2d9ea3f6770ad541d7
          name: 'CARP demotion level'
          type: DEPENDENT
          key: opns.ha.carp.demotion
          history: 30d
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.carp.demotion
          master_item:
            key: opns.raw.interfaces.carp
          tags:
            - tag: component
              value: ha
          triggers:
            - uuid: 989105f92053419d996862be22081fb2
              expression: '{$OPNS.HA.ENABLED}=1 and last(/OPNsense by HTTP-JSON/opns.ha.carp.demotion)>0 and last(/OPNsense by HTTP-JSON/opns.ha.carp.maintenance)=0'
              name: 'CARP demotion level is elevated'
              opdata: 'Demotion: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'A positive CARP demotion level can prevent this node from becoming MASTER.'
        - uuid: 88ee4fc92c53488d97af604cd4417736
          name: 'CARP maintenance mode'
          type: DEPENDENT
          key: opns.ha.carp.maintenance
          history: 30d
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.carp.maintenancemode
            - type: BOOL_TO_DECIMAL
          master_item:
            key: opns.raw.interfaces.carp
          tags:
            - tag: component
              value: ha
          triggers:
            - uuid: f0fd244461ef43aa88473dc80c4dcae2
              expression: '{$OPNS.HA.ENABLED}=1 and last(/OPNsense by HTTP-JSON/opns.ha.carp.maintenance)=1 and last(/OPNsense by HTTP-JSON/opns.ha.carp.vip.count)>0'
              name: 'CARP persistent maintenance mode is active'
              opdata: 'Maintenance: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'The firewall is in persistent CARP maintenance mode.'
        - uuid: 78fd1b3810a540aab653fb0642a1231e
          name: 'CARP status message'
          type: DEPENDENT
          key: opns.ha.carp.status_message
          value_type: TEXT
          trends: '0'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  return data.carp && data.carp.status_msg ? data.carp.status_msg : 'OK';
          master_item:
            key: opns.raw.interfaces.carp
          tags:
            - tag: component
              value: ha
          triggers:
            - uuid: d12b75ec9a8e4886a967dd0153c2bc82
              expression: '{$OPNS.HA.ENABLED}=1 and find(/OPNsense by HTTP-JSON/opns.ha.carp.status_message,#1,"ne","OK")=1'
              name: 'CARP reports a status warning'
              opdata: '{ITEM.LASTVALUE}'
              priority: WARNING
              description: 'OPNsense reports a global CARP status warning.'
        - uuid: 3dc8ff18a02d4f069cd3ef5a9ec5702b
          name: 'HA configuration synchronization is configured'
          type: DEPENDENT
          key: opns.ha.config_sync.configured
          history: 30d
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  return data.xmlrpc_configured;
          master_item:
            key: opns.raw.ha.settings
          tags:
            - tag: component
              value: ha
          triggers:
            - uuid: 62c414e49433480c8671aab366016e62
              expression: '{$OPNS.HA.ENABLED}=1 and last(/OPNsense by HTTP-JSON/opns.ha.config_sync.configured)=0 and {$OPNS.HA.CONFIG_SYNC.REQUIRED}=1'
              name: 'HA configuration synchronization is not configured'
              priority: WARNING
              description: 'This node is designated as the XMLRPC synchronization source, but no target is configured.'
        - uuid: 014669b71d5d4d208ee8e6db15385f8c
          name: 'HA configuration synchronization items'
          type: DEPENDENT
          key: opns.ha.config_sync.items
          value_type: TEXT
          trends: '0'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  return JSON.stringify(data.sync_items || {});
          master_item:
            key: opns.raw.ha.settings
          tags:
            - tag: component
              value: ha
        - uuid: a77c006dc95f4a8da5a3b192f2ae64cd
          name: 'HA configuration synchronization target'
          type: DEPENDENT
          key: opns.ha.config_sync.target
          value_type: TEXT
          trends: '0'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.xmlrpc_target
          master_item:
            key: opns.raw.ha.settings
          tags:
            - tag: component
              value: ha
        - uuid: c6fb744b4bab40d2a247054f56dad10c
          name: 'HA peer is reachable through XMLRPC'
          type: DEPENDENT
          key: opns.ha.peer.reachable
          history: 30d
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.reachable
          master_item:
            key: opns.raw.ha.peer.version
          tags:
            - tag: component
              value: ha
          triggers:
            - uuid: 9afd9d8b95564e6fb965150bf3f12471
              expression: '{$OPNS.HA.ENABLED}=1 and max(/OPNsense by HTTP-JSON/opns.ha.peer.reachable,10m)=0 and last(/OPNsense by HTTP-JSON/opns.ha.config_sync.configured)=1'
              name: 'HA peer is not reachable through XMLRPC'
              opdata: 'Reachable: {ITEM.LASTVALUE1}'
              priority: HIGH
              description: 'The configured HA peer did not answer the OPNsense XMLRPC version probe.'
        - uuid: 7658876fcb864b02b77019a1ff8c5db4
          name: 'HA peer firmware version'
          type: DEPENDENT
          key: opns.ha.peer.version
          value_type: TEXT
          trends: '0'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.remote_firmware
          master_item:
            key: opns.raw.ha.peer.version
          tags:
            - tag: component
              value: ha
        - uuid: 1ccf5cf49f33450391225bd4461733d0
          name: 'HA peer base version'
          type: DEPENDENT
          key: opns.ha.peer.version.base
          value_type: TEXT
          trends: '0'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.remote_base
          master_item:
            key: opns.raw.ha.peer.version
          tags:
            - tag: component
              value: ha
        - uuid: efcc2a309ca94a9686b96025455236ff
          name: 'HA peer kernel version'
          type: DEPENDENT
          key: opns.ha.peer.version.kernel
          value_type: TEXT
          trends: '0'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.remote_kernel
          master_item:
            key: opns.raw.ha.peer.version
          tags:
            - tag: component
              value: ha
        - uuid: d05fc49a5ef948a78eb0beaa609b62ad
          name: 'HA peer firmware version matches'
          type: DEPENDENT
          key: opns.ha.peer.version.match
          history: 30d
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.version_match
          master_item:
            key: opns.raw.ha.peer.version
          tags:
