          name: 'CPU load'
          type: DEPENDENT
          key: opns.cpu.load
          history: 1d
          value_type: FLOAT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.loadavg
            - type: REGEX
              parameters:
                - ^(\d+\.\d+)
                - \1
          master_item:
            key: opns.raw.load
          triggers:
            - uuid: 139a626f4d2a486ba7eb21d3eda124bd
              expression: 'min(/OPNsense by HTTP-JSON/opns.cpu.load,5m)>{$OPNS.CPU.LOAD.MAX}'
