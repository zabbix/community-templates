        - uuid: 2bc82e7f22a3476396ce1731aee50d8f
          name: 'States table utilization in %'
          type: CALCULATED
          key: opns.states.util
          history: 30d
          value_type: FLOAT
          units: '%'
          params: 'last(//opns.fw.states.current)*100/last(//opns.fw.states.max)'
          tags:
            - tag: component
              value: firewall
          triggers:
            - uuid: 7421fd082b4a4fb0b5e57d20475b310f
              expression: 'min(/OPNsense by HTTP-JSON/opns.states.util,#3)>{$OPNS.STATE.TABLE.UTIL.MAX}'
              name: 'State table usage is high'
              event_name: 'State table usage more than {$OPNS.STATE.TABLE.UTIL.MAX}.'
              opdata: 'Current utilization: {ITEM.LASTVALUE}'
              priority: WARNING
              description: 'Please check the number of connections.'
        - uuid: f58b046d6e554f129272472d79f00389
          name: 'System Uptime'
          type: DEPENDENT
          key: opns.system.uptime
          history: 1d
          value_type: FLOAT
          units: uptime
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.uptime
            - type: JAVASCRIPT
              parameters:
                - |
                  var str = value.trim();
                            var days = 0;
                            var hours = 0;
                            var minutes = 0;
                            var seconds = 0;
                  
                            // Extract days if present
                            var dayMatch = str.match(/(\d+)\s*days?/);
                            if (dayMatch) {
                                days = parseInt(dayMatch[1]);
                            }
                  
                            // Extract HH:MM:SS
                            var timeMatch = str.match(/(\d{1,2}):(\d{2}):(\d{2})/);
                            if (timeMatch) {
                                hours = parseInt(timeMatch[1]);
                                minutes = parseInt(timeMatch[2]);
                                seconds = parseInt(timeMatch[3]);
                            }
                  
                            return (days * 86400) + (hours * 3600) + (minutes * 60) + seconds;
          master_item:
            key: opns.raw.load
          triggers:
            - uuid: 2bf11a893917405195b8aef0620f4a30
              expression: 'last(/OPNsense by HTTP-JSON/opns.system.uptime)<600'
              name: '{HOST.NAME} has been restarted'
              priority: INFO
        - uuid: 4dee0747d2ef4530999ae8535d8aba49
          name: 'RAW UPS'
          type: HTTP_AGENT
          key: opns.ups.raw
          delay: 5m
          history: 1d
          value_type: TEXT
          status: DISABLED
          authtype: BASIC
          username: '{$OPNS.KEY}'
          password: '{$OPNS.SECRET}'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  var raw = data.response || "";
                  var result = {};
                  var lines = raw.split("\n");
                  
                  for (var i = 0; i < lines.length; i++) {
                      var line = lines[i].trim();
                      var idx = line.indexOf(": ");
                      if (idx > -1) {
                          var key = line.substring(0, idx).trim();
                          var val = line.substring(idx + 2).trim();
                          result[key] = val;
                      }
                  }
                  return JSON.stringify(result);
          url: 'https://{HOST.IP}:{$OPNS.PORT}/api/nut/diagnostics/upsstatus'
          tags:
            - tag: component
              value: raw
      discovery_rules:
        - uuid: 9be88752e6114e32b72109b70d5fe671
          name: 'Cron Job Discovery'
          type: DEPENDENT
          key: opns.cron.job.discovery
          filter:
            conditions:
              - macro: '{#CRON.DESCRIPTION}'
                value: '{$OPNS.CRON.JOB.MATCHES}'
              - macro: '{#CRON.DESCRIPTION}'
                value: '{$OPNS.CRON.JOB.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
          lifetime: 1d
          item_prototypes:
            - uuid: a33322937cf84f81b381c85fa8d3f44f
              name: 'Cron job [{#CRON.DESCRIPTION}]: Command'
              type: DEPENDENT
              key: 'opns.cron.job.command[{#CRON.UUID}]'
              value_type: TEXT
              trends: '0'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.rows[?(@.uuid == "{#CRON.UUID}")].command.first()'
              master_item:
                key: opns.raw.cron.jobs
              tags:
                - tag: component
                  value: cron
                - tag: origin
                  value: '{#CRON.ORIGIN}'
            - uuid: 5e373f6096a547de9e2b3829e19e320b
              name: 'Cron job [{#CRON.DESCRIPTION}]: Enabled'
              type: DEPENDENT
              key: 'opns.cron.job.enabled[{#CRON.UUID}]'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.rows[?(@.uuid == "{#CRON.UUID}")].enabled.first()'
              master_item:
                key: opns.raw.cron.jobs
              tags:
                - tag: component
                  value: cron
                - tag: origin
                  value: '{#CRON.ORIGIN}'
              trigger_prototypes:
                - uuid: c9f937bc3a514fe5a69708a2f57a3269
                  expression: 'last(/OPNsense by HTTP-JSON/opns.cron.job.enabled[{#CRON.UUID}])=0'
                  name: 'Cron job [{#CRON.DESCRIPTION}] is disabled'
                  opdata: 'Enabled: {ITEM.LASTVALUE}'
                  priority: WARNING
                  description: 'The configured OPNsense cron job is disabled.'
            - uuid: 8bbf255d75c34404b3a83b0fdf1c1139
              name: 'Cron job [{#CRON.DESCRIPTION}]: Schedule'
              type: DEPENDENT
              key: 'opns.cron.job.schedule[{#CRON.UUID}]'
              value_type: TEXT
              trends: '0'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var data = JSON.parse(value);
                      var rows = data.rows || [];
                      for (var i = 0; i < rows.length; i++) {
                          if (rows[i].uuid === '{#CRON.UUID}') {
                              return [rows[i].minutes, rows[i].hours, rows[i].days,
                                  rows[i].months, rows[i].weekdays].join(' ');
                          }
                      }
                      throw 'Cron job {#CRON.UUID} not found';
              master_item:
                key: opns.raw.cron.jobs
              tags:
                - tag: component
                  value: cron
                - tag: origin
                  value: '{#CRON.ORIGIN}'
          master_item:
            key: opns.raw.cron.jobs
          lld_macro_paths:
            - lld_macro: '{#CRON.DESCRIPTION}'
              path: $.description
            - lld_macro: '{#CRON.ORIGIN}'
              path: $.origin
            - lld_macro: '{#CRON.UUID}'
              path: $.uuid
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.rows
        - uuid: 42db664817fa4d23803fe5be9eb4e0a1
          name: 'Disk Discovery'
          type: DEPENDENT
          key: opns.disk.discovery
          filter:
            conditions:
              - macro: '{#FSNAME}'
                value: '{$OPNS.FS.FSNAME.MATCHES}'
