          name: 'RAW Firmware Status'
          type: HTTP_AGENT
          key: opns.raw.firmware.status
          delay: 1d
          history: '0'
          value_type: TEXT
          authtype: BASIC
          username: '{$OPNS.KEY}'
          password: '{$OPNS.SECRET}'
          request_method: POST
          url: 'https://{HOST.IP}:{$OPNS.PORT}/api/core/firmware/status'
          tags:
