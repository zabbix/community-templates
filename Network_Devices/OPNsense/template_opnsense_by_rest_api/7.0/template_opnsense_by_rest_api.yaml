              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.interfaces.["{#OPNS.INTERFACE.DEVICE}"].["out4_pass_bytes"]'
                - type: CHANGE_PER_SECOND
              master_item:
                key: opns.raw.fw.interface.stat
              tags:
                - tag: component
                  value: firewall
                - tag: component
                  value: network
                - tag: description
                  value: '{#OPNS.INTERFACE.NAME}'
