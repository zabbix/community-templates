          master_item:
            key: opns.activity.raw
          tags:
            - tag: component
              value: cpu
        - uuid: ae9132d58e0949db843f69cf946b9107
          name: 'CPU: User time'
          type: DEPENDENT
          key: opns.cpu.user
          delay: '0'
          value_type: FLOAT
          units: '%'
          description: Share spent in user space, which covers the web interface, the configuration daemon and plugins such as an IDS.
          preprocessing:
            - type: REGEX
              parameters:
