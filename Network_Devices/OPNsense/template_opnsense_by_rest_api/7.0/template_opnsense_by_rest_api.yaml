          type: DEPENDENT
          key: opns.ntp.synced
          delay: '0'
          valuemap:
            name: NTP sync state
          description: 'Whether the daemon has settled on a time source. Unsynchronised is the state that matters: the clock then follows nothing and drifts freely.'
