                  value: '{#OPNS.INTERFACE.DEVICE}'
            - uuid: c2b14007b4c74549ae930033f369276f
              name: 'Interface [{#OPNS.INTERFACE.DEVICE}({#OPNS.INTERFACE.NAME})]: Bytes transmitted'
              type: DEPENDENT
              key: 'opns.interface.bytes.transmitted[{#OPNS.INTERFACE.DEVICE}]'
              trends: '0'
              units: Bps
              preprocessing:
                - type: JSONPATH
                  parameters:
