zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 36bff6c29af64692839d077febfc7079
      name: 'Templates/Network devices'
  templates:
    - uuid: 36a6356a22714fc3ab8ab859996493ef
      template: 'FortiAnalyzer by SNMP'
      name: 'FortiAnalyzer by SNMP'
      description: |
        Template for monitoring Fortinet FortiAnalyzer appliances via SNMP.

        Tested with:
        - Zabbix 7.0.31
        - FortiAnalyzer VM64 v7.6.7, build 3737
        - SNMPv3 with authPriv security level
        - SHA authentication and AES privacy protocols

        The template uses numeric OIDs and does not require Fortinet MIB files to be installed on the Zabbix server or proxy.

        Setup:
        1. Enable and configure SNMP on the FortiAnalyzer appliance.
        2. Add an SNMP interface to the FortiAnalyzer host in Zabbix.
        3. Configure the required SNMP credentials on the host interface.
        4. Link the "FortiAnalyzer by SNMP" template to the host.
        5. Wait for the initial polling and low-level discovery cycles to complete.

        Known limitations:
        - Validated only against FortiAnalyzer VM64 v7.6.7, build 3737.
        - HA-related triggers have not been validated against an active FortiAnalyzer HA cluster.
        - Hardware-specific sensors are not included.

        Author: Soroush Mehmandoust
        Version: 1.0
        Supported Zabbix version: 7.0 and later
      groups:
        - name: 'Templates/Network devices'
      items:
        - uuid: af599820e36242a3ba3110e9e3115181
          name: 'ADOMs: Configured domain count'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.12356.103.5.1.2.0
          key: faz.adom.count
          delay: 5m
          history: 7d
          trends: 90d
          description: 'Number of administrative domains currently configured on the FortiAnalyzer appliance.'
          tags:
            - tag: component
              value: adom
        - uuid: 9f007116e0504fc69b32ea71984ceec3
