        - uuid: 75079a69efae4e8584999d51e5d94b8a
          name: 'FortiAnalyzer: Memory used'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.12356.103.2.1.2.0
          key: faz.system.memory.used
