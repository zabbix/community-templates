        - uuid: 3c4184c5bda74bd285550be3b5588108
          name: 'FortiAnalyzer: Memory utilization'
          type: CALCULATED
          key: faz.system.memory.util
          history: 7d
          value_type: FLOAT
          trends: 90d
          units: '%'
          params: 'last(//faz.system.memory.used)/last(//faz.system.memory.total)*100'
          description: 'Percentage of total memory currently in use.'
          tags:
            - tag: component
              value: memory
          triggers:
            - uuid: b562978080874400a1efd3e9d92c148f
              expression: 'min(/FortiAnalyzer by SNMP/faz.system.memory.util,5m)>{$FAZ.MEMORY.UTIL.CRIT}'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'max(/FortiAnalyzer by SNMP/faz.system.memory.util,5m)<{$FAZ.MEMORY.UTIL.CRIT}'
              name: 'Memory utilization is critically high'
              opdata: 'Current utilization: {ITEM.LASTVALUE1}'
              priority: HIGH
              tags:
                - tag: component
                  value: memory
                - tag: scope
                  value: performance
            - uuid: 44376119de6749cd94c3e7eac9fdea50
              expression: 'min(/FortiAnalyzer by SNMP/faz.system.memory.util,5m)>{$FAZ.MEMORY.UTIL.WARN}'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'max(/FortiAnalyzer by SNMP/faz.system.memory.util,5m)<{$FAZ.MEMORY.UTIL.WARN}'
              name: 'Memory utilization is high'
              opdata: 'Current utilization: {ITEM.LASTVALUE1}'
