              dependencies:
                - name: 'Memory utilization is critically high'
                  expression: 'min(/FortiAnalyzer by SNMP/faz.system.memory.util,5m)>{$FAZ.MEMORY.UTIL.CRIT}'
                  recovery_expression: 'max(/FortiAnalyzer by SNMP/faz.system.memory.util,5m)<{$FAZ.MEMORY.UTIL.CRIT}'
              tags:
                - tag: component
                  value: memory
                - tag: scope
                  value: performance
        - uuid: a6a974d878ec49c5b314de235db1c041
          name: 'FortiAnalyzer: System name'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.5.0
          key: faz.system.name
          delay: 1h
          history: 7d
          value_type: CHAR
          trends: '0'
          description: 'Administratively assigned name of the FortiAnalyzer.'
          tags:
            - tag: component
              value: system
        - uuid: b765a6e40dc0490988eada608968aace
          name: 'FortiAnalyzer: System object ID'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.2.0
          key: faz.system.object_id
          delay: 1h
          history: 7d
          value_type: CHAR
          trends: '0'
          description: 'Vendor-assigned object identifier identifying the FortiAnalyzer platform.'
          tags:
            - tag: component
              value: system
        - uuid: 44f6d01a6df748ac84540421f74b4067
          name: 'FortiAnalyzer: Serial number'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.12356.100.1.1.1.0
          key: faz.system.serial
          delay: 1h
          history: 7d
          value_type: CHAR
          trends: '0'
          description: 'Serial number reported by the FortiAnalyzer appliance.'
          inventory_link: SERIALNO_A
          tags:
            - tag: component
              value: system
        - uuid: 8ed9a70cb2ae4f238f7efe0067bd6d6a
          name: 'FortiAnalyzer: Uptime'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.12356.103.2.1.8.0
          key: faz.system.uptime
          history: 7d
          trends: 90d
          units: uptime
          description: 'Time elapsed since the FortiAnalyzer management subsystem was last initialized.'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: 14fbe1943db04a278ab2351c7c529c35
              expression: 'last(/FortiAnalyzer by SNMP/faz.system.uptime)<10m'
              name: 'Host has been restarted'
              event_name: 'FortiAnalyzer has been restarted (uptime < 10m)'
              opdata: 'Current uptime: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'The FortiAnalyzer system uptime is less than 10 minutes, which indicates that the appliance or its SNMP management subsystem has recently restarted.'
              tags:
                - tag: component
                  value: system
                - tag: scope
                  value: availability
            - uuid: 8dda8a9c8116412ab2f4041a16f38b71
              expression: 'nodata(/FortiAnalyzer by SNMP/faz.system.uptime,{$FAZ.SNMP.NODATA.TIME})=1'
              name: 'No SNMP data collection'
              opdata: 'Last value: {ITEM.LASTVALUE1}'
              priority: HIGH
              description: 'No uptime data has been received from the FortiAnalyzer appliance during the configured time period. Check SNMP availability, credentials, firewall rules, and network connectivity.'
              tags:
                - tag: component
                  value: system
                - tag: scope
                  value: availability
        - uuid: 487716248b7d41efba57fbf3bf060267
          name: 'Managed VDOMs: Total'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.12356.103.6.1.2.0
          key: faz.vdom.count
          delay: 5m
          history: 7d
          trends: 90d
          description: 'Total number of VDOMs reported for devices managed by the FortiAnalyzer.'
          tags:
            - tag: component
              value: managed-device
      discovery_rules:
        - uuid: 6ef4206521d0475590ddc15758a8e962
          name: 'ADOM discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#ADOM.NAME},1.3.6.1.4.1.12356.103.5.2.1.2,{#ADOM.DEVICES},1.3.6.1.4.1.12356.103.5.2.1.5]'
          key: faz.adom.discovery
          delay: 1h
          filter:
            conditions:
              - macro: '{#ADOM.DEVICES}'
                value: '^[1-9][0-9]*$'
                formulaid: A
          enabled_lifetime_type: DISABLE_AFTER
          enabled_lifetime: 1d
          description: 'Discovers FortiAnalyzer administrative domains using the ADOM name and managed device count columns. By default, the discovery filter includes only ADOMs containing at least one managed device.'
          item_prototypes:
            - uuid: 2a95cf04388640fe8a32e4ef7d571e2b
              name: 'ADOM [{#ADOM.NAME}]: Analytics quota'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.12356.103.5.2.1.16.{#SNMPINDEX}'
              key: 'faz.adom.analytics.quota[{#SNMPINDEX}]'
              delay: 15m
              history: 7d
              trends: 90d
              units: B
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '1048576'
              tags:
                - tag: adom
                  value: '{#ADOM.NAME}'
                - tag: component
                  value: adom
            - uuid: f5ad1cf58874491db2780d1b3a15f5ef
              name: 'ADOM [{#ADOM.NAME}]: Analytics retention'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.12356.103.5.2.1.15.{#SNMPINDEX}'
              key: 'faz.adom.analytics.retention[{#SNMPINDEX}]'
              delay: 1h
              history: 7d
              trends: 90d
              units: d
              tags:
                - tag: adom
                  value: '{#ADOM.NAME}'
                - tag: component
                  value: adom
            - uuid: d994dbfd1c5541c6b19904ba200d0fc4
              name: 'ADOM [{#ADOM.NAME}]: Analytics used'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.12356.103.5.2.1.17.{#SNMPINDEX}'
              key: 'faz.adom.analytics.used[{#SNMPINDEX}]'
              delay: 15m
              history: 7d
              trends: 90d
              units: B
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '1048576'
              tags:
                - tag: adom
                  value: '{#ADOM.NAME}'
                - tag: component
                  value: adom
            - uuid: 840a7e889d534dc7ae91b03d869ccb27
              name: 'ADOM [{#ADOM.NAME}]: Analytics utilization'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.12356.103.5.2.1.18.{#SNMPINDEX}'
              key: 'faz.adom.analytics.utilization[{#SNMPINDEX}]'
              delay: 5m
              history: 7d
              value_type: FLOAT
              trends: 90d
              units: '%'
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '0.1'
              tags:
                - tag: adom
                  value: '{#ADOM.NAME}'
                - tag: component
                  value: adom
              trigger_prototypes:
                - uuid: 458dc6fdc7af43eda6721dbcb9aebbb1
                  expression: 'min(/FortiAnalyzer by SNMP/faz.adom.analytics.utilization[{#SNMPINDEX}],15m)>{$FAZ.ADOM.LOG.UTIL.CRIT}'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'max(/FortiAnalyzer by SNMP/faz.adom.analytics.utilization[{#SNMPINDEX}],15m)<{$FAZ.ADOM.LOG.UTIL.CRIT}'
                  name: 'ADOM [{#ADOM.NAME}]: Analytics log utilization is critically high'
                  opdata: 'Current utilization: {ITEM.LASTVALUE1}'
                  priority: HIGH
                  manual_close: 'YES'
                  tags:
                    - tag: adom
                      value: '{#ADOM.NAME}'
                    - tag: component
                      value: adom
                    - tag: scope
                      value: capacity
                    - tag: storage
                      value: analytics
                - uuid: 8dc1b7cc27684ed5a59b93025834ead4
                  expression: 'min(/FortiAnalyzer by SNMP/faz.adom.analytics.utilization[{#SNMPINDEX}],15m)>{$FAZ.ADOM.LOG.UTIL.WARN}'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'max(/FortiAnalyzer by SNMP/faz.adom.analytics.utilization[{#SNMPINDEX}],15m)<{$FAZ.ADOM.LOG.UTIL.WARN}'
                  name: 'ADOM [{#ADOM.NAME}]: Analytics log utilization is high'
                  opdata: 'Current utilization: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  manual_close: 'YES'
                  dependencies:
                    - name: 'ADOM [{#ADOM.NAME}]: Analytics log utilization is critically high'
                      expression: 'min(/FortiAnalyzer by SNMP/faz.adom.analytics.utilization[{#SNMPINDEX}],15m)>{$FAZ.ADOM.LOG.UTIL.CRIT}'
                      recovery_expression: 'max(/FortiAnalyzer by SNMP/faz.adom.analytics.utilization[{#SNMPINDEX}],15m)<{$FAZ.ADOM.LOG.UTIL.CRIT}'
                  tags:
                    - tag: adom
                      value: '{#ADOM.NAME}'
                    - tag: component
                      value: adom
                    - tag: scope
                      value: capacity
                    - tag: storage
                      value: analytics
            - uuid: e9cc97188f95491dae11c6eb7a4aa9be
