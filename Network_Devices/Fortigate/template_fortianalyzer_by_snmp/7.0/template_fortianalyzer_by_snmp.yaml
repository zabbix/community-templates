        - uuid: 70faa51a57a04d55892f65a53f7f1655
          name: 'FortiAnalyzer: CPU utilization'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.12356.103.2.1.1.0
          key: faz.system.cpu.util
          history: 7d
          trends: 90d
          units: '%'
          description: 'Current FortiAnalyzer CPU utilization, expressed as a percentage.'
          tags:
            - tag: component
              value: cpu
          triggers:
            - uuid: c32a54371c23432586cbb34cb7e7cf10
              expression: 'min(/FortiAnalyzer by SNMP/faz.system.cpu.util,5m)>{$FAZ.CPU.UTIL.CRIT}'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'max(/FortiAnalyzer by SNMP/faz.system.cpu.util,5m)<{$FAZ.CPU.UTIL.CRIT}'
              name: 'CPU utilization is critically high'
              opdata: 'Current utilization: {ITEM.LASTVALUE1}'
              priority: HIGH
              description: 'CPU utilization has remained above the configured critical threshold for 5 minutes.'
              tags:
                - tag: component
                  value: cpu
                - tag: scope
                  value: performance
            - uuid: 50bccac1faf0478b9acc19a944c67aa7
              expression: 'min(/FortiAnalyzer by SNMP/faz.system.cpu.util,5m)>{$FAZ.CPU.UTIL.WARN}'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'max(/FortiAnalyzer by SNMP/faz.system.cpu.util,5m)<{$FAZ.CPU.UTIL.WARN}'
              name: 'CPU utilization is high'
              opdata: 'Current utilization: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'CPU utilization has remained above the configured warning threshold for 5 minutes.'
              dependencies:
                - name: 'CPU utilization is critically high'
                  expression: 'min(/FortiAnalyzer by SNMP/faz.system.cpu.util,5m)>{$FAZ.CPU.UTIL.CRIT}'
                  recovery_expression: 'max(/FortiAnalyzer by SNMP/faz.system.cpu.util,5m)<{$FAZ.CPU.UTIL.CRIT}'
              tags:
                - tag: component
                  value: cpu
                - tag: scope
                  value: performance
        - uuid: 80f5614bd10a49888ed483c86bb16ea9
