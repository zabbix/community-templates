        - uuid: 1e1a9763ba1b4e27a3f1509ad92c16b4
          name: 'Log indexing lag'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.12356.103.2.1.12.0
          key: faz.log.indexing.lag
          history: 7d
          trends: 90d
          units: s
          description: 'Time difference between receiving and indexing logs.'
