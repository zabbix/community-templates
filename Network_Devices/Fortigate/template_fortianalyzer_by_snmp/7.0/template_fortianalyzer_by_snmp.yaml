              name: 'Log indexing lag is critically high'
              opdata: 'Current lag: {ITEM.LASTVALUE1}'
              priority: HIGH
              description: 'The delay between receiving and indexing logs has remained above the critical threshold.'
              tags:
                - tag: component
                  value: log
                - tag: scope
                  value: performance
            - uuid: 0f2abc05934544b392a7ae9fc3034c8e
              expression: 'min(/FortiAnalyzer by SNMP/faz.log.indexing.lag,5m)>{$FAZ.LOG.INDEXING.LAG.WARN}'
              name: 'Log indexing lag is high'
              opdata: 'Current lag: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'The delay between receiving and indexing logs has remained above the warning threshold.'
              dependencies:
                - name: 'Log indexing lag is critically high'
                  expression: 'min(/FortiAnalyzer by SNMP/faz.log.indexing.lag,5m)>{$FAZ.LOG.INDEXING.LAG.CRIT}'
              tags:
                - tag: component
                  value: log
                - tag: scope
                  value: performance
