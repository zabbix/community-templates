          key: faz.adom.enabled
          delay: 5m
          history: 7d
          trends: '0'
          description: |
            Indicates whether administrative domains are enabled on the FortiAnalyzer appliance.

            Possible values:
            1 - Disabled
            2 - Enabled
          valuemap:
            name: 'Fortinet boolean state'
          tags:
            - tag: component
