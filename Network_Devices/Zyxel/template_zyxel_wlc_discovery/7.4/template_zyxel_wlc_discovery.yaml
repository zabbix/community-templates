zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 307f4f8025ce4f7697c70b2c8367cd3c
      name: 'Templates/Network devices'
  templates:
    - uuid: a15ccea663ff4e0586ea4b271f20a5b9
      template: 'HW Zyxel WLC Discovery'
      name: 'HW Zyxel WLC Discovery'
      description: |
        Zyxel Wireless LAN Controller (NXC series) monitoring via SNMP. Tested on Zyxel NXC5500.
        - WLC health: uptime, inventory (model, firmware, serial number, location)
        - ICMP ping / loss / response time of the WLC
        - LLD of managed access points: admin status, associated stations, IP/MAC, ICMP checks to each AP
        - LLD of WLC interfaces: traffic, errors, operational status
        
        Requirements: Zabbix 7.4+, SNMP enabled on the WLC, fping on the server/proxy.
        Source: https://github.com/DuprTECH/Zabbix-Zyxel-WLC-NXC5500
        Contact / custom work: info@duprtech.sk
      groups:
        - name: 'Templates/Network devices'
      items:
        - uuid: 79a22b435d4c483ba31502746cd0f6e5
          name: 'WLC Location'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.6.0
          key: agentInventoryLocation
          delay: '3600'
          history: 1d
          value_type: TEXT
          inventory_link: LOCATION
          tags:
            - tag: Application
              value: General
        - uuid: 008fe3074a2e40f5a2620c50e9313340
          name: 'WLC Machine Model'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.890.1.15.3.1.10.0
          key: agentInventoryMachineModel
          delay: '3600'
          history: 1d
          value_type: TEXT
          inventory_link: MODEL
          tags:
            - tag: Application
              value: General
        - uuid: 666be663fa4e47afab2ad8a28a2ea616
          name: 'WLC Firmware Version'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.890.1.15.3.1.6.0
          key: agentInventoryOperatingSystem
          delay: '3600'
          history: 1d
          value_type: TEXT
          tags:
            - tag: Application
              value: General
        - uuid: 0bdc378a0f7b433f8c998883cc3242a6
          name: 'WLC Product Version'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.890.1.15.3.1.11.0
          key: agentInventoryProductVersion
          delay: '3600'
          history: 1d
          value_type: TEXT
          tags:
            - tag: Application
              value: General
        - uuid: fc152c218bce42a1966512d37d941dd3
          name: 'WLC Serial Number'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.890.1.15.3.1.12.0
          key: agentInventorySerialNumber
          delay: '3600'
          history: 1d
          value_type: TEXT
          inventory_link: SERIALNO_A
          tags:
            - tag: Application
              value: General
        - uuid: b53944221c32496c8f14f3e3c26e3b41
          name: 'ICMP loss'
          type: SIMPLE
          key: 'icmppingloss[,10,,24,]'
          history: 1w
          value_type: FLOAT
          units: '%'
          tags:
            - tag: Application
              value: Status
          triggers:
            - uuid: 3cacd9088d6f45c1959f8c45bd5d4b5d
              expression: 'min(/HW Zyxel WLC Discovery/icmppingloss[,10,,24,],5m)>{$ICMP_LOSS_WARN} and min(/HW Zyxel WLC Discovery/icmppingloss[,10,,24,],5m)<100'
              name: 'High ICMP ping loss'
              priority: HIGH
              description: 'Last value: {ITEM.LASTVALUE1}.'
              dependencies:
                - name: 'HOST DOWN ! (Unavailable by ICMP ping)'
                  expression: 'max(/HW Zyxel WLC Discovery/icmpping[,1,,24,],#3)=0'
        - uuid: 6bad3513243c4e6ca1322e9ffa77c7c8
          name: 'ICMP response time'
          type: SIMPLE
          key: 'icmppingsec[,1,,24,]'
          history: 1w
          value_type: FLOAT
          units: s
          tags:
            - tag: Application
              value: Status
          triggers:
            - uuid: 924c090ee2c84cfaa4b2d1dd9f6b720a
              expression: 'avg(/HW Zyxel WLC Discovery/icmppingsec[,1,,24,],5m)>{$ICMP_RESPONSE_TIME_WARN}'
              name: 'High ICMP ping response time'
              priority: WARNING
              description: 'Last value: {ITEM.LASTVALUE1}.'
              dependencies:
                - name: 'High ICMP ping loss'
                  expression: 'min(/HW Zyxel WLC Discovery/icmppingloss[,10,,24,],5m)>{$ICMP_LOSS_WARN} and min(/HW Zyxel WLC Discovery/icmppingloss[,10,,24,],5m)<100'
                - name: 'HOST DOWN ! (Unavailable by ICMP ping)'
                  expression: 'max(/HW Zyxel WLC Discovery/icmpping[,1,,24,],#3)=0'
        - uuid: 059236045b7b4079863ffaf83ad2ac01
          name: 'ICMP ping'
          type: SIMPLE
          key: 'icmpping[,1,,24,]'
          history: 1w
          valuemap:
            name: 'Service state 1'
          tags:
            - tag: Application
              value: Status
          triggers:
            - uuid: 4774e7a4b4584c648876d0a62fa5283e
              expression: 'max(/HW Zyxel WLC Discovery/icmpping[,1,,24,],#3)=0'
              name: 'HOST DOWN ! (Unavailable by ICMP ping)'
              priority: DISASTER
              description: |
                Last value: {ITEM.LASTVALUE1}.
                Last three attempts returned timeout.  Please check device connectivity.
        - uuid: 9cf276d392c7485a9c8bc30c0e861cf5
          name: 'WLC Uptime'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.3.0
          key: sysUpTimeInstance
          delay: '60'
          history: 1d
          value_type: FLOAT
          units: uptime
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: Application
              value: General
      discovery_rules:
        - uuid: a41c63b21e97439db5fb3b20925e4767
          name: 'WLC AP data'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#APMAC},1.3.6.1.4.1.890.1.15.3.5.11.1.2,{#APNAME},1.3.6.1.4.1.890.1.15.3.5.11.1.3,{#IPADDRESS},1.3.6.1.4.1.890.1.15.3.5.11.1.4,{#APSTATUS},1.3.6.1.4.1.890.1.15.3.5.11.1.6]'
          key: bsnAPName
          delay: 1h
          filter:
            evaltype: AND
            conditions:
              - macro: '{#APSTATUS}'
                value: '0'
                operator: NOT_MATCHES_REGEX
              - macro: '{#IPADDRESS}'
                value: 0.0.0.0
                operator: NOT_MATCHES_REGEX
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          item_prototypes:
            - uuid: a0cc4eee28f744abb75a8ae6e5894759
              name: '{#APNAME} AP ADMIN Status'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.890.1.15.3.5.11.1.6.{#SNMPINDEX}'
              key: 'bsnApAdminStatus[{#APMAC}]'
              history: 365d
              valuemap:
                name: 'Service state'
              tags:
                - tag: Application
                  value: 'AP Status'
            - uuid: 8d5bf66153af4ec99ffef86826c7d07a
              name: '{#APNAME} AP Base MAC Address'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.890.1.15.3.5.11.1.2.{#SNMPINDEX}'
              key: 'bsnApBaseMac[{#APMAC}]'
              delay: 1h
              history: 7d
              value_type: TEXT
              tags:
                - tag: Application
                  value: 'AP data'
            - uuid: 2c13b709ebf24214bbe7d2aa185b778a
              name: '{#APNAME} AP Total associated stations'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.890.1.15.3.5.11.1.5.{#SNMPINDEX}'
              key: 'bsnApIfNoOfUsers0[{#APMAC}]'
              history: 365d
              trends: 30d
              description: 'No of Users associated with this radio.'
              tags:
                - tag: Application
                  value: 'AP Status'
            - uuid: 3eea5ffa10a9482bba10f51040a20cc6
              name: '{#APNAME} AP Management IP'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.890.1.15.3.5.11.1.4.{#SNMPINDEX}'
              key: 'bsnApIpAddress[{#APMAC}]'
              delay: 1h
              history: 7d
              value_type: TEXT
              description: 'Clients (Mobile Stations)'
              tags:
                - tag: Application
                  value: 'AP data'
            - uuid: 3278ba9bb90c49a18ee0e7aafe267290
              name: '{#APNAME} AP ({#IPADDRESS}) ICMP Ping loss'
              type: SIMPLE
              key: 'icmppingloss[{#IPADDRESS},10,,24,]'
              delay: 5m
              history: 90d
              value_type: FLOAT
              units: '%'
              tags:
                - tag: Application
                  value: 'AP Status'
            - uuid: 6aa75e062ea642869c83be241762b8c8
              name: '{#APNAME} AP ({#IPADDRESS}) ICMP Ping time'
              type: SIMPLE
              key: 'icmppingsec[{#IPADDRESS},1,,24,]'
              delay: 5m
              history: 90d
              value_type: FLOAT
              units: s
              tags:
                - tag: Application
                  value: 'AP Status'
            - uuid: 953c845688d34b9da7e43acd2e167e6b
              name: '{#APNAME} AP ({#IPADDRESS}) ICMP Alive'
              type: SIMPLE
              key: 'icmpping[{#IPADDRESS},1,,24,]'
              history: 90d
              valuemap:
                name: 'Service state'
              tags:
                - tag: Application
                  value: 'AP Status'
          trigger_prototypes:
            - uuid: 35937cd3617c4f5d8884453e7e9645f9
              expression: 'min(/HW Zyxel WLC Discovery/icmppingloss[{#IPADDRESS},10,,24,],30m)>{$ICMP_LOSS_WARN_AP} and min(/HW Zyxel WLC Discovery/icmppingloss[{#IPADDRESS},10,,24,],30m)<100 and last(/HW Zyxel WLC Discovery/sysUpTimeInstance)>15m'
              name: 'WIFI AP: {#APNAME} [{#IPADDRESS}] High ICMP ping loss'
              priority: AVERAGE
              manual_close: 'YES'
              dependencies:
                - name: 'WIFI AP: {#APNAME} [{#IPADDRESS}] Unavailable by ICMP ping'
                  expression: 'avg(/HW Zyxel WLC Discovery/icmpping[{#IPADDRESS},1,,24,],5m)=0 and last(/HW Zyxel WLC Discovery/sysUpTimeInstance)>10m and  last(/HW Zyxel WLC Discovery/bsnApAdminStatus[{#APMAC}])<>0'
            - uuid: 20a36cb2b454410681b734ba4d81ddc7
              expression: 'avg(/HW Zyxel WLC Discovery/icmppingsec[{#IPADDRESS},1,,24,],30m)>{$ICMP_RESPONSE_TIME_WARN_AP} and last(/HW Zyxel WLC Discovery/sysUpTimeInstance)>10m'
              name: 'WIFI AP: {#APNAME} [{#IPADDRESS}] High ICMP ping response time'
              priority: WARNING
              dependencies:
                - name: 'WIFI AP: {#APNAME} [{#IPADDRESS}] High ICMP ping loss'
                  expression: 'min(/HW Zyxel WLC Discovery/icmppingloss[{#IPADDRESS},10,,24,],30m)>{$ICMP_LOSS_WARN_AP} and min(/HW Zyxel WLC Discovery/icmppingloss[{#IPADDRESS},10,,24,],30m)<100 and last(/HW Zyxel WLC Discovery/sysUpTimeInstance)>15m'
                - name: 'WIFI AP: {#APNAME} [{#IPADDRESS}] Unavailable by ICMP ping'
                  expression: 'avg(/HW Zyxel WLC Discovery/icmpping[{#IPADDRESS},1,,24,],5m)=0 and last(/HW Zyxel WLC Discovery/sysUpTimeInstance)>10m and  last(/HW Zyxel WLC Discovery/bsnApAdminStatus[{#APMAC}])<>0'
            - uuid: 93ab97e2782c490b908a8122a367c93b
              expression: 'avg(/HW Zyxel WLC Discovery/icmpping[{#IPADDRESS},1,,24,],5m)=0 and last(/HW Zyxel WLC Discovery/sysUpTimeInstance)>10m and  last(/HW Zyxel WLC Discovery/bsnApAdminStatus[{#APMAC}])<>0'
              name: 'WIFI AP: {#APNAME} [{#IPADDRESS}] Unavailable by ICMP ping'
              priority: AVERAGE
              manual_close: 'YES'
          graph_prototypes:
            - uuid: 0eac4cd9728647ba8756e1101de884ae
              name: '{#APNAME} [{#IPADDRESS}] Associated stations'
              show_work_period: 'NO'
              show_triggers: 'NO'
              ymin_type_1: FIXED
              graph_items:
                - sortorder: '1'
                  color: 0080FF
                  item:
                    host: 'HW Zyxel WLC Discovery'
                    key: 'bsnApIfNoOfUsers0[{#APMAC}]'
            - uuid: 14595d44273646e6903c45fa62dc446f
              name: '{#APNAME} [{#IPADDRESS}] Ping a loss'
              graph_items:
                - sortorder: '1'
                  drawtype: BOLD_LINE
                  color: 0080FF
                  yaxisside: RIGHT
                  item:
                    host: 'HW Zyxel WLC Discovery'
                    key: 'icmppingsec[{#IPADDRESS},1,,24,]'
                - sortorder: '2'
                  drawtype: GRADIENT_LINE
                  color: FF0000
                  item:
                    host: 'HW Zyxel WLC Discovery'
                    key: 'icmppingloss[{#IPADDRESS},10,,24,]'
        - uuid: 52082876fe184029ad2f052214e4acbc
          name: 'WLC Clients data'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#SNMPVALUE},1.3.6.1.4.1.14179.2.1.4.1.1]'
          key: bsnMobileStationMacAddress
          delay: '60'
          status: DISABLED
          lifetime: 14d
          enabled_lifetime_type: DISABLE_NEVER
          description: '802.11 MAC Address of the Mobile Station.'
          item_prototypes:
            - uuid: 9bb9ae72bd244bdc8b348a8c81c3e6bb
              name: '$1 - Client Associated To Ap'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.14179.2.1.4.1.4.{#SNMPINDEX}'
              key: 'bsnMobileStationAPMacAddr[{#SNMPVALUE}]'
              delay: '60'
              history: 30d
              value_type: CHAR
              valuemap:
                name: 'AP MAC -> NAME'
              tags:
                - tag: Application
                  value: 'Clients data'
            - uuid: 2ef30478de0d480fadb4393868683235
              name: '$1 - Client Incoming Bytes'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.14179.2.1.6.1.2.{#SNMPINDEX}'
              key: 'bsnMobileStationBytesReceived[{#SNMPVALUE}]'
              delay: '60'
              history: 1d
              trends: 14d
              units: B
              description: 'Bytes received from Mobile Station'
              tags:
                - tag: Application
                  value: 'Clients data'
            - uuid: 005c8efa0db04057a71fc433e73d19d3
              name: '$1 - Client Outcoming Bytes'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.14179.2.1.6.1.3.{#SNMPINDEX}'
              key: 'bsnMobileStationBytesSent[{#SNMPVALUE}]'
              delay: '60'
              history: 1d
              trends: 14d
              units: B
              description: 'Bytes sent to Mobile Station'
              tags:
                - tag: Application
                  value: 'Clients data'
            - uuid: de7654c3919e48daa8caec2a6aa93ec6
              name: '$1 - Client Ip Address'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.14179.2.1.4.1.2.{#SNMPINDEX}'
              key: 'bsnMobileStationIpAddress[{#SNMPVALUE}]'
              delay: '60'
              history: 14d
              value_type: TEXT
              description: 'IP Address of the Mobile Station'
              tags:
                - tag: Application
                  value: 'Clients data'
            - uuid: 206f2f35ab494e3a9ae196902730ea19
              name: '$1 - Client RSSI'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.14179.2.1.6.1.1.{#SNMPINDEX}'
              key: 'bsnMobileStationRSSI[{#SNMPVALUE}]'
              delay: '60'
              history: 30d
              value_type: FLOAT
              units: dB
              description: 'Average packet RSSI for the Mobile Station.'
              tags:
                - tag: Application
                  value: 'Clients data'
          graph_prototypes:
            - uuid: a77889142e6d4f38b35f21cd801f1b57
              name: '{#SNMPVALUE} - Client Traffic'
              show_triggers: 'NO'
              graph_items:
                - drawtype: GRADIENT_LINE
                  color: 00AA00
                  item:
                    host: 'HW Zyxel WLC Discovery'
                    key: 'bsnMobileStationBytesReceived[{#SNMPVALUE}]'
                - sortorder: '1'
                  drawtype: GRADIENT_LINE
                  color: 3333FF
                  item:
                    host: 'HW Zyxel WLC Discovery'
                    key: 'bsnMobileStationBytesSent[{#SNMPVALUE}]'
        - uuid: 2adf3dac4ab24640bc1faa7cd71335d7
          name: 'WLC Interfaces data'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#SNMPVALUE},IF-MIB::ifDescr]'
          key: ifDescr
          delay: '3600'
          filter:
            conditions:
              - macro: '{#SNMPVALUE}'
                value: '^(lo|eth.*)$'
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          description: |
            You may also consider using IF-MIB::ifType or IF-MIB::ifAlias for discovery depending on your filtering needs.
            
            {$SNMP_COMMUNITY} is a global macro.
          item_prototypes:
            - uuid: 476aed04bd44471aad526f6d0ae8a433
              name: 'Admin status of interface {#SNMPVALUE}'
              type: SNMP_AGENT
              snmp_oid: 'IF-MIB::ifAdminStatus.{#SNMPINDEX}'
              key: 'ifAdminStatus[{#SNMPVALUE}]'
              delay: '60'
              history: 7d
              description: 'The desired state of the interface.'
              valuemap:
                name: 'SNMP interface status (ifAdminStatus)'
              tags:
                - tag: Application
                  value: General
            - uuid: e81258b15ae34d41a765d6a2a44a1700
              name: 'Inbound errors on interface {#SNMPVALUE}'
              type: SNMP_AGENT
              snmp_oid: 'IF-MIB::ifInErrors.{#SNMPINDEX}'
              key: 'ifInErrors[{#SNMPVALUE}]'
              delay: '60'
              history: 7d
              description: 'For packet-oriented interfaces, the number of inbound packets that contained errors preventing them from being deliverable to a higher-layer protocol.  For character-oriented or fixed-length interfaces, the number of inbound transmission units that contained errors preventing them from being deliverable to a higher-layer protocol.'
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: Application
                  value: General
            - uuid: 1b6a66e691584902932135dcb2eaa6f7
              name: 'Incoming traffic on interface {#SNMPVALUE}'
              type: SNMP_AGENT
              snmp_oid: 'IF-MIB::ifInOctets.{#SNMPINDEX}'
              key: 'ifInOctets[{#SNMPVALUE}]'
              delay: '60'
              history: 7d
              units: bps
              description: 'The number of octets in valid MAC frames received on this interface, including the MAC header and FCS.'
              preprocessing:
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: Application
                  value: General
            - uuid: 9d12cb5dcd7844398a73d313d844ebd4
              name: 'Operational status of interface {#SNMPVALUE}'
              type: SNMP_AGENT
              snmp_oid: 'IF-MIB::ifOperStatus.{#SNMPINDEX}'
              key: 'ifOperStatus[{#SNMPVALUE}]'
              delay: '60'
              history: 7d
              description: 'The current operational state of the interface.'
              valuemap:
                name: 'SNMP interface status (ifOperStatus)'
              tags:
                - tag: Application
                  value: General
              trigger_prototypes:
                - uuid: a1ad1de17b2b4044af5d875563d3fd59
                  expression: '(last(/HW Zyxel WLC Discovery/ifOperStatus[{#SNMPVALUE}],#1)<>last(/HW Zyxel WLC Discovery/ifOperStatus[{#SNMPVALUE}],#2))=1'
                  name: 'Operational status was changed on {HOST.NAME} interface {#SNMPVALUE}'
                  priority: WARNING
            - uuid: 16279b96ed27465eae4baeed9bcd51c3
              name: 'Outbound errors on interface {#SNMPVALUE}'
              type: SNMP_AGENT
              snmp_oid: 'IF-MIB::ifOutErrors.{#SNMPINDEX}'
              key: 'ifOutErrors[{#SNMPVALUE}]'
              delay: '60'
              history: 7d
              description: 'For packet-oriented interfaces, the number of outbound packets that could not be transmitted because of errors. For character-oriented or fixed-length interfaces, the number of outbound transmission units that could not be transmitted because of errors.'
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: Application
                  value: General
            - uuid: 61bf9de0df9b47cf9fb0e0a623f0b062
              name: 'Outgoing traffic on interface {#SNMPVALUE}'
              type: SNMP_AGENT
              snmp_oid: 'IF-MIB::ifOutOctets.{#SNMPINDEX}'
              key: 'ifOutOctets[{#SNMPVALUE}]'
              delay: '60'
              history: 7d
              units: bps
              description: 'The number of octets transmitted in MAC frames on this interface, including the MAC header and FCS.'
              preprocessing:
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: Application
                  value: General
          graph_prototypes:
            - uuid: b2e2629067144f6e8c2db51f4f89bd04
              name: 'Traffic on interface {#SNMPVALUE}'
              graph_items:
                - drawtype: GRADIENT_LINE
                  color: 00AA00
                  item:
                    host: 'HW Zyxel WLC Discovery'
                    key: 'ifInOctets[{#SNMPVALUE}]'
                - sortorder: '1'
                  drawtype: GRADIENT_LINE
                  color: 3333FF
                  item:
                    host: 'HW Zyxel WLC Discovery'
                    key: 'ifOutOctets[{#SNMPVALUE}]'
      macros:
        - macro: '{$ICMP_LOSS_WARN}'
          value: '20'
        - macro: '{$ICMP_LOSS_WARN_AP}'
          value: '30'
          description: 'WLC AP LOSS MAX'
        - macro: '{$ICMP_RESPONSE_TIME_WARN}'
          value: '0.15'
        - macro: '{$ICMP_RESPONSE_TIME_WARN_AP}'
          value: '0.30'
          description: 'WLC AP TIME MAX'
      valuemaps:
        - uuid: 981da22963bd483a860fbac1e85ab43b
          name: 'AP MAC -> NAME'
          mappings:
            - value: 'AP MAC'
              newvalue: NAME
        - uuid: b99dd7ba1a684f4cb76f8a17764f0586
          name: 'Service state'
          mappings:
            - value: '0'
              newvalue: Down
            - value: '1'
              newvalue: Up
        - uuid: aaec8955532d4bbcae6514f6ce7c1d4c
          name: 'Service state 1'
          mappings:
            - value: '0'
              newvalue: Down
            - value: '1'
              newvalue: Up
        - uuid: bd0d177fc67945769338c808c38a2ec4
          name: 'SNMP interface status (ifAdminStatus)'
          mappings:
            - value: '1'
              newvalue: up
            - value: '2'
              newvalue: down
            - value: '3'
              newvalue: testing
        - uuid: 434b9f4c5625458ba021a25d37c16fa5
          name: 'SNMP interface status (ifOperStatus)'
          mappings:
            - value: '1'
              newvalue: up
            - value: '2'
              newvalue: down
            - value: '3'
              newvalue: testing
            - value: '4'
              newvalue: unknown
            - value: '5'
              newvalue: dormant
            - value: '6'
              newvalue: notPresent
            - value: '7'
              newvalue: lowerLayerDown
