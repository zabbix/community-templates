                formulaid: A
              - macro: '{#SENSOR.NAME}'
                value: '{$CIENA.SENSOR.NAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
          description: 'Discovering fans from LM-SENSORS-MIB lmFanSensorsTable (fan1, fan2, ...). Fan status is not readable over SNMP on SAOS 10: a failed or removed fan reports a speed of 0. Fan speed threshold notifications are also received as traps.'
          item_prototypes:
            - uuid: 9e32c46318334f2d84b46395c4f13196
              name: 'Fan [{#SENSOR.NAME}]: Speed'
              type: DEPENDENT
              key: 'sensor.fan.speed[lmFanSensorsValue.{#SNMPINDEX}]'
              delay: '0'
              units: '!rpm'
              description: |
                MIB: LM-SENSORS-MIB
                lmFanSensorsValue: the rotation speed of the fan in RPM.
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.2021.13.16.3.1.3.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: ciena.sensor.walk
              tags:
                - tag: component
                  value: fan
                - tag: sensor
                  value: '{#SENSOR.NAME}'
              trigger_prototypes:
                - uuid: 286d38f6a9f04d5a81f338ed9e98b8eb
                  expression: 'max(/Ciena SAOS 10 by SNMP/sensor.fan.speed[lmFanSensorsValue.{#SNMPINDEX}],5m)<{$CIENA.FAN.SPEED.MIN:"{#SENSOR.NAME}"}'
                  name: 'Ciena: Fan [{#SENSOR.NAME}]: Speed is too low'
                  event_name: 'Ciena: Fan [{#SENSOR.NAME}]: Speed is too low (<{$CIENA.FAN.SPEED.MIN:"{#SENSOR.NAME}"} rpm for 5m)'
                  opdata: 'Current speed: {ITEM.LASTVALUE1}'
                  priority: AVERAGE
                  description: 'The fan speed is below the minimum threshold; a speed of 0 means the fan stopped or was removed.'
                  tags:
                    - tag: scope
                      value: availability
          master_item:
            key: ciena.sensor.walk
          preprocessing:
            - type: SNMP_WALK_TO_JSON
              parameters:
                - '{#SENSOR.NAME}'
                - 1.3.6.1.4.1.2021.13.16.3.1.2
                - '0'
              error_handler: DISCARD_VALUE
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
        - uuid: efedf1a4ca4448aa8d826dc16aae7428
