            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
        - uuid: aeefa65c35b74de18e1102c37cbde4d8
          name: 'Power supply discovery'
          type: DEPENDENT
          key: ciena.psu.discovery
          delay: '0'
          filter:
            evaltype: AND
            conditions:
              - macro: '{#SENSOR.NAME}'
                value: '{$CIENA.SENSOR.NAME.MATCHES}'
                formulaid: A
              - macro: '{#SENSOR.NAME}'
                value: '{$CIENA.SENSOR.NAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
          description: 'Discovering power supplies from LM-SENSORS-MIB lmVoltSensorsTable (psa, psb): the output voltage of each PSU. PSU presence and health are not readable over SNMP on SAOS 10; on platforms with voltage telemetry (for example the 5164, 12 V) a PSU with no input power or a failed PSU reports 0 V, while platforms without it (for example the 3984) report 0 V for every PSU. PSU faulted/online transitions are also received as traps.'
          item_prototypes:
            - uuid: 852d49ed7b2e49af893e4f4433f760f7
              name: 'PSU [{#SENSOR.NAME}]: Output voltage'
              type: DEPENDENT
              key: 'sensor.psu.voltage[lmVoltSensorsValue.{#SNMPINDEX}]'
              delay: '0'
              value_type: FLOAT
              units: V
              description: |
                MIB: LM-SENSORS-MIB
                lmVoltSensorsValue: the output voltage of the power supply (reported in mV, converted to V). Platforms without PSU voltage telemetry (for example the 3984) report 0 for every PSU.
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.2021.13.16.4.1.3.{#SNMPINDEX}'
                    - '0'
                - type: MULTIPLIER
                  parameters:
                    - '0.001'
              master_item:
                key: ciena.sensor.walk
              tags:
                - tag: component
                  value: psu
                - tag: sensor
                  value: '{#SENSOR.NAME}'
              trigger_prototypes:
                - uuid: 8dec10a71f024e14870a0019640b5a78
                  expression: 'max(/Ciena SAOS 10 by SNMP/sensor.psu.voltage[lmVoltSensorsValue.{#SNMPINDEX}],5m)<{$CIENA.PSU.VOLTAGE.MIN:"{#SENSOR.NAME}"} and count(/Ciena SAOS 10 by SNMP/sensor.psu.voltage[lmVoltSensorsValue.{#SNMPINDEX}],24h,"gt","0")>0'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'min(/Ciena SAOS 10 by SNMP/sensor.psu.voltage[lmVoltSensorsValue.{#SNMPINDEX}],5m)>={$CIENA.PSU.VOLTAGE.MIN:"{#SENSOR.NAME}"}'
                  name: 'Ciena: PSU [{#SENSOR.NAME}]: Output voltage is too low'
                  event_name: 'Ciena: PSU [{#SENSOR.NAME}]: Output voltage is too low (<{$CIENA.PSU.VOLTAGE.MIN:"{#SENSOR.NAME}"} V for 5m)'
                  opdata: 'Current voltage: {ITEM.LASTVALUE1}'
                  priority: AVERAGE
                  description: 'The PSU output voltage dropped below the minimum threshold: the PSU lost input power, failed or was removed. The problem is raised only for a PSU that has reported a non-zero voltage within the 24 hours before the drop, so platforms without PSU voltage telemetry (for example the 3984, which reports 0 mV for a healthy PSU) never alert, and a PSU that was already at 0 V when monitoring started is reported by the power supply traps instead. Once raised, the problem stays open until the voltage has been at or above the threshold for 5 minutes, however long the PSU stays down.'
                  tags:
                    - tag: scope
                      value: availability
          master_item:
            key: ciena.sensor.walk
          preprocessing:
            - type: SNMP_WALK_TO_JSON
              parameters:
                - '{#SENSOR.NAME}'
                - 1.3.6.1.4.1.2021.13.16.4.1.2
                - '0'
              error_handler: DISCARD_VALUE
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
        - uuid: 2e0b02ac16994bdd80fe9f7a6ce8fe95
          name: 'Temperature sensor discovery'
          type: DEPENDENT
          key: ciena.temperature.discovery
          delay: '0'
          filter:
            evaltype: AND
            conditions:
              - macro: '{#SENSOR.NAME}'
                value: '{$CIENA.SENSOR.NAME.MATCHES}'
                formulaid: A
              - macro: '{#SENSOR.NAME}'
                value: '{$CIENA.SENSOR.NAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
          description: 'Discovering temperature sensors from LM-SENSORS-MIB lmTempSensorsTable (for example cpu1-temperature, front-temperature, switch-temperature). SAOS 10 exposes no per-sensor thresholds over SNMP; use the {$CIENA.TEMP.WARN} and {$CIENA.TEMP.CRIT} macros with the sensor name as context.'
          item_prototypes:
            - uuid: e0af9f5bbc2c466e80dc3b970fcbe09b
              name: 'Sensor [{#SENSOR.NAME}]: Temperature'
              type: DEPENDENT
              key: 'sensor.temp.value[lmTempSensorsValue.{#SNMPINDEX}]'
              delay: '0'
              value_type: FLOAT
              units: °C
              description: |
                MIB: LM-SENSORS-MIB
                lmTempSensorsValue: the temperature measured by the sensor, in degrees Celsius.
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.2021.13.16.2.1.3.{#SNMPINDEX}'
                    - '0'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      // SAOS 10 reports whole degrees Celsius; be tolerant of agents that report millidegrees as LM-SENSORS-MIB specifies.
                      value = Number(value);
                      return value >= 1000 ? value / 1000 : value;
              master_item:
                key: ciena.sensor.walk
              tags:
                - tag: component
                  value: temperature
                - tag: sensor
                  value: '{#SENSOR.NAME}'
              trigger_prototypes:
                - uuid: e492fcb0dd4d419c8758c8a2fe3d311a
                  expression: 'min(/Ciena SAOS 10 by SNMP/sensor.temp.value[lmTempSensorsValue.{#SNMPINDEX}],5m)>{$CIENA.TEMP.CRIT:"{#SENSOR.NAME}"}'
                  name: 'Ciena: Sensor [{#SENSOR.NAME}]: Temperature is critically high'
                  event_name: 'Ciena: Sensor [{#SENSOR.NAME}]: Temperature is critically high (>{$CIENA.TEMP.CRIT:"{#SENSOR.NAME}"} °C for 5m)'
                  opdata: 'Current temperature: {ITEM.LASTVALUE1}'
                  priority: HIGH
                  description: 'The temperature reported by the sensor is above the critical threshold.'
                  tags:
                    - tag: scope
                      value: availability
                    - tag: scope
                      value: performance
                - uuid: 5711628add7f449a8d87c3d3ab614b45
                  expression: 'min(/Ciena SAOS 10 by SNMP/sensor.temp.value[lmTempSensorsValue.{#SNMPINDEX}],5m)>{$CIENA.TEMP.WARN:"{#SENSOR.NAME}"}'
                  name: 'Ciena: Sensor [{#SENSOR.NAME}]: Temperature is high'
                  event_name: 'Ciena: Sensor [{#SENSOR.NAME}]: Temperature is high (>{$CIENA.TEMP.WARN:"{#SENSOR.NAME}"} °C for 5m)'
                  opdata: 'Current temperature: {ITEM.LASTVALUE1}'
                  priority: AVERAGE
                  description: 'The temperature reported by the sensor is above the warning threshold.'
                  dependencies:
                    - name: 'Ciena: Sensor [{#SENSOR.NAME}]: Temperature is critically high'
                      expression: 'min(/Ciena SAOS 10 by SNMP/sensor.temp.value[lmTempSensorsValue.{#SNMPINDEX}],5m)>{$CIENA.TEMP.CRIT:"{#SENSOR.NAME}"}'
                  tags:
                    - tag: scope
                      value: availability
                    - tag: scope
                      value: performance
          graph_prototypes:
            - uuid: 865f7132d74b4f2d8593d229b1f920c2
              name: 'Sensor [{#SENSOR.NAME}]: Temperature'
              ymin_type_1: FIXED
              ymax_type_1: FIXED
              graph_items:
                - drawtype: GRADIENT_LINE
                  color: 199C0D
                  item:
                    host: 'Ciena SAOS 10 by SNMP'
                    key: 'sensor.temp.value[lmTempSensorsValue.{#SNMPINDEX}]'
          master_item:
            key: ciena.sensor.walk
          preprocessing:
            - type: SNMP_WALK_TO_JSON
              parameters:
                - '{#SENSOR.NAME}'
                - 1.3.6.1.4.1.2021.13.16.2.1.2
                - '0'
              error_handler: DISCARD_VALUE
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
        - uuid: 472042de1bf84ccd8fc0d44ad618506e
          name: 'Transceiver discovery'
          type: DEPENDENT
          key: ciena.xcvr.discovery
          delay: '0'
          filter:
            evaltype: AND
            conditions:
              - macro: '{#CIENA.XCVR.PORT}'
                value: '{$CIENA.XCVR.PORT.MATCHES}'
                formulaid: A
              - macro: '{#CIENA.XCVR.PORT}'
                value: '{$CIENA.XCVR.PORT.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
              - macro: '{#CIENA.XCVR.VCC}'
                value: '^[1-9][0-9]*$'
                formulaid: C
          description: 'Discovering transceivers with digital diagnostics from CIENA-CES-PORT-XCVR-MIB cienaCesPortXcvrTable. Rows whose supply voltage is 0 (empty cage or a transceiver without DOM) are skipped. The alarm thresholds programmed in the transceiver are exported as LLD macros and used by the trigger prototypes; ports whose transceiver reports no thresholds (for example DACs) get no threshold triggers.'
          item_prototypes:
            - uuid: d33ee53e31064d7b8b18a2ea05a7a988
              name: 'Transceiver [{#CIENA.XCVR.PORT}]: Laser bias current'
              type: DEPENDENT
              key: 'ciena.xcvr.bias[{#SNMPINDEX}]'
              delay: '0'
              value_type: FLOAT
              units: mA
              description: |
                MIB: CIENA-CES-PORT-XCVR-MIB
                cienaCesPortXcvrBias: the laser bias current of the transceiver in mA, if reported by the agent (SAOS 10.12.00 hardware reports 0 for the bias and its thresholds; the bias trigger is then inactive).
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.1271.2.1.9.1.1.1.1.5.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: ciena.xcvr.walk
              tags:
                - tag: component
                  value: transceiver
                - tag: interface
                  value: '{#CIENA.XCVR.PORT}'
              trigger_prototypes:
                - uuid: 86852f78851a4a5d89f3850fdbfa2740
                  expression: '{#CIENA.XCVR.BIAS.HIGH}>0 and (min(/Ciena SAOS 10 by SNMP/ciena.xcvr.bias[{#SNMPINDEX}],5m)>{#CIENA.XCVR.BIAS.HIGH} or (max(/Ciena SAOS 10 by SNMP/ciena.xcvr.bias[{#SNMPINDEX}],5m)<{#CIENA.XCVR.BIAS.LOW} and min(/Ciena SAOS 10 by SNMP/ciena.xcvr.bias[{#SNMPINDEX}],5m)>0))'
                  name: 'Ciena: Transceiver [{#CIENA.XCVR.PORT}]: Laser bias current is out of range'
                  event_name: 'Ciena: Transceiver [{#CIENA.XCVR.PORT}]: Laser bias current is out of range ({#CIENA.XCVR.BIAS.LOW}-{#CIENA.XCVR.BIAS.HIGH} mA)'
                  opdata: 'Current value: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: 'The laser bias current is outside its alarm thresholds, which usually indicates laser ageing. A laser that is off (bias 0 mA) is excluded. The threshold is the alarm threshold programmed in the transceiver and read from CIENA-CES-PORT-XCVR-MIB at discovery time.'
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: availability
                    - tag: scope
                      value: performance
            - uuid: 16a2575667e54a248accf0fd6698b1ad
              name: 'Transceiver [{#CIENA.XCVR.PORT}]: Rx power'
              type: DEPENDENT
              key: 'ciena.xcvr.rx.power[{#SNMPINDEX}]'
              delay: '0'
              value_type: FLOAT
              units: dBm
              description: |
                MIB: CIENA-CES-PORT-XCVR-MIB
                cienaCesPortXcvrRxPower: the measured receive power (reported in uW, converted to dBm; 0 uW is shown as -40 dBm).
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.1271.2.1.9.1.1.1.1.6.{#SNMPINDEX}'
                    - '0'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      // Convert microwatts to dBm; 0 uW (no light) is reported as -40 dBm.
                      value = Number(value);
                      if (value <= 0) { return -40; }
                      return (10 * Math.log(value / 1000) / Math.LN10).toFixed(2);
              master_item:
                key: ciena.xcvr.walk
              tags:
                - tag: component
                  value: transceiver
                - tag: interface
                  value: '{#CIENA.XCVR.PORT}'
              trigger_prototypes:
                - uuid: c9ab014e3ec04c3e802c6fbdfb69dd94
                  expression: '{$CIENA.XCVR.RX.LOS.ALERT:"{#CIENA.XCVR.PORT}"}=1 and max(/Ciena SAOS 10 by SNMP/ciena.xcvr.rx.power[{#SNMPINDEX}],5m)<={$CIENA.XCVR.RX.NOLIGHT:"{#CIENA.XCVR.PORT}"}'
                  name: 'Ciena: Transceiver [{#CIENA.XCVR.PORT}]: No optical input'
                  opdata: 'Current value: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: 'The transceiver receives no light (Rx power at or below {$CIENA.XCVR.RX.NOLIGHT} dBm for 5 minutes). Opt-in: enable per port or template-wide by setting {$CIENA.XCVR.RX.LOS.ALERT} (or its port context) to 1, for example on uplink ports that must always be lit.'
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: availability
                - uuid: 61ac899904554cd588f91122b62930ce
                  expression: '{#CIENA.XCVR.RXPW.HIGH}>0 and min(/Ciena SAOS 10 by SNMP/ciena.xcvr.rx.power[{#SNMPINDEX}],5m)>{#CIENA.XCVR.RXPW.HIGH.DBM}'
                  name: 'Ciena: Transceiver [{#CIENA.XCVR.PORT}]: Rx power is above the alarm threshold'
                  event_name: 'Ciena: Transceiver [{#CIENA.XCVR.PORT}]: Rx power is above {#CIENA.XCVR.RXPW.HIGH.DBM} dBm'
                  opdata: 'Current value: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: 'The received optical power is above the high alarm threshold; the receiver may be saturated (missing attenuator). The threshold is the alarm threshold programmed in the transceiver and read from CIENA-CES-PORT-XCVR-MIB at discovery time.'
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: availability
                    - tag: scope
                      value: performance
                - uuid: 0cf1e4586d624cfb83443d0c3d6144eb
                  expression: '{#CIENA.XCVR.RXPW.HIGH}>0 and max(/Ciena SAOS 10 by SNMP/ciena.xcvr.rx.power[{#SNMPINDEX}],5m)<{#CIENA.XCVR.RXPW.LOW.DBM} and min(/Ciena SAOS 10 by SNMP/ciena.xcvr.rx.power[{#SNMPINDEX}],5m)>{$CIENA.XCVR.RX.NOLIGHT:"{#CIENA.XCVR.PORT}"}'
                  name: 'Ciena: Transceiver [{#CIENA.XCVR.PORT}]: Rx power is below the alarm threshold'
                  event_name: 'Ciena: Transceiver [{#CIENA.XCVR.PORT}]: Rx power is below {#CIENA.XCVR.RXPW.LOW.DBM} dBm'
                  opdata: 'Current value: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: 'The received optical power is below the low alarm threshold: dirty connector, excessive attenuation or a weak far-end transmitter. Ports with no light at all (Rx at or below {$CIENA.XCVR.RX.NOLIGHT} dBm, i.e. unpatched or far end down) are excluded; use the link-down trigger or the opt-in "No optical input" trigger for those. The threshold is the alarm threshold programmed in the transceiver and read from CIENA-CES-PORT-XCVR-MIB at discovery time.'
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: availability
                    - tag: scope
                      value: performance
            - uuid: 9db5a913e7de4c538c1da45c0a9b00e8
              name: 'Transceiver [{#CIENA.XCVR.PORT}]: Temperature'
              type: DEPENDENT
              key: 'ciena.xcvr.temperature[{#SNMPINDEX}]'
              delay: '0'
              value_type: FLOAT
              units: °C
              description: |
                MIB: CIENA-CES-PORT-XCVR-MIB
                cienaCesPortXcvrTemperature: the temperature of the transceiver in degrees Celsius.
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.1271.2.1.9.1.1.1.1.3.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: ciena.xcvr.walk
              tags:
                - tag: component
                  value: transceiver
                - tag: interface
                  value: '{#CIENA.XCVR.PORT}'
              trigger_prototypes:
                - uuid: 4900fafc35b046188c0226aecf0a28b0
                  expression: '{#CIENA.XCVR.TEMP.HIGH}>0 and min(/Ciena SAOS 10 by SNMP/ciena.xcvr.temperature[{#SNMPINDEX}],5m)>{#CIENA.XCVR.TEMP.HIGH}'
                  name: 'Ciena: Transceiver [{#CIENA.XCVR.PORT}]: Temperature is above the alarm threshold'
                  event_name: 'Ciena: Transceiver [{#CIENA.XCVR.PORT}]: Temperature is above {#CIENA.XCVR.TEMP.HIGH} °C'
                  opdata: 'Current value: {ITEM.LASTVALUE1}'
                  priority: AVERAGE
                  description: 'The transceiver temperature is above its high alarm threshold. The threshold is the alarm threshold programmed in the transceiver and read from CIENA-CES-PORT-XCVR-MIB at discovery time.'
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: availability
                    - tag: scope
                      value: performance
            - uuid: ba7491065a0545f2829599b33c21b009
              name: 'Transceiver [{#CIENA.XCVR.PORT}]: Tx power'
              type: DEPENDENT
              key: 'ciena.xcvr.tx.power[{#SNMPINDEX}]'
              delay: '0'
              value_type: FLOAT
              units: dBm
              description: |
                MIB: CIENA-CES-PORT-XCVR-MIB
                cienaCesPortXcvrTxOutputPower: the transmit output power (reported in uW, converted to dBm; 0 uW is shown as -40 dBm).
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.1271.2.1.9.1.1.1.1.35.{#SNMPINDEX}'
                    - '0'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      // Convert microwatts to dBm; 0 uW (no light) is reported as -40 dBm.
                      value = Number(value);
                      if (value <= 0) { return -40; }
                      return (10 * Math.log(value / 1000) / Math.LN10).toFixed(2);
              master_item:
                key: ciena.xcvr.walk
              tags:
                - tag: component
                  value: transceiver
                - tag: interface
                  value: '{#CIENA.XCVR.PORT}'
              trigger_prototypes:
                - uuid: 645becb588ad49fb83485a418d53d835
                  expression: '{#CIENA.XCVR.TXPW.HIGH}>0 and ((max(/Ciena SAOS 10 by SNMP/ciena.xcvr.tx.power[{#SNMPINDEX}],5m)<{#CIENA.XCVR.TXPW.LOW.DBM} and min(/Ciena SAOS 10 by SNMP/ciena.xcvr.tx.power[{#SNMPINDEX}],5m)>{$CIENA.XCVR.RX.NOLIGHT:"{#CIENA.XCVR.PORT}"}) or min(/Ciena SAOS 10 by SNMP/ciena.xcvr.tx.power[{#SNMPINDEX}],5m)>{#CIENA.XCVR.TXPW.HIGH.DBM})'
                  name: 'Ciena: Transceiver [{#CIENA.XCVR.PORT}]: Tx power is out of range'
                  event_name: 'Ciena: Transceiver [{#CIENA.XCVR.PORT}]: Tx power is out of range ({#CIENA.XCVR.TXPW.LOW.DBM} to {#CIENA.XCVR.TXPW.HIGH.DBM} dBm)'
                  opdata: 'Current value: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: 'The transmit optical power is outside its alarm thresholds, which usually indicates a failing laser. A laser that is off (Tx at or below {$CIENA.XCVR.RX.NOLIGHT} dBm, e.g. a disabled port) is excluded. The threshold is the alarm threshold programmed in the transceiver and read from CIENA-CES-PORT-XCVR-MIB at discovery time.'
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: availability
                    - tag: scope
                      value: performance
            - uuid: 7b035b8c348a40818fa8bd34d4c9b4bc
              name: 'Transceiver [{#CIENA.XCVR.PORT}]: Supply voltage'
              type: DEPENDENT
              key: 'ciena.xcvr.vcc[{#SNMPINDEX}]'
              delay: '0'
              value_type: FLOAT
              units: V
              description: |
                MIB: CIENA-CES-PORT-XCVR-MIB
                cienaCesPortXcvrVcc: the supply voltage of the transceiver (reported in mV, converted to V).
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.1271.2.1.9.1.1.1.1.4.{#SNMPINDEX}'
                    - '0'
                - type: MULTIPLIER
                  parameters:
                    - '0.001'
              master_item:
                key: ciena.xcvr.walk
              tags:
                - tag: component
                  value: transceiver
                - tag: interface
                  value: '{#CIENA.XCVR.PORT}'
              trigger_prototypes:
                - uuid: e551abbc14274ec78b6083b698109ab6
                  expression: '{#CIENA.XCVR.VCC.HIGH}>0 and (min(/Ciena SAOS 10 by SNMP/ciena.xcvr.vcc[{#SNMPINDEX}],5m)>{#CIENA.XCVR.VCC.HIGH}/1000 or (max(/Ciena SAOS 10 by SNMP/ciena.xcvr.vcc[{#SNMPINDEX}],5m)<{#CIENA.XCVR.VCC.LOW}/1000 and min(/Ciena SAOS 10 by SNMP/ciena.xcvr.vcc[{#SNMPINDEX}],5m)>0))'
                  name: 'Ciena: Transceiver [{#CIENA.XCVR.PORT}]: Supply voltage is out of range'
                  event_name: 'Ciena: Transceiver [{#CIENA.XCVR.PORT}]: Supply voltage is out of range ({#CIENA.XCVR.VCC.LOW}-{#CIENA.XCVR.VCC.HIGH} mV)'
                  opdata: 'Current value: {ITEM.LASTVALUE1}'
                  priority: AVERAGE
                  description: 'The transceiver supply voltage is outside its alarm thresholds. A removed transceiver (0 V) is excluded; see the transceiver inventory traps. The threshold is the alarm threshold programmed in the transceiver and read from CIENA-CES-PORT-XCVR-MIB at discovery time.'
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: availability
                    - tag: scope
                      value: performance
          trigger_prototypes:
            - uuid: 3c4787cc914e48488a42cef497c79379
              expression: '{#CIENA.XCVR.TEMP.HIGH}>0 and max(/Ciena SAOS 10 by SNMP/ciena.xcvr.temperature[{#SNMPINDEX}],5m)<{#CIENA.XCVR.TEMP.LOW} and min(/Ciena SAOS 10 by SNMP/ciena.xcvr.vcc[{#SNMPINDEX}],5m)>0'
              name: 'Ciena: Transceiver [{#CIENA.XCVR.PORT}]: Temperature is below the alarm threshold'
              event_name: 'Ciena: Transceiver [{#CIENA.XCVR.PORT}]: Temperature is below {#CIENA.XCVR.TEMP.LOW} °C'
              opdata: 'Current value: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: 'The transceiver temperature is below its low alarm threshold. A removed transceiver (supply voltage 0 V) is excluded. The threshold is the alarm threshold programmed in the transceiver and read from CIENA-CES-PORT-XCVR-MIB at discovery time.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
          graph_prototypes:
            - uuid: 9a2a3c4e35674a94899a0d48306c9560
              name: 'Transceiver [{#CIENA.XCVR.PORT}]: Optical power'
              graph_items:
                - drawtype: GRADIENT_LINE
                  color: 199C0D
                  item:
                    host: 'Ciena SAOS 10 by SNMP'
                    key: 'ciena.xcvr.rx.power[{#SNMPINDEX}]'
                - sortorder: '1'
                  drawtype: BOLD_LINE
                  color: F63100
                  item:
                    host: 'Ciena SAOS 10 by SNMP'
                    key: 'ciena.xcvr.tx.power[{#SNMPINDEX}]'
          master_item:
            key: ciena.xcvr.threshold.walk
          preprocessing:
            - type: SNMP_WALK_TO_JSON
              parameters:
                - '{#CIENA.XCVR.PORT}'
                - 1.3.6.1.4.1.1271.2.1.9.1.1.1.1.40
                - '0'
                - '{#CIENA.XCVR.VCC}'
                - 1.3.6.1.4.1.1271.2.1.9.1.1.1.1.4
                - '0'
                - '{#CIENA.XCVR.TEMP.HIGH}'
                - 1.3.6.1.4.1.1271.2.1.9.1.1.1.1.7
                - '0'
                - '{#CIENA.XCVR.TEMP.LOW}'
                - 1.3.6.1.4.1.1271.2.1.9.1.1.1.1.8
                - '0'
                - '{#CIENA.XCVR.VCC.HIGH}'
                - 1.3.6.1.4.1.1271.2.1.9.1.1.1.1.9
                - '0'
                - '{#CIENA.XCVR.VCC.LOW}'
                - 1.3.6.1.4.1.1271.2.1.9.1.1.1.1.10
                - '0'
                - '{#CIENA.XCVR.BIAS.HIGH}'
                - 1.3.6.1.4.1.1271.2.1.9.1.1.1.1.11
                - '0'
                - '{#CIENA.XCVR.BIAS.LOW}'
                - 1.3.6.1.4.1.1271.2.1.9.1.1.1.1.12
                - '0'
                - '{#CIENA.XCVR.TXPW.HIGH}'
                - 1.3.6.1.4.1.1271.2.1.9.1.1.1.1.13
                - '0'
                - '{#CIENA.XCVR.TXPW.LOW}'
                - 1.3.6.1.4.1.1271.2.1.9.1.1.1.1.14
                - '0'
                - '{#CIENA.XCVR.RXPW.HIGH}'
                - 1.3.6.1.4.1.1271.2.1.9.1.1.1.1.15
                - '0'
                - '{#CIENA.XCVR.RXPW.LOW}'
                - 1.3.6.1.4.1.1271.2.1.9.1.1.1.1.16
                - '0'
              error_handler: DISCARD_VALUE
            - type: JAVASCRIPT
              parameters:
                - |
                  // Add dBm versions of the optical power thresholds (the table reports microwatts).
                  var rows = JSON.parse(value);
                  function dbm(uw) { uw = Number(uw); return uw > 0 ? (10 * Math.log(uw / 1000) / Math.LN10).toFixed(2) : '-40'; }
                  for (var i = 0; i < rows.length; i++) {
                      var r = rows[i];
                      r['{#CIENA.XCVR.TXPW.HIGH.DBM}'] = dbm(r['{#CIENA.XCVR.TXPW.HIGH}']);
                      r['{#CIENA.XCVR.TXPW.LOW.DBM}'] = dbm(r['{#CIENA.XCVR.TXPW.LOW}']);
                      r['{#CIENA.XCVR.RXPW.HIGH.DBM}'] = dbm(r['{#CIENA.XCVR.RXPW.HIGH}']);
                      r['{#CIENA.XCVR.RXPW.LOW.DBM}'] = dbm(r['{#CIENA.XCVR.RXPW.LOW}']);
                  }
                  return JSON.stringify(rows);
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
        - uuid: 9f8576ac03334f568940633b20335b97
          name: 'Network interfaces discovery'
          type: DEPENDENT
          key: net.if.discovery
          delay: '0'
          filter:
            evaltype: AND
            conditions:
              - macro: '{#IFADMINSTATUS}'
                value: '{$NET.IF.IFADMINSTATUS.MATCHES}'
                formulaid: A
              - macro: '{#IFADMINSTATUS}'
                value: '{$NET.IF.IFADMINSTATUS.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
              - macro: '{#IFALIAS}'
                value: '{$NET.IF.IFALIAS.MATCHES}'
                formulaid: C
              - macro: '{#IFALIAS}'
                value: '{$NET.IF.IFALIAS.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: D
              - macro: '{#IFDESCR}'
                value: '{$NET.IF.IFDESCR.MATCHES}'
                formulaid: E
              - macro: '{#IFDESCR}'
                value: '{$NET.IF.IFDESCR.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: F
              - macro: '{#IFNAME}'
                value: '{$NET.IF.IFNAME.MATCHES}'
                formulaid: G
              - macro: '{#IFNAME}'
                value: '{$NET.IF.IFNAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: H
              - macro: '{#IFOPERSTATUS}'
                value: '{$NET.IF.IFOPERSTATUS.MATCHES}'
                formulaid: I
              - macro: '{#IFOPERSTATUS}'
                value: '{$NET.IF.IFOPERSTATUS.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: J
              - macro: '{#IFTYPE}'
                value: '{$NET.IF.IFTYPE.MATCHES}'
                formulaid: K
              - macro: '{#IFTYPE}'
                value: '{$NET.IF.IFTYPE.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: L
          description: 'Discovering interfaces from IF-MIB. By default only physical Ethernet ports (ifType 6) and LAGs (ifType 161) are discovered; SAOS 10 logical ports (ifType 53) and flow points / sub-ports (ifType 135, hundreds or thousands of rows on a service edge) are filtered out with {$NET.IF.IFTYPE.MATCHES}. SAOS 10 reports ifAdminStatus = up(1) on physical port rows even when the logical port is administratively disabled; the discovery therefore takes {#IFADMINSTATUS} of a physical port from the logical port row with the same ifName (exported as {#CIENA.IF.ADMIN.INDEX}), so the admin status filter sees the real admin-state, and the "Operational status" item reports adminDown(100) for a disabled port.'
          item_prototypes:
            - uuid: e773334f2be4445291a5992a7ca6f2ac
              name: 'Interface {#IFNAME}({#IFALIAS}): Administrative status'
              type: DEPENDENT
              key: 'net.if.adminstatus[ifAdminStatus.{#SNMPINDEX}]'
              delay: '0'
              trends: '0'
              description: |
                MIB: IF-MIB
                The desired state of the interface. SAOS 10 keeps ifAdminStatus up(1) on the physical port row (ifType 6) and reports the configured admin-state of the port on the logical port row (ifType 53) that has the same ifName, so for a physical port this item reads ifAdminStatus of that logical port row (ifIndex {#CIENA.IF.ADMIN.INDEX}); other interfaces use their own row. "Link down" does not use this item: "Operational status" reads the same row from the same walk value and reports adminDown(100) while the port is disabled.
              valuemap:
                name: 'IF-MIB::ifAdminStatus'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.2.2.1.7.{#CIENA.IF.ADMIN.INDEX}'
                    - '0'
              master_item:
                key: net.if.walk
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 15ff16a66e0348de8423f3176a7fdf01
              name: 'Interface {#IFNAME}({#IFALIAS}): Inbound CRC/alignment errors'
              type: DEPENDENT
              key: 'net.if.in.crc.errors[etherStatsCRCAlignErrors.{#SNMPINDEX}]'
              delay: '0'
              description: |
                MIB: RMON-MIB
                etherStatsCRCAlignErrors of the RMON etherStats row whose etherStatsDataSource points at this ifIndex: packets of valid length with a bad FCS or a non-integral number of octets. Only physical Ethernet ports (ifType 6) have an RMON row; the discovery rule does not create this item for other interface types, and on a device without RMON rows the value is discarded instead of marking the item unsupported.
              preprocessing:
                - type: REGEX
                  parameters:
                    - '16\.1\.1\.1\.2\.(\d+) = OID: \.?1\.3\.6\.1\.2\.1\.2\.2\.1\.1\.{#SNMPINDEX}\n(?:.*\n)*?\.?1\.3\.6\.1\.2\.1\.16\.1\.1\.1\.8\.\1 = \w+: (\d+)'
                    - \2
                  error_handler: DISCARD_VALUE
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 3m
              master_item:
                key: net.if.rmon.walk
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
              trigger_prototypes:
                - uuid: ce978d43873c4ed48736d58360cb4729
                  expression: 'min(/Ciena SAOS 10 by SNMP/net.if.in.crc.errors[etherStatsCRCAlignErrors.{#SNMPINDEX}],5m)>{$IF.ERRORS.WARN:"{#IFNAME}"}'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'max(/Ciena SAOS 10 by SNMP/net.if.in.crc.errors[etherStatsCRCAlignErrors.{#SNMPINDEX}],5m)<{$IF.ERRORS.WARN:"{#IFNAME}"}*0.8'
                  name: 'Ciena: Interface {#IFNAME}({#IFALIAS}): High CRC/alignment error rate'
                  event_name: 'Ciena: Interface {#IFNAME}({#IFALIAS}): High CRC/alignment error rate (>{$IF.ERRORS.WARN:"{#IFNAME}"} for 5m)'
                  opdata: 'CRC/alignment errors in: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: 'Frames with a bad FCS usually point at a dirty or damaged fibre, a failing transceiver or a duplex/speed mismatch on a copper port. It recovers when it is below 80% of the `{$IF.ERRORS.WARN:"{#IFNAME}"}` threshold.'
                  manual_close: 'YES'
                  dependencies:
                    - name: 'Ciena: Interface {#IFNAME}({#IFALIAS}): Link down'
                      expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/Ciena SAOS 10 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=2 and (last(/Ciena SAOS 10 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#1)<>last(/Ciena SAOS 10 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#2)) and last(/Ciena SAOS 10 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#2)<>100'
                      recovery_expression: 'last(/Ciena SAOS 10 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2 or {$IFCONTROL:"{#IFNAME}"}=0'
                  tags:
                    - tag: scope
                      value: availability
                    - tag: scope
                      value: performance
            - uuid: bd00468c0aab48b681ac82208076fb30
              name: 'Interface {#IFNAME}({#IFALIAS}): Inbound packets discarded'
              type: DEPENDENT
              key: 'net.if.in.discards[ifInDiscards.{#SNMPINDEX}]'
              delay: '0'
              description: |
                MIB: IF-MIB
                The number of inbound packets which were chosen to be discarded even though no errors had been detected to prevent their being deliverable to a higher-layer protocol. One possible reason for discarding such a packet could be to free up buffer space. Discontinuities in the value of this counter can occur at re-initialization of the management system, and at other times as indicated by the value of ifCounterDiscontinuityTime.
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}'
                    - '0'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 3m
              master_item:
                key: net.if.walk
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 3a027af221914cfb81ddfc80357a3f13
              name: 'Interface {#IFNAME}({#IFALIAS}): Inbound packets with errors'
              type: DEPENDENT
              key: 'net.if.in.errors[ifInErrors.{#SNMPINDEX}]'
              delay: '0'
              description: |
                MIB: IF-MIB
                For packet-oriented interfaces, the number of inbound packets that contained errors preventing them from being deliverable to a higher-layer protocol. For character-oriented or fixed-length interfaces, the number of inbound transmission units that contained errors preventing them from being deliverable to a higher-layer protocol. Discontinuities in the value of this counter can occur at re-initialization of the management system, and at other times as indicated by the value of ifCounterDiscontinuityTime.
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}'
                    - '0'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 3m
              master_item:
                key: net.if.walk
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 2408b4c703ba4ea384e5750f61065d57
              name: 'Interface {#IFNAME}({#IFALIAS}): Bits received'
              type: DEPENDENT
              key: 'net.if.in[ifHCInOctets.{#SNMPINDEX}]'
              delay: '0'
              units: bps
              description: |
                MIB: IF-MIB
                The total number of octets received on the interface, including framing characters. This object is a 64-bit version of ifInOctets. Discontinuities in the value of this counter can occur at re-initialization of the management system, and at other times as indicated by the value of ifCounterDiscontinuityTime.
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}'
                    - '0'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              master_item:
                key: net.if.walk
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: b79cf488dcdb412a8ac6ef94bcbc91c6
              name: 'Interface {#IFNAME}({#IFALIAS}): Outbound packets discarded'
              type: DEPENDENT
              key: 'net.if.out.discards[ifOutDiscards.{#SNMPINDEX}]'
              delay: '0'
              description: |
                MIB: IF-MIB
                The number of outbound packets which were chosen to be discarded even though no errors had been detected to prevent their being deliverable to a higher-layer protocol. One possible reason for discarding such a packet could be to free up buffer space. Discontinuities in the value of this counter can occur at re-initialization of the management system, and at other times as indicated by the value of ifCounterDiscontinuityTime.
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.2.2.1.19.{#SNMPINDEX}'
                    - '0'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 3m
              master_item:
                key: net.if.walk
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: c2c81c90a58d4e06836dcc7345ac48a0
              name: 'Interface {#IFNAME}({#IFALIAS}): Outbound packets with errors'
              type: DEPENDENT
              key: 'net.if.out.errors[ifOutErrors.{#SNMPINDEX}]'
              delay: '0'
              description: |
                MIB: IF-MIB
                For packet-oriented interfaces, the number of outbound packets that contained errors preventing them from being deliverable to a higher-layer protocol. For character-oriented or fixed-length interfaces, the number of outbound transmission units that contained errors preventing them from being deliverable to a higher-layer protocol. Discontinuities in the value of this counter can occur at re-initialization of the management system, and at other times as indicated by the value of ifCounterDiscontinuityTime.
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}'
                    - '0'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 3m
              master_item:
                key: net.if.walk
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: c0247a058faf4213846548bb93a29940
              name: 'Interface {#IFNAME}({#IFALIAS}): Bits sent'
              type: DEPENDENT
              key: 'net.if.out[ifHCOutOctets.{#SNMPINDEX}]'
              delay: '0'
              units: bps
              description: |
                MIB: IF-MIB
                The total number of octets transmitted out of the interface, including framing characters. This object is a 64-bit version of ifOutOctets. Discontinuities in the value of this counter can occur at re-initialization of the management system, and at other times as indicated by the value of ifCounterDiscontinuityTime.
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}'
                    - '0'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              master_item:
                key: net.if.walk
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 632cf3e114214226817faee56157853e
              name: 'Interface {#IFNAME}({#IFALIAS}): Speed'
              type: DEPENDENT
              key: 'net.if.speed[ifHighSpeed.{#SNMPINDEX}]'
              delay: '0'
              trends: '0'
              units: bps
              description: |
                MIB: IF-MIB
                An estimate of the interface's current bandwidth in units of 1,000,000 bits per second. If this object reports a value of `n`, then the speed of the interface is somewhere in the range of `n-500,000` to `n+499,999`.
                For interfaces which do not vary in bandwidth or for those where no accurate estimation can be made, this object should contain the nominal bandwidth.
                For a sub-layer which has no concept of bandwidth, this object should be zero.
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.31.1.1.1.15.{#SNMPINDEX}'
                    - '0'
                - type: MULTIPLIER
                  parameters:
                    - '1000000'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: net.if.walk
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: ba3f6c12e66e44a789893e8a3285aa3c
              name: 'Interface {#IFNAME}({#IFALIAS}): Operational status'
              type: DEPENDENT
              key: 'net.if.status[ifOperStatus.{#SNMPINDEX}]'
              delay: '0'
              trends: '0'
              description: |
                MIB: IF-MIB
                The current operational state of the interface, or adminDown(100) while the interface is administratively disabled. SAOS 10 keeps ifAdminStatus up(1) on the physical port row (ifType 6) and reports the admin-state on the logical port row (ifType 53) with the same ifName, so for a physical port the admin-state is read from that row (ifIndex {#CIENA.IF.ADMIN.INDEX}). The operational state and the admin-state are taken from the same walk value, so the "Link down" trigger never sees one of them updated without the other. adminDown(100) is not an IF-MIB value; it replaces ifOperStatus whenever ifAdminStatus is not up(1).
                - The testing(3) state indicates that no operational packets can be passed
                - If ifAdminStatus is down(2) then ifOperStatus should be down(2)
                - If ifAdminStatus is changed to up(1) then ifOperStatus should change to up(1) if the interface is ready to transmit and receive network traffic
                - It should change to dormant(5) if the interface is waiting for external actions (such as a serial line waiting for an incoming connection)
                - It should remain in the down(2) state if and only if there is a fault that prevents it from going to the up(1) state
                - It should remain in the notPresent(6) state if the interface has missing (typically, hardware) components.
              valuemap:
                name: 'IF-MIB::ifOperStatus'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      // ifOperStatus of this row, or adminDown (100) when ifAdminStatus of row {#CIENA.IF.ADMIN.INDEX} is not up(1); both from the same walk value.
                      var NL = String.fromCharCode(10), text = NL + value;
                      function walkInt(oid) {
                          var i = text.indexOf(NL + '.' + oid + ' = '), j, m;
                          if (i < 0) { i = text.indexOf(NL + oid + ' = '); }
                          if (i < 0) { return null; }
                          i = text.indexOf(' = ', i) + 3;
                          j = text.indexOf(NL, i);
                          m = text.substring(i, j < 0 ? text.length : j).match(/([0-9]+)[^0-9]*$/);
                          return m ? parseInt(m[1], 10) : null;
                      }
                      var oper = walkInt('1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}'), admin = walkInt('1.3.6.1.2.1.2.2.1.7.{#CIENA.IF.ADMIN.INDEX}');
                      if (oper === null) { throw 'Cannot find ifOperStatus.{#SNMPINDEX} in the walk value.'; }
                      return (admin === null || admin === 1) ? oper : 100;
              master_item:
                key: net.if.walk
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
              trigger_prototypes:
                - uuid: 97ff69c08ab44e6e85933aae0b1a5c13
                  expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/Ciena SAOS 10 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=2 and (last(/Ciena SAOS 10 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#1)<>last(/Ciena SAOS 10 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#2)) and last(/Ciena SAOS 10 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#2)<>100'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'last(/Ciena SAOS 10 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2 or {$IFCONTROL:"{#IFNAME}"}=0'
                  name: 'Ciena: Interface {#IFNAME}({#IFALIAS}): Link down'
                  opdata: 'Current state: {ITEM.LASTVALUE1}'
                  priority: AVERAGE
                  description: |
                    This trigger expression works as follows:
                    1. It can be triggered if the operations status is down.
                    2. `{$IFCONTROL:"{#IFNAME}"}=1` - a user can redefine the context macro to "0", marking this interface as not important. No new trigger will be fired if this interface is down.
                    3. `last(/TEMPLATE_NAME/METRIC,#1)<>last(/TEMPLATE_NAME/METRIC,#2)` - the trigger fires only if the operational status was up to (1) sometime before (so, does not fire for "eternal off" interfaces.)
                    4. `last(/TEMPLATE_NAME/METRIC,#2)<>100` - the previous value was not adminDown(100). The "Operational status" item reports adminDown(100) while the port is administratively disabled (on SAOS 10 the admin-state is read from the logical port row with the same ifName, because the physical port row always reports up) and reads the admin-state and the operational state from the same walk value, so the trigger only depends on one item. Disabling a port does not raise the problem (the value goes to 100, not 2), an open problem closes when the port is disabled, and re-enabling a port that has no link yet (100, then 2) does not raise it.
                    
                    WARNING: if closed manually - it will not fire again on the next poll, because of .diff.
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: availability
            - uuid: 95c25c64b806481b8045665d4101234b
              name: 'Interface {#IFNAME}({#IFALIAS}): Interface type'
              type: DEPENDENT
              key: 'net.if.type[ifType.{#SNMPINDEX}]'
              delay: '0'
              trends: '0'
              description: |
                MIB: IF-MIB
                The type of interface. Additional values for ifType are assigned by the Internet Assigned Numbers Authority (IANA), through updating the syntax of the IANAifType textual convention.
              valuemap:
                name: 'IF-MIB::ifType'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.2.2.1.3.{#SNMPINDEX}'
                    - '0'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: net.if.walk
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
          trigger_prototypes:
            - uuid: 763cfa425aa74f198f60aa8700fa6671
              expression: |
                change(/Ciena SAOS 10 by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}])<0 and last(/Ciena SAOS 10 by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}])>0
                and (
                last(/Ciena SAOS 10 by SNMP/net.if.type[ifType.{#SNMPINDEX}])=6 or
                last(/Ciena SAOS 10 by SNMP/net.if.type[ifType.{#SNMPINDEX}])=7 or
                last(/Ciena SAOS 10 by SNMP/net.if.type[ifType.{#SNMPINDEX}])=11 or
                last(/Ciena SAOS 10 by SNMP/net.if.type[ifType.{#SNMPINDEX}])=62 or
                last(/Ciena SAOS 10 by SNMP/net.if.type[ifType.{#SNMPINDEX}])=69 or
                last(/Ciena SAOS 10 by SNMP/net.if.type[ifType.{#SNMPINDEX}])=117
                )
                and
                (last(/Ciena SAOS 10 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2 and last(/Ciena SAOS 10 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])<>100)
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: |
                (change(/Ciena SAOS 10 by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}])>0 and last(/Ciena SAOS 10 by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}],#2)>0) or
                (last(/Ciena SAOS 10 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=2 or last(/Ciena SAOS 10 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=100)
              name: 'Ciena: Interface {#IFNAME}({#IFALIAS}): Ethernet has changed to lower speed than it was before'
              opdata: 'Current reported speed: {ITEM.LASTVALUE1}'
              priority: INFO
              description: 'This Ethernet connection has transitioned down from its known maximum speed. This might be a sign of autonegotiation issues. Acknowledge to close the problem manually.'
              manual_close: 'YES'
              dependencies:
                - name: 'Ciena: Interface {#IFNAME}({#IFALIAS}): Link down'
                  expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/Ciena SAOS 10 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=2 and (last(/Ciena SAOS 10 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#1)<>last(/Ciena SAOS 10 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#2)) and last(/Ciena SAOS 10 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#2)<>100'
                  recovery_expression: 'last(/Ciena SAOS 10 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2 or {$IFCONTROL:"{#IFNAME}"}=0'
              tags:
                - tag: scope
                  value: performance
            - uuid: e65739096f07405482c0bc330958de7e
              expression: |
                (avg(/Ciena SAOS 10 by SNMP/net.if.in[ifHCInOctets.{#SNMPINDEX}],15m)>({$IF.UTIL.MAX:"{#IFNAME}"}/100)*last(/Ciena SAOS 10 by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}]) or
                avg(/Ciena SAOS 10 by SNMP/net.if.out[ifHCOutOctets.{#SNMPINDEX}],15m)>({$IF.UTIL.MAX:"{#IFNAME}"}/100)*last(/Ciena SAOS 10 by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}])) and
                last(/Ciena SAOS 10 by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}])>0
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: |
                avg(/Ciena SAOS 10 by SNMP/net.if.in[ifHCInOctets.{#SNMPINDEX}],15m)<(({$IF.UTIL.MAX:"{#IFNAME}"}-3)/100)*last(/Ciena SAOS 10 by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}]) and
                avg(/Ciena SAOS 10 by SNMP/net.if.out[ifHCOutOctets.{#SNMPINDEX}],15m)<(({$IF.UTIL.MAX:"{#IFNAME}"}-3)/100)*last(/Ciena SAOS 10 by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}])
              name: 'Ciena: Interface {#IFNAME}({#IFALIAS}): High bandwidth usage'
              event_name: 'Ciena: Interface {#IFNAME}({#IFALIAS}): High bandwidth usage (>{$IF.UTIL.MAX:"{#IFNAME}"}%)'
              opdata: 'In: {ITEM.LASTVALUE1}, out: {ITEM.LASTVALUE3}, speed: {ITEM.LASTVALUE2}'
              priority: WARNING
              description: 'The utilization of the network interface is close to its estimated maximum bandwidth.'
              manual_close: 'YES'
              dependencies:
                - name: 'Ciena: Interface {#IFNAME}({#IFALIAS}): Link down'
                  expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/Ciena SAOS 10 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=2 and (last(/Ciena SAOS 10 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#1)<>last(/Ciena SAOS 10 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#2)) and last(/Ciena SAOS 10 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#2)<>100'
                  recovery_expression: 'last(/Ciena SAOS 10 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2 or {$IFCONTROL:"{#IFNAME}"}=0'
              tags:
                - tag: scope
                  value: performance
            - uuid: 89b3ce0eef6944808859eed14c1f4f2b
              expression: |
                min(/Ciena SAOS 10 by SNMP/net.if.in.errors[ifInErrors.{#SNMPINDEX}],5m)>{$IF.ERRORS.WARN:"{#IFNAME}"}
                or min(/Ciena SAOS 10 by SNMP/net.if.out.errors[ifOutErrors.{#SNMPINDEX}],5m)>{$IF.ERRORS.WARN:"{#IFNAME}"}
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: |
                max(/Ciena SAOS 10 by SNMP/net.if.in.errors[ifInErrors.{#SNMPINDEX}],5m)<{$IF.ERRORS.WARN:"{#IFNAME}"}*0.8
                and max(/Ciena SAOS 10 by SNMP/net.if.out.errors[ifOutErrors.{#SNMPINDEX}],5m)<{$IF.ERRORS.WARN:"{#IFNAME}"}*0.8
              name: 'Ciena: Interface {#IFNAME}({#IFALIAS}): High error rate'
              event_name: 'Ciena: Interface {#IFNAME}({#IFALIAS}): High error rate (>{$IF.ERRORS.WARN:"{#IFNAME}"} for 5m)'
              opdata: 'errors in: {ITEM.LASTVALUE1}, errors out: {ITEM.LASTVALUE2}'
              priority: WARNING
              description: 'It recovers when it is below 80% of the `{$IF.ERRORS.WARN:"{#IFNAME}"}` threshold.'
              manual_close: 'YES'
              dependencies:
                - name: 'Ciena: Interface {#IFNAME}({#IFALIAS}): Link down'
                  expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/Ciena SAOS 10 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=2 and (last(/Ciena SAOS 10 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#1)<>last(/Ciena SAOS 10 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#2)) and last(/Ciena SAOS 10 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#2)<>100'
                  recovery_expression: 'last(/Ciena SAOS 10 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2 or {$IFCONTROL:"{#IFNAME}"}=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
          graph_prototypes:
            - uuid: bd192e26edf146b38219d5e108202248
              name: 'Interface {#IFNAME}({#IFALIAS}): Network traffic'
              graph_items:
                - drawtype: GRADIENT_LINE
                  color: 199C0D
                  item:
                    host: 'Ciena SAOS 10 by SNMP'
                    key: 'net.if.in[ifHCInOctets.{#SNMPINDEX}]'
                - sortorder: '1'
                  drawtype: BOLD_LINE
                  color: F63100
                  item:
                    host: 'Ciena SAOS 10 by SNMP'
                    key: 'net.if.out[ifHCOutOctets.{#SNMPINDEX}]'
                - sortorder: '2'
                  color: 00611C
                  yaxisside: RIGHT
                  item:
                    host: 'Ciena SAOS 10 by SNMP'
                    key: 'net.if.out.errors[ifOutErrors.{#SNMPINDEX}]'
                - sortorder: '3'
                  color: F7941D
                  yaxisside: RIGHT
                  item:
                    host: 'Ciena SAOS 10 by SNMP'
                    key: 'net.if.in.errors[ifInErrors.{#SNMPINDEX}]'
                - sortorder: '4'
                  color: FC6EA3
                  yaxisside: RIGHT
                  item:
                    host: 'Ciena SAOS 10 by SNMP'
                    key: 'net.if.out.discards[ifOutDiscards.{#SNMPINDEX}]'
                - sortorder: '5'
                  color: 6C59DC
                  yaxisside: RIGHT
                  item:
                    host: 'Ciena SAOS 10 by SNMP'
                    key: 'net.if.in.discards[ifInDiscards.{#SNMPINDEX}]'
          master_item:
            key: net.if.walk
          preprocessing:
            - type: SNMP_WALK_TO_JSON
              parameters:
                - '{#IFOPERSTATUS}'
                - 1.3.6.1.2.1.2.2.1.8
                - '0'
                - '{#IFADMINSTATUS}'
                - 1.3.6.1.2.1.2.2.1.7
                - '0'
                - '{#IFALIAS}'
                - 1.3.6.1.2.1.31.1.1.1.18
                - '0'
                - '{#IFNAME}'
                - 1.3.6.1.2.1.31.1.1.1.1
                - '0'
                - '{#IFDESCR}'
                - 1.3.6.1.2.1.2.2.1.2
                - '0'
                - '{#IFTYPE}'
                - 1.3.6.1.2.1.2.2.1.3
                - '0'
            - type: JAVASCRIPT
              parameters:
                - |
                  // SAOS 10 reports the admin-state of a port on the logical port row (ifType 53) with the same ifName; ifAdminStatus of the physical row (ifType 6) is always up(1).
                  var rows = JSON.parse(value), lp = {}, i, r, l;
                  for (i = 0; i < rows.length; i++) {
                      r = rows[i];
                      if (String(r['{#IFTYPE}']) === '53' && r['{#IFNAME}'] !== undefined) { lp[r['{#IFNAME}']] = r; }
                  }
                  for (i = 0; i < rows.length; i++) {
                      r = rows[i];
                      l = String(r['{#IFTYPE}']) === '6' ? lp[r['{#IFNAME}']] : undefined;
                      if (l !== undefined) {
                          r['{#IFADMINSTATUS}'] = l['{#IFADMINSTATUS}'];
                          r['{#CIENA.IF.ADMIN.INDEX}'] = l['{#SNMPINDEX}'];
                      } else {
                          r['{#CIENA.IF.ADMIN.INDEX}'] = r['{#SNMPINDEX}'];
                      }
                  }
                  return JSON.stringify(rows);
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          overrides:
            - name: 'Skip RMON CRC counters on non-physical interfaces'
              step: '1'
              filter:
                conditions:
                  - macro: '{#IFTYPE}'
                    value: ^6$
                    operator: NOT_MATCHES_REGEX
                    formulaid: A
              operations:
                - operationobject: ITEM_PROTOTYPE
                  operator: LIKE
                  value: CRC/alignment
                  discover: NO_DISCOVER
        - uuid: 7c476db0e44842f48e65b126b3ad4c02
          name: 'Filesystem discovery'
          type: DEPENDENT
          key: vfs.fs.discovery
          delay: '0'
          filter:
            evaltype: AND
