    - uuid: e77fa0b873544df08288303b99b09ebf
      expression: '(last(/Ciena SAOS 10 by SNMP/system.hw.uptime[hrSystemUptime.0])>0 and last(/Ciena SAOS 10 by SNMP/system.hw.uptime[hrSystemUptime.0])<10m) or (last(/Ciena SAOS 10 by SNMP/system.hw.uptime[hrSystemUptime.0])=0 and last(/Ciena SAOS 10 by SNMP/system.net.uptime[sysUpTime.0])<10m)'
      name: 'Ciena: Host has been restarted'
      event_name: 'Ciena: {HOST.NAME} has been restarted (uptime < 10m)'
      opdata: 'Uptime: {ITEM.LASTVALUE1}'
      priority: WARNING
      description: 'Uptime is less than 10 minutes.'
      manual_close: 'YES'
      dependencies:
        - name: 'Ciena: No SNMP data collection'
          expression: 'max(/Ciena SAOS 10 by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
      tags:
        - tag: scope
          value: notice
