              trigger_prototypes:
                - uuid: a486964c00e646288e727486fcec83ac
                  expression: 'last(/Ciena SAOS 10 by SNMP/ciena.module.oper.state[{#SNMPINDEX}])=6 or last(/Ciena SAOS 10 by SNMP/ciena.module.oper.state[{#SNMPINDEX}])=14 or last(/Ciena SAOS 10 by SNMP/ciena.module.oper.state[{#SNMPINDEX}])=16'
                  name: 'Ciena: Module [{#MODULE.MODEL} {#SNMPINDEX}]: Module is faulted'
