zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 36bff6c29af64692839d077febfc7079
      name: 'Templates/Network devices'
  templates:
    - uuid: 0eef66b880894a84823d33e103483152
      template: 'Ciena SAOS 10 by SNMP'
      name: 'Ciena SAOS 10 by SNMP'
      description: |
        Ciena SAOS 10 by SNMP
        
        Monitors Ciena packet networking platforms running SAOS 10 (392x/3931, 394x, 398x, 513x, 5144, 516x, 517x, 518x, 81xx) over SNMP: polling (v2c or v3) plus SNMP traps.
        
        Polled: SNMPv2-MIB system, ENTITY-MIB chassis inventory, UCD-SNMP-MIB CPU/memory/filesystems, LM-SENSORS-MIB temperature/fan/PSU voltage, IF-MIB interfaces (physical ports and LAGs by default) with RMON CRC errors, CIENA-CES-PORT-XCVR-MIB transceiver DOM with on-box alarm thresholds, CIENA-CES-MODULE-MIB module state and software.
        Traps: link, dying gasp, chassis health, PSU, fan, platform hardware, module state, reboot, configuration change, transceiver, SNMP authentication, AAA, routing protocols (BGP/OSPF/IS-IS/LDP/BFD), CFM, MPLS services, synchronization.
        
        Numeric OIDs only: no MIB files are required on the Zabbix server. The Ciena MIB set is available to customers from the Ciena Customer Portal.
        
        Author: Jeff Groom (Ciena)
        
        Template version: 1.0.0
      groups:
        - name: 'Templates/Network devices'
      items:
        - uuid: 112694fadb444b9883c53f26581b272b
          name: 'LDAP server state (last trap)'
          type: DEPENDENT
          key: ciena.aaa.ldap.state
          delay: '0'
          trends: '0'
          description: |
            LDAP server state derived from the last CIENA-CES-AAA-MIB LDAP server notification received (TACACS+ and LDAP are tracked separately).
            Possible values:
            4 - LDAP server status changed
            5 - all LDAP servers down
          valuemap:
            name: 'CIENA-CES-AAA-MIB::AaaServerTrapState'
          preprocessing:
            - type: REGEX
              parameters:
                - 1271\.2\.2\.111\.0\.(4|5)\b
                - \1
              error_handler: DISCARD_VALUE
          master_item:
            key: 'snmptrap["1271\.2\.2\.111\.0\.[2-5]\b"]'
          tags:
            - tag: component
              value: security
            - tag: source
              value: snmp-trap
          triggers:
            - uuid: 700041f9a0be483bb44297acc50c9244
              expression: 'last(/Ciena SAOS 10 by SNMP/ciena.aaa.ldap.state)=5'
              name: 'Ciena: All LDAP servers are down'
              opdata: 'Current state: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: 'The last LDAP server notification reported that the device lost contact with all configured LDAP servers (1271.2.2.111.0.5). Recovers when the next LDAP server status notification (1271.2.2.111.0.4) is received; check its text to confirm that a server is reachable again. TACACS+ and LDAP are tracked separately, so a notification for one never closes the other.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: security
        - uuid: bd5200a25ef74e00b77b5840b6869789
          name: 'TACACS+ server state (last trap)'
          type: DEPENDENT
          key: ciena.aaa.tacacs.state
          delay: '0'
          trends: '0'
          description: |
            TACACS+ server state derived from the last CIENA-CES-AAA-MIB TACACS+ server notification received (TACACS+ and LDAP are tracked separately).
            Possible values:
            2 - TACACS+ server status changed
            3 - all TACACS+ servers down
          valuemap:
            name: 'CIENA-CES-AAA-MIB::AaaServerTrapState'
          preprocessing:
            - type: REGEX
              parameters:
                - 1271\.2\.2\.111\.0\.(2|3)\b
                - \1
              error_handler: DISCARD_VALUE
          master_item:
            key: 'snmptrap["1271\.2\.2\.111\.0\.[2-5]\b"]'
          tags:
            - tag: component
              value: security
            - tag: source
              value: snmp-trap
          triggers:
            - uuid: ce4a371a67e74c0783343086302c49b6
              expression: 'last(/Ciena SAOS 10 by SNMP/ciena.aaa.tacacs.state)=3'
              name: 'Ciena: All TACACS+ servers are down'
              opdata: 'Current state: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: 'The last TACACS+ server notification reported that the device lost contact with all configured TACACS+ servers (1271.2.2.111.0.3). Recovers when the next TACACS+ server status notification (1271.2.2.111.0.2) is received; check its text to confirm that a server is reachable again. TACACS+ and LDAP are tracked separately, so a notification for one never closes the other.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: security
        - uuid: 763cef7484d447d08a0a05ebadc6bc48
          name: 'Chassis health state (last trap)'
          type: DEPENDENT
          key: ciena.chassis.health.state
          delay: '0'
          trends: '0'
          description: |
            Chassis health state derived from the last chassis health notification received.
            Possible values:
            13 - unknown
            14 - warning
            15 - faulted
            16 - degraded
            17 - good
          valuemap:
            name: 'CIENA-CES-CHASSIS-MIB::ChassisHealthState'
          preprocessing:
            - type: REGEX
              parameters:
                - '1271\.2\.2\.4\.0\.(1[3-7])\b'
                - \1
          master_item:
            key: 'snmptrap["1271\.2\.2\.4\.0\.1[3-7]\b"]'
          tags:
            - tag: component
              value: health
            - tag: source
              value: snmp-trap
          triggers:
            - uuid: fdfe85a7f4fb4ae082a52ec5ef5fea49
              expression: 'last(/Ciena SAOS 10 by SNMP/ciena.chassis.health.state)=15 or last(/Ciena SAOS 10 by SNMP/ciena.chassis.health.state)=16'
              name: 'Ciena: Chassis health is faulted or degraded'
              opdata: 'Current state: {ITEM.LASTVALUE1}'
              priority: HIGH
              description: 'The last chassis health notification reported a faulted or degraded chassis. Recovers when a "good" notification is received.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
            - uuid: b8189663ef004bd08c9deda4660dc383
              expression: 'last(/Ciena SAOS 10 by SNMP/ciena.chassis.health.state)=14'
              name: 'Ciena: Chassis health warning'
              opdata: 'Current state: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'The last chassis health notification reported a warning. Recovers when a "good" notification is received.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
        - uuid: 8a7bb41c1ce049178535e40360685df4
          name: 'Fan speed state (last trap)'
          type: DEPENDENT
          key: ciena.fan.trap.state
          delay: '0'
          trends: '0'
          description: |
            Fan speed state derived from the last fan speed notification received (any fan).
            Possible values:
            6 - above maximum threshold
            7 - below minimum threshold
            8 - normal range
          valuemap:
            name: 'CIENA-CES-CHASSIS-MIB::FanSpeedTrapState'
          preprocessing:
            - type: REGEX
              parameters:
                - 1271\.2\.2\.4\.0\.(6|7|8)\b
                - \1
          master_item:
            key: 'snmptrap["1271\.2\.2\.4\.0\.(6|7|8)\b"]'
          tags:
            - tag: component
              value: fan
            - tag: source
              value: snmp-trap
          triggers:
            - uuid: 4f396aa32fd541138347a1b481017933
              expression: 'last(/Ciena SAOS 10 by SNMP/ciena.fan.trap.state)=6 or last(/Ciena SAOS 10 by SNMP/ciena.fan.trap.state)=7'
              recovery_mode: NONE
              name: 'Ciena: Fan speed out of range reported'
              opdata: 'Current state: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: 'A fan speed threshold notification was received. The notification does not identify the fan in a way the template can rely on, so a "normal range" notification from one fan cannot be told apart from one sent by another: the problem does not close automatically and must be closed manually once the fan is back in range (see the "Fan speed traps" item for the trap text and the per-fan "Speed is too low" triggers for the polled speed). Every threshold notification opens its own problem.'
              type: MULTIPLE
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
        - uuid: 51640d7a818e46148f55e73fedd63393
          name: 'SNMP walk modules'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.1271.2.1.2.1.2.1.1.4,1.3.6.1.4.1.1271.2.1.2.1.2.1.1.8,1.3.6.1.4.1.1271.2.1.2.1.2.1.1.11,1.3.6.1.4.1.1271.2.1.2.1.2.1.1.20,1.3.6.1.4.1.1271.2.1.2.1.2.4.2.1.2,1.3.6.1.4.1.1271.2.1.2.1.2.4.2.1.3,1.3.6.1.4.1.1271.2.1.2.1.2.4.2.1.4,1.3.6.1.4.1.1271.2.1.2.1.2.4.2.1.6]'
          key: ciena.module.walk
          delay: 10m
          history: '0'
          value_type: TEXT
          trends: '0'
          description: |
            MIB: CIENA-CES-MODULE-MIB
            Used for discovering modules (cienaCesModuleTable, cienaCesModuleSwTable): model, operational state, last reboot reason, running release and software partitions. Fixed-configuration platforms report a single module with index 1.1.1. If the tables are not implemented, the error is discarded: the item stays supported with no value and nothing is discovered.
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
              error_handler: DISCARD_VALUE
          tags:
            - tag: component
              value: raw
        - uuid: 0042c156bb144b52812e9b0ff80a61ef
          name: 'Power supply state (last trap)'
          type: DEPENDENT
          key: ciena.psu.trap.state
          delay: '0'
          trends: '0'
          description: |
            Power supply state derived from the last power supply notification received (any PSU).
            Possible values:
            1 - faulted
            2 - online
          valuemap:
            name: 'CIENA-CES-CHASSIS-MIB::PowerSupplyTrapState'
          preprocessing:
            - type: REGEX
              parameters:
                - 1271\.2\.2\.4\.0\.(1|2)\b
                - \1
          master_item:
            key: 'snmptrap["1271\.2\.2\.4\.0\.(1|2)\b"]'
          tags:
            - tag: component
              value: psu
            - tag: source
              value: snmp-trap
          triggers:
            - uuid: 5ec8daa0656743df882cd15fc0a2c917
              expression: 'last(/Ciena SAOS 10 by SNMP/ciena.psu.trap.state)=1'
              recovery_mode: NONE
              name: 'Ciena: Power supply fault reported'
              opdata: 'Current state: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: 'A power supply faulted notification was received. The notification does not identify the PSU in a way the template can rely on, so an online notification from one PSU cannot be told apart from one sent by another: the problem does not close automatically and must be closed manually once the PSU is back online (see the "Power supply traps" item for the trap text and, on platforms with voltage telemetry, the per-PSU "Output voltage is too low" trigger). Every faulted notification opens its own problem.'
              type: MULTIPLE
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
        - uuid: 33fd5b22e3a04cfe8919f4e8b9dccb96
          name: 'SNMP walk sensors'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.2021.13.16.2.1.2,1.3.6.1.4.1.2021.13.16.2.1.3,1.3.6.1.4.1.2021.13.16.3.1.2,1.3.6.1.4.1.2021.13.16.3.1.3,1.3.6.1.4.1.2021.13.16.4.1.2,1.3.6.1.4.1.2021.13.16.4.1.3]'
          key: ciena.sensor.walk
          delay: 3m
          history: '0'
          value_type: TEXT
          trends: '0'
          description: |
            MIB: LM-SENSORS-MIB
            Used for discovering temperature sensors (lmTempSensorsTable), fans (lmFanSensorsTable) and power supplies (lmVoltSensorsTable). LM-SENSORS-MIB is the only SNMP GET path to environmental data on SAOS 10. If the tables are not implemented, the "check for not supported value" step discards the error: the item stays supported with no value and the sensor discovery rules find nothing.
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
              error_handler: DISCARD_VALUE
          tags:
            - tag: component
              value: raw
        - uuid: fd7c94727006447e813940facd17e704
          name: 'SNMP walk transceiver thresholds'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.1271.2.1.9.1.1.1.1.4,1.3.6.1.4.1.1271.2.1.9.1.1.1.1.7,1.3.6.1.4.1.1271.2.1.9.1.1.1.1.8,1.3.6.1.4.1.1271.2.1.9.1.1.1.1.9,1.3.6.1.4.1.1271.2.1.9.1.1.1.1.10,1.3.6.1.4.1.1271.2.1.9.1.1.1.1.11,1.3.6.1.4.1.1271.2.1.9.1.1.1.1.12,1.3.6.1.4.1.1271.2.1.9.1.1.1.1.13,1.3.6.1.4.1.1271.2.1.9.1.1.1.1.14,1.3.6.1.4.1.1271.2.1.9.1.1.1.1.15,1.3.6.1.4.1.1271.2.1.9.1.1.1.1.16,1.3.6.1.4.1.1271.2.1.9.1.1.1.1.40]'
          key: ciena.xcvr.threshold.walk
          delay: 1h
          history: '0'
          value_type: TEXT
          trends: '0'
          description: |
            MIB: CIENA-CES-PORT-XCVR-MIB
            Used for discovering transceivers (cienaCesPortXcvrTable): port name, presence (Vcc) and the alarm thresholds programmed in the transceiver. If the table is not implemented (for example a unit without pluggable cages), the error is discarded: the item stays supported with no value and nothing is discovered.
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
              error_handler: DISCARD_VALUE
          tags:
            - tag: component
              value: raw
        - uuid: 3b2130706e364a208b0fcf558a3fd55d
          name: 'SNMP walk transceiver diagnostics'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.1271.2.1.9.1.1.1.1.3,1.3.6.1.4.1.1271.2.1.9.1.1.1.1.4,1.3.6.1.4.1.1271.2.1.9.1.1.1.1.5,1.3.6.1.4.1.1271.2.1.9.1.1.1.1.6,1.3.6.1.4.1.1271.2.1.9.1.1.1.1.35]'
          key: ciena.xcvr.walk
          delay: 5m
          history: '0'
          value_type: TEXT
          trends: '0'
          description: |
            MIB: CIENA-CES-PORT-XCVR-MIB
            Used for the transceiver digital diagnostics items (cienaCesPortXcvrTable: temperature, Vcc, bias, Rx power, Tx output power). If the table is not implemented, the error is discarded and the item stays supported with no value.
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
              error_handler: DISCARD_VALUE
          tags:
            - tag: component
              value: raw
        - uuid: 255dd1f6c8d84902813c162606173727
          name: 'ICMP ping'
          type: SIMPLE
          key: icmpping
          description: |
            The host accessibility by ICMP ping.
            
            0 - ICMP ping fails;
            1 - ICMP ping successful.
          valuemap:
            name: 'Service state'
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: c5047ebc2d7849c388cf450190ed6239
              expression: 'max(/Ciena SAOS 10 by SNMP/icmpping,#3)=0'
              name: 'Ciena: Unavailable by ICMP ping'
              priority: HIGH
              description: 'Last three attempts returned timeout. Please check device connectivity.'
              tags:
                - tag: scope
                  value: availability
        - uuid: 4dcfb3dc4f3943738ec5c293e2a5c8eb
          name: 'ICMP loss'
          type: SIMPLE
          key: icmppingloss
          value_type: FLOAT
          units: '%'
          description: 'The percentage of lost packets.'
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: 5842e7d995d346b9825e18787058d9c2
              expression: 'min(/Ciena SAOS 10 by SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/Ciena SAOS 10 by SNMP/icmppingloss,5m)<100'
              name: 'Ciena: High ICMP ping loss'
              opdata: 'Loss: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'ICMP packets loss detected.'
              dependencies:
                - name: 'Ciena: Unavailable by ICMP ping'
                  expression: 'max(/Ciena SAOS 10 by SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: be2235f1f9d845ef82994f730fa02c6b
          name: 'ICMP response time'
          type: SIMPLE
          key: icmppingsec
          value_type: FLOAT
          units: s
          description: 'The ICMP ping response time (in seconds).'
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: b3ba7a3097194c808edb28bc29279efe
              expression: 'avg(/Ciena SAOS 10 by SNMP/icmppingsec,5m)>{$ICMP_RESPONSE_TIME_WARN}'
              name: 'Ciena: High ICMP ping response time'
              opdata: 'Value: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'Average ICMP response time is too high.'
              dependencies:
                - name: 'Ciena: High ICMP ping loss'
                  expression: 'min(/Ciena SAOS 10 by SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/Ciena SAOS 10 by SNMP/icmppingloss,5m)<100'
                - name: 'Ciena: Unavailable by ICMP ping'
                  expression: 'max(/Ciena SAOS 10 by SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: 8cf2799e1a07430f8b8fe488d235d0e1
          name: 'SNMP walk RMON Ethernet statistics'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.2.1.16.1.1.1.2,1.3.6.1.2.1.16.1.1.1.8]'
          key: net.if.rmon.walk
          history: '0'
          value_type: TEXT
          trends: '0'
          description: |
            MIB: RMON-MIB
            Used for the per-port CRC/alignment error counters (etherStatsCRCAlignErrors). etherStatsDataSource is used to map each row to its ifIndex. If the RMON table is not implemented, the "check for not supported value" step discards the error: the item stays supported with no value and the CRC items stay empty.
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
              error_handler: DISCARD_VALUE
          tags:
            - tag: component
              value: raw
        - uuid: eec96b2943794b6a80411e1e03c5c1ee
          name: 'SNMP walk network interfaces'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.2.1.2.2.1.8,1.3.6.1.2.1.2.2.1.7,1.3.6.1.2.1.31.1.1.1.18,1.3.6.1.2.1.31.1.1.1.1,1.3.6.1.2.1.2.2.1.2,1.3.6.1.2.1.2.2.1.3,1.3.6.1.2.1.31.1.1.1.6,1.3.6.1.2.1.31.1.1.1.10,1.3.6.1.2.1.2.2.1.14,1.3.6.1.2.1.2.2.1.20,1.3.6.1.2.1.2.2.1.19,1.3.6.1.2.1.2.2.1.13,1.3.6.1.2.1.31.1.1.1.15]'
          key: net.if.walk
          history: '0'
          value_type: TEXT
          trends: '0'
          description: |
            MIB: IF-MIB
            Used for discovering interfaces from IF-MIB. SAOS 10 lists physical ports (ifType 6), logical ports (ifType 53), LAGs (ifType 161), flow points/sub-ports (ifType 135) and management interfaces in the same table; the discovery filters select physical ports and LAGs by default.
          tags:
            - tag: component
              value: raw
        - uuid: 66bf4f43b3c8470b836cb9f9ec13dbdc
          name: 'SNMP traps (fallback)'
          type: SNMP_TRAP
          key: snmptrap.fallback
          delay: '0'
          history: 14d
          value_type: LOG
          trends: '0'
          description: 'The item is used to collect all SNMP traps unmatched by other snmptrap items.'
          tags:
            - tag: component
              value: network
            - tag: source
              value: snmp-trap
        - uuid: 6ee217a872f14e24841925f908702c8b
          name: 'Link down traps'
          type: SNMP_TRAP
          key: 'snmptrap["((IF-MIB::linkDown|snmpModules\.1\.1\.5\.3\b|1\.3\.6\.1\.6\.3\.1\.1\.5\.3\b)|1271\.2\.2\.2\.0\.(1|4|5)\b|1271\.2\.2\.15\.0\.1\b)"]'
          delay: '0'
          history: 14d
          value_type: LOG
          trends: '0'
          description: 'Standard linkDown notifications and CIENA-CES-PORT-MIB port down / channelized port down / signal degrade set notifications (1271.2.2.2.0.1, .4, .5), plus CIENA-CES-OAM-MIB link event traps (1271.2.2.15.0.1). Interface state itself is polled from IF-MIB; this item records the events.'
          tags:
            - tag: component
              value: network
            - tag: source
              value: snmp-trap
        - uuid: 5646d94de38141148890cf7856f3b667
          name: 'Link up traps'
          type: SNMP_TRAP
          key: 'snmptrap["((IF-MIB::linkUp|snmpModules\.1\.1\.5\.4\b|1\.3\.6\.1\.6\.3\.1\.1\.5\.4\b)|1271\.2\.2\.2\.0\.(2|3|6)\b)"]'
          delay: '0'
          history: 14d
          value_type: LOG
          trends: '0'
          description: 'Standard linkUp notifications and CIENA-CES-PORT-MIB port up / channelized port up / signal degrade clear notifications (1271.2.2.2.0.2, .3, .6).'
          tags:
            - tag: component
              value: network
            - tag: source
              value: snmp-trap
        - uuid: 59423d86677048308a83ac438aeeeb1a
          name: 'Reboot traps'
          type: SNMP_TRAP
          key: 'snmptrap["((SNMPv2-MIB::coldStart|snmpModules\.1\.1\.5\.1\b|1\.3\.6\.1\.6\.3\.1\.1\.5\.1\b)|1271\.2\.2\.4\.0\.18\b)"]'
          delay: '0'
          history: 14d
          value_type: LOG
          trends: '0'
          description: 'Standard coldStart (carries cienaCesModuleLastRebootReason and the running release as varbinds) and CIENA-CES-CHASSIS-MIB cienaCesChassisRebootNotification (1271.2.2.4.0.18).'
          tags:
            - tag: component
              value: system
            - tag: source
              value: snmp-trap
          triggers:
            - uuid: f6ea6b2305634b3e8104b7e68ac6b366
              expression: 'nodata(/Ciena SAOS 10 by SNMP/snmptrap["((SNMPv2-MIB::coldStart|snmpModules\.1\.1\.5\.1\b|1\.3\.6\.1\.6\.3\.1\.1\.5\.1\b)|1271\.2\.2\.4\.0\.18\b)"],{$CIENA.TRAP.WINDOW})=0'
