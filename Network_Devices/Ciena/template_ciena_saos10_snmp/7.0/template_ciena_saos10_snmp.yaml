              - macro: '{#FSNAME}'
                value: '{$VFS.FS.FSNAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
          description: 'Discovering filesystems from UCD-SNMP-MIB dskTable.'
          item_prototypes:
            - uuid: b758dad119a04f9289392ab2eb6c1c22
              name: 'FS [{#FSNAME}]: Space: Available'
              type: DEPENDENT
              key: 'vfs.fs.free[dskAvail.{#SNMPINDEX}]'
              delay: '0'
              units: B
              description: |
                MIB: UCD-SNMP-MIB
                Available space on the disk.
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.2021.9.1.7.{#SNMPINDEX}'
                    - '0'
                - type: MULTIPLIER
                  parameters:
                    - '1024'
              master_item:
                key: vfs.fs.walk
              tags:
                - tag: component
                  value: storage
                - tag: filesystem
                  value: '{#FSNAME}'
            - uuid: c8bc1d49abb54e518d683bf5372cf9d0
              name: 'FS [{#FSNAME}]: Space: Used, in %'
              type: DEPENDENT
              key: 'vfs.fs.pused[dskPercent.{#SNMPINDEX}]'
              delay: '0'
              value_type: FLOAT
              units: '%'
              description: |
                MIB: UCD-SNMP-MIB
                Percentage of space used on the disk.
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.2021.9.1.9.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: vfs.fs.walk
              tags:
                - tag: component
                  value: storage
                - tag: filesystem
                  value: '{#FSNAME}'
              trigger_prototypes:
                - uuid: 3b455782ed68488682c8393ed3958206
                  expression: 'last(/Ciena SAOS 10 by SNMP/vfs.fs.pused[dskPercent.{#SNMPINDEX}])>{$VFS.FS.PUSED.MAX.CRIT:"{#FSNAME}"}'
                  name: 'Ciena: FS [{#FSNAME}]: Disk space is critically low'
                  event_name: 'Ciena: FS [{#FSNAME}]: Disk space is critically low (used > {$VFS.FS.PUSED.MAX.CRIT:"{#FSNAME}"}%)'
                  opdata: 'Space used: {ITEM.LASTVALUE1}'
                  priority: AVERAGE
                  description: 'The filesystem utilization is above the critical threshold. On SAOS 10 a full /mnt/config or /mnt/log can block configuration saves and software upgrades.'
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: availability
                    - tag: scope
                      value: capacity
                - uuid: 1b4a511887214e7f83dc019fe8543aa1
                  expression: 'last(/Ciena SAOS 10 by SNMP/vfs.fs.pused[dskPercent.{#SNMPINDEX}])>{$VFS.FS.PUSED.MAX.WARN:"{#FSNAME}"}'
                  name: 'Ciena: FS [{#FSNAME}]: Disk space is low'
                  event_name: 'Ciena: FS [{#FSNAME}]: Disk space is low (used > {$VFS.FS.PUSED.MAX.WARN:"{#FSNAME}"}%)'
                  opdata: 'Space used: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: 'The filesystem utilization is above the warning threshold.'
                  manual_close: 'YES'
                  dependencies:
                    - name: 'Ciena: FS [{#FSNAME}]: Disk space is critically low'
                      expression: 'last(/Ciena SAOS 10 by SNMP/vfs.fs.pused[dskPercent.{#SNMPINDEX}])>{$VFS.FS.PUSED.MAX.CRIT:"{#FSNAME}"}'
                  tags:
                    - tag: scope
                      value: capacity
            - uuid: 3983fe7b46d343e1885401ded179a5d5
              name: 'FS [{#FSNAME}]: Space: Total'
              type: DEPENDENT
              key: 'vfs.fs.total[dskTotal.{#SNMPINDEX}]'
              delay: '0'
              units: B
              description: |
                MIB: UCD-SNMP-MIB
                Total size of the disk/partition (kBytes).
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.2021.9.1.6.{#SNMPINDEX}'
                    - '0'
                - type: MULTIPLIER
                  parameters:
                    - '1024'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: vfs.fs.walk
              tags:
                - tag: component
                  value: storage
                - tag: filesystem
                  value: '{#FSNAME}'
            - uuid: 0ac91d6dc1994d69831df04e77150a1b
              name: 'FS [{#FSNAME}]: Space: Used'
              type: DEPENDENT
              key: 'vfs.fs.used[dskUsed.{#SNMPINDEX}]'
              delay: '0'
              units: B
              description: |
                MIB: UCD-SNMP-MIB
                Used space on the disk.
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.2021.9.1.8.{#SNMPINDEX}'
                    - '0'
                - type: MULTIPLIER
                  parameters:
                    - '1024'
              master_item:
                key: vfs.fs.walk
              tags:
                - tag: component
                  value: storage
                - tag: filesystem
                  value: '{#FSNAME}'
          graph_prototypes:
            - uuid: c0a2c0b694de47b981c50c899c16fb76
              name: 'FS [{#FSNAME}]: Disk space usage'
              graph_items:
                - drawtype: GRADIENT_LINE
                  color: 199C0D
                  item:
                    host: 'Ciena SAOS 10 by SNMP'
                    key: 'vfs.fs.used[dskUsed.{#SNMPINDEX}]'
                - sortorder: '1'
                  color: F63100
                  item:
                    host: 'Ciena SAOS 10 by SNMP'
                    key: 'vfs.fs.total[dskTotal.{#SNMPINDEX}]'
          master_item:
            key: vfs.fs.walk
          preprocessing:
            - type: SNMP_WALK_TO_JSON
              parameters:
                - '{#FSNAME}'
                - 1.3.6.1.4.1.2021.9.1.2
                - '0'
              error_handler: DISCARD_VALUE
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
      tags:
        - tag: class
          value: network
        - tag: target
          value: ciena
        - tag: target
          value: ciena-saos10
      macros:
        - macro: '{$CIENA.CPU.UTIL.CRIT}'
          value: '90'
          description: 'Threshold of CPU utilization expressed in %.'
        - macro: '{$CIENA.FAN.SPEED.MIN}'
          value: '1000'
          description: 'Minimum fan speed in RPM. Can be used with the fan name as context, for example {$CIENA.FAN.SPEED.MIN:"fan1"}.'
        - macro: '{$CIENA.MEMORY.UTIL.MAX}'
          value: '90'
          description: 'Threshold of memory utilization expressed in %.'
        - macro: '{$CIENA.PSU.VOLTAGE.MIN}'
          value: '1'
          description: 'Minimum PSU output voltage in V. The low-voltage trigger fires only for a PSU that reported a non-zero voltage in the 24 hours before the drop, and recovers when the voltage is back at or above this value. Can be used with the PSU name as context, for example {$CIENA.PSU.VOLTAGE.MIN:"psa"}.'
        - macro: '{$CIENA.SENSOR.NAME.MATCHES}'
          value: '.*'
          description: 'Used in temperature sensor, fan and power supply discovery rule filters.'
        - macro: '{$CIENA.SENSOR.NAME.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
          description: 'Used in temperature sensor, fan and power supply discovery rule filters.'
        - macro: '{$CIENA.TEMP.CRIT}'
          value: '75'
          description: 'Critical temperature threshold in °C. Can be used with the sensor name as context, for example {$CIENA.TEMP.CRIT:"switch-temperature"}.'
        - macro: '{$CIENA.TEMP.WARN}'
          value: '65'
          description: 'Warning temperature threshold in °C. Can be used with the sensor name as context.'
        - macro: '{$CIENA.TRAP.WINDOW}'
          value: 10m
          description: 'Time window for the event-type trap triggers (restart, configuration change, authentication failure, routing, module, dying gasp, CFM, transceiver threshold, platform hardware): the problem closes automatically when no further matching trap arrives within this interval.'
        - macro: '{$CIENA.XCVR.PORT.MATCHES}'
          value: '.*'
          description: 'Used in transceiver discovery rule filters.'
        - macro: '{$CIENA.XCVR.PORT.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
          description: 'Used in transceiver discovery rule filters.'
        - macro: '{$CIENA.XCVR.RX.LOS.ALERT}'
          value: '0'
          description: 'Set to 1 to enable the "No optical input" trigger for transceivers whose Rx power stays at or below {$CIENA.XCVR.RX.NOLIGHT}. Can be used with the port name as context, for example {$CIENA.XCVR.RX.LOS.ALERT:"1"}.'
        - macro: '{$CIENA.XCVR.RX.NOLIGHT}'
          value: '-39'
          description: 'Optical power in dBm at or below which a transceiver is considered to receive (or transmit) no light; 0 uW is reported as -40 dBm. Such ports are excluded from the Rx/Tx power low threshold triggers. Can be used with the port name as context.'
        - macro: '{$ICMP_LOSS_WARN}'
          value: '20'
          description: 'Warning threshold of ICMP packet loss in %.'
        - macro: '{$ICMP_RESPONSE_TIME_WARN}'
          value: '0.15'
          description: 'Warning threshold of the average ICMP response time in seconds.'
        - macro: '{$IF.ERRORS.WARN}'
          value: '2'
          description: 'Warning threshold of error packet rate. Can be used with interface name as context.'
        - macro: '{$IF.UTIL.MAX}'
          value: '90'
          description: 'Used as a threshold in the interface utilization trigger.'
        - macro: '{$IFCONTROL}'
          value: '1'
          description: 'Link status trigger will be fired only for interfaces where the context macro equals "1".'
        - macro: '{$NET.IF.IFADMINSTATUS.MATCHES}'
          value: '^.*'
          description: 'Used in network interface discovery rule filters.'
        - macro: '{$NET.IF.IFADMINSTATUS.NOT_MATCHES}'
          value: ^2$
          description: 'Ignore `down(2)` administrative status. For SAOS 10 physical ports the admin status is taken from the logical port row with the same ifName, because the physical port row always reports up(1).'
        - macro: '{$NET.IF.IFALIAS.MATCHES}'
          value: '.*'
          description: 'Used in network interface discovery rule filters.'
        - macro: '{$NET.IF.IFALIAS.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
          description: 'Used in network interface discovery rule filters.'
        - macro: '{$NET.IF.IFDESCR.MATCHES}'
          value: '.*'
          description: 'Used in network interface discovery rule filters.'
        - macro: '{$NET.IF.IFDESCR.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
          description: 'Used in network interface discovery rule filters.'
        - macro: '{$NET.IF.IFNAME.MATCHES}'
          value: '^.*$'
          description: 'Used for network interface discovery. Can be overridden on the host or linked template level.'
        - macro: '{$NET.IF.IFNAME.NOT_MATCHES}'
          value: '(^Software Loopback Interface|^NULL[0-9.]*$|^[Ll]o[0-9.]*$|^[Ss]ystem$|^Nu[0-9.]*$|^veth[0-9a-z]+$|docker[0-9]+|br-[a-z0-9]{12})'
          description: 'Filters out `loopbacks`, `nulls`, docker `veth` links and `docker0 bridge` by default.'
        - macro: '{$NET.IF.IFOPERSTATUS.MATCHES}'
          value: '^.*$'
          description: 'Used for network interface discovery. Can be overridden on the host or linked template level.'
        - macro: '{$NET.IF.IFOPERSTATUS.NOT_MATCHES}'
          value: ^6$
          description: 'Ignore `notPresent(6)`'
        - macro: '{$NET.IF.IFTYPE.MATCHES}'
          value: ^(6|161)$
          description: 'Discover physical Ethernet ports `ethernetCsmacd(6)` and LAGs `ieee8023adLag(161)` only. SAOS 10 also lists logical ports `propVirtual(53)`, flow points / sub-ports `l2vlan(135)` and management interfaces in IF-MIB; widen this macro to monitor them.'
        - macro: '{$NET.IF.IFTYPE.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
          description: 'Used in network interface discovery rule filters.'
        - macro: '{$SNMP.TIMEOUT}'
          value: 5m
          description: 'Time interval for the SNMP availability trigger.'
        - macro: '{$VFS.FS.FSNAME.MATCHES}'
          value: '.*'
          description: 'Used in filesystem discovery rule filters.'
        - macro: '{$VFS.FS.FSNAME.NOT_MATCHES}'
          value: ^$
          description: 'Used in filesystem discovery rule filters.'
        - macro: '{$VFS.FS.PUSED.MAX.CRIT}'
          value: '90'
          description: 'Critical threshold of filesystem utilization in %. Can be used with the filesystem name as context, for example {$VFS.FS.PUSED.MAX.CRIT:"/mnt/log"}.'
        - macro: '{$VFS.FS.PUSED.MAX.WARN}'
          value: '80'
          description: 'Warning threshold of filesystem utilization in %. Can be used with the filesystem name as context.'
