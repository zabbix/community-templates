          value_type: CHAR
          trends: '0'
          description: |
            MIB: SNMPv2-MIB
            A textual description of the entity. On SAOS 10 the format is "Ciena Corporation, <model> SAOS Operating System, Version saos-<release>".
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
