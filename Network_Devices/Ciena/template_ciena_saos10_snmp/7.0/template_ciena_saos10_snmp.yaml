        - uuid: 0f50817cfde9468b8ff0e794457b08ed
          name: 'CPU utilization'
          type: CALCULATED
          key: system.cpu.util
          delay: 3m
          value_type: FLOAT
          units: '%'
          params: '100*(1-sum(//system.cpu.idle[ssCpuRawIdle.0],5m)/(sum(//system.cpu.user[ssCpuRawUser.0],5m)+sum(//system.cpu.nice[ssCpuRawNice.0],5m)+sum(//system.cpu.system[ssCpuRawSystem.0],5m)+sum(//system.cpu.idle[ssCpuRawIdle.0],5m)+sum(//system.cpu.iowait[ssCpuRawWait.0],5m)+sum(//system.cpu.interrupt[ssCpuRawInterrupt.0],5m)+sum(//system.cpu.softirq[ssCpuRawSoftIRQ.0],5m)+sum(//system.cpu.steal[ssCpuRawSteal.0],5m)))'
          description: 'CPU utilization expressed in %: the share of non-idle CPU ticks over the last 5 minutes, computed from the UCD-SNMP-MIB ssCpuRaw* counter rates. SAOS 10 updates the counters only about once a minute; a window without any counter change yields no value rather than a false 100 %.'
          tags:
            - tag: component
              value: cpu
          triggers:
            - uuid: 871d095dad5f4eb5895984d950f47d42
              expression: 'min(/Ciena SAOS 10 by SNMP/system.cpu.util,5m)>{$CIENA.CPU.UTIL.CRIT}'
              name: 'Ciena: High CPU utilization'
              event_name: 'Ciena: High CPU utilization (over {$CIENA.CPU.UTIL.CRIT}% for 5m)'
              opdata: 'Current utilization: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'The CPU utilization is too high. The system might be slow to respond.'
              tags:
                - tag: scope
                  value: capacity
                - tag: scope
                  value: performance
        - uuid: 29bd917afb7d474a83609ce85aec74c0
          name: 'SNMP walk CPU'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.2021.11.50.0,1.3.6.1.4.1.2021.11.51.0,1.3.6.1.4.1.2021.11.52.0,1.3.6.1.4.1.2021.11.53.0,1.3.6.1.4.1.2021.11.54.0,1.3.6.1.4.1.2021.11.56.0,1.3.6.1.4.1.2021.11.61.0,1.3.6.1.4.1.2021.11.64.0]'
          key: system.cpu.walk
          delay: 3m
          history: '0'
          value_type: TEXT
          trends: '0'
          description: |
            MIB: UCD-SNMP-MIB
            Used for the CPU items (ssCpuRaw* tick counters). HOST-RESOURCES-MIB hrProcessorTable is not implemented on SAOS 10, so UCD-SNMP-MIB is the only CPU source; the raw counters are used instead of the ssCpuUser/System/Idle percentages because some records show ssCpuIdle stuck at 0. SAOS 10 advances these counters only about once a minute, hence the 3-minute interval. If the counters are not implemented, the "check for not supported value" step discards the error: the item stays supported with no value.
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
              error_handler: DISCARD_VALUE
          tags:
            - tag: component
              value: raw
        - uuid: 0473d7559fda43958f2e9c6d0f545fcd
          name: 'System description'
