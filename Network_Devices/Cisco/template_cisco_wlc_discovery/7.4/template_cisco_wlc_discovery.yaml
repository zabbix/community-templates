          key: bsnAPName
          delay: 6h
          lifetime: 180d
          enabled_lifetime_type: DISABLE_NEVER
          item_prototypes:
            - uuid: bd7326167c9f498e9605690dcd6449b3
              name: '{#APNAME} AP ({#LOCATION}) Admin Status'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.9.9.513.1.1.1.1.38.{#SNMPINDEX}'
              key: 'bsnAPAdminStatus[{#SNNUMBER}]'
              delay: 15m
              history: 365d
              trends: '0'
              status: DISABLED
              discover: NO_DISCOVER
              valuemap:
                name: 'SNMP AP Admin Status'
              tags:
                - tag: Application
                  value: 'AP data'
            - uuid: f1c0f9d785fe480da1ed0652c4e96bad
