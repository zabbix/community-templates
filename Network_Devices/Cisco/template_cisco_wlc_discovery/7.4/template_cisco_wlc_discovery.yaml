zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 307f4f8025ce4f7697c70b2c8367cd3c
      name: 'Templates/Network devices'
  host_groups:
    - uuid: 743466d5ea774127affba3ddd8874df1
      name: APs
  templates:
    - uuid: a84bf731df5749b09e13e9244a05639f
      template: 'HW Cisco WLC Discovery'
      name: 'HW Cisco WLC Discovery'
      description: |
        Cisco Wireless LAN Controller (AireOS / Catalyst 9800 IOS-XE) monitoring via SNMP.
        - WLC health: CPU, memory, uptime, inventory, HA status, uplink interfaces
        - SSID and rogue AP/client statistics, SNMP traps
        - LLD of access points: every AP is created as a separate host (group "APs")
          linked to template 'HW Cisco WLC Discovery AP'
        
        Requirements: Zabbix 7.4+, SNMP enabled on WLC, global regexp "WLCs uplink interfaces".
        Source: https://github.com/DuprTECH
      groups:
        - name: 'Templates/Network devices'
      items:
        - uuid: 157edf0ca4c34e438606816383d71f5e
          name: 'WLC CPUs Usage'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.14179.1.1.5.1.0
          key: agentCurrentCPUUtilization
          delay: '60'
          history: 7d
          units: '%'
          tags:
            - tag: Application
              value: General
        - uuid: c35e8b4c0c894827944c7c441342f63b
          name: 'WLC Free RAM'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.14179.1.1.5.3.0
          key: agentFreeMemory
          delay: '60'
          history: 7d
          units: B
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '1024'
          tags:
            - tag: Application
              value: General
        - uuid: ccc3862ff87a46c590a57228be139eaf
          name: 'WLC Hostname'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.5.0
          key: agentInventoryHostname
          delay: 1h
          history: 1d
          value_type: TEXT
          inventory_link: NAME
          tags:
            - tag: Application
              value: General
        - uuid: f6fc5ba24ce04d98a62131a2fd5b244b
          name: 'WLC Machine Model'
          type: SNMP_AGENT
          snmp_oid: 'AIRESPACE-REF-MIB::airespace.1.1.1.3.0'
          key: agentInventoryMachineModel
          delay: '3600'
          history: 1d
          value_type: TEXT
          inventory_link: MODEL
          tags:
            - tag: Application
              value: General
        - uuid: e3fa56d787f44f089bbc54b6ab462faa
          name: 'WLC Max Number Of APs Supported'
          type: SNMP_AGENT
          snmp_oid: 'AIRESPACE-REF-MIB::airespace.1.1.1.18.0'
          key: agentInventoryMaxNumberOfAPsSupported
          delay: '3600'
          history: 1d
          value_type: TEXT
          tags:
            - tag: Application
              value: General
        - uuid: 3c7d510ee5424e1d896ec6656f96916f
          name: 'WLC Operating System'
          type: SNMP_AGENT
          snmp_oid: 'AIRESPACE-REF-MIB::airespace.1.1.1.10.0'
          key: agentInventoryOperatingSystem
          delay: '3600'
          history: 1d
          value_type: TEXT
          tags:
            - tag: Application
              value: General
        - uuid: 615a6bab82a44bf2961354612cf39a0c
          name: 'WLC Product Version'
          type: SNMP_AGENT
          snmp_oid: 'AIRESPACE-REF-MIB::airespace.1.1.1.14.0'
          key: agentInventoryProductVersion
          delay: '3600'
          history: 1d
          value_type: TEXT
          tags:
            - tag: Application
              value: General
        - uuid: 246f0c278e534508b937ef385bc60a41
          name: 'WLC Serial Number'
          type: SNMP_AGENT
          snmp_oid: 'AIRESPACE-REF-MIB::airespace.1.1.1.4.0'
          key: agentInventorySerialNumber
          delay: '3600'
          history: 1d
          value_type: TEXT
          tags:
            - tag: Application
              value: General
        - uuid: a7854aaea0c149eaa0727f46ddbcc33a
          name: 'WLC Total RAM'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.14179.1.1.5.2.0
          key: agentTotalMemory
          delay: '86400'
          history: 1d
          trends: 7d
          units: B
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '1024'
          tags:
            - tag: Application
              value: General
        - uuid: 77da31c438b74b10a1a454a7806a925e
          name: 'AP If No Of Users 2.4 GHz'
          type: CALCULATED
          key: ALL_AP_If_No_Of_Users_2_4
          params: 'sum(last_foreach(/*/bsnApIfNoOfUsers0?[group="APs"]))'
        - uuid: b5060a394e7a4e89a7dbed63875c1342
          name: 'AP If No Of Users 5 GHz'
          type: CALCULATED
          key: ALL_AP_If_No_Of_Users_5
          params: 'sum(last_foreach(/*/bsnApIfNoOfUsers1?[group="APs"]))'
        - uuid: ad8d358de0b54ba1b7f7736e59c2393a
          name: 'AP If No Of Users 6 GHz'
          type: CALCULATED
          key: ALL_AP_If_No_Of_Users_6
          params: 'sum(last_foreach(/*/bsnApIfNoOfUsers2?[group="APs"]))'
        - uuid: ad95d9533ef14de69cad8d33c0d1ae91
          name: 'Rogue AP Count'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#ROGUEAP},1.3.6.1.4.1.14179.2.1.7.1.1]'
          key: bsnRogueAPEntry
          delay: 15m
          history: 90d
          description: |
            AIRESPACE-WIRELESS-MIB::bsnRogueAPDot11MacAddress
            Count # of RogueAP
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var obj = JSON.parse(value);
                  // Return the number of rows in the array
                  return obj.length;
          tags:
            - tag: component
              value: network
        - uuid: 10091f17582f4684b43660f3a10af817
          name: 'Rogue Client Count'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#ROGUECLIENT},1.3.6.1.4.1.14179.2.1.14.1.1]'
          key: bsnRogueClientEntry
          delay: 15m
          history: 90d
          description: |
            AIRESPACE-WIRELESS-MIB::bsnRogueClientDot11MacAddress
            Count # of RogueClient
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var obj = JSON.parse(value);
                  // Return the number of rows in the array
                  return obj.length;
          tags:
            - tag: component
              value: network
        - uuid: e71e659c98594aeb8113f718238dd1cf
          name: 'WLC Current Number of AP'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.9.9.513.1.3.35.0
          key: cLApGlobalAPConnectCount
          history: 90d
          description: 'CISCO-LWAPP-AP-MIB::cLApGlobalAPConnectCount.0'
          tags:
            - tag: Application
              value: Inventory
        - uuid: 6455bdac367d4e61b2c26a55d96c8efe
          name: 'WLC Number of APs Supported'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.9.9.513.1.3.28.0
          key: cLApGlobalMaxApsSupported
          delay: 1h
          history: 90d
          description: 'CISCO-LWAPP-AP-MIB::cLApGlobalMaxApsSupported.0'
          tags:
            - tag: Application
              value: Inventory
        - uuid: 922d16102a874131a6b570554278a850
          name: 'HA Peer Hotstandby Status'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.9.9.843.1.3.4.0
          key: cLHaPeerHotStandbyEvent
          history: 90d
          description: 'CISCO-LWAPP-HA-MIB::cLHaPeerHotStandbyEvent'
          tags:
            - tag: component
              value: network
        - uuid: 5e7b4273b9274aa7b5250a2da8064a56
          name: 'ICMP loss'
          type: SIMPLE
          key: 'icmppingloss[,10,,24,]'
          history: 1w
          value_type: FLOAT
          units: '%'
          tags:
            - tag: Application
              value: Status
          triggers:
            - uuid: aec0710a45ca49459d682f0aa76f29b0
              expression: 'min(/HW Cisco WLC Discovery/icmppingloss[,10,,24,],5m)>{$ICMP_LOSS_WARN} and min(/HW Cisco WLC Discovery/icmppingloss[,10,,24,],5m)<100'
              name: 'High ICMP ping loss'
              priority: HIGH
              description: 'Last value: {ITEM.LASTVALUE1}.'
              dependencies:
                - name: 'HOST DOWN ! (Unavailable by ICMP ping)'
                  expression: 'max(/HW Cisco WLC Discovery/icmpping[,1,,24,],#3)=0'
        - uuid: 2a99fe42a1094b09a9bcd2d15d524e04
          name: 'ICMP response time'
          type: SIMPLE
          key: 'icmppingsec[,1,,24,]'
          history: 1w
          value_type: FLOAT
          units: s
          tags:
            - tag: Application
              value: Status
          triggers:
            - uuid: a920588d7e6e45b783ac9528512c4893
              expression: 'avg(/HW Cisco WLC Discovery/icmppingsec[,1,,24,],5m)>{$ICMP_RESPONSE_TIME_WARN}'
              name: 'High ICMP ping response time'
              priority: WARNING
              description: 'Last value: {ITEM.LASTVALUE1}.'
              dependencies:
                - name: 'High ICMP ping loss'
                  expression: 'min(/HW Cisco WLC Discovery/icmppingloss[,10,,24,],5m)>{$ICMP_LOSS_WARN} and min(/HW Cisco WLC Discovery/icmppingloss[,10,,24,],5m)<100'
                - name: 'HOST DOWN ! (Unavailable by ICMP ping)'
                  expression: 'max(/HW Cisco WLC Discovery/icmpping[,1,,24,],#3)=0'
        - uuid: 57eb55ce9e5347bf944f9bdbc2116f83
          name: 'ICMP ping'
          type: SIMPLE
          key: 'icmpping[,1,,24,]'
          history: 1w
          valuemap:
            name: 'Service state 1'
          tags:
            - tag: Application
              value: Status
          triggers:
            - uuid: 400dae7d833b48ccb4cd4fa920f8eebc
              expression: 'max(/HW Cisco WLC Discovery/icmpping[,1,,24,],#3)=0'
              name: 'HOST DOWN ! (Unavailable by ICMP ping)'
              priority: DISASTER
              description: |
                Last value: {ITEM.LASTVALUE1}.
                Last three attempts returned timeout.  Please check device connectivity.
        - uuid: 55251ed1c25d4d299ab77a3a4817cc0f
          name: 'SNMP Trap - Channel Changed'
          type: SNMP_TRAP
          key: 'snmptrap["SNMPv2-SMI::enterprises.14179.2.6.3.16"]'
          history: 2w
          value_type: LOG
          description: 'AIRESPACE-WIRELESS-MIB::bsnAPCurrentChannelChanged'
          tags:
            - tag: component
              value: network
        - uuid: ad85f53ed4e74b9fa9e6b0013543dd3e
          name: 'SNMP Trap - RadarChannelDetected'
          type: SNMP_TRAP
          key: 'snmptrap["SNMPv2-SMI::enterprises.14179.2.6.3.81"]'
          history: 90d
          value_type: LOG
          description: 'AIRESPACE-WIRELESS-MIB::bsnRadarChannelDetected'
          tags:
            - tag: component
              value: network
        - uuid: 6da4e999456c4435844d9f2a0938e435
          name: 'SNMP Trap - AP disassociation'
          type: SNMP_TRAP
          key: 'snmptrap[SNMPv2-SMI::enterprises.14179.2.6.3.8$|SNMPv2-SMI::enterprises.9.9.513.0.4$]'
          history: 2w
          value_type: LOG
          description: |
            AIRESPACE-WIRELESS-MIB::bsnAPDisassociated
            CISCO-LWAPP-AP-MIB::ciscoLwappApAssociated
          tags:
            - tag: component
              value: network
        - uuid: 1c0d74e8552944ac99ede24610f61d92
          name: 'WLC Uptime'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.3.0
          key: sysUpTimeInstance
          delay: '60'
          history: 1d
          value_type: FLOAT
          units: uptime
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: Application
              value: General
      discovery_rules:
        - uuid: ab9f14de0ddb4da584c61673bc3198da
          name: 'WLC AP data'
          type: SNMP_AGENT
