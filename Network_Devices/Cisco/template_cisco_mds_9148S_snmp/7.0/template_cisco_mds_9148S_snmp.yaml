        - uuid: 0c14f0deadd6407fa57318e4e3b4db9f
          name: 'Chassis description'
          type: DEPENDENT
          key: system.hw.descr
          delay: '0'
          value_type: CHAR
          trends: '0'
          description: |
            MIB: ENTITY-MIB
            entPhysicalDescr of the chassis.
          inventory_link: HARDWARE
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var rows = JSON.parse(value), K = '{' + '#SNMPINDEX}', best = null;
                  if (!Array.isArray(rows)) {
                      throw 'Expected a JSON array from SNMP_WALK_TO_JSON';
                  }
                  for (var i = 0; i < rows.length; i++) {
                      var c = String(rows[i].entclass === undefined ? '' : rows[i].entclass).match(/(\d+)\)?\s*$/);
                      if (c && c[1] === '3' && (best === null || parseInt(rows[i][K], 10) < parseInt(best[K], 10))) {
                          best = rows[i];
                      }
                  }
                  if (best === null) {
                      throw 'No chassis (entPhysicalClass = 3) in entPhysicalTable';
                  }
                  return String(best.entdescr === undefined ? '' : best.entdescr).replace(/^\s+|\s+$/g, '');
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: mds.entity.walk
          tags:
            - tag: component
              value: system
