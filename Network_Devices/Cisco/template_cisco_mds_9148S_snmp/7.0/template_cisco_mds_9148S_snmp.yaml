  triggers:
    - uuid: fe120d4bbfef45c2887c376dedbe71a9
      expression: 'last(/Cisco MDS 9148S by SNMP/mds.config.running.changed[ccmHistoryRunningLastChanged.0])>last(/Cisco MDS 9148S by SNMP/mds.config.running.saved[ccmHistoryRunningLastSaved.0]) and last(/Cisco MDS 9148S by SNMP/mds.config.running.saved[ccmHistoryRunningLastSaved.0])>0 and (last(/Cisco MDS 9148S by SNMP/system.net.uptime[sysUpTime.0])-last(/Cisco MDS 9148S by SNMP/mds.config.running.changed[ccmHistoryRunningLastChanged.0]))>{$MDS.CONFIG.UNSAVED.MAX}'
      name: 'Cisco MDS: Running configuration has not been saved'
      opdata: 'Changed at uptime {ITEM.LASTVALUE1}, saved at uptime {ITEM.LASTVALUE2}'
      priority: INFO
      description: |
        The running configuration was changed more than {$MDS.CONFIG.UNSAVED.MAX} ago and has not been saved
        since. The changes are lost at the next reload. Save with: copy running-config startup-config
        The trigger stays silent until the first save after a reload (ccmHistoryRunningLastSaved = 0).
      manual_close: 'YES'
      tags:
        - tag: scope
          value: notice
