            - uuid: c76be9d9e943476fbfda4cddaee288b5
              name: 'Interface {#IFNAME}({#IFALIAS}): Operational status'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}]'
              key: 'net.if.status[ifOperStatus.{#SNMPINDEX}]'
              trends: '0'
              description: |
                MIB: IF-MIB
                ifOperStatus: up(1), down(2), testing(3), unknown(4), dormant(5), notPresent(6), lowerLayerDown(7).
              valuemap:
                name: 'IF-MIB::ifOperStatus'
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
                - tag: vsan
                  value: '{#VSAN}'
          trigger_prototypes:
            - uuid: 1f027e5ffc9843c5825d0ef075669c65
              expression: |
                (avg(/Cisco MDS 9148S by SNMP/net.if.in[ifHCInOctets.{#SNMPINDEX}],15m)>({$IF.UTIL.MAX:"{#IFNAME}"}/100)*{$MDS.FC.RATE.RATIO}*last(/Cisco MDS 9148S by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}]) or
                avg(/Cisco MDS 9148S by SNMP/net.if.out[ifHCOutOctets.{#SNMPINDEX}],15m)>({$IF.UTIL.MAX:"{#IFNAME}"}/100)*{$MDS.FC.RATE.RATIO}*last(/Cisco MDS 9148S by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}])) and
                last(/Cisco MDS 9148S by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}])>0
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: |
                avg(/Cisco MDS 9148S by SNMP/net.if.in[ifHCInOctets.{#SNMPINDEX}],15m)<(({$IF.UTIL.MAX:"{#IFNAME}"}-3)/100)*{$MDS.FC.RATE.RATIO}*last(/Cisco MDS 9148S by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}]) and
                avg(/Cisco MDS 9148S by SNMP/net.if.out[ifHCOutOctets.{#SNMPINDEX}],15m)<(({$IF.UTIL.MAX:"{#IFNAME}"}-3)/100)*{$MDS.FC.RATE.RATIO}*last(/Cisco MDS 9148S by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}])
              name: 'Cisco MDS: Interface {#IFNAME}({#IFALIAS}): High bandwidth usage'
              event_name: 'Cisco MDS: Interface {#IFNAME}({#IFALIAS}): High bandwidth usage (>{$IF.UTIL.MAX:"{#IFNAME}"}%)'
              opdata: 'In: {ITEM.LASTVALUE1}, out: {ITEM.LASTVALUE3}, speed: {ITEM.LASTVALUE2}'
              priority: WARNING
              description: |
                The 15-minute average traffic is above {$IF.UTIL.MAX}% of the usable FC data rate: ifHighSpeed x
                {$MDS.FC.RATE.RATIO}. FC carries 100 MB/s of payload per nominal Gbit/s (16GFC = 1600 MB/s = 12.8 Gbit/s),
                so the nominal speed itself can never be reached.
              manual_close: 'YES'
              dependencies:
                - name: 'Cisco MDS: Interface {#IFNAME}({#IFALIAS}): Link down'
                  expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/Cisco MDS 9148S by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=2 and last(/Cisco MDS 9148S by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#1)<>last(/Cisco MDS 9148S by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#2) and last(/Cisco MDS 9148S by SNMP/mds.fcif.cause[fcIfOperStatusCause.{#SNMPINDEX}])<>12'
                  recovery_expression: 'last(/Cisco MDS 9148S by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2 or {$IFCONTROL:"{#IFNAME}"}=0'
              tags:
                - tag: scope
                  value: performance
            - uuid: 8ec38d50ba4d43488ab6e11f34b72269
              expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/Cisco MDS 9148S by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=2 and last(/Cisco MDS 9148S by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#1)<>last(/Cisco MDS 9148S by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#2) and last(/Cisco MDS 9148S by SNMP/mds.fcif.cause[fcIfOperStatusCause.{#SNMPINDEX}])<>12'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'last(/Cisco MDS 9148S by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2 or {$IFCONTROL:"{#IFNAME}"}=0'
              name: 'Cisco MDS: Interface {#IFNAME}({#IFALIAS}): Link down'
              opdata: 'Current state: {ITEM.LASTVALUE1}, cause: {ITEM.LASTVALUE4}'
              priority: AVERAGE
              description: |
                The FC port went down. Fires on the change to down(2) only, so ports that were never up raise nothing,
                and not when the port was shut down by an administrator (fcIfOperStatusCause = adminDown(12)).
                The cause is shown in the operational data. Silence one port with {$IFCONTROL:"<ifName>"}=0.
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
            - uuid: 7213f643d62a43428f967c645ff6fdc0
              expression: '(last(/Cisco MDS 9148S by SNMP/mds.fcif.link.failures[fcIfLinkFailures.{#SNMPINDEX}])+last(/Cisco MDS 9148S by SNMP/mds.fcif.sync.losses[fcIfSyncLosses.{#SNMPINDEX}])+last(/Cisco MDS 9148S by SNMP/mds.fcif.signal.losses[fcIfSigLosses.{#SNMPINDEX}]))>{$MDS.FC.LINK.LOSS.MAX:"{#IFNAME}"}'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: '(max(/Cisco MDS 9148S by SNMP/mds.fcif.link.failures[fcIfLinkFailures.{#SNMPINDEX}],15m)+max(/Cisco MDS 9148S by SNMP/mds.fcif.sync.losses[fcIfSyncLosses.{#SNMPINDEX}],15m)+max(/Cisco MDS 9148S by SNMP/mds.fcif.signal.losses[fcIfSigLosses.{#SNMPINDEX}],15m))<={$MDS.FC.LINK.LOSS.MAX:"{#IFNAME}"}'
              name: 'Cisco MDS: Interface {#IFNAME}({#IFALIAS}): Link instability'
              event_name: 'Cisco MDS: Interface {#IFNAME}({#IFALIAS}): Link instability (>{$MDS.FC.LINK.LOSS.MAX:"{#IFNAME}"} link events per poll)'
              opdata: 'Link failures: {ITEM.LASTVALUE1}, sync losses: {ITEM.LASTVALUE2}, signal losses: {ITEM.LASTVALUE3}'
              priority: WARNING
              description: |
                Link failures, losses of synchronization and losses of signal during the last poll exceed
                {$MDS.FC.LINK.LOSS.MAX}. The link is flapping: check the fibre, the transceivers and the attached device.
              manual_close: 'YES'
              dependencies:
                - name: 'Cisco MDS: Interface {#IFNAME}({#IFALIAS}): Link down'
                  expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/Cisco MDS 9148S by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=2 and last(/Cisco MDS 9148S by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#1)<>last(/Cisco MDS 9148S by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#2) and last(/Cisco MDS 9148S by SNMP/mds.fcif.cause[fcIfOperStatusCause.{#SNMPINDEX}])<>12'
                  recovery_expression: 'last(/Cisco MDS 9148S by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2 or {$IFCONTROL:"{#IFNAME}"}=0'
              tags:
                - tag: scope
                  value: availability
            - uuid: 1865fb193c55462e8d6b59d77a553526
              expression: 'change(/Cisco MDS 9148S by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}])<0 and last(/Cisco MDS 9148S by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}])>0 and last(/Cisco MDS 9148S by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: '(change(/Cisco MDS 9148S by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}])>0 and last(/Cisco MDS 9148S by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}],#2)>0) or last(/Cisco MDS 9148S by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=2'
              name: 'Cisco MDS: Interface {#IFNAME}({#IFALIAS}): Link speed has decreased'
              opdata: 'Current speed: {ITEM.LASTVALUE1}'
              priority: INFO
              description: |
                The port negotiated a lower speed than before. Check the transceiver, the cable and the speed configured
                on both ends.
              manual_close: 'YES'
              dependencies:
                - name: 'Cisco MDS: Interface {#IFNAME}({#IFALIAS}): Link down'
                  expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/Cisco MDS 9148S by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=2 and last(/Cisco MDS 9148S by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#1)<>last(/Cisco MDS 9148S by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#2) and last(/Cisco MDS 9148S by SNMP/mds.fcif.cause[fcIfOperStatusCause.{#SNMPINDEX}])<>12'
                  recovery_expression: 'last(/Cisco MDS 9148S by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2 or {$IFCONTROL:"{#IFNAME}"}=0'
              tags:
                - tag: scope
                  value: performance
          graph_prototypes:
            - uuid: 2dd206db71fc4eb0a694f3dad7bd294e
              name: 'Cisco MDS: Interface {#IFNAME}({#IFALIAS}): FC errors'
              ymin_type_1: FIXED
              graph_items:
                - drawtype: BOLD_LINE
                  color: F63100
                  item:
                    host: 'Cisco MDS 9148S by SNMP'
                    key: 'mds.fcif.crc[fcIfInvalidCrcs.{#SNMPINDEX}]'
                - sortorder: '1'
                  color: FFBF00
                  item:
                    host: 'Cisco MDS 9148S by SNMP'
                    key: 'mds.fcif.itw[fcIfInvalidTxWords.{#SNMPINDEX}]'
                - sortorder: '2'
                  color: 9C27B0
                  item:
                    host: 'Cisco MDS 9148S by SNMP'
                    key: 'mds.fcif.link.failures[fcIfLinkFailures.{#SNMPINDEX}]'
                - sortorder: '3'
                  color: 00BCD4
                  item:
                    host: 'Cisco MDS 9148S by SNMP'
                    key: 'mds.fcif.sync.losses[fcIfSyncLosses.{#SNMPINDEX}]'
                - sortorder: '4'
                  color: '795548'
                  item:
                    host: 'Cisco MDS 9148S by SNMP'
                    key: 'mds.fcif.signal.losses[fcIfSigLosses.{#SNMPINDEX}]'
            - uuid: 82436827f02147cd89e64df2867499e2
              name: 'Cisco MDS: Interface {#IFNAME}({#IFALIAS}): Network traffic'
              graph_items:
                - drawtype: GRADIENT_LINE
                  color: 1A7C11
                  item:
                    host: 'Cisco MDS 9148S by SNMP'
                    key: 'net.if.in[ifHCInOctets.{#SNMPINDEX}]'
                - sortorder: '1'
                  drawtype: BOLD_LINE
                  color: 2774A4
                  item:
                    host: 'Cisco MDS 9148S by SNMP'
                    key: 'net.if.out[ifHCOutOctets.{#SNMPINDEX}]'
            - uuid: 79721ae3242d482a8b086835d68ebd45
              name: 'Cisco MDS: Interface {#IFNAME}({#IFALIAS}): Slow drain indicators'
              ymin_type_1: FIXED
              graph_items:
                - drawtype: BOLD_LINE
                  color: F63100
                  item:
                    host: 'Cisco MDS 9148S by SNMP'
                    key: 'mds.fcif.txwait[fcIfTxWaitCount.{#SNMPINDEX}]'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  var rows = Array.isArray(data) ? data : data.data;
                  if (!Array.isArray(rows)) {
                      throw 'Expected an SNMP discovery array';
                  }
                  for (var i = 0; i < rows.length; i++) {
                      var row = rows[i];
                      row['{#IFALIAS}'] = row['{#IFALIAS}'] || '';
                      row['{#IFNAME}'] = row['{#IFNAME}'] || ('ifIndex ' + row['{#SNMPINDEX}']);
                      row['{#VSAN}'] = row['{#VSAN}'] || '';
                  }
                  return JSON.stringify(rows);
        - uuid: cebf1e4eabdf486ca613716afbc5e472
          name: 'License feature discovery'
          type: DEPENDENT
          key: mds.license.discovery
          delay: '0'
          enabled_lifetime_type: DISABLE_NEVER
          description: |
            MIB: CISCO-LICENSE-MGR-MIB
            One row per licensed feature of clmLicenseFeatureUsageTable (PORT_ACTIVATION_PKG,
            ENTERPRISE_PKG...). The feature name is decoded from the table index.
          item_prototypes:
            - uuid: 4df8f678413f42ceb1ea08fd4ae5bbcc
              name: 'License {#LICENSE.NAME}: Grace period left'
              type: DEPENDENT
              key: 'mds.license.grace.left["{#LICENSE.NAME}"]'
              delay: '0'
              units: s
              description: |
                MIB: CISCO-LICENSE-MGR-MIB
                clmLicenseGracePeriodLeft, only meaningful while the feature is in its grace period.
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var rows = JSON.parse(value), K = '{' + '#SNMPINDEX}', id = '{#LICENSE.INDEX}';
                      for (var i = 0; i < rows.length; i++) {
                          if (String(rows[i][K]) === id) {
                              var m = String(rows[i].grace === undefined ? '' : rows[i].grace).match(/(\d+)/);
                              return m ? m[1] : 0;
                          }
                      }
                      throw 'License feature not found in clmLicenseFeatureUsageTable';
              master_item:
                key: mds.license.walk
              tags:
                - tag: component
                  value: license
                - tag: license
                  value: '{#LICENSE.NAME}'
            - uuid: 0162bd3552df4a72b388c7f65ee72a81
              name: 'License {#LICENSE.NAME}: Grace period state'
              type: DEPENDENT
              key: 'mds.license.grace["{#LICENSE.NAME}"]'
              delay: '0'
              trends: '0'
              description: |
                MIB: CISCO-LICENSE-MGR-MIB
                1 when the inGracePeriod(4) bit of clmLicenseFlag is set.
              valuemap:
                name: 'Cisco MDS license grace period'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var rows = JSON.parse(value), K = '{' + '#SNMPINDEX}', id = '{#LICENSE.INDEX}';
                      for (var i = 0; i < rows.length; i++) {
                          if (String(rows[i][K]) !== id) {
                              continue;
                          }
                          var v = String(rows[i].flag === undefined ? '' : rows[i].flag).replace(/^"([\s\S]*)"$/, '$1'), b = 0;
                          if (/inGracePeriod/i.test(v)) {
                              return 1;
                          }
                          var hx = v.match(/^\s*([0-9A-Fa-f]{2})(?:[\s:]|$)/);
                          if (hx) {
                              b = parseInt(hx[1], 16);
                          }
                          else if (v.length > 0) {
                              b = v.charCodeAt(0) & 255;
                          }
                          return (b & 8) ? 1 : 0;
                      }
                      throw 'License feature not found in clmLicenseFeatureUsageTable';
              master_item:
                key: mds.license.walk
              tags:
                - tag: component
                  value: license
                - tag: license
                  value: '{#LICENSE.NAME}'
              trigger_prototypes:
                - uuid: 7745aa651aee4181a168529b8aa95d9d
                  expression: 'last(/Cisco MDS 9148S by SNMP/mds.license.grace["{#LICENSE.NAME}"])=1'
                  name: 'Cisco MDS: License {#LICENSE.NAME}: Feature is running in the license grace period'
                  opdata: 'State: {ITEM.LASTVALUE1}'
                  priority: AVERAGE
                  description: |
                    clmLicenseFlag has the inGracePeriod bit: the feature is enabled without an installed license. Check with:
                    show license usage
                  dependencies:
                    - name: 'Cisco MDS: License {#LICENSE.NAME}: Grace period expires soon'
                      expression: 'last(/Cisco MDS 9148S by SNMP/mds.license.grace["{#LICENSE.NAME}"])=1 and last(/Cisco MDS 9148S by SNMP/mds.license.grace.left["{#LICENSE.NAME}"])<{$MDS.LICENSE.GRACE.MIN}'
                  tags:
                    - tag: scope
                      value: availability
          trigger_prototypes:
            - uuid: a3efde3b207945f88b19c609e919c3ae
              expression: 'last(/Cisco MDS 9148S by SNMP/mds.license.grace["{#LICENSE.NAME}"])=1 and last(/Cisco MDS 9148S by SNMP/mds.license.grace.left["{#LICENSE.NAME}"])<{$MDS.LICENSE.GRACE.MIN}'
              name: 'Cisco MDS: License {#LICENSE.NAME}: Grace period expires soon'
              opdata: 'Grace period left: {ITEM.LASTVALUE2}'
              priority: HIGH
              description: |
                The feature runs without a license and its grace period ends in less than {$MDS.LICENSE.GRACE.MIN}.
                When it ends the feature is disabled. Install the license or disable the feature.
              tags:
                - tag: scope
                  value: availability
          master_item:
            key: mds.license.walk
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var rows = JSON.parse(value), K = '{' + '#SNMPINDEX}', out = [];
                  if (!Array.isArray(rows)) {
                      throw 'Expected a JSON array from SNMP_WALK_TO_JSON';
                  }
                  for (var i = 0; i < rows.length; i++) {
                      var idx = String(rows[i][K]), p = idx.split('.'), len = parseInt(p[0], 10), name = '';
                      if (isNaN(len) || p.length < len + 1) {
                          continue;
                      }
                      for (var j = 1; j <= len; j++) {
                          name += String.fromCharCode(parseInt(p[j], 10));
                      }
                      out.push({'{#LICENSE.NAME}': name, '{#LICENSE.INDEX}': idx});
                  }
                  return JSON.stringify(out);
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
