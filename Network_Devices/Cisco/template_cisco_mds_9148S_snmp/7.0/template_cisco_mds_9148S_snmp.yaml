          master_item:
            key: mds.entity.walk
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var K = '{' + '#SNMPINDEX}';
                  var SCALE = {1: -24, 2: -21, 3: -18, 4: -15, 5: -12, 6: -9, 7: -6, 8: -3, 9: 0, 10: 3, 11: 6, 12: 9, 13: 12, 14: 18, 15: 15, 16: 21, 17: 24};
                  function num(v) {
                      var m = String(v === undefined ? '' : v).match(/(-?\d+)\)?\s*$/);
                      return m ? parseInt(m[1], 10) : NaN;
                  }
                  function clean(v) {
                      return String(v === undefined ? '' : v).replace(/\s+/g, ' ').replace(/^\s+|\s+$/g, '');
                  }
                  function exponent(r) {
                      var s = num(r.sscale), p = num(r.sprec);
                      return (SCALE.hasOwnProperty(s) ? SCALE[s] : 0) - (isNaN(p) ? 0 : p);
                  }
                  function mult(e) {
                      return e >= 0 ? String(Math.pow(10, e)) : '0.' + new Array(-e).join('0') + '1';
                  }
                  function limits(list, e) {
                      var o = {hiWarn: null, hiCrit: null, loWarn: null, loCrit: null};
                      for (var j = 0; list && j < list.length; j++) {
                          var t = list[j];
                          if (isNaN(t.val) || isNaN(t.sev) || isNaN(t.rel)) {
                              continue;
                          }
                          var v = Math.round(t.val * Math.pow(10, e) * 1000000) / 1000000;
                          var crit = t.sev >= 20;
                          if (t.rel === 3 || t.rel === 4) {
                              if (crit) {
                                  o.hiCrit = (o.hiCrit === null || v < o.hiCrit) ? v : o.hiCrit;
                              }
                              else {
                                  o.hiWarn = (o.hiWarn === null || v < o.hiWarn) ? v : o.hiWarn;
                              }
                          }
                          else if (t.rel === 1 || t.rel === 2) {
                              if (crit) {
                                  o.loCrit = (o.loCrit === null || v > o.loCrit) ? v : o.loCrit;
                              }
                              else {
                                  o.loWarn = (o.loWarn === null || v > o.loWarn) ? v : o.loWarn;
                              }
                          }
                      }
                      return o;
                  }
                  function isXcvr(r) {
                      if (/transceiver/i.test(clean(r.entname))) {
                          return true;
                      }
                      var vt = String(r.entvtype || '');
                      if (/cevSensorTransceiver/i.test(vt)) {
                          return true;
                      }
                      var m = vt.match(/9\.12\.3\.1\.8\.(\d+)\s*$/);
                      if (m) {
                          var k = parseInt(m[1], 10);
                          return (k >= 46 && k <= 50) || (k >= 232 && k <= 257);
                      }
                      return false;
                  }
                  var rows = JSON.parse(value);
                  if (!Array.isArray(rows)) {
                      throw 'Expected a JSON array from SNMP_WALK_TO_JSON';
                  }
                  var sensors = {}, thr = {}, ifName = {}, ifAlias = {}, byName = {}, parent = {}, alias = {};
                  for (var i = 0; i < rows.length; i++) {
                      var r = rows[i], idx = String(r[K]);
                      if (r.tsev !== undefined || r.tval !== undefined) {
                          var s = idx.split('.')[0];
                          (thr[s] = thr[s] || []).push({sev: num(r.tsev), rel: num(r.trel), val: num(r.tval)});
                          continue;
                      }
                      if (r.entalias !== undefined) {
                          var a = String(r.entalias).match(/(\d+)\s*$/);
                          if (a) {
                              alias[idx.split('.')[0]] = a[1];
                          }
                      }
                      if (r.ifname !== undefined) {
                          ifName[idx] = clean(r.ifname);
                          ifAlias[idx] = clean(r.ifalias);
                          byName[ifName[idx].toLowerCase()] = idx;
                      }
                      if (r.entparent !== undefined) {
                          parent[idx] = String(num(r.entparent));
                      }
                      if (r.stype !== undefined) {
                          sensors[idx] = r;
                      }
                  }
                  function kindOf(r) {
                      var n = clean(r.entname).toLowerCase();
                      var lane = n.match(/lane\s*(\d+)/);
                      if (lane && lane[1] !== '1') {
                          return null;
                      }
                      if (/temperature/.test(n)) {
                          return 'TEMP';
                      }
                      if (/voltage/.test(n)) {
                          return 'VOLT';
                      }
                      if (/bias|current/.test(n)) {
                          return 'BIAS';
                      }
                      if (/transmit|tx ?pow|txpwr/.test(n)) {
                          return 'TX';
                      }
                      if (/receive|rx ?pow|rxpwr/.test(n)) {
                          return 'RX';
                      }
                      var m = String(r.entvtype || '').match(/9\.12\.3\.1\.8\.(\d+)\s*$/);
                      if (m) {
                          var k = parseInt(m[1], 10);
                          if (k === 46 || k === 236) {
                              return 'RX';
                          }
                          if (k === 47 || k === 232) {
                              return 'TX';
                          }
                          if (k === 48 || k === 242) {
                              return 'BIAS';
                          }
                          if (k === 49) {
                              return 'VOLT';
                          }
                          if (k === 50) {
                              return 'TEMP';
                          }
                      }
                      return null;
                  }
                  function portOf(id, r) {
                      var e = id;
                      for (var d = 0; d < 12 && e && e !== '0' && e !== 'NaN'; d++) {
                          if (alias.hasOwnProperty(e) && ifName.hasOwnProperty(alias[e])) {
                              return alias[e];
                          }
                          e = parent[e];
                      }
                      var m = clean(r.entname).match(/^(\S+)\s+(?:lane\s*\d+\s+)?transceiver/i);
                      if (m && byName.hasOwnProperty(m[1].toLowerCase())) {
                          return byName[m[1].toLowerCase()];
                      }
                      return null;
                  }
                  var KINDS = ['TEMP', 'VOLT', 'BIAS', 'TX', 'RX'];
                  var ports = {};
                  for (var id in sensors) {
                      var sr = sensors[id];
                      if (!isXcvr(sr)) {
                          continue;
                      }
                      var kind = kindOf(sr), port = kind ? portOf(id, sr) : null;
                      if (port === null) {
                          continue;
                      }
                      var e = exponent(sr) + (kind === 'BIAS' ? 3 : 0);
                      ports[port] = ports[port] || {};
                      if (!ports[port][kind]) {
                          ports[port][kind] = {idx: id, e: e, l: limits(thr[id], e - (kind === 'BIAS' ? 3 : 0))};
                          if (kind === 'BIAS') {
                              var lb = ports[port][kind].l;
                              for (var f in lb) {
                                  if (lb[f] !== null) {
                                      lb[f] = Math.round(lb[f] * 1000 * 1000000) / 1000000;
                                  }
                              }
                          }
                      }
                  }
                  var out = [];
                  for (var p in ports) {
                      var complete = true;
                      for (var k = 0; k < KINDS.length; k++) {
                          complete = complete && !!ports[p][KINDS[k]];
                      }
                      if (!complete) {
                          continue;
                      }
                      var row = {'{#IFINDEX}': p, '{#IFNAME}': ifName[p], '{#IFALIAS}': ifAlias[p] || ''};
                      for (k = 0; k < KINDS.length; k++) {
                          var x = ports[p][KINDS[k]], pre = '{#XCVR.' + KINDS[k] + '.';
                          row[pre + 'IDX}'] = x.idx;
                          row[pre + 'MULT}'] = mult(x.e);
                          row[pre + 'HI.CRIT}'] = String(x.l.hiCrit !== null ? x.l.hiCrit : 1000000000);
                          row[pre + 'HI.WARN}'] = String(x.l.hiWarn !== null ? x.l.hiWarn : 1000000000);
                          row[pre + 'LO.WARN}'] = String(x.l.loWarn !== null ? x.l.loWarn : -1000000000);
                          row[pre + 'LO.CRIT}'] = String(x.l.loCrit !== null ? x.l.loCrit : -1000000000);
                      }
                      out.push(row);
                  }
                  out.sort(function (x, y) { return x['{#IFNAME}'] < y['{#IFNAME}'] ? -1 : (x['{#IFNAME}'] > y['{#IFNAME}'] ? 1 : 0); });
                  return JSON.stringify(out);
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
        - uuid: a5344a50fd16463a808601f6edc6f0dd
          name: 'Power supply discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#PSU.STATUS},1.3.6.1.4.1.9.9.117.1.1.2.1.2,{#ENT.NAME},1.3.6.1.2.1.47.1.1.1.1.7,{#ENT.CLASS},1.3.6.1.2.1.47.1.1.1.1.5]'
          key: psu.discovery
          delay: 1h
          filter:
            evaltype: AND
            conditions:
              - macro: '{#ENT.CLASS}'
                value: ^6$
                formulaid: A
              - macro: '{#PSU.STATUS}'
                operator: EXISTS
                formulaid: B
          description: |
            MIB: CISCO-ENTITY-FRU-CONTROL-MIB, ENTITY-MIB
            Power supplies: rows of cefcFRUPowerStatusTable whose entPhysicalClass is
            powerSupply(6). The MDS 9148S has two hot-swappable power supplies (1+1).
          item_prototypes:
            - uuid: e1b8cd052e2443609c5ac178335c398a
              name: '{#ENT.NAME}: Power supply status'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.9.9.117.1.1.2.1.2.{#SNMPINDEX}]'
              key: 'sensor.psu.status[cefcFRUPowerOperStatus.{#SNMPINDEX}]'
              delay: 3m
              trends: '0'
              description: |
                MIB: CISCO-ENTITY-FRU-CONTROL-MIB
                cefcFRUPowerOperStatus: on(2) is normal.
              valuemap:
                name: 'CISCO-ENTITY-FRU-CONTROL-MIB::PowerOperType'
              tags:
                - tag: component
                  value: power-supply
                - tag: psu
                  value: '{#ENT.NAME}'
              trigger_prototypes:
                - uuid: 7a19dd1521f44b73b1c74ecc5a6d3761
                  expression: 'last(/Cisco MDS 9148S by SNMP/sensor.psu.status[cefcFRUPowerOperStatus.{#SNMPINDEX}])=9 or last(/Cisco MDS 9148S by SNMP/sensor.psu.status[cefcFRUPowerOperStatus.{#SNMPINDEX}])=12'
                  name: 'Cisco MDS: {#ENT.NAME}: Power supply is in warning state'
                  opdata: 'Current state: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: 'The power supply is on but its fan failed (onButFanFail(9)) or inline power failed (onButInlinePowerFail(12)).'
                  dependencies:
                    - name: 'Cisco MDS: {#ENT.NAME}: Power supply is not delivering power'
                      expression: 'last(/Cisco MDS 9148S by SNMP/sensor.psu.status[cefcFRUPowerOperStatus.{#SNMPINDEX}])<>2 and last(/Cisco MDS 9148S by SNMP/sensor.psu.status[cefcFRUPowerOperStatus.{#SNMPINDEX}])<>9 and last(/Cisco MDS 9148S by SNMP/sensor.psu.status[cefcFRUPowerOperStatus.{#SNMPINDEX}])<>12'
                  tags:
                    - tag: scope
                      value: availability
                - uuid: 6e107c5cd8ee423f85ad4b01ef415aba
                  expression: 'last(/Cisco MDS 9148S by SNMP/sensor.psu.status[cefcFRUPowerOperStatus.{#SNMPINDEX}])<>2 and last(/Cisco MDS 9148S by SNMP/sensor.psu.status[cefcFRUPowerOperStatus.{#SNMPINDEX}])<>9 and last(/Cisco MDS 9148S by SNMP/sensor.psu.status[cefcFRUPowerOperStatus.{#SNMPINDEX}])<>12'
                  name: 'Cisco MDS: {#ENT.NAME}: Power supply is not delivering power'
                  opdata: 'Current state: {ITEM.LASTVALUE1}'
                  priority: AVERAGE
                  description: |
                    cefcFRUPowerOperStatus is not on(2): the power supply is off (no input power, admin off, temperature,
                    fan) or has failed. The switch runs without power supply redundancy. Check with: show environment power
                  tags:
                    - tag: scope
                      value: availability
        - uuid: 1582efbf1fda40d6bf2d9ffff7af131e
          name: 'Temperature sensor discovery'
          type: DEPENDENT
          key: temperature.discovery
          delay: '0'
          enabled_lifetime_type: DISABLE_NEVER
          description: |
            MIB: CISCO-ENTITY-SENSOR-MIB, ENTITY-MIB
            Discovers the chassis temperature sensors (entSensorType = celsius(8)), transceiver sensors excluded.
            The warning/critical thresholds {#TEMP.WARN}/{#TEMP.CRIT} are the minor/major thresholds the switch reports
            in entSensorThresholdTable (show environment temperature); {$MDS.TEMP.WARN}/{$MDS.TEMP.CRIT} are used only
            when the sensor has none.
          item_prototypes:
            - uuid: 8475e1afcd044ffe9107b893e8fd50c0
              name: '{#SENSOR.NAME}: Sensor status'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.9.9.91.1.1.1.1.5.{#SNMPINDEX}]'
              key: 'sensor.temp.status[entSensorStatus.{#SNMPINDEX}]'
              delay: 5m
              trends: '0'
              description: |
                MIB: CISCO-ENTITY-SENSOR-MIB
                entSensorStatus: ok(1), unavailable(2), nonoperational(3).
              valuemap:
                name: 'CISCO-ENTITY-SENSOR-MIB::SensorStatus'
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              tags:
                - tag: component
                  value: temperature
                - tag: sensor
                  value: '{#SENSOR.NAME}'
              trigger_prototypes:
                - uuid: 03180e1614c2424bbe266015da20d6cb
                  expression: 'last(/Cisco MDS 9148S by SNMP/sensor.temp.status[entSensorStatus.{#SNMPINDEX}])=3'
                  name: 'Cisco MDS: {#SENSOR.NAME}: Temperature sensor is not operational'
                  opdata: 'Current state: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: 'entSensorStatus reports nonoperational(3): the sensor has failed and the temperature is no longer measured.'
                  tags:
                    - tag: scope
                      value: availability
            - uuid: c1b1e86b8c1e44c68282cf1ed6ed7294
              name: '{#SENSOR.NAME}: Temperature'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.9.9.91.1.1.1.1.4.{#SNMPINDEX}]'
              key: 'sensor.temp.value[entSensorValue.{#SNMPINDEX}]'
              delay: 3m
              value_type: FLOAT
              units: °C
              description: |
                MIB: CISCO-ENTITY-SENSOR-MIB
                entSensorValue scaled with entSensorScale/entSensorPrecision.
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '{#SENSOR.MULT}'
              tags:
                - tag: component
                  value: temperature
                - tag: sensor
                  value: '{#SENSOR.NAME}'
              trigger_prototypes:
                - uuid: 01cc1d39c8d04018a434554a6c5a4bcf
                  expression: 'avg(/Cisco MDS 9148S by SNMP/sensor.temp.value[entSensorValue.{#SNMPINDEX}],5m)>={#TEMP.CRIT}'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'max(/Cisco MDS 9148S by SNMP/sensor.temp.value[entSensorValue.{#SNMPINDEX}],5m)<{#TEMP.CRIT}-3'
                  name: 'Cisco MDS: {#SENSOR.NAME}: Temperature is above the critical threshold'
                  event_name: 'Cisco MDS: {#SENSOR.NAME}: Temperature is above the critical threshold (>={#TEMP.CRIT}°C)'
                  opdata: 'Current value: {ITEM.LASTVALUE1}'
                  priority: HIGH
                  description: |
                    The temperature is at or above the major threshold of the sensor ({#TEMP.SOURCE}). Check the fans, the airflow
                    direction and the room temperature: show environment temperature; show environment fan
                  tags:
                    - tag: scope
                      value: availability
                - uuid: 33b25ec420034d54b4df09cb7fe9a16f
                  expression: 'avg(/Cisco MDS 9148S by SNMP/sensor.temp.value[entSensorValue.{#SNMPINDEX}],5m)>={#TEMP.WARN}'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'max(/Cisco MDS 9148S by SNMP/sensor.temp.value[entSensorValue.{#SNMPINDEX}],5m)<{#TEMP.WARN}-3'
                  name: 'Cisco MDS: {#SENSOR.NAME}: Temperature is above the warning threshold'
                  event_name: 'Cisco MDS: {#SENSOR.NAME}: Temperature is above the warning threshold (>={#TEMP.WARN}°C)'
                  opdata: 'Current value: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: 'The temperature is at or above the minor threshold of the sensor ({#TEMP.SOURCE}).'
                  dependencies:
                    - name: 'Cisco MDS: {#SENSOR.NAME}: Temperature is above the critical threshold'
                      expression: 'avg(/Cisco MDS 9148S by SNMP/sensor.temp.value[entSensorValue.{#SNMPINDEX}],5m)>={#TEMP.CRIT}'
                      recovery_expression: 'max(/Cisco MDS 9148S by SNMP/sensor.temp.value[entSensorValue.{#SNMPINDEX}],5m)<{#TEMP.CRIT}-3'
                  tags:
                    - tag: scope
                      value: availability
                    - tag: scope
                      value: performance
          master_item:
            key: mds.entity.walk
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var K = '{' + '#SNMPINDEX}';
                  var SCALE = {1: -24, 2: -21, 3: -18, 4: -15, 5: -12, 6: -9, 7: -6, 8: -3, 9: 0, 10: 3, 11: 6, 12: 9, 13: 12, 14: 18, 15: 15, 16: 21, 17: 24};
                  function num(v) {
                      var m = String(v === undefined ? '' : v).match(/(-?\d+)\)?\s*$/);
                      return m ? parseInt(m[1], 10) : NaN;
                  }
                  function clean(v) {
                      return String(v === undefined ? '' : v).replace(/\s+/g, ' ').replace(/^\s+|\s+$/g, '');
                  }
                  function exponent(r) {
                      var s = num(r.sscale), p = num(r.sprec);
                      return (SCALE.hasOwnProperty(s) ? SCALE[s] : 0) - (isNaN(p) ? 0 : p);
                  }
                  function mult(e) {
                      return e >= 0 ? String(Math.pow(10, e)) : '0.' + new Array(-e).join('0') + '1';
                  }
                  function limits(list, e) {
                      var o = {hiWarn: null, hiCrit: null, loWarn: null, loCrit: null};
                      for (var j = 0; list && j < list.length; j++) {
                          var t = list[j];
                          if (isNaN(t.val) || isNaN(t.sev) || isNaN(t.rel)) {
                              continue;
                          }
                          var v = Math.round(t.val * Math.pow(10, e) * 1000000) / 1000000;
                          var crit = t.sev >= 20;
                          if (t.rel === 3 || t.rel === 4) {
                              if (crit) {
                                  o.hiCrit = (o.hiCrit === null || v < o.hiCrit) ? v : o.hiCrit;
                              }
                              else {
                                  o.hiWarn = (o.hiWarn === null || v < o.hiWarn) ? v : o.hiWarn;
                              }
                          }
                          else if (t.rel === 1 || t.rel === 2) {
                              if (crit) {
                                  o.loCrit = (o.loCrit === null || v > o.loCrit) ? v : o.loCrit;
                              }
                              else {
                                  o.loWarn = (o.loWarn === null || v > o.loWarn) ? v : o.loWarn;
                              }
                          }
                      }
                      return o;
                  }
                  function isXcvr(r) {
                      if (/transceiver/i.test(clean(r.entname))) {
                          return true;
                      }
                      var vt = String(r.entvtype || '');
                      if (/cevSensorTransceiver/i.test(vt)) {
                          return true;
                      }
                      var m = vt.match(/9\.12\.3\.1\.8\.(\d+)\s*$/);
                      if (m) {
                          var k = parseInt(m[1], 10);
                          return (k >= 46 && k <= 50) || (k >= 232 && k <= 257);
                      }
                      return false;
                  }
                  var rows = JSON.parse(value);
                  if (!Array.isArray(rows)) {
                      throw 'Expected a JSON array from SNMP_WALK_TO_JSON';
                  }
                  var sensors = {}, thr = {}, ifName = {}, ifAlias = {}, byName = {}, parent = {}, alias = {};
                  for (var i = 0; i < rows.length; i++) {
                      var r = rows[i], idx = String(r[K]);
                      if (r.tsev !== undefined || r.tval !== undefined) {
                          var s = idx.split('.')[0];
                          (thr[s] = thr[s] || []).push({sev: num(r.tsev), rel: num(r.trel), val: num(r.tval)});
                          continue;
                      }
                      if (r.entalias !== undefined) {
                          var a = String(r.entalias).match(/(\d+)\s*$/);
                          if (a) {
                              alias[idx.split('.')[0]] = a[1];
                          }
                      }
                      if (r.ifname !== undefined) {
                          ifName[idx] = clean(r.ifname);
                          ifAlias[idx] = clean(r.ifalias);
                          byName[ifName[idx].toLowerCase()] = idx;
                      }
                      if (r.entparent !== undefined) {
                          parent[idx] = String(num(r.entparent));
                      }
                      if (r.stype !== undefined) {
                          sensors[idx] = r;
                      }
                  }
                  var defWarn = parseFloat('{$MDS.TEMP.WARN}'), defCrit = parseFloat('{$MDS.TEMP.CRIT}');
                  var out = [];
                  for (var id in sensors) {
                      var sr = sensors[id];
                      if (num(sr.stype) !== 8 || isXcvr(sr)) {
                          continue;
                      }
                      var e = exponent(sr), l = limits(thr[id], e);
                      var src = (l.hiWarn !== null && l.hiCrit !== null) ? 'device' : ((l.hiWarn === null && l.hiCrit === null) ? 'macro' : 'device+macro');
                      var warn = l.hiWarn !== null ? l.hiWarn : (isNaN(defWarn) ? 1000000000 : defWarn);
                      var crit = l.hiCrit !== null ? l.hiCrit : (isNaN(defCrit) ? 1000000000 : defCrit);
                      if (warn > crit) {
                          warn = crit;
                      }
                      var row = {};
                      row[K] = id;
                      row['{#SENSOR.NAME}'] = clean(sr.entname) || ('Sensor ' + id);
                      row['{#SENSOR.MULT}'] = mult(e);
                      row['{#TEMP.WARN}'] = String(warn);
                      row['{#TEMP.CRIT}'] = String(crit);
                      row['{#TEMP.SOURCE}'] = src;
                      out.push(row);
                  }
                  out.sort(function (x, y) { return parseInt(x[K], 10) - parseInt(y[K], 10); });
                  return JSON.stringify(out);
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
