              expression: 'min(/Cisco MDS 9148S by SNMP/vm.memory.util[cseSysMemoryUtilization.0],5m)>{$MEMORY.UTIL.MAX}'
              name: 'Cisco MDS: High memory utilization'
              event_name: 'Cisco MDS: High memory utilization (>{$MEMORY.UTIL.MAX}% for 5m)'
              opdata: 'Current utilization: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: 'The memory utilization of the supervisor is too high. Check with: show system resources'
              tags:
                - tag: scope
                  value: capacity
                - tag: scope
                  value: performance
        - uuid: 3dd4f14889f34a26985400acf42dad6e
          name: 'SNMP agent availability'
          type: INTERNAL
          key: 'zabbix[host,snmp,available]'
          description: |
            Availability of SNMP checks on the host. The value of this item corresponds to availability icons in the host list.
            Possible values:
            0 - not available
            1 - available
            2 - unknown
          valuemap:
            name: zabbix.host.available
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: 9d042da3be764fadb38d62b7a866f12e
              expression: 'max(/Cisco MDS 9148S by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              name: 'Cisco MDS: No SNMP data collection'
              opdata: 'Current state: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: |
                SNMP is not available for polling. Check that the agent is enabled on the switch
                (show snmp), that the community or SNMPv3 user matches the host interface, and that
                mgmt0 is reachable from the Zabbix server or proxy on UDP 161.
              dependencies:
                - name: 'Cisco MDS: Unavailable by ICMP ping'
                  expression: 'max(/Cisco MDS 9148S by SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
      discovery_rules:
        - uuid: 2e992130e05948dbb8f82250755d2fa6
          name: 'Fan discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#FAN.STATUS},1.3.6.1.4.1.9.9.117.1.4.1.1.1,{#ENT.NAME},1.3.6.1.2.1.47.1.1.1.1.7]'
          key: fan.discovery
          delay: 1h
          filter:
            evaltype: AND
            conditions:
              - macro: '{#FAN.STATUS}'
                operator: EXISTS
                formulaid: A
          description: |
            MIB: CISCO-ENTITY-FRU-CONTROL-MIB, ENTITY-MIB
            Fan trays and power supply fans (cefcFanTrayStatusTable).
          item_prototypes:
            - uuid: fdb02f1329f245249f0c8ae50addc622
              name: '{#ENT.NAME}: Fan status'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.9.9.117.1.4.1.1.1.{#SNMPINDEX}]'
              key: 'sensor.fan.status[cefcFanTrayOperStatus.{#SNMPINDEX}]'
              delay: 3m
              trends: '0'
              description: |
                MIB: CISCO-ENTITY-FRU-CONTROL-MIB
                cefcFanTrayOperStatus: unknown(1), up(2), down(3), warning(4).
              valuemap:
                name: 'CISCO-ENTITY-FRU-CONTROL-MIB::cefcFanTrayOperStatus'
              tags:
                - tag: component
                  value: fan
                - tag: fan
                  value: '{#ENT.NAME}'
              trigger_prototypes:
                - uuid: 4d62b942e58344249fca2ce1874c090b
                  expression: 'last(/Cisco MDS 9148S by SNMP/sensor.fan.status[cefcFanTrayOperStatus.{#SNMPINDEX}])=3'
                  name: 'Cisco MDS: {#ENT.NAME}: Fan is down'
                  opdata: 'Current state: {ITEM.LASTVALUE1}'
                  priority: AVERAGE
                  description: 'cefcFanTrayOperStatus is down(3). Replace the fan module; the switch shuts down if it overheats.'
                  tags:
                    - tag: scope
                      value: availability
                - uuid: c68273d9be574298938c385aa70a3843
                  expression: 'last(/Cisco MDS 9148S by SNMP/sensor.fan.status[cefcFanTrayOperStatus.{#SNMPINDEX}])=4'
                  name: 'Cisco MDS: {#ENT.NAME}: Fan is in warning state'
                  opdata: 'Current state: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: 'cefcFanTrayOperStatus is warning(4): partial failure, replace the fan as soon as possible.'
                  dependencies:
                    - name: 'Cisco MDS: {#ENT.NAME}: Fan is down'
                      expression: 'last(/Cisco MDS 9148S by SNMP/sensor.fan.status[cefcFanTrayOperStatus.{#SNMPINDEX}])=3'
                  tags:
                    - tag: scope
                      value: availability
        - uuid: e70277f2388a4c869325e4a82b2ca26d
          name: 'FC interfaces discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#IFNAME},1.3.6.1.2.1.31.1.1.1.1,{#IFALIAS},1.3.6.1.2.1.31.1.1.1.18,{#IFADMINSTATUS},1.3.6.1.2.1.2.2.1.7,{#IFTYPE},1.3.6.1.2.1.2.2.1.3,{#VSAN},1.3.6.1.4.1.9.9.282.1.2.5.1.1]'
          key: mds.fcif.discovery
          delay: 1h
          filter:
            evaltype: AND
            conditions:
              - macro: '{#IFADMINSTATUS}'
                value: '{$MDS.FCIF.ADMINSTATUS.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: A
              - macro: '{#IFALIAS}'
                value: '{$MDS.FCIF.ALIAS.MATCHES}'
                formulaid: B
              - macro: '{#IFALIAS}'
                value: '{$MDS.FCIF.ALIAS.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: C
              - macro: '{#IFNAME}'
                value: '{$MDS.FCIF.NAME.MATCHES}'
                formulaid: D
              - macro: '{#IFNAME}'
                value: '{$MDS.FCIF.NAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: E
          description: |
            MIB: IF-MIB, CISCO-FC-FE-MIB, CISCO-VSAN-MIB
            Discovers the physical Fibre Channel ports (fc1/1 .. fc1/48) whose name matches {$MDS.FCIF.NAME.MATCHES}.
            Ports that are administratively down are skipped ({$MDS.FCIF.ADMINSTATUS.NOT_MATCHES}); an unlicensed
            or unused port is normally shut down. {#VSAN} is the port VSAN (vsanIfVsan).
          item_prototypes:
            - uuid: 588565f871274c809d2efb374a7f325a
              name: 'Interface {#IFNAME}({#IFALIAS}): Operational status cause'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.9.9.289.1.1.2.1.7.{#SNMPINDEX}]'
              key: 'mds.fcif.cause[fcIfOperStatusCause.{#SNMPINDEX}]'
              trends: '0'
              description: |
                MIB: CISCO-FC-FE-MIB
                fcIfOperStatusCause: why the port is down (none(2) while it is up), for example
                adminDown(12), fcotNotPresent(29), linkFailure(7), portActLicenseNotAvailable(135).
              valuemap:
                name: 'CISCO-FC-FE-MIB::FcIfOperStatusReason'
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
                - tag: vsan
                  value: '{#VSAN}'
            - uuid: 4cac472feb9f4a6daa84df5caaa60eed
              name: 'Interface {#IFNAME}({#IFALIAS}): CRC errors'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.9.9.289.1.2.1.1.6.{#SNMPINDEX}]'
              key: 'mds.fcif.crc[fcIfInvalidCrcs.{#SNMPINDEX}]'
              delay: 5m
              description: |
                MIB: CISCO-FC-FE-MIB
                fcIfInvalidCrcs: frames received with an invalid CRC.
                The value is the number of new events since the previous poll (5m).
              preprocessing:
                - type: SIMPLE_CHANGE
                  parameters:
                    - ''
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
                - tag: vsan
                  value: '{#VSAN}'
              trigger_prototypes:
                - uuid: 2e0fe0b3f10f420c825f5427285c7c7c
                  expression: 'last(/Cisco MDS 9148S by SNMP/mds.fcif.crc[fcIfInvalidCrcs.{#SNMPINDEX}])>{$MDS.FC.CRC.MAX:"{#IFNAME}"}'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'max(/Cisco MDS 9148S by SNMP/mds.fcif.crc[fcIfInvalidCrcs.{#SNMPINDEX}],15m)<={$MDS.FC.CRC.MAX:"{#IFNAME}"}'
                  name: 'Cisco MDS: Interface {#IFNAME}({#IFALIAS}): CRC errors'
                  event_name: 'Cisco MDS: Interface {#IFNAME}({#IFALIAS}): CRC errors (>{$MDS.FC.CRC.MAX:"{#IFNAME}"} per poll)'
                  opdata: 'Current value: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: |
                    The port receives frames with a bad CRC: a faulty cable, patch panel, transceiver or the transmitter of
                    the attached device. Check with: show interface <port> counters details; show interface <port> transceiver details
                  manual_close: 'YES'
                  dependencies:
                    - name: 'Cisco MDS: Interface {#IFNAME}({#IFALIAS}): Link down'
                      expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/Cisco MDS 9148S by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=2 and last(/Cisco MDS 9148S by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#1)<>last(/Cisco MDS 9148S by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#2) and last(/Cisco MDS 9148S by SNMP/mds.fcif.cause[fcIfOperStatusCause.{#SNMPINDEX}])<>12'
                      recovery_expression: 'last(/Cisco MDS 9148S by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2 or {$IFCONTROL:"{#IFNAME}"}=0'
                  tags:
                    - tag: scope
                      value: availability
                    - tag: scope
                      value: performance
            - uuid: 46b56b38f78041a5b33f8cdd1edae73c
              name: 'Interface {#IFNAME}({#IFALIAS}): Credit loss recoveries'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.9.9.289.1.2.1.1.37.{#SNMPINDEX}]'
              key: 'mds.fcif.credit.loss[fcIfCreditLoss.{#SNMPINDEX}]'
              delay: 5m
              description: |
                MIB: CISCO-FC-FE-MIB
                fcIfCreditLoss: link resets because the peer did not return credits (credit loss recovery).
                The value is the number of new events since the previous poll (5m).
              preprocessing:
                - type: SIMPLE_CHANGE
                  parameters:
                    - ''
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
                - tag: vsan
                  value: '{#VSAN}'
              trigger_prototypes:
                - uuid: 2d8bb664188a40b3b68961cb42930adf
                  expression: 'last(/Cisco MDS 9148S by SNMP/mds.fcif.credit.loss[fcIfCreditLoss.{#SNMPINDEX}])>{$MDS.FC.CREDIT.LOSS.MAX:"{#IFNAME}"}'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'max(/Cisco MDS 9148S by SNMP/mds.fcif.credit.loss[fcIfCreditLoss.{#SNMPINDEX}],15m)<={$MDS.FC.CREDIT.LOSS.MAX:"{#IFNAME}"}'
                  name: 'Cisco MDS: Interface {#IFNAME}({#IFALIAS}): Credit loss recovery'
                  event_name: 'Cisco MDS: Interface {#IFNAME}({#IFALIAS}): Credit loss recovery (>{$MDS.FC.CREDIT.LOSS.MAX:"{#IFNAME}"} per poll)'
                  opdata: 'Current value: {ITEM.LASTVALUE1}'
                  priority: AVERAGE
                  description: |
                    The port stayed at zero transmit credits (1 s on F ports, 1.5 s on E ports) and the switch reset the link
                    to recover the credits. This is the strongest slow drain indicator: the attached device does not return
                    R_RDY. Check with: show logging onboard credit-loss; show interface <port> counters details
                  manual_close: 'YES'
                  dependencies:
                    - name: 'Cisco MDS: Interface {#IFNAME}({#IFALIAS}): Link down'
                      expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/Cisco MDS 9148S by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=2 and last(/Cisco MDS 9148S by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#1)<>last(/Cisco MDS 9148S by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#2) and last(/Cisco MDS 9148S by SNMP/mds.fcif.cause[fcIfOperStatusCause.{#SNMPINDEX}])<>12'
                      recovery_expression: 'last(/Cisco MDS 9148S by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2 or {$IFCONTROL:"{#IFNAME}"}=0'
                  tags:
                    - tag: scope
                      value: availability
                    - tag: scope
                      value: performance
            - uuid: 51ec32dd3779444db16ac18b8d660984
              name: 'Interface {#IFNAME}({#IFALIAS}): Number of logged-in Nx_Ports'
              type: DEPENDENT
              key: 'mds.fcif.flogi.count[{#SNMPINDEX}]'
              delay: '0'
              description: |
                MIB: CISCO-FC-FE-MIB
                Rows of fcIfFLoginTable for this port: 1 for a plain F port, more with NPIV or an NPV switch.
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var rows = JSON.parse(value), K = '{' + '#SNMPINDEX}', pre = '{#SNMPINDEX}.', n = 0;
                      for (var i = 0; i < rows.length; i++) {
                          if (String(rows[i][K]).indexOf(pre) === 0) {
                              n++;
                          }
                      }
                      return n;
              master_item:
                key: mds.flogi.walk
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
                - tag: vsan
                  value: '{#VSAN}'
            - uuid: 07ed9dda135440218b45f4a00cfda2cf
              name: 'Interface {#IFNAME}({#IFALIAS}): Logged-in port WWNs'
              type: DEPENDENT
              key: 'mds.fcif.flogi.wwpn[{#SNMPINDEX}]'
              delay: '0'
              value_type: TEXT
              trends: '0'
              description: |
                MIB: CISCO-FC-FE-MIB
                fcIfNxPortName of the Nx_Ports logged in on this port (show flogi database interface <port>).
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var rows = JSON.parse(value), K = '{' + '#SNMPINDEX}', pre = '{#SNMPINDEX}.', out = [];
                      for (var i = 0; i < rows.length; i++) {
                          if (String(rows[i][K]).indexOf(pre) !== 0) {
                              continue;
                          }
                          var h = String(rows[i].wwpn || '').replace(/[^0-9A-Fa-f]/g, '').toLowerCase();
                          out.push(h.length === 16 ? h.match(/../g).join(':') : String(rows[i].wwpn || ''));
                      }
                      out.sort();
                      return out.join(', ');
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: mds.flogi.walk
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
                - tag: vsan
                  value: '{#VSAN}'
            - uuid: 3490dfdde2d64c94a0f08efbad39680d
              name: 'Interface {#IFNAME}({#IFALIAS}): Invalid transmission words'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.9.9.289.1.2.1.1.5.{#SNMPINDEX}]'
              key: 'mds.fcif.itw[fcIfInvalidTxWords.{#SNMPINDEX}]'
              delay: 5m
              description: |
                MIB: CISCO-FC-FE-MIB
                fcIfInvalidTxWords: invalid transmission words received.
                The value is the number of new events since the previous poll (5m).
              preprocessing:
                - type: SIMPLE_CHANGE
                  parameters:
                    - ''
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
                - tag: vsan
                  value: '{#VSAN}'
              trigger_prototypes:
                - uuid: 22632f98e7d0475083f0303afc285890
                  expression: 'last(/Cisco MDS 9148S by SNMP/mds.fcif.itw[fcIfInvalidTxWords.{#SNMPINDEX}])>{$MDS.FC.ITW.MAX:"{#IFNAME}"}'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'max(/Cisco MDS 9148S by SNMP/mds.fcif.itw[fcIfInvalidTxWords.{#SNMPINDEX}],15m)<={$MDS.FC.ITW.MAX:"{#IFNAME}"}'
                  name: 'Cisco MDS: Interface {#IFNAME}({#IFALIAS}): Invalid transmission words'
                  event_name: 'Cisco MDS: Interface {#IFNAME}({#IFALIAS}): Invalid transmission words (>{$MDS.FC.ITW.MAX:"{#IFNAME}"} per poll)'
                  opdata: 'Current value: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: |
                    The port receives invalid transmission words (bit errors below the frame level): usually a dirty or
                    damaged fibre or a failing transceiver. Invalid words also increment while a link comes up.
                  manual_close: 'YES'
                  dependencies:
                    - name: 'Cisco MDS: Interface {#IFNAME}({#IFALIAS}): Link down'
                      expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/Cisco MDS 9148S by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=2 and last(/Cisco MDS 9148S by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#1)<>last(/Cisco MDS 9148S by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#2) and last(/Cisco MDS 9148S by SNMP/mds.fcif.cause[fcIfOperStatusCause.{#SNMPINDEX}])<>12'
                      recovery_expression: 'last(/Cisco MDS 9148S by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2 or {$IFCONTROL:"{#IFNAME}"}=0'
                  tags:
                    - tag: scope
                      value: availability
                    - tag: scope
                      value: performance
            - uuid: 38d9a3b0dfad4e8d81ef2aa794ffe52d
              name: 'Interface {#IFNAME}({#IFALIAS}): Link failures'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.9.9.289.1.2.1.1.1.{#SNMPINDEX}]'
              key: 'mds.fcif.link.failures[fcIfLinkFailures.{#SNMPINDEX}]'
              delay: 5m
              description: |
                MIB: CISCO-FC-FE-MIB
                fcIfLinkFailures: link failures detected by the port.
                The value is the number of new events since the previous poll (5m).
              preprocessing:
                - type: SIMPLE_CHANGE
                  parameters:
                    - ''
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
                - tag: vsan
                  value: '{#VSAN}'
            - uuid: 35bad7f1bea34681b4ec12464b607ad9
              name: 'Interface {#IFNAME}({#IFALIAS}): Port mode'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.9.9.289.1.1.2.1.3.{#SNMPINDEX}]'
              key: 'mds.fcif.mode[fcIfOperMode.{#SNMPINDEX}]'
              delay: 5m
              trends: '0'
              description: |
                MIB: CISCO-FC-FE-MIB
                fcIfOperMode: operational port mode - fPort(2) to a host or array, ePort(4)/tePort(12)
                for an ISL, nPort/npPort for NPV, portOperDown(14) while down.
              valuemap:
                name: 'CISCO-ST-TC::FcPortTypes'
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
                - tag: vsan
                  value: '{#VSAN}'
            - uuid: c568524f2be448c9a595df35616260c4
              name: 'Interface {#IFNAME}({#IFALIAS}): Loss of signal'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.9.9.289.1.2.1.1.3.{#SNMPINDEX}]'
              key: 'mds.fcif.signal.losses[fcIfSigLosses.{#SNMPINDEX}]'
              delay: 5m
              description: |
                MIB: CISCO-FC-FE-MIB
                fcIfSigLosses: loss of signal failures detected by the port.
                The value is the number of new events since the previous poll (5m).
              preprocessing:
                - type: SIMPLE_CHANGE
                  parameters:
                    - ''
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
                - tag: vsan
                  value: '{#VSAN}'
            - uuid: edc05ced0471493ebddba4be9d03a667
              name: 'Interface {#IFNAME}({#IFALIAS}): Loss of sync'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.9.9.289.1.2.1.1.2.{#SNMPINDEX}]'
              key: 'mds.fcif.sync.losses[fcIfSyncLosses.{#SNMPINDEX}]'
              delay: 5m
              description: |
                MIB: CISCO-FC-FE-MIB
                fcIfSyncLosses: loss of synchronization failures detected by the port.
                The value is the number of new events since the previous poll (5m).
              preprocessing:
                - type: SIMPLE_CHANGE
                  parameters:
                    - ''
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
                - tag: vsan
                  value: '{#VSAN}'
            - uuid: d869fdf635ea49fdb5abe588eb1d93ed
              name: 'Interface {#IFNAME}({#IFALIAS}): Timeout discards'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.9.9.289.1.2.1.1.35.{#SNMPINDEX}]'
              key: 'mds.fcif.timeout.discards[fcIfTimeOutDiscards.{#SNMPINDEX}]'
              delay: 5m
              description: |
                MIB: CISCO-FC-FE-MIB
                fcIfTimeOutDiscards: frames dropped at the congestion-drop timeout or when the port went offline.
                The value is the number of new events since the previous poll (5m).
              preprocessing:
                - type: SIMPLE_CHANGE
                  parameters:
                    - ''
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
                - tag: vsan
                  value: '{#VSAN}'
              trigger_prototypes:
                - uuid: 51f1dcf74b0c4d14b7a9e82bde2f796e
                  expression: 'last(/Cisco MDS 9148S by SNMP/mds.fcif.timeout.discards[fcIfTimeOutDiscards.{#SNMPINDEX}])>{$MDS.FC.TIMEOUT.DISCARDS.MAX:"{#IFNAME}"}'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'max(/Cisco MDS 9148S by SNMP/mds.fcif.timeout.discards[fcIfTimeOutDiscards.{#SNMPINDEX}],15m)<={$MDS.FC.TIMEOUT.DISCARDS.MAX:"{#IFNAME}"}'
                  name: 'Cisco MDS: Interface {#IFNAME}({#IFALIAS}): Frames dropped by congestion-drop timeout'
                  event_name: 'Cisco MDS: Interface {#IFNAME}({#IFALIAS}): Frames dropped by congestion-drop timeout (>{$MDS.FC.TIMEOUT.DISCARDS.MAX:"{#IFNAME}"} per poll)'
                  opdata: 'Current value: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: |
                    Frames destined to this port waited longer than the congestion-drop timeout (500 ms by default) and were
                    discarded. Slow drain or congestion towards the attached device.
                  manual_close: 'YES'
                  dependencies:
                    - name: 'Cisco MDS: Interface {#IFNAME}({#IFALIAS}): Link down'
                      expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/Cisco MDS 9148S by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=2 and last(/Cisco MDS 9148S by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#1)<>last(/Cisco MDS 9148S by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#2) and last(/Cisco MDS 9148S by SNMP/mds.fcif.cause[fcIfOperStatusCause.{#SNMPINDEX}])<>12'
                      recovery_expression: 'last(/Cisco MDS 9148S by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2 or {$IFCONTROL:"{#IFNAME}"}=0'
                  tags:
                    - tag: scope
                      value: performance
            - uuid: ea31626439af462c87676584134657e0
              name: 'Interface {#IFNAME}({#IFALIAS}): TxWait'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.9.9.289.1.2.1.1.15.{#SNMPINDEX}]'
              key: 'mds.fcif.txwait[fcIfTxWaitCount.{#SNMPINDEX}]'
              delay: 5m
              value_type: FLOAT
              units: '%'
              description: |
                MIB: CISCO-FC-FE-MIB
                fcIfTxWaitCount increments every 2.5 microseconds the port has zero transmit credits and
                frames queued. Converted to the percentage of time spent waiting: per second rate x 2.5e-6 x 100.
                Supported on the MDS 9148S (16G switching ASIC).
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '0.00025'
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
                - tag: vsan
                  value: '{#VSAN}'
              trigger_prototypes:
                - uuid: 084506670d0c49698d7ccae683675cf0
                  expression: 'last(/Cisco MDS 9148S by SNMP/mds.fcif.txwait[fcIfTxWaitCount.{#SNMPINDEX}])>{$MDS.FC.TXWAIT.MAX:"{#IFNAME}"}'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'max(/Cisco MDS 9148S by SNMP/mds.fcif.txwait[fcIfTxWaitCount.{#SNMPINDEX}],15m)<={$MDS.FC.TXWAIT.MAX:"{#IFNAME}"}'
                  name: 'Cisco MDS: Interface {#IFNAME}({#IFALIAS}): High TxWait'
                  event_name: 'Cisco MDS: Interface {#IFNAME}({#IFALIAS}): High TxWait (>{$MDS.FC.TXWAIT.MAX:"{#IFNAME}"}% of time)'
                  opdata: 'TxWait: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: |
                    The port spent more than {$MDS.FC.TXWAIT.MAX}% of the last polling interval at zero transmit credits with
                    frames waiting to be sent. The attached device (F port) or the downstream fabric (E port) is slow to return
                    credits. Check with: show interface <port> txwait-history
                  manual_close: 'YES'
                  dependencies:
                    - name: 'Cisco MDS: Interface {#IFNAME}({#IFALIAS}): Link down'
                      expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/Cisco MDS 9148S by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=2 and last(/Cisco MDS 9148S by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#1)<>last(/Cisco MDS 9148S by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#2) and last(/Cisco MDS 9148S by SNMP/mds.fcif.cause[fcIfOperStatusCause.{#SNMPINDEX}])<>12'
                      recovery_expression: 'last(/Cisco MDS 9148S by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2 or {$IFCONTROL:"{#IFNAME}"}=0'
                  tags:
                    - tag: scope
                      value: performance
            - uuid: 4f600f63266b4789a8fb10c424623966
