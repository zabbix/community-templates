                    key: 'net.if.pc.out[ifHCOutOctets.{#SNMPINDEX}]'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  var rows = Array.isArray(data) ? data : data.data;
                  if (!Array.isArray(rows)) {
                      throw 'Expected an SNMP discovery array';
                  }
                  for (var i = 0; i < rows.length; i++) {
                      var row = rows[i];
                      row['{#IFALIAS}'] = row['{#IFALIAS}'] || '';
                      row['{#IFNAME}'] = row['{#IFNAME}'] || ('ifIndex ' + row['{#SNMPINDEX}']);
                      row['{#VSAN}'] = row['{#VSAN}'] || '';
                  }
                  return JSON.stringify(rows);
        - uuid: 5cb70f00ce7e48e9a0678f77b0e9288b
          name: 'Port license discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#PORTLIC.MAX},1.3.6.1.4.1.9.9.369.1.3.8.1.1]'
          key: mds.portlicense.discovery
          delay: 1h
          description: |
            MIB: CISCO-LICENSE-MGR-MIB
            clmPortLicCountTable, one row per port license type: portActivation(1),
            portActivation10G(2). The MDS 9148S activates ports in 12-port increments (on-demand port activation).
          item_prototypes:
            - uuid: 6d6372c1ba3b419ca4e64c32498ca8c6
              name: 'Port licenses (type {#SNMPINDEX}): Maximum'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.9.9.369.1.3.8.1.1.{#SNMPINDEX}]'
              key: 'mds.portlicense.max[clmPortLicCountMax.{#SNMPINDEX}]'
              delay: 1h
              description: |
                MIB: CISCO-LICENSE-MGR-MIB
                clmPortLicCountMax: port licenses that can be acquired.
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              tags:
                - tag: component
                  value: license
            - uuid: 46cd36f462654d93b8a68283eb62d34c
              name: 'Port licenses (type {#SNMPINDEX}): Used'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.9.9.369.1.3.8.1.2.{#SNMPINDEX}]'
              key: 'mds.portlicense.used[clmPortLicCountUsed.{#SNMPINDEX}]'
              delay: 15m
              description: |
                MIB: CISCO-LICENSE-MGR-MIB
                clmPortLicCountUsed: port licenses currently acquired.
              tags:
                - tag: component
                  value: license
          trigger_prototypes:
            - uuid: cbf062c520254d7b9b9d1e4ee45e6b52
              expression: 'last(/Cisco MDS 9148S by SNMP/mds.portlicense.used[clmPortLicCountUsed.{#SNMPINDEX}])>=last(/Cisco MDS 9148S by SNMP/mds.portlicense.max[clmPortLicCountMax.{#SNMPINDEX}]) and last(/Cisco MDS 9148S by SNMP/mds.portlicense.max[clmPortLicCountMax.{#SNMPINDEX}])>0'
              name: 'Cisco MDS: Port licenses (type {#SNMPINDEX}): All port licenses are in use'
              opdata: 'Used: {ITEM.LASTVALUE1} of {ITEM.LASTVALUE2}'
              priority: INFO
              description: |
                Every port activation license is acquired: a new port cannot come up (fcIfOperStatusCause
                portActLicenseNotAvailable). Check with: show port-license
              tags:
                - tag: scope
                  value: capacity
        - uuid: c79f9951d2c642f395e43c8396849555
          name: 'Power budget discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#PWR.MODE},1.3.6.1.4.1.9.9.117.1.1.1.1.1,{#ENT.NAME},1.3.6.1.2.1.47.1.1.1.1.7]'
          key: mds.power.discovery
          delay: 1h
          filter:
            evaltype: AND
            conditions:
              - macro: '{#PWR.MODE}'
                operator: EXISTS
                formulaid: A
          description: |
            MIB: CISCO-ENTITY-FRU-CONTROL-MIB
            Power supply group (cefcFRUPowerSupplyGroupTable): redundancy mode and power budget.
          item_prototypes:
            - uuid: d7873795693f4ab6a7d6c16b804b47f5
              name: '{#ENT.NAME}: Total available current'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.9.9.117.1.1.1.1.3.{#SNMPINDEX}]'
              key: 'mds.power.available[cefcTotalAvailableCurrent.{#SNMPINDEX}]'
              delay: 5m
              description: |
                MIB: CISCO-ENTITY-FRU-CONTROL-MIB
                cefcTotalAvailableCurrent, in the units given by cefcPowerUnits.
              tags:
                - tag: component
                  value: power-supply
            - uuid: 28cb9f018bc74d389040bcfb756fd20c
              name: '{#ENT.NAME}: Total drawn current'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.9.9.117.1.1.1.1.4.{#SNMPINDEX}]'
              key: 'mds.power.drawn[cefcTotalDrawnCurrent.{#SNMPINDEX}]'
              delay: 5m
              description: |
                MIB: CISCO-ENTITY-FRU-CONTROL-MIB
                cefcTotalDrawnCurrent: current drawn by the powered-on FRUs.
              tags:
                - tag: component
                  value: power-supply
            - uuid: e9e01f3b4b6e4f31b33591a2c1c8d930
              name: '{#ENT.NAME}: Power redundancy mode'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.9.9.117.1.1.1.1.1.{#SNMPINDEX}]'
              key: 'mds.power.mode[cefcPowerRedundancyMode.{#SNMPINDEX}]'
              delay: 1h
              trends: '0'
              description: |
                MIB: CISCO-ENTITY-FRU-CONTROL-MIB
                cefcPowerRedundancyMode: configured redundancy mode
                (power redundancy-mode redundant | combined).
              valuemap:
                name: 'CISCO-ENTITY-FRU-CONTROL-MIB::PowerRedundancyType'
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              tags:
                - tag: component
                  value: power-supply
            - uuid: cf2ea0689a3b4daaa581c2dbbf81d6b8
              name: '{#ENT.NAME}: Power units'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.9.9.117.1.1.1.1.2.{#SNMPINDEX}]'
              key: 'mds.power.units[cefcPowerUnits.{#SNMPINDEX}]'
              delay: 1h
              value_type: CHAR
              trends: '0'
              description: |
                MIB: CISCO-ENTITY-FRU-CONTROL-MIB
                cefcPowerUnits: the unit of the available/drawn current values.
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              tags:
                - tag: component
                  value: power-supply
            - uuid: f04f304111e24d438fd56deb6d5ce11e
              name: '{#ENT.NAME}: Power budget utilization'
              type: CALCULATED
              key: 'mds.power.util[{#SNMPINDEX}]'
              delay: 5m
              value_type: FLOAT
              units: '%'
              params: 'last(//mds.power.drawn[cefcTotalDrawnCurrent.{#SNMPINDEX}])/last(//mds.power.available[cefcTotalAvailableCurrent.{#SNMPINDEX}])*100'
              description: 'Drawn current as a percentage of the available current (independent of cefcPowerUnits).'
              tags:
                - tag: component
                  value: power-supply
        - uuid: 4c9c750d2be2482c9bfc19ccfc188673
          name: 'VSAN discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#VSAN.NAME},1.3.6.1.4.1.9.9.282.1.1.3.1.2,{#VSAN.ADMIN},1.3.6.1.4.1.9.9.282.1.1.3.1.4]'
          key: mds.vsan.discovery
          delay: 1h
          filter:
            evaltype: AND
            conditions:
              - macro: '{#SNMPINDEX}'
                value: '{$MDS.VSAN.ID.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: A
              - macro: '{#VSAN.ADMIN}'
                value: '{$MDS.VSAN.ADMIN.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
              - macro: '{#VSAN.NAME}'
                value: '{$MDS.VSAN.NAME.MATCHES}'
                formulaid: C
              - macro: '{#VSAN.NAME}'
                value: '{$MDS.VSAN.NAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: D
          description: |
            MIB: CISCO-VSAN-MIB, CISCO-ZS-MIB
            Discovers the VSANs ({#SNMPINDEX} is the VSAN id). The isolated VSAN 4094 and
            suspended VSANs are skipped by default.
          item_prototypes:
            - uuid: 2d42165796a24ab69ab56aeb759c7fe4
              name: 'VSAN {#SNMPINDEX} ({#VSAN.NAME}): Default zone policy'
              type: DEPENDENT
              key: 'mds.vsan.defzone[zoneDefaultZoneBehaviour.{#SNMPINDEX}]'
              delay: '0'
              trends: '0'
              description: |
                MIB: CISCO-ZS-MIB
                zoneDefaultZoneBehaviour: permit(1) or deny(2).
              valuemap:
                name: 'CISCO-ZS-MIB::zoneDefaultZoneBehaviour'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var rows = JSON.parse(value), K = '{' + '#SNMPINDEX}', id = '{#SNMPINDEX}';
                      for (var i = 0; i < rows.length; i++) {
                          if (String(rows[i][K]) === id && rows[i].defzone !== undefined) {
                              return String(rows[i].defzone).match(/(\d+)\)?\s*$/)[1];
                          }
                      }
                      throw 'VSAN not found in zoneDefaultZoneTable';
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: mds.zone.walk
              tags:
                - tag: component
                  value: vsan
                - tag: vsan
                  value: '{#SNMPINDEX}'
              trigger_prototypes:
                - uuid: 4edb061e31c04a3691973cf3ca31fc24
                  expression: '{$MDS.DEFZONE.CONTROL:"{#SNMPINDEX}"}=1 and last(/Cisco MDS 9148S by SNMP/mds.vsan.defzone[zoneDefaultZoneBehaviour.{#SNMPINDEX}])=1'
                  name: 'Cisco MDS: VSAN {#SNMPINDEX} ({#VSAN.NAME}): Default zone policy is permit'
                  opdata: 'Current policy: {ITEM.LASTVALUE1}'
                  priority: INFO
                  description: |
                    zoneDefaultZoneBehaviour is permit(1): devices that are not in any zone can see each other. Cisco recommends
                    deny (zone default-zone vsan <id>). Silence one VSAN with {$MDS.DEFZONE.CONTROL:"<vsan id>"}=0.
                  tags:
                    - tag: scope
                      value: security
            - uuid: 9623c11077ee43c8af0682922260fe40
              name: 'VSAN {#SNMPINDEX} ({#VSAN.NAME}): Operational state'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.9.9.282.1.1.3.1.8.{#SNMPINDEX}]'
              key: 'mds.vsan.status[vsanOperState.{#SNMPINDEX}]'
              delay: 3m
              trends: '0'
              description: |
                MIB: CISCO-VSAN-MIB
                vsanOperState: up(1) when at least one interface of the VSAN is up.
              valuemap:
                name: 'CISCO-VSAN-MIB::VsanOperationalState'
              tags:
                - tag: component
                  value: vsan
                - tag: vsan
                  value: '{#SNMPINDEX}'
              trigger_prototypes:
                - uuid: d23f21139f7c42d9a0a351628f7e281d
                  expression: '{$MDS.VSAN.CONTROL:"{#SNMPINDEX}"}=1 and last(/Cisco MDS 9148S by SNMP/mds.vsan.status[vsanOperState.{#SNMPINDEX}])=2 and last(/Cisco MDS 9148S by SNMP/mds.vsan.status[vsanOperState.{#SNMPINDEX}],#1)<>last(/Cisco MDS 9148S by SNMP/mds.vsan.status[vsanOperState.{#SNMPINDEX}],#2)'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'last(/Cisco MDS 9148S by SNMP/mds.vsan.status[vsanOperState.{#SNMPINDEX}])=1 or {$MDS.VSAN.CONTROL:"{#SNMPINDEX}"}=0'
                  name: 'Cisco MDS: VSAN {#SNMPINDEX} ({#VSAN.NAME}): VSAN is down'
                  opdata: 'Current state: {ITEM.LASTVALUE1}'
                  priority: AVERAGE
                  description: |
                    vsanOperState changed to down(2): no interface of the VSAN is up on this switch any more, so the hosts
                    and arrays of this VSAN lost this fabric. Fires on the change only. Silence one VSAN with
                    {$MDS.VSAN.CONTROL:"<vsan id>"}=0.
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: availability
            - uuid: f1d2f5b62e2f43ae82fb035faeb0d3e5
              name: 'VSAN {#SNMPINDEX} ({#VSAN.NAME}): Enforced zone database equals local'
              type: DEPENDENT
              key: 'mds.vsan.zonedb[zoneDbEnforcedEqualsLocal.{#SNMPINDEX}]'
              delay: '0'
              trends: '0'
              description: |
                MIB: CISCO-ZS-MIB
                zoneDbEnforcedEqualsLocal: true(1) when the active zone database matches the full one.
              valuemap:
                name: 'SNMPv2-TC::TruthValue'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var rows = JSON.parse(value), K = '{' + '#SNMPINDEX}', id = '{#SNMPINDEX}';
                      for (var i = 0; i < rows.length; i++) {
                          if (String(rows[i][K]) === id && rows[i].dbsync !== undefined) {
                              return String(rows[i].dbsync).match(/(\d+)\)?\s*$/)[1];
                          }
                      }
                      throw 'VSAN not found in zoneDbTable';
              master_item:
                key: mds.zone.walk
              tags:
                - tag: component
                  value: vsan
                - tag: vsan
                  value: '{#SNMPINDEX}'
              trigger_prototypes:
                - uuid: 85f0361ebae446a18d5e1aad1655027e
                  expression: 'min(/Cisco MDS 9148S by SNMP/mds.vsan.zonedb[zoneDbEnforcedEqualsLocal.{#SNMPINDEX}],{$MDS.ZONE.PENDING.MAX})=2'
                  name: 'Cisco MDS: VSAN {#SNMPINDEX} ({#VSAN.NAME}): Zoning changes are not activated'
                  opdata: 'Enforced equals local: {ITEM.LASTVALUE1}'
                  priority: INFO
                  description: |
                    zoneDbEnforcedEqualsLocal has been false for {$MDS.ZONE.PENDING.MAX}: the full zone database differs from the
                    active (enforced) one. Zones were edited but the zone set was not activated. Check with: show zone status vsan <id>
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: notice
            - uuid: e4c4d31c898948719a672254c4103267
              name: 'VSAN {#SNMPINDEX} ({#VSAN.NAME}): Active zone set'
              type: DEPENDENT
              key: 'mds.vsan.zoneset[zoneEnforcedZoneSetName.{#SNMPINDEX}]'
              delay: '0'
              value_type: CHAR
              trends: '0'
              description: |
                MIB: CISCO-ZS-MIB
                zoneEnforcedZoneSetName: the active zone set, empty when no zone set is active.
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var rows = JSON.parse(value), K = '{' + '#SNMPINDEX}', id = '{#SNMPINDEX}';
                      for (var i = 0; i < rows.length; i++) {
                          if (String(rows[i][K]) === id && rows[i].zoneset !== undefined) {
                              return String(rows[i].zoneset).replace(/^\s+|\s+$/g, '');
                          }
                      }
                      return '';
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 12h
              master_item:
                key: mds.zone.walk
              tags:
                - tag: component
                  value: vsan
                - tag: vsan
                  value: '{#SNMPINDEX}'
              trigger_prototypes:
                - uuid: 7e5ae5690a5048cf9c4c5d46cddb02ca
                  expression: 'last(/Cisco MDS 9148S by SNMP/mds.vsan.zoneset[zoneEnforcedZoneSetName.{#SNMPINDEX}],#1)<>last(/Cisco MDS 9148S by SNMP/mds.vsan.zoneset[zoneEnforcedZoneSetName.{#SNMPINDEX}],#2) and length(last(/Cisco MDS 9148S by SNMP/mds.vsan.zoneset[zoneEnforcedZoneSetName.{#SNMPINDEX}]))>0'
                  name: 'Cisco MDS: VSAN {#SNMPINDEX} ({#VSAN.NAME}): Active zone set has changed'
                  event_name: 'Cisco MDS: VSAN {#SNMPINDEX} ({#VSAN.NAME}): Active zone set has changed (new zone set: {ITEM.VALUE})'
                  priority: INFO
                  description: 'A different zone set was activated on the VSAN. Acknowledge to close the problem manually.'
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: notice
        - uuid: 1eb40c4b26f3489bb6dfb1c7877f7f52
          name: 'Transceiver DOM discovery'
          type: DEPENDENT
          key: mds.xcvr.discovery
          delay: '0'
          filter:
            evaltype: AND
            conditions:
              - macro: '{#IFNAME}'
                value: '{$MDS.FCIF.NAME.MATCHES}'
                formulaid: A
              - macro: '{#IFNAME}'
                value: '{$MDS.FCIF.NAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
          enabled_lifetime_type: DISABLE_NEVER
          description: |
            MIB: CISCO-ENTITY-SENSOR-MIB, ENTITY-MIB
            One row per FC port whose transceiver exposes the five digital diagnostics (DOM) sensors: temperature,
            supply voltage, bias current, Tx power and Rx power (entPhysicalVendorType cevSensorTransceiver*, or
            "Transceiver" in entPhysicalName). A sensor is mapped to its port through entPhysicalContainedIn and
            entAliasMappingTable, or by the port name at the start of entPhysicalName.
            The alarm and warning thresholds of each sensor are read from entSensorThresholdTable and scaled into
            {#XCVR.<SENSOR>.HI|LO.CRIT|WARN}; a missing threshold becomes +/-1000000000 so that it never fires.
            Returns nothing when the NX-OS release does not expose transceiver sensors over SNMP.
          item_prototypes:
            - uuid: 64f60f03747644b8b4fb9c28b47d376f
              name: 'Interface {#IFNAME}({#IFALIAS}): Transceiver bias current'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.9.9.91.1.1.1.1.4.{#XCVR.BIAS.IDX}]'
              key: 'mds.xcvr.bias[entSensorValue.{#XCVR.BIAS.IDX}]'
              delay: 5m
              value_type: FLOAT
              units: mA
              description: |
                MIB: CISCO-ENTITY-SENSOR-MIB
                entSensorValue of the transceiver sensor, scaled with entSensorScale and
                entSensorPrecision (mA).
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '{#XCVR.BIAS.MULT}'
              tags:
                - tag: component
                  value: transceiver
                - tag: interface
                  value: '{#IFNAME}'
              trigger_prototypes:
                - uuid: 82f934ece7234aab85c4292a28d9fcd7
                  expression: '{$MDS.XCVR.CONTROL:"{#IFNAME}"}=1 and (min(/Cisco MDS 9148S by SNMP/mds.xcvr.bias[entSensorValue.{#XCVR.BIAS.IDX}],15m)>={#XCVR.BIAS.HI.CRIT} or max(/Cisco MDS 9148S by SNMP/mds.xcvr.bias[entSensorValue.{#XCVR.BIAS.IDX}],15m)<={#XCVR.BIAS.LO.CRIT})'
                  name: 'Cisco MDS: Interface {#IFNAME}({#IFALIAS}): Transceiver bias current is out of the alarm range'
                  opdata: 'Current: {ITEM.LASTVALUE1}, alarm range: {#XCVR.BIAS.LO.CRIT} .. {#XCVR.BIAS.HI.CRIT} mA'
                  priority: AVERAGE
                  description: |
                    Transceiver bias current stayed outside the alarm thresholds of the transceiver for 15 minutes.
                    The thresholds are read from the transceiver (entSensorThresholdTable) at discovery time.
                    Check with: show interface <port> transceiver details. Silence one port with {$MDS.XCVR.CONTROL:"<ifName>"}=0.
                  tags:
                    - tag: scope
                      value: availability
                - uuid: 08b38b69cade4a70aa24408c7c98d923
                  expression: '{$MDS.XCVR.CONTROL:"{#IFNAME}"}=1 and (min(/Cisco MDS 9148S by SNMP/mds.xcvr.bias[entSensorValue.{#XCVR.BIAS.IDX}],15m)>={#XCVR.BIAS.HI.WARN} or max(/Cisco MDS 9148S by SNMP/mds.xcvr.bias[entSensorValue.{#XCVR.BIAS.IDX}],15m)<={#XCVR.BIAS.LO.WARN})'
                  name: 'Cisco MDS: Interface {#IFNAME}({#IFALIAS}): Transceiver bias current is out of the warning range'
                  opdata: 'Current: {ITEM.LASTVALUE1}, warning range: {#XCVR.BIAS.LO.WARN} .. {#XCVR.BIAS.HI.WARN} mA'
                  priority: WARNING
                  description: 'Transceiver bias current stayed outside the warning thresholds of the transceiver for 15 minutes.'
                  dependencies:
                    - name: 'Cisco MDS: Interface {#IFNAME}({#IFALIAS}): Transceiver bias current is out of the alarm range'
                      expression: '{$MDS.XCVR.CONTROL:"{#IFNAME}"}=1 and (min(/Cisco MDS 9148S by SNMP/mds.xcvr.bias[entSensorValue.{#XCVR.BIAS.IDX}],15m)>={#XCVR.BIAS.HI.CRIT} or max(/Cisco MDS 9148S by SNMP/mds.xcvr.bias[entSensorValue.{#XCVR.BIAS.IDX}],15m)<={#XCVR.BIAS.LO.CRIT})'
                  tags:
                    - tag: scope
                      value: availability
                    - tag: scope
                      value: performance
            - uuid: 55c8b830e0e5475fb14b145c76d621c4
              name: 'Interface {#IFNAME}({#IFALIAS}): Link status (transceiver)'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.2.2.1.8.{#IFINDEX}]'
              key: 'mds.xcvr.ifstatus[ifOperStatus.{#IFINDEX}]'
              delay: 3m
              trends: '0'
              description: |
                MIB: IF-MIB
                ifOperStatus of the port, polled in this rule so that the Tx/Rx power triggers only
                fire while the link is up (no light on a down port is not a transceiver problem).
              valuemap:
                name: 'IF-MIB::ifOperStatus'
              tags:
                - tag: component
                  value: transceiver
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 3e7748c784644a2aa0e8b23682edb935
              name: 'Interface {#IFNAME}({#IFALIAS}): Transceiver Rx power'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.9.9.91.1.1.1.1.4.{#XCVR.RX.IDX}]'
              key: 'mds.xcvr.rx[entSensorValue.{#XCVR.RX.IDX}]'
              delay: 5m
              value_type: FLOAT
              units: dBm
              description: |
                MIB: CISCO-ENTITY-SENSOR-MIB
                entSensorValue of the transceiver sensor, scaled with entSensorScale and
                entSensorPrecision (dBm).
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '{#XCVR.RX.MULT}'
              tags:
                - tag: component
                  value: transceiver
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 2b77920b798843178374b7e91bcd8079
              name: 'Interface {#IFNAME}({#IFALIAS}): Transceiver temperature'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.9.9.91.1.1.1.1.4.{#XCVR.TEMP.IDX}]'
              key: 'mds.xcvr.temp[entSensorValue.{#XCVR.TEMP.IDX}]'
              delay: 5m
              value_type: FLOAT
              units: °C
              description: |
                MIB: CISCO-ENTITY-SENSOR-MIB
                entSensorValue of the transceiver sensor, scaled with entSensorScale and
                entSensorPrecision (°C).
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '{#XCVR.TEMP.MULT}'
              tags:
                - tag: component
                  value: transceiver
                - tag: interface
                  value: '{#IFNAME}'
              trigger_prototypes:
                - uuid: f7d3cf28e8cc4300a51ad6a3db2ab9b8
