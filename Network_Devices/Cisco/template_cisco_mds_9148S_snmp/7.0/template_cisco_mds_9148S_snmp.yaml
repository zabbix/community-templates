zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 36bff6c29af64692839d077febfc7079
      name: 'Templates/Network devices'
  templates:
    - uuid: 759301ed32c44b15ae06b624a9e46a10
      template: 'Cisco MDS 9148S by SNMP'
      name: 'Cisco MDS 9148S by SNMP'
      description: |
        Cisco MDS 9148S 16G Multilayer Fabric Switch (48 x 16 Gbps FC, NX-OS 6.2 - 9.4) monitoring over SNMP for Zabbix 7.0.
        Built from the Cisco MIB files and the MDS 9000 MIB support list (github.com/cisco/cisco-mibs, supportlists/mds9000);
        the Fibre Channel counters are limited to the groups declared by the CISCO-FC-FE-CAPABILITY statement for NX-OS on
        MDS (which lists the m9148S).
        
        MIBs: SNMPv2-MIB, IF-MIB, ENTITY-MIB, CISCO-ENTITY-SENSOR-MIB, CISCO-ENTITY-FRU-CONTROL-MIB, CISCO-SYSTEM-EXT-MIB,
        CISCO-FC-FE-MIB, CISCO-VSAN-MIB, CISCO-ZS-MIB, CISCO-NS-MIB, CISCO-LICENSE-MGR-MIB, CISCO-CONFIG-MAN-MIB.
        Monitors availability, CPU and memory, temperature sensors, power supplies, fans, modules, the FC ports (traffic,
        link state and cause, FC error counters, slow drain: credit loss recovery, timeout discards, TxWait), transceiver
        digital diagnostics, port-channels, FLOGI and name server counts, VSANs and zoning, licenses and core files.
        
        Enable SNMP on the switch, for example:
          snmp-server community <community> group network-operator
          snmp-server user zabbix network-operator auth sha <password> priv aes-128 <password>
        SNMP version and credentials belong to the host interface. Poll with SNMPv2c or SNMPv3 (64-bit counters).
        The SNMP trap items need snmptrapd + Zabbix SNMP trapper and "snmp-server host <zabbix> traps version 2c <community>"
        plus the "snmp-server enable traps" families listed in the README.
        
        See README.md for the full list of items, triggers and macros.
      vendor:
        name: Community
        version: 7.0-1
      groups:
        - name: 'Templates/Network devices'
      items:
        - uuid: 4acae4e988934f5eacdc3fac0fb3317b
          name: 'ICMP ping'
          type: SIMPLE
          key: icmpping
          description: |
            The device accessibility by ICMP ping.
            
            0 - ICMP ping fails;
            1 - ICMP ping successful.
          valuemap:
            name: 'Service state'
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: 005225bce7fb460fa77f7faff4e32049
              expression: 'max(/Cisco MDS 9148S by SNMP/icmpping,#3)=0'
              name: 'Cisco MDS: Unavailable by ICMP ping'
              priority: HIGH
              description: 'Last three attempts returned timeout. Please check device connectivity.'
              tags:
                - tag: scope
                  value: availability
        - uuid: b4b5c697f6df48779bed09764d784499
          name: 'ICMP loss'
          type: SIMPLE
          key: icmppingloss
          value_type: FLOAT
          units: '%'
          description: 'The percentage of lost packets.'
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: 68795814557548409d7da1f7c77d5b4d
              expression: 'min(/Cisco MDS 9148S by SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/Cisco MDS 9148S by SNMP/icmppingloss,5m)<100'
              name: 'Cisco MDS: High ICMP ping loss'
              opdata: 'Loss: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'ICMP packets loss detected.'
              dependencies:
                - name: 'Cisco MDS: Unavailable by ICMP ping'
                  expression: 'max(/Cisco MDS 9148S by SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: b81dc5b056764d12816670cb45300b18
          name: 'ICMP response time'
          type: SIMPLE
          key: icmppingsec
          value_type: FLOAT
          units: s
          description: 'The ICMP ping response time (in seconds).'
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: 011a9875d237418ead3cfc389748364b
              expression: 'avg(/Cisco MDS 9148S by SNMP/icmppingsec,5m)>{$ICMP_RESPONSE_TIME_WARN}'
              name: 'Cisco MDS: High ICMP ping response time'
              opdata: 'Value: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'Average ICMP response time is too high.'
              dependencies:
                - name: 'Cisco MDS: High ICMP ping loss'
                  expression: 'min(/Cisco MDS 9148S by SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/Cisco MDS 9148S by SNMP/icmppingloss,5m)<100'
                - name: 'Cisco MDS: Unavailable by ICMP ping'
                  expression: 'max(/Cisco MDS 9148S by SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: 5fa0fe70cd934118843d9d492d6228d6
          name: 'Running configuration last changed'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.9.9.43.1.1.1.0]'
          key: 'mds.config.running.changed[ccmHistoryRunningLastChanged.0]'
          delay: 5m
          trends: '0'
          units: uptime
          description: |
            MIB: CISCO-CONFIG-MAN-MIB
            ccmHistoryRunningLastChanged: sysUpTime when the running configuration was last changed.
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: configuration
        - uuid: d02c1b5182a24a4cbe0bdfd3dfc65026
          name: 'Running configuration last saved'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.9.9.43.1.1.2.0]'
          key: 'mds.config.running.saved[ccmHistoryRunningLastSaved.0]'
          delay: 5m
          trends: '0'
          units: uptime
          description: |
            MIB: CISCO-CONFIG-MAN-MIB
            ccmHistoryRunningLastSaved: sysUpTime when the running configuration was last saved.
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: configuration
        - uuid: eeb99f062d794f85ba9a2d08cfab9ccf
          name: 'Number of core files'
          type: DEPENDENT
          key: mds.cores.count
          delay: '0'
          description: |
            MIB: CISCO-SYSTEM-EXT-MIB
            Rows of cseSwCoresTable (show cores).
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.length()
          master_item:
            key: mds.cores.walk
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: cb13874c71ba4e3d84028ad4208c97fb
              expression: 'last(/Cisco MDS 9148S by SNMP/mds.cores.count)>min(/Cisco MDS 9148S by SNMP/mds.cores.count,{$MDS.CORE.HOLD})'
              name: 'Cisco MDS: A process crashed and wrote a core file'
              opdata: 'Core files: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: |
                The number of core files in cseSwCoresTable has grown: a software process crashed on the switch.
                Collect the core with "show cores" and open a TAC case. The problem closes by itself
                {$MDS.CORE.HOLD} after the last new core, when the cores are cleared (clear cores), or manually.
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
        - uuid: e8ac4b0ac6f045ce98c475b71525f76e
          name: 'Crashed processes'
          type: DEPENDENT
          key: mds.cores.list
          delay: '0'
          value_type: TEXT
          trends: '0'
          description: |
            MIB: CISCO-SYSTEM-EXT-MIB
            Process names decoded from the cseSwCoresTable index, with the module entPhysicalIndex.
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var rows = JSON.parse(value), K = '{' + '#SNMPINDEX}', seen = {}, out = [];
                  for (var i = 0; i < rows.length; i++) {
                      var p = String(rows[i][K]).split('.'), len = parseInt(p[1], 10), name = '';
                      if (isNaN(len)) {
                          continue;
                      }
                      for (var j = 2; j < 2 + len && j < p.length; j++) {
                          name += String.fromCharCode(parseInt(p[j], 10));
                      }
                      var label = name + ' (module ' + p[0] + ')';
                      if (!seen[label]) {
                          seen[label] = 1;
                          out.push(label);
                      }
                  }
                  out.sort();
                  return out.length ? out.join(', ') : 'none';
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: mds.cores.walk
          tags:
            - tag: component
              value: system
        - uuid: fd55ecd74bd54fce896bcbad810efb6d
          name: 'Core files walk'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.9.9.305.1.4.2.1.4]'
          key: mds.cores.walk
          delay: 15m
          history: '0'
          value_type: TEXT
          trends: '0'
          description: |
            MIB: CISCO-SYSTEM-EXT-MIB
            Master item: cseSwCoresTable (index module.procname.instance), one row per core file.
          preprocessing:
            - type: SNMP_WALK_TO_JSON
              parameters:
                - pid
                - 1.3.6.1.4.1.9.9.305.1.4.2.1.4
                - '0'
              error_handler: CUSTOM_VALUE
              error_handler_params: '[]'
          tags:
            - tag: component
              value: raw
        - uuid: dca486cb1e4440dda6814107aa9e7060
          name: 'ENTITY-MIB and sensor tables walk'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.2.1.47.1.1.1.1.5,1.3.6.1.2.1.47.1.1.1.1.7,1.3.6.1.2.1.47.1.1.1.1.2,1.3.6.1.2.1.47.1.1.1.1.3,1.3.6.1.2.1.47.1.1.1.1.4,1.3.6.1.2.1.47.1.1.1.1.11,1.3.6.1.2.1.47.1.1.1.1.13,1.3.6.1.2.1.47.1.3.2.1.2,1.3.6.1.4.1.9.9.91.1.1.1.1.1,1.3.6.1.4.1.9.9.91.1.1.1.1.2,1.3.6.1.4.1.9.9.91.1.1.1.1.3,1.3.6.1.4.1.9.9.91.1.2.1.1.2,1.3.6.1.4.1.9.9.91.1.2.1.1.3,1.3.6.1.4.1.9.9.91.1.2.1.1.4,1.3.6.1.2.1.31.1.1.1.1,1.3.6.1.2.1.31.1.1.1.18]'
          key: mds.entity.walk
          delay: 1h
          history: '0'
          value_type: TEXT
          trends: '0'
          description: |
            MIB: ENTITY-MIB, CISCO-ENTITY-SENSOR-MIB, IF-MIB
            Master item, collected once an hour: entPhysicalTable (class, name, description, vendor type,
            containment, serial number, model), entAliasMappingTable, entSensorValueTable (type, scale,
            precision), entSensorThresholdTable (severity, relation, value) and ifName/ifAlias, converted to JSON.
            Used by the chassis inventory items and by the temperature and transceiver discovery rules.
            If this walk times out, raise "Max repetition count" of the SNMP interface (for example to 50).
          preprocessing:
            - type: SNMP_WALK_TO_JSON
              parameters:
                - entclass
                - 1.3.6.1.2.1.47.1.1.1.1.5
                - '0'
                - entname
                - 1.3.6.1.2.1.47.1.1.1.1.7
                - '1'
                - entdescr
                - 1.3.6.1.2.1.47.1.1.1.1.2
                - '1'
                - entvtype
                - 1.3.6.1.2.1.47.1.1.1.1.3
                - '0'
                - entparent
                - 1.3.6.1.2.1.47.1.1.1.1.4
                - '0'
                - entserial
                - 1.3.6.1.2.1.47.1.1.1.1.11
                - '1'
                - entmodel
                - 1.3.6.1.2.1.47.1.1.1.1.13
                - '1'
                - entalias
                - 1.3.6.1.2.1.47.1.3.2.1.2
                - '0'
                - stype
                - 1.3.6.1.4.1.9.9.91.1.1.1.1.1
                - '0'
                - sscale
                - 1.3.6.1.4.1.9.9.91.1.1.1.1.2
                - '0'
                - sprec
                - 1.3.6.1.4.1.9.9.91.1.1.1.1.3
                - '0'
                - tsev
                - 1.3.6.1.4.1.9.9.91.1.2.1.1.2
                - '0'
                - trel
                - 1.3.6.1.4.1.9.9.91.1.2.1.1.3
                - '0'
                - tval
                - 1.3.6.1.4.1.9.9.91.1.2.1.1.4
                - '0'
                - ifname
                - 1.3.6.1.2.1.31.1.1.1.1
                - '1'
                - ifalias
                - 1.3.6.1.2.1.31.1.1.1.18
                - '1'
          tags:
            - tag: component
              value: raw
        - uuid: e726ebdaf20c4bc586b652084196f8fe
          name: 'Number of FLOGI sessions'
          type: DEPENDENT
          key: mds.flogi.count
          delay: '0'
          description: |
            MIB: CISCO-FC-FE-MIB
            Number of Nx_Ports logged in to the fabric through this switch (rows of fcIfFLoginTable).
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.length()
          master_item:
            key: mds.flogi.walk
          tags:
            - tag: component
              value: fabric
        - uuid: 6137317a4101407b9102f5aaaed6af56
          name: 'FLOGI table walk'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.9.9.289.1.1.5.1.3]'
          key: mds.flogi.walk
          delay: 5m
          history: '0'
          value_type: TEXT
          trends: '0'
          description: |
            MIB: CISCO-FC-FE-MIB
            Master item: walks fcIfNxPortName of fcIfFLoginTable (index ifIndex.vsanIndex.fcIfNxLoginIndex),
            one row per Nx_Port logged in to this switch (show flogi database).
          preprocessing:
            - type: SNMP_WALK_TO_JSON
              parameters:
                - wwpn
                - 1.3.6.1.4.1.9.9.289.1.1.5.1.3
                - '2'
              error_handler: CUSTOM_VALUE
              error_handler_params: '[]'
          tags:
            - tag: component
              value: raw
        - uuid: 931a8fa04edc44bb84e225764b7411f2
          name: 'License feature usage walk'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.9.9.369.1.3.4.1.2,1.3.6.1.4.1.9.9.369.1.3.4.1.9]'
          key: mds.license.walk
          delay: 1h
          history: '0'
          value_type: TEXT
          trends: '0'
          description: |
            MIB: CISCO-LICENSE-MGR-MIB
            Master item: clmLicenseFeatureUsageTable, license flags and grace period left per feature
            (show license usage). The table is indexed by the feature name.
          preprocessing:
            - type: SNMP_WALK_TO_JSON
              parameters:
                - flag
                - 1.3.6.1.4.1.9.9.369.1.3.4.1.2
                - '0'
                - grace
                - 1.3.6.1.4.1.9.9.369.1.3.4.1.9
                - '0'
              error_handler: CUSTOM_VALUE
              error_handler_params: '[]'
          tags:
            - tag: component
              value: raw
        - uuid: dfb3511ec1e24d568b9d46005d91b083
          name: 'Name server: registered Nx_Ports'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.9.9.293.1.1.3.0]'
          key: 'mds.ns.entries[fcNameServerNumRows.0]'
          delay: 5m
          description: |
            MIB: CISCO-NS-MIB
            fcNameServerNumRows: Nx_Ports currently registered with the name server, fabric wide
            (all switches of the fabric, all VSANs).
          tags:
            - tag: component
              value: fabric
        - uuid: 8c8c949af161439c89fe4d8bca4e5687
          name: 'Number of VSANs'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.9.9.282.1.1.1.0]'
          key: 'mds.vsan.num[vsanNumber.0]'
          delay: 1h
          description: |
            MIB: CISCO-VSAN-MIB
            vsanNumber: number of VSANs configured on the switch, including VSAN 1 and 4094.
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: vsan
        - uuid: 0cbda5b41c384b33ae9f8a0a5c495cba
          name: 'Zone server walk'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.9.9.294.1.1.13.1.1,1.3.6.1.4.1.9.9.294.1.1.1.1.1,1.3.6.1.4.1.9.9.294.1.1.30.1.2]'
          key: mds.zone.walk
          delay: 15m
          history: '0'
          value_type: TEXT
          trends: '0'
          description: |
            MIB: CISCO-ZS-MIB
            Master item: per VSAN active zone set name (zoneEnforcedZoneSetName), default zone
            policy (zoneDefaultZoneBehaviour) and zoneDbEnforcedEqualsLocal, all indexed by vsanIndex.
          preprocessing:
            - type: SNMP_WALK_TO_JSON
              parameters:
                - zoneset
                - 1.3.6.1.4.1.9.9.294.1.1.13.1.1
                - '1'
                - defzone
                - 1.3.6.1.4.1.9.9.294.1.1.1.1.1
                - '0'
                - dbsync
                - 1.3.6.1.4.1.9.9.294.1.1.30.1.2
                - '0'
              error_handler: CUSTOM_VALUE
              error_handler_params: '[]'
          tags:
            - tag: component
              value: raw
        - uuid: 0696cb80927b4f49b54e9497e65cd70a
          name: 'SNMP traps (fallback)'
          type: SNMP_TRAP
          key: snmptrap.fallback
          delay: '0'
          value_type: LOG
          trends: '0'
          description: 'The item is used to collect all SNMP traps unmatched by other snmptrap items.'
          logtimefmt: 'hh:mm:sszyyyy/MM/dd'
          tags:
            - tag: component
              value: traps
        - uuid: ac03efe0313648f2a367fbc81ec31558
          name: 'Hardware FRU event (trap)'
          type: SNMP_TRAP
          key: 'snmptrap["(cefcModuleStatusChange|cefcPowerStatusChange|cefcFRUInserted|cefcFRURemoved|cefcUnrecognizedFRU|cefcFanTrayStatusChange|cefcPowerSupplyOutputChange|1[.]3[.]6[.]1[.]4[.]1[.]9[.]9[.]117[.]2[.]0[.](1|2|3|4|5|6|7))([^0-9A-Za-z]|$)"]'
          delay: '0'
          value_type: LOG
          trends: '0'
          description: |
            MIB: CISCO-ENTITY-FRU-CONTROL-MIB
            Module, power supply and fan status changes, FRU inserted/removed, unrecognized FRU.
          logtimefmt: 'hh:mm:sszyyyy/MM/dd'
          tags:
            - tag: component
              value: hardware
          triggers:
            - uuid: 91451f819365436285e07114c4ae9dbf
              expression: 'nodata(/Cisco MDS 9148S by SNMP/snmptrap["(cefcModuleStatusChange|cefcPowerStatusChange|cefcFRUInserted|cefcFRURemoved|cefcUnrecognizedFRU|cefcFanTrayStatusChange|cefcPowerSupplyOutputChange|1[.]3[.]6[.]1[.]4[.]1[.]9[.]9[.]117[.]2[.]0[.](1|2|3|4|5|6|7))([^0-9A-Za-z]|$)"],{$MDS.TRAP.EVENT.HOLD})=0'
              name: 'Cisco MDS: Hardware FRU event received'
              opdata: '{ITEM.LASTVALUE1}'
              priority: WARNING
              description: |
                The switch sent a CISCO-ENTITY-FRU-CONTROL-MIB notification (module, power supply or fan status change,
                FRU inserted or removed). Check with: show environment; show module; show logging log
                The problem closes by itself {$MDS.TRAP.EVENT.HOLD} after the last such trap, or can be closed manually.
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
        - uuid: 73de90c62e93423682529bfecd40b9ec
          name: 'Security violation (trap)'
          type: SNMP_TRAP
          key: 'snmptrap["(ciscoPsmPortBindFPortDenyNotify|ciscoPsmPortBindEPortDenyNotify|ciscoPsmFabricBindDenyNotify|cfcspAuthFailNotification|1[.]3[.]6[.]1[.]4[.]1[.]9[.]9[.]364[.]0[.](1|2|3|4)|1[.]3[.]6[.]1[.]4[.]1[.]9[.]9[.]391[.]0[.]1)([^0-9A-Za-z]|$)"]'
          delay: '0'
          value_type: LOG
          trends: '0'
          description: |
            MIB: CISCO-PSM-MIB, CISCO-FCSP-MIB
            Port security or fabric binding denied a login, FC-SP authentication failed.
          logtimefmt: 'hh:mm:sszyyyy/MM/dd'
          tags:
            - tag: component
              value: security
          triggers:
            - uuid: 97f0d43bd64c402ca403c56ddfa4d97f
              expression: 'nodata(/Cisco MDS 9148S by SNMP/snmptrap["(ciscoPsmPortBindFPortDenyNotify|ciscoPsmPortBindEPortDenyNotify|ciscoPsmFabricBindDenyNotify|cfcspAuthFailNotification|1[.]3[.]6[.]1[.]4[.]1[.]9[.]9[.]364[.]0[.](1|2|3|4)|1[.]3[.]6[.]1[.]4[.]1[.]9[.]9[.]391[.]0[.]1)([^0-9A-Za-z]|$)"],{$MDS.TRAP.EVENT.HOLD})=0'
              name: 'Cisco MDS: Port security or fabric binding violation'
              opdata: '{ITEM.LASTVALUE1}'
              priority: WARNING
              description: |
                A device or switch was denied by port security / fabric binding, or FC-SP authentication failed.
                Check with: show port-security violations; show fabric-binding violations
                The problem closes by itself {$MDS.TRAP.EVENT.HOLD} after the last such trap, or can be closed manually.
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: security
        - uuid: 10082da0a4c247848475d2e414f63e7b
          name: 'License event (trap)'
          type: SNMP_TRAP
          key: 'snmptrap["(clmLicenseExpiryNotify|clmNoLicenseForFeatureNotify|clmLicenseFileMissingNotify|clmLicenseExpiryWarningNotify|1[.]3[.]6[.]1[.]4[.]1[.]9[.]9[.]369[.]3[.]0[.](1|2|3|4))([^0-9A-Za-z]|$)"]'
          delay: '0'
          value_type: LOG
          trends: '0'
          description: |
            MIB: CISCO-LICENSE-MGR-MIB
            License expired or about to expire, feature used without license (grace period started),
            license file missing.
          logtimefmt: 'hh:mm:sszyyyy/MM/dd'
          tags:
            - tag: component
              value: license
          triggers:
