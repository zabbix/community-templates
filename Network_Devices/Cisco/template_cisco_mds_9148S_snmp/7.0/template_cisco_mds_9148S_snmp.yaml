          description: 'FC and transceiver discovery: exclude ports whose ifName matches.'
        - macro: '{$MDS.LICENSE.GRACE.MIN}'
          value: 7d
          description: 'Grace period left below which the license trigger becomes HIGH.'
        - macro: '{$MDS.MGMT.NAME.MATCHES}'
          value: '^mgmt[0-9]+$'
