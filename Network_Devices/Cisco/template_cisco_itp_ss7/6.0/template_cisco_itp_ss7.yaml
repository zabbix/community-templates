      - uuid: 586632ef681c47a6b1e8c4d581feb917
        name: 'Linkset [{#NAME}]: Seconds out of service'
        type: SNMP_AGENT
        key: itp.ls.outsvc[{#SNMPINDEX}]
        delay: 1m
        history: 7d
        snmp_oid: .1.3.6.1.4.1.9.9.336.1.5.1.1.13.{#SNMPINDEX}
        value_type: UNSIGNED
        trends: 365d
        units: s
      description: cgspLinksetTable. EMPTY on a pure SIGTRAN deployment -- this rule discovers nothing
        until MTP2, HSL or SCTP linksets are configured. Discovery runs off the state column because the
        name column is the index and is not-accessible; {#NAME} is decoded from the index. NOT verified
        against a populated table.
      preprocessing: &id004
      - type: JAVASCRIPT
        parameters:
        - "var rows = JSON.parse(value);\nrows.forEach(function (row) {\n    var p = String(row['{#SNMPINDEX}']).split('.').map(Number);\n\
          \    var names = [], i = 0;\n    while (i < p.length) {\n        var len = p[i++], s = '';\n\
          \        for (var j = 0; j < len && i < p.length; j++) s += String.fromCharCode(p[i++]);\n \
          \       if (s.length) names.push(s);\n    }\n    row['{#NAME}'] = names.join(' / ');\n});\n\
          return JSON.stringify(rows);"
