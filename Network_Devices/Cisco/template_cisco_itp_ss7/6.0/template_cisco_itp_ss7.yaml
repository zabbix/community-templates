      - uuid: 6617f244b0724557ae14d9aab2f8fa28
        expression: last(/Cisco ITP SS7 by SNMP/itp.aspas.state[{#SNMPINDEX}])=2
        name: 'Binding {#NAME}: ASP inactive'
        priority: AVERAGE
        manual_close: 'YES'
        dependencies:
        - name: 'Binding {#NAME}: ASP down'
          expression: last(/Cisco ITP SS7 by SNMP/itp.aspas.state[{#SNMPINDEX}])=1
      - uuid: f0668477ce2040628f55b83fe36b4a00
        expression: change(/Cisco ITP SS7 by SNMP/itp.aspas.activets[{#SNMPINDEX}])<0
        name: 'Binding {#NAME}: ASP restarted'
        priority: AVERAGE
        manual_close: 'YES'
    - uuid: 091fff87623b41d8b8c059b69ee6b7bf
      name: MTP3 event class discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#LOGGED}, .1.3.6.1.4.1.9.9.332.1.1.1.1.2]
      key: itp.gsp2.events.discovery
      delay: 6h
      lifetime: 30d
      item_prototypes:
      - uuid: 45dea115b0d74c44bb3937ad04324d21
        name: 'Event log [type {#EVENTTYPE}]: Events logged'
        type: SNMP_AGENT
        key: itp.gsp2.events.logged[{#SNMPINDEX}]
        delay: 1m
        history: 7d
        snmp_oid: .1.3.6.1.4.1.9.9.332.1.1.1.1.2.{#SNMPINDEX}
        value_type: UNSIGNED
        trends: 365d
      - uuid: 6c1f6956635b4311976aa5caea23c195
        name: 'Event log [type {#EVENTTYPE}]: Events dropped'
        type: SNMP_AGENT
        key: itp.gsp2.events.dropped[{#SNMPINDEX}]
        delay: 5m
        history: 7d
        snmp_oid: .1.3.6.1.4.1.9.9.332.1.1.1.1.3.{#SNMPINDEX}
        value_type: UNSIGNED
        trends: 365d
      - uuid: 83a8837d617c4405a072157b602338fe
        name: 'Event log [type {#EVENTTYPE}]: Buffer size'
        type: SNMP_AGENT
        key: itp.gsp2.events.max[{#SNMPINDEX}]
        delay: 6h
        history: 7d
        snmp_oid: .1.3.6.1.4.1.9.9.332.1.1.1.1.4.{#SNMPINDEX}
        value_type: UNSIGNED
        trends: 365d
        preprocessing: *id001
      description: cgsp2EventTable, one row per event class. Only the MTP3 class is present on a SIGTRAN-only
        configuration; more classes appear as links are added.
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - "var rows = JSON.parse(value);\nrows.forEach(function (row) {\n    var p = String(row['{#SNMPINDEX}']).split('.');\n\
          \    row['{#EVENTTYPE}'] = p[p.length - 1];\n});\nreturn JSON.stringify(rows);"
      trigger_prototypes:
      - uuid: c42b99d65b7142ef84537f1581627de8
        expression: change(/Cisco ITP SS7 by SNMP/itp.gsp2.events.logged[{#SNMPINDEX}])>0
        name: 'Event log type {#EVENTTYPE}: New events logged'
        priority: WARNING
        manual_close: 'YES'
        description: Events were recorded since the last poll. On a SIGTRAN STP these are usually destination
          accessible and inaccessible transitions. Read the text with "show cs7 mtp3 event-log" or by
          walking .1.3.6.1.4.1.9.9.332.1.1.4.1.2.
      - uuid: 989959842b2849c68c832c07b4ad15db
        expression: change(/Cisco ITP SS7 by SNMP/itp.gsp2.events.dropped[{#SNMPINDEX}])>0
        name: 'Event log type {#EVENTTYPE}: Dropping events'
        priority: AVERAGE
        manual_close: 'YES'
    - uuid: e37689877be24d9eb3be79d5c778fb36
      name: MTP3 error counter discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#ERROR}, .1.3.6.1.4.1.9.9.332.1.4.1.1.2]
      key: itp.gsp2.mtp3err.discovery
      delay: 6h
      lifetime: 30d
      item_prototypes:
      - uuid: a49772eeb7864f38b0a5d3fad76adfcf
        name: MTP3 error [{#ERROR}]
        type: SNMP_AGENT
        key: itp.gsp2.mtp3err[{#SNMPINDEX}]
        delay: 5m
        history: 7d
        snmp_oid: .1.3.6.1.4.1.9.9.332.1.4.1.1.3.{#SNMPINDEX}
        value_type: UNSIGNED
        trends: 365d
        description: cgsp2Mtp3ErrorsCount as a per-interval delta.
        preprocessing: *id003
      description: cgsp2Mtp3ErrorsTable. 42 named MTP3 error classes; {#ERROR} is the description string,
        so items are self-labelling.
      trigger_prototypes:
      - uuid: 757e4bf3055f403589753a8465076990
        expression: min(/Cisco ITP SS7 by SNMP/itp.gsp2.mtp3err[{#SNMPINDEX}],10m)>0
        name: 'MTP3 error: {#ERROR}'
        priority: AVERAGE
        manual_close: 'YES'
    - uuid: 2e5f92982c7942bab7483f86f1eba42e
      name: SCCP subsystem discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#PROHIBITS}, .1.3.6.1.4.1.9.9.335.1.13.1.1.2]
      key: itp.sccp.ssn.discovery
      delay: 1h
      lifetime: 30d
      item_prototypes:
      - uuid: 70a84e9c23b443ed81d483c70ffc10f2
        name: 'SSN {#SNMPINDEX}: Subsystem prohibited events'
        type: SNMP_AGENT
        key: itp.sccp.ssn.prohib[{#SNMPINDEX}]
        delay: 5m
        history: 7d
        snmp_oid: .1.3.6.1.4.1.9.9.335.1.13.1.1.2.{#SNMPINDEX}
        value_type: UNSIGNED
        trends: 365d
        preprocessing: *id003
      - uuid: 8619adcdb9bd4bcc92325b74a7282c84
        name: 'SSN {#SNMPINDEX}: Subsystem allowed events'
        type: SNMP_AGENT
        key: itp.sccp.ssn.allow[{#SNMPINDEX}]
        delay: 5m
        history: 7d
        snmp_oid: .1.3.6.1.4.1.9.9.335.1.13.1.1.3.{#SNMPINDEX}
        value_type: UNSIGNED
        trends: 365d
        preprocessing: *id003
      description: cgsccpSSNTable. Empty until SCCP subsystems are configured. NOT verified against a
        populated table.
      trigger_prototypes:
      - uuid: bdb6594c8a9144289eaf9b4dea93e730
        expression: min(/Cisco ITP SS7 by SNMP/itp.sccp.ssn.prohib[{#SNMPINDEX}],10m)>0
        name: 'SSN {#SNMPINDEX}: Subsystem prohibited'
        priority: HIGH
        manual_close: 'YES'
        description: An SCCP subsystem went out of service.
