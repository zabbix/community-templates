    - uuid: b41ebd64b4d54b20993ac7db1b665e68
      name: 'ITP: SNMP trap catcher'
      type: SNMP_TRAP
      key: snmptrap["cgsp|cItp|cgsccp"]
      delay: '0'
      history: 31d
      value_type: LOG
      trends: '0'
      description: Catches ITP notifications forwarded by snmptrapd, matched on the cgsp, cItp and cgsccp
        object-name prefixes -- these appear in the varbinds of every ITP trap. Note that the NOTIFICATION
        names themselves use the longer ciscoItpXua* / ciscoGsp* form, which is why the per-family triggers
        match on the leading-c-less ItpXua* pattern. Load the ITP MIBs on the trap receiver so notifications
        resolve to symbolic names, otherwise nothing matches this regexp and every ITP trap lands in the
        generic snmptrap.fallback item instead.
      triggers:
      - uuid: 04c69cc4eb2d4ad68709b543d8b31310
        expression: find(/Cisco ITP SS7 by SNMP/snmptrap["cgsp|cItp|cgsccp"],,"regexp","[Ii]solat")=1
        name: 'ITP: MTP3 isolation trap received'
        priority: DISASTER
        manual_close: 'YES'
      - uuid: e886e83856174d1582b9b95ac67b1991
        expression: find(/Cisco ITP SS7 by SNMP/snmptrap["cgsp|cItp|cgsccp"],,"regexp","ItpXuaAsStateChange")=1
        name: 'ITP: AS state change trap received'
        priority: HIGH
        manual_close: 'YES'
      - uuid: 8e83012e380e481abf9f97e43a4a3363
        expression: find(/Cisco ITP SS7 by SNMP/snmptrap["cgsp|cItp|cgsccp"],,"regexp","ItpXuaAspStateChange")=1
        name: 'ITP: ASP state change trap received'
        priority: HIGH
        manual_close: 'YES'
      - uuid: 7966c82b03ad47878b96412468dd740d
        expression: find(/Cisco ITP SS7 by SNMP/snmptrap["cgsp|cItp|cgsccp"],,"regexp","ItpXuaSgmStateChange")=1
        name: 'ITP: SG mate state change trap received'
        priority: AVERAGE
        manual_close: 'YES'
      - uuid: 9b2410ca66314ba79573d3ba97e15c10
        expression: find(/Cisco ITP SS7 by SNMP/snmptrap["cgsp|cItp|cgsccp"],,"regexp","ItpXua.*CongChange")=1
        name: 'ITP: XUA congestion trap received'
        priority: AVERAGE
        manual_close: 'YES'
      - uuid: 3370925ed3e04b13a8ded2c813817493
        expression: find(/Cisco ITP SS7 by SNMP/snmptrap["cgsp|cItp|cgsccp"],,"regexp","cgsccp")=1
        name: 'ITP: SCCP or GTT trap received'
        priority: AVERAGE
        manual_close: 'YES'
      - uuid: e67a7abed2ca4035a7d7a341a51ca974
        expression: find(/Cisco ITP SS7 by SNMP/snmptrap["cgsp|cItp|cgsccp"],,"regexp","[Dd]estination.*([Ii]naccessible|[Uu]navailable|[Pp]rohibit)")=1
        name: 'ITP: Destination unreachable trap received'
        priority: DISASTER
        manual_close: 'YES'
        description: A destination point code became unreachable. This comes from the gw-dest-state trap
          family. There is no polled equivalent on this image -- CISCO-ITP-RT-MIB (.9.9.228) returns nothing
          -- so this trap and the GSP2 MTP3 event-log counter are the only two signals for route state.
      - uuid: 3a40152622da40f8bbe1c420d16a61e1
        expression: find(/Cisco ITP SS7 by SNMP/snmptrap["cgsp|cItp|cgsccp"],,"regexp","ItpRt")=1
        name: 'ITP: Route state or route management trap received'
        priority: HIGH
        manual_close: 'YES'
        description: Catch for the gw-dest-state, gw-route-mgmt-state and gw-route-load families, which
          live in CISCO-ITP-RT-MIB. The exact notification names on this image were not confirmed, so
          this matches on the cItpRt object-name prefix. Split it once you have seen a real one arrive.
      - uuid: 46cddee8f98543f283218372a10e3e2f
        expression: find(/Cisco ITP SS7 by SNMP/snmptrap["cgsp|cItp|cgsccp"],,"regexp","ItpMsu")=1
        name: 'ITP: MSU rate threshold trap received'
        priority: AVERAGE
        manual_close: 'YES'
        description: From the msu-rates family. Only fires if MSU rate thresholds are configured.
      - uuid: e7f47387cb954440b0c31049e768c38d
        expression: find(/Cisco ITP SS7 by SNMP/snmptrap["cgsp|cItp|cgsccp"],,"regexp","cgsp")=1
        name: 'ITP: Signalling point trap received'
        priority: AVERAGE
        manual_close: 'YES'
        description: Generic catch for GSP and GSP2 notifications.
