        key: itp.lnk.ifindex[{#SNMPINDEX}]
        delay: 6h
        history: 7d
        snmp_oid: .1.3.6.1.4.1.9.9.336.1.6.1.1.6.{#SNMPINDEX}
        value_type: UNSIGNED
        trends: 365d
        description: ifIndex of the serial or channelised interface carrying this link. Use it to correlate
          with IF-MIB error counters.
        preprocessing: *id001
      description: cgspLinkTable, indexed by network, linkset and SLC. EMPTY until links are configured.
        The index decoder splits off the trailing SLC before reading the linkset name, giving {#LINKSET}
        and {#SLC}. NOT verified against a populated table -- check the first discovered link before trusting
        the TDM-specific SUERM and AERM triggers.
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - "var rows = JSON.parse(value);\nrows.forEach(function (row) {\n    var p = String(row['{#SNMPINDEX}']).split('.').map(Number);\n\
          \    var slc = p.pop();\n    var names = [], i = 0;\n    while (i < p.length) {\n        var\
          \ len = p[i++], s = '';\n        for (var j = 0; j < len && i < p.length; j++) s += String.fromCharCode(p[i++]);\n\
          \        if (s.length) names.push(s);\n    }\n    row['{#LINKSET}'] = names.join(' / ') || 'unnamed';\n\
          \    row['{#SLC}'] = slc;\n});\nreturn JSON.stringify(rows);"
      trigger_prototypes:
