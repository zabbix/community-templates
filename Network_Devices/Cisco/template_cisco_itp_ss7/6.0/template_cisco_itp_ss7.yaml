      - uuid: 6eba2c8889b94c87aff2a6df1dfeae31
        expression: min(/Cisco ITP SS7 by SNMP/itp.lnk.utilrx[{#SNMPINDEX}],10m)>{$ITP.LINK.UTIL.HIGH}
          or min(/Cisco ITP SS7 by SNMP/itp.lnk.utiltx[{#SNMPINDEX}],10m)>{$ITP.LINK.UTIL.HIGH}
