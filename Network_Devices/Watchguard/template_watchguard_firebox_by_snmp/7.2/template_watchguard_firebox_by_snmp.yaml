zabbix_export:
  version: '7.2'
  template_groups:
  - uuid: 754d4cc1989e4ad3bd27a85eb6b3f95f
    name: Templates/Network devices
  templates:
  - uuid: 31157ff980f0453cb7d2ad2ec17896d5
    template: WatchGuard Firebox by SNMP
    name: WatchGuard Firebox by SNMP
    description: 'WatchGuard Firebox monitoring by SNMP for Zabbix 7.2. Uses standard MIB-II/IF-MIB and WatchGuard enterprise MIB objects. Supports SNMPv2c and SNMPv3 through the host SNMP interface. Connected-user monitoring is intentionally excluded. Author: @elibardev.'
    vendor:
      name: elibardev
      version: 7.2-3
    groups:
    - name: Templates/Network devices
    items:
    - uuid: a7bc3fc6d06b4437a22318e6fadc2698
      name: ICMP ping
      type: SIMPLE
      key: icmpping
      delay: 1m
      history: 7d
      trends: '0'
      valuemap:
        name: Service state
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: b37d2de9776c48598169b2f57deb936d
        expression: max(/WatchGuard Firebox by SNMP/icmpping,#3)=0
        name: 'WatchGuard: Host is unavailable by ICMP'
        priority: HIGH
        description: Three consecutive ICMP checks failed. This trigger is intentionally tolerant to brief packet loss.
        tags:
        - tag: scope
          value: availability
    - uuid: 1cf8e7cb8cbe4527ab98d30076fa1552
      name: ICMP loss
      type: SIMPLE
      key: icmppingloss
      delay: 1m
      history: 7d
      trends: 365d
      value_type: FLOAT
      units: '%'
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: 0e5da466445344aa82a67e56ea6a0be8
        expression: min(/WatchGuard Firebox by SNMP/icmppingloss,10m)>{$ICMP_LOSS_WARN}
        name: 'WatchGuard: High ICMP packet loss (>{$ICMP_LOSS_WARN}%)'
        priority: WARNING
        description: Packet loss has remained above the configured warning threshold for 10 minutes.
        tags:
        - tag: scope
          value: performance
    - uuid: 6056529f4c8c43cf98ac3f8f947272c6
      name: ICMP response time
      type: SIMPLE
      key: icmppingsec
      delay: 1m
      history: 7d
      trends: 365d
      value_type: FLOAT
      units: s
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: 57dec08c15164844ad0517abead2b259
        expression: avg(/WatchGuard Firebox by SNMP/icmppingsec,10m)>{$ICMP_RESPONSE_TIME_WARN}
        name: 'WatchGuard: High ICMP response time'
        priority: WARNING
        description: Average ICMP response time has remained above the configured threshold for 10 minutes.
        tags:
        - tag: scope
          value: performance
    - uuid: 429ce25f05454d24be5fd4330a4070b6
      name: System name
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.5.0]
      key: system.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: system
    - uuid: 3bf6cfd1e83543749ce598bcb13d5019
      name: Device contact
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.4.0]
      key: system.contact
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: system
    - uuid: 8d45af5404574a67883aa9122347ea94
      name: Device location
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.6.0]
      key: system.location
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: system
    - uuid: b5588d8aad824123b1a66c6874e26b60
      name: Device description
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.1.0]
      key: system.descr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: system
    - uuid: 3ac2cc8ffbd84e1ebf1215c7ebe89135
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.2.0]
      key: system.objectid
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: system
    - uuid: 89a1e856eab04270948e8c5dcd9376cf
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.3.0]
      key: system.uptime
      delay: 5m
      history: 7d
      trends: 365d
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
      triggers:
      - uuid: 40c9218092084581af3705a562fd87d2
        expression: last(/WatchGuard Firebox by SNMP/system.uptime)<10m
        name: 'WatchGuard: Device has been restarted'
        priority: INFO
        description: The reported SNMP uptime is below 10 minutes.
        manual_close: 'YES'
        tags:
        - tag: scope
          value: availability
    - uuid: 61942b7333f341bbacb808c4e9fef762
      name: Fireware software version
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.3097.6.3.1.0]
      key: watchguard.software.version
      delay: 1h
      history: 30d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: system
      triggers:
      - uuid: 78957bf7128d467b8b0b84394e299d96
        expression: last(/WatchGuard Firebox by SNMP/watchguard.software.version,#1)<>last(/WatchGuard Firebox by SNMP/watchguard.software.version,#2) and length(last(/WatchGuard Firebox by SNMP/watchguard.software.version))>0
        name: 'WatchGuard: Fireware version has changed'
        priority: INFO
        description: The Fireware version changed between the two most recent successful polls.
        manual_close: 'YES'
        tags:
        - tag: scope
          value: change
    - uuid: fbd0934582964f44a638d0dd8997915e
      name: CPU utilization, 1 minute
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.3097.6.3.77.0]
      key: watchguard.cpu.util[1m]
      delay: 1m
      history: 7d
      trends: 365d
      value_type: FLOAT
      units: '%'
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: cpu
    - uuid: d4ddbecb004049aa94a50e8dbb753e2c
      name: CPU utilization, 5 minutes
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.3097.6.3.78.0]
      key: watchguard.cpu.util[5m]
      delay: 1m
      history: 7d
      trends: 365d
      value_type: FLOAT
      units: '%'
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: cpu
      triggers:
      - uuid: 93afd8690d824487ae00e5b5cde194b0
        expression: min(/WatchGuard Firebox by SNMP/watchguard.cpu.util[5m],15m)>{$CPU.UTIL.WARN}
        name: 'WatchGuard: High CPU utilization (>{$CPU.UTIL.WARN}%)'
        priority: WARNING
        description: CPU utilization has remained above the warning threshold for 15 minutes.
        tags:
        - tag: scope
          value: performance
      - uuid: 2e5fdda53b934d1ab34955fca622eacc
        expression: min(/WatchGuard Firebox by SNMP/watchguard.cpu.util[5m],10m)>{$CPU.UTIL.HIGH}
        name: 'WatchGuard: Very high CPU utilization (>{$CPU.UTIL.HIGH}%)'
        priority: HIGH
        description: CPU utilization has remained above the high threshold for 10 minutes.
        dependencies:
        - name: 'WatchGuard: High CPU utilization (>{$CPU.UTIL.WARN}%)'
          expression: min(/WatchGuard Firebox by SNMP/watchguard.cpu.util[5m],15m)>{$CPU.UTIL.WARN}
        tags:
        - tag: scope
          value: performance
    - uuid: 7ced29faa2d84feb96908163fadecf3d
      name: CPU utilization, 15 minutes
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.3097.6.3.79.0]
      key: watchguard.cpu.util[15m]
      delay: 5m
      history: 7d
      trends: 365d
      value_type: FLOAT
      units: '%'
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: cpu
    - uuid: 396ae1f3ca9d4840b0e85a58c98f64c7
      name: Total memory
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.2021.4.20.0]
      key: watchguard.memory.total
      delay: 5m
      history: 7d
      trends: 365d
      value_type: UNSIGNED
      units: B
      preprocessing:
      - type: MULTIPLIER
        parameters: ['1024']
      tags: [{tag: component, value: memory}]
    - uuid: 4b1e384398534a238381f350b68a5255
      name: Available memory
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.2021.4.27.0]
      key: watchguard.memory.available
      delay: 5m
      history: 7d
      trends: 365d
      value_type: UNSIGNED
      units: B
      preprocessing:
      - type: MULTIPLIER
        parameters: ['1024']
      tags: [{tag: component, value: memory}]
    - uuid: 8d9e0aefbb4a48ab9a8ba07b104a7d65
      name: Memory utilization
      type: CALCULATED
      key: watchguard.memory.util
      delay: 5m
      history: 7d
      trends: 365d
      value_type: FLOAT
      units: '%'
      params: 100*(last(//watchguard.memory.total)-last(//watchguard.memory.available))/(last(//watchguard.memory.total)+(last(//watchguard.memory.total)=0))*(last(//watchguard.memory.total)>0)
      tags:
      - tag: component
        value: memory
      triggers:
      - uuid: 0d252c05816e4dad91cebffe6422f0a7
        expression: min(/WatchGuard Firebox by SNMP/watchguard.memory.util,15m)>{$MEMORY.UTIL.WARN}
        name: 'WatchGuard: High memory utilization (>{$MEMORY.UTIL.WARN}%)'
        priority: WARNING
        description: Memory utilization has remained above the warning threshold for 15 minutes.
        tags: [{tag: scope, value: performance}]
      - uuid: bc9c55337ed949619ad1eb01ead063eb
        expression: min(/WatchGuard Firebox by SNMP/watchguard.memory.util,10m)>{$MEMORY.UTIL.HIGH}
        name: 'WatchGuard: Very high memory utilization (>{$MEMORY.UTIL.HIGH}%)'
        priority: HIGH
        description: Memory utilization has remained above the high threshold for 10 minutes.
        dependencies:
        - name: 'WatchGuard: High memory utilization (>{$MEMORY.UTIL.WARN}%)'
          expression: min(/WatchGuard Firebox by SNMP/watchguard.memory.util,15m)>{$MEMORY.UTIL.WARN}
        tags: [{tag: scope, value: performance}]
    - uuid: d6a5e1860a9e437996dc70c7b0eca688
      name: Current active connections
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.3097.6.3.80.0]
      key: watchguard.connections.active
      delay: 1m
      history: 7d
      trends: 365d
      tags:
      - tag: component
        value: connections
    - uuid: 6c93a449bdad4652a90f6086505ab564
      name: System traffic received
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.3097.6.3.9.0]
      key: watchguard.traffic.in
      delay: 1m
      history: 7d
      trends: 365d
      value_type: FLOAT
      units: bps
      preprocessing:
      - type: CHANGE_PER_SECOND
      - type: MULTIPLIER
        parameters:
        - '8'
      tags:
      - tag: component
        value: traffic
    - uuid: a3330a2907724eb8bd5adf7d067f671c
      name: System traffic sent
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.3097.6.3.8.0]
      key: watchguard.traffic.out
      delay: 1m
      history: 7d
      trends: 365d
      value_type: FLOAT
      units: bps
      preprocessing:
      - type: CHANGE_PER_SECOND
      - type: MULTIPLIER
        parameters:
        - '8'
      tags:
      - tag: component
        value: traffic
    - uuid: aa0040182a2346eeb0426ecb71e453d1
      name: Active IPSec endpoint pairs
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.3097.5.1.1.1.0]
      key: watchguard.vpn.endpoint_pairs
      delay: 1m
      history: 7d
      trends: 365d
      tags:
      - tag: component
        value: vpn
      triggers:
      - uuid: 5a42be72293345adb696d002efcb3067
        expression: '{$VPN.MIN.ACTIVE}>0 and max(/WatchGuard Firebox by SNMP/watchguard.vpn.endpoint_pairs,10m)<{$VPN.MIN.ACTIVE}'
        name: 'WatchGuard: Active IPSec endpoint pairs below expected minimum'
        priority: AVERAGE
        description: Optional baseline trigger. It is disabled by default because {$VPN.MIN.ACTIVE}=0. Set the macro to the minimum number of IPSec endpoint pairs that should normally be active.
        tags:
        - tag: component
          value: vpn
        - tag: scope
          value: availability
    - uuid: 5263d43dc5034ee8be0aa45fc2d91927
      name: 'Interfaces: SNMP walk'
      type: SNMP_AGENT
      snmp_oid: walk[1.3.6.1.2.1.2.2.1.2,1.3.6.1.2.1.2.2.1.7,1.3.6.1.2.1.2.2.1.8,1.3.6.1.2.1.31.1.1.1.1,1.3.6.1.2.1.31.1.1.1.6,1.3.6.1.2.1.31.1.1.1.10,1.3.6.1.2.1.2.2.1.13,1.3.6.1.2.1.2.2.1.14,1.3.6.1.2.1.2.2.1.19,1.3.6.1.2.1.2.2.1.20]
      key: watchguard.net.if.walk
      delay: 1m
      history: '0'
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: raw
    - uuid: a12c307241f1463991993d69162417cf
      name: 'IPSec endpoint pairs: SNMP walk'
      type: SNMP_AGENT
      snmp_oid: walk[1.3.6.1.4.1.3097.5.1.1.2.1.2,1.3.6.1.4.1.3097.5.1.1.2.1.3,1.3.6.1.4.1.3097.5.1.1.2.1.4,1.3.6.1.4.1.3097.5.1.1.2.1.5,1.3.6.1.4.1.3097.5.1.1.2.1.6,1.3.6.1.4.1.3097.5.1.1.2.1.7,1.3.6.1.4.1.3097.5.1.1.2.1.11,1.3.6.1.4.1.3097.5.1.1.2.1.12]
      key: watchguard.vpn.walk
      delay: 1m
      history: '0'
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: raw
    - uuid: 1cdad4dcfbb14464adb3ab6bbf5cc448
      name: 'Policies: SNMP walk'
      type: SNMP_AGENT
      snmp_oid: walk[1.3.6.1.4.1.3097.4.2.2.1.1,1.3.6.1.4.1.3097.4.2.2.1.2,1.3.6.1.4.1.3097.4.2.2.1.3,1.3.6.1.4.1.3097.4.2.2.1.4,1.3.6.1.4.1.3097.4.2.2.1.10,1.3.6.1.4.1.3097.4.2.2.1.14,1.3.6.1.4.1.3097.4.2.2.1.17,1.3.6.1.4.1.3097.4.2.2.1.18,1.3.6.1.4.1.3097.4.2.2.1.19]
      key: watchguard.policy.walk
      delay: 1m
      history: '0'
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: raw
    discovery_rules:
    - uuid: 13b7db3dab154497b29a87281fb13287
      name: Network interfaces discovery
      type: DEPENDENT
      key: watchguard.net.if.discovery
      master_item:
        key: watchguard.net.if.walk
      lifetime: 30d
      preprocessing:
      - type: SNMP_WALK_TO_JSON
        parameters:
        - '{#IFDESCR}'
        - 1.3.6.1.2.1.2.2.1.2
        - '0'
        - '{#IFADMINSTATUS}'
        - 1.3.6.1.2.1.2.2.1.7
        - '0'
        - '{#IFOPERSTATUS}'
        - 1.3.6.1.2.1.2.2.1.8
        - '0'
        - '{#IFNAME}'
        - 1.3.6.1.2.1.31.1.1.1.1
        - '0'
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 6h
      filter:
        evaltype: AND
        conditions:
        - macro: '{#IFNAME}'
          value: '{$NET.IF.IFNAME.MATCHES}'
          formulaid: A
        - macro: '{#IFNAME}'
          value: '{$NET.IF.IFNAME.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
          formulaid: B
      item_prototypes:
      - uuid: 8caf506b468f4a0492fc1d0201dd86c7
        name: 'Interface {#IFNAME}: Operational status'
        type: DEPENDENT
        key: net.if.status[{#SNMPINDEX}]
        master_item:
          key: watchguard.net.if.walk
        history: 7d
        trends: 365d
        tags:
        - tag: component
          value: interface
        preprocessing:
        - type: SNMP_WALK_VALUE
          parameters:
          - 1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}
          - '0'
        valuemap:
          name: Interface operational status
      - uuid: 57fcf44d90494d5e999b0260a352f4ef
        name: 'Interface {#IFNAME}: Administrative status'
        type: DEPENDENT
        key: net.if.adminstatus[{#SNMPINDEX}]
        master_item:
          key: watchguard.net.if.walk
        history: 7d
        trends: 365d
        tags:
        - tag: component
          value: interface
        preprocessing:
        - type: SNMP_WALK_VALUE
          parameters:
          - 1.3.6.1.2.1.2.2.1.7.{#SNMPINDEX}
          - '0'
        valuemap:
          name: Interface operational status
      - uuid: 14fd9567303e4511a7337d4715f87aea
        name: 'Interface {#IFNAME}: Inbound traffic'
        type: DEPENDENT
        key: net.if.in[{#SNMPINDEX}]
        master_item:
          key: watchguard.net.if.walk
        history: 7d
        trends: 365d
        tags:
        - tag: component
          value: interface
        preprocessing:
        - type: SNMP_WALK_VALUE
          parameters:
          - 1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}
          - '0'
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        value_type: FLOAT
        units: bps
      - uuid: 6b95bb4c95b942cdaead1926811e1b68
        name: 'Interface {#IFNAME}: Outbound traffic'
        type: DEPENDENT
        key: net.if.out[{#SNMPINDEX}]
        master_item:
          key: watchguard.net.if.walk
        history: 7d
        trends: 365d
        tags:
        - tag: component
          value: interface
        preprocessing:
        - type: SNMP_WALK_VALUE
          parameters:
          - 1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}
          - '0'
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        value_type: FLOAT
        units: bps
      - uuid: 0918595142824ba39cb8a4d15b2d0803
        name: 'Interface {#IFNAME}: Inbound errors'
        type: DEPENDENT
        key: net.if.in.errors[{#SNMPINDEX}]
        master_item:
          key: watchguard.net.if.walk
        history: 7d
        trends: 365d
        tags:
        - tag: component
          value: interface
        preprocessing:
        - type: SNMP_WALK_VALUE
          parameters:
          - 1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}
          - '0'
        - type: CHANGE_PER_SECOND
        value_type: FLOAT
        units: pps
      - uuid: 486841f6b16247988be763410fc0a15f
        name: 'Interface {#IFNAME}: Outbound errors'
        type: DEPENDENT
        key: net.if.out.errors[{#SNMPINDEX}]
        master_item:
          key: watchguard.net.if.walk
        history: 7d
        trends: 365d
        tags:
        - tag: component
          value: interface
        preprocessing:
        - type: SNMP_WALK_VALUE
          parameters:
          - 1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}
          - '0'
        - type: CHANGE_PER_SECOND
        value_type: FLOAT
        units: pps
      - uuid: 92c60bfa210946459d63678af23cca23
        name: 'Interface {#IFNAME}: Inbound discards'
        type: DEPENDENT
        key: net.if.in.discards[{#SNMPINDEX}]
        master_item:
          key: watchguard.net.if.walk
        history: 7d
        trends: 365d
        tags:
        - tag: component
          value: interface
        preprocessing:
        - type: SNMP_WALK_VALUE
          parameters:
          - 1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}
          - '0'
        - type: CHANGE_PER_SECOND
        value_type: FLOAT
        units: pps
      - uuid: 6feb97e7c7f2419db2b6f4036ded2b31
        name: 'Interface {#IFNAME}: Outbound discards'
        type: DEPENDENT
        key: net.if.out.discards[{#SNMPINDEX}]
        master_item:
          key: watchguard.net.if.walk
        history: 7d
        trends: 365d
        tags:
        - tag: component
          value: interface
        preprocessing:
        - type: SNMP_WALK_VALUE
          parameters:
          - 1.3.6.1.2.1.2.2.1.19.{#SNMPINDEX}
          - '0'
        - type: CHANGE_PER_SECOND
        value_type: FLOAT
        units: pps
      trigger_prototypes:
      - uuid: ff03ff5674e34a56976189cb74d91669
        expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/WatchGuard Firebox by SNMP/net.if.adminstatus[{#SNMPINDEX}])=1 and max(/WatchGuard Firebox by SNMP/net.if.status[{#SNMPINDEX}],5m)=2'
        name: 'WatchGuard: Interface {#IFNAME} link down'
        priority: AVERAGE
        description: The interface is administratively up but has remained operationally down for 5 minutes. Use {$IFCONTROL:"{#IFNAME}"}=0 to suppress this trigger for a specific interface.
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
        - tag: scope
          value: availability
      - uuid: fad195a5295a4f769855628a162da38c
        expression: avg(/WatchGuard Firebox by SNMP/net.if.in.errors[{#SNMPINDEX}],15m)>{$IF.ERRORS.WARN} or avg(/WatchGuard Firebox by SNMP/net.if.out.errors[{#SNMPINDEX}],15m)>{$IF.ERRORS.WARN}
        name: 'WatchGuard: Interface {#IFNAME} error rate is elevated'
        priority: WARNING
