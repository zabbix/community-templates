    - macro: '{$VPN.MIN.ACTIVE}'
      value: '0'
      description: Optional minimum expected active IPSec endpoint pairs. Zero disables the baseline trigger.
    - macro: '{$POLICY.NAME.MATCHES}'
      value: .*
      description: Regex of firewall policy names to discover.
    - macro: '{$POLICY.NAME.NOT_MATCHES}'
      value: ^$
      description: Regex of firewall policy names to exclude from discovery.
    - macro: '{$POLICY.DISCARDS.WARN}'
      value: '10'
      description: Average policy firewall-discard warning threshold, in packets per second.
    - macro: '{$POLICYCONTROL}'
      value: '1'
      description: Enable policy discard triggers globally. Use context macros per policy to override.
