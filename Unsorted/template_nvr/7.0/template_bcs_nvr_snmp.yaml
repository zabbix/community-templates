zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 7bd8286eecc64eb58b7340dc8d33c444
    name: Templates/Video surveillance
  templates:
  - uuid: 212d5bddb27546228f356acbd75f71c6
    template: BCS NVR by SNMP
    name: BCS NVR by SNMP
    description: 'SNMP monitoring template for BCS NVR devices exposing enterprise OID 1.3.6.1.4.1.1004849.


      Tested with BCS-L-NVR1602-A-4KE-16P(2), firmware 4.005.00NS004.0.R, on Zabbix 7.0.

      Configure an SNMP interface on the host and link this template.


      The template discovers cameras and physical disks, monitors camera connectivity, main-stream parameters, disk status, logical-volume availability,
      NVR uptime, and inventory data.


      Per-camera recording-state verification is intentionally not included because a reliable SNMP OID for that state has not been confirmed.'
    groups:
    - name: Templates/Video surveillance
    items:
    - uuid: 69125bd2960d4635b0fb91af3ded53cc
      name: 'BCS NVR: Model'
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.4.1.1004849.2.1.2.6.0
      key: bcs.nvr.model
      delay: 1h
      history: 7d
      value_type: CHAR
      trends: '0'
      tags:
      - tag: component
        value: system
    - uuid: 83c645a97caf4fe0ac786c7613da0f37
      name: 'BCS NVR: Firmware'
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.4.1.1004849.2.1.2.5.0
      key: bcs.nvr.firmware
      delay: 1h
      history: 7d
      value_type: CHAR
      trends: '0'
      tags:
      - tag: component
        value: system
    - uuid: 1d0418f91ae0431187f5cb8f1d75175a
      name: 'BCS NVR: Software version'
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.4.1.1004849.2.1.1.1.0
      key: bcs.nvr.software
      delay: 1h
      history: 7d
      value_type: CHAR
      trends: '0'
      tags:
      - tag: component
        value: system
    - uuid: 41ee6b25b6c2472bada960657c62d50f
      name: 'BCS NVR: Device name'
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.4.1.1004849.2.1.2.9.0
      key: bcs.nvr.name
      delay: 10m
      history: 7d
      value_type: CHAR
      trends: '0'
      tags:
      - tag: component
        value: system
    - uuid: 45ea8ca99b35417e979ee460f0f4517f
      name: 'BCS NVR: Operating system'
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.4.1.1004849.2.1.10.1.0
      key: bcs.nvr.os
      delay: 1h
      history: 7d
      value_type: CHAR
      trends: '0'
      tags:
      - tag: component
        value: os
    - uuid: 747c5c11affa43fbb72e18a3477dcda4
      name: 'BCS NVR: Kernel version'
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.4.1.1004849.2.1.10.2.0
      key: bcs.nvr.kernel
      delay: 1h
      history: 7d
      value_type: CHAR
      trends: '0'
      tags:
      - tag: component
        value: os
    - uuid: 18d3eeb2f45f45649463417c9ef57a99
      name: 'BCS NVR: Uptime'
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.4.1.1004849.2.1.6.0
      key: bcs.nvr.uptime
      delay: 1m
      history: 30d
      value_type: UNSIGNED
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      triggers:
      - uuid: 5dc3d66a9ff44824b44acfbeaea802e3
        expression: last(/BCS NVR by SNMP/bcs.nvr.uptime)<600
        name: 'BCS NVR: Device has recently restarted'
        priority: WARNING
        description: The NVR uptime indicates that the device has recently restarted.
        tags:
        - tag: scope
          value: notice
      - uuid: a88e5235890947a19fbfffa09b2e45f0
        expression: nodata(/BCS NVR by SNMP/bcs.nvr.uptime,{$BCS.NVR.NODATA.TIME})=1
        name: 'BCS NVR: No SNMP data for 5 minutes'
        priority: HIGH
        description: No uptime data has been received from the NVR over SNMP within the configured time window.
        tags:
        - tag: scope
          value: availability
      tags:
      - tag: component
        value: system
    - uuid: f2147335caed49eb9c568de9187f2d83
      name: 'BCS NVR: Logical volumes raw state'
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.4.1.1004849.2.4.4.1.7.8.47.100.101.118.47.115.100.97
      key: bcs.nvr.storage.logical_volumes
      delay: 2m
      history: 7d
      value_type: TEXT
      trends: '0'
      description: Raw logical-volume state string returned by the NVR.
      tags:
      - tag: component
        value: storage
      - tag: component
        value: raw
    - uuid: d04b4953fb2a4f619603646b6a6cf147
      name: 'BCS NVR: Logical volumes health'
      type: DEPENDENT
      key: bcs.nvr.storage.logical_volumes.health
      delay: '0'
      history: 30d
      value_type: UNSIGNED
      description: Returns 1 when all logical volumes reported in the raw storage state are healthy, otherwise 0.
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - "const ok = '{$BCS.NVR.VOLUME.STATUS.OK}';\nconst matches = [...value.matchAll(/:([^\\s]+)/g)].map(m => m[1]);\nif (matches.length ===\
          \ 0) {\n    return 0;\n}\nreturn matches.every(status => status === ok) ? 1 : 0;"
      master_item:
        key: bcs.nvr.storage.logical_volumes
      tags:
      - tag: component
        value: storage
      triggers:
      - uuid: 2de39cc6b78e4c8f8a671f0139de7f6c
        expression: last(/BCS NVR by SNMP/bcs.nvr.storage.logical_volumes.health)=0
        name: 'BCS NVR: Logical volume is not available'
        priority: HIGH
        description: At least one logical volume reported by the NVR is not in the expected healthy state.
        tags:
        - tag: scope
          value: availability
    discovery_rules:
    - uuid: 4f65f936da84429a9c2ddb62da1ce871
      name: 'NVR: Camera discovery'
      type: SNMP_AGENT
      snmp_oid: discovery[{#CAMERA_IP},1.3.6.1.4.1.1004849.2.10.2.2.1.2,{#CAMERA_NAME},1.3.6.1.4.1.1004849.2.10.2.2.1.4]
      key: bcs.nvr.camera.discovery
      delay: 5m
      lifetime: 7d
      description: Discovers camera channels from the NVR remote device table.
      item_prototypes:
      - uuid: 3b956fe49d8240aebb8bbf3f1e0165de
        name: 'Camera {#SNMPINDEX} {#CAMERA_NAME}: Status'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.4.1.1004849.2.10.2.2.1.3.{#SNMPINDEX}
        key: bcs.nvr.camera.status[{#SNMPINDEX}]
        delay: 1m
        history: 30d
        value_type: CHAR
        trends: '0'
        tags:
        - tag: component
          value: camera
      - uuid: 6b3356dd9c964aeab7839c88e04855de
        name: 'Camera {#SNMPINDEX} {#CAMERA_NAME}: IP address'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.4.1.1004849.2.10.2.2.1.2.{#SNMPINDEX}
        key: bcs.nvr.camera.ip[{#SNMPINDEX}]
        delay: 10m
        history: 7d
        value_type: CHAR
        trends: '0'
        tags:
        - tag: component
          value: camera
      - uuid: cf70f2cd9568494ba6dc6299df3b61b6
        name: 'Camera {#SNMPINDEX}: Name'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.4.1.1004849.2.10.2.2.1.4.{#SNMPINDEX}
        key: bcs.nvr.camera.name[{#SNMPINDEX}]
        delay: 10m
        history: 7d
        value_type: CHAR
        trends: '0'
        tags:
        - tag: component
          value: camera
      - uuid: 0c6c0da6b31e4c6e8bc3ef572498c6bc
        name: 'Camera {#SNMPINDEX} {#CAMERA_NAME}: Main stream codec'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.4.1.1004849.2.3.1.1.1.1.2.{#SNMPINDEX}
        key: bcs.nvr.camera.main.codec[{#SNMPINDEX}]
        delay: 10m
        history: 7d
        value_type: CHAR
        trends: '0'
        tags:
        - tag: component
          value: camera
        - tag: component
          value: video
      - uuid: be3215a27e0040b693fe0564b9f4472a
        name: 'Camera {#SNMPINDEX} {#CAMERA_NAME}: Main stream FPS'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.4.1.1004849.2.3.1.1.1.1.3.{#SNMPINDEX}
        key: bcs.nvr.camera.main.fps[{#SNMPINDEX}]
        delay: 10m
        history: 30d
        value_type: UNSIGNED
        tags:
        - tag: component
          value: camera
        - tag: component
          value: video
      - uuid: 640e0545ea234927b4395cb190eec24e
        name: 'Camera {#SNMPINDEX} {#CAMERA_NAME}: Main stream resolution'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.4.1.1004849.2.3.1.1.1.1.4.{#SNMPINDEX}
        key: bcs.nvr.camera.main.resolution[{#SNMPINDEX}]
        delay: 10m
        history: 7d
        value_type: CHAR
        trends: '0'
        tags:
        - tag: component
          value: camera
        - tag: component
          value: video
      - uuid: 1cfe28351e81494db0f0786c8e414457
        name: 'Camera {#SNMPINDEX} {#CAMERA_NAME}: Main stream bitrate'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.4.1.1004849.2.3.1.1.1.1.5.{#SNMPINDEX}
        key: bcs.nvr.camera.main.bitrate[{#SNMPINDEX}]
        delay: 10m
        history: 30d
        value_type: UNSIGNED
        units: Kbps
        tags:
        - tag: component
          value: camera
        - tag: component
          value: video
      trigger_prototypes:
      - uuid: fecc1358e2714ebeb3a6d790f8d221df
        expression: count(/BCS NVR by SNMP/bcs.nvr.camera.status[{#SNMPINDEX}],{$BCS.NVR.CAMERA.OFFLINE.TIME},"eq","Connected")=0
        name: 'BCS NVR: Camera {#SNMPINDEX} {#CAMERA_NAME} ({#CAMERA_IP}) is disconnected'
        priority: HIGH
        manual_close: 'NO'
        description: The camera has not reported the Connected state for the configured period. Check camera power, network connectivity, credentials,
          and NVR channel configuration.
        tags:
        - tag: scope
          value: availability
        - tag: camera
          value: '{#CAMERA_NAME}'
    - uuid: 4fbffa8c329f49de882c85c88b3a2618
      name: 'NVR: Disk discovery'
      type: SNMP_AGENT
      snmp_oid: discovery[{#DISKNAME},1.3.6.1.4.1.1004849.2.4.1.1.4]
      key: bcs.nvr.disk.discovery
      delay: 10m
      lifetime: 7d
      description: Discovers physical storage volumes exposed by the NVR.
      item_prototypes:
      - uuid: eda628fa3fef46d0bde1c7a47d6c1ed9
        name: 'Disk {#DISKNAME}: Status'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.4.1.1004849.2.4.1.1.5.{#SNMPINDEX}
        key: bcs.nvr.disk.status[{#SNMPINDEX}]
        delay: 2m
        history: 30d
        value_type: CHAR
        trends: '0'
        tags:
        - tag: component
          value: storage
      trigger_prototypes:
      - uuid: 1302f52169334d409ba5fb391912cdbf
        expression: last(/BCS NVR by SNMP/bcs.nvr.disk.status[{#SNMPINDEX}])<>"{$BCS.NVR.DISK.STATUS.OK}"
        name: 'BCS NVR: Disk {#DISKNAME} is not Running'
        priority: HIGH
        manual_close: 'NO'
        description: The physical disk status differs from the expected healthy status.
        tags:
        - tag: scope
          value: availability
    tags:
    - tag: class
      value: device
    - tag: target
      value: bcs
    - tag: target
      value: nvr
    macros:
    - macro: '{$BCS.NVR.NODATA.TIME}'
      value: 5m
      description: Time without NVR uptime data before the SNMP availability trigger fires.
    - macro: '{$BCS.NVR.CAMERA.OFFLINE.TIME}'
      value: 3m
      description: Time a camera must remain without a Connected state before the camera availability trigger fires.
    - macro: '{$BCS.NVR.DISK.STATUS.OK}'
      value: Running
      description: Expected healthy physical disk status returned by the NVR.
    - macro: '{$BCS.NVR.VOLUME.STATUS.OK}'
      value: LvAvailable
      description: Expected healthy logical volume status returned by the NVR.
    dashboards:
    - uuid: 71b98383031b45d4973d3fd582a7d8f5
      name: BCS NVR overview
      pages:
      - name: Overview
        widgets:
        - type: item
          name: NVR uptime
          width: '24'
          height: '4'
          hide_header: 'YES'
          fields:
          - type: STRING
            name: description
            value: NVR uptime
          - type: ITEM
            name: itemid.0
            value:
              host: BCS NVR by SNMP
              key: bcs.nvr.uptime
          - type: INTEGER
            name: show.0
            value: '1'
          - type: INTEGER
            name: show.1
            value: '2'
          - type: STRING
            name: reference
            value: BCS01
        - type: item
          name: Logical volumes health
          x: '24'
          width: '24'
          height: '4'
          hide_header: 'YES'
          fields:
          - type: STRING
            name: description
            value: Logical volumes health
          - type: ITEM
            name: itemid.0
            value:
              host: BCS NVR by SNMP
              key: bcs.nvr.storage.logical_volumes.health
          - type: INTEGER
            name: show.0
            value: '1'
          - type: INTEGER
            name: show.1
            value: '2'
          - type: STRING
            name: reference
            value: BCS02
        - type: problems
          name: Current problems
          y: '4'
          width: '48'
          height: '6'
          fields:
          - type: STRING
            name: reference
            value: BCS03
