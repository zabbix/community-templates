          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var r = JSON.parse(value); var o = Array.isArray(r) ? r[0] : r;
                  if (!o || (o.code !== undefined && Number(o.code)  !== 0) || o.error || !o.value) throw 'Invalid API response';
                  var arr=o.value.status; if (!Array.isArray(arr))  throw 'Discovery array unavailable';
                  var out = [];
                  for (var i = 0; i < arr.length;  i++) {
                    var  c = arr[i];
                    if (c.online == 1 || c.name || c.typeInfo)  {
                      out.push({
                        "{#CAMERA.CHANNEL}" : String(c.channel),
                         "{#CAMERA.NAME}": c.name || ("Channel " + c.channel),
                        "{#CAMERA.TYPE}" : c.typeInfo ||  ""
                      });
                    }
                  }
                  return JSON.stringify({"data": out});
