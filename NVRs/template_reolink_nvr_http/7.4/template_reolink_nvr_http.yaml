                  expression: 'nodata(/Reolink NVR by HTTP/reolink.camera.recording.raw[{#CAMERA.CHANNEL}],6h)=1'
                  name: 'Reolink camera {#CAMERA.CHANNEL} [{#CAMERA.NAME}] recording check unavailable'
                  priority: HIGH
          master_item:
