        value_type: TEXT
        history: '0'
        trends: '0'
        preprocessing:
        - type: JSONPATH
          parameters:
          - $[?(@['lld-id'] == "{#LLD.ID}")].first()
          error_handler: DISCARD_VALUE
        master_item:
