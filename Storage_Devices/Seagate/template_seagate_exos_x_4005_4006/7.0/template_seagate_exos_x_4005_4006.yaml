            if (mode === 'disabled') return false;
            if (mode === 'enabled') return true;
            var b = String(sys['product-brand'] || '').toLowerCase(), s = String(sys['scsi-product-id'] || '');
            return b.indexOf('exos') >= 0 || s === '4006';
