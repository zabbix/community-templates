zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 748ad4d098d447d492bb935c907f652f
      name: Templates/Databases
  templates:
    - uuid: 2e7c78a294e54acebf5ac55f07c18190
      template: 'Redis 8 by Zabbix agent 2'
      name: 'Redis 8 by Zabbix agent 2'
      description: |
        Redis monitoring through the Redis plugin of Zabbix agent 2, for Redis 8 with or without authentication.
        
        Authentication:
        - no auth: leave {$REDIS.USERNAME} and {$REDIS.PASSWORD} empty;
        - requirepass: set {$REDIS.PASSWORD} only (the plugin logs in as the "default" user);
        - ACL user: set both {$REDIS.USERNAME} and {$REDIS.PASSWORD};
        - or put the credentials in an agent 2 named session and set {$REDIS.CONN.URI} to the session name.
        
        Requires Zabbix agent 2 7.0.10 or newer (the username parameter of the redis.* keys).
        
        Based on the official Zabbix template "Redis by Zabbix agent 2" 7.0-4. Changes: own template name and UUIDs, passwords masked in the "Get config" item.
      vendor:
        name: Community
        version: 7.0-1
      groups:
        - name: Templates/Databases
      items:
        - uuid: 0c890842ecc048cc88265c2fac89e092
          name: 'Blocked clients'
          type: DEPENDENT
          key: redis.clients.blocked
          delay: '0'
          description: 'Retrieves blocked clients from the Redis server.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.blocked_clients
          master_item:
            key: redis.clients.info_raw
          tags:
            - tag: component
              value: connections
        - uuid: d5015fbb957945dba4fba88d73c35c45
          name: 'Connected clients'
          type: DEPENDENT
          key: redis.clients.connected
          delay: '0'
          description: 'Monitors the number of active Redis server clients.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.connected_clients
          master_item:
            key: redis.clients.info_raw
          tags:
            - tag: component
              value: connections
        - uuid: 7c8401e51ce54e6da0c7a63612c395a8
          name: 'Get Client info'
          type: DEPENDENT
          key: redis.clients.info_raw
          delay: '0'
          history: '0'
          value_type: TEXT
          trends: '0'
          description: 'Extracts client-related information from the Redis server.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.Clients
              error_handler: DISCARD_VALUE
          master_item:
            key: 'redis.info["{$REDIS.CONN.URI}","{$REDIS.PASSWORD}","{$REDIS.SECTION}","{$REDIS.USERNAME}"]'
          tags:
            - tag: component
              value: raw
        - uuid: 92bcc1c9f07742608d63e3d5616aec94
          name: 'Max input buffer'
          type: DEPENDENT
          key: redis.clients.max_input_buffer
          delay: '0'
          description: 'Monitors maximum input buffer size of Redis server clients.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var clients = JSON.parse(value)
                  return clients.client_recent_max_input_buffer || clients.client_biggest_input_buf
          master_item:
            key: redis.clients.info_raw
          tags:
            - tag: component
              value: connections
        - uuid: 57f92677fad94daeaeae858af77f725d
          name: 'Max output buffer'
          type: DEPENDENT
          key: redis.clients.max_output_buffer
          delay: '0'
          description: 'Monitors maximum output buffer size of Redis server clients.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var clients = JSON.parse(value)
                  return clients.client_recent_max_output_buffer || clients.client_longest_output_list
          master_item:
            key: redis.clients.info_raw
          tags:
            - tag: component
              value: connections
        - uuid: 6d67b73e2a814630ade543573eb63c93
          name: 'Cluster enabled'
          type: DEPENDENT
          key: redis.cluster.enabled
          delay: '0'
          description: 'Indicates if Redis server cluster mode is enabled.'
          valuemap:
            name: 'Redis flag'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.Cluster.cluster_enabled
          master_item:
            key: 'redis.info["{$REDIS.CONN.URI}","{$REDIS.PASSWORD}","{$REDIS.SECTION}","{$REDIS.USERNAME}"]'
          tags:
            - tag: component
              value: system
        - uuid: 4958a4797fc147109f547471bd62afcc
          name: 'Max clients'
          type: DEPENDENT
          key: redis.config.maxclients
          delay: '0'
          description: |
            Max number of connected clients at the same time.
            Once the limit is reached Redis will close all the new connections sending an error "max number of clients reached".
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.maxclients
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 30m
          master_item:
            key: 'redis.config["{$REDIS.CONN.URI}","{$REDIS.PASSWORD}","{$REDIS.PATTERN}","{$REDIS.USERNAME}"]'
          tags:
            - tag: component
              value: connections
        - uuid: c3fec0aec6b246c2ab91f8b81118e13f
          name: 'Get config'
          key: 'redis.config["{$REDIS.CONN.URI}","{$REDIS.PASSWORD}","{$REDIS.PATTERN}","{$REDIS.USERNAME}"]'
          history: 1h
          value_type: TEXT
          trends: '0'
          description: |
            Redis server configuration (CONFIG GET {$REDIS.PATTERN}).
            Values of requirepass, masterauth, tls-key-file-pass and tls-client-key-file-pass are replaced with "******" before they are stored.
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var config;
                  try {
                      config = JSON.parse(value);
                  }
                  catch (e) {
                      return value;
                  }
                  if (config === null || typeof config !== 'object') {
                      return value;
                  }
                  ['requirepass', 'masterauth', 'tls-key-file-pass', 'tls-client-key-file-pass'].forEach(function (name) {
                      if (config[name]) {
                          config[name] = '******';
                      }
                  });
                  return JSON.stringify(config);
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          tags:
            - tag: component
              value: raw
          triggers:
            - uuid: 8c7a1fcf3da44a3b8939dc136715d99a
              expression: 'last(/Redis 8 by Zabbix agent 2/redis.config["{$REDIS.CONN.URI}","{$REDIS.PASSWORD}","{$REDIS.PATTERN}","{$REDIS.USERNAME}"],#1)<>last(/Redis 8 by Zabbix agent 2/redis.config["{$REDIS.CONN.URI}","{$REDIS.PASSWORD}","{$REDIS.PATTERN}","{$REDIS.USERNAME}"],#2) and length(last(/Redis 8 by Zabbix agent 2/redis.config["{$REDIS.CONN.URI}","{$REDIS.PASSWORD}","{$REDIS.PATTERN}","{$REDIS.USERNAME}"]))>0'
              name: 'Redis: Configuration has changed'
              priority: INFO
              description: 'Redis configuration has changed. Acknowledge to close the problem manually.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
        - uuid: a1689c0b1dca44498e83906dfe984e87
          name: 'Get CPU info'
          type: DEPENDENT
          key: redis.cpu.info_raw
          delay: '0'
          history: '0'
          value_type: TEXT
          trends: '0'
          description: 'Extracts CPU usage data from the Redis server.'
