              name: 'Memory RSS overhead ratio{#SINGLETON}'
              type: DEPENDENT
              key: 'redis.memory.rss_overhead_ratio[{#SINGLETON}]'
              delay: '0'
              value_type: FLOAT
              description: 'Memory RSS overhead ratio on the Redis server.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.rss_overhead_ratio
              master_item:
                key: redis.memory.info_raw
              tags:
                - tag: component
                  value: memory
            - uuid: ca0a5b83fd6b4e13b5b7e6dbf1f17337
              name: 'Memory used scripts{#SINGLETON}'
              type: DEPENDENT
              key: 'redis.memory.used_memory_scripts[{#SINGLETON}]'
              delay: '0'
              description: 'Memory used by scripts on the Redis server.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.used_memory_scripts
              master_item:
                key: redis.memory.info_raw
              tags:
                - tag: component
                  value: memory
          trigger_prototypes:
            - uuid: 761e486c8fe04f5ea0da45babbf75a6e
              expression: 'min(/Redis 8 by Zabbix agent 2/redis.memory.allocator_rss_ratio[{#SINGLETON}],15m)>{$REDIS.MEM.ALLOC_RSS_RATIO.MAX.WARN} and last(/Redis 8 by Zabbix agent 2/redis.memory.allocator_rss_bytes[{#SINGLETON}])>{$REDIS.MEM.ALLOC_RSS_BYTES.MIN}'
              name: 'Redis: Allocator RSS ratio is too high'
              event_name: 'Redis: Allocator RSS ratio is too high (over {$REDIS.MEM.ALLOC_RSS_RATIO.MAX.WARN} in 15m)'
              priority: WARNING
              description: |
                Ratio between allocator_resident and allocator_active.
                Indicates pages that the allocator can and probably will soon release
                back to the OS. If sustained, consider running MEMORY PURGE.
              tags:
                - tag: scope
                  value: performance
            - uuid: b4bc395f0ed24b4aa2018d7f1f35548f
              expression: 'min(/Redis 8 by Zabbix agent 2/redis.memory.allocator_frag_ratio[{#SINGLETON}],15m)>{$REDIS.MEM.ALLOC_FRAG_RATIO.MAX.WARN} and last(/Redis 8 by Zabbix agent 2/redis.memory.allocator_frag_bytes[{#SINGLETON}])>{$REDIS.MEM.ALLOC_FRAG_BYTES.MIN}'
              name: 'Redis: Memory allocator fragmentation is too high'
              event_name: 'Redis: Memory allocator fragmentation is too high (over {$REDIS.MEM.ALLOC_FRAG_RATIO.MAX.WARN} in 15m)'
              priority: WARNING
              description: |
                Memory fragmentation at the allocator level indicates how efficiently the memory allocator is using physical memory:
                  - Value over 1.5 means the allocator has significantly more fragmented memory than necessary.
                    Consider enabling active defragmentation (activedefrag yes) or restarting Redis to reclaim fragmented memory.
                  - Low fragmentation (close to 1.0) is normal and expected.
              tags:
                - tag: scope
                  value: performance
            - uuid: 4fb8d12bcaa449589637a7469d311c9b
              expression: 'min(/Redis 8 by Zabbix agent 2/redis.memory.rss_overhead_ratio[{#SINGLETON}],15m)>{$REDIS.MEM.RSS_OVERHEAD_RATIO.MAX.WARN} and last(/Redis 8 by Zabbix agent 2/redis.memory.rss_overhead_bytes[{#SINGLETON}])>{$REDIS.MEM.RSS_OVERHEAD_BYTES.MIN}'
              name: 'Redis: RSS overhead ratio is too high'
              event_name: 'Redis: RSS overhead ratio is too high (over {$REDIS.MEM.RSS_OVERHEAD_RATIO.MAX.WARN} in 15m)'
              priority: WARNING
              description: |
                Ratio between used_memory_rss (the process RSS) and allocator_resident.
                Includes RSS overheads that are not allocator or heap related.
                If sustained, investigate persistence configuration (BGSAVE frequency, AOF rewrite settings).
              tags:
                - tag: scope
                  value: performance
          master_item:
            key: redis.server.info_raw
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.redis_version
            - type: JAVASCRIPT
              parameters:
                - 'return JSON.stringify(parseInt(value.split(''.'')[0]) >= 5 ? [{''{#SINGLETON}'': ''''}] : []);'
