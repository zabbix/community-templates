zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: a571c0d144b14fd4a87a9d9b2aa9fcd6
    name: Templates/Applications
  templates:
  - uuid: 64f2e8a8ca334025b2ca87aacfc18c6f
    template: SentinelOne by HTTP
    name: SentinelOne by HTTP
    vendor:
      name: Rémi Piazza
      version: 7.0-6
    description: 'Monitors the status of the SentinelOne agent installed on a machine through the SentinelOne Management Console REST API (v2.1), using a script master item and dependent items. No external
      script is required.


      Setup:

      1. In the SentinelOne console, create a service user with the Viewer role (Settings > Users > Service Users) and generate its API token.

      2. Set the macros {$SENTINELONE.URL} and {$SENTINELONE.TOKEN} (secret), preferably on a parent template or on the host group.

      3. Make sure the DNS name field of the host interface is filled: the DNS name (or its short name) must match the computer name in SentinelOne.

      4. Link the template to the host.


      See the README file for details.


      Author: Rémi Piazza (remipiazza).'
    groups:
    - name: Templates/Applications
    items:
    - uuid: 57c050a352f045c7a379fb5fc9c203bc
      name: 'SentinelOne: Get agent'
      type: SCRIPT
      key: sentinelone.agent.get
      delay: '{$SENTINELONE.INTERVAL}'
      history: '0'
      trends: '0'
      value_type: TEXT
      timeout: '{$SENTINELONE.TIMEOUT}'
      description: Looks up the agent in the SentinelOne Management Console by exact computer name, trying in order the DNS name of the host interface as is, then its short name (part before the first dot,
        as is and then in upper case), and stops at the first match. The DNS name of the host interface is required. This covers agents registered with the short name (usually Windows) as well as with the
        FQDN (usually Linux). The result is reduced to the fields used by the dependent items.
      params: "var CTlsConfig = function (raw_value) {\n\traw_value = String(raw_value).trim().toLowerCase();\n\n\tif (['none', 'peer', 'full'].indexOf(raw_value) === -1) {\n\t\traw_value = 'full';\n\t\
        }\n\n\tthis.options = {\n\t\tSSLVerifyPeer: (raw_value === 'peer' || raw_value === 'full'),\n\t\tSSLVerifyHost: (raw_value === 'full')\n\t};\n};\n\nfunction shortName(name) {\n\treturn String(typeof\
        \ name === 'undefined' ? '' : name).split('.')[0];\n}\n\ntry {\n\tvar params = JSON.parse(value);\n\n\t['url', 'token'].forEach(function (field) {\n\t\tif (typeof params[field] === 'undefined' ||\
        \ params[field] === '') {\n\t\t\tthrow 'Required param is not set: \"' + field + '\".';\n\t\t}\n\t});\n\n\tvar base = String(params.url).replace(/\\/+$/, '') + params.path,\n\t\ttls = new CTlsConfig(params.tls_verify),\n\
        \t\tcandidates = [];\n\n\t// Names tried in order: DNS name as is, its short name, its short name in upper case.\n\t[params.dns, shortName(params.dns), shortName(params.dns).toUpperCase()].forEach(function\
        \ (name) {\n\t\tname = String(typeof name === 'undefined' ? '' : name).trim();\n\n\t\tif (name !== '' && name.charAt(0) !== '{' && candidates.indexOf(name) === -1) {\n\t\t\tcandidates.push(name);\n\
        \t\t}\n\t});\n\n\tif (candidates.length === 0) {\n\t\tthrow 'No name to look up: fill in the DNS name of the host interface.';\n\t}\n\n\tvar found = null,\n\t\ttotal = 0,\n\t\ttried = [];\n\n\t\
        for (var i = 0; i < candidates.length; i++) {\n\t\tvar request = new HttpRequest(tls.options),\n\t\t\turl = base + '/agents?limit=1&computerName=' + encodeURIComponent(candidates[i]),\n\t\t\tresponse,\n\
        \t\t\tjson;\n\n\t\trequest.addHeader('Accept: application/json');\n\t\trequest.addHeader('Authorization: ApiToken ' + params.token);\n\n\t\tif (typeof params.proxy === 'string' && params.proxy !==\
        \ '') {\n\t\t\trequest.setProxy(params.proxy);\n\t\t}\n\n\t\tZabbix.log(4, '[ SentinelOne ] Sending request: ' + url);\n\t\tresponse = request.get(url);\n\t\tZabbix.log(4, '[ SentinelOne ] Received\
        \ response with status code ' + request.getStatus());\n\n\t\tif (request.getStatus() !== 200) {\n\t\t\tthrow 'Request failed with status code ' + request.getStatus() + ': ' + response;\n\t\t}\n\n\
        \t\ttry {\n\t\t\tjson = JSON.parse(response);\n\t\t}\n\t\tcatch (error) {\n\t\t\tthrow 'Failed to parse the response received from the console.';\n\t\t}\n\n\t\ttried.push(candidates[i]);\n\t\ttotal\
        \ = (json.pagination && json.pagination.totalItems) || 0;\n\n\t\tif (total > 0 && Array.isArray(json.data) && json.data.length > 0) {\n\t\t\tfound = json.data[0];\n\t\t\tbreak;\n\t\t}\n\t}\n\n\t\
        // Actions required by the console, and whether a restart is needed.\n\tvar actions = [];\n\n\tif (found !== null && Array.isArray(found.userActionsNeeded)) {\n\t\tfound.userActionsNeeded.forEach(function\
        \ (action) {\n\t\t\tactions.push((typeof action === 'string') ? action : JSON.stringify(action));\n\t\t});\n\t}\n\n\tvar result = {\n\t\tpagination: {totalItems: (found === null) ? 0 : total},\n\
        \t\tdata: [],\n\t\tlookup: {tried: tried, matched: (found === null) ? null : found.computerName}\n\t};\n\n\tif (found !== null) {\n\t\tresult.data.push({\n\t\t\tcomputerName: found.computerName,\n\
        \t\t\tisActive: found.isActive,\n\t\t\tinfected: found.infected,\n\t\t\tactiveThreats: found.activeThreats,\n\t\t\tnetworkStatus: found.networkStatus,\n\t\t\toperationalState: found.operationalState,\n\
        \t\t\toperationalStateExpiration: found.operationalStateExpiration,\n\t\t\tagentVersion: found.agentVersion,\n\t\t\tisUpToDate: found.isUpToDate,\n\t\t\tlastActiveDate: found.lastActiveDate,\n\t\
        \t\trebootNeeded: (found.threatRebootRequired === true || actions.indexOf('reboot_needed') !== -1 || actions.indexOf('reboot_required') !== -1) ? 1 : 0,\n\t\t\tunprotected: (actions.indexOf('unprotected')\
        \ !== -1) ? 1 : 0,\n\t\t\tactionsNeeded: (actions.length > 0) ? actions.join(', ') : 'none'\n\t\t});\n\t}\n\n\treturn JSON.stringify(result);\n}\ncatch (error) {\n\terror += (String(error).endsWith('.'))\
        \ ? '' : '.';\n\tZabbix.log(3, '[ SentinelOne ] ERROR: ' + error);\n\tthrow 'Requesting failed: ' + error;\n}\n"
      parameters:
      - name: dns
        value: '{HOST.DNS}'
      - name: path
        value: '{$SENTINELONE.API.PATH}'
      - name: proxy
        value: '{$SENTINELONE.HTTP.PROXY}'
      - name: tls_verify
        value: '{$HTTP.TLS.VERIFY:"SentinelOne"}'
      - name: token
        value: '{$SENTINELONE.TOKEN}'
      - name: url
        value: '{$SENTINELONE.URL}'
      tags:
      - tag: component
        value: raw
      - tag: target
        value: sentinelone
    - uuid: 6c537fdd6e9d40c59c9b96876ff0e0c7
      name: 'SentinelOne: Agents found'
      type: DEPENDENT
      key: sentinelone.agent.found
      delay: '0'
      value_type: UNSIGNED
      description: Number of agents returned by the console for this host (pagination.totalItems). 0 means the machine is not in the console, more than 1 means duplicate agents. Not discarded with a heartbeat
        because the "No data from API" trigger relies on it.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.pagination.totalItems
        error_handler: DISCARD_VALUE
      master_item:
        key: sentinelone.agent.get
      tags:
      - tag: component
        value: application
      - tag: target
        value: sentinelone
      triggers:
      - uuid: 49c250c835294646b8afae139b1ec032
        expression: nodata(/SentinelOne by HTTP/sentinelone.agent.found,{$SENTINELONE.NODATA_TIMEOUT})=1
        name: 'SentinelOne: No data from API'
        priority: WARNING
        description: 'The API request has not returned data for the configured period. Possible causes: expired or revoked API token, wrong console URL or API path, network or proxy issue, API rate limiting.
          Check the error of the "SentinelOne: Get agent" item.'
        tags:
        - tag: scope
          value: availability
        - tag: target
          value: sentinelone
      - uuid: 3920350c58d540cc9593b8e28742eed4
        expression: last(/SentinelOne by HTTP/sentinelone.agent.found)=0
        name: 'SentinelOne: Agent not found in console'
        priority: HIGH
        description: 'No agent in the console matches the DNS name of the host or its short name: the agent is not installed, was removed or decommissioned, the machine was renamed, or the DNS name of the
          host does not match the SentinelOne computer name. Check the DNS name of the host interface and the console inventory.'
        tags:
        - tag: scope
          value: availability
        - tag: target
          value: sentinelone
        dependencies:
        - name: 'SentinelOne: No data from API'
          expression: nodata(/SentinelOne by HTTP/sentinelone.agent.found,{$SENTINELONE.NODATA_TIMEOUT})=1
      - uuid: d6017f01c2b844638c2c1abc9852e091
        expression: last(/SentinelOne by HTTP/sentinelone.agent.found)>1
        name: 'SentinelOne: Duplicate agents in console'
        opdata: 'Agents found: {ITEM.LASTVALUE1}'
        priority: INFO
        description: More than one agent has the same name in the console; only the first one is read. Remove the stale entry in the console.
        tags:
        - tag: scope
          value: notice
        - tag: target
          value: sentinelone
    - uuid: 45e75e7c598143ad870945b269bc6301
      name: 'SentinelOne: Agent active'
      type: DEPENDENT
      key: sentinelone.agent.active
      delay: '0'
      value_type: UNSIGNED
      trends: '0'
      valuemap:
        name: SentinelOne Yes/No
      description: Whether the agent is currently connected to the management console (isActive).
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data[0].isActive
        error_handler: DISCARD_VALUE
      - type: BOOL_TO_DECIMAL
        parameters:
        - ''
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: sentinelone.agent.get
      tags:
      - tag: component
        value: network
      - tag: target
        value: sentinelone
      triggers:
      - uuid: 59275d5966d543fda51366d8a95d68b6
        expression: last(/SentinelOne by HTTP/sentinelone.agent.active)=0 and last(/SentinelOne by HTTP/sentinelone.agent.found)>0
        name: 'SentinelOne: Agent is not active'
        priority: AVERAGE
        description: The agent is not connected to the console. The agent service may be stopped, the machine powered off, or the connection to the console blocked. Check the machine and the agent service.
        tags:
        - tag: scope
          value: availability
        - tag: target
          value: sentinelone
        dependencies:
        - name: 'SentinelOne: Agent not found in console'
          expression: last(/SentinelOne by HTTP/sentinelone.agent.found)=0
    - uuid: a00eadc0147246db9f0d6a866d2bd21c
      name: 'SentinelOne: Network status'
      type: DEPENDENT
      key: sentinelone.agent.network_status
      delay: '0'
      value_type: UNSIGNED
      trends: '0'
      valuemap:
        name: SentinelOne network status
      description: Network state reported by the console (networkStatus). The value "disconnected" indicates that the machine is isolated from the network by SentinelOne (network quarantine). Unrecognized
        values are stored as 0.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data[0].networkStatus
        error_handler: DISCARD_VALUE
      - type: JAVASCRIPT
        parameters:
        - '// 0 reserved for unknown values

          const idx = {''connected'': 1, ''connecting'': 2, ''disconnected'': 3, ''disconnecting'': 4};

          return typeof idx[value] === ''undefined'' ? 0 : idx[value];'
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: sentinelone.agent.get
      tags:
      - tag: component
        value: network
      - tag: target
        value: sentinelone
      triggers:
      - uuid: f379b673c5da435bbffba80af0631538
        expression: last(/SentinelOne by HTTP/sentinelone.agent.network_status)=3 and last(/SentinelOne by HTTP/sentinelone.agent.active)=1
        name: 'SentinelOne: Machine is network-quarantined'
        priority: HIGH
        description: The machine is isolated from the network by SentinelOne (network quarantine). Check that the isolation is intended and release it from the console when appropriate.
        tags:
        - tag: scope
          value: security
        - tag: target
          value: sentinelone
    - uuid: fe9a8f8829e6414aa4efa3ac83fe588a
      name: 'SentinelOne: Last active'
      type: DEPENDENT
      key: sentinelone.agent.last_active
      delay: '0'
      value_type: UNSIGNED
      units: unixtime
      description: Date of the last communication between the agent and the console (lastActiveDate).
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data[0].lastActiveDate
        error_handler: DISCARD_VALUE
      - type: JAVASCRIPT
        parameters:
        - 'var v = String(value).replace(/\.\d+Z$/, ''Z'');

          var t = Date.parse(v);

          if (isNaN(t)) throw ''Invalid date: '' + value;

          return Math.floor(t / 1000);'
      master_item:
        key: sentinelone.agent.get
      tags:
      - tag: component
        value: network
      - tag: target
        value: sentinelone
      triggers:
      - uuid: 0160ef2fe6cc41738be2725cbb07076a
        expression: (now()-last(/SentinelOne by HTTP/sentinelone.agent.last_active))>{$SENTINELONE.LAST_ACTIVE.MAX.WARN} and last(/SentinelOne by HTTP/sentinelone.agent.found)>0
        name: 'SentinelOne: No recent activity'
        priority: WARNING
        description: The agent has not communicated with the console for longer than the period defined by {$SENTINELONE.LAST_ACTIVE.MAX.WARN}. Check the machine, the agent service and the connectivity.
        tags:
        - tag: scope
          value: availability
        - tag: target
          value: sentinelone
        dependencies:
        - name: 'SentinelOne: Agent is not active'
          expression: last(/SentinelOne by HTTP/sentinelone.agent.active)=0 and last(/SentinelOne by HTTP/sentinelone.agent.found)>0
    - uuid: 1d15ccbce21645ccb6eff4b10cc6e3e2
      name: 'SentinelOne: Infected'
      type: DEPENDENT
      key: sentinelone.agent.infected
      delay: '0'
      value_type: UNSIGNED
      trends: '0'
      valuemap:
        name: SentinelOne Yes/No
      description: Whether the agent reports the machine as infected (infected).
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data[0].infected
        error_handler: DISCARD_VALUE
      - type: BOOL_TO_DECIMAL
        parameters:
        - ''
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: sentinelone.agent.get
      tags:
      - tag: component
        value: application
      - tag: target
        value: sentinelone
      triggers:
      - uuid: 971ad0b463eb4092989dfb8527b5ac1e
        expression: last(/SentinelOne by HTTP/sentinelone.agent.infected)=1 or last(/SentinelOne by HTTP/sentinelone.agent.threats)>0
        name: 'SentinelOne: Active threat detected'
        opdata: 'Infected: {ITEM.LASTVALUE1}, active threats: {ITEM.LASTVALUE2}'
        priority: HIGH
        description: The agent reports an infected machine or active threats. Review the threat in the SentinelOne console and follow the incident response procedure.
        tags:
        - tag: scope
          value: security
        - tag: target
          value: sentinelone
    - uuid: 7a4d2548ac2441a5b6cce36bcb91e8e7
      name: 'SentinelOne: Active threats'
      type: DEPENDENT
      key: sentinelone.agent.threats
      delay: '0'
      value_type: UNSIGNED
      description: Number of active threats on the machine (activeThreats).
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data[0].activeThreats
        error_handler: DISCARD_VALUE
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: sentinelone.agent.get
      tags:
      - tag: component
        value: application
      - tag: target
        value: sentinelone
    - uuid: c42453d395d643eba134122dbd31bc8b
      name: 'SentinelOne: Operational state'
      type: DEPENDENT
      key: sentinelone.agent.operational_state
      delay: '0'
      value_type: UNSIGNED
      trends: '0'
      valuemap:
        name: SentinelOne operational state
      description: 'Operational state of the agent (operationalState). "na" is the normal state; any other value means the agent was disabled, fully or partially, from the console. Observed values: na,
        partially_disabled; fully_disabled and disabled_error are mapped as well. Unrecognized values are stored as 0.'
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data[0].operationalState
        error_handler: DISCARD_VALUE
      - type: JAVASCRIPT
        parameters:
        - '// 0 reserved for unknown values

          const idx = {''na'': 1, ''partially_disabled'': 2, ''fully_disabled'': 3, ''disabled_error'': 4};

          return typeof idx[value] === ''undefined'' ? 0 : idx[value];'
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: sentinelone.agent.get
      tags:
      - tag: component
        value: application
      - tag: target
        value: sentinelone
      triggers:
      - uuid: 92b9e4655c33474596467d7f3db42bc0
        expression: last(/SentinelOne by HTTP/sentinelone.agent.operational_state)<>1 and last(/SentinelOne by HTTP/sentinelone.agent.found)>0 and last(/SentinelOne by HTTP/sentinelone.agent.operational_state.raw)<>"na"
        name: 'SentinelOne: Agent is disabled'
        opdata: 'Operational state: {ITEM.LASTVALUE1}, raw value: {ITEM.LASTVALUE3}'
        priority: HIGH
        description: The agent was disabled, fully or partially, from the console, so the machine may be unprotected while the agent still reports to the console. Check who disabled it and re-enable it;
          the "Operational state expiration" item shows when a temporary state ends.
        tags:
        - tag: scope
          value: security
        - tag: target
          value: sentinelone
    - uuid: 4730fba993d44ae3b3bb355164c825f9
      name: 'SentinelOne: Operational state expiration'
      type: DEPENDENT
      key: sentinelone.agent.operational_state.expiration
      delay: '0'
      value_type: UNSIGNED
      units: unixtime
      description: Date at which a temporary disabled state ends (operationalStateExpiration). 0 if there is no expiration.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data[0].operationalStateExpiration
        error_handler: DISCARD_VALUE
      - type: JAVASCRIPT
        parameters:
        - 'if (value === ''null'' || value === '''' || value === null) return 0;

          var v = String(value).replace(/\.\d+Z$/, ''Z'');

          var t = Date.parse(v);

          if (isNaN(t)) throw ''Invalid date: '' + value;

          return Math.floor(t / 1000);'
      master_item:
        key: sentinelone.agent.get
      tags:
      - tag: component
        value: application
      - tag: target
        value: sentinelone
    - uuid: 0ee57937f494412b925a6761f2532ad2
      name: 'SentinelOne: Operational state (raw value)'
      type: DEPENDENT
      key: sentinelone.agent.operational_state.raw
      delay: '0'
      value_type: CHAR
      trends: '0'
      description: Operational state as returned by the console (operationalState), without conversion. Use it to identify an unexpected state that the "Operational state" item shows as "Unknown".
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data[0].operationalState
        error_handler: DISCARD_VALUE
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: sentinelone.agent.get
      tags:
      - tag: component
        value: application
      - tag: target
        value: sentinelone
    - uuid: 52245b65773d456686b9ebbd85e7f8ed
      name: 'SentinelOne: Agent version'
      type: DEPENDENT
      key: sentinelone.agent.version
      delay: '0'
      value_type: CHAR
      trends: '0'
      description: Agent version (agentVersion).
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data[0].agentVersion
        error_handler: DISCARD_VALUE
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: sentinelone.agent.get
      tags:
      - tag: component
        value: application
      - tag: target
        value: sentinelone
    - uuid: ab027a5723f5454599c78794b0b9fbcf
      name: 'SentinelOne: Agent up to date'
      type: DEPENDENT
      key: sentinelone.agent.up_to_date
      delay: '0'
      value_type: UNSIGNED
      trends: '0'
      valuemap:
        name: SentinelOne Yes/No
      description: Whether the agent runs the latest version available in the console (isUpToDate).
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data[0].isUpToDate
        error_handler: DISCARD_VALUE
      - type: BOOL_TO_DECIMAL
        parameters:
        - ''
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: sentinelone.agent.get
      tags:
      - tag: component
        value: application
      - tag: target
        value: sentinelone
      triggers:
      - uuid: 1d8e164630ab41bc9c0886f0cee564d9
        expression: last(/SentinelOne by HTTP/sentinelone.agent.up_to_date)=0 and last(/SentinelOne by HTTP/sentinelone.agent.version)<>"" and last(/SentinelOne by HTTP/sentinelone.agent.found)>0
        name: 'SentinelOne: Agent is not up to date'
        opdata: 'Agent version: {ITEM.LASTVALUE2}'
        priority: INFO
        description: The agent is not at the latest version available in the console. Plan an upgrade according to your agent upgrade policy.
        tags:
        - tag: scope
          value: notice
        - tag: target
          value: sentinelone
    - uuid: 0313a91fba4c4444ab4a457392c1aeee
      name: 'SentinelOne: Reboot needed'
      type: DEPENDENT
      key: sentinelone.agent.reboot_needed
      delay: '0'
      value_type: UNSIGNED
      trends: '0'
      valuemap:
        name: SentinelOne Yes/No
      description: 'Whether a restart of the machine is needed: the console reports the action "reboot_needed" or "reboot_required" in userActionsNeeded, or a reboot is required to complete the remediation
        of a threat (threatRebootRequired).'
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data[0].rebootNeeded
        error_handler: DISCARD_VALUE
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters: &id001
        - 1h
      master_item:
        key: sentinelone.agent.get
      tags:
      - tag: component
        value: system
      - tag: target
        value: sentinelone
      triggers:
      - uuid: d5ae31e904a34e82b382137559576392
        expression: last(/SentinelOne by HTTP/sentinelone.agent.reboot_needed)=1 and last(/SentinelOne by HTTP/sentinelone.agent.found)>0
        name: 'SentinelOne: Reboot needed'
        priority: WARNING
        description: The console asks for a restart of the machine, or a restart is required to complete the remediation of a threat. Restart the machine during the next maintenance window. The "Actions
          needed" item lists all the actions required by the console.
        tags:
        - tag: scope
          value: security
        - tag: target
          value: sentinelone
    - uuid: a99eaab439da474395abf9a958fa4b59
      name: 'SentinelOne: Actions needed'
      type: DEPENDENT
      key: sentinelone.agent.actions_needed
      delay: '0'
      value_type: CHAR
      trends: '0'
      description: Actions that the console requires on the machine (userActionsNeeded), separated by commas, or "none". See the SentinelOne API documentation for the possible values, for example reboot_needed,
        reboot_required, upgrade_needed, unprotected, pending_performance_insights.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data[0].actionsNeeded
        error_handler: DISCARD_VALUE
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters: *id001
      master_item:
        key: sentinelone.agent.get
      tags:
      - tag: component
        value: application
      - tag: target
        value: sentinelone
