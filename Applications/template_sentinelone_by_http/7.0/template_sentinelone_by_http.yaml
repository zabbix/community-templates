    macros:
    - macro: '{$SENTINELONE.URL}'
      value: ''
      description: SentinelOne Management Console URL without trailing slash, e.g., https://example.sentinelone.net.
    - macro: '{$SENTINELONE.TOKEN}'
      value: ''
      type: SECRET_TEXT
      description: API token of a read-only (Viewer) service user.
    - macro: '{$SENTINELONE.API.PATH}'
      value: /web/api/v2.1
      description: Sub-path of the SentinelOne REST API.
    - macro: '{$SENTINELONE.HTTP.PROXY}'
      value: ''
      description: HTTP proxy for the API requests. If empty, no proxy is used.
    - macro: '{$SENTINELONE.INTERVAL}'
      value: 10m
      description: Update interval of the API request.
    - macro: '{$SENTINELONE.TIMEOUT}'
      value: 30s
      description: Timeout of the script that queries the API (up to three requests).
    - macro: '{$SENTINELONE.NODATA_TIMEOUT}'
      value: 30m
      description: Period without data after which the "No data from API" trigger fires.
    - macro: '{$SENTINELONE.LAST_ACTIVE.MAX.WARN}'
      value: 1h
      description: Maximum time since the last agent communication before the "No recent activity" trigger fires.
    - macro: '{$HTTP.TLS.VERIFY}'
      value: full
      description: 'TLS certificate verification for the script item: "none" - disabled, "peer" - verify the certificate chain and expiration, "full" - full verification. Any other value enables full verification.
        To override the setting for this template only, define the macro with the context "SentinelOne", e.g. {$HTTP.TLS.VERIFY:"SentinelOne"}.'
    valuemaps:
    - uuid: a6813ae967b446adb04b13ee68ce00df
      name: SentinelOne Yes/No
      mappings:
      - value: '0'
        newvalue: 'No'
      - value: '1'
        newvalue: 'Yes'
    - uuid: 308ac48f2f2f4919ae0ef741a405f23e
      name: SentinelOne network status
      mappings:
      - value: '0'
        newvalue: Unknown
      - value: '1'
        newvalue: Connected
      - value: '2'
        newvalue: Connecting
      - value: '3'
        newvalue: Disconnected (network quarantine)
      - value: '4'
        newvalue: Disconnecting
    - uuid: 0c8c0443fe2b46ed83f8279443e59786
      name: SentinelOne operational state
      mappings:
      - value: '0'
        newvalue: Unknown
      - value: '1'
        newvalue: Normal
      - value: '2'
        newvalue: Partially disabled
      - value: '3'
        newvalue: Fully disabled
      - value: '4'
        newvalue: Disabled (error)
