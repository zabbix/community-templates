                  parameters:
                    - |
                      try {
                          var data = JSON.parse(value);
                          return data._zbx_cbes_error === true ? 0 : 1;
                      } catch (e) {
                          return 0;
                      }
              master_item:
                key: 'cbes.metrics.get["{#ESR.NAME}","{#ESR.PORT}"]'
              valuemap:
