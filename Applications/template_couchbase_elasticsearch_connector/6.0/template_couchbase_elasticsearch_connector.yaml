              key: 'cbes.collection.status["{#ESR.NAME}","{#ESR.PORT}"]'
              delay: '0'
              history: '{$CBES.HISTORY.STATUS}'
              trends: '0'
              description: 'Indicates whether the latest HTTP response is a valid CBES metrics payload containing every required v1 metric.'
              preprocessing:
