zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 846977d1dfed4968bc5f8bdb363285bc
      name: 'Templates/Applications'
    - uuid: 9a8b161e6ea443b5b300a59a3fe69ece
      name: 'Templates/Network services'
  templates:
    - uuid: 22b975348cd340c4987a1ee61481c8b6
      template: template_speedtest_multiplatform
      name: 'Speedtest Multiplatform (Ookla CLI)'
      description: |
        Multiplatform internet speed and network quality monitoring template for Zabbix 7.0 using official Ookla Speedtest CLI.
        Supports Windows (native PowerShell / .bat) and Linux (Bash / Python).
        Receives measurement JSON directly via zabbix_sender or raw TCP socket into a master trapper item (speedtest.json) and parses metrics using JSONPath preprocessing.

        Upstream repository & AI-setup-ready protocol:
        https://github.com/qryuu/speedtest-to-zabbix
      groups:
        - name: 'Templates/Applications'
        - name: 'Templates/Network services'
      items:
        - uuid: 602a3cd356e744c2ad02a72a37fa3eda
          name: 'Speedtest: Raw JSON Data'
          type: TRAP
          key: speedtest.json
          delay: '0'
          history: '0'
          value_type: TEXT
          trends: '0'
          description: 'Master trapper item receiving raw Speedtest CLI JSON output.'
          tags:
            - tag: Application
              value: Speedtest
        - uuid: 5bace2b5aebd44a18efe562164d451f5
          name: 'Speedtest: Download Bandwidth'
          type: DEPENDENT
          key: speedtest.download.bps
          delay: '0'
          history: 90d
          units: bps
          description: 'Internet download speed calculated in bits per second (bps).'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.download.bandwidth
            - type: MULTIPLIER
              parameters:
                - '8'
          master_item:
            key: speedtest.json
          tags:
            - tag: Application
              value: Speedtest
          triggers:
            - uuid: bc452cc537944cb8b079333023858520
              expression: 'last(/template_speedtest_multiplatform/speedtest.download.bps)<{$SPEEDTEST.WARN.DOWN} and {$SPEEDTEST.WARN.DOWN}>0'
              name: 'Speedtest: Download speed is low ({ITEM.LASTVALUE} < {$SPEEDTEST.WARN.DOWN})'
              priority: WARNING
              description: 'Download bandwidth dropped below the warning threshold.'
              manual_close: 'YES'
        - uuid: b61b176e5269477a8594072b1dc25421
          name: 'Speedtest: Upload Bandwidth'
          type: DEPENDENT
          key: speedtest.upload.bps
          delay: '0'
          history: 90d
          units: bps
          description: 'Internet upload speed calculated in bits per second (bps).'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.upload.bandwidth
            - type: MULTIPLIER
              parameters:
                - '8'
          master_item:
            key: speedtest.json
          tags:
            - tag: Application
              value: Speedtest
          triggers:
            - uuid: 38202f1cc401489892739834a86f6f5a
              expression: 'last(/template_speedtest_multiplatform/speedtest.upload.bps)<{$SPEEDTEST.WARN.UP} and {$SPEEDTEST.WARN.UP}>0'
              name: 'Speedtest: Upload speed is low ({ITEM.LASTVALUE} < {$SPEEDTEST.WARN.UP})'
              priority: WARNING
              description: 'Upload bandwidth dropped below the warning threshold.'
              manual_close: 'YES'
        - uuid: ef7970ba8c7149eeba7cdaa701235a59
          name: 'Speedtest: Ping Latency (Idle)'
          type: DEPENDENT
          key: speedtest.ping.latency
          delay: '0'
          history: 90d
          value_type: FLOAT
          units: ms
          description: 'Idle ping round-trip latency in milliseconds.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.ping.latency
          master_item:
            key: speedtest.json
          tags:
            - tag: Application
              value: Speedtest
          triggers:
            - uuid: 4c6e5aaeb40a490e8f4777819dbdba25
              expression: 'last(/template_speedtest_multiplatform/speedtest.ping.latency)>{$SPEEDTEST.WARN.PING} and {$SPEEDTEST.WARN.PING}>0'
              name: 'Speedtest: Ping latency is high ({ITEM.LASTVALUE} > {$SPEEDTEST.WARN.PING}ms)'
              priority: WARNING
              description: 'Idle ping round-trip latency exceeded warning threshold.'
              manual_close: 'YES'
        - uuid: 418dfb17574c42b293f7ce25ef6d4339
          name: 'Speedtest: Ping Jitter'
          type: DEPENDENT
          key: speedtest.ping.jitter
          delay: '0'
          history: 90d
          value_type: FLOAT
          units: ms
          description: 'Idle ping jitter variation in milliseconds.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.ping.jitter
          master_item:
            key: speedtest.json
          tags:
            - tag: Application
              value: Speedtest
        - uuid: f8d267a6a7634efc967110c45288dfee
          name: 'Speedtest: Download Latency (Bufferbloat IQM)'
          type: DEPENDENT
          key: speedtest.download.latency
          delay: '0'
          history: 90d
          value_type: FLOAT
          units: ms
          description: 'Ping latency during active download test (bufferbloat indicators).'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.download.latency.iqm
              error_handler: DISCARD_VALUE
          master_item:
            key: speedtest.json
          tags:
            - tag: Application
              value: Speedtest
        - uuid: 0ff5cb27b17f4f6aa3bc0f6ea6579086
          name: 'Speedtest: Upload Latency (Bufferbloat IQM)'
          type: DEPENDENT
          key: speedtest.upload.latency
          delay: '0'
          history: 90d
          value_type: FLOAT
          units: ms
          description: 'Ping latency during active upload test (bufferbloat indicators).'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.upload.latency.iqm
              error_handler: DISCARD_VALUE
          master_item:
            key: speedtest.json
          tags:
            - tag: Application
              value: Speedtest
        - uuid: d01780745b5a4bb4ae6650c144791987
          name: 'Speedtest: Packet Loss'
          type: DEPENDENT
          key: speedtest.packetloss
          delay: '0'
          history: 90d
          value_type: FLOAT
          units: '%'
          description: 'Packet loss percentage during the test.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.packetLoss
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
          master_item:
            key: speedtest.json
          tags:
            - tag: Application
              value: Speedtest
          triggers:
            - uuid: 16cf912909ff4022a156aaeb69bdc2ee
              expression: 'last(/template_speedtest_multiplatform/speedtest.packetloss)>{$SPEEDTEST.WARN.LOSS} and {$SPEEDTEST.WARN.LOSS}>0'
              name: 'Speedtest: Packet loss detected ({ITEM.LASTVALUE} > {$SPEEDTEST.WARN.LOSS}%)'
              priority: WARNING
              description: 'Packet loss exceeded the warning threshold.'
              manual_close: 'YES'
        - uuid: 7975438f6baf4692a7d2c213b17ae3f5
          name: 'Speedtest: Download Data Consumed'
          type: DEPENDENT
          key: speedtest.download.bytes
          delay: '0'
          history: 90d
          units: B
          description: 'Total data consumed during the download phase.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.download.bytes
          master_item:
            key: speedtest.json
          tags:
            - tag: Application
              value: Speedtest
        - uuid: 26d8b34e5e894e8fae7ebf301dbe32c7
          name: 'Speedtest: Upload Data Consumed'
          type: DEPENDENT
          key: speedtest.upload.bytes
          delay: '0'
          history: 90d
          units: B
          description: 'Total data consumed during the upload phase.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.upload.bytes
          master_item:
            key: speedtest.json
          tags:
            - tag: Application
              value: Speedtest
        - uuid: 9d053c2a87f24247abc834a3b3307583
          name: 'Speedtest: Server Name'
          type: DEPENDENT
          key: speedtest.server.name
          delay: '0'
          history: 90d
          value_type: CHAR
          trends: '0'
          description: 'Name of the tested Speedtest server.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.server.name
          master_item:
            key: speedtest.json
          tags:
            - tag: Application
              value: Speedtest
        - uuid: 134848637e7b409982850e70edb8f6ce
          name: 'Speedtest: Server ID'
          type: DEPENDENT
          key: speedtest.server.id
          delay: '0'
          history: 90d
          description: 'Ookla ID of the tested Speedtest server.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.server.id
          master_item:
            key: speedtest.json
          tags:
            - tag: Application
              value: Speedtest
        - uuid: 7a551f91ddd046738fdebe3ad13b954b
          name: 'Speedtest: Result URL'
          type: DEPENDENT
          key: speedtest.result.url
          delay: '0'
          history: 90d
          value_type: CHAR
          trends: '0'
          description: 'Public web URL for the measurement result on speedtest.net.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.result.url
          master_item:
            key: speedtest.json
          tags:
            - tag: Application
              value: Speedtest
      macros:
        - macro: '{$SPEEDTEST.NODATA}'
          value: 3h
          description: 'No data threshold duration for warning trigger.'
        - macro: '{$SPEEDTEST.WARN.DOWN}'
          value: 50M
          description: 'Low download speed threshold (set to 0 to disable).'
        - macro: '{$SPEEDTEST.WARN.UP}'
          value: 20M
          description: 'Low upload speed threshold (set to 0 to disable).'
        - macro: '{$SPEEDTEST.WARN.PING}'
          value: '50'
          description: 'High ping latency threshold in ms (set to 0 to disable).'
        - macro: '{$SPEEDTEST.WARN.LOSS}'
          value: '2'
          description: 'Packet loss threshold in percent (set to 0 to disable).'
  triggers:
    - uuid: 8201bfbb18b74f949a35394ae64776e7
      expression: 'nodata(/template_speedtest_multiplatform/speedtest.json,{$SPEEDTEST.NODATA})=1'
      name: 'Speedtest: No data received for {$SPEEDTEST.NODATA}'
      priority: WARNING
      description: 'Speedtest measurement data has not been received. Verify scheduler/cron or network connectivity.'
      manual_close: 'YES'
  graphs:
    - uuid: 3f9348960d4d4103918db53e3cb741e2
      name: 'Speedtest: Bandwidth (Download / Upload)'
      graph_items:
        - drawtype: BOLD_LINE
          color: 1A7C11
          item:
            host: template_speedtest_multiplatform
            key: speedtest.download.bps
        - sortorder: '1'
          drawtype: BOLD_LINE
          color: 2774A4
          item:
            host: template_speedtest_multiplatform
            key: speedtest.upload.bps
    - uuid: 9718dbcb47bd42fc84c5f8f3c250044f
      name: 'Speedtest: Latency and Jitter Quality'
      graph_items:
        - drawtype: BOLD_LINE
          color: F63100
          item:
            host: template_speedtest_multiplatform
            key: speedtest.ping.latency
        - sortorder: '1'
          drawtype: LINE
          color: F6C400
          item:
            host: template_speedtest_multiplatform
            key: speedtest.ping.jitter
        - sortorder: '2'
          drawtype: LINE
          color: 0288D1
          item:
            host: template_speedtest_multiplatform
            key: speedtest.download.latency
        - sortorder: '3'
          drawtype: LINE
          color: 7B1FA2
          item:
            host: template_speedtest_multiplatform
            key: speedtest.upload.latency
    - uuid: 9e91ca8276604ed8b6003181b619e2d1
      name: 'Speedtest: Packet Loss Rate'
      ymin_type_1: FIXED
      ymax_type_1: FIXED
      yaxismin: '0'
      yaxismax: '100'
      graph_items:
        - drawtype: GRADIENT_LINE
          color: E45959
          item:
            host: template_speedtest_multiplatform
            key: speedtest.packetloss
