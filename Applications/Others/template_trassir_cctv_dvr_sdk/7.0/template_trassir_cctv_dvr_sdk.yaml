zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: d37f71c7e3f7469bab645852a69a2018
      name: 'Templates/Video surveillance'
  templates:
    - uuid: 42a2facaca644e54a34dba8a9c5b6581
      template: Trassir-server
      name: Trassir-server
      description: |
        Monitoring of a TRASSIR CCTV server (DVR/NVR/VMS) via the TRASSIR SDK web API.
        A single HTTP agent item requests "/health"; everything else is a dependent item.

        Setup: enable the web server and SDK on the TRASSIR server, set an SDK password
        and put it into the {$TRASSIR_SDK_PASS} macro on the host.

        Exported in Zabbix 7.0 format, tested on Zabbix 7.4.
      groups:
        - name: 'Templates/Video surveillance'
      items:
        - uuid: 8fdfb98d71544b7ba9b432d4fdfe47bd
          name: 'Trassir automation status'
          type: DEPENDENT
          key: trassirautomation
          delay: '0'
          history: 7d
          description: 'Whether errors occurred while executing scripts (automation) on the server.'
          valuemap:
            name: 'Trassir status'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.automation
          master_item:
            key: trassirhealthjson
          tags:
            - tag: component
              value: automation
          triggers:
            - uuid: 444892c4fd774cacb16c66386f26d294
              expression: 'max(/Trassir-server/trassirautomation,#2)=0'
              name: 'Trassir server automation problem'
              opdata: 'Current state: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: 'Whether errors occurred while executing scripts (automation) on the server.'
              manual_close: 'YES'
        - uuid: da4af92c5d6b424ea1780c9125dee63a
          name: 'Trassir channels online'
          type: DEPENDENT
          key: trassirchannelsonline
          delay: '0'
          history: 7d
          description: 'Number of channels (cameras) working without errors.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.channels_online
          master_item:
            key: trassirhealthjson
          tags:
            - tag: component
              value: channels
        - uuid: b8ef5164e72c4ede82dfc88de8c3a3d9
          name: 'Trassir channels offline'
          type: DEPENDENT
          key: trassirchannelsoffline
          delay: '0'
          history: 7d
          description: 'Number of channels (cameras) that are not working: total minus online.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  var total = parseInt(data.channels_total, 10);
                  var online = parseInt(data.channels_online, 10);
                  if (isNaN(total) || isNaN(online)) {
                      throw 'channels_total or channels_online is missing in the response';
                  }
                  return Math.max(total - online, 0);
          master_item:
            key: trassirhealthjson
          tags:
            - tag: component
              value: channels
        - uuid: 3752de694fb748588950c6f868d362d2
          name: 'Trassir channels total'
          type: DEPENDENT
          key: trassirchannelstotal
          delay: '0'
          history: 7d
          description: 'Total number of channels (cameras) connected to the server.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.channels_total
          master_item:
            key: trassirhealthjson
          tags:
            - tag: component
              value: channels
        - uuid: 5b913634270243c5bc8f0d5d9f775538
          name: 'Trassir server cpu load'
          type: DEPENDENT
          key: trassircpuload
          delay: '0'
          history: 7d
          value_type: FLOAT
          units: '%'
          description: 'Current CPU load of the server, in %.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.cpu_load
          master_item:
            key: trassirhealthjson
          tags:
            - tag: component
              value: cpu
          triggers:
            - uuid: db8c0ee9d85a41d0aa582ae3bfdeee10
              expression: 'avg(/Trassir-server/trassircpuload,#5)>{$TRASSIR_CPU_LOAD_MAX}'
              name: 'Trassir server cpu load too high'
              opdata: 'Current load: {ITEM.LASTVALUE1}'
              priority: HIGH
              description: 'Average CPU load over the last 5 checks is above {$TRASSIR_CPU_LOAD_MAX}%.'
        - uuid: ea42107e33614ad5b11f951b5d4b2ea4
          name: 'Trassir database status'
          type: DEPENDENT
          key: trassirdatabase
          delay: '0'
          history: 7d
          description: 'Whether there are errors in the connection to the server database.'
          valuemap:
            name: 'Trassir status'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.database
          master_item:
            key: trassirhealthjson
          tags:
            - tag: component
              value: database
          triggers:
            - uuid: 44e151c9578049a79c9aaf6cf238e6e9
              expression: 'max(/Trassir-server/trassirdatabase,#2)=0'
              name: 'Trassir server database problem'
              opdata: 'Current state: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: 'Whether there are errors in the connection to the server database.'
              manual_close: 'YES'
        - uuid: b3d7de55a71f49d8903569b51a1a9cd8
          name: 'Trassir disks status'
          type: DEPENDENT
          key: trassirdisks
          delay: '0'
          history: 7d
          description: 'Whether there are errors in the operation of the server archive disks.'
          valuemap:
            name: 'Trassir status'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.disks
          master_item:
            key: trassirhealthjson
          tags:
            - tag: component
              value: disks
          triggers:
            - uuid: 12d86dbd79e649ff9c414ae233d4729c
              expression: 'max(/Trassir-server/trassirdisks,#2)=0'
              name: 'Trassir server disks problem'
              opdata: 'Current state: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: 'Whether there are errors in the operation of the server archive disks.'
              manual_close: 'YES'
        - uuid: 9d26182fe0a34f6aae270ce7f96b77e0
          name: 'Trassir archive main days depth'
          type: DEPENDENT
          key: trassirdisksstatmaindays
          delay: '0'
          history: 7d
          value_type: FLOAT
          units: '!days'
          description: 'Current archive depth of the main stream, in days.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.disks_stat_main_days
          master_item:
            key: trassirhealthjson
          tags:
            - tag: component
              value: archive
          triggers:
            - uuid: 1a5e907d7f89400b86bce9be439d90e8
              expression: 'max(/Trassir-server/trassirdisksstatmaindays,#5)<{$TRASSIR_ARCHIVE_DEPTH}'
              name: 'Archive depth on main channels is too low'
              opdata: 'Current depth: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: 'Archive depth of the main stream is below {$TRASSIR_ARCHIVE_DEPTH} days. Note: this also fires on a freshly installed server until the archive fills up.'
        - uuid: bd1f452b9788434bb0e9766860bbf361
          name: 'Trassir server health string'
          type: HTTP_AGENT
          key: trassirhealthjson
          delay: 60s
          history: 1d
          trends: '0'
          value_type: TEXT
          description: 'Raw JSON returned by the TRASSIR SDK "/health" endpoint. Master item for all other items of the template.'
          preprocessing:
            - type: REGEX
              parameters:
                - '\{(\n|.)*\}'
                - \0
          url: '{$TRASSIR_SCHEME}://{HOST.CONN}:{$TRASSIR_SDK_PORT}/health'
          query_fields:
            - name: password
              value: '{$TRASSIR_SDK_PASS}'
          follow_redirects: 'NO'
          tags:
            - tag: component
              value: raw
          triggers:
            - uuid: 0398afbad41543c39b79e31183f7959b
              expression: 'nodata(/Trassir-server/trassirhealthjson,5m)=1'
              name: 'No new data from trassir server'
              priority: HIGH
              description: 'No data has been received from the TRASSIR SDK for 5 minutes. Check that the server is running, the web server/SDK is enabled and the scheme and port macros are correct.'
        - uuid: 8874b34efd4e483784793e5be4c1166f
          name: 'Trassir archive privilege days depth'
          type: DEPENDENT
          key: trassirdisksstatprivdays
          delay: '0'
          history: 7d
          value_type: FLOAT
          units: '!days'
          description: 'Current archive depth of the privileged channels, in days.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.disks_stat_priv_days
          master_item:
            key: trassirhealthjson
          tags:
            - tag: component
              value: archive
        - uuid: 4842ec56043b4acc9929a2c4a62e4c11
          name: 'Trassir archive sub days depth'
          type: DEPENDENT
          key: trassirdisksstatsubsdays
          delay: '0'
          history: 7d
          value_type: FLOAT
          units: '!days'
          description: 'Current archive depth of the sub stream, in days.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.disks_stat_subs_days
          master_item:
            key: trassirhealthjson
          tags:
            - tag: component
              value: archive
        - uuid: 4abd0b2ed030474d9d01cc6a4e932975
          name: 'Trassir network status'
          type: DEPENDENT
          key: trassirnetwork
          delay: '0'
          history: 7d
          description: 'Whether there are errors in network connections to other servers.'
          valuemap:
            name: 'Trassir status'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.network
          master_item:
            key: trassirhealthjson
          tags:
            - tag: component
              value: network
          triggers:
            - uuid: 920f239fea494c648604b5b58a4b1f80
              expression: 'max(/Trassir-server/trassirnetwork,#2)=0'
              name: 'Trassir server network problem'
              opdata: 'Current state: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: 'Whether there are errors in network connections to other servers.'
              manual_close: 'YES'
        - uuid: 6a1316a24d0d403eb826c5cc06895e47
          name: 'Trassir SDK connection status'
          type: DEPENDENT
          key: trassirsdkstatus
          delay: '0'
          history: 7d
          description: 'Whether the SDK answered with valid health data (1) or with an error such as a wrong password (0).'
          valuemap:
            name: 'Trassir status'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  return JSON.parse(value).error_code ? 0 : 1;
          master_item:
            key: trassirhealthjson
          tags:
            - tag: component
              value: health
          triggers:
            - uuid: 58e8e1eafc2840819b7e4a1c3e6e7824
              expression: |
                last(/Trassir-server/trassirsdkstatus)=0 and
                nodata(/Trassir-server/trassirsdkstatus,5m)=0
              name: 'Wrong data from trassir server'
              priority: HIGH
              description: 'The server answered with an error instead of health data. Check the SDK password macro.'
              dependencies:
                - name: 'No new data from trassir server'
                  expression: 'nodata(/Trassir-server/trassirhealthjson,5m)=1'
        - uuid: 5d38f48a7418423492b33f683b064883
          name: 'Trassir server uptime'
          type: DEPENDENT
          key: trassiruptime
          delay: '0'
          history: 7d
          units: uptime
          description: 'Time since the TRASSIR server was started.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.uptime
          master_item:
            key: trassirhealthjson
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: 6e046ecf56b540f09b18890fd43da52d
              expression: 'last(/Trassir-server/trassiruptime)<300'
              name: 'Trassir server was restarted'
              opdata: 'Uptime: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'Server uptime is less than 5 minutes.'
              manual_close: 'YES'
      macros:
        - macro: '{$TRASSIR_ARCHIVE_DEPTH}'
          value: '7'
          description: 'Minimal acceptable archive depth of the main stream, in days.'
        - macro: '{$TRASSIR_CPU_LOAD_MAX}'
          value: '85'
          description: 'CPU load threshold for the high CPU load trigger, in %.'
        - macro: '{$TRASSIR_SCHEME}'
          value: https
          description: 'Request scheme of the TRASSIR web server: https or http.'
        - macro: '{$TRASSIR_SDK_PASS}'
          type: SECRET_TEXT
          description: 'TRASSIR SDK password. Required.'
        - macro: '{$TRASSIR_SDK_PORT}'
          value: '8080'
          description: 'Port of the TRASSIR web server / SDK.'
      dashboards:
        - uuid: 51f3443622184c67836a8008ea3af6c1
          name: 'Trassir server overview'
          pages:
            - widgets:
              - type: item
                name: 'SDK status'
                width: '18'
                height: '3'
                fields:
                  - type: ITEM
                    name: itemid.0
                    value:
                      host: Trassir-server
                      key: trassirsdkstatus
              - type: item
                name: 'Channels online'
                x: '18'
                width: '18'
                height: '3'
                fields:
                  - type: INTEGER
                    name: decimal_places
                    value: '0'
                  - type: ITEM
                    name: itemid.0
                    value:
                      host: Trassir-server
                      key: trassirchannelsonline
              - type: item
                name: 'Channels offline'
                x: '36'
                width: '18'
                height: '3'
                fields:
                  - type: INTEGER
                    name: decimal_places
                    value: '0'
                  - type: ITEM
                    name: itemid.0
                    value:
                      host: Trassir-server
                      key: trassirchannelsoffline
              - type: item
                name: 'Uptime'
                x: '54'
                width: '18'
                height: '3'
                fields:
                  - type: ITEM
                    name: itemid.0
                    value:
                      host: Trassir-server
                      key: trassiruptime
              - type: graph
                y: '3'
                width: '36'
                height: '5'
                fields:
                  - type: GRAPH
                    name: graphid.0
                    value:
                      host: Trassir-server
                      name: 'Trassir channels'
                  - type: STRING
                    name: reference
                    value: TRSAA
              - type: graph
                x: '36'
                y: '3'
                width: '36'
                height: '5'
                fields:
                  - type: GRAPH
                    name: graphid.0
                    value:
                      host: Trassir-server
                      name: 'Trassir archive depth'
                  - type: STRING
                    name: reference
                    value: TRSAB
              - type: graph
                y: '8'
                width: '72'
                height: '5'
                fields:
                  - type: GRAPH
                    name: graphid.0
                    value:
                      host: Trassir-server
                      name: 'Trassir server cpu load'
                  - type: STRING
                    name: reference
                    value: TRSAC
      valuemaps:
        - uuid: 0e05e6c3829e44abb8588264fbacc276
          name: 'Trassir status'
          mappings:
            - value: '0'
              newvalue: Errors
            - value: '1'
              newvalue: OK
  triggers:
    - uuid: dc5de920278b463a99239e83b7de8451
      expression: 'last(/Trassir-server/trassirchannelstotal)>max(/Trassir-server/trassirchannelsonline,#5)'
      name: 'Not all cams online on trassir server'
      opdata: 'Online: {ITEM.LASTVALUE2} of {ITEM.LASTVALUE1}'
      priority: AVERAGE
      description: 'For the last 5 checks the number of online channels has been lower than the total number of channels.'
  graphs:
    - uuid: 37238e3ed233486d9ab6286a57157ee9
      name: 'Trassir archive depth'
      graph_items:
        - color: 199C0D
          item:
            host: Trassir-server
            key: trassirdisksstatmaindays
        - sortorder: '1'
          color: F63100
          item:
            host: Trassir-server
            key: trassirdisksstatsubsdays
        - sortorder: '2'
          color: 2774A4
          item:
            host: Trassir-server
            key: trassirdisksstatprivdays
    - uuid: 3991c8fbd74d4db682a193c37bd9b7bb
      name: 'Trassir channels'
      graph_items:
        - color: 2774A4
          item:
            host: Trassir-server
            key: trassirchannelstotal
        - sortorder: '1'
          color: 199C0D
          item:
            host: Trassir-server
            key: trassirchannelsonline
        - sortorder: '2'
          color: F63100
          item:
            host: Trassir-server
            key: trassirchannelsoffline
    - uuid: 3b29c57326dd45f599e0ddf8266091e4
      name: 'Trassir server cpu load'
      show_work_period: 'NO'
      ymin_type_1: FIXED
      ymax_type_1: FIXED
      graph_items:
        - drawtype: FILLED_REGION
          color: 199C0D
          item:
            host: Trassir-server
            key: trassircpuload
