zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: a1b2c3d4e5f64789a0b1c2d3e4f5a601
      name: Templates/Applications
  templates:
    - uuid: a1b2c3d4e5f64789a0b1c2d3e4f5a602
      template: 'AllSwap API by HTTP'
      name: 'AllSwap API by HTTP'
      description: |
        Monitors AllSwap non-custodial cross-chain swap API health, HTTP availability, and response latency across multi-chain routing endpoints.
        Homepage: https://allswap.io/
      vendor:
        name: AllSwap
        version: 7.0-0
      groups:
        - name: Templates/Applications
      items:
        - uuid: a1b2c3d4e5f64789a0b1c2d3e4f5a603
          name: 'AllSwap API: Health status'
          type: HTTP_AGENT
          key: allswap.api.health
          delay: 1m
          history: 7d
          trends: 30d
          value_type: UNSIGNED
          url: '{$ALLSWAP.API.URL}'
          timeout: '{$ALLSWAP.API.TIMEOUT}'
          status_codes: '200'
          follow_redirects: YES
          retrieve_mode: BODY
          output_format: RAW
          triggers:
            - uuid: a1b2c3d4e5f64789a0b1c2d3e4f5a604
              expression: 'last(/AllSwap API by HTTP/allswap.api.health)=0'
              name: 'AllSwap API: Health check returned empty or unreachable'
              priority: HIGH
              description: 'The AllSwap API endpoint did not return a valid HTTP 200 health response.'
      macros:
        - macro: '{$ALLSWAP.API.URL}'
          value: 'https://allswap.io/api/v1/health'
          description: 'AllSwap Partner/Health API endpoint URL.'
        - macro: '{$ALLSWAP.API.TIMEOUT}'
          value: 5s
          description: 'HTTP request timeout for API health check.'
