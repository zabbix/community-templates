              name: 'Immich: Queue [{#QUEUE.NAME}] jobs'
              graph_items:
                - color: 2774A4
                  item:
                    host: 'Immich by HTTP'
                    key: 'immich.queue.jobs.active[{#QUEUE.NAME}]'
                - sortorder: '1'
