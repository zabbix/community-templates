                  item:
                    host: 'Immich by HTTP'
                    key: 'immich.queue.jobs.waiting[{#QUEUE.NAME}]'
                - sortorder: '2'
                  color: 8E44AD
                  item:
                    host: 'Immich by HTTP'
                    key: 'immich.queue.jobs.delayed[{#QUEUE.NAME}]'
                - sortorder: '3'
