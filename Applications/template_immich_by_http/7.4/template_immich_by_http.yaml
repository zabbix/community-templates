        - uuid: 200ec06308e843f5a2c3dda856cbb538
          name: 'Immich: Users discovery'
          type: DEPENDENT
          key: immich.user.discovery
          description: 'Discovers Immich users from the admin users endpoint.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  var result = [];

                  (data.users || []).forEach(function (user) {
                    result.push({
                      id: user.id,
                      name: user.name,
                      email: user.email,
                      status: user.status
                    });
                  });

                  return JSON.stringify(result);
          master_item:
            key: immich.get
          lld_macro_paths:
            - lld_macro: '{#USER.ID}'
              path: $.id
            - lld_macro: '{#USER.NAME}'
              path: $.name
            - lld_macro: '{#USER.EMAIL}'
              path: $.email
            - lld_macro: '{#USER.STATUS}'
              path: $.status
          filter:
            evaltype: AND
            conditions:
              - macro: '{#USER.STATUS}'
                value: '{$IMMICH.LLD.USER.STATUS.MATCHES}'
                formulaid: A
              - macro: '{#USER.NAME}'
                value: '{$IMMICH.LLD.USER.NAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
          item_prototypes:
