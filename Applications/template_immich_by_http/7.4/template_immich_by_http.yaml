              newvalue: 'Current or unknown'
            - value: '1'
              newvalue: 'Update available'
        - uuid: 3211d97011304e65bd6a3a7dfe08f8c6
          name: 'Immich queue pause state'
          mappings:
            - value: '0'
              newvalue: Running
            - value: '1'
              newvalue: Paused
        - uuid: 884b1ade4878429ea4fa6226d765b6b1
          name: 'Immich user status'
          mappings:
            - value: '0'
              newvalue: Active
            - value: '1'
