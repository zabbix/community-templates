zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: a571c0d144b14fd4a87a9d9b2aa9fcd6
      name: Templates/Applications
  templates:
    - uuid: abfc7db1a16f42c28bab6cb272285568
      template: Servarr by HTTP
      name: Servarr by HTTP
      description: |-
        The whole Servarr stack: links all application templates.
        For a part of the stack, link only the application templates to the host instead.

        Author: noakky
        https://github.com/noakky/zabbix-template-servarr
      vendor:
        name: noakky
        version: 7.0-1
      templates:
        - name: Prowlarr by HTTP
        - name: Sonarr by HTTP
        - name: Radarr by HTTP
        - name: Lidarr by HTTP
        - name: Bazarr by HTTP
        - name: Overseerr by HTTP
      groups:
        - name: Templates/Applications
      tags:
        - tag: class
          value: software
        - tag: target
          value: servarr
    - uuid: 2d4ddaf5e3fc4cc582bf91a8cfe694bd
      template: Prowlarr by HTTP
      name: Prowlarr by HTTP
      description: |-
        The template to monitor Prowlarr and its indexers by HTTP.
        Set {$PROWLARR.URL} and {$PROWLARR.API.KEY}.

        Author: noakky
        https://github.com/noakky/zabbix-template-servarr
      vendor:
        name: noakky
        version: 7.0-1
      groups:
        - name: Templates/Applications
      items:
        - uuid: 0730fb77c8f84cea89a914969c8369f7
          name: 'Prowlarr: Service status'
          type: HTTP_AGENT
          key: prowlarr.service.status
          trends: '0'
          valuemap:
            name: Service state
          description: Response of the ping endpoint.
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |-
                  var data = JSON.parse(value);
                  return data.status === "OK" ? 1 : 0;
          url: '{$PROWLARR.URL}/ping'
          http_proxy: '{$PROWLARR.HTTP.PROXY}'
          tags:
            - tag: component
              value: application
          triggers:
            - uuid: 9bca4327a54b4f4789560ca6d377e12b
              expression: nodata(/Prowlarr by HTTP/prowlarr.service.status,{$PROWLARR.STATUS.NODATA.TIMEOUT})=1 or last(/Prowlarr by HTTP/prowlarr.service.status)=0
              name: 'Prowlarr: Service is unavailable'
              priority: HIGH
              description: The service does not respond to ping.
              tags:
                - tag: scope
                  value: availability
        - uuid: 76b243ce81d7425a892dda399fcb6de2
          name: 'Prowlarr: Health issues'
          type: HTTP_AGENT
          key: prowlarr.health
          delay: 5m
          value_type: TEXT
          trends: '0'
          description: Issues from the health page.
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |-
                  var data = JSON.parse(value);
                  var lines = [];
                  for (var i = 0; i < data.length; i++) {
                      if (data[i].type !== 'ok' && !/^Indexer(LongTerm)?StatusCheck$/.test(data[i].source)) {
                          lines.push('[' + data[i].type.toUpperCase() + '] ' + data[i].source + ': ' + data[i].message);
                      }
                  }
                  return lines.length > 0 ? lines.join('\n') : 'OK';
          url: '{$PROWLARR.URL}/api/v1/health'
          http_proxy: '{$PROWLARR.HTTP.PROXY}'
          headers:
            - name: X-Api-Key
              value: '{$PROWLARR.API.KEY}'
          tags:
            - tag: component
              value: application
          triggers:
            - uuid: 2e8f6fc5d4af4c108dca9b7297f839b6
              expression: find(/Prowlarr by HTTP/prowlarr.health,,"like","[ERROR]")=1
              name: 'Prowlarr: Health check reports an error'
              opdata: '{ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: See operational data for details.
              dependencies:
                - name: 'Prowlarr: Service is unavailable'
                  expression: nodata(/Prowlarr by HTTP/prowlarr.service.status,{$PROWLARR.STATUS.NODATA.TIMEOUT})=1 or last(/Prowlarr by HTTP/prowlarr.service.status)=0
              tags:
                - tag: scope
                  value: availability
            - uuid: 6073c1dc770a4ae583b1cb05435ea688
              expression: find(/Prowlarr by HTTP/prowlarr.health,,"like","[WARNING]")=1
              name: 'Prowlarr: Health check reports a warning'
              opdata: '{ITEM.LASTVALUE1}'
              priority: WARNING
              description: See operational data for details.
              dependencies:
                - name: 'Prowlarr: Health check reports an error'
                  expression: find(/Prowlarr by HTTP/prowlarr.health,,"like","[ERROR]")=1
                - name: 'Prowlarr: Service is unavailable'
                  expression: nodata(/Prowlarr by HTTP/prowlarr.service.status,{$PROWLARR.STATUS.NODATA.TIMEOUT})=1 or last(/Prowlarr by HTTP/prowlarr.service.status)=0
              tags:
                - tag: scope
                  value: availability
        - uuid: e0c8a6e7165c46f28a14ebb59bd4d699
          name: 'Prowlarr: Update status'
          type: HTTP_AGENT
          key: prowlarr.update.status
          delay: 1h
          trends: '0'
          valuemap:
            name: Update status
          description: Whether a newer version can be installed.
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |-
                  var data = JSON.parse(value);
                  for (var i = 0; i < data.length; i++) {
                      if (data[i].latest === true) {
                          return data[i].installable === true ? 1 : 0;
                      }
                  }
                  return 0;
          url: '{$PROWLARR.URL}/api/v1/update'
          http_proxy: '{$PROWLARR.HTTP.PROXY}'
          headers:
            - name: X-Api-Key
              value: '{$PROWLARR.API.KEY}'
          tags:
            - tag: component
              value: application
          triggers:
            - uuid: 26f7a18f9f90460b856a438a214e9e8e
              expression: last(/Prowlarr by HTTP/prowlarr.update.status)=1
              name: 'Prowlarr: Update is available'
              priority: INFO
              description: A newer version can be installed.
              tags:
                - tag: scope
                  value: notice
        - uuid: 97bc3e6d40c3457e8dfebf4edc815aa7
          name: 'Prowlarr: Get indexers'
          type: HTTP_AGENT
          key: prowlarr.indexers.get
          delay: 5m
          history: '0'
          value_type: TEXT
          trends: '0'
          timeout: 30s
          description: Enabled indexers.
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |-
                  var data = JSON.parse(value);
                  var result = [];
                  for (var i = 0; i < data.length; i++) {
                      if (data[i].enable === true) {
                          result.push({ id: data[i].id, name: data[i].name });
                      }
                  }
                  return JSON.stringify(result);
          url: '{$PROWLARR.URL}/api/v1/indexer'
          http_proxy: '{$PROWLARR.HTTP.PROXY}'
          headers:
            - name: X-Api-Key
              value: '{$PROWLARR.API.KEY}'
          tags:
            - tag: component
              value: raw
        - uuid: 1ae86483193942588b7b6fbd813fcc48
          name: 'Prowlarr: Enabled indexers'
          type: DEPENDENT
          key: prowlarr.indexers.enabled
          delay: '0'
          description: Number of enabled indexers.
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - return JSON.parse(value).length;
          master_item:
            key: prowlarr.indexers.get
          tags:
            - tag: component
              value: application
        - uuid: c8f209d04ddc46658eda9ce45e9e9b63
          name: 'Prowlarr: Get blocked indexers'
          type: HTTP_AGENT
          key: prowlarr.indexer_status.get
          delay: 5m
          history: '0'
          value_type: TEXT
          trends: '0'
          description: Indexers blocked after failures.
          url: '{$PROWLARR.URL}/api/v1/indexerstatus'
          http_proxy: '{$PROWLARR.HTTP.PROXY}'
          headers:
            - name: X-Api-Key
              value: '{$PROWLARR.API.KEY}'
          tags:
            - tag: component
              value: raw
        - uuid: f06995b83de649ac869e15225cc5e4f4
          name: 'Prowlarr: Blocked indexers'
          type: DEPENDENT
          key: prowlarr.indexers.blocked
          delay: '0'
          description: Number of blocked indexers.
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - return JSON.parse(value).length;
          master_item:
            key: prowlarr.indexer_status.get
          tags:
            - tag: component
              value: application
      discovery_rules:
        - uuid: 44980a5c479749f08e225e400a6bf284
          name: Indexer discovery
          type: DEPENDENT
          key: prowlarr.indexer.discovery
          delay: '0'
          lifetime_type: DELETE_IMMEDIATELY
          lifetime: '0'
          description: Discovery of enabled indexers.
          item_prototypes:
            - uuid: 6dd9edabdbc848e581030032303fa631
              name: 'Prowlarr: Indexer [{#NAME}]: State'
              type: DEPENDENT
              key: prowlarr.indexer.state[{#ID}]
              delay: '0'
              trends: '0'
              valuemap:
                name: Indexer state
              description: Whether Prowlarr has blocked the indexer.
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |-
                      var data = JSON.parse(value);
                      for (var i = 0; i < data.length; i++) {
                          if (data[i].indexerId === {#ID}) {
                              return 1;
                          }
                      }
                      return 0;
              master_item:
                key: prowlarr.indexer_status.get
              tags:
                - tag: component
                  value: application
                - tag: indexer
                  value: '{#NAME}'
              trigger_prototypes:
                - uuid: 6fa8bf891da540658096c1c5bc9fe8e3
                  expression: min(/Prowlarr by HTTP/prowlarr.indexer.state[{#ID}],{$PROWLARR.INDEXER.BLOCKED.TIMEOUT:"{#NAME}"})=1
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: max(/Prowlarr by HTTP/prowlarr.indexer.state[{#ID}],{$PROWLARR.INDEXER.RECOVERY.TIMEOUT:"{#NAME}"})=0
                  name: 'Prowlarr: Indexer [{#NAME}]: Unavailable'
                  priority: AVERAGE
                  description: The indexer has been blocked for {$PROWLARR.INDEXER.BLOCKED.TIMEOUT:"{#NAME}"}.
                  dependencies:
                    - name: 'Prowlarr: All indexers are unavailable'
                      expression: last(/Prowlarr by HTTP/prowlarr.indexers.enabled)>0 and min(/Prowlarr by HTTP/prowlarr.indexers.blocked,{$PROWLARR.INDEXER.BLOCKED.TIMEOUT})>=last(/Prowlarr by HTTP/prowlarr.indexers.enabled)
                      recovery_expression: max(/Prowlarr by HTTP/prowlarr.indexers.blocked,{$PROWLARR.INDEXER.RECOVERY.TIMEOUT})<last(/Prowlarr by HTTP/prowlarr.indexers.enabled)
                  tags:
                    - tag: scope
                      value: availability
          master_item:
            key: prowlarr.indexers.get
          lld_macro_paths:
            - lld_macro: '{#ID}'
              path: $.id
            - lld_macro: '{#NAME}'
              path: $.name
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
      tags:
        - tag: class
          value: software
        - tag: target
          value: prowlarr
      macros:
        - macro: '{$PROWLARR.API.KEY}'
          type: SECRET_TEXT
          description: Prowlarr API key.
        - macro: '{$PROWLARR.API.NODATA.TIMEOUT}'
          value: 15m
          description: No API data for this long raises a problem.
        - macro: '{$PROWLARR.HTTP.PROXY}'
          description: HTTP proxy for requests, if needed.
        - macro: '{$PROWLARR.INDEXER.BLOCKED.TIMEOUT}'
          value: 15m
          description: How long an indexer stays blocked before the problem. Supports context.
        - macro: '{$PROWLARR.INDEXER.RECOVERY.TIMEOUT}'
          value: 1h
          description: How long an indexer stays unblocked before recovery. Supports context.
        - macro: '{$PROWLARR.STATUS.NODATA.TIMEOUT}'
          value: 3m
          description: No response for this long raises a problem.
        - macro: '{$PROWLARR.URL}'
          value: http://prowlarr:9696
          description: Prowlarr URL.
      valuemaps:
        - uuid: 47a6a10739db4d2a8e2652011bceb05b
          name: Service state
          mappings:
            - value: '0'
              newvalue: Down
            - value: '1'
              newvalue: Up
        - uuid: 24be12afb49d44c28928cb79819f2c10
          name: Update status
          mappings:
            - value: '0'
              newvalue: Up to date
            - value: '1'
              newvalue: Update available
        - uuid: bbccc02c4fcd471d8ac682c183e258ed
          name: Indexer state
          mappings:
            - value: '0'
              newvalue: Available
            - value: '1'
              newvalue: Blocked
    - uuid: 1818f8521d6f479387a5bbf6486cbe07
