            - type: BOOL_TO_DECIMAL
              parameters:
                - ''
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: overseerr.status.get
          tags:
            - tag: component
              value: application
          triggers:
            - uuid: d20005ddc626496289f2ae2b26bb2ced
              expression: last(/Overseerr by HTTP/overseerr.update.status)=1
              name: 'Overseerr: Update is available'
              priority: INFO
              description: A newer version is available.
              tags:
                - tag: scope
                  value: notice
        - uuid: b707708f851648098e85c0d8c2415ef8
          name: 'Overseerr: Version'
          type: DEPENDENT
          key: overseerr.version
          delay: '0'
          value_type: CHAR
          trends: '0'
          description: Installed version.
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.version
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: overseerr.status.get
          tags:
            - tag: component
              value: application
        - uuid: a5ca8e8149a9468581cd2183132b8212
          name: 'Overseerr: Open issues'
          type: HTTP_AGENT
          key: overseerr.issues.open
          delay: 5m
          description: Number of open issues.
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.open
          url: '{$OVERSEERR.URL}/api/v1/issue/count'
          http_proxy: '{$OVERSEERR.HTTP.PROXY}'
          headers:
            - name: X-Api-Key
              value: '{$OVERSEERR.API.KEY}'
          tags:
            - tag: component
              value: application
          triggers:
            - uuid: 461f7c05181f469783b8b7f5cd082743
              expression: last(/Overseerr by HTTP/overseerr.issues.open)>={$OVERSEERR.ISSUES.OPEN.MAX.HIGH}
              name: 'Overseerr: Too many open issues'
              opdata: 'Issues: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: Open issues reached {$OVERSEERR.ISSUES.OPEN.MAX.HIGH}.
              tags:
                - tag: scope
                  value: notice
            - uuid: 2c839aed48e2455080ce22cedb680d7d
              expression: last(/Overseerr by HTTP/overseerr.issues.open)>={$OVERSEERR.ISSUES.OPEN.MAX.WARN}
              name: 'Overseerr: There are open issues'
              opdata: 'Issues: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: Open issues reached {$OVERSEERR.ISSUES.OPEN.MAX.WARN}.
              dependencies:
                - name: 'Overseerr: Too many open issues'
                  expression: last(/Overseerr by HTTP/overseerr.issues.open)>={$OVERSEERR.ISSUES.OPEN.MAX.HIGH}
              tags:
                - tag: scope
                  value: notice
        - uuid: 1342f50f6efe42398fae3094744bbc8d
          name: 'Overseerr: Pending requests'
          type: HTTP_AGENT
          key: overseerr.requests.pending
          delay: 15m
          description: Number of pending requests.
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.pending
          url: '{$OVERSEERR.URL}/api/v1/request/count'
          http_proxy: '{$OVERSEERR.HTTP.PROXY}'
          headers:
            - name: X-Api-Key
              value: '{$OVERSEERR.API.KEY}'
          tags:
            - tag: component
              value: application
          triggers:
            - uuid: 15f0393e6f3741a38f8135c1dfdd0663
              expression: last(/Overseerr by HTTP/overseerr.requests.pending)>0
              name: 'Overseerr: Requests are pending'
              opdata: 'Requests: {ITEM.LASTVALUE1}'
              priority: INFO
              description: Requests are waiting for approval.
              tags:
                - tag: scope
                  value: notice
      tags:
        - tag: class
          value: software
        - tag: target
          value: overseerr
      macros:
        - macro: '{$OVERSEERR.API.KEY}'
          type: SECRET_TEXT
          description: Overseerr API key.
        - macro: '{$OVERSEERR.API.NODATA.TIMEOUT}'
          value: 15m
          description: No API data for this long raises a problem.
        - macro: '{$OVERSEERR.HTTP.PROXY}'
          description: HTTP proxy for requests, if needed.
        - macro: '{$OVERSEERR.ISSUES.OPEN.MAX.HIGH}'
          value: '10'
          description: Open issues for the average severity problem.
        - macro: '{$OVERSEERR.ISSUES.OPEN.MAX.WARN}'
          value: '1'
          description: Open issues for the warning problem.
        - macro: '{$OVERSEERR.STATUS.NODATA.TIMEOUT}'
          value: 3m
          description: No response for this long raises a problem.
        - macro: '{$OVERSEERR.URL}'
          value: http://overseerr:5055
          description: Overseerr URL.
      valuemaps:
