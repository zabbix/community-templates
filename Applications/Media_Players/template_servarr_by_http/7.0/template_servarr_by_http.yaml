              name: 'Bazarr: Provider [{#NAME}]: State'
              type: DEPENDENT
              key: bazarr.provider.state["{#NAME}"]
              delay: '0'
              trends: '0'
              valuemap:
                name: Provider state
              description: Whether Bazarr has throttled the provider.
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |-
                      var data = JSON.parse(value).data;
                      for (var i = 0; i < data.length; i++) {
                          if (data[i].name === '{#NAME}') {
                              return data[i].status === 'Good' ? 0 : 1;
                          }
                      }
                      return 0;
