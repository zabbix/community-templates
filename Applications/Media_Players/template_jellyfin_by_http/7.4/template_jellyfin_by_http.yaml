                  try {
                      var data = JSON.parse(value);
                      var items = data.Items || [];
                      var windowSeconds = Number('{$JELLYFIN.ACTIVITY.WINDOW}');
                      if (!isFinite(windowSeconds) || windowSeconds < 1) {
