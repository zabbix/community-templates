          description: 'Error and Critical activity log entries in the last {$JELLYFIN.ACTIVITY.WINDOW} seconds. The count is limited by {$JELLYFIN.ACTIVITY.LIMIT} fetched entries.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
