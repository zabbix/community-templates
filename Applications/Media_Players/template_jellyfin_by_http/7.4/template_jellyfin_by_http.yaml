                              var msg = [entry.Date, entry.Severity, entry.Name, entry.ShortOverview || entry.Overview].filter(function (v) { return v; }).join(' | ');
                              return msg.length > 500 ? msg.substring(0, 500) : msg;
                          }
                      }
                      return '-';
                  }
                  catch (e) {
                      return '-';
                  }
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
