                          for (var i = 0; i < tasks.length; i++) {
                              if (String(tasks[i].Key || tasks[i].Id || tasks[i].Name) === key) {
                                  return tasks[i].LastExecutionResult ? (tasks[i].LastExecutionResult.Status || '') : '';
                              }
                          }
