        - macro: '{$JELLYFIN.INVENTORY.INTERVAL}'
          value: 15m
          description: 'Polling interval for inventory-style endpoints such as users, plugins and item counts.'
        - macro: '{$JELLYFIN.LIBRARY.MIN_ITEMS}'
          value: '0'
