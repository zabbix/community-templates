        - macro: '{$JELLYFIN.SCHEME}'
          value: http
          description: 'URL scheme used to connect to Jellyfin: http or https.'
        - macro: '{$JELLYFIN.SESSIONS.INTERVAL}'
          value: 1m
          description: 'Polling interval for active sessions and playback metrics.'
