zabbix_export:
  version: '8.0'
  template_groups:
    - uuid: cdd2966896b44218b21183192a08b43f
      name: Templates/Applications
  templates:
    - uuid: da532dce467e4245bd3f094575f9d4fa
      template: 'DrWeb ESS SNMP traps'
      name: 'DrWeb ESS SNMP traps'
      description: |
        Мониторинг Dr.Web Enterprise Security Suite через SNMP traps.
        IP задаётся макросом {$DRWEB.IP}. По умолчанию макрос пустой: перед использованием обязательно задайте адрес отправителя traps в макросах узла. Для использования макроса вручную укажите {$DRWEB.IP} в поле IP SNMP-интерфейса узла. Импорт шаблона не меняет интерфейсы узла. В snmptrapd.conf остаётся реальный IP; Zabbix-макросы там не раскрываются. Подготовлен для Zabbix 8.0; формат обмена 7.0 для совместимого импорта. MIB ревизии 202606110000Z.
        Привязать к узлу сервера Dr.Web; SNMP-интерфейс: поле IP {$DRWEB.IP}, подключение по IP, наблюдение через сервер Zabbix.
        Требуется уже настроенный snmptrapd с официальным zabbix_trap_receiver.pl и outputOption n.
        После привязки отключить старый тестовый триггер на snmptrap.fallback. Сам fallback можно оставить для нераспознанных traps; совпавшие с новым SNMP trap элементом сообщения в fallback больше не попадут.
        Тест .35 сохраняется в drweb.test и drweb.trap.text без создания проблемы. Включить нужные оповещения в Dr.Web. Для проверки ошибки можно послать искусственный trap .30; проблема закрывается вручную.
        20 триггеров: отдельная проблема на каждое сообщение, ручное закрытие. Дубликаты повторно доставленных traps не подавляются. HIPS, контроль приложений и остальные события доступны в общей истории без триггеров. События срока лицензии разделены по mSGExpired 0/1.
        В оперативных данных проблемы отображается текст события. Для сообщений действий Zabbix используйте {ITEM.VALUE1}, чтобы зафиксировать значение события; {ITEM.LASTVALUE1} может указывать уже на более позднее сообщение.
        Дата DateAndTime и бинарные поля, не являющиеся UTF-8, сохраняются в исходном представлении. Декодируется многострочный Hex-STRING с корректным UTF-8.
        Шаблон не контролирует доступность службы Dr.Web и доставку traps: для этого нужен отдельный мониторинг. Ротацию /var/log/snmptrap/snmptrap.log настроить отдельно, сохранив владельца Debian-snmp и группу, доступную процессу zabbix.

        Ошибки обработки файлов (OID .16 и .53) сохраняются только в общей истории, отдельные элементы и триггеры для них исключены.

        В названия новых событий добавляется станция из текста сообщения — та же, что используется в теге station. Для серверных событий отображается «Сервер Dr.Web». Ранее созданные проблемы автоматически не переименовываются.

        Фильтры событий возвращают null для неподходящих уведомлений: Zabbix отбрасывает значение без ошибки Other event. Некорректный JSON остаётся диагностируемой ошибкой.
      groups:
        - name: Templates/Applications
      items:
        - uuid: 9f7f137adf4f4bf5a8297ad3e78a1d13
          name: 'Dr.Web: Ошибка авторизации администратора'
          type: DEPENDENT
          key: drweb.event.admin_auth
          history: 7d
          value_type: TEXT
          description: 'Сохраняет только соответствующие события. Другие типы отбрасываются. Повторные сообщения не подавляются.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var e = JSON.parse(value);
                  if ([1, 28].indexOf(e.event_id) < 0) return null;
                  return e.text;
          master_item:
            key: drweb.trap.json
          tags:
            - tag: application
              value: 'Dr.Web ESS'
          triggers:
            - uuid: 1fcf6c562da74b6282c175268796d9fb
              expression: 'find(/DrWeb ESS SNMP traps/drweb.event.admin_auth,,"regexp",".")=1'
              recovery_mode: NONE
              name: 'Dr.Web: Ошибка авторизации администратора'
              event_name: 'Dr.Web: Ошибка авторизации администратора — {{ITEM.VALUE1}.regsub("(?m)^Станция: ([^\r\n]*)", "\1")}'
              opdata: '{ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'Каждый подходящий trap создаёт отдельную проблему. Закрывается вручную; отсутствие новых traps не означает восстановления. Повторная доставка одного trap может создать дубликат. Данные станции и события находятся в оперативных данных и истории элемента.'
              type: MULTIPLE
              manual_close: 'YES'
              tags:
                - tag: application
                  value: 'Dr.Web ESS'
                - tag: component
                  value: admin_auth
                - tag: station
                  value: '{{ITEM.VALUE1}.regsub("(?m)^Станция: ([^\r\n]*)", "\1")}'
