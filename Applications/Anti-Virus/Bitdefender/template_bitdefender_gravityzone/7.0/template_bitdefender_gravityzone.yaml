                      name: down_color
                      value: 00FF00
                    - type: ITEM
                      name: itemid.0
                      value:
                        host: 'BitDefender Gravityzone by HTTP'
                        key: bitdefender.quarantine.total
                    - type: INTEGER
                      name: rf_rate
                      value: '10'
                    - type: INTEGER
                      name: show.0
                      value: '1'
                    - type: INTEGER
                      name: show.1
                      value: '2'
                    - type: INTEGER
                      name: show.2
