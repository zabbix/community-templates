zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 7df96b18c230490a9a0a9e2307226338
      name: 'Templates/Applications'
  templates:
    - uuid: 92f4b0536d5044a38f126d84e88dd574
      template: 'PowerDNS dnsdist by HTTP'
      name: 'PowerDNS dnsdist by HTTP'
      description: 'Global dnsdist 2.x monitoring through the built-in HTTP API. The template intentionally excludes backend discovery and backend metrics because PowerDNS Recursor backends are monitored separately. It can be linked alongside the legacy Dnsdist Statistics template because all item keys are unique.'
      groups:
        - name: 'Templates/Applications'
      items:
        - uuid: 692f58bf7f62410bafbd00c68f0d2b21
          name: 'dnsdist: API statistics'
          type: HTTP_AGENT
          key: pdns.dnsdist.v2.api.statistics
          history: '0'
          value_type: TEXT
          description: 'Raw global dnsdist statistics. The API is queried once per minute; all metrics below are dependent items.'
          timeout: '{$PDNS.DNSDIST.HTTP.TIMEOUT}'
          url: '{$PDNS.DNSDIST.WEBSERVER.SCHEME}://{HOST.CONN}:{$PDNS.DNSDIST.WEBSERVER.PORT}/api/v1/servers/localhost/statistics'
          headers:
            - name: X-API-Key
              value: '{$PDNS.DNSDIST.API.KEY}'
          tags:
            - tag: component
              value: raw
          triggers:
            - uuid: c597f73c594c446093eda6a0ad97ae22
              expression: 'nodata(/PowerDNS dnsdist by HTTP/pdns.dnsdist.v2.api.statistics,3m)=1'
              name: 'dnsdist: API statistics are unavailable'
              priority: HIGH
              description: 'No dnsdist API statistics have been received for three minutes.'
              tags:
                - tag: scope
                  value: availability
        - uuid: 2cea873317ed4546b76cb0149230ba79
          name: 'dnsdist: Packet cache hit ratio (5m)'
          type: CALCULATED
          key: pdns.dnsdist.v2.cache.hit.ratio
          value_type: FLOAT
          units: '%'
          params: '100 * avg(//pdns.dnsdist.v2.rate[cache-hits],5m) / (avg(//pdns.dnsdist.v2.rate[cache-hits],5m) + avg(//pdns.dnsdist.v2.rate[cache-misses],5m) + 0.000001)'
          description: 'Five-minute packet-cache hit ratio calculated from the hit and miss operation rates.'
          tags:
            - tag: component
              value: cache
        - uuid: 487d5f111594453d9eb496aee5558d5b
          name: 'dnsdist: Dynamic block entries'
          type: DEPENDENT
          key: 'pdns.dnsdist.v2.gauge[dyn-block-nmg-size]'
          description: 'Current number of dynamic network-mask-group block entries.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$[?(@.name == "dyn-block-nmg-size")].value.first()'
              error_handler: DISCARD_VALUE
          master_item:
            key: pdns.dnsdist.v2.api.statistics
          tags:
            - tag: component
              value: resources
        - uuid: 8a043da73f20406c8e2ae2984c4444de
          name: 'dnsdist: Open file descriptors'
          type: DEPENDENT
          key: 'pdns.dnsdist.v2.gauge[fd-usage]'
          description: 'Current number of file descriptors used by dnsdist.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$[?(@.name == "fd-usage")].value.first()'
              error_handler: DISCARD_VALUE
