zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: a571c0d144b14fd4a87a9d9b2aa9fcd6
    name: Templates/Applications
  templates:
  - uuid: 4b129be60e7a47b0878266400d7d13a7
    template: template_ntp_remote_accuracy_en
    name: NTP Remote Accuracy Monitoring
    description: NTP accuracy monitoring template. Tracks offset, delay, jitter, stratum, and peer stability.
    items:
    - uuid: f53f5b43648a488b99bf10a220740a46
      name: ntpq({$NTP_IP})
      type: ZABBIX_ACTIVE
      key: system.run[ntpq -p {$NTP_IP}]
      delay: '3600'
      trends: '0'
      value_type: TEXT
      description: "*: Synchronized peer, +: Combined peer, #: Remote candidate, x: False ticker, .: Excluded candidate\nrefid: Remote reference IP/ID, st: Stratum, when: Sec since last packet, poll: Poll interval, reach: Reach register (octal), delay: Round-trip delay (ms), offset: Offset (ms), jitter: RMS jitter (ms)"
      tags:
      - tag: Application
        value: NTP (Remote)
    - uuid: 64710b26ebb04431b1f8b57d2825f2ea
      name: NTPSynchronized peer({$NTP_IP})
      type: DEPENDENT
      key: ntp.peer.remote
      delay: '0'
      history: 60d
      trends: '0'
      value_type: TEXT
      description: Name of the synchronized NTP server
      tags:
      - tag: Application
        value: NTP (Remote)
      triggers:
      - uuid: 9054718459af41e69d04f2be0f8caaf4
        expression: (last(/template_ntp_remote_accuracy_en/ntp.peer.remote,#1)<>last(/template_ntp_remote_accuracy_en/ntp.peer.remote,#2))=1
        name: NTP synchronized peer has changed({$NTP_IP})
        status: DISABLED
        priority: INFO
      master_item:
        key: system.run[ntpq -p {$NTP_IP}]
      preprocessing:
      - type: REGEX
        parameters:
        - (?m)^[*o]\s*(\S+)
        - \1
    - uuid: e0c92d3ea6a74b20997d00806418940b
      name: NTP refid({$NTP_IP})
      type: DEPENDENT
      key: ntp.refid.remote
      delay: '0'
      history: 60d
      trends: '0'
      value_type: TEXT
      description: Upstream NTP reference server of the synchronized peer
      tags:
      - tag: Application
        value: NTP (Remote)
      master_item:
        key: system.run[ntpq -p {$NTP_IP}]
      preprocessing:
      - type: REGEX
        parameters:
        - (?m)^[*o]\s*\S+\s+(\S+)
        - \1
    - uuid: b571636b9cb24b0185bfaaae554675e3
      name: NTP stratum({$NTP_IP})
      type: DEPENDENT
      key: ntp.stratum.remote
      delay: '0'
      history: 60d
      description: Stratum level of the synchronized NTP server
      tags:
      - tag: Application
        value: NTP (Remote)
      master_item:
        key: system.run[ntpq -p {$NTP_IP}]
      preprocessing:
      - type: REGEX
        parameters:
        - (?m)^[*o]\s*\S+\s+\S+\s+(\d+)
        - \1
    - uuid: d1972bffc8f240749a5d7fb8d319e8bd
      name: NTP poll interval({$NTP_IP})
      type: DEPENDENT
      key: ntp.poll.remote
      delay: '0'
      history: 60d
      units: s
      description: Polling interval with the NTP server in seconds
      tags:
      - tag: Application
        value: NTP (Remote)
      master_item:
        key: system.run[ntpq -p {$NTP_IP}]
      preprocessing:
      - type: REGEX
        parameters:
        - (?m)^[*o]\s*\S+\s+\S+\s+\d+\s+\S+\s+\S+\s+(\d+)
        - \1
    - uuid: a1b8653047a647f3ad514decb4d498b8
      name: NTP estimated delay({$NTP_IP})
      type: DEPENDENT
      key: ntp.delay.remote
      delay: '0'
      history: 60d
      value_type: FLOAT
      units: ms
      description: Estimated round-trip network delay of NTP packets in milliseconds
      tags:
      - tag: Application
        value: NTP (Remote)
      master_item:
        key: system.run[ntpq -p {$NTP_IP}]
      preprocessing:
      - type: REGEX
        parameters:
        - (?m)^[*o]\s*\S+\s+\S+\s+\d+\s+\S+\s+\S+\s+\d+\s+\d+\s+([-\d.]+)
        - \1
    - uuid: 33b68c2bdd74469593c78cd312856eda
      name: NTP offset({$NTP_IP})
      type: DEPENDENT
      key: ntp.offset.remote
      delay: '0'
      history: 60d
      value_type: FLOAT
      units: ms
      description: Time difference between NTP server and system clock in milliseconds
      tags:
      - tag: Application
        value: NTP (Remote)
      triggers:
      - uuid: 0aafcc6a18d048e4adb208c5329f9f8f
        expression: last(/template_ntp_remote_accuracy_en/ntp.offset.remote)>5000 or last(/template_ntp_remote_accuracy_en/ntp.offset.remote)<-5000
        name: NTP offset is more than 5s({$NTP_IP})
        priority: AVERAGE
      - uuid: 1ebcadc2ae6248ca9ae9ff39a0464ae6
        expression: last(/template_ntp_remote_accuracy_en/ntp.offset.remote)>50 or last(/template_ntp_remote_accuracy_en/ntp.offset.remote)<-50
        name: NTP offset is more than 50ms({$NTP_IP})
        priority: WARNING
        dependencies:
        - name: NTP offset is more than 5s({$NTP_IP})
          expression: last(/template_ntp_remote_accuracy_en/ntp.offset.remote)>5000 or last(/template_ntp_remote_accuracy_en/ntp.offset.remote)<-5000
      master_item:
        key: system.run[ntpq -p {$NTP_IP}]
      preprocessing:
      - type: REGEX
        parameters:
        - (?m)^[*o]\s*\S+\s+\S+\s+\d+\s+\S+\s+\S+\s+\d+\s+\d+\s+[-\d.]+\s+([-\d.]+)
        - \1
    - uuid: a4ead86516ec48bd9103c1617daf4709
      name: NTP jitter({$NTP_IP})
      type: DEPENDENT
      key: ntp.jitter.remote
      delay: '0'
      history: 60d
      value_type: FLOAT
      units: ms
      description: RMS jitter of the NTP offset over the past 8 poll cycles
      tags:
      - tag: Application
        value: NTP (Remote)
      master_item:
        key: system.run[ntpq -p {$NTP_IP}]
      preprocessing:
      - type: REGEX
        parameters:
        - (?m)^[*o]\s*\S+\s+\S+\s+\d+\s+\S+\s+\S+\s+\d+\s+\d+\s+[-\d.]+\s+[-\d.]+\s+([-\d.]+)
        - \1
    macros:
    - macro: '{$NTP_IP}'
      value: 127.0.0.1
    dashboards:
    - uuid: 72622772c0464cca89a8a16133497545
      name: NTP (Remote) Accuracy Dashboard
      pages:
      - name: Overview
        widgets:
        - type: item
          name: NTP offset (ms)
          width: '24'
          height: '3'
          fields:
          - type: ITEM
            name: itemid.0
            value:
              host: template_ntp_remote_accuracy_en
              key: ntp.offset.remote
          - type: INTEGER
            name: show.0
            value: '1'
          - type: INTEGER
            name: show.1
            value: '2'
          - type: STRING
            name: thresholds.0.color
            value: 1A7C11
          - type: STRING
            name: thresholds.0.threshold
            value: '0'
          - type: STRING
            name: thresholds.1.color
            value: F63100
          - type: STRING
            name: thresholds.1.threshold
            value: '50'
        - type: item
          name: Synchronized peer
          x: '24'
          width: '24'
          height: '3'
          fields:
          - type: ITEM
            name: itemid.0
            value:
              host: template_ntp_remote_accuracy_en
              key: ntp.peer.remote
          - type: INTEGER
            name: show.0
            value: '1'
          - type: INTEGER
            name: show.1
            value: '2'
          - type: INTEGER
            name: value_size
            value: '35'
        - type: item
          name: Stratum level
          x: '48'
          width: '24'
          height: '3'
          fields:
          - type: ITEM
            name: itemid.0
            value:
              host: template_ntp_remote_accuracy_en
              key: ntp.stratum.remote
          - type: INTEGER
            name: show.0
            value: '1'
          - type: INTEGER
            name: show.1
            value: '2'
          - type: INTEGER
            name: decimal_places
            value: '0'
        - type: svggraph
          name: NTP Offset & Jitter trend
          y: '3'
          width: '72'
          height: '6'
          fields:
          - type: INTEGER
            name: ds.0.color_palette
            value: '0'
          - type: STRING
            name: ds.0.items.0
            value: 'NTP offset({$NTP_IP})'
          - type: STRING
            name: ds.0.items.1
            value: 'NTP jitter({$NTP_IP})'
          - type: INTEGER
            name: righty
            value: '0'
        - type: svggraph
          name: NTP Delay trend
          y: '9'
          width: '72'
          height: '5'
          fields:
          - type: INTEGER
            name: ds.0.color_palette
            value: '1'
          - type: STRING
            name: ds.0.items.0
            value: 'NTP estimated delay({$NTP_IP})'
          - type: INTEGER
            name: righty
            value: '0'
    groups:
    - name: Templates/Applications
    discovery_rules:
    - uuid: 36ead7e7b15e4a71a072026db40af019
      name: NTP Peers Discovery ({$NTP_IP})
      type: DEPENDENT
      key: ntp.peers.discovery.remote
      delay: '0'
      master_item:
        key: system.run[ntpq -p {$NTP_IP}]
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - "var lines = value.trim().split('\\n');\nvar output = [];\nfor (var i = 0; i < lines.length; i++) {\n    var line = lines[i].trim();\n    if (line === '' || line.indexOf('=') === 0 || line.indexOf('remote') === 0) continue;\n    var m = line.match(/^[*+x#o. -]?\\s*(\\S+)/);\n    if (m && m[1]) {\n        output.push({\n            '{#PEER_NAME}': m[1]\n        });\n    }\n}\nreturn JSON.stringify(output);"
      item_prototypes:
      - uuid: 4e3c68f4f08e4f2cae931edf87262ceb
        name: 'NTP Peer [{#PEER_NAME}]: Reachability'
        type: DEPENDENT
        key: ntp.peer.reach.remote[{#PEER_NAME}]
        delay: '0'
        description: Reachability register (octal value converted to decimal 0-255)
        master_item:
          key: system.run[ntpq -p {$NTP_IP}]
        preprocessing:
        - type: REGEX
          parameters:
          - (?m)^[*+x#o. -]?\s*{#PEER_NAME}\s+\S+\s+\S+\s+\S+\s+\S+\s+\S+\s+(\d+)
          - \1
        - type: OCTAL_TO_DECIMAL
          parameters:
          - ''
        tags:
        - tag: Application
          value: NTP-Peers
        - tag: Peer
          value: '{#PEER_NAME}'
        trigger_prototypes:
        - uuid: d880dca5b077473db0a2e41fcee376da
          expression: last(/template_ntp_remote_accuracy_en/ntp.peer.reach.remote[{#PEER_NAME}])=0
          name: NTP Peer [{#PEER_NAME}] Unreachable (Reach 0)
          priority: WARNING
          description: 8 consecutive poll requests to the NTP peer have failed.
      - uuid: 7bed15792b864a8f80bfa00eaa2afa94
        name: 'NTP Peer [{#PEER_NAME}]: Delay'
        type: DEPENDENT
        key: ntp.peer.delay.remote[{#PEER_NAME}]
        delay: '0'
        value_type: FLOAT
        units: ms
        master_item:
          key: system.run[ntpq -p {$NTP_IP}]
        preprocessing:
        - type: REGEX
          parameters:
          - (?m)^[*+x#o. -]?\s*{#PEER_NAME}\s+\S+\s+\S+\s+\S+\s+\S+\s+\S+\s+\d+\s+([-\d.]+)
          - \1
        tags:
        - tag: Application
          value: NTP-Peers
        - tag: Peer
          value: '{#PEER_NAME}'
      - uuid: a81adaeaa15b41caa19c4975b864f375
        name: 'NTP Peer [{#PEER_NAME}]: Offset'
        type: DEPENDENT
        key: ntp.peer.offset.remote[{#PEER_NAME}]
        delay: '0'
        value_type: FLOAT
        units: ms
        master_item:
          key: system.run[ntpq -p {$NTP_IP}]
        preprocessing:
        - type: REGEX
          parameters:
          - (?m)^[*+x#o. -]?\s*{#PEER_NAME}\s+\S+\s+\S+\s+\S+\s+\S+\s+\S+\s+\d+\s+[-\d.]+\s+([-\d.]+)
          - \1
        tags:
        - tag: Application
          value: NTP-Peers
        - tag: Peer
          value: '{#PEER_NAME}'
      - uuid: 89140a3395e5407c96cb6bbf28bf7585
        name: 'NTP Peer [{#PEER_NAME}]: Jitter'
        type: DEPENDENT
        key: ntp.peer.jitter.remote[{#PEER_NAME}]
        delay: '0'
        value_type: FLOAT
        units: ms
        master_item:
          key: system.run[ntpq -p {$NTP_IP}]
        preprocessing:
        - type: REGEX
          parameters:
          - (?m)^[*+x#o. -]?\s*{#PEER_NAME}\s+\S+\s+\S+\s+\S+\s+\S+\s+\S+\s+\d+\s+[-\d.]+\s+[-\d.]+\s+([-\d.]+)
          - \1
        tags:
        - tag: Application
          value: NTP-Peers
        - tag: Peer
          value: '{#PEER_NAME}'
      - uuid: 3532d6cf39e34f6dae3ef27a503f8511
        name: 'NTP Peer [{#PEER_NAME}]: Sync Status'
        type: DEPENDENT
        key: ntp.peer.status.remote[{#PEER_NAME}]
        delay: '0'
        trends: '0'
        value_type: CHAR
        description: Peer sync role (master/standby/outlyer/falseticker/unreached)
        master_item:
          key: system.run[ntpq -p {$NTP_IP}]
        preprocessing:
        - type: REGEX
          parameters:
          - (?m)^([*+x#o. -]?)\s*{#PEER_NAME}
          - \1
        - type: JAVASCRIPT
          parameters:
          - 'var t = value.trim();

            if (t === ''*'' || t === ''o'') return ''master'';

            if (t === ''+'') return ''standby'';

            if (t === ''-'') return ''outlyer'';

            if (t === ''x'') return ''falseticker'';

            if (t === ''#'') return ''selected'';

            return ''unreached'';'
        tags:
        - tag: Application
          value: NTP-Peers
        - tag: Peer
          value: '{#PEER_NAME}'
      graph_prototypes:
      - uuid: 10916195d11546d5a960016ecb4fffb8
        name: NTP Peer [{#PEER_NAME}] Accuracy Trends
        graph_items:
        - drawtype: SINGLE_LINE
          color: 1A7C11
          item:
            host: template_ntp_remote_accuracy_en
            key: ntp.peer.delay.remote[{#PEER_NAME}]
        - sortorder: '1'
          drawtype: SINGLE_LINE
          color: F63100
          item:
            host: template_ntp_remote_accuracy_en
            key: ntp.peer.offset.remote[{#PEER_NAME}]
        - sortorder: '2'
          drawtype: SINGLE_LINE
          color: 0040FF
          item:
            host: template_ntp_remote_accuracy_en
            key: ntp.peer.jitter.remote[{#PEER_NAME}]
