    groups:
    - name: Templates/Applications
    discovery_rules:
    - uuid: 3fe3d2be1bfd4dd890bf393de9a27905
      name: NTP Peers Discovery
      type: DEPENDENT
      key: ntp.peers.discovery
      delay: '0'
      master_item:
        key: system.run[ntpq -p]
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - "var lines = value.trim().split('\\n');\nvar output = [];\nfor (var i = 0; i < lines.length; i++) {\n    var line = lines[i].trim();\n    if (line === '' || line.indexOf('=') === 0 || line.indexOf('remote') === 0) continue;\n    var m = line.match(/^[*+x#o. -]?\\s*(\\S+)/);\n    if (m && m[1]) {\n        output.push({\n            '{#PEER_NAME}': m[1]\n        });\n    }\n}\nreturn JSON.stringify(output);"
      item_prototypes:
      - uuid: 32985401d98741ca945908d4c0356da3
        name: 'NTP Peer [{#PEER_NAME}]: Reachability'
        type: DEPENDENT
        key: ntp.peer.reach[{#PEER_NAME}]
        delay: '0'
        description: Reachability register (octal value converted to decimal 0-255)
        master_item:
          key: system.run[ntpq -p]
        preprocessing:
        - type: REGEX
          parameters:
          - (?m)^[*+x#o. -]?\s*{#PEER_NAME}\s+\S+\s+\S+\s+\S+\s+\S+\s+\S+\s+(\d+)
          - \1
        - type: OCTAL_TO_DECIMAL
          parameters:
          - ''
        tags:
        - tag: Application
          value: NTP-Peers
        - tag: Peer
          value: '{#PEER_NAME}'
        trigger_prototypes:
        - uuid: 817333ec2acc45caa3d634cde76d2dcf
          expression: last(/template_ntp_accuracy/ntp.peer.reach[{#PEER_NAME}])=0
          name: NTP Peer [{#PEER_NAME}] Unreachable (Reach 0)
          priority: WARNING
          description: 8 consecutive poll requests to the NTP peer have failed.
      - uuid: eb6d983a77434f48ae5b5c1a116695a3
        name: 'NTP Peer [{#PEER_NAME}]: Delay'
        type: DEPENDENT
        key: ntp.peer.delay[{#PEER_NAME}]
        delay: '0'
        value_type: FLOAT
        units: ms
        master_item:
          key: system.run[ntpq -p]
        preprocessing:
        - type: REGEX
          parameters:
          - (?m)^[*+x#o. -]?\s*{#PEER_NAME}\s+\S+\s+\S+\s+\S+\s+\S+\s+\S+\s+\d+\s+([-\d.]+)
          - \1
        tags:
        - tag: Application
          value: NTP-Peers
        - tag: Peer
          value: '{#PEER_NAME}'
      - uuid: 743178b3f0594d9d87321609c8a76b2e
        name: 'NTP Peer [{#PEER_NAME}]: Offset'
        type: DEPENDENT
        key: ntp.peer.offset[{#PEER_NAME}]
        delay: '0'
        value_type: FLOAT
        units: ms
        master_item:
          key: system.run[ntpq -p]
        preprocessing:
        - type: REGEX
          parameters:
          - (?m)^[*+x#o. -]?\s*{#PEER_NAME}\s+\S+\s+\S+\s+\S+\s+\S+\s+\S+\s+\d+\s+[-\d.]+\s+([-\d.]+)
          - \1
        tags:
        - tag: Application
          value: NTP-Peers
        - tag: Peer
          value: '{#PEER_NAME}'
      - uuid: 20a3abaf28894fa8aaa4c3042a669fae
        name: 'NTP Peer [{#PEER_NAME}]: Jitter'
        type: DEPENDENT
        key: ntp.peer.jitter[{#PEER_NAME}]
        delay: '0'
        value_type: FLOAT
        units: ms
        master_item:
          key: system.run[ntpq -p]
        preprocessing:
        - type: REGEX
          parameters:
          - (?m)^[*+x#o. -]?\s*{#PEER_NAME}\s+\S+\s+\S+\s+\S+\s+\S+\s+\S+\s+\d+\s+[-\d.]+\s+[-\d.]+\s+([-\d.]+)
          - \1
        tags:
        - tag: Application
          value: NTP-Peers
        - tag: Peer
          value: '{#PEER_NAME}'
      - uuid: 41d2a6bff42e47c4a4551b2cbfc0c213
        name: 'NTP Peer [{#PEER_NAME}]: Sync Status'
        type: DEPENDENT
        key: ntp.peer.status[{#PEER_NAME}]
        delay: '0'
        trends: '0'
        value_type: CHAR
        description: Peer sync role (master/standby/outlyer/falseticker/unreached)
        master_item:
          key: system.run[ntpq -p]
        preprocessing:
        - type: REGEX
          parameters:
          - (?m)^([*+x#o. -]?)\s*{#PEER_NAME}
          - \1
        - type: JAVASCRIPT
          parameters:
          - 'var t = value.trim();

            if (t === ''*'' || t === ''o'') return ''master'';

            if (t === ''+'') return ''standby'';

            if (t === ''-'') return ''outlyer'';

            if (t === ''x'') return ''falseticker'';

            if (t === ''#'') return ''selected'';

            return ''unreached'';'
        tags:
        - tag: Application
          value: NTP-Peers
        - tag: Peer
          value: '{#PEER_NAME}'
      graph_prototypes:
      - uuid: 95cb56e722e4455cb7f321a2e01239eb
        name: NTP Peer [{#PEER_NAME}] Accuracy Trends
        graph_items:
        - drawtype: SINGLE_LINE
          color: 1A7C11
          item:
            host: template_ntp_accuracy
            key: ntp.peer.delay[{#PEER_NAME}]
        - sortorder: '1'
          drawtype: SINGLE_LINE
          color: F63100
          item:
            host: template_ntp_accuracy
            key: ntp.peer.offset[{#PEER_NAME}]
        - sortorder: '2'
          drawtype: SINGLE_LINE
          color: 0040FF
          item:
            host: template_ntp_accuracy
            key: ntp.peer.jitter[{#PEER_NAME}]
