zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: a571c0d144b14fd4a87a9d9b2aa9fcd6
    name: Templates/Applications
  templates:
  - uuid: 024ab0f7fd4240ada2de6a143173c6a3
    template: template_ntp_remote_accuracy
    name: NTP Remote Accuracy Monitoring
    description: NTP accuracy monitoring template. Tracks offset, delay, jitter, stratum, and peer stability.
    items:
    - uuid: fecfe76f83874f26ba0633c24b4cbcfb
      name: ntpq({$NTP_IP})
      type: ZABBIX_ACTIVE
      key: system.run[ntpq -p {$NTP_IP}]
      delay: '3600'
      trends: '0'
      value_type: TEXT
      description: "\"*\"\t参照同期中のサーバーを表している\n\"+\"\tクロック誤り検査に合格したサーバー\n\"#\"\t参照同期中ではあるが、距離が遠いサーバー\n\" \"\t左に何も表示されない場合（空欄）、サーバーを参照していない\n\"x\"\tクロック誤り検査に不合格となったサーバー\n\". \"\t参照リストから除外されたサーバー\nrefid\tNTPサーバーが参照している上位ホスト名 or IPアドレス\nst\tNTPサーバーの階層\nt\t階層のタイプ　l:local、u:unicast、m:multicast、b:broadcast\nwhen\t最後のパケットを受け取ってからの時間（秒）\npoll\t問い合わせを行う間隔（秒）\nreach\t到達可能性に関するレジスタ・データ（8進数）\ndelay\t推定遅延（ミリ秒）\noffset\t偏差補償（ミリ秒）\njitter\tRMS Jitterの平均値（ミリ秒）\n"
      tags:
      - tag: Application
        value: NTP(リモート)
    - uuid: eb50dd404259418d9daf0c25a5f1c1b0
      name: NTPSynchronized peer({$NTP_IP})
      type: DEPENDENT
      key: ntp.peer.remote
      delay: '0'
      history: 60d
      trends: '0'
      value_type: TEXT
      description: 同期しているNTPサーバー名
      tags:
      - tag: Application
        value: NTP(リモート)
      triggers:
      - uuid: c87d163a486748bbbb41141652e002f0
        expression: (last(/template_ntp_remote_accuracy/ntp.peer.remote,#1)<>last(/template_ntp_remote_accuracy/ntp.peer.remote,#2))=1
        name: NTP synchronized peer has changed({$NTP_IP})
        status: DISABLED
        priority: INFO
      master_item:
        key: system.run[ntpq -p {$NTP_IP}]
      preprocessing:
      - type: REGEX
        parameters:
        - (?m)^[*o]\s*(\S+)
        - \1
    - uuid: 6e7a81899d1b40249a4641098c92d438
      name: NTP refid({$NTP_IP})
      type: DEPENDENT
      key: ntp.refid.remote
      delay: '0'
      history: 60d
      trends: '0'
      value_type: TEXT
      description: 同期しているNTPサーバーの上位NTPサーバ
      tags:
      - tag: Application
        value: NTP(リモート)
      master_item:
        key: system.run[ntpq -p {$NTP_IP}]
      preprocessing:
      - type: REGEX
        parameters:
        - (?m)^[*o]\s*\S+\s+(\S+)
        - \1
    - uuid: ed928784f44643d89b2a4f0e7f334546
      name: NTP stratum({$NTP_IP})
      type: DEPENDENT
      key: ntp.stratum.remote
      delay: '0'
      history: 60d
      description: 同期しているNTPサーバーのstratum
      tags:
      - tag: Application
        value: NTP(リモート)
      master_item:
        key: system.run[ntpq -p {$NTP_IP}]
      preprocessing:
      - type: REGEX
        parameters:
        - (?m)^[*o]\s*\S+\s+\S+\s+(\d+)
        - \1
    - uuid: 8502c95081e74881a968675eec5857f4
      name: NTP poll interval({$NTP_IP})
      type: DEPENDENT
      key: ntp.poll.remote
      delay: '0'
      history: 60d
      units: s
      description: NTPサーバとの同期間隔
      tags:
      - tag: Application
        value: NTP(リモート)
      master_item:
        key: system.run[ntpq -p {$NTP_IP}]
      preprocessing:
      - type: REGEX
        parameters:
        - (?m)^[*o]\s*\S+\s+\S+\s+\d+\s+\S+\s+\S+\s+(\d+)
        - \1
    - uuid: 1c5fa8d4c36e4a849660406bbb272083
      name: NTP estimated delay({$NTP_IP})
      type: DEPENDENT
      key: ntp.delay.remote
      delay: '0'
      history: 60d
      value_type: FLOAT
      units: ms
      description: NTPパケットの推定遅延時間
      tags:
      - tag: Application
        value: NTP(リモート)
      master_item:
        key: system.run[ntpq -p {$NTP_IP}]
      preprocessing:
      - type: REGEX
        parameters:
        - (?m)^[*o]\s*\S+\s+\S+\s+\d+\s+\S+\s+\S+\s+\d+\s+\d+\s+([-\d.]+)
        - \1
    - uuid: 36cf9d55f851405b8706f0bed8bf6566
      name: NTP offset({$NTP_IP})
      type: DEPENDENT
      key: ntp.offset.remote
      delay: '0'
      history: 60d
      value_type: FLOAT
      units: ms
      description: NTPサーバとの時刻ズレ
      tags:
      - tag: Application
        value: NTP(リモート)
      triggers:
      - uuid: 525b0f6f409e45d6ae06d4308ec44a74
        expression: last(/template_ntp_remote_accuracy/ntp.offset.remote)>5000 or last(/template_ntp_remote_accuracy/ntp.offset.remote)<-5000
        name: NTP offset is more than 5s({$NTP_IP})
        priority: AVERAGE
      - uuid: 5ba5a0128a6b4738bb0e592f9e8fdcd8
        expression: last(/template_ntp_remote_accuracy/ntp.offset.remote)>50 or last(/template_ntp_remote_accuracy/ntp.offset.remote)<-50
        name: NTP offset is more than 50ms({$NTP_IP})
        priority: WARNING
        dependencies:
        - name: NTP offset is more than 5s({$NTP_IP})
          expression: last(/template_ntp_remote_accuracy/ntp.offset.remote)>5000 or last(/template_ntp_remote_accuracy/ntp.offset.remote)<-5000
      master_item:
        key: system.run[ntpq -p {$NTP_IP}]
      preprocessing:
      - type: REGEX
        parameters:
        - (?m)^[*o]\s*\S+\s+\S+\s+\d+\s+\S+\s+\S+\s+\d+\s+\d+\s+[-\d.]+\s+([-\d.]+)
        - \1
    - uuid: a152b245776e4017802215d2a4f711ff
      name: NTP jitter({$NTP_IP})
      type: DEPENDENT
      key: ntp.jitter.remote
      delay: '0'
      history: 60d
      value_type: FLOAT
      units: ms
      description: NTPオフセットの過去8回の分散平均値
      tags:
      - tag: Application
        value: NTP(リモート)
      master_item:
        key: system.run[ntpq -p {$NTP_IP}]
      preprocessing:
      - type: REGEX
        parameters:
        - (?m)^[*o]\s*\S+\s+\S+\s+\d+\s+\S+\s+\S+\s+\d+\s+\d+\s+[-\d.]+\s+[-\d.]+\s+([-\d.]+)
        - \1
    macros:
    - macro: '{$NTP_IP}'
      value: 127.0.0.1
    dashboards:
    - uuid: e5f6a7b8c9d041f283b4c5d6e7f8a9b0
      name: NTP (Remote) Accuracy Dashboard
      pages:
      - name: Overview
        widgets:
        - type: item
          name: NTP offset (ms)
          width: '24'
          height: '3'
          fields:
          - type: ITEM
            name: itemid.0
            value:
              host: template_ntp_remote_accuracy
              key: ntp.offset.remote
          - type: INTEGER
            name: show.0
            value: '1'
          - type: INTEGER
            name: show.1
            value: '2'
          - type: STRING
            name: thresholds.0.color
            value: 1A7C11
          - type: STRING
            name: thresholds.0.threshold
            value: '0'
          - type: STRING
            name: thresholds.1.color
            value: F63100
          - type: STRING
            name: thresholds.1.threshold
            value: '50'
        - type: item
          name: Synchronized peer
          x: '24'
          width: '24'
          height: '3'
          fields:
          - type: ITEM
            name: itemid.0
            value:
              host: template_ntp_remote_accuracy
              key: ntp.peer.remote
          - type: INTEGER
            name: show.0
            value: '1'
          - type: INTEGER
            name: show.1
            value: '2'
          - type: INTEGER
            name: value_size
            value: '35'
        - type: item
          name: Stratum level
          x: '48'
          width: '24'
          height: '3'
          fields:
          - type: ITEM
            name: itemid.0
            value:
              host: template_ntp_remote_accuracy
              key: ntp.stratum.remote
          - type: INTEGER
            name: show.0
            value: '1'
          - type: INTEGER
            name: show.1
            value: '2'
          - type: INTEGER
            name: decimal_places
            value: '0'
        - type: svggraph
          name: NTP Offset & Jitter trend
          y: '3'
          width: '72'
          height: '6'
          fields:
          - type: INTEGER
            name: ds.0.color_palette
            value: '0'
          - type: STRING
            name: ds.0.items.0
            value: 'NTP offset({$NTP_IP})'
          - type: STRING
            name: ds.0.items.1
            value: 'NTP jitter({$NTP_IP})'
          - type: INTEGER
            name: righty
            value: '0'
        - type: svggraph
          name: NTP Delay trend
          y: '9'
          width: '72'
          height: '5'
          fields:
          - type: INTEGER
            name: ds.0.color_palette
            value: '1'
          - type: STRING
            name: ds.0.items.0
            value: 'NTP estimated delay({$NTP_IP})'
          - type: INTEGER
            name: righty
            value: '0'
    groups:
    - name: Templates/Applications
    discovery_rules:
    - uuid: 11bdd387b5c14358970a07d580290ccc
      name: NTP Peers Discovery ({$NTP_IP})
      type: DEPENDENT
      key: ntp.peers.discovery.remote
      delay: '0'
      master_item:
        key: system.run[ntpq -p {$NTP_IP}]
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - "var lines = value.trim().split('\\n');\nvar output = [];\nfor (var i = 0; i < lines.length; i++) {\n    var line = lines[i].trim();\n    if (line === '' || line.indexOf('=') === 0 || line.indexOf('remote') === 0) continue;\n    var m = line.match(/^[*+x#o. -]?\\s*(\\S+)/);\n    if (m && m[1]) {\n        output.push({\n            '{#PEER_NAME}': m[1]\n        });\n    }\n}\nreturn JSON.stringify(output);"
      item_prototypes:
      - uuid: cec41fa7699746d6967fc8fea9332095
        name: 'NTP Peer [{#PEER_NAME}]: Reachability'
        type: DEPENDENT
        key: ntp.peer.reach.remote[{#PEER_NAME}]
        delay: '0'
        description: Reachability register (octal value converted to decimal 0-255)
        master_item:
          key: system.run[ntpq -p {$NTP_IP}]
        preprocessing:
        - type: REGEX
          parameters:
          - (?m)^[*+x#o. -]?\s*{#PEER_NAME}\s+\S+\s+\S+\s+\S+\s+\S+\s+\S+\s+(\d+)
          - \1
        - type: OCTAL_TO_DECIMAL
          parameters:
          - ''
        tags:
        - tag: Application
          value: NTP-Peers
        - tag: Peer
          value: '{#PEER_NAME}'
        trigger_prototypes:
        - uuid: 50f788f199d2413b947e789822afff01
          expression: last(/template_ntp_remote_accuracy/ntp.peer.reach.remote[{#PEER_NAME}])=0
          name: NTP Peer [{#PEER_NAME}] Unreachable (Reach 0)
          priority: WARNING
          description: 8 consecutive poll requests to the NTP peer have failed.
      - uuid: 769996d16070460298c3865c8f35b5f8
        name: 'NTP Peer [{#PEER_NAME}]: Delay'
        type: DEPENDENT
        key: ntp.peer.delay.remote[{#PEER_NAME}]
        delay: '0'
        value_type: FLOAT
        units: ms
        master_item:
          key: system.run[ntpq -p {$NTP_IP}]
        preprocessing:
        - type: REGEX
          parameters:
          - (?m)^[*+x#o. -]?\s*{#PEER_NAME}\s+\S+\s+\S+\s+\S+\s+\S+\s+\S+\s+\d+\s+([-\d.]+)
          - \1
        tags:
        - tag: Application
          value: NTP-Peers
        - tag: Peer
          value: '{#PEER_NAME}'
      - uuid: d9e4efe0c10a480bb2d38177436f3ce9
        name: 'NTP Peer [{#PEER_NAME}]: Offset'
        type: DEPENDENT
        key: ntp.peer.offset.remote[{#PEER_NAME}]
        delay: '0'
        value_type: FLOAT
        units: ms
        master_item:
          key: system.run[ntpq -p {$NTP_IP}]
        preprocessing:
        - type: REGEX
          parameters:
          - (?m)^[*+x#o. -]?\s*{#PEER_NAME}\s+\S+\s+\S+\s+\S+\s+\S+\s+\S+\s+\d+\s+[-\d.]+\s+([-\d.]+)
          - \1
        tags:
        - tag: Application
          value: NTP-Peers
        - tag: Peer
          value: '{#PEER_NAME}'
      - uuid: fa102f367e91446e88b75c8308e75dc3
        name: 'NTP Peer [{#PEER_NAME}]: Jitter'
        type: DEPENDENT
        key: ntp.peer.jitter.remote[{#PEER_NAME}]
        delay: '0'
        value_type: FLOAT
        units: ms
        master_item:
          key: system.run[ntpq -p {$NTP_IP}]
        preprocessing:
        - type: REGEX
          parameters:
          - (?m)^[*+x#o. -]?\s*{#PEER_NAME}\s+\S+\s+\S+\s+\S+\s+\S+\s+\S+\s+\d+\s+[-\d.]+\s+[-\d.]+\s+([-\d.]+)
          - \1
        tags:
        - tag: Application
          value: NTP-Peers
        - tag: Peer
          value: '{#PEER_NAME}'
      - uuid: b8432ebd4e7e497f81c0da73e03fbf51
        name: 'NTP Peer [{#PEER_NAME}]: Sync Status'
        type: DEPENDENT
        key: ntp.peer.status.remote[{#PEER_NAME}]
        delay: '0'
        trends: '0'
        value_type: CHAR
        description: Peer sync role (master/standby/outlyer/falseticker/unreached)
        master_item:
          key: system.run[ntpq -p {$NTP_IP}]
        preprocessing:
        - type: REGEX
          parameters:
          - (?m)^([*+x#o. -]?)\s*{#PEER_NAME}
          - \1
        - type: JAVASCRIPT
          parameters:
          - 'var t = value.trim();

            if (t === ''*'' || t === ''o'') return ''master'';

            if (t === ''+'') return ''standby'';

            if (t === ''-'') return ''outlyer'';

            if (t === ''x'') return ''falseticker'';

            if (t === ''#'') return ''selected'';

            return ''unreached'';'
        tags:
        - tag: Application
          value: NTP-Peers
        - tag: Peer
          value: '{#PEER_NAME}'
      graph_prototypes:
      - uuid: f9a2553d3a504a3bba03e45b9666d67a
        name: NTP Peer [{#PEER_NAME}] Accuracy Trends
        graph_items:
        - drawtype: SINGLE_LINE
          color: 1A7C11
          item:
            host: template_ntp_remote_accuracy
            key: ntp.peer.delay.remote[{#PEER_NAME}]
        - sortorder: '1'
          drawtype: SINGLE_LINE
          color: F63100
          item:
            host: template_ntp_remote_accuracy
            key: ntp.peer.offset.remote[{#PEER_NAME}]
        - sortorder: '2'
          drawtype: SINGLE_LINE
          color: 0040FF
          item:
            host: template_ntp_remote_accuracy
            key: ntp.peer.jitter.remote[{#PEER_NAME}]
