    groups:
    - name: Templates/Applications
    discovery_rules:
    - uuid: 3847cb6a4fb741c99d8655fd5e1752f7
      name: NTP Peers Discovery
      type: DEPENDENT
      key: ntp.peers.discovery
      delay: '0'
      master_item:
        key: system.run[ntpq -p]
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - "var lines = value.trim().split('\\n');\nvar output = [];\nfor (var i = 0; i < lines.length; i++) {\n    var line = lines[i].trim();\n    if (line === '' || line.indexOf('=') === 0 || line.indexOf('remote') === 0) continue;\n    var m = line.match(/^[*+x#o. -]?\\s*(\\S+)/);\n    if (m && m[1]) {\n        output.push({\n            '{#PEER_NAME}': m[1]\n        });\n    }\n}\nreturn JSON.stringify(output);"
      item_prototypes:
      - uuid: 433eceeeac924acd8ffeae9de5403ae1
        name: 'NTP Peer [{#PEER_NAME}]: Reachability'
        type: DEPENDENT
        key: ntp.peer.reach[{#PEER_NAME}]
        delay: '0'
        description: Reachability register (octal value converted to decimal 0-255)
        master_item:
          key: system.run[ntpq -p]
        preprocessing:
        - type: REGEX
          parameters:
          - (?m)^[*+x#o. -]?\s*{#PEER_NAME}\s+\S+\s+\S+\s+\S+\s+\S+\s+\S+\s+(\d+)
          - \1
        - type: OCTAL_TO_DECIMAL
          parameters:
          - ''
        tags:
        - tag: Application
          value: NTP-Peers
        - tag: Peer
          value: '{#PEER_NAME}'
        trigger_prototypes:
        - uuid: 860e3c7d06914a489dcb53c20e49c904
          expression: last(/template_ntp_accuracy_en/ntp.peer.reach[{#PEER_NAME}])=0
          name: NTP Peer [{#PEER_NAME}] Unreachable (Reach 0)
          priority: WARNING
          description: 8 consecutive poll requests to the NTP peer have failed.
      - uuid: 6d99957298b240dbab04ac303136bed1
        name: 'NTP Peer [{#PEER_NAME}]: Delay'
        type: DEPENDENT
        key: ntp.peer.delay[{#PEER_NAME}]
        delay: '0'
        value_type: FLOAT
        units: ms
        master_item:
          key: system.run[ntpq -p]
        preprocessing:
        - type: REGEX
          parameters:
          - (?m)^[*+x#o. -]?\s*{#PEER_NAME}\s+\S+\s+\S+\s+\S+\s+\S+\s+\S+\s+\d+\s+([-\d.]+)
          - \1
        tags:
        - tag: Application
          value: NTP-Peers
        - tag: Peer
          value: '{#PEER_NAME}'
      - uuid: e29cb594cb9e4ba49da2e01f9608b359
        name: 'NTP Peer [{#PEER_NAME}]: Offset'
        type: DEPENDENT
        key: ntp.peer.offset[{#PEER_NAME}]
        delay: '0'
        value_type: FLOAT
        units: ms
        master_item:
          key: system.run[ntpq -p]
        preprocessing:
        - type: REGEX
          parameters:
          - (?m)^[*+x#o. -]?\s*{#PEER_NAME}\s+\S+\s+\S+\s+\S+\s+\S+\s+\S+\s+\d+\s+[-\d.]+\s+([-\d.]+)
          - \1
        tags:
        - tag: Application
          value: NTP-Peers
        - tag: Peer
          value: '{#PEER_NAME}'
      - uuid: 9e28865da43f4e01adc7eaf75b505276
        name: 'NTP Peer [{#PEER_NAME}]: Jitter'
        type: DEPENDENT
        key: ntp.peer.jitter[{#PEER_NAME}]
        delay: '0'
        value_type: FLOAT
        units: ms
        master_item:
          key: system.run[ntpq -p]
        preprocessing:
        - type: REGEX
          parameters:
          - (?m)^[*+x#o. -]?\s*{#PEER_NAME}\s+\S+\s+\S+\s+\S+\s+\S+\s+\S+\s+\d+\s+[-\d.]+\s+[-\d.]+\s+([-\d.]+)
          - \1
        tags:
        - tag: Application
          value: NTP-Peers
        - tag: Peer
          value: '{#PEER_NAME}'
      - uuid: ce035a3f6c1647ce8b93a7859198f458
        name: 'NTP Peer [{#PEER_NAME}]: Sync Status'
        type: DEPENDENT
        key: ntp.peer.status[{#PEER_NAME}]
        delay: '0'
        trends: '0'
        value_type: CHAR
        description: Peer sync role (master/standby/outlyer/falseticker/unreached)
        master_item:
          key: system.run[ntpq -p]
        preprocessing:
        - type: REGEX
          parameters:
          - (?m)^([*+x#o. -]?)\s*{#PEER_NAME}
          - \1
        - type: JAVASCRIPT
          parameters:
          - 'var t = value.trim();

            if (t === ''*'' || t === ''o'') return ''master'';

            if (t === ''+'') return ''standby'';

            if (t === ''-'') return ''outlyer'';

            if (t === ''x'') return ''falseticker'';

            if (t === ''#'') return ''selected'';

            return ''unreached'';'
        tags:
        - tag: Application
          value: NTP-Peers
        - tag: Peer
          value: '{#PEER_NAME}'
      graph_prototypes:
      - uuid: 43f75e9acab2413a89236dfe21cb4429
        name: NTP Peer [{#PEER_NAME}] Accuracy Trends
        graph_items:
        - drawtype: SINGLE_LINE
          color: 1A7C11
          item:
            host: template_ntp_accuracy_en
            key: ntp.peer.delay[{#PEER_NAME}]
        - sortorder: '1'
          drawtype: SINGLE_LINE
          color: F63100
          item:
            host: template_ntp_accuracy_en
            key: ntp.peer.offset[{#PEER_NAME}]
        - sortorder: '2'
          drawtype: SINGLE_LINE
          color: 0040FF
          item:
            host: template_ntp_accuracy_en
            key: ntp.peer.jitter[{#PEER_NAME}]
