zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: a571c0d144b14fd4a87a9d9b2aa9fcd6
    name: Templates/Applications
  templates:
  - uuid: de2422c2cc1c4b91804570548a4f3e81
    template: template_chrony_accuracy
    name: chronyテンプレート
    description: |
      ## 概要
      chrony 高精度時刻同期監視テンプレートです。
      NTPオフセット、遅延、ジッター、Stratum、および同期ソースの安定性を監視します。

      ## 要件
      - chrony (chronyd / chronyc) がインストールされていること
      - zabbix-agent または zabbix-agent2 でリモートコマンド実行が有効化されていること（詳細は README.md 参照）
    items:
    - uuid: ea13fc3c867c403395f31620546d2702
      name: NTPオフセット
      type: DEPENDENT
      key: Lastoffset
      delay: '0'
      value_type: FLOAT
      units: ms
      description: NTPサーバとの時刻ズレ
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.last_offset_ms
      master_item:
        key: system.run[chronyc -c tracking]
      tags:
      - tag: Application
        value: chrony
      triggers:
      - uuid: c02f379b59934e0b84e7f3ffa3229894
        expression: "last(/template_chrony_accuracy/Lastoffset)>{$NTP_OFFSET_LARGE} or \nlast(/template_chrony_accuracy/Lastoffset)<-{$NTP_OFFSET_LARGE}\n"
        name: 上位NTPとのずれが{$NTP_OFFSET_LARGE}msを超えました
        priority: WARNING
      - uuid: 141babfa4ebe4534a7c9160257af8084
        expression: "last(/template_chrony_accuracy/Lastoffset)>{$NTP_OFFSET_SMALL} or \nlast(/template_chrony_accuracy/Lastoffset)<-{$NTP_OFFSET_SMALL}\n"
        name: 上位NTPとのずれが{$NTP_OFFSET_SMALL}msを超えました
        priority: INFO
        dependencies:
        - name: 上位NTPとのずれが{$NTP_OFFSET_LARGE}msを超えました
          expression: "last(/template_chrony_accuracy/Lastoffset)>{$NTP_OFFSET_LARGE} or \nlast(/template_chrony_accuracy/Lastoffset)<-{$NTP_OFFSET_LARGE}\n"
    - uuid: fdccce2395204f3dbd8f87830e5f549c
      name: 同期状態
      type: DEPENDENT
      key: LeapStatus
      delay: '0'
      trends: '0'
      value_type: CHAR
      description: '同期状態

        Normal 正常

        Insert second 挿入

        Delete second 削除

        Not synchronized 同期していない

        '
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.leap_status
      master_item:
        key: system.run[chronyc -c tracking]
      tags:
      - tag: Application
        value: chrony
      triggers:
      - uuid: ea9e9045dca34aab9c91fe4772c13931
        expression: find(/template_chrony_accuracy/LeapStatus,,"regexp","Not synchronized")<>0
        name: NTPサーバーと同期していません。
        priority: WARNING
        type: MULTIPLE
    - uuid: f6be3329da674ac296b9cf951422c1be
      name: NTP同期サーバ
      type: DEPENDENT
      key: Reference
      delay: '0'
      trends: '0'
      value_type: CHAR
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.reference
      master_item:
        key: system.run[chronyc -c tracking]
      tags:
      - tag: Application
        value: chrony
    - uuid: a9886f17c7744bb9ba319c28c77bddb3
      name: NTPオフセット(長期平均)
      type: DEPENDENT
      key: RMSoffset
      delay: '0'
      value_type: FLOAT
      units: ms
      description: NTPサーバとの時刻ズレ
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.rms_offset_ms
      master_item:
        key: system.run[chronyc -c tracking]
      tags:
      - tag: Application
        value: chrony
    - uuid: 7dcef5d806c7485fa24cfc62c9b35703
      name: ネットワーク合計遅延
      type: DEPENDENT
      key: Rootdelay
      delay: '0'
      value_type: FLOAT
      units: ms
      description: stratum-1 までのネットワーク合計遅延です。
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.root_delay_ms
      master_item:
        key: system.run[chronyc -c tracking]
      tags:
      - tag: Application
        value: chrony
    - uuid: 0aba5928895e4add99178c13f50a1657
      name: NTP階層
      type: DEPENDENT
      key: Stratum
      delay: '0'
      description: 監視対象サーバーのstratum階層
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.stratum
      master_item:
        key: system.run[chronyc -c tracking]
      tags:
      - tag: Application
        value: chrony
    - uuid: fdd58fd68f864b59a8f9d5aaa3340d77
      name: chronyバージョン
      type: ZABBIX_ACTIVE
      key: system.run[chronyc -v]
      delay: 1h
      trends: '0'
      value_type: CHAR
      tags:
      - tag: Application
        value: chrony
    - uuid: 3fdb500bd080440eb9dbdd832889a536
      name: chronyc sources
      type: ZABBIX_ACTIVE
      key: system.run[chronyc sources]
      delay: 10m
      history: 60d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: Application
        value: chrony
    - uuid: 37266af48ce04ae0a614a24fd4321a4d
      name: chronyReach
      type: ZABBIX_ACTIVE
      key: system.run[chronyc sources|grep \* |awk '{print$5}']
      delay: 10m
      description: 過去8回の問合せ成功回数を8ビットで表現します。
      preprocessing:
      - type: OCTAL_TO_DECIMAL
        parameters:
        - ''
      tags:
      - tag: Application
        value: chrony
    - uuid: 2f7f73996c6b421cb4d40aa7681ffb6b
      name: chronyc tracking
      type: ZABBIX_ACTIVE
      key: system.run[chronyc -c tracking]
      delay: 10m
      history: 60d
      trends: '0'
      value_type: TEXT
      description: chronyc -c tracking の出力を取得し、Chrony 3.x (13列) / 4.x (14列) を自動判定してJSON化します。
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var parts = value.trim().split(',');
          var is_v4 = parts.length >= 14;
          return JSON.stringify({
              ref_id: parts[0],
              reference: is_v4 ? parts[1] : parts[0],
              stratum: parseInt(is_v4 ? parts[2] : parts[1]),
              system_time_s: parseFloat(is_v4 ? parts[4] : parts[3]),
              system_time_ms: parseFloat(is_v4 ? parts[4] : parts[3]) * 1000.0,
              system_time_dir: parseFloat(is_v4 ? parts[4] : parts[3]) >= 0 ? 'fast' : 'slow',
              last_offset_ms: parseFloat(is_v4 ? parts[5] : parts[4]) * 1000.0,
              rms_offset_ms: parseFloat(is_v4 ? parts[6] : parts[5]) * 1000.0,
              frequency_ppm: parseFloat(is_v4 ? parts[7] : parts[6]),
              root_delay_ms: parseFloat(is_v4 ? parts[10] : parts[9]) * 1000.0,
              update_interval_s: parseFloat(is_v4 ? parts[12] : parts[11]),
              leap_status: is_v4 ? parts[13] : parts[12]
          });
      tags:
      - tag: Application
        value: chrony
    - uuid: 804f6dcc64834c56b75e931e5c928af9
      name: NTP時刻差(方向)
      type: DEPENDENT
      key: Systemtime
      delay: '0'
      trends: '0'
      value_type: CHAR
      description: NTP時刻とsystem時刻との差の方向を示します。
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.system_time_dir
      master_item:
        key: system.run[chronyc -c tracking]
      tags:
      - tag: Application
        value: chrony
    - uuid: e91b18571db647dda2fd2d809765c398
      name: NTP時刻差(ms)
      type: DEPENDENT
      key: Systemtime_ms
      delay: '0'
      value_type: FLOAT
      units: ms
      description: NTP時刻とsystem時刻との差を示します。
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.system_time_ms
      master_item:
        key: system.run[chronyc -c tracking]
      tags:
      - tag: Application
        value: chrony
    - uuid: bdcf88649fe44836b0714572d3f37b07
      name: NTPポーリング間隔
      type: DEPENDENT
      key: Updateinterval
      delay: '0'
      value_type: FLOAT
      units: s
      description: NTPサーバとの同期間隔を示します。
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.update_interval_s
      master_item:
        key: system.run[chronyc -c tracking]
      tags:
      - tag: Application
        value: chrony
    macros:
    - macro: '{$NTP_OFFSET}'
      value: '50'
    - macro: '{$NTP_OFFSET_LARGE}'
      value: '5000'
    - macro: '{$NTP_OFFSET_SMALL}'
      value: '5'
      description: 許容オフセット微小閾値（ms）
    discovery_rules:
    - uuid: 7c8b9d0e1f2a4b4c8d6e7f8a9b0c1d2e
      name: NTP同期サーバー自動ディスカバリ
      type: DEPENDENT
      key: chrony.sources.discovery
      delay: 1h
      lifetime: 7d
      description: chronyc -c sources から全同期候補サーバー（マスター・予備）を検出し、ピアごとのアイテムを自動生成します。
      master_item:
        key: system.run[chronyc sources]
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - "var lines = value.trim().split('\\n');\nvar output = [];\nfor (var i = 0; i < lines.length; i++) {\n    var line = lines[i].trim();\n    if (line === '' || line.indexOf('=') === 0) continue;\n    var cols = line.split(/\\s+/);\n    if (cols.length >= 9 && (line.indexOf('^') === 0 || line.indexOf('=') === 0 || line.indexOf('#') === 0)) {\n        var name = cols[1];\n        var state = line.substring(1, 2);\n        output.push({\n            '{#SOURCE_NAME}': name,\n            '{#SOURCE_STATE}': state\n        });\n    }\n}\nreturn JSON.stringify(output);"
      item_prototypes:
      - uuid: 8a9b0c1d2e3f4a5b8c7d8e9f0a1b2c3d
        name: 'NTPソース [{#SOURCE_NAME}]: 到達性(Reach)'
        type: DEPENDENT
        key: chrony.source.reach[{#SOURCE_NAME}]
        delay: '0'
        description: 過去8回の問合せ成功回数（8進数レジスタ値）
        master_item:
          key: system.run[chronyc sources]
        preprocessing:
        - type: REGEX
          parameters:
          - (?m)^[\^\#\=][\*\+\-\?\~x]\s+{#SOURCE_NAME}\s+\S+\s+\S+\s+(\d+)
          - \1
        - type: OCTAL_TO_DECIMAL
          parameters:
          - ''
        tags:
        - tag: Application
          value: chrony-sources
        - tag: Source
          value: '{#SOURCE_NAME}'
        trigger_prototypes:
        - uuid: 9b0c1d2e3f4a4b6c8d8e9f0a1b2c3d4e
          expression: last(/template_chrony_accuracy/chrony.source.reach[{#SOURCE_NAME}])=0
          name: NTPソース [{#SOURCE_NAME}] への到達不可 (Reach 0)
          priority: WARNING
          description: 同期先サーバーへの問い合わせが8回連続で失敗しています。
      - uuid: a1b2c3d4e5f647b889d0e1f2a3b4c5d6
        name: 'NTPソース [{#SOURCE_NAME}]: 推定遅延'
        type: DEPENDENT
        key: chrony.source.delay[{#SOURCE_NAME}]
        delay: '0'
        value_type: FLOAT
        units: ms
        master_item:
          key: system.run[chronyc sources]
        preprocessing:
        - type: REGEX
          parameters:
          - (?m)^[\^\#\=][\*\+\-\?\~x]\s+{#SOURCE_NAME}\s+.*?\+/-\s*([+-]?[\d.]+)(ns|us|ms|s)
          - \1\2
        - type: JAVASCRIPT
          parameters:
          - 'var m = value.match(/([+-]?[\d.]+)(ns|us|ms|s)/);

            if (!m) return 0;

            var v = parseFloat(m[1]), u = m[2];

            if (u === ''ns'') return v / 1000000;

            if (u === ''us'') return v / 1000;

            if (u === ''ms'') return v;

            if (u === ''s'') return v * 1000;

            return v;'
        tags:
        - tag: Application
          value: chrony-sources
        - tag: Source
          value: '{#SOURCE_NAME}'
      - uuid: b2c3d4e5f6a748c980e1f2a3b4c5d6e7
        name: 'NTPソース [{#SOURCE_NAME}]: オフセット'
        type: DEPENDENT
        key: chrony.source.offset[{#SOURCE_NAME}]
        delay: '0'
        value_type: FLOAT
        units: ms
        master_item:
          key: system.run[chronyc sources]
        preprocessing:
        - type: REGEX
          parameters:
          - (?m)^[\^\#\=][\*\+\-\?\~x]\s+{#SOURCE_NAME}\s+.*?\s+([+-]?[\d.]+)(ns|us|ms|s)\[
          - \1\2
        - type: JAVASCRIPT
          parameters:
          - 'var m = value.match(/([+-]?[\d.]+)(ns|us|ms|s)/);

            if (!m) return 0;

            var v = parseFloat(m[1]), u = m[2];

            if (u === ''ns'') return v / 1000000;

            if (u === ''us'') return v / 1000;

            if (u === ''ms'') return v;

            if (u === ''s'') return v * 1000;

            return v;'
        tags:
        - tag: Application
          value: chrony-sources
        - tag: Source
          value: '{#SOURCE_NAME}'
      graph_prototypes:
      - uuid: c3d4e5f6a7b849d081f2a3b4c5d6e7f8
        name: NTPソース [{#SOURCE_NAME}] 精度推移
        graph_items:
        - drawtype: SINGLE_LINE
          color: 1A7C11
          item:
            host: template_chrony_accuracy
            key: chrony.source.offset[{#SOURCE_NAME}]
        - sortorder: '1'
          drawtype: SINGLE_LINE
          color: 2774A4
          yaxisside: RIGHT
          item:
            host: template_chrony_accuracy
            key: chrony.source.delay[{#SOURCE_NAME}]
    dashboards:
    - uuid: d4e5f6a7b8c940e182a3b4c5d6e7f8a9
      name: Chrony 時刻精度・同期サーバー集約ダッシュボード
      pages:
      - name: Overview
        widgets:
        - type: item
          name: システム時刻オフセット
          width: '24'
          height: '3'
          fields:
          - type: ITEM
            name: itemid.0
            value:
              host: template_chrony_accuracy
              key: Lastoffset
          - type: INTEGER
            name: show.0
            value: '1'
          - type: INTEGER
            name: show.1
            value: '2'
          - type: STRING
            name: thresholds.0.color
            value: 1A7C11
          - type: STRING
            name: thresholds.0.threshold
            value: '0'
          - type: STRING
            name: thresholds.1.color
            value: F63100
          - type: STRING
            name: thresholds.1.threshold
            value: '5'
        - type: item
          name: 現在同期マスター
          x: '24'
          width: '24'
          height: '3'
          fields:
          - type: ITEM
            name: itemid.0
            value:
              host: template_chrony_accuracy
              key: Reference
          - type: INTEGER
            name: show.0
            value: '1'
          - type: INTEGER
            name: show.1
            value: '2'
          - type: INTEGER
            name: value_size
            value: '35'
        - type: item
          name: Stratum 階層
          x: '48'
          width: '24'
          height: '3'
          fields:
          - type: ITEM
            name: itemid.0
            value:
              host: template_chrony_accuracy
              key: Stratum
          - type: INTEGER
            name: show.0
            value: '1'
          - type: INTEGER
            name: show.1
            value: '2'
          - type: INTEGER
            name: decimal_places
            value: '0'
        - type: svggraph
          name: 時刻オフセット推移 (Last offset & RMS)
          y: '3'
          width: '72'
          height: '6'
          fields:
          - type: INTEGER
            name: ds.0.color_palette
            value: '0'
          - type: STRING
            name: ds.0.items.0
            value: NTPオフセット
          - type: STRING
            name: ds.0.items.1
            value: NTPオフセット(長期平均)
          - type: INTEGER
            name: righty
            value: '0'
        - type: svggraph
          name: ネットワーク合計遅延推移 (Root delay)
          y: '9'
          width: '72'
          height: '5'
          fields:
          - type: INTEGER
            name: ds.0.color_palette
            value: '1'
          - type: STRING
            name: ds.0.items.0
            value: ネットワーク合計遅延
          - type: INTEGER
            name: righty
            value: '0'
    groups:
    - name: Templates/Applications
  graphs:
  - uuid: f3a3fa2555794a3caa0fd79f32fe8621
    name: chrony NTP精度情報
    graph_items:
    - drawtype: BOLD_LINE
      color: 1A7C11
      item:
        host: template_chrony_accuracy
        key: Lastoffset
    - sortorder: '1'
      drawtype: BOLD_LINE
      color: F63100
      item:
        host: template_chrony_accuracy
        key: RMSoffset
    - sortorder: '2'
      drawtype: BOLD_LINE
      color: 2774A4
      item:
        host: template_chrony_accuracy
        key: Systemtime_ms
