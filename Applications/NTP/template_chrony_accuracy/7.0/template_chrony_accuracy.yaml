zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: a571c0d144b14fd4a87a9d9b2aa9fcd6
    name: Templates/Applications
  templates:
  - uuid: 30f2c4f12b2f41eaada280c6c88ac948
    template: template_chrony_accuracy_en
    name: Chrony Accuracy Monitoring
    description: Chrony time synchronization quality and sources accuracy monitoring template.
    items:
    - uuid: bddd5c066bdf4b909a79b604b9f86f67
      name: NTP offset
      type: DEPENDENT
      key: Lastoffset
      delay: '0'
      value_type: FLOAT
      units: ms
      description: Time difference between NTP server and system clock
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.last_offset_ms
      master_item:
        key: system.run[chronyc -c tracking]
      tags:
      - tag: Application
        value: chrony
      triggers:
      - uuid: f2d13e63656748bea7d6d1fafe0da8ac
        expression: "last(/template_chrony_accuracy_en/Lastoffset)>{$NTP_OFFSET_LARGE} or \nlast(/template_chrony_accuracy_en/Lastoffset)<-{$NTP_OFFSET_LARGE}\n"
        name: NTP offset exceeds {$NTP_OFFSET_LARGE}ms
        priority: WARNING
      - uuid: f757aeea1b794caca353c5b2692573ce
        expression: "last(/template_chrony_accuracy_en/Lastoffset)>{$NTP_OFFSET_SMALL} or \nlast(/template_chrony_accuracy_en/Lastoffset)<-{$NTP_OFFSET_SMALL}\n"
        name: NTP offset exceeds {$NTP_OFFSET_SMALL}ms
        priority: INFO
        dependencies:
        - name: NTP offset exceeds {$NTP_OFFSET_LARGE}ms
          expression: "last(/template_chrony_accuracy_en/Lastoffset)>{$NTP_OFFSET_LARGE} or \nlast(/template_chrony_accuracy_en/Lastoffset)<-{$NTP_OFFSET_LARGE}\n"
    - uuid: 1277b6e2c295418d98086e177603ae10
      name: Synchronization state
      type: DEPENDENT
      key: LeapStatus
      delay: '0'
      trends: '0'
      value_type: CHAR
      description: 'Synchronization status:

        Normal: Synchronized

        Insert second: Leap second insertion

        Delete second: Leap second deletion

        Not synchronized: Unsynchronized

        '
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.leap_status
      master_item:
        key: system.run[chronyc -c tracking]
      tags:
      - tag: Application
        value: chrony
      triggers:
      - uuid: ac67d300ea9a4d62a72c1e37be152f01
        expression: find(/template_chrony_accuracy_en/LeapStatus,,"regexp","Not synchronized")<>0
        name: Not synchronized with NTP server
        priority: WARNING
        type: MULTIPLE
    - uuid: 25b50c12b656498aa0b4fb5e6c52bbff
      name: NTP reference ID
      type: DEPENDENT
      key: Reference
      delay: '0'
      trends: '0'
      value_type: CHAR
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.reference
      master_item:
        key: system.run[chronyc -c tracking]
      tags:
      - tag: Application
        value: chrony
    - uuid: 61ae4ff522ac4de5a3dde807d461a5b8
      name: NTP RMS offset
      type: DEPENDENT
      key: RMSoffset
      delay: '0'
      value_type: FLOAT
      units: ms
      description: Time difference between NTP server and system clock
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.rms_offset_ms
      master_item:
        key: system.run[chronyc -c tracking]
      tags:
      - tag: Application
        value: chrony
    - uuid: 251f21fcb5444408a5166753dddd63b5
      name: Network root delay
      type: DEPENDENT
      key: Rootdelay
      delay: '0'
      value_type: FLOAT
      units: ms
      description: Total network round-trip delay to stratum-1 server.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.root_delay_ms
      master_item:
        key: system.run[chronyc -c tracking]
      tags:
      - tag: Application
        value: chrony
    - uuid: b12e0a9aacfb4f5798357ea0a9c08b0a
      name: NTP stratum
      type: DEPENDENT
      key: Stratum
      delay: '0'
      description: Stratum level of the monitored server.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.stratum
      master_item:
        key: system.run[chronyc -c tracking]
      tags:
      - tag: Application
        value: chrony
    - uuid: 01c135a55e294c09a117bb30ff53fe57
      name: chrony version
      type: ZABBIX_ACTIVE
      key: system.run[chronyc -v]
      delay: 1h
      trends: '0'
      value_type: CHAR
      tags:
      - tag: Application
        value: chrony
    - uuid: 4b739058d4e242d5a29c47da90734b96
      name: chronyc sources
      type: ZABBIX_ACTIVE
      key: system.run[chronyc sources]
      delay: 10m
      history: 60d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: Application
        value: chrony
    - uuid: d9c30e699c9f4a00a85f83c9ddfb1ff9
      name: chrony reachability
      type: ZABBIX_ACTIVE
      key: system.run[chronyc sources|grep \* |awk '{print$5}']
      delay: 10m
      description: Success count of the last 8 inquiries represented as an 8-bit octal value.
      preprocessing:
      - type: OCTAL_TO_DECIMAL
        parameters:
        - ''
      tags:
      - tag: Application
        value: chrony
    - uuid: 091869a414304b39bc778475b6986a8d
      name: chronyc tracking
      type: ZABBIX_ACTIVE
      key: system.run[chronyc -c tracking]
      delay: 10m
      history: 60d
      trends: '0'
      value_type: TEXT
      description: Collects chronyc -c tracking output and automatically converts Chrony 3.x (13 cols) or 4.x (14 cols) to JSON.
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var parts = value.trim().split(',');
          var is_v4 = parts.length >= 14;
          return JSON.stringify({
              ref_id: parts[0],
              reference: is_v4 ? parts[1] : parts[0],
              stratum: parseInt(is_v4 ? parts[2] : parts[1]),
              system_time_s: parseFloat(is_v4 ? parts[4] : parts[3]),
              system_time_ms: parseFloat(is_v4 ? parts[4] : parts[3]) * 1000.0,
              system_time_dir: parseFloat(is_v4 ? parts[4] : parts[3]) >= 0 ? 'fast' : 'slow',
              last_offset_ms: parseFloat(is_v4 ? parts[5] : parts[4]) * 1000.0,
              rms_offset_ms: parseFloat(is_v4 ? parts[6] : parts[5]) * 1000.0,
              frequency_ppm: parseFloat(is_v4 ? parts[7] : parts[6]),
              root_delay_ms: parseFloat(is_v4 ? parts[10] : parts[9]) * 1000.0,
              update_interval_s: parseFloat(is_v4 ? parts[12] : parts[11]),
              leap_status: is_v4 ? parts[13] : parts[12]
          });
      tags:
      - tag: Application
        value: chrony
    - uuid: 62d83add57b04be9a29f2ce7fc7acbcd
      name: System time direction
      type: DEPENDENT
      key: Systemtime
      delay: '0'
      trends: '0'
      value_type: CHAR
      description: Direction of time difference between NTP and system clock (fast/slow).
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.system_time_dir
      master_item:
        key: system.run[chronyc -c tracking]
      tags:
      - tag: Application
        value: chrony
    - uuid: cf19fcfc439a46f1b0956311f1a01e42
      name: System time offset (ms)
      type: DEPENDENT
      key: Systemtime_ms
      delay: '0'
      value_type: FLOAT
      units: ms
      description: Time difference between NTP and system clock in milliseconds.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.system_time_ms
      master_item:
        key: system.run[chronyc -c tracking]
      tags:
      - tag: Application
        value: chrony
    - uuid: f1a75d4ad7e741869db20e8df010af67
      name: NTP update interval
      type: DEPENDENT
      key: Updateinterval
      delay: '0'
      value_type: FLOAT
      units: s
      description: Polling/update interval with the NTP server in seconds.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.update_interval_s
      master_item:
        key: system.run[chronyc -c tracking]
      tags:
      - tag: Application
        value: chrony
    macros:
    - macro: '{$NTP_OFFSET}'
      value: '50'
    - macro: '{$NTP_OFFSET_LARGE}'
      value: '5000'
    - macro: '{$NTP_OFFSET_SMALL}'
      value: '5'
      description: Acceptable offset small threshold (ms)
    discovery_rules:
    - uuid: 8eb8f5a4c8e14dcf8de4b6afd41f6c52
      name: NTP sources discovery
      type: DEPENDENT
      key: chrony.sources.discovery
      delay: 1h
      lifetime: 7d
      description: Discovers all NTP sources and registers item/trigger prototypes.
      master_item:
        key: system.run[chronyc sources]
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - "var lines = value.trim().split('\\n');\nvar output = [];\nfor (var i = 0; i < lines.length; i++) {\n    var line = lines[i].trim();\n    if (line === '' || line.indexOf('=') === 0) continue;\n    var cols = line.split(/\\s+/);\n    if (cols.length >= 9 && (line.indexOf('^') === 0 || line.indexOf('=') === 0 || line.indexOf('#') === 0)) {\n        var name = cols[1];\n        var state = line.substring(1, 2);\n        output.push({\n            '{#SOURCE_NAME}': name,\n            '{#SOURCE_STATE}': state\n        });\n    }\n}\nreturn JSON.stringify(output);"
      item_prototypes:
      - uuid: ad578b425cd3477eb61bb9e4a1c40be7
        name: 'NTP source [{#SOURCE_NAME}]: Reachability'
        type: DEPENDENT
        key: chrony.source.reach[{#SOURCE_NAME}]
        delay: '0'
        description: Reachability register value (octal) representing last 8 polls.
        master_item:
          key: system.run[chronyc sources]
        preprocessing:
        - type: REGEX
          parameters:
          - (?m)^[\^\#\=][\*\+\-\?\~x]\s+{#SOURCE_NAME}\s+\S+\s+\S+\s+(\d+)
          - \1
        - type: OCTAL_TO_DECIMAL
          parameters:
          - ''
        tags:
        - tag: Application
          value: chrony-sources
        - tag: Source
          value: '{#SOURCE_NAME}'
        trigger_prototypes:
        - uuid: 92d21f67528440a695268b7afaca31af
          expression: last(/template_chrony_accuracy_en/chrony.source.reach[{#SOURCE_NAME}])=0
          name: NTP source [{#SOURCE_NAME}] is unreachable (Reach 0)
          priority: WARNING
          description: NTP query to this source failed 8 consecutive times.
      - uuid: 7091f6f6efca4012a80780b7f67b8ba2
        name: 'NTP source [{#SOURCE_NAME}]: Delay'
        type: DEPENDENT
        key: chrony.source.delay[{#SOURCE_NAME}]
        delay: '0'
        value_type: FLOAT
        units: ms
        master_item:
          key: system.run[chronyc sources]
        preprocessing:
        - type: REGEX
          parameters:
          - (?m)^[\^\#\=][\*\+\-\?\~x]\s+{#SOURCE_NAME}\s+.*?\+/-\s*([+-]?[\d.]+)(ns|us|ms|s)
          - \1\2
        - type: JAVASCRIPT
          parameters:
          - 'var m = value.match(/([+-]?[\d.]+)(ns|us|ms|s)/);

            if (!m) return 0;

            var v = parseFloat(m[1]), u = m[2];

            if (u === ''ns'') return v / 1000000;

            if (u === ''us'') return v / 1000;

            if (u === ''ms'') return v;

            if (u === ''s'') return v * 1000;

            return v;'
        tags:
        - tag: Application
          value: chrony-sources
        - tag: Source
          value: '{#SOURCE_NAME}'
      - uuid: 9c97496cfe8341d18bd26c40aebb11ce
        name: 'NTP source [{#SOURCE_NAME}]: Offset'
        type: DEPENDENT
        key: chrony.source.offset[{#SOURCE_NAME}]
        delay: '0'
        value_type: FLOAT
        units: ms
        master_item:
          key: system.run[chronyc sources]
        preprocessing:
        - type: REGEX
          parameters:
          - (?m)^[\^\#\=][\*\+\-\?\~x]\s+{#SOURCE_NAME}\s+.*?\s+([+-]?[\d.]+)(ns|us|ms|s)\[
          - \1\2
        - type: JAVASCRIPT
          parameters:
          - 'var m = value.match(/([+-]?[\d.]+)(ns|us|ms|s)/);

            if (!m) return 0;

            var v = parseFloat(m[1]), u = m[2];

            if (u === ''ns'') return v / 1000000;

            if (u === ''us'') return v / 1000;

            if (u === ''ms'') return v;

            if (u === ''s'') return v * 1000;

            return v;'
        tags:
        - tag: Application
          value: chrony-sources
        - tag: Source
          value: '{#SOURCE_NAME}'
      graph_prototypes:
      - uuid: 8e49ceb15e16425da07dc6d3dfa0a884
        name: NTP source [{#SOURCE_NAME}] accuracy trend
        graph_items:
        - drawtype: SINGLE_LINE
          color: 1A7C11
          item:
            host: template_chrony_accuracy_en
            key: chrony.source.offset[{#SOURCE_NAME}]
        - sortorder: '1'
          drawtype: SINGLE_LINE
          color: 2774A4
          yaxisside: RIGHT
          item:
            host: template_chrony_accuracy_en
            key: chrony.source.delay[{#SOURCE_NAME}]
    dashboards:
    - uuid: fe2c029070874b6b8c7ce1aa8051d94c
      name: Chrony Time Sync & Sources Aggregate Dashboard
      pages:
      - name: Overview
        widgets:
        - type: item
          name: System time offset
          width: '24'
          height: '3'
          fields:
          - type: ITEM
            name: itemid.0
            value:
              host: template_chrony_accuracy_en
              key: Lastoffset
          - type: INTEGER
            name: show.0
            value: '1'
          - type: INTEGER
            name: show.1
            value: '2'
          - type: STRING
            name: thresholds.0.color
            value: 1A7C11
          - type: STRING
            name: thresholds.0.threshold
            value: '0'
          - type: STRING
            name: thresholds.1.color
            value: F63100
          - type: STRING
            name: thresholds.1.threshold
            value: '5'
        - type: item
          name: Active reference peer
          x: '24'
          width: '24'
          height: '3'
          fields:
          - type: ITEM
            name: itemid.0
            value:
              host: template_chrony_accuracy_en
              key: Reference
          - type: INTEGER
            name: show.0
            value: '1'
          - type: INTEGER
            name: show.1
            value: '2'
          - type: INTEGER
            name: value_size
            value: '35'
        - type: item
          name: Stratum level
          x: '48'
          width: '24'
          height: '3'
          fields:
          - type: ITEM
            name: itemid.0
            value:
              host: template_chrony_accuracy_en
              key: Stratum
          - type: INTEGER
            name: show.0
            value: '1'
          - type: INTEGER
            name: show.1
            value: '2'
          - type: INTEGER
            name: decimal_places
            value: '0'
        - type: svggraph
          name: Offset trends (Last offset & RMS)
          y: '3'
          width: '72'
          height: '6'
          fields:
          - type: INTEGER
            name: ds.0.color_palette
            value: '0'
          - type: STRING
            name: ds.0.items.0
            value: NTP offset
          - type: STRING
            name: ds.0.items.1
            value: NTP RMS offset
          - type: INTEGER
            name: righty
            value: '0'
        - type: svggraph
          name: Network root delay trend
          y: '9'
          width: '72'
          height: '5'
          fields:
          - type: INTEGER
            name: ds.0.color_palette
            value: '1'
          - type: STRING
            name: ds.0.items.0
            value: Network root delay
          - type: INTEGER
            name: righty
            value: '0'
    groups:
    - name: Templates/Applications
  graphs:
  - uuid: acbb79ebfe0747a48ffb845cb187f2db
    name: Chrony Time Synchronization Quality Dashboard
    graph_items:
    - drawtype: BOLD_LINE
      color: 1A7C11
      item:
        host: template_chrony_accuracy_en
        key: Lastoffset
    - sortorder: '1'
      drawtype: BOLD_LINE
      color: F63100
      item:
        host: template_chrony_accuracy_en
        key: RMSoffset
    - sortorder: '2'
      drawtype: BOLD_LINE
      color: 2774A4
      item:
        host: template_chrony_accuracy_en
        key: Systemtime_ms
