zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: a571c0d144b14fd4a87a9d9b2aa9fcd6
    name: Templates/Applications
  templates:
  - uuid: 024ab0f7fd4240ada2de6a143173c6a3
    template: template_ntp_remote_accuracy
    name: NTPテンプレート（リモート）
    description: "## Overview\n\nNTP accuracy Template の日本語版です  \n英語版は[こちら](cat-app/ntp-accuracy-template)English version of the template is in the [link](cat-app/ntp-accuracy-template) .\n\n\n \n\n\nテンプレートを利用する場合zabbix\\_agentd.confでリモートコマンドを有効にしてください。\n\n\nEnableRemoteCommands=1  \nAllowKey=system.run[*]  # For Zabbix Agent 5.0+\nUnsafeUserParameters=1\n\n\nZabbixAgentがインストールされた環境に対しては  \nNTPテンプレートが使用できます。\n\n\nNTPアプライアンスなどZabbixAgentが使用できない環境のNTPサーバに対しては  \nNTPテンプレート（リモート）が使用できます。\n\n\nNTPテンプレート（リモート）を利用する場合はホストマクロにおいて  \n{$NTP\\_IP}に監視対象のIPアドレスを指定してください。\n\n\nntpqによって表示されるすべての項目が監視できます。\n\n\nNTP精度情報をグラフ化することが可能です。\n\n\n \n"
    items:
    - uuid: fecfe76f83874f26ba0633c24b4cbcfb
      name: ntpq({$NTP_IP})
      type: ZABBIX_ACTIVE
      key: system.run[ntpq -p {$NTP_IP}]
      delay: '3600'
      trends: '0'
      value_type: TEXT
      description: "\"*\"\t参照同期中のサーバーを表している\n\"+\"\tクロック誤り検査に合格したサーバー\n\"#\"\t参照同期中ではあるが、距離が遠いサーバー\n\" \"\t左に何も表示されない場合（空欄）、サーバーを参照していない\n\"x\"\tクロック誤り検査に不合格となったサーバー\n\". \"\t参照リストから除外されたサーバー\nrefid\tNTPサーバーが参照している上位ホスト名 or IPアドレス\nst\tNTPサーバーの階層\nt\t階層のタイプ　l:local、u:unicast、m:multicast、b:broadcast\nwhen\t最後のパケットを受け取ってからの時間（秒）\npoll\t問い合わせを行う間隔（秒）\nreach\t到達可能性に関するレジスタ・データ（8進数）\ndelay\t推定遅延（ミリ秒）\noffset\t偏差補償（ミリ秒）\njitter\tRMS Jitterの平均値（ミリ秒）\n"
      tags:
      - tag: Application
        value: NTP(リモート)
    - uuid: eb50dd404259418d9daf0c25a5f1c1b0
      name: NTP同期サーバ({$NTP_IP})
      type: DEPENDENT
      key: ntp.peer.remote
      delay: '0'
      history: 60d
      trends: '0'
      value_type: TEXT
      description: 同期しているNTPサーバー名
      tags:
      - tag: Application
        value: NTP(リモート)
      triggers:
      - uuid: c87d163a486748bbbb41141652e002f0
        expression: (last(/template_ntp_remote_accuracy/ntp.peer.remote,#1)<>last(/template_ntp_remote_accuracy/ntp.peer.remote,#2))=1
        name: 同期しているNTPサーバが変更されました。({$NTP_IP})
        status: DISABLED
        priority: INFO
      master_item:
        key: system.run[ntpq -p {$NTP_IP}]
      preprocessing:
      - type: REGEX
        parameters:
        - (?m)^[*o]\s*(\S+)
        - \1
    - uuid: 6e7a81899d1b40249a4641098c92d438
      name: NTP上位サーバ({$NTP_IP})
      type: DEPENDENT
      key: ntp.refid.remote
      delay: '0'
      history: 60d
      trends: '0'
      value_type: TEXT
      description: 同期しているNTPサーバーの上位NTPサーバ
      tags:
      - tag: Application
        value: NTP(リモート)
      master_item:
        key: system.run[ntpq -p {$NTP_IP}]
      preprocessing:
      - type: REGEX
        parameters:
        - (?m)^[*o]\s*\S+\s+(\S+)
        - \1
    - uuid: ed928784f44643d89b2a4f0e7f334546
      name: NTP階層({$NTP_IP})
      type: DEPENDENT
      key: ntp.stratum.remote
      delay: '0'
      history: 60d
      description: 同期しているNTPサーバーのstratum
      tags:
      - tag: Application
        value: NTP(リモート)
      master_item:
        key: system.run[ntpq -p {$NTP_IP}]
      preprocessing:
      - type: REGEX
        parameters:
        - (?m)^[*o]\s*\S+\s+\S+\s+(\d+)
        - \1
    - uuid: 8502c95081e74881a968675eec5857f4
      name: NTPポーリング間隔({$NTP_IP})
      type: DEPENDENT
      key: ntp.poll.remote
      delay: '0'
      history: 60d
      units: s
      description: NTPサーバとの同期間隔
      tags:
      - tag: Application
        value: NTP(リモート)
      master_item:
        key: system.run[ntpq -p {$NTP_IP}]
      preprocessing:
      - type: REGEX
        parameters:
        - (?m)^[*o]\s*\S+\s+\S+\s+\d+\s+\S+\s+\S+\s+(\d+)
        - \1
    - uuid: 1c5fa8d4c36e4a849660406bbb272083
      name: NTP推定遅延({$NTP_IP})
      type: DEPENDENT
      key: ntp.delay.remote
      delay: '0'
      history: 60d
      value_type: FLOAT
      units: ms
      description: NTPパケットの推定遅延時間
      tags:
      - tag: Application
        value: NTP(リモート)
      master_item:
        key: system.run[ntpq -p {$NTP_IP}]
      preprocessing:
      - type: REGEX
        parameters:
        - (?m)^[*o]\s*\S+\s+\S+\s+\d+\s+\S+\s+\S+\s+\d+\s+\d+\s+([-\d.]+)
        - \1
    - uuid: 36cf9d55f851405b8706f0bed8bf6566
      name: NTPオフセット({$NTP_IP})
      type: DEPENDENT
      key: ntp.offset.remote
      delay: '0'
      history: 60d
      value_type: FLOAT
      units: ms
      description: NTPサーバとの時刻ズレ
      tags:
      - tag: Application
        value: NTP(リモート)
      triggers:
      - uuid: 525b0f6f409e45d6ae06d4308ec44a74
        expression: last(/template_ntp_remote_accuracy/ntp.offset.remote)>5000 or last(/template_ntp_remote_accuracy/ntp.offset.remote)<-5000
        name: 上位NTPとのずれが5sを超えました({$NTP_IP})
        priority: AVERAGE
      - uuid: 5ba5a0128a6b4738bb0e592f9e8fdcd8
        expression: last(/template_ntp_remote_accuracy/ntp.offset.remote)>50 or last(/template_ntp_remote_accuracy/ntp.offset.remote)<-50
        name: 上位NTPとのずれが50msを超えました({$NTP_IP})
        priority: WARNING
        dependencies:
        - name: 上位NTPとのずれが5sを超えました({$NTP_IP})
          expression: last(/template_ntp_remote_accuracy/ntp.offset.remote)>5000 or last(/template_ntp_remote_accuracy/ntp.offset.remote)<-5000
      master_item:
        key: system.run[ntpq -p {$NTP_IP}]
      preprocessing:
      - type: REGEX
        parameters:
        - (?m)^[*o]\s*\S+\s+\S+\s+\d+\s+\S+\s+\S+\s+\d+\s+\d+\s+[-\d.]+\s+([-\d.]+)
        - \1
    - uuid: a152b245776e4017802215d2a4f711ff
      name: NTP分散({$NTP_IP})
      type: DEPENDENT
      key: ntp.jitter.remote
      delay: '0'
      history: 60d
      value_type: FLOAT
      units: ms
      description: NTPオフセットの過去8回の分散平均値
      tags:
      - tag: Application
        value: NTP(リモート)
      master_item:
        key: system.run[ntpq -p {$NTP_IP}]
      preprocessing:
      - type: REGEX
        parameters:
        - (?m)^[*o]\s*\S+\s+\S+\s+\d+\s+\S+\s+\S+\s+\d+\s+\d+\s+[-\d.]+\s+[-\d.]+\s+([-\d.]+)
        - \1
    macros:
    - macro: '{$NTP_IP}'
      value: 127.0.0.1
    dashboards:
    - uuid: e5f6a7b8c9d041f283b4c5d6e7f8a9b0
      name: NTP (リモート) 時刻精度ダッシュボード
      pages:
      - name: Overview
        widgets:
        - type: item
          name: NTPオフセット (ms)
          width: '24'
          height: '3'
          fields:
          - type: ITEM
            name: itemid.0
            value:
              host: template_ntp_remote_accuracy
              key: ntp.offset.remote
          - type: INTEGER
            name: show.0
            value: '1'
          - type: INTEGER
            name: show.1
            value: '2'
          - type: STRING
            name: thresholds.0.color
            value: 1A7C11
          - type: STRING
            name: thresholds.0.threshold
            value: '0'
          - type: STRING
            name: thresholds.1.color
            value: F63100
          - type: STRING
            name: thresholds.1.threshold
            value: '50'
        - type: item
          name: 同期サーバ
          x: '24'
          width: '24'
          height: '3'
          fields:
          - type: ITEM
            name: itemid.0
            value:
              host: template_ntp_remote_accuracy
              key: ntp.peer.remote
          - type: INTEGER
            name: show.0
            value: '1'
          - type: INTEGER
            name: show.1
            value: '2'
          - type: INTEGER
            name: value_size
            value: '35'
        - type: item
          name: Stratum 階層
          x: '48'
          width: '24'
          height: '3'
          fields:
          - type: ITEM
            name: itemid.0
            value:
              host: template_ntp_remote_accuracy
              key: ntp.stratum.remote
          - type: INTEGER
            name: show.0
            value: '1'
          - type: INTEGER
            name: show.1
            value: '2'
          - type: INTEGER
            name: decimal_places
            value: '0'
        - type: svggraph
          name: NTPオフセット & ジッター推移
          y: '3'
          width: '72'
          height: '6'
          fields:
          - type: INTEGER
            name: ds.0.color_palette
            value: '0'
          - type: STRING
            name: ds.0.items.0
            value: 'NTPオフセット({$NTP_IP})'
          - type: STRING
            name: ds.0.items.1
            value: 'NTP分散({$NTP_IP})'
          - type: INTEGER
            name: righty
            value: '0'
        - type: svggraph
          name: NTP推定遅延 (Delay)
          y: '9'
          width: '72'
          height: '5'
          fields:
          - type: INTEGER
            name: ds.0.color_palette
            value: '1'
          - type: STRING
            name: ds.0.items.0
            value: 'NTP推定遅延({$NTP_IP})'
          - type: INTEGER
            name: righty
            value: '0'
    groups:
    - name: Templates/Applications
    discovery_rules:
    - uuid: 66d290070d0a4d9ab52ffda2352cdea2
      name: NTPピア自動検出({$NTP_IP})
      type: DEPENDENT
      key: ntp.peers.discovery.remote
      delay: '0'
      master_item:
        key: system.run[ntpq -p {$NTP_IP}]
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - "var lines = value.trim().split('\\n');\nvar output = [];\nfor (var i = 0; i < lines.length; i++) {\n    var line = lines[i].trim();\n    if (line === '' || line.indexOf('=') === 0 || line.indexOf('remote') === 0) continue;\n    var m = line.match(/^[*+x#o. -]?\\s*(\\S+)/);\n    if (m && m[1]) {\n        output.push({\n            '{#PEER_NAME}': m[1]\n        });\n    }\n}\nreturn JSON.stringify(output);"
      item_prototypes:
      - uuid: eb5e29a790c14f30a75ac6d369f1fac1
        name: 'NTPピア [{#PEER_NAME}]: 到達性(Reach)'
        type: DEPENDENT
        key: ntp.peer.reach.remote[{#PEER_NAME}]
        delay: '0'
        description: 過去8回の問合せ成功回数（8進数レジスタ値）
        master_item:
          key: system.run[ntpq -p {$NTP_IP}]
        preprocessing:
        - type: REGEX
          parameters:
          - (?m)^[*+x#o. -]?\s*{#PEER_NAME}\s+\S+\s+\S+\s+\S+\s+\S+\s+\S+\s+(\d+)
          - \1
        - type: OCTAL_TO_DECIMAL
          parameters:
          - ''
        tags:
        - tag: Application
          value: NTP-Peers
        - tag: Peer
          value: '{#PEER_NAME}'
        trigger_prototypes:
        - uuid: 7dc819f9c56f42479152b3eababa3190
          expression: last(/template_ntp_remote_accuracy/ntp.peer.reach.remote[{#PEER_NAME}])=0
          name: NTPピア [{#PEER_NAME}] への到達不可 (Reach 0)
          priority: WARNING
          description: NTPピアへの問い合わせが8回連続で失敗しています。
      - uuid: 0f0d7a566f74497fa126d192cf8a810f
        name: 'NTPピア [{#PEER_NAME}]: 推定遅延'
        type: DEPENDENT
        key: ntp.peer.delay.remote[{#PEER_NAME}]
        delay: '0'
        value_type: FLOAT
        units: ms
        master_item:
          key: system.run[ntpq -p {$NTP_IP}]
        preprocessing:
        - type: REGEX
          parameters:
          - (?m)^[*+x#o. -]?\s*{#PEER_NAME}\s+\S+\s+\S+\s+\S+\s+\S+\s+\S+\s+\d+\s+([-\d.]+)
          - \1
        tags:
        - tag: Application
          value: NTP-Peers
        - tag: Peer
          value: '{#PEER_NAME}'
      - uuid: e06c8dbdb7784975a017841211ef3f3c
        name: 'NTPピア [{#PEER_NAME}]: オフセット'
        type: DEPENDENT
        key: ntp.peer.offset.remote[{#PEER_NAME}]
        delay: '0'
        value_type: FLOAT
        units: ms
        master_item:
          key: system.run[ntpq -p {$NTP_IP}]
        preprocessing:
        - type: REGEX
          parameters:
          - (?m)^[*+x#o. -]?\s*{#PEER_NAME}\s+\S+\s+\S+\s+\S+\s+\S+\s+\S+\s+\d+\s+[-\d.]+\s+([-\d.]+)
          - \1
        tags:
        - tag: Application
          value: NTP-Peers
        - tag: Peer
          value: '{#PEER_NAME}'
      - uuid: 0f5f67ea30d04435899a8b5b84ff372d
        name: 'NTPピア [{#PEER_NAME}]: 分散(Jitter)'
        type: DEPENDENT
        key: ntp.peer.jitter.remote[{#PEER_NAME}]
        delay: '0'
        value_type: FLOAT
        units: ms
        master_item:
          key: system.run[ntpq -p {$NTP_IP}]
        preprocessing:
        - type: REGEX
          parameters:
          - (?m)^[*+x#o. -]?\s*{#PEER_NAME}\s+\S+\s+\S+\s+\S+\s+\S+\s+\S+\s+\d+\s+[-\d.]+\s+[-\d.]+\s+([-\d.]+)
          - \1
        tags:
        - tag: Application
          value: NTP-Peers
        - tag: Peer
          value: '{#PEER_NAME}'
      - uuid: 07a451f579044885bbc7cd7b9a84ce17
        name: 'NTPピア [{#PEER_NAME}]: 同期状態'
        type: DEPENDENT
        key: ntp.peer.status.remote[{#PEER_NAME}]
        delay: '0'
        trends: '0'
        value_type: CHAR
        description: 同期役割 (master/standby/outlyer/falseticker/unreached)
        master_item:
          key: system.run[ntpq -p {$NTP_IP}]
        preprocessing:
        - type: REGEX
          parameters:
          - (?m)^([*+x#o. -]?)\s*{#PEER_NAME}
          - \1
        - type: JAVASCRIPT
          parameters:
          - 'var t = value.trim();

            if (t === ''*'' || t === ''o'') return ''master'';

            if (t === ''+'') return ''standby'';

            if (t === ''-'') return ''outlyer'';

            if (t === ''x'') return ''falseticker'';

            if (t === ''#'') return ''selected'';

            return ''unreached'';'
        tags:
        - tag: Application
          value: NTP-Peers
        - tag: Peer
          value: '{#PEER_NAME}'
      graph_prototypes:
      - uuid: 0a1148b8359f4afdb912836df812c348
        name: NTPピア [{#PEER_NAME}] 精度推移
        graph_items:
        - drawtype: SINGLE_LINE
          color: 1A7C11
          item:
            host: template_ntp_remote_accuracy
            key: ntp.peer.delay.remote[{#PEER_NAME}]
        - sortorder: '1'
          drawtype: SINGLE_LINE
          color: F63100
          item:
            host: template_ntp_remote_accuracy
            key: ntp.peer.offset.remote[{#PEER_NAME}]
        - sortorder: '2'
          drawtype: SINGLE_LINE
          color: 0040FF
          item:
            host: template_ntp_remote_accuracy
            key: ntp.peer.jitter.remote[{#PEER_NAME}]
  - uuid: fdb854ebadd64352a7ffe86ce1a69b98
    template: template_ntp_accuracy
    name: NTPテンプレート
    description: "## Overview\n\nNTP accuracy Template の日本語版です  \n英語版は[こちら](cat-app/ntp-accuracy-template)English version of the template is in the [link](cat-app/ntp-accuracy-template) .\n\n\n \n\n\nテンプレートを利用する場合zabbix\\_agentd.confでリモートコマンドを有効にしてください。\n\n\nEnableRemoteCommands=1  \nAllowKey=system.run[*]  # For Zabbix Agent 5.0+\nUnsafeUserParameters=1\n\n\nZabbixAgentがインストールされた環境に対しては  \nNTPテンプレートが使用できます。\n\n\nNTPアプライアンスなどZabbixAgentが使用できない環境のNTPサーバに対しては  \nNTPテンプレート（リモート）が使用できます。\n\n\nNTPテンプレート（リモート）を利用する場合はホストマクロにおいて  \n{$NTP\\_IP}に監視対象のIPアドレスを指定してください。\n\n\nntpqによって表示されるすべての項目が監視できます。\n\n\nNTP精度情報をグラフ化することが可能です。\n\n\n \n\n\n\n## Overview\n\nNTP accuracy Template の日本語版です  \n英語版は[こちら](cat-app/ntp-accuracy-template)English version of the template is in the [link](cat-app/ntp-accuracy-template) .\n\n\n \n\n\nテンプレートを利用する場合zabbix\\_agentd.confでリモートコマンドを有効にしてください。\n\n\nEnableRemoteCommands=1  \nAllowKey=system.run[*]  # For Zabbix Agent 5.0+\nUnsafeUserParameters=1\n\n\nZabbixAgentがインストールされた環境に対しては\
      \  \nNTPテンプレートが使用できます。\n\n\nNTPアプライアンスなどZabbixAgentが使用できない環境のNTPサーバに対しては  \nNTPテンプレート（リモート）が使用できます。\n\n\nNTPテンプレート（リモート）を利用する場合はホストマクロにおいて  \n{$NTP\\_IP}に監視対象のIPアドレスを指定してください。\n\n\nntpqによって表示されるすべての項目が監視できます。\n\n\nNTP精度情報をグラフ化することが可能です。\n\n\n \n"
    items:
    - uuid: 2a299cc8eb38459e95a1bbd18a53cd2a
      name: NTPプロセス
      key: proc.num[ntpd]
      delay: '60'
      tags:
      - tag: Application
        value: NTP
    - uuid: 3163162b9a4c45fb80477acb7942c981
      name: NTPDバージョン
      type: ZABBIX_ACTIVE
      key: system.run[ntpq -c version]
      delay: '3600'
      trends: '0'
      value_type: CHAR
      tags:
      - tag: Application
        value: NTP
    - uuid: ec9b13142d7d40898e0da1a4076ad3fd
      name: ntpq
      type: ZABBIX_ACTIVE
      key: system.run[ntpq -p]
      delay: '3600'
      trends: '0'
      value_type: TEXT
      description: "\"*\"\t参照同期中のサーバーを表している\n\"+\"\tクロック誤り検査に合格したサーバー\n\"#\"\t参照同期中ではあるが、距離が遠いサーバー\n\" \"\t左に何も表示されない場合（空欄）、サーバーを参照していない\n\"x\"\tクロック誤り検査に不合格となったサーバー\n\". \"\t参照リストから除外されたサーバー\nrefid\tNTPサーバーが参照している上位ホスト名 or IPアドレス\nst\tNTPサーバーの階層\nt\t階層のタイプ　l:local、u:unicast、m:multicast、b:broadcast\nwhen\t最後のパケットを受け取ってからの時間（秒）\npoll\t問い合わせを行う間隔（秒）\nreach\t到達可能性に関するレジスタ・データ（8進数）\ndelay\t推定遅延（ミリ秒）\noffset\t偏差補償（ミリ秒）\njitter\tRMS Jitterの平均値（ミリ秒）\n"
      tags:
      - tag: Application
        value: NTP
    - uuid: 04f81281628c43f5a0bcb1662db0427c
      name: NTP同期サーバ
      type: DEPENDENT
      key: ntp.peer
      delay: '0'
      history: 60d
      trends: '0'
      value_type: TEXT
      description: 同期しているNTPサーバー名
      tags:
      - tag: Application
        value: NTP
      triggers:
      - uuid: 022559e910b44edd9dacd44c3dda93e0
        expression: (last(/template_ntp_accuracy/ntp.peer,#1)<>last(/template_ntp_accuracy/ntp.peer,#2))=1
        name: 同期しているNTPサーバが変更されました。
        status: DISABLED
        priority: INFO
      master_item:
        key: system.run[ntpq -p]
      preprocessing:
      - type: REGEX
        parameters:
        - (?m)^[*o]\s*(\S+)
        - \1
    - uuid: 9def1c7ea69c4bdeb276ea118f4cbf37
      name: NTP上位サーバ
      type: DEPENDENT
      key: ntp.refid
      delay: '0'
      history: 60d
      trends: '0'
      value_type: TEXT
      description: 同期しているNTPサーバーの上位NTPサーバ
      tags:
      - tag: Application
