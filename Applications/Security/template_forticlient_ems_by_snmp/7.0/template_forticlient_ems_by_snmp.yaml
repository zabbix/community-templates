    - uuid: 1fe1c5302e674fd490fe44b97bd20ffb
      name: 'EMS system: Total CPU utilization'
      type: DEPENDENT
      key: ems.system.cpu.pct
      delay: '0'
      history: 30d
      trends: 365d
      value_type: FLOAT
      units: '%'
      description: Average utilization across logical CPUs via HOST-RESOURCES-MIB hrProcessorLoad. Sampling may differ from EMS GUI.
      master_item:
        key: ems.system.cpu.walk
      preprocessing:
      - type: SNMP_WALK_TO_JSON
        parameters:
        - '{#LOAD}'
        - 1.3.6.1.2.1.25.3.3.1.2
        - '0'
      - type: JAVASCRIPT
        parameters:
        - |-
          var rows = JSON.parse(value);
          var values = rows.map(function(r) { return Number(r['{#LOAD}']); })
            .filter(function(n) { return isFinite(n) && n >= 0 && n <= 100; });
          if (values.length === 0) throw 'No valid CPU samples';
          return values.reduce(function(a,b){ return a+b; }, 0) / values.length;
      tags:
      - tag: component
        value: system
      triggers:
      - uuid: 9e99a8e14876403aab7f1978ca1787ca
        expression: avg(/FortiClient EMS by SNMP/ems.system.cpu.pct,15m)>{$EMS.SNMP.CPU_WARN}
        name: 'EMS: CPU utilization is high'
        priority: WARNING
        description: CPU utilization exceeded the configured threshold for 15 minutes.
        tags:
        - tag: component
          value: system
    - uuid: e01a00c369234c379f22c6e33aef4058
      name: 'EMS: System storage SNMP walk'
      type: SNMP_AGENT
      snmp_oid: walk[1.3.6.1.2.1.25.2.3.1.3,1.3.6.1.2.1.25.2.3.1.4,1.3.6.1.2.1.25.2.3.1.5,1.3.6.1.2.1.25.2.3.1.6]
      key: ems.system.storage.walk
      delay: 2m
      history: 30d
      trends: 365d
