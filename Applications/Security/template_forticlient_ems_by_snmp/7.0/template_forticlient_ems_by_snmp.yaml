      snmp_oid: 1.3.6.1.2.1.25.2.3.1.5.1
      key: ems.ram.total
      delay: 1m
      history: 30d
      trends: 365d
      value_type: UNSIGNED
      units: B
      tags:
      - tag: component
        value: internal
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '1024'
      description: Internal helper item for RAM utilization; raw HOST-RESOURCES-MIB value is expressed in KiB and converted to bytes for Zabbix display. Do not alert on this capacity metric.
    - uuid: 608b8a113a0f4a9ca6b32e9b2170abbc
      name: 'EMS internal: Available RAM'
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.25.2.3.1.5.11
      key: ems.ram.available
      delay: 1m
      history: 30d
      trends: 365d
      value_type: UNSIGNED
      units: B
      tags:
      - tag: component
        value: internal
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '1024'
      description: Available RAM in KiB from hrStorageSize.11, converted to bytes. Internal helper for RAM utilization.
    - uuid: 5cb8c7d660cd4e7f8121b966fc1aa53e
      name: 'EMS system: Total RAM utilization'
      type: CALCULATED
      key: ems.system.ram.pct
      delay: 1m
      history: 30d
      trends: 365d
      value_type: FLOAT
      units: '%'
      description: RAM used percentage derived from physical RAM capacity (hrStorageSize.1) and available memory (hrStorageSize.11). Both helper SNMP items are converted to bytes; identical units cancel in ratio.
      tags:
      - tag: component
        value: system
      params: 100*(1-last(//ems.ram.available)/last(//ems.ram.total))
      triggers:
      - uuid: ab79f78f6c7843fd8f0b751e64a53a10
        expression: avg(/FortiClient EMS by SNMP/ems.system.ram.pct,15m)>{$EMS.SNMP.RAM_WARN}
        name: 'EMS: RAM utilization is high'
        priority: WARNING
        description: RAM utilization exceeded the configured threshold for 15 minutes.
        tags:
        - tag: component
          value: system
