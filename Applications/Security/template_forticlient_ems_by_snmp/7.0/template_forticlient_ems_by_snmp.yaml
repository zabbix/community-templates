zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 02fdd4938b02498eac9bb7ccc7c703a0
    name: Templates/Network devices
  templates:
  - uuid: 6016bdc5203e4b3695af8c065d19a6e0
    template: FortiClient EMS by SNMP
    name: FortiClient EMS by SNMP
    description: FortiClient EMS by SNMP for Zabbix 7.0. Core license, CPU, RAM and filesystem monitoring is enabled by default. Process, network, keepalive, node and swap diagnostics are optional. Uses numeric OIDs; no MIB installation required. SNMP has fewer metrics than the HTTP template.
    vendor:
      name: Nilleftw
      version: 7.0-0
    groups:
    - name: Templates/Network devices
    tags:
    - tag: class
      value: software
    - tag: target
      value: forticlient-ems
    - tag: target
      value: fortinet
    items:
    - uuid: 3e61aa01f0994a8cba3a7a9d580b6824
      name: 'EMS: Site license SNMP walk'
      type: SNMP_AGENT
      snmp_oid: walk[1.3.6.1.4.1.99999.30,1.3.6.1.4.1.99999.31]
      key: ems.license.walk
      delay: 5m
      history: 1d
      trends: '0'
      value_type: TEXT
      description: Raw SNMP walk of site license utilization and names.
      triggers:
      - uuid: 525ddbc71454448abff5cd52c66b46e7
        expression: nodata(/FortiClient EMS by SNMP/ems.license.walk,20m)=1
        name: 'EMS: SNMP license data has stopped'
        priority: HIGH
        description: No SNMP license walk data for 20 minutes. Check SNMP reachability and EMS service.
        tags:
        - tag: component
          value: availability
    - uuid: 840d931ef39744688093c47bb5630374
      name: 'EMS: Process CPU SNMP walk'
      type: SNMP_AGENT
