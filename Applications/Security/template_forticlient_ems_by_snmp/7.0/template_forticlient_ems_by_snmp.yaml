      type: SNMP_AGENT
      snmp_oid: walk[1.3.6.1.4.1.99999.40,1.3.6.1.4.1.99999.41,1.3.6.1.4.1.99999.50,1.3.6.1.4.1.99999.51,1.3.6.1.4.1.99999.60,1.3.6.1.4.1.99999.61,1.3.6.1.4.1.99999.70,1.3.6.1.4.1.99999.71,1.3.6.1.4.1.99999.72,1.3.6.1.4.1.99999.73,1.3.6.1.4.1.99999.80,1.3.6.1.4.1.99999.82]
