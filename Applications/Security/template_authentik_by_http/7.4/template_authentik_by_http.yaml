        - uuid: 680346100bcc4961b59c636f7427575d
          name: 'Authentik: Certificate discovery'
          type: DEPENDENT
          key: authentik.certificate.discovery
          filter:
            conditions:
              - macro: '{#CERT.EXPIRY}'
                value: .+
