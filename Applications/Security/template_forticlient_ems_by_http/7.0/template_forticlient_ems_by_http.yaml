          value: license-api
    macros:
    - macro: '{$EMS.API.URL}'
      value: ''
      description: Base HTTPS URL of EMS, for example https://ems.example.com. Set on host.
    - macro: '{$EMS.API.SITE}'
      value: default
      description: EMS site name for this Zabbix host.
    - macro: '{$EMS.API.USERNAME}'
      value: ''
      description: EMS API username; set on host.
    - macro: '{$EMS.API.PASSWORD}'
      type: SECRET_TEXT
      description: EMS API password; set on host as secret text.
    - macro: '{$EMS.API.LICENSE.INTERVAL}'
      value: 5m
      description: Polling interval for license API master item.
    - macro: '{$EMS.API.PERFMON.INTERVAL}'
      value: 5m
      description: Polling interval for perfmon API master item.
    - macro: '{$EMS.API.PERFMON.EXTENDED}'
      value: '0'
      description: Set to 1 to query optional database, network, keep-alive and process diagnostic metrics.
    - macro: '{$EMS.API.ENDPOINTS.INTERVAL}'
      value: 10m
      description: Polling interval for endpoints API master item.
    - macro: '{$EMS.API.SECURITY.INTERVAL}'
      value: 30m
      description: Polling interval for security API master item.
    - macro: '{$EMS.API.SYSTEM.INTERVAL}'
      value: 15m
      description: Polling interval for system API master item.
    - macro: '{$EMS.API.ALERTS.INTERVAL}'
      value: 10m
      description: Polling interval for alerts API master item.
    - macro: '{$EMS.API.CERTIFICATES.INTERVAL}'
      value: 1h
      description: Polling interval for certificates API master item.
    - macro: '{$EMS.API.INVENTORY.INTERVAL}'
      value: 1h
      description: Polling interval for inventory API master item.
    - macro: '{$EMS.API.LICENSE.WARN}'
      value: '90'
      description: License utilization warning threshold in percent.
    - macro: '{$EMS.API.LICENSE.EXPIRY_WARN_DAYS}'
      value: '30'
      description: License expiry warning horizon in days.
    - macro: '{$EMS.API.ENDPOINTS.ONLINE_WARN}'
      value: '90'
      description: Optional online endpoint percentage warning threshold.
    - macro: '{$EMS.API.PERFMON.CPU_WARN}'
      value: '85'
      description: Optional overall CPU warning threshold in percent.
    - macro: '{$EMS.API.PERFMON.RAM_WARN}'
      value: '90'
      description: Optional RAM warning threshold in percent.
    - macro: '{$EMS.API.PERFMON.DISK_WARN}'
      value: '90'
      description: Optional maximum disk usage warning threshold in percent.
