        expression: last(/FortiClient EMS by HTTP/ems.api.license.ztna.allocated)>0 and last(/FortiClient EMS by HTTP/ems.api.license.ztna.expiry_epoch)>0 and last(/FortiClient EMS by HTTP/ems.api.license.ztna.expiry_epoch)<=now()
