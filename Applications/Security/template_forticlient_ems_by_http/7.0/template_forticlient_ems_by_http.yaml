      item_prototypes:
      - uuid: fbee4f4ce31441789dc82325b2f21a19
        name: 'Site {$EMS.API.SITE}: {#LICENSE_TYPE} used'
        type: DEPENDENT
        key: ems.api.license.type[{#LICENSE_TYPE},used]
        delay: '0'
        history: 30d
        trends: 365d
        value_type: UNSIGNED
        master_item:
          key: ems.api.license.raw
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - 'var n = JSON.parse(value).types["{#LICENSE_TYPE}"].used; return n === null || n === undefined ? 0 : n;'
