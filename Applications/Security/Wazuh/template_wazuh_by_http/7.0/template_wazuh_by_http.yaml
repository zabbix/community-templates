              name: 'Wazuh Manager: Processes'
          - type: STRING
            name: reference
            value: WOLXC
        - type: problemsbysv
          name: Problems by severity
          x: '0'
          y: '8'
          width: '24'
          height: '6'
        - type: problems
          name: Current problems
          x: '24'
