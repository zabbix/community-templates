  - uuid: a757c04e27b1480a924bda4ff0fd3fce
    template: Wazuh Dashboard by HTTP
    name: Wazuh Dashboard by HTTP
    description: |
      Checks the availability of the Wazuh dashboard with an HTTP request to its login page, without any agent
      or external script.

      TLS: SSL verify peer and SSL verify host are enabled on the HTTP agent item. The default Wazuh dashboard
      certificate only contains the address 127.0.0.1: either issue a certificate valid for the name or address
      used by the host, or disable SSL verify host on the template item (this option cannot be set with a macro).

      Author: Rémi Piazza
    groups: *id001
    items:
    - uuid: 792a8cb5e8334c218e2628dbd1c830f0
      name: 'Wazuh Dashboard: HTTP status code'
      type: HTTP_AGENT
      key: wazuh.dashboard.http.status
      delay: '{$WAZUH.DASHBOARD.INTERVAL}'
      history: 31d
      value_type: UNSIGNED
      timeout: 15s
      url: '{$WAZUH.DASHBOARD.SCHEME}://{HOST.CONN}:{$WAZUH.DASHBOARD.PORT}{$WAZUH.DASHBOARD.PATH}'
      http_proxy: '{$WAZUH.DASHBOARD.HTTP.PROXY}'
      verify_peer: 'YES'
      verify_host: 'YES'
      retrieve_mode: BOTH
      follow_redirects: 'NO'
      status_codes: 100-599
      description: HTTP status code returned by the Wazuh dashboard login page.
      preprocessing:
      - type: REGEX
        parameters:
        - ^HTTP/\S+\s+(\d{3})
        - \1
      tags:
      - tag: component
        value: application
      - tag: service
        value: dashboard
      triggers:
      - uuid: 36002c2f110743a09e29199f48295783
        expression: nodata(/Wazuh Dashboard by HTTP/wazuh.dashboard.http.status,{$WAZUH.DASHBOARD.NODATA.TIME})=1
        name: 'Wazuh Dashboard: Unavailable'
        priority: HIGH
        description: No response from the dashboard (connection refused, timeout or TLS error). See the item error message.
        tags:
        - tag: scope
          value: availability
      - uuid: 7c8bc33b5b2249528896b64c2302f1cf
        expression: min(/Wazuh Dashboard by HTTP/wazuh.dashboard.http.status,#3)>=400
        name: 'Wazuh Dashboard: Unexpected HTTP status code'
        opdata: 'HTTP status: {ITEM.LASTVALUE1}'
        priority: HIGH
        description: The dashboard returned an HTTP error for three consecutive checks.
        dependencies:
        - name: 'Wazuh Dashboard: Unavailable'
          expression: nodata(/Wazuh Dashboard by HTTP/wazuh.dashboard.http.status,{$WAZUH.DASHBOARD.NODATA.TIME})=1
        tags:
        - tag: scope
          value: availability
    macros:
    - macro: '{$WAZUH.DASHBOARD.SCHEME}'
      value: https
      description: Wazuh dashboard scheme (http or https).
    - macro: '{$WAZUH.DASHBOARD.PORT}'
      value: '443'
      description: Wazuh dashboard port.
    - macro: '{$WAZUH.DASHBOARD.PATH}'
      value: /app/login
      description: Path used for the availability check (must be reachable without authentication).
    - macro: '{$WAZUH.DASHBOARD.HTTP.PROXY}'
      value: ''
      description: HTTP proxy used to reach the Wazuh dashboard, for example http://proxy.example.com:3128. Leave empty to connect directly.
    - macro: '{$WAZUH.DASHBOARD.INTERVAL}'
      value: 1m
      description: Collection interval.
    - macro: '{$WAZUH.DASHBOARD.NODATA.TIME}'
      value: 5m
      description: No-data period before the dashboard is considered unavailable.
    tags:
    - tag: class
      value: application
    - tag: target
      value: wazuh
    - tag: target
      value: wazuh-dashboard
    dashboards:
    - uuid: dbb9f8e33ce54681ac56382936feb3a0
      name: 'Wazuh Dashboard: overview'
      pages:
      - widgets:
        - type: item
          name: HTTP status code
          x: '0'
          y: '0'
          width: '24'
          height: '3'
          fields:
          - type: ITEM
            name: itemid.0
            value:
              host: Wazuh Dashboard by HTTP
              key: wazuh.dashboard.http.status
        - type: problemsbysv
          name: Problems by severity
          x: '24'
          y: '0'
          width: '48'
          height: '3'
        - type: problems
          name: Current problems
          x: '0'
          y: '3'
          width: '72'
          height: '6'
  - uuid: 10549a618e904eccbcc8d276b57126f2
    template: Wazuh Manager by Zabbix agent
    name: Wazuh Manager by Zabbix agent
    description: |
      Complements "Wazuh Manager by HTTP" with checks that the Wazuh API cannot provide: processes, freshness of
      alerts.json (detects a silent stall of the detection pipeline), ERROR and CRITICAL lines in ossec.log and the
      Filebeat process. Link it to the host running the Wazuh manager, in addition to the HTTP templates.
      It is not linked by the "Wazuh by HTTP" parent template because it needs a Zabbix agent.

      Requirements:
      - Zabbix agent or agent 2 on the manager host, with ServerActive configured (active check for the log item).
      - Read access to the Wazuh logs for the zabbix user: usermod -aG wazuh zabbix, then restart the agent.
      - Process names may differ by version: verify with ps that wazuh-analysisd, wazuh-remoted and filebeat exist.

      Host CPU, memory and disk metrics are intentionally left to the standard Linux template.

      Author: Rémi Piazza
    groups: *id001
    items:
    - uuid: 666450d207b8408790fdd879f9c6892e
      name: 'Wazuh Manager: analysisd process count'
      type: ZABBIX_PASSIVE
      key: proc.num[wazuh-analysisd]
      delay: 1m
      history: 31d
      value_type: UNSIGNED
      description: Number of running wazuh-analysisd processes (event analysis engine). Independent of the Wazuh API.
      tags: &id009
      - tag: component
        value: application
      - tag: service
        value: manager
      triggers:
      - uuid: 2af62ac457704544b74446b56d18691f
        expression: last(/Wazuh Manager by Zabbix agent/proc.num[wazuh-analysisd])=0
        name: 'Wazuh Manager: wazuh-analysisd is not running'
        priority: HIGH
        description: 'The event analysis engine has stopped: security events are no longer processed. Restart the wazuh-manager service and investigate the cause in ossec.log.'
        manual_close: 'YES'
        tags:
        - tag: scope
          value: availability
    - uuid: 3a960d660975424e9e91bdc7f1e1abb0
      name: 'Wazuh Manager: remoted process count'
      type: ZABBIX_PASSIVE
      key: proc.num[wazuh-remoted]
      delay: 1m
      history: 31d
      value_type: UNSIGNED
      description: Number of running wazuh-remoted processes (agent communication daemon).
      tags: *id009
      triggers:
      - uuid: 9ad890a25e7a41a0bebf770467be4b2a
        expression: last(/Wazuh Manager by Zabbix agent/proc.num[wazuh-remoted])=0
        name: 'Wazuh Manager: wazuh-remoted is not running'
        priority: HIGH
        description: The daemon receiving events from agents has stopped.
        manual_close: 'YES'
        tags:
        - tag: scope
          value: availability
    - uuid: b17692a84fb64e58a9687d626fcbbddb
      name: 'Wazuh Manager: Filebeat process count'
      type: ZABBIX_PASSIVE
      key: proc.num[{$WAZUH.FILEBEAT.PROCESS}]
      delay: 1m
      history: 31d
      value_type: UNSIGNED
      description: Number of running Filebeat processes, which forward alerts to the Wazuh indexer.
      tags: *id009
      triggers:
      - uuid: 0acb96d542f64695a0892ac5483d6e81
        expression: last(/Wazuh Manager by Zabbix agent/proc.num[{$WAZUH.FILEBEAT.PROCESS}])=0
        name: 'Wazuh Manager: Filebeat is not running'
        priority: HIGH
        description: 'Filebeat has stopped: alerts are no longer reaching the Wazuh indexer.'
        manual_close: 'YES'
        tags:
        - tag: scope
          value: availability
    - uuid: c843bd34d28f48639fd1184623fafed2
      name: 'Wazuh Manager: alerts.json last modification time'
      type: ZABBIX_PASSIVE
      key: vfs.file.time[{$WAZUH.ALERTS.LOG.PATH},modify]
      delay: 1m
      history: 31d
      value_type: UNSIGNED
      units: unixtime
      description: Unix timestamp of the last write to alerts.json. It stops advancing when the detection pipeline stalls.
      tags: *id009
      triggers:
      - uuid: 4477cf3375c145fd9df0a01ebe7ac15e
        expression: '(now() - last(/Wazuh Manager by Zabbix agent/vfs.file.time[{$WAZUH.ALERTS.LOG.PATH},modify]))>{$WAZUH.ALERTS.AGE.MAX}

          and last(/Wazuh Manager by Zabbix agent/proc.num[wazuh-analysisd])>0'
        name: 'Wazuh Manager: No alerts generated for {$WAZUH.ALERTS.AGE.MAX}'
        priority: HIGH
        description: 'alerts.json has not been updated although wazuh-analysisd is running: the detection pipeline may be stalled. Check disk space, permissions and ossec.log. Raise {$WAZUH.ALERTS.AGE.MAX} on quiet installations.'
        manual_close: 'YES'
        tags:
        - tag: scope
          value: availability
      - uuid: 63231e3ffe1f44219d26ffc0372a1d3d
        expression: nodata(/Wazuh Manager by Zabbix agent/vfs.file.time[{$WAZUH.ALERTS.LOG.PATH},modify],10m)=1
        name: 'Wazuh Manager: alerts.json cannot be read'
        priority: AVERAGE
        description: 'No value for the alerts.json modification time: the file is missing or not readable by the zabbix user (is it a member of the wazuh group?). See the item error message.'
        tags:
        - tag: scope
          value: availability
    - uuid: b717721015db4adbbc659c935230f1f3
      name: 'Wazuh Manager: ERROR and CRITICAL entries in ossec.log'
      type: ZABBIX_ACTIVE
      key: log[{$WAZUH.OSSEC.LOG.PATH},"{$WAZUH.OSSEC.LOG.ERROR.REGEX}",,,skip]
      delay: 1s
      history: 31d
      trends: '0'
      value_type: LOG
      description: Lines of ossec.log matching {$WAZUH.OSSEC.LOG.ERROR.REGEX}. Requires an active agent (ServerActive).
      tags: *id009
      triggers:
      - uuid: 0298eac628fa4a9a81888ccc86c57f21
        expression: count(/Wazuh Manager by Zabbix agent/log[{$WAZUH.OSSEC.LOG.PATH},"{$WAZUH.OSSEC.LOG.ERROR.REGEX}",,,skip],5m)>0
        name: 'Wazuh Manager: ERROR or CRITICAL entries detected in ossec.log'
        priority: WARNING
        description: ERROR or CRITICAL messages appeared in ossec.log during the last 5 minutes. Review the latest values of the item.
        manual_close: 'YES'
        tags:
        - tag: scope
          value: notice
    macros:
    - macro: '{$WAZUH.ALERTS.LOG.PATH}'
      value: /var/ossec/logs/alerts/alerts.json
      description: Path of the Wazuh alerts file.
    - macro: '{$WAZUH.ALERTS.AGE.MAX}'
      value: 30m
      description: Maximum time without a write to alerts.json before the pipeline is considered stalled. Lower it on busy installations with many agents; raise it on quiet labs.
    - macro: '{$WAZUH.OSSEC.LOG.PATH}'
      value: /var/ossec/logs/ossec.log
      description: Path of the Wazuh manager log.
    - macro: '{$WAZUH.OSSEC.LOG.ERROR.REGEX}'
      value: ': (ERROR|CRITICAL):'
      description: Regular expression of the ossec.log lines to collect.
    - macro: '{$WAZUH.FILEBEAT.PROCESS}'
      value: filebeat
      description: Name of the process forwarding alerts to the indexer.
    tags:
    - tag: class
      value: application
    - tag: target
      value: wazuh
    - tag: target
      value: wazuh-manager
    dashboards:
    - uuid: 1ee111644b0d4b0b8896b8741d283f3b
      name: 'Wazuh Manager (agent): overview'
      pages:
      - widgets:
        - type: item
          name: analysisd process count
          x: '0'
          y: '0'
          width: '24'
          height: '3'
          fields:
          - type: ITEM
            name: itemid.0
            value:
              host: Wazuh Manager by Zabbix agent
              key: proc.num[wazuh-analysisd]
        - type: item
          name: remoted process count
          x: '24'
