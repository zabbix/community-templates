  - uuid: e5ebfd5ff96f42f4904b51b74b8d3636
    template: Wazuh Indexer by HTTP
    name: Wazuh Indexer by HTTP
    description: |
      Monitors a Wazuh indexer (OpenSearch) through its REST API (port 9200) without any agent or external script.

      Requirements:
      - A dedicated indexer user named zbx_monitor, allowed to call GET /_cluster/health and GET /_nodes/stats
        (the cluster_monitor permission is enough).
      - Set the macros {$WAZUH.INDEXER.USER} and {$WAZUH.INDEXER.PASSWORD} on the host.

      TLS: SSL verify peer and SSL verify host are enabled on the HTTP agent items. The default Wazuh indexer
      certificate only contains the address 127.0.0.1: either issue a certificate valid for the name or address
      used by the host, or disable SSL verify host on the template items (this option cannot be set with a macro).

      Author: Rémi Piazza
    groups: *id001
    items:
    - uuid: 79579925260f48a6a3471248c48f8ed4
      name: 'Wazuh Indexer: Get cluster health'
      type: HTTP_AGENT
      key: wazuh.indexer.cluster.health.get
      delay: '{$WAZUH.INDEXER.INTERVAL}'
      history: 1h
      trends: '0'
      value_type: TEXT
      timeout: 15s
      url: '{$WAZUH.INDEXER.SCHEME}://{HOST.CONN}:{$WAZUH.INDEXER.PORT}/_cluster/health'
      http_proxy: '{$WAZUH.INDEXER.HTTP.PROXY}'
      authtype: BASIC
      username: '{$WAZUH.INDEXER.USER}'
      password: '{$WAZUH.INDEXER.PASSWORD}'
      verify_peer: 'YES'
      verify_host: 'YES'
      headers: &id007
      - name: Accept
        value: application/json
      description: GET /_cluster/health on the Wazuh indexer.
      tags: *id003
      triggers:
      - uuid: 3596b374fbef49ca8633cb1bf2ceb62e
        expression: nodata(/Wazuh Indexer by HTTP/wazuh.indexer.cluster.health.get,{$WAZUH.INDEXER.NODATA.TIME})=1
        name: 'Wazuh Indexer: API is unavailable or not returning data'
        priority: HIGH
        description: No data received from the Wazuh indexer. Check the service, the port, the credentials and the TLS trust.
        tags:
        - tag: scope
          value: availability
    - uuid: 88dfa89038194cecb7647808a1d534c5
      name: 'Wazuh Indexer: Get nodes stats'
      type: HTTP_AGENT
      key: wazuh.indexer.nodes.stats.get
      delay: '{$WAZUH.INDEXER.INTERVAL}'
      history: '0'
      trends: '0'
      value_type: TEXT
      timeout: 15s
      url: '{$WAZUH.INDEXER.SCHEME}://{HOST.CONN}:{$WAZUH.INDEXER.PORT}/_nodes/stats/jvm,fs,os?filter_path=nodes.*.name,nodes.*.jvm.mem.heap_used_percent,nodes.*.os.cpu.percent,nodes.*.fs.total.total_in_bytes,nodes.*.fs.total.available_in_bytes'
      http_proxy: '{$WAZUH.INDEXER.HTTP.PROXY}'
      authtype: BASIC
      username: '{$WAZUH.INDEXER.USER}'
      password: '{$WAZUH.INDEXER.PASSWORD}'
      verify_peer: 'YES'
      verify_host: 'YES'
      headers: *id007
      description: GET /_nodes/stats/jvm,fs,os on the Wazuh indexer, filtered to the fields used by this template.
      tags: *id003
    - uuid: 3c2ddbbfa86b4896bbd3073ce44d0bfc
      name: 'Wazuh Indexer: Cluster status'
      type: DEPENDENT
      key: wazuh.indexer.cluster.status
      history: 31d
      trends: '0'
      value_type: UNSIGNED
      description: 'Cluster health status. Possible values: 0 - Green, 1 - Yellow, 2 - Red, 3 - Unknown.'
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.status
      - type: JAVASCRIPT
        parameters:
        - |
          var m = {'green': 0, 'yellow': 1, 'red': 2};
          var v = String(value).replace(/"/g, '');
          return m.hasOwnProperty(v) ? m[v] : 3;
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: wazuh.indexer.cluster.health.get
      valuemap:
        name: Wazuh indexer cluster status
      tags: &id008
      - tag: component
        value: application
      - tag: service
        value: indexer
      triggers:
      - uuid: 277db943d39c4103a0abce49a4610d7e
        expression: last(/Wazuh Indexer by HTTP/wazuh.indexer.cluster.status)=2
        name: 'Wazuh Indexer: Cluster status is red'
        priority: HIGH
        description: 'At least one primary shard is not allocated: data may be unavailable.'
        dependencies:
        - name: 'Wazuh Indexer: API is unavailable or not returning data'
          expression: nodata(/Wazuh Indexer by HTTP/wazuh.indexer.cluster.health.get,{$WAZUH.INDEXER.NODATA.TIME})=1
        tags:
        - tag: scope
          value: availability
      - uuid: 812438df716c45a697b9692ba883864d
        expression: last(/Wazuh Indexer by HTTP/wazuh.indexer.cluster.status)=1
        name: 'Wazuh Indexer: Cluster status is yellow'
        priority: WARNING
        description: At least one replica shard is not allocated.
        dependencies:
        - name: 'Wazuh Indexer: API is unavailable or not returning data'
          expression: nodata(/Wazuh Indexer by HTTP/wazuh.indexer.cluster.health.get,{$WAZUH.INDEXER.NODATA.TIME})=1
        tags:
        - tag: scope
          value: availability
    - uuid: 389ef7ef019a414e9d2ca208e2248d99
      name: 'Wazuh Indexer: Number of nodes'
      type: DEPENDENT
      key: wazuh.indexer.nodes
      history: 31d
      value_type: UNSIGNED
      description: Number of nodes in the cluster.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.number_of_nodes
      master_item:
        key: wazuh.indexer.cluster.health.get
      tags: *id008
      triggers:
      - uuid: 62683b2963e94457b6608eb078ab8c6c
        expression: change(/Wazuh Indexer by HTTP/wazuh.indexer.nodes)<0
        name: 'Wazuh Indexer: Number of nodes has decreased'
        priority: AVERAGE
        description: A node left the indexer cluster.
        manual_close: 'YES'
        dependencies:
        - name: 'Wazuh Indexer: API is unavailable or not returning data'
          expression: nodata(/Wazuh Indexer by HTTP/wazuh.indexer.cluster.health.get,{$WAZUH.INDEXER.NODATA.TIME})=1
        tags:
        - tag: scope
          value: availability
    - uuid: 28ddd398f162484e9480206304011e88
      name: 'Wazuh Indexer: Active shards'
      type: DEPENDENT
      key: wazuh.indexer.shards.active
      history: 31d
      value_type: UNSIGNED
      description: Number of active shards.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.active_shards
      master_item:
        key: wazuh.indexer.cluster.health.get
      tags: *id008
    - uuid: a7b64e7753214007966a05d0e777bd7a
      name: 'Wazuh Indexer: Unassigned shards'
      type: DEPENDENT
      key: wazuh.indexer.shards.unassigned
      history: 31d
      value_type: UNSIGNED
      description: Number of unassigned shards.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.unassigned_shards
      master_item:
        key: wazuh.indexer.cluster.health.get
      tags: *id008
      triggers:
      - uuid: e1d90ee78815486dbf43a1b1f3c56480
        expression: min(/Wazuh Indexer by HTTP/wazuh.indexer.shards.unassigned,{$WAZUH.INDEXER.UNASSIGNED.TIME})>0
        name: 'Wazuh Indexer: Unassigned shards'
        opdata: 'Unassigned shards: {ITEM.LASTVALUE1}'
        priority: WARNING
        description: There have been unassigned shards for more than {$WAZUH.INDEXER.UNASSIGNED.TIME}.
        dependencies:
        - name: 'Wazuh Indexer: API is unavailable or not returning data'
          expression: nodata(/Wazuh Indexer by HTTP/wazuh.indexer.cluster.health.get,{$WAZUH.INDEXER.NODATA.TIME})=1
        tags:
        - tag: scope
          value: availability
    - uuid: dff7ed2decb3455bacde4eb8757d62ac
      name: 'Wazuh Indexer: Relocating shards'
      type: DEPENDENT
      key: wazuh.indexer.shards.relocating
      history: 31d
      value_type: UNSIGNED
      description: Number of relocating shards.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.relocating_shards
      master_item:
        key: wazuh.indexer.cluster.health.get
      tags: *id008
    - uuid: 9750b0fc98ae46c5a428ad1c5501001a
      name: 'Wazuh Indexer: Initializing shards'
      type: DEPENDENT
      key: wazuh.indexer.shards.initializing
      history: 31d
      value_type: UNSIGNED
      description: Number of initializing shards.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.initializing_shards
      master_item:
        key: wazuh.indexer.cluster.health.get
      tags: *id008
    - uuid: afe2a7c3c84e4feb8768ed30ea9ffe51
      name: 'Wazuh Indexer: Pending tasks'
      type: DEPENDENT
      key: wazuh.indexer.tasks.pending
      history: 31d
      value_type: UNSIGNED
      description: Number of cluster-level pending tasks.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.number_of_pending_tasks
      master_item:
        key: wazuh.indexer.cluster.health.get
      tags: *id008
    - uuid: 043ee02a76fc46488b10bb117c433ae1
      name: 'Wazuh Indexer: Active shards, in %'
      type: DEPENDENT
      key: wazuh.indexer.shards.active_pct
      history: 31d
      value_type: FLOAT
      units: '%'
      description: Percentage of active shards.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.active_shards_percent_as_number
      master_item:
        key: wazuh.indexer.cluster.health.get
      tags: *id008
    discovery_rules:
    - uuid: 82e735d3335543b095388feac1e6bd3c
      name: Wazuh indexer nodes discovery
      type: DEPENDENT
      key: wazuh.indexer.nodes.discovery
      delay: '0'
      lifetime: 7d
      description: Discovers the indexer nodes from GET /_nodes/stats.
      master_item:
        key: wazuh.indexer.nodes.stats.get
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var n = JSON.parse(value).nodes;
          return JSON.stringify(Object.keys(n).map(function (k) {
              return {'{#NODE.ID}': k, '{#NODE.NAME}': n[k].name};
          }));
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      item_prototypes:
      - uuid: 8da7fb46f4af4e038a36bbabf9297052
        name: 'Wazuh Indexer: Node [{#NODE.NAME}]: JVM heap used, in %'
        type: DEPENDENT
        key: wazuh.indexer.node.heap["{#NODE.ID}"]
        history: 31d
        value_type: FLOAT
        units: '%'
        description: Percentage of JVM heap in use on node {#NODE.NAME}.
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.nodes['{#NODE.ID}'].jvm.mem.heap_used_percent
        master_item:
          key: wazuh.indexer.nodes.stats.get
        tags:
        - tag: component
          value: memory
        - tag: service
          value: indexer
        - tag: node
          value: '{#NODE.NAME}'
        trigger_prototypes:
        - uuid: 450e664c15ef454db66c27903f4cc36f
          expression: min(/Wazuh Indexer by HTTP/wazuh.indexer.node.heap["{#NODE.ID}"],5m)>{$WAZUH.INDEXER.HEAP.MAX.CRIT}
          name: 'Wazuh Indexer: Node [{#NODE.NAME}]: JVM heap usage is critical'
          opdata: 'Heap used: {ITEM.LASTVALUE1}'
          priority: HIGH
          description: JVM heap usage has been above {$WAZUH.INDEXER.HEAP.MAX.CRIT}% for 5 minutes.
          dependencies:
          - name: 'Wazuh Indexer: API is unavailable or not returning data'
            expression: nodata(/Wazuh Indexer by HTTP/wazuh.indexer.cluster.health.get,{$WAZUH.INDEXER.NODATA.TIME})=1
          tags:
          - tag: scope
            value: performance
        - uuid: d9b635c0ba7b47898a60448502adb984
          expression: min(/Wazuh Indexer by HTTP/wazuh.indexer.node.heap["{#NODE.ID}"],5m)>{$WAZUH.INDEXER.HEAP.MAX.WARN}
          name: 'Wazuh Indexer: Node [{#NODE.NAME}]: JVM heap usage is high'
          opdata: 'Heap used: {ITEM.LASTVALUE1}'
          priority: WARNING
          description: JVM heap usage has been above {$WAZUH.INDEXER.HEAP.MAX.WARN}% for 5 minutes.
          dependencies:
          - name: 'Wazuh Indexer: API is unavailable or not returning data'
            expression: nodata(/Wazuh Indexer by HTTP/wazuh.indexer.cluster.health.get,{$WAZUH.INDEXER.NODATA.TIME})=1
          tags:
          - tag: scope
            value: performance
      - uuid: 1c62af2f844e4121baec8967013534b7
        name: 'Wazuh Indexer: Node [{#NODE.NAME}]: CPU usage, in %'
        type: DEPENDENT
        key: wazuh.indexer.node.cpu["{#NODE.ID}"]
        history: 31d
        value_type: FLOAT
        units: '%'
        description: CPU usage reported by node {#NODE.NAME}.
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.nodes['{#NODE.ID}'].os.cpu.percent
        master_item:
          key: wazuh.indexer.nodes.stats.get
        tags:
        - tag: component
          value: cpu
        - tag: service
          value: indexer
        - tag: node
          value: '{#NODE.NAME}'
        trigger_prototypes:
        - uuid: 35bd327e85384fd4b9fc30c58e3f90cd
          expression: min(/Wazuh Indexer by HTTP/wazuh.indexer.node.cpu["{#NODE.ID}"],15m)>{$WAZUH.INDEXER.CPU.MAX.WARN}
          name: 'Wazuh Indexer: Node [{#NODE.NAME}]: CPU usage is high'
          opdata: 'CPU usage: {ITEM.LASTVALUE1}'
          priority: WARNING
          description: CPU usage has been above {$WAZUH.INDEXER.CPU.MAX.WARN}% for 15 minutes.
          dependencies:
          - name: 'Wazuh Indexer: API is unavailable or not returning data'
            expression: nodata(/Wazuh Indexer by HTTP/wazuh.indexer.cluster.health.get,{$WAZUH.INDEXER.NODATA.TIME})=1
          tags:
          - tag: scope
            value: performance
      - uuid: 8c8b965fdd3b4eb8ae0cb9ec691a488c
        name: 'Wazuh Indexer: Node [{#NODE.NAME}]: Disk total space'
        type: DEPENDENT
        key: wazuh.indexer.node.fs.total["{#NODE.ID}"]
        history: 31d
        value_type: UNSIGNED
        units: B
        description: Total size of the data filesystem of node {#NODE.NAME}.
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.nodes['{#NODE.ID}'].fs.total.total_in_bytes
        master_item:
          key: wazuh.indexer.nodes.stats.get
        tags:
        - tag: component
          value: storage
        - tag: service
          value: indexer
        - tag: node
          value: '{#NODE.NAME}'
      - uuid: 7cbfe0f1bd1a4c2ba243d8dfd0092a7b
        name: 'Wazuh Indexer: Node [{#NODE.NAME}]: Disk available space'
        type: DEPENDENT
        key: wazuh.indexer.node.fs.available["{#NODE.ID}"]
        history: 31d
        value_type: UNSIGNED
        units: B
        description: Available space on the data filesystem of node {#NODE.NAME}.
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.nodes['{#NODE.ID}'].fs.total.available_in_bytes
        master_item:
          key: wazuh.indexer.nodes.stats.get
        tags:
        - tag: component
          value: storage
        - tag: service
          value: indexer
        - tag: node
          value: '{#NODE.NAME}'
      - uuid: 2983bfb8eed84621bae91fc2a60cc91a
        name: 'Wazuh Indexer: Node [{#NODE.NAME}]: Disk free space, in %'
        type: CALCULATED
        key: wazuh.indexer.node.fs.free_pct["{#NODE.ID}"]
        delay: '{$WAZUH.INDEXER.INTERVAL}'
        history: 31d
        value_type: FLOAT
        units: '%'
        params: "100 * last(//wazuh.indexer.node.fs.available[\"{#NODE.ID}\"])\n    / last(//wazuh.indexer.node.fs.total[\"{#NODE.ID}\"])"
        description: Free space on the data filesystem of node {#NODE.NAME}.
        tags:
        - tag: component
          value: storage
        - tag: service
          value: indexer
        - tag: node
          value: '{#NODE.NAME}'
        trigger_prototypes:
        - uuid: 0c259cbc6e534f50a221f34aac2afdf0
          expression: last(/Wazuh Indexer by HTTP/wazuh.indexer.node.fs.free_pct["{#NODE.ID}"])<{$WAZUH.INDEXER.DISK.FREE.MIN.CRIT}
          name: 'Wazuh Indexer: Node [{#NODE.NAME}]: Free disk space is critical'
          opdata: 'Free space: {ITEM.LASTVALUE1}'
          priority: HIGH
          description: 'Free space is below {$WAZUH.INDEXER.DISK.FREE.MIN.CRIT}%. OpenSearch high disk watermark is 10% free by default: shards are moved away.'
          dependencies:
          - name: 'Wazuh Indexer: API is unavailable or not returning data'
            expression: nodata(/Wazuh Indexer by HTTP/wazuh.indexer.cluster.health.get,{$WAZUH.INDEXER.NODATA.TIME})=1
          tags:
          - tag: scope
            value: capacity
        - uuid: 4e14806bcb5e4d31b82191b4f8eefa9c
          expression: last(/Wazuh Indexer by HTTP/wazuh.indexer.node.fs.free_pct["{#NODE.ID}"])<{$WAZUH.INDEXER.DISK.FREE.MIN.WARN}
          name: 'Wazuh Indexer: Node [{#NODE.NAME}]: Free disk space is low'
          opdata: 'Free space: {ITEM.LASTVALUE1}'
          priority: WARNING
