          fields:
          - type: ITEM
            name: itemid.0
            value:
              host: Wazuh Manager by Zabbix agent
              key: proc.num[{$WAZUH.FILEBEAT.PROCESS}]
        - type: item
          name: alerts.json last modification
          x: '0'
          y: '3'
          width: '24'
