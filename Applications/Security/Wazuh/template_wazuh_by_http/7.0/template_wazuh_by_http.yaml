zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: a571c0d144b14fd4a87a9d9b2aa9fcd6
    name: Templates/Applications
  templates:
  - uuid: 0a82404504e642bd9a8f06c5c6953edb
    template: Wazuh by HTTP
    name: Wazuh by HTTP
    description: |
      Wazuh all-in-one: links the manager, indexer and dashboard templates. Link this template to a host that runs
      all Wazuh components (all-in-one deployment). For a distributed deployment, link each sub-template to the host
      that runs the matching component instead:
      - Wazuh Manager by HTTP
      - Wazuh Indexer by HTTP
      - Wazuh Dashboard by HTTP

      Create a dedicated read-only user named zbx_monitor for the Wazuh API and for the indexer, and set it in the
      macros {$WAZUH.API.USER}, {$WAZUH.API.PASSWORD}, {$WAZUH.INDEXER.USER} and {$WAZUH.INDEXER.PASSWORD}.

      Optional: link "Wazuh Manager by Zabbix agent" to the manager host for process, alerts.json freshness and
      ossec.log checks. It is not included here because it requires a Zabbix agent on that host.

      Host CPU, memory and disk metrics are not part of this template: link the standard Linux template as well.

      Author: Rémi Piazza
    templates:
    - name: Wazuh Manager by HTTP
    - name: Wazuh Indexer by HTTP
    - name: Wazuh Dashboard by HTTP
    groups: &id001
    - name: Templates/Applications
    tags:
    - tag: class
      value: application
    - tag: target
      value: wazuh
  - uuid: 8a39fdd7382a4af28a0c1cf110ea9295
    template: Wazuh Manager by HTTP
    name: Wazuh Manager by HTTP
    description: |
      Monitors a Wazuh manager through its REST API (port 55000) without any agent or external script.

      Requirements:
      - Wazuh 4.x with the API reachable from the Zabbix server or proxy.
      - A dedicated Wazuh API user named zbx_monitor with a read-only role, allowed to call
        GET /manager/info, /manager/status, /manager/configuration/validation, /cluster/status, /agents
        and /agents/summary/status.
      - Set the macros {$WAZUH.API.USER} and {$WAZUH.API.PASSWORD} on the host.

      The host interface address ({HOST.CONN}) is used to reach the API.

      TLS: the API requests are made by script items, which always verify the certificate against the CA store
      of the Zabbix server or proxy. With the default self-signed Wazuh API certificate, replace it with a
      certificate signed by a CA that the Zabbix server trusts, and valid for the name or address used by the host.

      Author: Rémi Piazza
    groups: *id001
    items:
    - uuid: f4199769d30e42dbbc2aeba6b1514581
      name: 'Wazuh Manager: Get core data'
      type: SCRIPT
      key: wazuh.api.core.get
      delay: '{$WAZUH.API.INTERVAL}'
      history: 1h
      trends: '0'
      value_type: TEXT
      params: |
        var p = JSON.parse(value);
        var base = p.scheme + '://' + p.host + ':' + p.port;

        var auth = new HttpRequest();
        if (p.proxy) {
            auth.setProxy(p.proxy);
        }
        auth.addHeader('Authorization: Basic ' + btoa(p.user + ':' + p.password));
        var token = auth.post(base + '/security/user/authenticate?raw=true');
        if (auth.getStatus() !== 200) {
            throw 'Wazuh API authentication failed (HTTP ' + auth.getStatus() + ')';
        }
        token = String(token).replace(/\s+/g, '');

        var req = new HttpRequest();
        if (p.proxy) {
            req.setProxy(p.proxy);
        }
        req.addHeader('Authorization: Bearer ' + token);

        function get(path) {
            var body = req.get(base + path);
            if (req.getStatus() !== 200) {
                throw 'GET ' + path + ' failed (HTTP ' + req.getStatus() + ')';
            }
            return JSON.parse(body);
        }

        return JSON.stringify({
            info: get('/manager/info'),
            status: get('/manager/status'),
            cluster: get('/cluster/status'),
            summary: get('/agents/summary/status')
        });
      parameters: &id002
      - name: scheme
        value: '{$WAZUH.API.SCHEME}'
      - name: host
        value: '{HOST.CONN}'
      - name: port
        value: '{$WAZUH.API.PORT}'
      - name: user
        value: '{$WAZUH.API.USER}'
      - name: password
        value: '{$WAZUH.API.PASSWORD}'
      - name: proxy
        value: '{$WAZUH.API.HTTP.PROXY}'
      timeout: 30s
      description: Authenticates against the Wazuh API (JWT) and collects manager info, daemon status, cluster status and the agents connection summary in a single JSON document. TLS certificates are verified against the CA store of the Zabbix server or proxy.
      tags: &id003
      - tag: component
        value: raw
      triggers:
      - uuid: 79ac58a0d6e84bbab422fa3f95b9c8fa
        expression: nodata(/Wazuh Manager by HTTP/wazuh.api.core.get,{$WAZUH.API.NODATA.TIME})=1
        name: 'Wazuh Manager: API is unavailable or not returning data'
        priority: HIGH
        description: No data received from the Wazuh API. Check the manager service, the API port, the credentials and the TLS trust (the item error message gives the reason).
        tags:
        - tag: scope
          value: availability
    - uuid: 49373e5f1a584a5cbc93003a92ad806e
      name: 'Wazuh Manager: Get agents list'
      type: SCRIPT
      key: wazuh.api.agents.get
      delay: '{$WAZUH.API.AGENTS.INTERVAL}'
      history: '0'
      trends: '0'
      value_type: TEXT
      params: |
        var p = JSON.parse(value);
        var base = p.scheme + '://' + p.host + ':' + p.port;

        var auth = new HttpRequest();
        if (p.proxy) {
            auth.setProxy(p.proxy);
        }
        auth.addHeader('Authorization: Basic ' + btoa(p.user + ':' + p.password));
        var token = auth.post(base + '/security/user/authenticate?raw=true');
        if (auth.getStatus() !== 200) {
            throw 'Wazuh API authentication failed (HTTP ' + auth.getStatus() + ')';
        }
        token = String(token).replace(/\s+/g, '');

        var req = new HttpRequest();
        if (p.proxy) {
            req.setProxy(p.proxy);
        }
        req.addHeader('Authorization: Bearer ' + token);

        function get(path) {
            var body = req.get(base + path);
            if (req.getStatus() !== 200) {
                throw 'GET ' + path + ' failed (HTTP ' + req.getStatus() + ')';
            }
            return JSON.parse(body);
        }

        var codes = {'active': 0, 'disconnected': 1, 'never_connected': 2, 'pending': 3};
        var agents = [];
        var offset = 0;
        var limit = 500;
        var total = 0;

        do {
            var d = get('/agents?select=id,name,ip,status,version&limit=' + limit + '&offset=' + offset);
            var rows = d.data.affected_items;
            total = d.data.total_affected_items;
            for (var i = 0; i < rows.length; i++) {
                var a = rows[i];
                agents.push({
                    id: a.id,
                    name: a.name,
                    ip: a.ip || '',
                    version: a.version || '',
                    st: codes.hasOwnProperty(a.status) ? codes[a.status] : 4
                });
            }
            if (rows.length === 0) {
                break;
            }
            offset += limit;
        } while (offset < total);

        return JSON.stringify(agents);
      parameters: *id002
      timeout: 30s
      description: Retrieves the list of registered agents (id, name, IP, version, status code) with pagination.
      tags: *id003
    - uuid: 2d3145fc4a914d5abd7ca4680742d669
      name: 'Wazuh Manager: Get configuration validation'
      type: SCRIPT
      key: wazuh.api.validation.get
      delay: '{$WAZUH.API.VALIDATION.INTERVAL}'
      history: '0'
      trends: '0'
      value_type: TEXT
      params: |
        var p = JSON.parse(value);
        var base = p.scheme + '://' + p.host + ':' + p.port;

        var auth = new HttpRequest();
        if (p.proxy) {
            auth.setProxy(p.proxy);
        }
        auth.addHeader('Authorization: Basic ' + btoa(p.user + ':' + p.password));
        var token = auth.post(base + '/security/user/authenticate?raw=true');
        if (auth.getStatus() !== 200) {
            throw 'Wazuh API authentication failed (HTTP ' + auth.getStatus() + ')';
        }
        token = String(token).replace(/\s+/g, '');

        var req = new HttpRequest();
        if (p.proxy) {
            req.setProxy(p.proxy);
        }
        req.addHeader('Authorization: Bearer ' + token);

        function get(path) {
            var body = req.get(base + path);
            if (req.getStatus() !== 200) {
                throw 'GET ' + path + ' failed (HTTP ' + req.getStatus() + ')';
            }
            return JSON.parse(body);
        }

        return JSON.stringify({validation: get('/manager/configuration/validation')});
      parameters: *id002
      timeout: 30s
      description: Asks the manager to validate its ossec.conf (GET /manager/configuration/validation).
      tags: *id003
    - uuid: b3ca793a842c4490a6f6fd9397d51f0e
      name: 'Wazuh Manager: Version'
      type: DEPENDENT
      key: wazuh.manager.version
      history: 7d
      trends: '0'
      value_type: CHAR
      description: Installed Wazuh manager version. Every value is kept so that the change trigger can compare two consecutive values.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.info.data.affected_items[0].version
      master_item:
        key: wazuh.api.core.get
      tags: &id004
      - tag: component
        value: application
      - tag: service
        value: manager
      triggers:
      - uuid: 7c5144a478304b638c0175e3398be5e4
        expression: change(/Wazuh Manager by HTTP/wazuh.manager.version)=1 and length(last(/Wazuh Manager by HTTP/wazuh.manager.version))>0
        name: 'Wazuh Manager: Version has changed'
        opdata: 'Current version: {ITEM.LASTVALUE1}'
        priority: INFO
        description: The Wazuh manager version has changed (upgrade or downgrade).
        manual_close: 'YES'
        tags:
        - tag: scope
          value: notice
    - uuid: 277daecaabf9422c82d8c87d3d8209ce
      name: 'Wazuh Manager: Configuration validation'
      type: DEPENDENT
      key: wazuh.manager.config.valid
      history: 31d
      trends: '0'
      value_type: UNSIGNED
      description: 'Result of the manager configuration validation. Possible values: 0 - OK, 1 - KO.'
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.validation.data.affected_items[0].status
      - type: JAVASCRIPT
        parameters:
        - |
          var v = String(value).replace(/"/g, '');
          return v === 'OK' ? 0 : 1;
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      master_item:
        key: wazuh.api.validation.get
      valuemap:
        name: Wazuh configuration validation
      tags: *id004
      triggers:
      - uuid: 96d71095c0504f7abb1490ac0003c670
        expression: last(/Wazuh Manager by HTTP/wazuh.manager.config.valid)=1
        name: 'Wazuh Manager: Configuration is invalid'
        priority: AVERAGE
        description: The manager reports an invalid configuration. A restart or reload would fail until it is fixed.
        dependencies:
        - name: 'Wazuh Manager: API is unavailable or not returning data'
          expression: nodata(/Wazuh Manager by HTTP/wazuh.api.core.get,{$WAZUH.API.NODATA.TIME})=1
        tags:
        - tag: scope
          value: availability
    - uuid: ccd2277baf434306bcb55feec552248a
      name: 'Wazuh Manager: Cluster enabled'
      type: DEPENDENT
      key: wazuh.cluster.enabled
      history: 31d
      trends: '0'
      value_type: UNSIGNED
      description: Whether the Wazuh cluster is enabled on this node.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.cluster.data.enabled
      - type: JAVASCRIPT
        parameters:
        - |
          return String(value).replace(/"/g, '') === 'yes' ? 1 : 0;
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: wazuh.api.core.get
      valuemap:
        name: Wazuh yes/no
      tags: &id005
      - tag: component
        value: application
      - tag: service
        value: cluster
    - uuid: 317b3e9cf0fb4d17b3b3a0e18c492d17
      name: 'Wazuh Manager: Cluster running'
      type: DEPENDENT
      key: wazuh.cluster.running
      history: 31d
      trends: '0'
      value_type: UNSIGNED
      description: Whether the Wazuh cluster daemon is running.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.cluster.data.running
      - type: JAVASCRIPT
        parameters:
        - |
          return String(value).replace(/"/g, '') === 'yes' ? 1 : 0;
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: wazuh.api.core.get
      valuemap:
        name: Wazuh yes/no
      tags: *id005
      triggers:
      - uuid: 8abc663288744ddca3878c2ed84e004b
        expression: last(/Wazuh Manager by HTTP/wazuh.cluster.enabled)=1 and last(/Wazuh Manager by HTTP/wazuh.cluster.running)=0
        name: 'Wazuh Manager: Cluster daemon is not running'
        priority: HIGH
        description: The cluster is enabled but the cluster daemon is not running on this node.
        dependencies:
        - name: 'Wazuh Manager: API is unavailable or not returning data'
          expression: nodata(/Wazuh Manager by HTTP/wazuh.api.core.get,{$WAZUH.API.NODATA.TIME})=1
        tags:
        - tag: scope
          value: availability
    - uuid: e9e0d75c0ff24c44a3fee8fc804216a5
      name: 'Wazuh Manager: Agents: Active'
      type: DEPENDENT
      key: wazuh.agents.active
      history: 31d
      value_type: UNSIGNED
      description: 'Number of agents in connection state: active.'
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.summary.data.connection.active
      master_item:
        key: wazuh.api.core.get
      tags: &id006
      - tag: component
        value: application
      - tag: service
        value: agents
    - uuid: fb0769ad7d5b47b0a890680470c88b94
      name: 'Wazuh Manager: Agents: Disconnected'
      type: DEPENDENT
      key: wazuh.agents.disconnected
      history: 31d
      value_type: UNSIGNED
      description: 'Number of agents in connection state: disconnected.'
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.summary.data.connection.disconnected
      master_item:
        key: wazuh.api.core.get
      tags: *id006
      triggers:
      - uuid: e734cba324b84cde85075a2d275208e2
        expression: min(/Wazuh Manager by HTTP/wazuh.agents.disconnected,15m)>{$WAZUH.AGENTS.DISCONNECTED.MAX.WARN}
        name: 'Wazuh Manager: Too many agents disconnected'
        opdata: 'Disconnected agents: {ITEM.LASTVALUE1}'
        priority: WARNING
        description: The number of disconnected agents has been above the threshold for 15 minutes.
        dependencies:
        - name: 'Wazuh Manager: API is unavailable or not returning data'
          expression: nodata(/Wazuh Manager by HTTP/wazuh.api.core.get,{$WAZUH.API.NODATA.TIME})=1
        tags:
        - tag: scope
          value: availability
    - uuid: eaac1086d81448daaa85fa8c0ffa78bd
      name: 'Wazuh Manager: Agents: Never connected'
      type: DEPENDENT
      key: wazuh.agents.never_connected
      history: 31d
      value_type: UNSIGNED
      description: 'Number of agents in connection state: never connected.'
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.summary.data.connection.never_connected
      master_item:
        key: wazuh.api.core.get
      tags: *id006
    - uuid: 9d9fbf58f6a74d22920334c311380925
      name: 'Wazuh Manager: Agents: Pending'
      type: DEPENDENT
      key: wazuh.agents.pending
      history: 31d
      value_type: UNSIGNED
      description: 'Number of agents in connection state: pending.'
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.summary.data.connection.pending
      master_item:
        key: wazuh.api.core.get
      tags: *id006
    - uuid: 3a05c856d8f449099784c85530b189e8
      name: 'Wazuh Manager: Agents: Total'
      type: DEPENDENT
      key: wazuh.agents.total
      history: 31d
      value_type: UNSIGNED
      description: 'Number of agents in connection state: total.'
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.summary.data.connection.total
      master_item:
        key: wazuh.api.core.get
      tags: *id006
    - uuid: 543601a148b84245ad21157d7291907b
      name: 'Wazuh Manager: Agents: Configuration not synced'
      type: DEPENDENT
      key: wazuh.agents.config.not_synced
      history: 31d
      value_type: UNSIGNED
      description: Number of agents whose group configuration is not synchronized.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.summary.data.configuration.not_synced
      master_item:
        key: wazuh.api.core.get
      tags: *id006
    discovery_rules:
    - uuid: 0fd376e2b7734f1ab5f12ef0486f6e42
      name: Wazuh daemons discovery
      type: DEPENDENT
      key: wazuh.manager.daemons.discovery
      delay: '0'
      lifetime: 7d
      description: Discovers the daemons reported by GET /manager/status. By default only the daemons expected to run on every manager are kept (see {$WAZUH.DAEMON.NAME.MATCHES}).
      master_item:
        key: wazuh.api.core.get
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var d = JSON.parse(value).status.data.affected_items[0];
          return JSON.stringify(Object.keys(d).map(function (k) {
              return {'{#DAEMON}': k};
          }));
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      filter:
        evaltype: AND
        conditions:
        - macro: '{#DAEMON}'
          value: '{$WAZUH.DAEMON.NAME.MATCHES}'
          formulaid: A
        - macro: '{#DAEMON}'
          value: '{$WAZUH.DAEMON.NAME.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
          formulaid: B
      item_prototypes:
      - uuid: 2f0f0ca2c39941a3987dc5e5c0a00de4
        name: 'Wazuh Manager: Daemon [{#DAEMON}]: State'
        type: DEPENDENT
        key: wazuh.manager.daemon.state["{#DAEMON}"]
        history: 31d
        trends: '0'
        value_type: UNSIGNED
        description: 'State of the {#DAEMON} daemon. Possible values: 0 - Running, 1 - Stopped, 2 - Failed, 3 - Unknown.'
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.status.data.affected_items[0]['{#DAEMON}']
        - type: JAVASCRIPT
          parameters:
          - |
            var m = {'running': 0, 'stopped': 1, 'failed': 2};
            var v = String(value).replace(/"/g, '');
            return m.hasOwnProperty(v) ? m[v] : 3;
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1h
        master_item:
          key: wazuh.api.core.get
        valuemap:
          name: Wazuh daemon state
        tags:
        - tag: component
          value: application
        - tag: service
          value: manager
        - tag: daemon
          value: '{#DAEMON}'
        trigger_prototypes:
        - uuid: 2f8c13687cb54f4880d596a0d4ad26d8
          expression: last(/Wazuh Manager by HTTP/wazuh.manager.daemon.state["{#DAEMON}"])>0
          name: 'Wazuh Manager: Daemon [{#DAEMON}]: Not running'
          priority: HIGH
          description: The {#DAEMON} daemon is stopped or failed.
          dependencies:
          - name: 'Wazuh Manager: API is unavailable or not returning data'
            expression: nodata(/Wazuh Manager by HTTP/wazuh.api.core.get,{$WAZUH.API.NODATA.TIME})=1
          tags:
          - tag: scope
            value: availability
    - uuid: 3d266fc38aec40599dcea56a663f210a
      name: Wazuh agents discovery
      type: DEPENDENT
      key: wazuh.agents.discovery
      delay: '0'
      lifetime: 7d
      description: Discovers the registered agents. The manager itself (agent 000) is excluded by default.
      master_item:
        key: wazuh.api.agents.get
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          return JSON.stringify(JSON.parse(value).map(function (a) {
              return {'{#AGENT.ID}': a.id, '{#AGENT.NAME}': a.name, '{#AGENT.IP}': a.ip};
          }));
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      filter:
        evaltype: AND
        conditions:
        - macro: '{#AGENT.NAME}'
          value: '{$WAZUH.AGENT.NAME.MATCHES}'
          formulaid: A
        - macro: '{#AGENT.NAME}'
          value: '{$WAZUH.AGENT.NAME.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
          formulaid: B
        - macro: '{#AGENT.ID}'
          value: '{$WAZUH.AGENT.ID.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
          formulaid: C
      item_prototypes:
      - uuid: 2d4aeff40adf4e34b5e28894274bd53f
        name: 'Wazuh Manager: Agent [{#AGENT.NAME}]: Status'
        type: DEPENDENT
        key: wazuh.agent.status["{#AGENT.ID}"]
        history: 31d
        trends: '0'
        value_type: UNSIGNED
        description: 'Connection status of agent {#AGENT.NAME} ({#AGENT.IP}). Possible values: 0 - Active, 1 - Disconnected, 2 - Never connected, 3 - Pending, 4 - Unknown.'
        preprocessing:
        - type: JSONPATH
          parameters:
          - $[?(@.id=='{#AGENT.ID}')].st.first()
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1h
        master_item:
          key: wazuh.api.agents.get
        valuemap:
          name: Wazuh agent status
        tags:
        - tag: component
          value: application
        - tag: service
          value: agents
        - tag: agent
          value: '{#AGENT.NAME}'
        trigger_prototypes:
        - uuid: d0739fa87db14badb74ebf19affb15ac
          expression: last(/Wazuh Manager by HTTP/wazuh.agent.status["{#AGENT.ID}"])=1
          name: 'Wazuh Manager: Agent [{#AGENT.NAME}]: Disconnected'
          priority: WARNING
          description: Agent {#AGENT.NAME} ({#AGENT.IP}) is disconnected. The manager marks an agent as disconnected only after its own disconnection delay has elapsed.
          dependencies:
          - name: 'Wazuh Manager: API is unavailable or not returning data'
            expression: nodata(/Wazuh Manager by HTTP/wazuh.api.core.get,{$WAZUH.API.NODATA.TIME})=1
          tags:
          - tag: scope
            value: availability
        - uuid: d08cde00c1664562b0e1733be81dcd78
          expression: last(/Wazuh Manager by HTTP/wazuh.agent.status["{#AGENT.ID}"])=2
          name: 'Wazuh Manager: Agent [{#AGENT.NAME}]: Never connected'
          priority: INFO
          description: Agent {#AGENT.NAME} ({#AGENT.IP}) is registered but has never connected.
          manual_close: 'YES'
          tags:
          - tag: scope
            value: notice
      - uuid: 66da3bd2a3144fd3a18e1035dedcab01
        name: 'Wazuh Manager: Agent [{#AGENT.NAME}]: Version'
        type: DEPENDENT
        key: wazuh.agent.version["{#AGENT.ID}"]
        history: 31d
        trends: '0'
        value_type: CHAR
        description: Wazuh agent version of {#AGENT.NAME}.
        preprocessing:
        - type: JSONPATH
          parameters:
          - $[?(@.id=='{#AGENT.ID}')].version.first()
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1d
        master_item:
          key: wazuh.api.agents.get
        tags:
        - tag: component
          value: application
        - tag: service
          value: agents
        - tag: agent
          value: '{#AGENT.NAME}'
    macros:
    - macro: '{$WAZUH.API.SCHEME}'
      value: https
      description: Wazuh API scheme (http or https).
    - macro: '{$WAZUH.API.PORT}'
      value: '55000'
      description: Wazuh API port.
    - macro: '{$WAZUH.API.USER}'
      value: zbx_monitor
      description: Wazuh API user. Create a dedicated user with a read-only role.
    - macro: '{$WAZUH.API.PASSWORD}'
      type: SECRET_TEXT
      description: Wazuh API user password.
    - macro: '{$WAZUH.API.HTTP.PROXY}'
      value: ''
      description: HTTP proxy used to reach the Wazuh API, for example http://proxy.example.com:3128. Leave empty to connect directly.
    - macro: '{$WAZUH.API.INTERVAL}'
      value: 1m
      description: Collection interval for the core API data.
    - macro: '{$WAZUH.API.AGENTS.INTERVAL}'
      value: 2m
      description: Collection interval for the agents list.
    - macro: '{$WAZUH.API.VALIDATION.INTERVAL}'
      value: 1h
      description: Collection interval for the configuration validation.
    - macro: '{$WAZUH.API.NODATA.TIME}'
      value: 5m
      description: No-data period before the API is considered unavailable.
    - macro: '{$WAZUH.DAEMON.NAME.MATCHES}'
      value: ^wazuh-(analysisd|remoted|db|execd|modulesd|syscheckd|logcollector|monitord|authd|apid)$
      description: Filter of discovered daemons by name (regex). Optional daemons such as wazuh-integratord or wazuh-clusterd are excluded by default.
    - macro: '{$WAZUH.DAEMON.NAME.NOT_MATCHES}'
      value: CHANGE_IF_NEEDED
      description: Filter to exclude discovered daemons by name (regex).
    - macro: '{$WAZUH.AGENT.NAME.MATCHES}'
      value: .+
      description: Filter of discovered agents by name (regex).
    - macro: '{$WAZUH.AGENT.NAME.NOT_MATCHES}'
      value: CHANGE_IF_NEEDED
      description: Filter to exclude discovered agents by name (regex).
    - macro: '{$WAZUH.AGENT.ID.NOT_MATCHES}'
      value: ^000$
      description: Filter to exclude discovered agents by id (regex). 000 is the manager itself.
    - macro: '{$WAZUH.AGENTS.DISCONNECTED.MAX.WARN}'
      value: '10'
      description: Maximum number of disconnected agents before a warning is raised.
    tags:
    - tag: class
      value: application
    - tag: target
      value: wazuh
    - tag: target
      value: wazuh-manager
    valuemaps:
