zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: c2c162144c2d4c5491c8801193af4945
      name: Templates/Cloud
  templates:
    - uuid: 3067bb9881244da1b0bd567de06f346b
      template: 'Oracle Cloud Cost by HTTP'
      name: 'Oracle Cloud Cost by HTTP'
      description: |
        Template para monitoramento dos custos da Oracle Cloud Infrastructure (OCI) por meio da API de Usage, compatível com Zabbix 7.0 LTS.
        
        Permite acompanhar o custo acumulado do mês, o custo do dia atual, do dia anterior e de dois dias antes, com os valores retornados em BRL. Inclui triggers configuráveis para alertar quando o custo diário atingir ou ultrapassar o limite definido na macro {$OCI.COST.DAILY.LIMIT}.
        
        A comunicação entre o Zabbix e a API da OCI é realizada por HTTPS, utilizando TLS, garantindo a proteção dos dados durante o transporte. Além da criptografia fornecida pelo HTTPS, as requisições à API de Usage são assinadas digitalmente com RSA-SHA256, utilizando a chave privada da API Key configurada no usuário da OCI. A assinatura permite à OCI validar a autenticidade e a integridade da requisição. A chave privada é armazenada no Zabbix por meio da macro do tipo Secret text e não é enviada diretamente como parte da requisição HTTP.
        
        Cada item do tipo Script executa sua própria consulta à API da OCI no horário configurado. As requisições são autenticadas individualmente utilizando a API Key, o OCID da tenancy, o OCID do usuário e o fingerprint da chave.
        
        O template também possui suporte a proxy HTTP, configurado pela macro {$OCI.API.HTTP.PROXY}. Por padrão, essa macro pode permanecer vazia, fazendo com que o Zabbix estabeleça a conexão diretamente com a API da OCI. Em ambientes onde o servidor Zabbix não possui acesso direto à Internet, pode ser informado um proxy, por exemplo:
        
        http://proxy.exemplo.local:8080
        
        Nesse cenário, o fluxo da comunicação será Zabbix → Proxy HTTP → HTTPS/TLS → API de Usage da OCI. O proxy atua como intermediário para a conexão, enquanto a comunicação com o endpoint da OCI continua sendo realizada por HTTPS. Caso o ambiente utilize autenticação ou uma configuração específica de proxy, ela deve ser previamente permitida/configurada no proxy utilizado.
        
        Quando os dados referentes ao dia atual ainda não estiverem disponíveis na OCI, o item correspondente retorna 0 BRL, evitando que o valor de um dia anterior seja interpretado incorretamente como o custo do dia atual.
        
        O template utiliza as APIs oficiais da Oracle Cloud Infrastructure e requer um usuário da OCI com as permissões necessárias para consultar os dados de Usage.
      vendor:
        name: luizcarmo1
        version: 1.0.0
      groups:
        - name: Templates/Cloud
      items:
        - uuid: 30d4c2af3c444f5db271bb1799e2ade4
          name: 'OCI Cost: 2 Days Ago'
          type: SCRIPT
          key: oci.cost.2days_ago
          delay: 1h;h0m30
          value_type: FLOAT
          trends: '0'
          units: BRL
          params: |
            function validateZabbixParams(requiredParams, allParams) {
            	requiredParams.forEach(function (field) {
            		if (typeof allParams !== 'object' || typeof allParams[field] === 'undefined' || allParams[field] === '') {
            			throw 'Required param is not set: ' + field + '.';
            		}
            	});
            }
            
            
            function OCI(service, action, params) {
            	this.zabbixLogPrefix = '[ OCI ] [ ' + service + ' ] [ ' + action + ' ]';
            	this.request = new HttpRequest();
            
            	this.hash = function (string) {
            		return sha256(string);
            	};
            
            	this.sign = function (string) {
            		return sign('sha256', params['private_key'], string);
            	};
            
            	this.encode = function (hash) {
            		const hexArr = hash.match(/.{1,2}/g);
            		var uInt8Array = new Uint8Array(hexArr.length);
            
            		hexArr.forEach(function (hex, idx) {
            			uInt8Array[idx] = parseInt(hex, 16);
            		});
            
            		return btoa(uInt8Array);
            	};
            
            	this.getDate = function () {
            		const weekdayShortList = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            		const monthShortList = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
            
            		const today = new Date();
            
            		return weekdayShortList[today.getUTCDay()] + ', ' +
            			today.getUTCDate() + ' ' +
            			monthShortList[today.getUTCMonth()] + ' ' +
            			today.getUTCFullYear() + ' ' +
            			today.getUTCHours() + ':' +
            			today.getUTCMinutes() + ':' +
            			today.getUTCSeconds() + ' GMT';
            	};
            
            	this.executeRequest = function (body) {
            
            		const httpMethod = 'post';
            		const apiPath = '/20200107/usage';
            
            		const contentTypeHeader = 'content-type: application/json';
            		const dateHeader = 'date: ' + this.getDate();
            		const hostHeader = 'host: ' + params['api_host'];
            
            		const requestTarget = '(request-target): ' +
            			httpMethod + ' ' + apiPath;
            
            		var signingString =
            			requestTarget + '\n' +
            			dateHeader + '\n' +
            			hostHeader;
            
            		var headers =
            			'(request-target) date host x-content-sha256 content-type content-length';
            
            		const bodyHeader =
            			'x-content-sha256: ' +
            			this.encode(this.hash(body));
            
            		const bodyLengthHeader =
            			'content-length: ' + body.length;
            
            		signingString =
            			signingString + '\n' +
            			bodyHeader + '\n' +
            			contentTypeHeader + '\n' +
            			bodyLengthHeader;
            
            		const signature =
            			this.encode(this.sign(signingString));
            
            		this.request.addHeader(contentTypeHeader);
            		this.request.addHeader(dateHeader);
            		this.request.addHeader(bodyHeader);
            		this.request.addHeader(bodyLengthHeader);
            
            		this.request.addHeader(
            			'Authorization: Signature version="1",' +
            			'keyId="' +
            			params['tenancy_ocid'] + '/' +
            			params['user_ocid'] + '/' +
            			params['fingerprint'] +
            			'",algorithm="rsa-sha256",' +
            			'headers="' + headers + '",' +
            			'signature="' + signature + '"'
            		);
            
            		if (params['http_proxy']) {
            			this.request.setProxy(params['http_proxy']);
            		}
            
            		const response = this.request.post(
            			'https://' +
            			params['api_host'] +
            			apiPath,
            			body
            		);
            
            		const status = this.request.getStatus();
            
            		this.request.clearHeader();
            
            		if (status === parseInt(params['http_status_code'])) {
            			return response;
            		}
            
            		throw 'Unexpected HTTP response code: ' + status;
            	};
            }
            
            
            const params = JSON.parse(value);
            
            validateZabbixParams(
            	[
            		'tenancy_ocid',
            		'user_ocid',
            		'private_key',
            		'fingerprint',
            		'api_host',
            		'http_status_code'
            	],
            	params
            );
            
            
            var oci = new OCI(
            	'Usage',
            	'Get 2 days ago cost',
            	params
            );
            
            
            var now = new Date();
            
            var year = now.getUTCFullYear();
            var month = now.getUTCMonth();
            var day = now.getUTCDate();
            
            var start = new Date(Date.UTC(year, month, day - 2));
            var end = new Date(Date.UTC(year, month, day - 1));
            
            
            function isoDate(date) {
            	return date.toISOString().replace('.000Z', 'Z');
            }
            
            
            var body = JSON.stringify({
            	tenantId: params['tenancy_ocid'],
            	timeUsageStarted: isoDate(start),
            	timeUsageEnded: isoDate(end),
            	granularity: 'DAILY',
            	queryType: 'COST',
            	groupBy: ['currency'],
            });
            
            
            var response = oci.executeRequest(body);
            
            
            try {
            	response = JSON.parse(response);
            }
            catch (error) {
            	throw 'Could not parse OCI Usage API response.';
            }
            
            
            var requestedDate =
            	year.toString() + '-' +
            	('0' + (month + 1)).slice(-2) + '-' +
            	('0' + (day - 2)).slice(-2);
            
            
            var total = 0;
            
            if (response.items) {
            
            	for (var i = 0; i < response.items.length; i++) {
            
            		var item = response.items[i];
            
            		if (item.currency !== 'BRL') {
            			continue;
            		}
            
            		if (!item.timeUsageStarted) {
            			continue;
            		}
            
            		var itemDate = item.timeUsageStarted.substring(0, 10);
            
            		if (itemDate === requestedDate) {
            			total += parseFloat(item.computedAmount || 0);
            		}
            	}
            }
            
            
            return total;
          description: 'Consulta o custo da tenancy referente a dois dias antes por meio da API de Usage da Oracle Cloud Infrastructure. O valor retornado é validado pela data informada pela API antes de ser armazenado.'
          timeout: 60s
          parameters:
            - name: api_host
              value: '{$OCI.API.USAGE.HOST}'
            - name: fingerprint
              value: '{$OCI.API.FINGERPRINT}'
            - name: http_proxy
              value: '{$OCI.API.HTTP.PROXY}'
            - name: http_status_code
              value: '{$OCI.HTTP.RESPONSE.CODE.OK}'
            - name: private_key
              value: '{$OCI.API.PRIVATE.KEY}'
            - name: tenancy_ocid
              value: '{$OCI.API.TENANCY}'
            - name: user_ocid
              value: '{$OCI.API.USER}'
