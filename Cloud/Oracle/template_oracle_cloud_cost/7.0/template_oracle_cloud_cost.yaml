        - uuid: 32e5064a668a4014b6bae1846013f723
          name: 'OCI Cost: Yesterday'
          type: SCRIPT
          key: oci.cost.yesterday
          delay: 1h;h0m20
          value_type: FLOAT
          trends: '0'
          units: BRL
          params: |
            function validateZabbixParams(requiredParams, allParams) {
            	requiredParams.forEach(function (field) {
            		if (typeof allParams !== 'object' || typeof allParams[field] === 'undefined' || allParams[field] === '') {
            			throw 'Required param is not set: ' + field + '.';
            		}
            	});
            }
            
            
            function OCI(service, action, params) {
            	this.zabbixLogPrefix = '[ OCI ] [ ' + service + ' ] [ ' + action + ' ]';
            	this.request = new HttpRequest();
            
            	this.hash = function (string) {
            		return sha256(string);
            	};
            
            	this.sign = function (string) {
            		return sign('sha256', params['private_key'], string);
            	};
            
            	this.encode = function (hash) {
            		const hexArr = hash.match(/.{1,2}/g);
            		var uInt8Array = new Uint8Array(hexArr.length);
            
            		hexArr.forEach(function (hex, idx) {
            			uInt8Array[idx] = parseInt(hex, 16);
            		});
            
            		return btoa(uInt8Array);
            	};
            
            	this.getDate = function () {
            		const weekdayShortList = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            		const monthShortList = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
            
            		const today = new Date();
            
            		return weekdayShortList[today.getUTCDay()] + ', ' +
            			today.getUTCDate() + ' ' +
            			monthShortList[today.getUTCMonth()] + ' ' +
            			today.getUTCFullYear() + ' ' +
            			today.getUTCHours() + ':' +
            			today.getUTCMinutes() + ':' +
            			today.getUTCSeconds() + ' GMT';
            	};
            
            	this.executeRequest = function (body) {
            
            		const httpMethod = 'post';
            		const apiPath = '/20200107/usage';
            
            		const contentTypeHeader = 'content-type: application/json';
            		const dateHeader = 'date: ' + this.getDate();
            		const hostHeader = 'host: ' + params['api_host'];
            
            		const requestTarget = '(request-target): ' +
            			httpMethod + ' ' + apiPath;
            
            		var signingString =
            			requestTarget + '\n' +
            			dateHeader + '\n' +
            			hostHeader;
            
            		var headers =
            			'(request-target) date host x-content-sha256 content-type content-length';
            
            		const bodyHeader =
            			'x-content-sha256: ' +
            			this.encode(this.hash(body));
            
            		const bodyLengthHeader =
            			'content-length: ' + body.length;
            
            		signingString =
            			signingString + '\n' +
            			bodyHeader + '\n' +
            			contentTypeHeader + '\n' +
            			bodyLengthHeader;
            
            		const signature =
            			this.encode(this.sign(signingString));
            
            		this.request.addHeader(contentTypeHeader);
            		this.request.addHeader(dateHeader);
            		this.request.addHeader(bodyHeader);
            		this.request.addHeader(bodyLengthHeader);
            
            		this.request.addHeader(
            			'Authorization: Signature version="1",' +
            			'keyId="' +
            			params['tenancy_ocid'] + '/' +
            			params['user_ocid'] + '/' +
            			params['fingerprint'] +
            			'",algorithm="rsa-sha256",' +
            			'headers="' + headers + '",' +
            			'signature="' + signature + '"'
            		);
            
            		if (params['http_proxy']) {
            			this.request.setProxy(params['http_proxy']);
            		}
            
            		const response = this.request.post(
            			'https://' +
            			params['api_host'] +
            			apiPath,
            			body
            		);
            
            		const status = this.request.getStatus();
            
            		this.request.clearHeader();
            
            		if (status === parseInt(params['http_status_code'])) {
            			return response;
            		}
            
            		throw 'Unexpected HTTP response code: ' + status;
            	};
            }
            
            
            const params = JSON.parse(value);
            
            validateZabbixParams(
            	[
            		'tenancy_ocid',
            		'user_ocid',
            		'private_key',
            		'fingerprint',
            		'api_host',
            		'http_status_code'
            	],
            	params
            );
            
            
            var oci = new OCI(
            	'Usage',
            	'Get yesterday cost',
            	params
            );
            
            
            var now = new Date();
            
            var year = now.getUTCFullYear();
            var month = now.getUTCMonth();
            var day = now.getUTCDate();
            
            var start = new Date(Date.UTC(year, month, day - 1));
            var end = new Date(Date.UTC(year, month, day));
            
            
            function isoDate(date) {
            	return date.toISOString().replace('.000Z', 'Z');
            }
            
            
            var body = JSON.stringify({
            	tenantId: params['tenancy_ocid'],
            	timeUsageStarted: isoDate(start),
            	timeUsageEnded: isoDate(end),
            	granularity: 'DAILY',
            	queryType: 'COST',
            	groupBy: ['currency'],
            });
            
            
            var response = oci.executeRequest(body);
            
            
            try {
            	response = JSON.parse(response);
            }
            catch (error) {
            	throw 'Could not parse OCI Usage API response.';
            }
            
            
            var requestedDate =
            	year.toString() + '-' +
            	('0' + (month + 1)).slice(-2) + '-' +
            	('0' + (day - 1)).slice(-2);
            
            
            var total = 0;
            
            if (response.items) {
            
            	for (var i = 0; i < response.items.length; i++) {
            
            		var item = response.items[i];
            
            		if (item.currency !== 'BRL') {
            			continue;
            		}
            
            		if (!item.timeUsageStarted) {
            			continue;
            		}
            
            		var itemDate = item.timeUsageStarted.substring(0, 10);
            
            		if (itemDate === requestedDate) {
            			total += parseFloat(item.computedAmount || 0);
            		}
            	}
            }
            
            
            return total;
