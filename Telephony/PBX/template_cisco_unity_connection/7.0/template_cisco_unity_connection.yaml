                  parameters:
                    - |
                      var escapedName = "{#SERVICE.NAME}".replace(/[.*+?^${}()|[\]\\]/g, "\\$&"),
                          record = new RegExp("<[^>]*ServiceName>\\s*" + escapedName + "\\s*<\\/[^>]*ServiceName>").exec(value);
                      if (!record) throw "exact service record absent";
                      var tail = value.slice(record.index + record[0].length), end = tail.search(/<\/[^>]*item>/);
                      if (end < 0) throw "service record boundary absent";
                      var block = tail.slice(0, end);var match = /<[^>]*ServiceStatus>\s*([^<]+)\s*</.exec(block);
                      if (!match) throw "service status absent";
                      var status = match[1].trim();
                      if (status === "Started") return 1;
                      if (status === "Stopped") return 2;
                      throw "unknown service status";
              master_item:
                key: cuc.control.services.raw
              tags:
                - tag: component
                  value: services
                - tag: scope
                  value: operator
              trigger_prototypes:
                - uuid: c1526f09d13d475a878f2fb7439735fa
                  expression: 'last(/Cisco Unity Connection 15 by API/cuc.service.state[{#SERVICE.NAME}])=2'
                  name: 'CUC service {#SERVICE.NAME} is unexpectedly stopped'
                  priority: HIGH
                  description: 'A discovered critical Unity/VOS service is not running. Review the ControlCenter reason item before starting or restarting services.'
                  tags:
                    - tag: component
                      value: services
            - uuid: 2bc4bc6c17a541b28e52d687a4058321
              name: 'CUC: service {#SERVICE.NAME}: uptime'
              type: DEPENDENT
              key: 'cuc.service.uptime[{#SERVICE.NAME}]'
              delay: '0'
              units: s
              description: 'Time since the discovered critical service last started.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var escapedName = "{#SERVICE.NAME}".replace(/[.*+?^${}()|[\]\\]/g, "\\$&"),
                          record = new RegExp("<[^>]*ServiceName>\\s*" + escapedName + "\\s*<\\/[^>]*ServiceName>").exec(value);
                      if (!record) throw "exact service record absent";
                      var tail = value.slice(record.index + record[0].length), end = tail.search(/<\/[^>]*item>/);
                      if (end < 0) throw "service record boundary absent";
                      var block = tail.slice(0, end);var state = /<[^>]*ServiceStatus>\s*([^<]+)\s*</.exec(block);
                      if (!state) throw "service status absent";
                      if (state[1].trim() === "Stopped") return 0;
                      if (state[1].trim() !== "Started") throw "unknown service status";
                      var match = /<[^>]*UpTime>\s*([^<]+)/.exec(block), uptime;
                      if (!match) throw "started service uptime absent";
                      uptime = Number(match[1]);
                      if (!isFinite(uptime) || uptime < 0) throw "invalid service uptime";
                      return uptime;
              master_item:
                key: cuc.control.services.raw
              tags:
                - tag: component
                  value: services
                - tag: scope
                  value: operator
              trigger_prototypes:
                - uuid: 11fdbde9de07449b951b6f842cb1f7c6
                  expression: 'last(/Cisco Unity Connection 15 by API/cuc.service.uptime[{#SERVICE.NAME}])>0 and last(/Cisco Unity Connection 15 by API/cuc.service.uptime[{#SERVICE.NAME}])<600'
                  name: 'CUC service {#SERVICE.NAME} was restarted recently'
                  priority: INFO
                  description: 'The service uptime indicates a recent restart. Confirm whether it was planned and correlate with node or application events.'
                  tags:
                    - tag: component
                      value: services
          master_item:
            key: cuc.control.services.raw
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = [], seen = {}, match,
                      exclude = new RegExp('{$CUC.SERVICES.NOT_TO_DISCOVER}'),
                      pattern = /<[^>]*item>\s*<[^>]*ServiceName>([^<]+)[\s\S]*?<[^>]*ServiceStatus>([^<]+)/g;
                  while ((match = pattern.exec(value)) !== null) {
                      var name = match[1].trim();
                      if (name && !seen[name] && !exclude.test(name)) {
                          seen[name] = true;
                          data.push({"{#SERVICE.NAME}": name, "{#SERVICE.STATUS}": match[2].trim()});
                      }
                  }
                  if (!data.length) throw "no included service records";
                  return JSON.stringify({data: data});
      tags:
        - tag: class
          value: voip
        - tag: target
          value: cisco-unity-connection
      macros:
        - macro: '{$CUC.API.INTERVAL}'
          value: 2m
          description: 'Default interval for Unity VMREST health and read-only runtime collection. Use a Zabbix time suffix such as 2m or 5m; shorter values increase Unity web/API load.'
        - macro: '{$CUC.API.PASSWORD}'
          type: SECRET_TEXT
          description: 'Secret web password for the dedicated Unity monitoring user in {$CUC.API.USER}. Override on the host.'
        - macro: '{$CUC.API.TIMEOUT}'
          value: 15s
          description: 'Timeout for one Unity VMREST/CUPI or Serviceability request. Use a Zabbix duration such as 15s or 30s; increase only for slow WAN links or overloaded lab systems.'
        - macro: '{$CUC.API.USER}'
          value: zabbix-monitor
          description: 'Dedicated Unity user without a mailbox. Assign Read Only Administrator for GET-only VMREST/CUPI and Serviceability access; use System Administrator only as a compatibility fallback after a 401, 403, or SOAP authorization fault. Override on the host.'
        - macro: '{$CUC.CERT.DISASTER}'
          value: '7'
          description: 'DISASTER certificate-expiry boundary in days. Values below 0 mean already expired; default 7 raises the urgent pre-expiry tier for certificates expiring within one week.'
        - macro: '{$CUC.CERT.HIGH}'
          value: '30'
          description: 'AVERAGE certificate-expiry boundary in days. Default 30 creates the 7-29 day renewal-planning tier.'
        - macro: '{$CUC.CERT.INFO}'
          value: '90'
          description: 'INFO certificate-expiry boundary in days. Default 90 creates an early renewal notice before the warning tier.'
        - macro: '{$CUC.CERT.URL}'
          value: 'https://cuc.example.invalid'
          description: 'Cisco VOS certificate management base URL; override on the host.'
        - macro: '{$CUC.CERT.WARN}'
          value: '60'
          description: 'WARNING certificate-expiry boundary in days. Default 60 creates the 30-59 day warning tier.'
        - macro: '{$CUC.CPU.HIGH}'
          value: '90'
          description: 'HIGH CPU-utilization threshold in percent, evaluated over the sustained trigger window. Raising it reduces sensitivity to CPU pressure reported by PerfMon.'
        - macro: '{$CUC.CPU.WARN}'
          value: '80'
          description: 'WARNING CPU-utilization threshold in percent, evaluated over the sustained trigger window. Lower values detect pressure earlier but may be noisier.'
        - macro: '{$CUC.INTERFACES.NOT_TO_DISCOVER}'
          value: ^$
          description: 'Regex for network interfaces excluded from discovery; ^$ excludes none.'
        - macro: '{$CUC.HTTP.PROXY}'
          value: ''
          description: 'Optional HTTP proxy URL for HTTP agent requests; leave empty for a direct connection.'
        - macro: '{$CUC.FQDN}'
          value: cuc.example.invalid
          description: 'Unity Connection FQDN resolved by the Zabbix server or proxy for the independent HTTPS reachability check.'
        - macro: '{$CUC.INVENTORY.INTERVAL}'
          value: 30m
          description: 'Polling interval for low-change VMREST inventory counts such as users, ports, port groups, phone systems, nodes, and software version. Default 30m preserves API headroom.'
        - macro: '{$CUC.INVENTORY.TIMEOUT}'
          value: 45s
          description: 'Timeout for the sequential VMREST inventory collector. It performs several read-only GET requests in one script run; increase only if slow API responses cause unsupported inventory data.'
        - macro: '{$CUC.MEM.HIGH}'
          value: '95'
          description: 'HIGH physical-memory utilization threshold in percent, evaluated over the sustained trigger window.'
        - macro: '{$CUC.MEM.WARN}'
          value: '85'
          description: 'WARNING physical-memory utilization threshold in percent, evaluated over the sustained trigger window.'
        - macro: '{$CUC.MESSAGE.QUEUE.WARN}'
          value: '10'
          description: 'Queued-message warning threshold sustained for ten minutes.'
        - macro: '{$CUC.NODE}'
          value: cuc-node
          description: 'Exact Unity node hostname used in PerfMon counter paths.'
        - macro: '{$CUC.OS.PASSWORD}'
          type: SECRET_TEXT
          description: 'Secret password for the dedicated read-only Cisco VOS Certificate Management account in {$CUC.OS.USER}. Override on the host.'
        - macro: '{$CUC.OS.USER}'
          value: os-monitor
          description: 'Dedicated Cisco VOS Certificate Management account created with privilege 0 (read APIs only). Override on the host.'
        - macro: '{$CUC.PARTITION.HIGH}'
          value: '92'
          description: 'Partition high threshold in percent.'
        - macro: '{$CUC.PARTITION.WARN}'
          value: '85'
          description: 'Partition warning threshold in percent.'
        - macro: '{$CUC.PARTITIONS.NOT_TO_DISCOVER}'
          value: ^$
          description: 'Regex for partitions excluded from discovery; ^$ excludes none.'
        - macro: '{$CUC.PERFMON.INTERVAL}'
          value: 2m
          description: 'Polling interval for Cisco Serviceability PerfMon platform and workload collectors. Default 2m balances 5-10 minute fault visibility with API load.'
        - macro: '{$CUC.PORTS.HIGH}'
          value: '95'
          description: 'HIGH Unity voice-port utilization threshold in percent. It is based on systemwide active voice ports versus configured ports.'
        - macro: '{$CUC.PORTS.WARN}'
          value: '80'
          description: 'WARNING Unity voice-port utilization threshold in percent. Lower values provide earlier capacity visibility.'
        - macro: '{$CUC.REPLICATION.EXPECTED}'
          value: '0'
          description: 'Set to 1 only on a Unity Connection cluster node where file replication is configured and expected.'
        - macro: '{$CUC.REPLICATION.LATENCY.WARN}'
          value: '300'
          description: 'File-replication latency warning threshold in seconds, evaluated over 15 minutes when replication is expected.'
        - macro: '{$CUC.SERVICEABILITY.URL}'
          value: 'https://cuc.example.invalid:8443'
          description: 'Cisco Serviceability SOAP base URL, normally https://<node>:8443. Used for PerfMon and ControlCenter read-only collectors.'
        - macro: '{$CUC.SERVICES.NOT_TO_DISCOVER}'
          value: ^$
          description: 'Regular expression for ControlCenter services excluded from discovery. Default ^$ excludes none; use exact, anchored patterns for local noise suppression.'
        - macro: '{$CUC.SWAP.HIGH}'
          value: '50'
          description: 'HIGH allocated-swap threshold in percent. Swap alerts also require sustained memory pressure so normal VOS swap allocation is not treated as paging by itself.'
        - macro: '{$CUC.SWAP.MEMORY.MIN}'
          value: '85'
          description: 'Minimum sustained memory utilization required before elevated allocated swap is page-worthy.'
        - macro: '{$CUC.SWAP.WARN}'
          value: '25'
          description: 'WARNING allocated-swap threshold in percent. Swap alerts also require sustained memory pressure.'
        - macro: '{$CUC.TELEPHONY.REQUIRED}'
          value: '1'
          description: 'Set to 1 when this Unity Connection node is expected to provide telephony service with at least one phone system, port group, and voice port. Set 0 for non-telephony or staged lab nodes.'
        - macro: '{$CUC.URL}'
          value: 'https://cuc.example.invalid'
          description: 'Unity base URL without trailing slash. Override on the host.'
