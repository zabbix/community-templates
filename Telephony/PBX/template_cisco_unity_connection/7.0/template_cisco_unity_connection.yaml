zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 1d12408342854fd5a4436dd6d5d1bd4a
      name: Templates/Telephony
  templates:
    - uuid: 1d6c69fc149a48febbf6a61ce8dc3d33
      template: 'Cisco Unity Connection 15 by API'
      name: 'Cisco Unity Connection 15 by API'
      description: 'Cisco Unity Connection 15 monitoring through read-only VMREST/CUPI, Cisco Serviceability PerfMon and ControlCenter SOAP, and the Cisco VOS Certificate Management API. Host setup: set {$CUC.URL}, {$CUC.SERVICEABILITY.URL}, {$CUC.CERT.URL}, {$CUC.NODE} (exact PerfMon node name), {$CUC.FQDN}, {$CUC.API.USER}, {$CUC.API.PASSWORD}, {$CUC.OS.USER}, and {$CUC.OS.PASSWORD}; {$CUC.HTTP.PROXY} is optional. The Unity user must have no mailbox and needs Read Only Administrator for GET-only VMREST/CUPI and Serviceability monitoring; System Administrator is a compatibility fallback only if the installed release rejects a required read endpoint. The separate VOS certificate account needs certificate-API privilege 0 (read only). Certificate Latest Data includes CN, issuer, SAN, UTC expiry, Key Usage, and Extended Key Usage from the existing PEM snapshot. Set {$CUC.REPLICATION.EXPECTED}=1 only on a clustered node where file replication is expected. Operator items use scope=operator; transport/master payloads use scope=internal. Maintainer: DevYves89.'
      vendor:
        name: Zabbix
        version: 7.0-5
      groups:
        - name: Templates/Telephony
      items:
        - uuid: b69b5c4a20d84ac5a88d263bf56d6731
          name: 'CUC: VMREST API availability'
          type: DEPENDENT
          key: cuc.api.available
          delay: '0'
          history: 7d
          description: 'Whether the VMREST version request succeeded. Collection OK means the Unity application API is reachable and authenticated.'
          valuemap:
            name: 'CUC VMREST availability'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.available
          master_item:
            key: cuc.api.health.raw
          tags:
            - tag: component
              value: api
            - tag: scope
              value: operator
          triggers:
            - uuid: 1bfc6d366ea649b0982df947315e1029
              expression: 'max(/Cisco Unity Connection 15 by API/cuc.api.available,3m)=0'
              name: 'CUC: VMREST API is unavailable'
              priority: HIGH
              description: 'Review the related Latest Data item, its history, and neighboring Unity/VOS health metrics before taking action.'
        - uuid: 1367f12771d14eaebf6115b1adf13a13
          name: 'CUC: Certificate Management collection health'
          type: DEPENDENT
          key: cuc.api.certificate.health
          delay: '0'
          history: 7d
          description: 'Health of the most recent Cisco VOS Certificate Management API collection. Collection OK means a valid identity-certificate snapshot was returned.'
          valuemap:
            name: 'CUC collection health'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'if(value.indexOf(''identities'')<0||value.indexOf(''Fault'')>=0)throw ''invalid API response'';return 1;'
          master_item:
            key: cuc.certificate.snapshot.raw
          tags:
            - tag: component
              value: api
            - tag: scope
              value: operator
          triggers:
            - uuid: 9a8d999547d441e18fc42f5d19da5fb9
              expression: 'nodata(/Cisco Unity Connection 15 by API/cuc.api.certificate.health,12h)=1'
              name: 'CUC Certificate Management API health has no successful data for 12 hours'
              priority: HIGH
              description: 'Review the related Latest Data item, its history, and neighboring Unity/VOS health metrics before taking action.'
              tags:
                - tag: scope
                  value: api
        - uuid: 0fef8123ac3d4fa89d63dcf82192fc40
          name: 'CUC: API error'
          type: DEPENDENT
          key: cuc.api.error
          delay: '0'
          history: 7d
          value_type: TEXT
          trends: '0'
          description: 'Last VMREST collection error. Empty means the most recent request completed without an application-level error.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.error
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: cuc.api.health.raw
          tags:
            - tag: component
              value: api
            - tag: scope
              value: operator
        - uuid: 6c67bc65992d4dfcbfb3b877473b510b
          name: 'CUC internal: VMREST health raw/master'
          type: SCRIPT
          key: cuc.api.health.raw
          delay: '{$CUC.API.INTERVAL}'
          history: '0'
          value_type: TEXT
          trends: '0'
          params: |
            var p = JSON.parse(value),
                request = new HttpRequest(),
                started = Date.now(),
                result = {
                    available: 0,
                    http_status: 0,
                    response_time_ms: 0,
                    error: '',
                    payload: ''
                };
            
            request.setHttpAuth(HTTPAUTH_BASIC, p.username, p.password);
            request.addHeader('Accept: application/json, application/xml;q=0.9, text/xml;q=0.8');
            
            try {
                result.payload = request.get(p.url);
                result.http_status = request.getStatus();
                result.available = result.http_status >= 200 && result.http_status < 400 ? 1 : 0;
            }
            catch (e) {
                result.error = String(e);
            }
            
            result.response_time_ms = Date.now() - started;
            return JSON.stringify(result);
          description: 'Internal transport/master item. Raw API payload for dependent operator items: VMREST availability, HTTP status, response time, and error text. Filter scope=internal; do not use this raw value for incident interpretation.'
          timeout: '{$CUC.API.TIMEOUT}'
          parameters:
            - name: password
              value: '{$CUC.API.PASSWORD}'
            - name: url
              value: '{$CUC.URL}/vmrest/version'
            - name: username
              value: '{$CUC.API.USER}'
          tags:
            - tag: component
              value: raw
            - tag: scope
              value: internal
        - uuid: 8d46795e693b46f2b4da3ae0c9592ec4
          name: 'CUC: API HTTP status'
          type: DEPENDENT
          key: cuc.api.http_status
          delay: '0'
          history: 7d
          description: 'HTTP status returned by the VMREST version endpoint. The expected successful value is 200.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.http_status
          master_item:
            key: cuc.api.health.raw
          tags:
            - tag: component
              value: api
            - tag: scope
              value: operator
        - uuid: 9a3a3c96c313474baebc7953acad89b8
          name: 'CUC: phone-system PerfMon collection health'
          type: DEPENDENT
          key: cuc.api.phone_system.health
          delay: '0'
          history: 7d
          description: 'Health of the Unity phone-system PerfMon collector. Collection OK means the expected CUC Phone System counters were returned without a SOAP fault.'
          valuemap:
            name: 'CUC collection health'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'if(value.indexOf("CUC Phone System")<0||value.indexOf("Fault")>=0)throw "invalid phone-system response";return 1;'
          master_item:
            key: cuc.perfmon.phone_system.raw
          tags:
            - tag: component
              value: api
            - tag: scope
              value: operator
          triggers:
            - uuid: 1b46f0e37178466b88ff0a42776326da
              expression: 'nodata(/Cisco Unity Connection 15 by API/cuc.api.phone_system.health,10m)=1'
              name: 'CUC phone-system PerfMon API has no successful data for 10 minutes'
              priority: HIGH
              description: 'No valid API collection arrived within the stated period. Verify credentials, required services, endpoint reachability, and certificate settings.'
              tags:
                - tag: component
                  value: api
        - uuid: f8360e02cf9c4a2a81c9fa537847934f
          name: 'CUC: API response time'
          type: DEPENDENT
          key: cuc.api.response_time
          delay: '0'
          history: 7d
          units: ms
          description: 'End-to-end response time of the VMREST health request, measured by the Zabbix server or proxy.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.response_time_ms
          master_item:
            key: cuc.api.health.raw
          tags:
            - tag: component
              value: api
            - tag: scope
              value: operator
        - uuid: 88062949d1a04564a8bcfe4a7897cba3
