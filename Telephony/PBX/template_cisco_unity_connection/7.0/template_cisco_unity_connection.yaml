        - uuid: 1111110a68554091afb3f5705e8f5f2c
          name: 'CUC internal: PerfMon CPU session raw/master'
          type: SCRIPT
          key: cuc.perfmon.cpu.master
          delay: '{$CUC.PERFMON.INTERVAL}'
          history: '0'
          value_type: TEXT
          trends: '0'
          params: |
            var p = JSON.parse(value),
                url = p.url,
                handle = null,
                closed = false,
                result = {ok: false, session_closed: false};
            
            function call(operation, payload) {
                var request = new HttpRequest(), response,
                    body = '<s:Envelope xmlns:s="http://schemas.xmlsoap.org/soap/envelope/" xmlns:n="http://schemas.cisco.com/ast/soap"><s:Body><n:' +
                        operation + '>' + payload + '</n:' + operation + '></s:Body></s:Envelope>';
                request.addHeader('Content-Type: text/xml');
                request.addHeader('SOAPAction: ""');
                request.addHeader('Authorization: Basic ' + btoa(p.username + ':' + p.password));
                response = request.post(url, body);
                if (request.getStatus() !== 200 || response.indexOf('Fault') >= 0) {
                    throw operation + ' failed';
                }
                return response;
            }
            
            function tag(xml, name) {
                var match = new RegExp('<[^>]*' + name + '>\\s*([^<]+)').exec(xml);
                if (!match) throw 'missing ' + name;
                return match[1];
            }
            
            try {
                handle = tag(call('perfmonOpenSession', ''), 'perfmonOpenSessionReturn');
                var counter = '\\\\' + p.node + '\\Processor(_Total)\\% CPU Time';
                call('perfmonAddCounter', '<n:SessionHandle>' + handle + '</n:SessionHandle><n:ArrayOfCounter><n:Counter><n:Name>' + counter + '</n:Name></n:Counter></n:ArrayOfCounter>');
                call('perfmonCollectSessionData', '<n:SessionHandle>' + handle + '</n:SessionHandle>');
                Zabbix.sleep(15000);
                var sample = call('perfmonCollectSessionData', '<n:SessionHandle>' + handle + '</n:SessionHandle>'),
                    cpu = Number(tag(sample, 'Value')),
                    status = Number(tag(sample, 'CStatus'));
                if (status !== 0 || !isFinite(cpu) || !String(tag(sample, 'Value')).trim() || cpu < 0 || cpu > 100) throw 'invalid CPU sample';
                result = {ok: true, cpu: cpu, cstatus: status, sample_seconds: 15, session_closed: false};
            }
            catch (error) {
                result = {ok: false, error: String(error), session_closed: false};
            }
            finally {
                if (handle !== null) {
                    try {
                        call('perfmonCloseSession', '<n:SessionHandle>' + handle + '</n:SessionHandle>');
                        closed = true;
                    }
                    catch (ignore) {
                        closed = false;
                    }
                }
                result.session_closed = closed;
            }
            return JSON.stringify(result);
          description: 'Internal transport/master item. Raw API payload for dependent operator items: CPU utilization and CPU collection health. Filter scope=internal; do not use this raw value for incident interpretation.'
          timeout: 45s
          parameters:
            - name: node
              value: '{$CUC.NODE}'
            - name: password
              value: '{$CUC.API.PASSWORD}'
            - name: url
              value: '{$CUC.SERVICEABILITY.URL}/perfmonservice2/services/PerfmonService'
            - name: username
              value: '{$CUC.API.USER}'
          tags:
            - tag: component
              value: raw
            - tag: scope
              value: internal
        - uuid: 565fce4feb024ce1b66fdee932b58265
