        - uuid: 5b02ba522e9f4a09b32956ee05a4612a
          name: 'CUC internal: VMREST inventory raw/master'
          type: SCRIPT
          key: cuc.vmrest.inventory.raw
          delay: '{$CUC.INVENTORY.INTERVAL}'
          history: '0'
          value_type: TEXT
          trends: '0'
          params: |
            var p = JSON.parse(value), started = Date.now(), result = {
                available: 0,
                version: '',
                users: -1,
                ports: -1,
                port_groups: -1,
                phone_systems: -1,
                nodes: -1,
                response_time_ms: 0,
                error: ''
            };
            
            function request(path) {
                var q = new HttpRequest(), body, status;
                q.setHttpAuth(HTTPAUTH_BASIC, p.username, p.password);
                q.addHeader('Accept: application/json, application/xml;q=0.9, text/xml;q=0.8');
                    q.addHeader('Content-Type: application/xml');
                body = q.get(p.url + path);
                status = q.getStatus();
                if (status < 200 || status >= 300) {
                    throw path + ' returned HTTP ' + status;
                }
                return body;
            }
            
            function total(body) {
                var data, keys, i, match;
                try {
                    data = JSON.parse(body);
                    keys = Object.keys(data);
                    for (i = 0; i < keys.length; i++) {
                        if (/^(@?total|totalRows)$/i.test(keys[i])) {
                            return Number(data[keys[i]]);
                        }
                        if (data[keys[i]] && typeof data[keys[i]] === 'object') {
                            match = JSON.stringify(data[keys[i]]).match(/\"(?:@?total|totalRows)\"\s*:\s*\"?(\d+)/i);
                            if (match) return Number(match[1]);
                        }
                    }
                }
                catch (ignore) {}
                match = body.match(/\btotal=[\"'](\d+)[\"']/i);
                if (!match) throw 'total attribute missing';
                return Number(match[1]);
            }
            
            function version(body) {
                var data, match;
                try {
                    data = JSON.parse(body);
                    match = JSON.stringify(data).match(/\"(?:version|Version)\"\s*:\s*\"([^\"]+)/);
                    if (match) return match[1];
                }
                catch (ignore) {}
                match = body.match(/<(?:Version|version)>\s*([^<]+)/);
                return match ? match[1] : body.replace(/^\s+|\s+$/g, '').slice(0, 128);
            }
            
            try {
                result.version = version(request('/vmrest/version'));
                result.users = total(request('/vmrest/users?rowsPerPage=1'));
                result.ports = total(request('/vmrest/ports?rowsPerPage=1'));
                result.port_groups = total(request('/vmrest/portgroups?rowsPerPage=1'));
                result.phone_systems = total(request('/vmrest/phonesystems?rowsPerPage=1'));
                result.nodes = total(request('/vmrest/vmsservers?rowsPerPage=1'));
                result.available = 1;
            }
            catch (e) {
                throw 'CUC VMREST inventory collection failed';
            }
            result.response_time_ms = Date.now() - started;
            return JSON.stringify(result);
          description: 'Internal transport/master item. Raw API payload for dependent operator items: software version and configuration inventory counts. Filter scope=internal; do not use this raw value for incident interpretation.'
          timeout: '{$CUC.INVENTORY.TIMEOUT}'
          parameters:
            - name: password
              value: '{$CUC.API.PASSWORD}'
            - name: url
              value: '{$CUC.URL}'
            - name: username
              value: '{$CUC.API.USER}'
          tags:
            - tag: component
              value: raw
            - tag: scope
              value: internal
