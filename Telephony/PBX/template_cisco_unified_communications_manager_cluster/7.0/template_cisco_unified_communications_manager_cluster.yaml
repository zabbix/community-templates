zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: c374798c0cb7497f82bfb1863fcdeb3e
      name: Templates/Telephony
  templates:
    - uuid: c1a0ac6a26694668951da78e5bbe1168
      template: 'Cisco Unified Communications Manager 15 cluster by API'
      name: 'Cisco Unified Communications Manager 15 cluster by API'
      description: 'Optional agentless cluster-impact monitoring for one CUCM 15 cluster. Link once to a virtual Zabbix cluster host, not to a CUCM node. Host setup: set {$CUCM.AXL.URL} to the Publisher endpoint, {$CUCM.API.USER}, {$CUCM.API.PASSWORD}, and {$CUCM.CLUSTER.SOURCE.HOSTGROUP} (only enabled Publisher/Subscriber core-template hosts); {$CUCM.HTTP.PROXY} and {$CUCM.CLUSTER.NODE.URLS} are optional. It requires Cisco Unified Communications Manager 15 by API 7.0-12 or later on every source host: each source host technical name must equal its exact AXL process-node identity. A read-only Publisher AXL collector lists process nodes, CallManager Groups, and Device Pools, then reads each bounded group to obtain member order; each discovered node receives a bounded direct ControlCenter Cisco CallManager state check. Existing core-template RegisteredHardwarePhones values are aggregated by Zabbix, so this template does not call RISPort70 or listPhone and does not discover individual phones. It deliberately does not collect or write CUCM software versions or host inventory. Contextual {$CUCM.CLUSTER.NODE.EXPECTED:"{#NODE}"} and {$CUCM.CLUSTER.CMG.EXPECTED:"{#CMGROUP}"} opt in to node and CallManager Group alerts. Maintainer: DevYves89. Operations dashboard reuses core CallManager, media and infrastructure counters. Set {$CUCM.CLUSTER.TRUNK.SOURCE.HOST} to one healthy core host. Calls are summed node activity, not deduplicated conversations. No SIP/SCCP phone split or new Cisco polling.'
      vendor:
        name: Zabbix
        version: 7.0-12
      groups:
        - name: Templates/Telephony
      items:
        - uuid: da319ba4a83a4d0c8490659a35f9d2db
          name: 'CUCM internal: cluster topology raw/master'
          type: SCRIPT
          key: cucm.cluster.topology.raw
          delay: '{$CUCM.CLUSTER.TOPOLOGY.INTERVAL}'
          history: '1d'
          value_type: TEXT
          trends: '0'
          params: |
            var p=JSON.parse(value);
            function post(body,action){
                var q=new HttpRequest(),r,s;
                q.setHttpAuth(HTTPAUTH_BASIC,p.username,p.password);
                if(p.proxy)q.setProxy(p.proxy);
                q.addHeader('Content-Type: text/xml; charset=utf-8');
                q.addHeader('SOAPAction: '+action);
                r=q.post(p.axl_url+'/axl/',body);s=q.getStatus();
                if(s<200||s>=300)throw 'AXL returned HTTP '+s;
                if(/<(?:[^:>]+:)?Fault\b/i.test(r))throw 'AXL SOAP fault';
                return r;
            }
            function envelope(operation,content){
                return '<s:Envelope xmlns:s="http://schemas.xmlsoap.org/soap/envelope/" xmlns:a="http://www.cisco.com/AXL/API/'+p.version+'"><s:Body><a:'+operation+'>'+content+'</a:'+operation+'></s:Body></s:Envelope>';
            }
            function xmlText(value){
                return value.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');
            }
            function field(body,name){
                var x=new RegExp('<(?:[^:>]+:)?'+name+'(?:\\s[^>]*)?>\\s*([^<]*)\\s*</(?:[^:>]+:)?'+name+'>','i').exec(body);
                return x?x[1].trim():'';
            }
            function blocks(xml,name){
                var r=new RegExp('<(?:[^:>]+:)?'+name+'\\b[^>]*>([\\s\\S]*?)</(?:[^:>]+:)?'+name+'>','gi'),a=[],m;
                while((m=r.exec(xml))!==null)a.push(m[1]);
                return a;
            }
            function label(value,kind){
                value=(value||'').trim();
                if(!value||value.length>255||/[\x00-\x1f{}"]/.test(value))throw 'invalid '+kind;
                return value;
            }
            function nodeName(value){
                value=label(value,'node identity');
                if(!/^[A-Za-z0-9_.:-]+$/.test(value))throw 'invalid node identity';
                return value;
            }
            function nodeAlias(value){
                return nodeName(value).toLowerCase().replace(/\.$/,'').split('.')[0];
            }
            function memberNodeAliases(value){
                /* CUCM can store a CallManager service identity as CM_<node-short-name>. */
                var primary=nodeAlias(value),aliases=[primary],match=/^cm_([a-z0-9_.:-]+)$/i.exec(primary);
                if(match)aliases.push(match[1]);
                return aliases;
            }
            function nodeUrl(value,kind){
                value=label(value,kind);
                if(!/^https:\/\/[A-Za-z0-9.:[\]-]+(?::\d{1,5})?$/i.test(value))throw 'invalid '+kind;
                return value.replace(/\/$/,'');
            }
            function endpointKey(value){
                /* HTTPS without a port and HTTPS on 8443 address the same CUCM API endpoint. */
                return nodeUrl(value,'node ControlCenter URL').toLowerCase().replace(/:8443$/,'');
            }
            function nodeUrlMappings(value){
                var parsed,seen={};
                try{parsed=JSON.parse(value||'{}');}catch(error){throw 'invalid node URL mapping JSON';}
                if(!parsed||Array.isArray(parsed)||typeof parsed!=='object')throw 'invalid node URL mapping';
                Object.keys(parsed).forEach(function(name){
                    var endpoint;
                    nodeName(name);parsed[name]=nodeUrl(String(parsed[name]),'node URL mapping');endpoint=endpointKey(parsed[name]);
                    if(seen[endpoint])throw 'multiple node URL mappings target the same ControlCenter endpoint';
                    seen[endpoint]=name;
                });
                return parsed;
            }
            function cap(value,kind){
                value=String(value===undefined?'':value).trim();
                if(!/^\d+$/.test(value))throw 'invalid '+kind;
                value=Number(value);
                if(!isFinite(value)||Math.floor(value)!==value||value<1||value>12)throw 'invalid '+kind;
                return value;
            }
            function resolveMember(value,nodes){
                value=nodeName(value);
                if(nodes[value])return value;
                var exact=[],aliases=[],canonical=value.toLowerCase().replace(/\.$/,''),requestedAliases=memberNodeAliases(value);
                Object.keys(nodes).forEach(function(name){
                    var normalized=name.toLowerCase().replace(/\.$/,'');
                    if(normalized===canonical)exact.push(name);
                    if(requestedAliases.indexOf(nodeAlias(name))!==-1)aliases.push(name);
                });
                if(exact.length===1)return exact[0];
                if(exact.length>1)throw 'ambiguous case-insensitive process node identity';
                if(aliases.length===1)return aliases[0];
                if(aliases.length>1)throw 'ambiguous short-name process node identity';
                /* Safe diagnostic context: identities only, never request credentials or XML. */
                throw 'CallManager Group member cannot be resolved to a process node: member='+value+'; process_nodes='+Object.keys(nodes).sort().join(',')+'; member_aliases='+requestedAliases.join(',');
            }
            function positive(value,kind){
                if(!/^\d+$/.test(value))throw 'invalid '+kind;
                value=Number(value);
                if(!isFinite(value)||Math.floor(value)!==value||value<0||value>3)throw 'invalid '+kind;
                return value;
            }
            var processXml=post(envelope('listProcessNode','<searchCriteria><name>%</name></searchCriteria><returnedTags><name></name><nodeUsage></nodeUsage><processNodeRole></processNodeRole></returnedTags>'),'"CUCM:DB ver='+p.version+' listProcessNode"');
            var groupXml=post(envelope('listCallManagerGroup','<searchCriteria><name>%</name></searchCriteria><returnedTags><name></name></returnedTags>'),'"CUCM:DB ver='+p.version+' listCallManagerGroup"');
            var poolXml=post(envelope('listDevicePool','<searchCriteria><name>%</name></searchCriteria><returnedTags><name></name><callManagerGroupName></callManagerGroupName></returnedTags>'),'"CUCM:DB ver='+p.version+' listDevicePool"');
            if(!/listProcessNodeResponse/i.test(processXml)||!/listCallManagerGroupResponse/i.test(groupXml)||!/listDevicePoolResponse/i.test(poolXml))throw 'invalid AXL topology response';
            var nodes={},nodeBlocks=blocks(processXml,'processNode'),configuredNodeUrls=nodeUrlMappings(p.node_urls),maxNodes=cap(p.max_nodes,'process-node cap'),maxGroups=cap(p.max_cmgroups,'CallManager Group cap');
            if(!nodeBlocks.length)throw 'AXL returned no process nodes';
            for(var i=0;i<nodeBlocks.length;i++){
                var name=nodeName(field(nodeBlocks[i],'name'));
                if(nodes[name])throw 'duplicate AXL process-node identity';
                nodes[name]={name:name,usage:label(field(nodeBlocks[i],'nodeUsage')||'Not reported','node usage'),role:label(field(nodeBlocks[i],'processNodeRole')||'Not reported','node role'),url:nodeUrl(configuredNodeUrls[name]||('https://'+name+':8443'),'node ControlCenter URL'),cmgroups:[],devicepools:[]};
            }
            Object.keys(configuredNodeUrls).forEach(function(name){if(!nodes[name])throw 'node URL mapping references an unresolved process node';});
            var endpoints={};Object.keys(nodes).forEach(function(name){var endpoint=endpointKey(nodes[name].url);if(endpoints[endpoint])throw 'multiple process nodes target the same ControlCenter endpoint';endpoints[endpoint]=name;});
            if(Object.keys(nodes).length>maxNodes)throw 'discovered CUCM node count exceeds configured cap';
            var groups={},groupBlocks=blocks(groupXml,'callManagerGroup');
            if(!groupBlocks.length)throw 'AXL returned no CallManager Groups';
            for(i=0;i<groupBlocks.length;i++){
                var groupName=label(field(groupBlocks[i],'name'),'CallManager Group name');
                if(groups[groupName])throw 'duplicate AXL CallManager Group identity';
                groups[groupName]={name:groupName,members:[]};
            }
            if(Object.keys(groups).length>maxGroups)throw 'discovered CallManager Group count exceeds configured cap';
            Object.keys(groups).sort().forEach(function(groupName){
                var groupDetailXml=post(envelope('getCallManagerGroup','<name>'+xmlText(groupName)+'</name>'),'"CUCM:DB ver='+p.version+' getCallManagerGroup"');
                if(!/getCallManagerGroupResponse/i.test(groupDetailXml))throw 'invalid AXL CallManager Group detail response';
                var detailBlocks=blocks(groupDetailXml,'callManagerGroup');
                if(detailBlocks.length!==1)throw 'invalid AXL CallManager Group detail cardinality';
                if(label(field(detailBlocks[0],'name'),'CallManager Group detail name')!==groupName)throw 'CallManager Group detail identity mismatch';
                var members=[],memberBlocks=blocks(detailBlocks[0],'member'),priorities={};
                if(!memberBlocks.length)throw 'CallManager Group has no members';
                for(var j=0;j<memberBlocks.length;j++){
                    var rawMember=field(memberBlocks[j],'callManagerName')||field(memberBlocks[j],'processNodeName');
                    var member=resolveMember(rawMember,nodes);
                    var priority=positive(field(memberBlocks[j],'priority'),'CallManager Group member priority');
                    if(!nodes[member])throw 'CallManager Group member cannot be resolved to a process node';
                    if(priorities[priority])throw 'duplicate CallManager Group member priority';
                    /* Preserve the bounded raw AXL identity for one-day internal auditability. */
                    priorities[priority]=1;members.push({name:member,priority:priority,raw_name:rawMember});
                }
                members.sort(function(a,b){return a.priority-b.priority;});
                for(j=0;j<members.length;j++)nodes[members[j].name].cmgroups.push(groupName);
                groups[groupName]={name:groupName,members:members};
            });
            var pools={},poolBlocks=blocks(poolXml,'devicePool');
            for(i=0;i<poolBlocks.length;i++){
                var poolName=label(field(poolBlocks[i],'name'),'Device Pool name');
                var poolGroup=label(field(poolBlocks[i],'callManagerGroupName'),'Device Pool CallManager Group');
                if(pools[poolName])throw 'duplicate AXL Device Pool identity';
                if(!groups[poolGroup])throw 'Device Pool references an unresolved CallManager Group';
                pools[poolName]={name:poolName,cmgroup:poolGroup};
            }
            Object.keys(pools).forEach(function(pool){
                var group=groups[pools[pool].cmgroup];
                group.members.forEach(function(member){nodes[member.name].devicepools.push(pool);});
            });
            var resultNodes=[];
            Object.keys(nodes).sort().forEach(function(name){
                var node=nodes[name];
                if(!node.cmgroups.length)return;
                node.cmgroups.sort();node.devicepools.sort();resultNodes.push(node);
            });
            if(!resultNodes.length)throw 'no process nodes belong to a CallManager Group';
            var resultGroups=[];Object.keys(groups).sort().forEach(function(name){resultGroups.push(groups[name]);});
            var resultPools=[];Object.keys(pools).sort().forEach(function(name){resultPools.push(pools[name]);});
            return JSON.stringify({schema:1,nodes:resultNodes,cmgroups:resultGroups,devicepools:resultPools});
          description: 'Internal fail-closed Publisher AXL topology collector. It lists process nodes, CallManager Groups, and Device Pools, then reads each bounded CallManager Group detail to obtain ordered members. Malformed, duplicate, unresolved, inconsistent, or over-cap data is rejected before any topology value is published.'
          timeout: '45s'
          parameters:
            - name: axl_url
              value: '{$CUCM.AXL.URL}'
            - name: max_cmgroups
              value: '{$CUCM.CLUSTER.MAX.CMGROUPS}'
            - name: max_nodes
              value: '{$CUCM.CLUSTER.MAX.NODES}'
            - name: node_urls
              value: '{$CUCM.CLUSTER.NODE.URLS}'
            - name: password
              value: '{$CUCM.API.PASSWORD}'
            - name: proxy
              value: '{$CUCM.HTTP.PROXY}'
            - name: username
              value: '{$CUCM.API.USER}'
            - name: version
              value: '{$CUCM.API.VERSION}'
          tags:
            - tag: component
              value: topology
            - tag: entity
              value: cluster
            - tag: scope
              value: internal
            - tag: source
              value: axl
        - uuid: 3764c6e2cd924d6896846e4d725bb5c7
          name: 'CUCM cluster: topology health'
          type: DEPENDENT
          key: cucm.cluster.topology.health
          delay: '0'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'var p=JSON.parse(value);if(p.schema!==1||!Array.isArray(p.nodes)||!Array.isArray(p.cmgroups)||!Array.isArray(p.devicepools))throw ''invalid cluster topology payload'';return 1;'
          master_item:
            key: cucm.cluster.topology.raw
          tags:
            - tag: component
              value: topology
            - tag: entity
              value: cluster
            - tag: scope
              value: operator
            - tag: source
              value: axl
          valuemap:
            name: 'CUCM cluster collection health'
          value_type: UNSIGNED
          description: 'Successful fully normalized AXL topology collection. Transport or validation failure intentionally leaves no new value.'
          history: '90d'
          triggers:
            - uuid: d78bb9dc9cf24a50809e680529e83818
              expression: 'nodata(/Cisco Unified Communications Manager 15 cluster by API/cucm.cluster.topology.health,{$CUCM.CLUSTER.TOPOLOGY.NODATA})=1 and count(/Cisco Unified Communications Manager 15 cluster by API/cucm.cluster.topology.health,90d)>0'
              recovery_mode: RECOVERY_EXPRESSION
              manual_close: 'YES'
              recovery_expression: 'nodata(/Cisco Unified Communications Manager 15 cluster by API/cucm.cluster.topology.health,{$CUCM.CLUSTER.TOPOLOGY.NODATA})=0'
              name: 'CUCM cluster topology has no valid refresh for {$CUCM.CLUSTER.TOPOLOGY.NODATA}'
              opdata: 'No successful topology snapshot for {$CUCM.CLUSTER.TOPOLOGY.NODATA}'
              priority: HIGH
              description: 'Previously successful topology collection has stopped refreshing for three default collection intervals. A success must exist in the retained 90-day history to open this problem. Once open, it recovers only after a valid refresh, never merely because old history expires.'
              tags:
                - tag: component
                  value: topology
                - tag: entity
                  value: cluster
            - uuid: 9db1b9679ea14d91956ed7d3cb683406
              expression: 'nodata(/Cisco Unified Communications Manager 15 cluster by API/cucm.cluster.topology.health,{$CUCM.CLUSTER.TOPOLOGY.NODATA})=1 and count(/Cisco Unified Communications Manager 15 cluster by API/cucm.cluster.topology.health,90d)=0'
              name: 'CUCM cluster topology is awaiting its first valid snapshot'
              priority: INFO
              opdata: 'No retained successful topology snapshot; check Publisher AXL URL, credentials and node mappings'
              description: 'Informational setup alert after the configured no-data window (default 3h), while no valid topology is recorded. Recovers on the first valid snapshot. Clearing history resets initialization evidence. An existing refresh-failure HIGH takes precedence, including after history expiry.'
              dependencies:
                - name: 'CUCM cluster topology has no valid refresh for {$CUCM.CLUSTER.TOPOLOGY.NODATA}'
                  expression: 'nodata(/Cisco Unified Communications Manager 15 cluster by API/cucm.cluster.topology.health,{$CUCM.CLUSTER.TOPOLOGY.NODATA})=1 and count(/Cisco Unified Communications Manager 15 cluster by API/cucm.cluster.topology.health,90d)>0'
                  recovery_expression: 'nodata(/Cisco Unified Communications Manager 15 cluster by API/cucm.cluster.topology.health,{$CUCM.CLUSTER.TOPOLOGY.NODATA})=0'
              tags:
                - tag: component
                  value: topology
                - tag: entity
                  value: cluster
        - uuid: fec4b5e4213341848fc1f56ba652d405
          name: 'CUCM cluster: discovered nodes'
          type: DEPENDENT
          key: cucm.cluster.topology.nodes
          delay: '0'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'var p=JSON.parse(value);if(p.schema!==1||!Array.isArray(p.nodes)||!p.nodes.length)throw ''invalid topology nodes'';return p.nodes.length;'
          master_item:
            key: cucm.cluster.topology.raw
          tags:
            - tag: component
              value: topology
            - tag: entity
              value: cluster
            - tag: scope
              value: operator
            - tag: source
              value: axl
          value_type: UNSIGNED
          description: 'Process nodes that are valid members of at least one CallManager Group.'
        - uuid: c170fd9e9ec2427d8b7d7f4d90407f9f
          name: 'CUCM cluster: CallManager Groups'
          type: DEPENDENT
          key: cucm.cluster.topology.cmgroups
          delay: '0'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'var p=JSON.parse(value);if(p.schema!==1||!Array.isArray(p.cmgroups)||!p.cmgroups.length)throw ''invalid topology CallManager Groups'';return p.cmgroups.length;'
          master_item:
            key: cucm.cluster.topology.raw
          tags:
            - tag: component
              value: topology
            - tag: entity
              value: cluster
            - tag: scope
              value: operator
            - tag: source
              value: axl
          value_type: UNSIGNED
          description: 'AXL-discovered CallManager Group count.'
        - uuid: 32e121a41e7244829f9be3867cc75f54
          name: 'CUCM cluster: Device Pools'
          type: DEPENDENT
          key: cucm.cluster.topology.devicepools
          delay: '0'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'var p=JSON.parse(value);if(p.schema!==1||!Array.isArray(p.devicepools))throw ''invalid topology Device Pools'';return p.devicepools.length;'
          master_item:
            key: cucm.cluster.topology.raw
          tags:
            - tag: component
              value: topology
            - tag: entity
              value: cluster
            - tag: scope
              value: operator
            - tag: source
              value: axl
          value_type: UNSIGNED
          description: 'AXL-discovered Device Pool count with a resolved CallManager Group.'
        - uuid: 9dd87cd527124cf5be7c62ce178263ee
          name: 'CUCM cluster: core-template source nodes'
          type: CALCULATED
          key: cucm.cluster.sources.total
          delay: '5m'
          params: 'count(exists_foreach(/*/cucm.callmanager.registered.hardware?[group="{$CUCM.CLUSTER.SOURCE.HOSTGROUP}"]))'
          tags:
            - tag: component
              value: cluster
            - tag: entity
              value: cluster
            - tag: scope
              value: operator
            - tag: source
              value: zabbix
          value_type: UNSIGNED
          description: 'Enabled CUCM-core RegisteredHardwarePhones items selected by the configured source host group. This includes configured source items even before their first successful value.'
        - uuid: bdef2d30165543af9dd93b713e4cc906
          name: 'CUCM cluster: fresh core-template source nodes'
          type: CALCULATED
          key: cucm.cluster.sources.fresh
          delay: '5m'
          params: 'count(last_foreach(/*/cucm.callmanager.registered.hardware?[group="{$CUCM.CLUSTER.SOURCE.HOSTGROUP}"],{$CUCM.CLUSTER.SOURCE.FRESHNESS}))'
          tags:
            - tag: component
              value: cluster
            - tag: entity
              value: cluster
            - tag: scope
              value: operator
            - tag: source
              value: zabbix
          value_type: UNSIGNED
          description: 'Source nodes with a supported RegisteredHardwarePhones value no older than the configured freshness interval.'
        - uuid: 2083c0c027e34587b67667a4a6ec3abf
          name: 'CUCM cluster: core-template source completeness'
          type: CALCULATED
          key: cucm.cluster.sources.complete
          delay: '5m'
          params: 'last(//cucm.cluster.sources.total)>0 and last(//cucm.cluster.sources.total)=last(//cucm.cluster.topology.nodes) and last(//cucm.cluster.sources.fresh)=last(//cucm.cluster.topology.nodes) and count(last_foreach(//cucm.cluster.source.node.complete[*],{$CUCM.CLUSTER.SOURCE.FRESHNESS}))=last(//cucm.cluster.topology.nodes) and min(last_foreach(//cucm.cluster.source.node.complete[*],{$CUCM.CLUSTER.SOURCE.FRESHNESS}))=1 and max(last_foreach(//cucm.cluster.source.node.complete[*],{$CUCM.CLUSTER.SOURCE.FRESHNESS}))=1'
          tags:
            - tag: component
              value: cluster
            - tag: entity
              value: cluster
            - tag: scope
              value: operator
            - tag: source
              value: zabbix
          valuemap:
            name: 'CUCM cluster source completeness'
          value_type: UNSIGNED
          description: '1 only when the configured source host group has the same cardinality as the discovered topology, all group sources are fresh, and every discovered process node has exactly one fresh core-template value selected by its exact node:{HOST.HOST} tag. Registration impact therefore never aggregates arbitrary, missing, or ambiguous host-group members.'
          triggers:
            - uuid: 737afb6506ea425db0f349fe06b883c1
              expression: 'nodata(/Cisco Unified Communications Manager 15 cluster by API/cucm.cluster.sources.complete,10m)=1 or (count(/Cisco Unified Communications Manager 15 cluster by API/cucm.cluster.sources.complete,10m)>=3 and max(/Cisco Unified Communications Manager 15 cluster by API/cucm.cluster.sources.complete,10m)=0)'
              name: 'CUCM cluster core-template inputs are incomplete or stale'
              opdata: 'Topology nodes:{?last(//cucm.cluster.topology.nodes)}; Sources:{?last(//cucm.cluster.sources.total)}; Fresh:{?last(//cucm.cluster.sources.fresh)}; Core sources ready:{ITEM.LASTVALUE1}'
              priority: HIGH
              description: 'For ten minutes, the configured core source group has been absent, stale, cardinality-mismatched, or unsupported, or an exact discovered-node source is unavailable. Topology collection has its own explicit health alert and independently gates registration-impact alerts.'
              tags:
                - tag: component
                  value: cluster
                - tag: entity
                  value: cluster
        - uuid: 5309118e49e442998fccb45b6526a95d
          name: 'CUCM cluster: registered hardware phones'
          type: CALCULATED
          key: cucm.cluster.registration.total
          delay: '5m'
          params: 'sum(last_foreach(/*/cucm.cluster.source.hardware[*]?[group="{$CUCM.CLUSTER.SOURCE.HOSTGROUP}"],{$CUCM.CLUSTER.SOURCE.FRESHNESS}))/(last(//cucm.cluster.topology.nodes)>0 and count(exists_foreach(/*/cucm.callmanager.registered.hardware?[group="{$CUCM.CLUSTER.SOURCE.HOSTGROUP}"]))=last(//cucm.cluster.topology.nodes) and count(last_foreach(/*/cucm.cluster.source.hardware[*]?[group="{$CUCM.CLUSTER.SOURCE.HOSTGROUP}"],{$CUCM.CLUSTER.SOURCE.FRESHNESS}))=last(//cucm.cluster.topology.nodes) and count(last_foreach(//cucm.cluster.ops.node.hardware[*],{$CUCM.CLUSTER.SOURCE.FRESHNESS}))=last(//cucm.cluster.topology.nodes) and count(last_foreach(//cucm.cluster.ops.node.hardware.ready[*],{$CUCM.CLUSTER.SOURCE.FRESHNESS}))=last(//cucm.cluster.topology.nodes) and min(last_foreach(//cucm.cluster.ops.node.hardware.ready[*],{$CUCM.CLUSTER.SOURCE.FRESHNESS}))=1)'
          tags:
            - tag: component
              value: registration
            - tag: entity
              value: cluster
            - tag: scope
              value: operator
            - tag: source
              value: zabbix
          value_type: UNSIGNED
          description: 'Complete, fresh hardware-phone sum. The original core sources are rechecked at evaluation time; incomplete samples are not stored.'
        - uuid: ad5521a7ccc44d27867b291a60cb7ec9
          name: 'CUCM cluster: registered-phone seven-day baseline'
          type: CALCULATED
          key: cucm.cluster.registration.baseline
          delay: '5m'
          params: 'avg(//cucm.cluster.registration.validated,{$CUCM.CLUSTER.PHONE.BASELINE.WINDOW})'
          tags:
            - tag: component
              value: registration
            - tag: entity
              value: cluster
            - tag: scope
              value: operator
            - tag: source
              value: zabbix
          description: 'Rolling mean of the cluster template''s own aggregate registration total. It is valid only after the configured minimum sample count.'
        - uuid: 5988c7419a954db797a69e03f7bf143f
          name: 'CUCM cluster: registration baseline ready'
          type: CALCULATED
          key: cucm.cluster.registration.baseline.ready
          delay: '5m'
          params: 'count(//cucm.cluster.registration.validated,{$CUCM.CLUSTER.PHONE.BASELINE.WINDOW})>={$CUCM.CLUSTER.PHONE.BASELINE.MIN.SAMPLES} and last(//cucm.cluster.registration.baseline)>0'
          tags:
            - tag: component
              value: registration
            - tag: entity
              value: cluster
            - tag: scope
              value: operator
            - tag: source
              value: zabbix
          valuemap:
            name: 'CUCM cluster baseline readiness'
          value_type: UNSIGNED
          description: 'Prevents registration-impact alerting until enough aggregate samples and a non-zero seven-day baseline exist.'
        - uuid: 71eee756b3ab40a5a262c820e14d761f
          name: 'CUCM cluster: registered-phone baseline percentage'
          type: CALCULATED
          key: cucm.cluster.registration.baseline.pct
          delay: '5m'
          params: '100*last(//cucm.cluster.registration.total)/max(last(//cucm.cluster.registration.baseline),1)'
          tags:
            - tag: component
              value: registration
            - tag: entity
              value: cluster
            - tag: scope
              value: operator
            - tag: source
              value: zabbix
          units: '%'
          description: 'Current aggregate registration divided by the rolling baseline. Interpret only when registration baseline ready is Yes; impact triggers are explicitly gated on that item.'
          triggers:
            - uuid: 2c4b587107e24f68a3918704920e66a2
              expression: 'nodata(/Cisco Unified Communications Manager 15 cluster by API/cucm.cluster.topology.health,{$CUCM.CLUSTER.TOPOLOGY.NODATA})=0 and last(/Cisco Unified Communications Manager 15 cluster by API/cucm.cluster.sources.complete)=1 and last(/Cisco Unified Communications Manager 15 cluster by API/cucm.cluster.registration.baseline.ready)=1 and count(/Cisco Unified Communications Manager 15 cluster by API/cucm.cluster.registration.baseline.pct,10m,"le",{$CUCM.CLUSTER.PHONE.DISASTER.PCT})>=3'
              name: 'CUCM cluster hardware-phone registration has severe impact'
              opdata: 'Registered:{?last(//cucm.cluster.registration.total)}; Baseline:{?last(//cucm.cluster.registration.baseline)}; Percent:{ITEM.LASTVALUE1}%; Sources:{?last(//cucm.cluster.sources.fresh)}/{?last(//cucm.cluster.sources.total)}'
              priority: DISASTER
              description: 'Fresh complete core sources and a current valid topology report registration at or below the configured Disaster baseline percentage for three five-minute samples. This is confirmed cluster-wide registration impact, not a claim about an individual Device Pool.'
              tags:
                - tag: component
                  value: registration
                - tag: entity
                  value: cluster
            - uuid: 968e8ce1c43d4b14addca1b9648eb8fa
              expression: 'nodata(/Cisco Unified Communications Manager 15 cluster by API/cucm.cluster.topology.health,{$CUCM.CLUSTER.TOPOLOGY.NODATA})=0 and last(/Cisco Unified Communications Manager 15 cluster by API/cucm.cluster.sources.complete)=1 and last(/Cisco Unified Communications Manager 15 cluster by API/cucm.cluster.registration.baseline.ready)=1 and count(/Cisco Unified Communications Manager 15 cluster by API/cucm.cluster.registration.baseline.pct,10m,"gt",{$CUCM.CLUSTER.PHONE.DISASTER.PCT})>=3 and count(/Cisco Unified Communications Manager 15 cluster by API/cucm.cluster.registration.baseline.pct,10m,"le",{$CUCM.CLUSTER.PHONE.HIGH.PCT})>=3'
              name: 'CUCM cluster hardware-phone registration is materially reduced'
              opdata: 'Registered:{?last(//cucm.cluster.registration.total)}; Baseline:{?last(//cucm.cluster.registration.baseline)}; Percent:{ITEM.LASTVALUE1}%; Sources:{?last(//cucm.cluster.sources.fresh)}/{?last(//cucm.cluster.sources.total)}'
              priority: HIGH
              description: 'Fresh complete core sources and a current valid topology report registration above Disaster but at or below High baseline percentage for three five-minute samples. The lower boundary is exclusive and the upper boundary inclusive.'
              tags:
                - tag: component
                  value: registration
                - tag: entity
                  value: cluster
