      discovery_rules:
        - uuid: ccd6de79cb324ac0ac82ec2e523022ba
          name: 'CUCM cluster node discovery'
          type: DEPENDENT
          key: cucm.cluster.node.discovery
          delay: '0'
          item_prototypes:
            - uuid: 01c42a44a70e46d0bfb2ebb3606210ca
              name: 'CUCM cluster node {#NODE}: CallManager state'
              type: HTTP_AGENT
              key: 'cucm.cluster.node.callmanager.state[{#NODE}]'
              delay: '{$CUCM.CLUSTER.NODE.RUNTIME.INTERVAL}'
              value_type: UNSIGNED
              description: 'Validated ControlCenter Cisco CallManager runtime state for this discovered topology node. The response body is discarded after preprocessing; a transport, SOAP fault, malformed payload, or unrecognized state produces no valid item value.'
              timeout: '30s'
              url: '{#NODE.URL}/controlcenterservice2/services/ControlCenterServices'
              posts: '<soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/" xmlns:ns="http://schemas.cisco.com/ast/soap"><soapenv:Body><ns:soapGetServiceStatus><ns:ServiceStatus>Cisco CallManager</ns:ServiceStatus></ns:soapGetServiceStatus></soapenv:Body></soapenv:Envelope>'
              authtype: BASIC
              username: '{$CUCM.API.USER}'
              password: '{$CUCM.API.PASSWORD}'
              http_proxy: '{$CUCM.HTTP.PROXY}'
              request_method: POST
              headers:
                - name: Content-Type
                  value: 'text/xml; charset=utf-8'
                - name: SOAPAction
                  value: '""'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - 'if(value.indexOf(''soapGetServiceStatusResponse'')<0||/<(?:[^:>]+:)?Fault\b/i.test(value))throw ''invalid ControlCenter response'';var r=/<(?:[^:>]+:)?item\b[^>]*>[\s\S]*?<(?:(?:[^:>]+):)?ServiceName>\s*Cisco CallManager\s*<\/[^>]*ServiceName>[\s\S]*?<(?:(?:[^:>]+):)?ServiceStatus>\s*([^<]+)\s*<\/[^>]*ServiceStatus>[\s\S]*?<\/[^>]*item>/i.exec(value);if(!r)throw ''Cisco CallManager state absent'';if(r[1]===''Started'')return 1;if(r[1]===''Stopped'')return 2;throw ''unrecognized Cisco CallManager state'';'
              valuemap:
                name: 'CUCM cluster CallManager state'
              tags:
                - tag: component
                  value: cluster
