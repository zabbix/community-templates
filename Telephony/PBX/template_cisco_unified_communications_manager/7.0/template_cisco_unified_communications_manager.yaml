zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 1d12408342854fd5a4436dd6d5d1bd4a
      name: Templates/Telephony
  templates:
    - uuid: 7e856e145c6c47b99b58445f00100002
      template: 'Cisco Unified Communications Manager 15 by API'
      name: 'Cisco Unified Communications Manager 15 by API'
      description: 'CUCM 15 monitoring through read-only AXL, RISPort70, PerfMon, ControlCenter, and Certificate Management APIs. Host setup: set {$CUCM.URL} (Serviceability), {$CUCM.AXL.URL} (Publisher configuration endpoint for every node host), {$CUCM.CERT.URL}, {$CUCM.NODE} (exact PerfMon node name), {$CUCM.FQDN}, {$CUCM.API.USER}, {$CUCM.API.PASSWORD}, {$CUCM.OS.USER}, and {$CUCM.OS.PASSWORD}; {$CUCM.HTTP.PROXY} is optional. The API user needs Standard CCM Server Monitoring plus a custom AXL read-only access control group containing Standard AXL API Users and Standard AXL Read Only API Access. The separate VOS certificate account needs certificate-API privilege 0 (read only). Contextual EXPECTED macros opt in to service, SIP-trunk, and replication alerts. RIS is runtime-only. Active and Inactive VOS partitions remain visible but are excluded from generic capacity alarms because their image occupancy is expected. Maintainer: DevYves89.'
      vendor:
        name: Zabbix
        version: 7.0-11
      groups:
        - name: Templates/Telephony
      items:
        - uuid: ab7896b632d941ecb43d6554919b24fc
          name: 'CUCM API: AXL health'
          type: DEPENDENT
          key: cucm.api.axl.health
          delay: '0'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'if(value.indexOf(''getCCMVersionResponse'')<0||value.indexOf(''Fault'')>=0)throw ''invalid API response'';return 1;'
          master_item:
            key: cucm.axl.version.raw
          tags:
            - tag: component
              value: api
            - tag: scope
              value: operator
            - tag: source
              value: axl
          triggers:
            - uuid: 75db172ae56d437da88df68d76dce3e1
              expression: 'nodata(/Cisco Unified Communications Manager 15 by API/cucm.api.axl.health,90m)=1'
              name: 'CUCM AXL API health has no successful data for 90 minutes'
              opdata: 'No successful AXL response for 90m'
              priority: HIGH
              tags:
                - tag: scope
                  value: api
        - uuid: 3c94dd93e7f54152955d5cc76d263976
          name: 'CUCM API: Certificate Management health'
          type: DEPENDENT
          key: cucm.api.certificate.health
          delay: '0'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'if(value.indexOf(''identities'')<0||value.indexOf(''Fault'')>=0)throw ''invalid API response'';return 1;'
          master_item:
            key: cucm.certificate.snapshot.raw
          tags:
            - tag: component
              value: certificates
            - tag: scope
              value: operator
            - tag: source
              value: certificate-management
          triggers:
            - uuid: 9cd81b119d5849549a236bb8b2b23e9f
              expression: 'nodata(/Cisco Unified Communications Manager 15 by API/cucm.api.certificate.health,36h)=1'
              name: 'CUCM Certificate Management API health has no successful data for 36 hours'
              opdata: 'No successful certificate snapshot for 36h'
              priority: HIGH
              tags:
                - tag: scope
                  value: api
        - uuid: 9536124509d64986b813e4b5e140ec2f
          name: 'CUCM API: ControlCenter health'
          type: DEPENDENT
          key: cucm.api.control.health
          delay: '0'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'if(value.indexOf(''soapGetServiceStatusResponse'')<0||value.indexOf(''Fault'')>=0)throw ''invalid API response'';return 1;'
          master_item:
            key: cucm.control.services.raw
          tags:
            - tag: component
              value: api
            - tag: scope
              value: operator
            - tag: source
              value: controlcenter
          triggers:
            - uuid: b621ddbb4df9416c92b35c277cf25ec9
              expression: 'nodata(/Cisco Unified Communications Manager 15 by API/cucm.api.control.health,15m)=1'
              name: 'CUCM ControlCenter API health has no successful data for 15 minutes'
              opdata: 'No successful ControlCenter batch response for 15m'
              priority: HIGH
              tags:
                - tag: scope
                  value: api
        - uuid: 661b5f8000a34eebb04f9ac4bf1e25cc
          name: 'CUCM API: PerfMon health'
          type: DEPENDENT
          key: cucm.api.perfmon.health
          delay: '0'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'if(value.indexOf(''perfmonCollectCounterDataResponse'')<0||value.indexOf(''Fault'')>=0)throw ''invalid API response'';return 1;'
          master_item:
            key: cucm.perfmon.processor.raw
          tags:
            - tag: component
              value: api
            - tag: scope
              value: operator
            - tag: source
              value: perfmon
          triggers:
            - uuid: 0f5a9edb092c4de18f58b9c0d7ef3d65
              expression: 'nodata(/Cisco Unified Communications Manager 15 by API/cucm.api.perfmon.health,10m)=1'
              name: 'CUCM PerfMon API health has no successful data for 10 minutes'
              opdata: 'No successful PerfMon Processor response for 10m'
              priority: HIGH
              tags:
                - tag: scope
                  value: api
        - uuid: d984415ffc6e4471b2fa03d3b14f8ffd
          name: 'CUCM API: RIS health'
          type: DEPENDENT
          key: cucm.api.ris.health
          delay: '0'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'if(value.indexOf(''selectCmDeviceResponse'')<0||value.indexOf(''Fault'')>=0)throw ''invalid RIS response'';return 1;'
          master_item:
            key: cucm.ris.health.raw
          tags:
            - tag: component
              value: api
            - tag: scope
              value: operator
            - tag: source
              value: risport70
          triggers:
            - uuid: 0ae4bb9f5f724b2d9c75e5246018b6a1
              expression: 'nodata(/Cisco Unified Communications Manager 15 by API/cucm.api.ris.health,15m)=1'
              name: 'CUCM RISPort70 API health has no successful data for 15 minutes'
              opdata: 'No successful RISPort70 response for 15m'
              priority: HIGH
              tags:
                - tag: scope
                  value: api
        - uuid: b91f4b0f48e74c00817ecf3ca84cc001
          name: 'CUCM: software version'
          type: DEPENDENT
          key: cucm.axl.software.version
          delay: '0'
          value_type: CHAR
          trends: '0'
          description: 'Installed CUCM software version returned by AXL getCCMVersion. This is a human-readable dependent value from the existing AXL health request; it does not make another CUCM request.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'if(value.indexOf(''getCCMVersionResponse'')<0||value.indexOf(''Fault'')>=0)throw ''invalid AXL version response'';var r=/<(?:[^:>]+:)?version>\s*([^<\s][^<]*?)\s*<\/(?:[^:>]+:)?version>/.exec(value);if(!r)throw ''AXL component version absent'';return r[1];'
          master_item:
            key: cucm.axl.version.raw
          tags:
            - tag: component
              value: api
            - tag: scope
              value: operator
            - tag: source
              value: axl
        - uuid: 11b7d6fd1cd14cd1a0423ee801000022
          name: 'CUCM AXL: throttle events delta'
          type: DEPENDENT
          key: cucm.axl.throttle.events.delta
          delay: '0'
          description: 'New AXL throttle engagements since the preceding two-minute PerfMon poll. The underlying counter resets with the Cisco AXL Web Service.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'var r=/<[^>]*Name>[^<]*Cisco AXL Web Service\\ThrottleCount<\/[^>]*Name>[\s\S]*?<[^>]*Value>([^<]+)[\s\S]*?<[^>]*CStatus>([^<]+)/.exec(value);if(!r||Number(r[2])!==1)throw ''invalid AXL throttle-count counter'';var v=Number(r[1]);if(!isFinite(v)||v<0||Math.floor(v)!==v)throw ''invalid AXL throttle count'';return v;'
            - type: SIMPLE_CHANGE
              parameters:
                - ''
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: cucm.perfmon.axl.raw
          tags:
            - tag: component
              value: api
            - tag: scope
              value: operator
            - tag: source
              value: perfmon
        - uuid: 11b7d6fd1cd14cd1a0423ee801000020
          name: 'CUCM AXL: throttle state'
          type: DEPENDENT
          key: cucm.axl.throttle.state
          delay: '0'
          description: 'Current Cisco AXL Web Service throttle state from PerfMon. A value of 1 means CUCM is dynamically throttling AXL write requests; AXL has no fixed global requests-per-minute ceiling.'
          valuemap:
            name: 'CUCM AXL throttle state'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'var r=/<[^>]*Name>[^<]*Cisco AXL Web Service\\ThrottleState<\/[^>]*Name>[\s\S]*?<[^>]*Value>([^<]+)[\s\S]*?<[^>]*CStatus>([^<]+)/.exec(value);if(!r||Number(r[2])!==1)throw ''invalid AXL throttle-state counter'';var v=Number(r[1]);if(v!==0&&v!==1)throw ''invalid AXL throttle state'';return v;'
          master_item:
            key: cucm.perfmon.axl.raw
          tags:
            - tag: component
              value: api
            - tag: scope
              value: operator
            - tag: source
              value: perfmon
          triggers:
            - uuid: 11b7d6fd1cd14cd1a0423ee801000021
              expression: 'last(/Cisco Unified Communications Manager 15 by API/cucm.axl.throttle.state)=1'
              name: 'CUCM AXL write requests are being throttled'
              opdata: 'AXL throttle state: {ITEM.LASTVALUE1}'
              priority: HIGH
              description: 'CUCM PerfMon reports active Administrative XML (AXL) throttling. Write requests can be denied while reads continue. Reduce provisioning load and use delayed retry/backoff.'
              tags:
                - tag: component
                  value: axl
        - uuid: 7e856e145c6c47b99b58445f00100003
          name: 'CUCM internal: AXL getCCMVersion raw/master'
          type: HTTP_AGENT
          key: cucm.axl.version.raw
          delay: '{$CUCM.AXL.VERSION.INTERVAL}'
          history: 1d
          value_type: TEXT
          trends: '0'
          authtype: BASIC
          username: '{$CUCM.API.USER}'
          password: '{$CUCM.API.PASSWORD}'
          description: 'Internal transport/master item. Raw API payload for dependent operator items: CUCM: software version and AXL API health. Filter scope=internal; do not use this raw value for incident interpretation.'
          timeout: 15s
          url: '{$CUCM.AXL.URL}/axl/'
          posts: '<soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/" xmlns:axl="http://www.cisco.com/AXL/API/{$CUCM.API.VERSION}"><soapenv:Body><axl:getCCMVersion/></soapenv:Body></soapenv:Envelope>'
          http_proxy: '{$CUCM.HTTP.PROXY}'
          headers:
            - name: Content-Type
              value: text/xml
            - name: SOAPAction
              value: '"CUCM:DB ver={$CUCM.API.VERSION}"'
          request_method: POST
          tags:
            - tag: component
              value: api
            - tag: scope
              value: internal
            - tag: source
              value: axl
        - uuid: ca4ce62b25a749ef962a4665b390746b
