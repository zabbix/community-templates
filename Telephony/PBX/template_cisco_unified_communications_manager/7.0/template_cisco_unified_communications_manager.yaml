      tags:
        - tag: class
          value: voip
        - tag: target
          value: cisco-unified-communications-manager
      macros:
        - macro: '{$CUCM.AXL.VERSION.INTERVAL}'
          value: 30m
          description: 'Low-change Publisher AXL version and health polling interval. AXL is a configuration API, not a real-time interface.'
        - macro: '{$CUCM.API.PASSWORD}'
          type: SECRET_TEXT
          description: 'Secret password for the dedicated CUCM application user in {$CUCM.API.USER}. Override on the host.'
        - macro: '{$CUCM.API.USER}'
          value: zabbix-monitor
          description: 'Dedicated CUCM application user for AXL and Serviceability APIs. Assign Standard CCM Server Monitoring and a custom AXL read-only group containing Standard AXL API Users plus Standard AXL Read Only API Access. Override on the host.'
        - macro: '{$CUCM.API.VERSION}'
          value: '15.0'
          description: 'CUCM AXL API version used in SOAP request paths.'
        - macro: '{$CUCM.CALLPROCESSING.HIGH_QUEUE.MAX}'
          value: '1'
          description: 'Maximum acceptable high-priority CallManager queue backlog.'
        - macro: '{$CUCM.CERT.DISASTER}'
          value: '7'
          description: 'Certificate expiry threshold in days for the disaster tier.'
        - macro: '{$CUCM.CERT.HIGH}'
          value: '30'
          description: 'Certificate expiry threshold in days for the high tier.'
        - macro: '{$CUCM.CERT.INFO}'
          value: '90'
          description: 'Certificate expiry threshold in days for the informational tier.'
        - macro: '{$CUCM.CERT.URL}'
          value: 'https://cucm.example'
          description: 'Cisco VOS Certificate Management base URL. Override on the host.'
        - macro: '{$CUCM.CERT.WARN}'
          value: '60'
          description: 'Certificate expiry threshold in days for the warning tier.'
        - macro: '{$CUCM.CPU.HIGH}'
          value: '90'
          description: 'CPU utilization high threshold in percent.'
        - macro: '{$CUCM.CPU.WARN}'
          value: '80'
          description: 'CPU utilization warning threshold in percent.'
        - macro: '{$CUCM.DB.REPLICATION.EXPECTED}'
          value: '0'
          description: 'Set to 1 only when replication is expected for this node.'
        - macro: '{$CUCM.DISK.DISASTER}'
          value: '95'
          description: 'Partition utilization disaster threshold in percent.'
        - macro: '{$CUCM.DISK.HIGH}'
          value: '90'
          description: 'Partition utilization high threshold in percent.'
        - macro: '{$CUCM.DISK.WARN}'
          value: '80'
          description: 'Partition utilization warning threshold in percent.'
        - macro: '{$CUCM.FQDN}'
          value: cucm.example
          description: 'CUCM FQDN resolvable by the Zabbix server or proxy for HTTPS reachability checks.'
        - macro: '{$CUCM.HTTP.PROXY}'
          description: 'Optional HTTP proxy URL for HTTP agent requests; leave empty for a direct connection.'
        - macro: '{$CUCM.MEM.HIGH}'
          value: '95'
          description: 'Memory utilization high threshold in percent.'
        - macro: '{$CUCM.MEM.WARN}'
          value: '85'
          description: 'Memory utilization warning threshold in percent.'
        - macro: '{$CUCM.NODE}'
          value: cucm-node
          description: 'Exact CUCM node name used in PerfMon counter paths. Override on the host.'
        - macro: '{$CUCM.OS.PASSWORD}'
          type: SECRET_TEXT
          description: 'Secret password for the dedicated read-only Cisco VOS Certificate Management account in {$CUCM.OS.USER}. Override on the host.'
        - macro: '{$CUCM.OS.USER}'
          value: os-monitor
          description: 'Dedicated Cisco VOS Certificate Management account created with privilege 0 (read APIs only). Override on the host.'
        - macro: '{$CUCM.PARTITION.AWAIT.MAX}'
          value: '20'
          description: 'Maximum average partition I/O await time in milliseconds.'
        - macro: '{$CUCM.PARTITION.CPU.DISASTER}'
          value: '95'
          description: 'Partition CPU utilization disaster threshold in percent.'
        - macro: '{$CUCM.PARTITION.CPU.HIGH}'
          value: '90'
          description: 'Partition CPU utilization high threshold in percent.'
        - macro: '{$CUCM.PARTITION.CPU.WARN}'
          value: '80'
          description: 'Partition CPU utilization warning threshold in percent.'
        - macro: '{$CUCM.PARTITION.QUEUE.LIMIT}'
          value: '1'
          description: 'Maximum average partition I/O queue length.'
        - macro: '{$CUCM.PARTITIONS.NOT_TO_DISCOVER}'
          value: '^(?:Active|Inactive|Swap)$'
          description: 'Regex for partitions excluded from generic discovery and capacity alarms. Active/Inactive are VOS image partitions: retain their dedicated informational items, not percentage capacity alerts.'
        - macro: '{$CUCM.SERVICE.EXPECTED:"{#SERVICE.NAME}"}'
          value: '0'
          description: 'Set an exact discovered service context to 1 only when it is expected to run.'
        - macro: '{$CUCM.SERVICES.NOT_TO_DISCOVER}'
          value: ^$
          description: 'Regex for ControlCenter services excluded from discovery; ^$ excludes none.'
        - macro: '{$CUCM.SIP.AV.NOT_TO_DISCOVER}'
          value: CUBE
          description: 'Regex for SIP trunks excluded only from audio/video call-stat discovery.'
        - macro: '{$CUCM.SIP.CALLSTATS.NOT_TO_DISCOVER}'
          value: ^$
          description: 'Regex for SIP trunks excluded from all call-stat discovery.'
        - macro: '{$CUCM.SIP.TRUNK.EXPECTED:"{#SIP.TRUNK}"}'
          value: '0'
          description: 'Set an exact discovered SIP-trunk context to 1 only when that genuine RIS runtime record is expected to remain Registered.'
        - macro: '{$CUCM.SIP.RUNTIME.INTERVAL}'
          value: 10m
          description: 'Polling interval for the bounded AXL SIP-trunk inventory and RISPort70 runtime-status collection.'
        - macro: '{$CUCM.SIP.TRUNKS.NOT_TO_DISCOVER}'
          value: ^$
          description: 'Regex for SIP trunks excluded from runtime discovery.'
        - macro: '{$CUCM.SIP.TRUNKS.TO_DISCOVER}'
          value: '.*'
          description: 'Regex for SIP trunks included in runtime discovery.'
        - macro: '{$CUCM.SWAP.HIGH}'
          value: '50'
          description: 'Swap utilization high threshold in percent.'
        - macro: '{$CUCM.SWAP.MEMORY.MIN}'
          value: '85'
          description: 'Minimum sustained memory utilization required before elevated swap is alertable.'
        - macro: '{$CUCM.SWAP.WARN}'
          value: '25'
          description: 'Swap utilization warning threshold in percent.'
        - macro: '{$CUCM.URL}'
          value: 'https://cucm.example:8443'
          description: 'CUCM API base URL. Override on the host.'
        - macro: '{$CUCM.AXL.URL}'
          value: 'https://cucm.example:8443'
          description: 'CUCM Publisher AXL API base URL. Set this to the Publisher on every cluster-node host; AXL is configuration inventory, not a per-node runtime API.'
