              description: 'Replication is expected for this host, but CUCM PerfMon Replicate_State is not 2 (Good Replication). Investigate with the Cisco-supported dbreplication status workflow; this aggregate state does not identify the affected cluster node. Disable the expected-state macro only after an authoritative topology assessment confirms replication is not required.'
