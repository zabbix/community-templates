          name: 'CUCM call processing: Code Red state'
          type: DEPENDENT
          key: cucm.callprocessing.code_red.state
          delay: '0'
          description: 'Current CUCM Code Red call-throttling state.'
          valuemap:
            name: 'CUCM call-processing throttle state'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'var marker="Cisco CallManager System Performance\\CodeRedEntryExit",p=value.indexOf(marker);if(p<0)throw "counter absent: CodeRedEntryExit";var r=/<[^>]*Value>\s*([^<]+)[\s\S]*?<[^>]*CStatus>\s*([^<]+)/.exec((function(b){var q=/<[A-Za-z_][^>]*Name>/.exec(b);return q?b.slice(0,q.index):b;})(value.slice(p)));if(!r||Number(r[2])!==1)throw "counter unavailable";var n=Number(r[1]);if(n!==0&&n!==1)throw "counter value invalid";return n;'
