  triggers:
    - uuid: ea1d79f9f36342958f9f81cddb6ceb02
      expression: 'min(/Cisco Unified Communications Manager 15 by API/cucm.swap.util,10m)>={$CUCM.SWAP.WARN} and min(/Cisco Unified Communications Manager 15 by API/cucm.swap.util,10m)<{$CUCM.SWAP.HIGH} and min(/Cisco Unified Communications Manager 15 by API/cucm.memory.util,10m)>={$CUCM.SWAP.MEMORY.MIN}'
      name: 'CUCM: swap utilization is elevated'
      opdata: 'Swap: {ITEM.LASTVALUE1}; memory: {ITEM.LASTVALUE2}'
      priority: WARNING
      tags:
        - tag: component
          value: memory
    - uuid: b1a77bd50c0e41c2a47338400d12eb03
      expression: 'min(/Cisco Unified Communications Manager 15 by API/cucm.swap.util,10m)>={$CUCM.SWAP.HIGH} and min(/Cisco Unified Communications Manager 15 by API/cucm.memory.util,10m)>={$CUCM.SWAP.MEMORY.MIN}'
      name: 'CUCM: swap utilization is high'
      opdata: 'Swap: {ITEM.LASTVALUE1}; memory: {ITEM.LASTVALUE2}'
      priority: HIGH
      tags:
        - tag: component
          value: memory
    - uuid: a0000000000040008000000000000004
      expression: 'last(/Cisco Unified Communications Manager 15 by API/cucm.media.mtp.total)>0 and last(/Cisco Unified Communications Manager 15 by API/cucm.media.mtp.available)=0'
      name: 'CUCM media MTP resources are exhausted'
      opdata: 'Available: {ITEM.LASTVALUE2}; total: {ITEM.LASTVALUE1}'
      priority: HIGH
      description: 'CUCM reports no available MTP resources while a nonzero MTP capacity is configured. Check Media Resources before call treatment is affected.'
      tags:
        - tag: component
          value: media
    - uuid: a0000000000040008000000000000008
      expression: 'last(/Cisco Unified Communications Manager 15 by API/cucm.media.swconference.total)>0 and last(/Cisco Unified Communications Manager 15 by API/cucm.media.swconference.available)=0'
      name: 'CUCM media software conference resources are exhausted'
      opdata: 'Available: {ITEM.LASTVALUE2}; total: {ITEM.LASTVALUE1}'
      priority: HIGH
      description: 'CUCM reports no available software-conference resources while a nonzero capacity is configured. Check Media Resources before conferencing is affected.'
      tags:
        - tag: component
          value: media
    - uuid: a000000000004000800000000000000c
      expression: 'last(/Cisco Unified Communications Manager 15 by API/cucm.media.transcoder.total)>0 and last(/Cisco Unified Communications Manager 15 by API/cucm.media.transcoder.available)=0'
      name: 'CUCM media transcoder resources are exhausted'
      opdata: 'Available: {ITEM.LASTVALUE2}; total: {ITEM.LASTVALUE1}'
      priority: HIGH
      description: 'CUCM reports no available transcoder resources while a nonzero capacity is configured. Check Media Resources before call treatment is affected.'
      tags:
        - tag: component
          value: media
