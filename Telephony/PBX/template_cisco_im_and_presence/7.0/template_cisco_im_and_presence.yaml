zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 1d12408342854fd5a4436dd6d5d1bd4a
      name: Templates/Telephony
  templates:
    - uuid: 77c9e59f51b94db79cc3c780cff96000
      template: 'Cisco IM and Presence 15 by API'
      name: 'Cisco IM and Presence 15 by API'
      description: 'Cisco IM and Presence 15 (CUP) baseline monitoring through read-only Cisco Serviceability PerfMon, ControlCenter SOAP, and Cisco VOS Certificate Management APIs. Host setup: set {$CUP.URL}, {$CUP.SERVICEABILITY.URL}, {$CUP.CERT.URL}, {$CUP.NODE} (exact Serviceability node name), {$CUP.API.USER}, {$CUP.API.PASSWORD}, {$CUP.OS.USER}, and {$CUP.OS.PASSWORD}; {$CUP.ROLE} is optional operator documentation. The API user is a dedicated read-only Cisco Serviceability user for PerfMon and ControlCenter. The separate VOS certificate account needs certificate-API privilege 0 (read only). It covers API health, CPU, memory, swap, SIP Proxy sessions, Presence Engine sessions/subscriptions, selected critical services, and identity-certificate Latest Data including CN, issuer, SAN, UTC expiry, Key Usage, and Extended Key Usage from the existing PEM snapshot. Operator values use scope=operator; XML/master payloads use scope=internal. Maintainer: DevYves89.'
      vendor:
        name: Zabbix
        version: 7.0-4
      groups:
        - name: Templates/Telephony
      items:
        - uuid: fe939377de7642f38e4d2a67d399865c
          name: 'CUP: Certificate Management collection health'
          type: DEPENDENT
          key: cup.api.certificate.health
          delay: '0'
          history: 7d
          description: 'Health of the latest Cisco VOS identity certificate snapshot.'
          valuemap:
            name: 'CUP collection health'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'if(value.indexOf("identities")<0||value.indexOf("Fault")>=0)throw "invalid API response";return 1;'
          master_item:
            key: cup.certificate.snapshot.raw
          tags:
            - tag: component
              value: api
            - tag: scope
              value: operator
          triggers:
            - uuid: 94a7bfc094eb4337b608e3843c4a6f27
              expression: 'nodata(/Cisco IM and Presence 15 by API/cup.api.certificate.health,12h)=1'
              name: 'CUP Certificate Management API health has no successful data for 12 hours'
              priority: HIGH
              description: 'Verify VOS certificate API credentials and TCP 443.'
              tags:
                - tag: component
                  value: api
        - uuid: 77c9e59f51b94db79cc3c780cff96010
          name: 'CUP: ControlCenter collection health'
          type: DEPENDENT
          key: cup.api.controlcenter.health
          delay: '0'
          history: 7d
          description: 'Health of the latest API collection. Collection OK means a valid non-fault response was returned.'
          valuemap:
            name: 'CUP collection health'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'return value.indexOf(''soapGetServiceStatusResponse'')>=0&&value.indexOf(''Fault'')<0?1:0;'
          master_item:
            key: cup.control.services.raw
          tags:
            - tag: component
              value: api
            - tag: scope
              value: operator
          triggers:
            - uuid: 77c9e59f51b94db79cc3c780cff96011
              expression: 'max(/Cisco IM and Presence 15 by API/cup.api.controlcenter.health,5m)=0'
              name: 'CUP: ControlCenter API is unavailable or returned an invalid response'
              priority: HIGH
            - uuid: 87340337ccab454db793e3d0d3ac1aa0
              expression: 'nodata(/Cisco IM and Presence 15 by API/cup.api.controlcenter.health,10m)=1'
              name: 'CUP ControlCenter API health has no successful data for 10 minutes'
              priority: HIGH
              description: 'Verify TCP 8443, credentials, and ControlCenter service access.'
              tags:
                - tag: component
                  value: api
        - uuid: 77c9e59f51b94db79cc3c780cff96008
          name: 'CUP: PerfMon processor collection health'
          type: DEPENDENT
          key: cup.api.perfmon.health
          delay: '0'
          history: 7d
          description: 'Health of the latest API collection. Collection OK means a valid non-fault response was returned.'
          valuemap:
            name: 'CUP collection health'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'return value.indexOf(''Processor'')>=0&&value.indexOf(''Fault'')<0?1:0;'
          master_item:
            key: cup.perfmon.processor.raw
          tags:
            - tag: component
              value: api
            - tag: scope
              value: operator
          triggers:
            - uuid: 77c9e59f51b94db79cc3c780cff96009
              expression: 'max(/Cisco IM and Presence 15 by API/cup.api.perfmon.health,5m)=0'
              name: 'CUP: PerfMon API is unavailable or returned an invalid response'
              priority: HIGH
            - uuid: d1ef66cfd24e47339b73acfe3fc9393e
              expression: 'nodata(/Cisco IM and Presence 15 by API/cup.api.perfmon.health,15m)=1'
              name: 'CUP PerfMon API health has no successful data for 15 minutes'
              priority: HIGH
              description: 'Verify TCP 8443, credentials, SOAP -Performance Monitoring APIs, and node name.'
              tags:
                - tag: component
                  value: api
