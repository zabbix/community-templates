                      if(!r)throw "service record absent";var tail=value.slice(r.index+r[0].length),end=tail.search(/<\/[^>]*item>/);if(end<0)throw "service record boundary absent";var block=tail.slice(0,end);var s=/<[^>]*ServiceStatus>\s*([^<]+)/.exec(block);if(!s)throw "state absent";if(s[1].trim()==="Stopped")return 0;var u=/<[^>]*UpTime>\s*([^<]+)/.exec(block);if(!u)throw "uptime absent";return Number(u[1]);
