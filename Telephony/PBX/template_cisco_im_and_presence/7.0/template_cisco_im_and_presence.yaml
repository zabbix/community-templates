      macros:
        - macro: '{$CUP.API.INTERVAL}'
          value: 2m
          description: 'Default interval for CUP web reachability and ControlCenter health collection. Use a Zabbix duration such as 2m; shorter values increase Serviceability load.'
        - macro: '{$CUP.API.PASSWORD}'
          type: SECRET_TEXT
          description: 'Secret password for the Serviceability monitoring user.'
        - macro: '{$CUP.API.TIMEOUT}'
          value: 30s
          description: 'Timeout for one read-only CUP web, PerfMon, ControlCenter, or Certificate Management request. Use a Zabbix duration such as 30s.'
        - macro: '{$CUP.API.USER}'
          value: zabbix-monitor
          description: 'Dedicated read-only Cisco Serviceability monitoring user for PerfMon and ControlCenter SOAP. Do not use a personal administrator account; override on each host.'
        - macro: '{$CUP.CERT.DISASTER}'
          value: '7'
          description: 'DISASTER certificate-expiry boundary in days. Values below 0 mean already expired; default 7 raises the urgent pre-expiry tier for certificates expiring within one week.'
        - macro: '{$CUP.CERT.HIGH}'
          value: '30'
          description: 'AVERAGE certificate-expiry boundary in days. Default 30 creates the 7-29 day renewal-planning tier.'
        - macro: '{$CUP.CERT.INFO}'
          value: '90'
          description: 'INFO certificate-expiry boundary in days. Default 90 creates an early renewal notice before the warning tier.'
        - macro: '{$CUP.CERT.URL}'
          value: 'https://127.0.0.1'
          description: 'Cisco VOS Certificate Management base URL. Override on each host.'
        - macro: '{$CUP.CERT.WARN}'
          value: '60'
          description: 'WARNING certificate-expiry boundary in days. Default 60 creates the 30-59 day warning tier.'
        - macro: '{$CUP.CPU.HIGH}'
          value: '95'
          description: 'HIGH CPU-utilization threshold in percent, evaluated over the sustained trigger window. Raising it reduces sensitivity to PerfMon-reported CPU pressure.'
        - macro: '{$CUP.CPU.WARN}'
          value: '80'
          description: 'WARNING CPU-utilization threshold in percent, evaluated over the sustained trigger window.'
        - macro: '{$CUP.INTERFACES.NOT_TO_DISCOVER}'
          value: ^lo$
          description: 'Regular expression for interfaces excluded from discovery; the loopback interface is excluded by default.'
        - macro: '{$CUP.MEM.HIGH}'
          value: '95'
          description: 'Memory high threshold in percent.'
        - macro: '{$CUP.MEM.WARN}'
          value: '80'
          description: 'Memory warning threshold in percent.'
        - macro: '{$CUP.NODE}'
          value: cup-pub
          description: 'Exact local IM&P node name used in PerfMon counter paths. This must match the node name returned by Cisco Serviceability, not merely the Zabbix visible host name.'
        - macro: '{$CUP.OS.PASSWORD}'
          type: SECRET_TEXT
          description: 'Secret password for the Cisco VOS certificate API user.'
        - macro: '{$CUP.OS.USER}'
          value: os-monitor
          description: 'Dedicated Cisco VOS Certificate Management account created with privilege 0 for read-only certificate APIs. Override on each host.'
        - macro: '{$CUP.PARTITION.HIGH}'
          value: '92'
          description: 'HIGH generic VOS partition-utilization threshold in percent for discovered partitions. Do not use this to infer health for undocumented image partitions unless they are intentionally included.'
        - macro: '{$CUP.PARTITION.WARN}'
          value: '85'
          description: 'WARNING generic VOS partition-utilization threshold in percent for discovered partitions.'
        - macro: '{$CUP.PARTITIONS.NOT_TO_DISCOVER}'
          value: ^$
          description: 'Regular expression for VOS partitions excluded from discovery; ^$ excludes none.'
        - macro: '{$CUP.PERFMON.INTERVAL}'
          value: 5m
          description: 'Polling interval for Cisco Serviceability PerfMon platform and IM&P workload collectors. Default 5m keeps this community baseline low-load.'
        - macro: '{$CUP.PRESENCE.QUEUE.HIGH}'
          value: '0'
          description: 'High presence-notification queue threshold. Set above 0 only after defining an environment baseline; 0 disables this workload trigger.'
        - macro: '{$CUP.ROLE}'
          value: publisher
          description: 'Operator documentation value for the node role, typically publisher or subscriber. It is not used in item or trigger expressions in this baseline.'
        - macro: '{$CUP.SERVICEABILITY.URL}'
          value: 'https://127.0.0.1:8443'
          description: 'IM&P Cisco Serviceability base URL, normally https://<node>:8443. Used for PerfMon and ControlCenter SOAP collectors; override on each host.'
        - macro: '{$CUP.SERVICES.CRITICAL}'
          value: '^(Cisco Tomcat|SOAP -Performance Monitoring APIs|Cisco SIP Proxy|Cisco Presence Engine|Cisco XCP Connection Manager|Cisco XCP Authentication Service)$'
          description: 'Regular expression selecting only intentionally critical IM&P services for discovery and alerts. Add optional Directory, conference, archive, or federation services only when used.'
        - macro: '{$CUP.SWAP.HIGH}'
          value: '50'
          description: 'HIGH allocated-swap threshold in percent. Interpret together with physical-memory utilization; Cisco VOS can allocate swap without immediate service impact.'
        - macro: '{$CUP.SWAP.WARN}'
          value: '25'
          description: 'WARNING allocated-swap threshold in percent. Interpret together with physical-memory utilization.'
        - macro: '{$CUP.URL}'
          value: 'https://127.0.0.1'
          description: 'IM&P web administration base URL for the independent web reachability check. Override on each host.'
