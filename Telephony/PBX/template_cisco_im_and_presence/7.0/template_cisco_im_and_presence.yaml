                  expression: 'last(/Cisco IM and Presence 15 by API/cup.certificate.days[{#CERT.NAME}])<{$CUP.CERT.WARN} and last(/Cisco IM and Presence 15 by API/cup.certificate.days[{#CERT.NAME}])>={$CUP.CERT.HIGH}'
