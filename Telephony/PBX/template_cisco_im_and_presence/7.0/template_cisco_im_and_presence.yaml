          value_type: TEXT
          trends: '0'
          authtype: BASIC
          username: '{$CUP.OS.USER}'
          password: '{$CUP.OS.PASSWORD}'
          description: 'Internal Cisco VOS identity-certificate snapshot. Filter scope=internal.'
          timeout: 45s
          url: '{$CUP.CERT.URL}/platformcom/api/v1/certmgr/config/snapshot/server'
          headers:
            - name: Accept
              value: application/json
          tags:
            - tag: component
              value: raw
            - tag: scope
              value: internal
        - uuid: 77c9e59f51b94db79cc3c780cff96007
          name: 'CUP internal: ControlCenter critical services raw/master'
          type: HTTP_AGENT
          key: cup.control.services.raw
          delay: '{$CUP.API.INTERVAL}'
          history: '0'
          value_type: TEXT
          trends: '0'
          authtype: BASIC
          username: '{$CUP.API.USER}'
          password: '{$CUP.API.PASSWORD}'
          description: 'Internal ControlCenter XML for core and optional IM&P services. Filter scope=internal.'
          timeout: '{$CUP.API.TIMEOUT}'
          url: '{$CUP.SERVICEABILITY.URL}/controlcenterservice2/services/ControlCenterServices'
          posts: '<s:Envelope xmlns:s="http://schemas.xmlsoap.org/soap/envelope/" xmlns:ns="http://schemas.cisco.com/ast/soap"><s:Body><ns:soapGetServiceStatus><ns:ServiceStatus>Cisco Tomcat</ns:ServiceStatus><ns:ServiceStatus>SOAP -Performance Monitoring APIs</ns:ServiceStatus><ns:ServiceStatus>Cisco SIP Proxy</ns:ServiceStatus><ns:ServiceStatus>Cisco Presence Engine</ns:ServiceStatus><ns:ServiceStatus>Cisco XCP Connection Manager</ns:ServiceStatus><ns:ServiceStatus>Cisco XCP Authentication Service</ns:ServiceStatus><ns:ServiceStatus>Cisco XCP Directory Service</ns:ServiceStatus><ns:ServiceStatus>Cisco XCP Text Conference Manager</ns:ServiceStatus><ns:ServiceStatus>Cisco XCP Web Connection Manager</ns:ServiceStatus><ns:ServiceStatus>Cisco XCP SIP Federation Connection Manager</ns:ServiceStatus><ns:ServiceStatus>Cisco XCP XMPP Federation Connection Manager</ns:ServiceStatus><ns:ServiceStatus>Cisco XCP Message Archiver</ns:ServiceStatus></ns:soapGetServiceStatus></s:Body></s:Envelope>'
          headers:
            - name: Content-Type
              value: 'text/xml; charset=utf-8'
            - name: SOAPAction
              value: '""'
          request_method: POST
          tags:
            - tag: component
              value: raw
            - tag: scope
              value: internal
        - uuid: 77c9e59f51b94db79cc3c780cff96002
          name: 'CUP: CPU utilization'
          type: DEPENDENT
          key: cup.cpu.util
          delay: '0'
          history: 30d
          value_type: FLOAT
          units: '%'
          description: 'Total processor utilization reported by Cisco VOS PerfMon.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'var m=/<[^>]*Name>[^<]*Processor\(_Total\)\\% CPU Time<\/[^>]*Name>/.exec(value);if(!m)throw "counter absent";var b=value.slice(m.index+m[0].length),q=/<[^>]*Name>/.exec(b);if(q)b=b.slice(0,q.index);var r=/<[^>]*Value>\s*([^<]+)[\s\S]*?<[^>]*CStatus>\s*([^<]+)/.exec(b);if(!r||Number(r[2])!==1)throw "counter unavailable";var n=Number(r[1]);if(!isFinite(n)||n<0)throw "counter value invalid";return n;'
          master_item:
            key: cup.perfmon.processor.raw
          tags:
            - tag: component
              value: cpu
            - tag: scope
              value: operator
          triggers:
            - uuid: 77c9e59f51b94db79cc3c780cff96003
              expression: 'min(/Cisco IM and Presence 15 by API/cup.cpu.util,10m)>={$CUP.CPU.WARN} and min(/Cisco IM and Presence 15 by API/cup.cpu.util,10m)<{$CUP.CPU.HIGH}'
              name: 'CUP: CPU utilization is elevated'
              priority: WARNING
              description: 'Review VOS resource pressure and concurrent IM&P load.'
              tags:
                - tag: component
                  value: cpu
            - uuid: 77c9e59f51b94db79cc3c780cff96004
              expression: 'min(/Cisco IM and Presence 15 by API/cup.cpu.util,10m)>={$CUP.CPU.HIGH}'
              name: 'CUP: CPU utilization is high'
              priority: HIGH
              description: 'Sustained CPU pressure can affect presence and XMPP connectivity.'
              tags:
                - tag: component
                  value: cpu
        - uuid: 77c9e59f51b94db79cc3c780cff96012
          name: 'CUP: memory free'
          type: DEPENDENT
          key: cup.memory.free
          delay: '0'
          history: 30d
          value_type: FLOAT
          units: B
          description: 'Available physical memory reported by Cisco VOS PerfMon.'
          preprocessing:
            - type: JAVASCRIPT
