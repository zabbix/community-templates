          description: 'Discovers Cisco VOS identity certificates and creates expiry and identity metadata items.'
          item_prototypes:
            - uuid: 17217595c51849779ce631108c29be58
              name: 'CUP certificate {#CERT.NAME}: days until expiry'
              type: DEPENDENT
              key: 'cup.certificate.days[{#CERT.NAME}]'
              delay: '0'
              value_type: FLOAT
              description: 'PEM-derived whole days until expiry. Negative values deliberately represent certificates that have already expired, so this item must be signed rather than Numeric (unsigned).'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - 'var snapshot = JSON.parse(value), identities = snapshot.identities || snapshot, certificate = null, matches = 0; if (!Array.isArray(identities)) throw ''invalid certificate snapshot''; identities.forEach(function (identity) { if (identity.service === ''{#CERT.NAME}'') { certificate = identity.certificate; matches++; } }); if (matches !== 1 || typeof certificate !== ''string'') throw ''certificate absent or ambiguous''; var pem = /^\s*-----BEGIN CERTIFICATE-----\s*([A-Za-z0-9+/=\s]+)\s*-----END CERTIFICATE-----\s*$/.exec(certificate); if (!pem) throw ''invalid certificate PEM''; var base64 = pem[1].replace(/\s/g, ''''); if (!/^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(base64)) throw ''invalid certificate base64''; var decoded = atob(base64), bytes = [], i; for (i = 0; i < decoded.length; i++) { bytes.push(typeof decoded[i] === ''number'' ? decoded[i] : decoded.charCodeAt(i)); } function tlv(offset, limit) { if (offset + 2 > limit) throw ''truncated ASN.1 header''; var tag = bytes[offset++], length = bytes[offset++], count, j; if (length & 128) { count = length & 127; if (!count || count > 4 || offset + count > limit || bytes[offset] === 0) throw ''invalid ASN.1 length''; length = 0; for (j = 0; j < count; j++) length = length * 256 + bytes[offset++]; if (length < 128) throw ''noncanonical ASN.1 length''; } if (offset + length > limit) throw ''truncated ASN.1 value''; return {tag: tag, start: offset, end: offset + length}; } function time(node) { var text = '''', j, match, year, month, day, hour, minute, second, date, epoch; for (j = node.start; j < node.end; j++) text += String.fromCharCode(bytes[j]); if (node.tag === 23) { match = /^(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})Z$/.exec(text); if (!match) throw ''invalid UTCTime''; year = Number(match[1]); year += year >= 50 ? 1900 : 2000; } else if (node.tag === 24) { match = /^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})Z$/.exec(text); if (!match) throw ''invalid GeneralizedTime''; year = Number(match[1]); } else throw ''invalid validity time tag''; month = Number(match[2]); day = Number(match[3]); hour = Number(match[4]); minute = Number(match[5]); second = Number(match[6]); date = new Date(0); date.setUTCFullYear(year, month - 1, day); date.setUTCHours(hour, minute, second, 0); epoch = date.getTime(); if (!isFinite(epoch) || date.getUTCFullYear() !== year || date.getUTCMonth() !== month - 1 || date.getUTCDate() !== day || date.getUTCHours() !== hour || date.getUTCMinutes() !== minute || date.getUTCSeconds() !== second) throw ''invalid calendar time''; return epoch; } var root = tlv(0, bytes.length); if (root.tag !== 48 || root.end !== bytes.length) throw ''invalid certificate sequence''; var tbs = tlv(root.start, root.end); if (tbs.tag !== 48) throw ''invalid TBSCertificate''; var field = tlv(tbs.start, tbs.end); if (field.tag === 160) field = tlv(field.end, tbs.end); if (field.tag !== 2) throw ''missing serial number''; field = tlv(field.end, tbs.end); if (field.tag !== 48) throw ''missing signature algorithm''; field = tlv(field.end, tbs.end); if (field.tag !== 48) throw ''missing issuer''; var validity = tlv(field.end, tbs.end); if (validity.tag !== 48) throw ''missing validity''; var notBefore = tlv(validity.start, validity.end), notAfter = tlv(notBefore.end, validity.end); if (notAfter.end !== validity.end) throw ''invalid validity fields''; var expiry = time(notAfter); if (time(notBefore) > expiry) throw ''reversed validity''; return Math.floor((expiry - Date.now()) / 86400000);'
