                  expression: 'last(/Cisco IM and Presence 15 by API/cup.service.state[{#SERVICE.NAME}])=2'
                  name: 'CUP service {#SERVICE.NAME} is unexpectedly stopped'
                  priority: HIGH
                  description: 'Review the ControlCenter service state and configured feature before any restart.'
                  tags:
                    - tag: component
                      value: services
            - uuid: 6cf04fbfe2a54fc2921e1174893167bf
              name: 'CUP service {#SERVICE.NAME}: uptime'
              type: DEPENDENT
              key: 'cup.service.uptime[{#SERVICE.NAME}]'
              delay: '0'
              history: 30d
              units: s
              description: 'Uptime of the discovered critical CUP service. Zero means stopped.'
