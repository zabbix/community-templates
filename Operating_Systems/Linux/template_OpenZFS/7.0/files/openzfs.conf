# /etc/zabbix/zabbix_agent2.d/openzfs.conf
UserParameter=zfs.native.pool.list,/usr/bin/sudo -n /usr/sbin/zpool list -Hp -o name,guid,size,alloc,free,cap,frag,health --json
UserParameter=zfs.native.pool.status,/usr/bin/sudo -n /usr/sbin/zpool status -j --json-flat-vdevs --json-int
UserParameter=zfs.native.dataset.list,/usr/bin/sudo -n /usr/sbin/zfs list -jp -t filesystem,volume -o name,type,used,available,referenced,compressratio,quota,refquota,usedbysnapshots
UserParameter=zfs.native.pool.iostat,/usr/bin/sudo -n /usr/sbin/zpool iostat -Hpv 1 2
