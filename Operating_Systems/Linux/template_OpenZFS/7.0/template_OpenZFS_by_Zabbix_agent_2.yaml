            - tag: system
              value: zfs
        - uuid: a164520be6074f37a112d960dba63699
          name: 'ZFS: module version'
          key: 'vfs.file.contents[/sys/module/zfs/version]'
          delay: 1h
          value_type: TEXT
          tags:
            - tag: component
              value: raw
            - tag: system
              value: zfs
        - uuid: 076fbdadd954408e9e8dfe9200f98580
          name: 'ZFS ARC: arc_meta_used'
          type: DEPENDENT
          key: zfs.arc.arc_meta_used
          history: 7d
          units: B
          preprocessing:
            - type: REGEX
              parameters:
                - '(?m)^arc_meta_used[ \t]+[0-9]+[ \t]+([0-9]+)[ \t]*$'
                - \1
              error_handler: DISCARD_VALUE
            - type: MATCHES_REGEX
              parameters:
                - '^[0-9]+$'
              error_handler: DISCARD_VALUE
          master_item:
            key: 'vfs.file.contents[/proc/spl/kstat/zfs/arcstats]'
          tags:
            - tag: component
              value: arc
            - tag: system
              value: zfs
        - uuid: 1bd920c22dd54298936cc731d1bfec98
