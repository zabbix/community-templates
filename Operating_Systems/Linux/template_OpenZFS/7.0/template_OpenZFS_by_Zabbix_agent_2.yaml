      discovery_rules:
        - uuid: f4b0d6452241403c80e53115cbd8a813
          name: 'ZFS dataset discovery'
          type: DEPENDENT
          key: zfs.discovery.dataset
          description: 'Discovered automatically from OpenZFS JSON; no external JSON parser.'
          item_prototypes:
            - uuid: 99d7d39075494d3c8292b260ec052cf5
              name: 'Dataset {#DATASET}: Available'
              type: DEPENDENT
              key: 'zfs.dataset.available[{#DATASET}]'
              history: 7d
              units: B
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.datasets["{#DATASET}"].properties.available.value'
                  error_handler: DISCARD_VALUE
                - type: MATCHES_REGEX
                  parameters:
                    - '^[0-9]+$'
                  error_handler: DISCARD_VALUE
              master_item:
                key: zfs.native.dataset.list
              tags:
                - tag: component
                  value: dataset
                - tag: system
                  value: zfs
            - uuid: 8c6095ba13264d6c9a2814cc10615d6e
              name: 'Dataset {#DATASET}: Compression ratio'
              type: DEPENDENT
              key: 'zfs.dataset.compressratio[{#DATASET}]'
              history: 7d
              value_type: FLOAT
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.datasets["{#DATASET}"].properties.compressratio.value'
                  error_handler: DISCARD_VALUE
                - type: MATCHES_REGEX
                  parameters:
                    - '^(?:[0-9]+(?:\.[0-9]+)?|\.[0-9]+)(?:[eE][+-]?[0-9]+)?$'
                  error_handler: DISCARD_VALUE
              master_item:
                key: zfs.native.dataset.list
              tags:
                - tag: component
                  value: dataset
                - tag: system
                  value: zfs
            - uuid: 92fdf88c2b5d4cbf8dab7b535fb830d7
              name: 'Dataset {#DATASET}: quota utilization'
              type: CALCULATED
              key: 'zfs.dataset.quota.pct[{#DATASET}]'
              delay: 5m
              history: 7d
              value_type: FLOAT
              units: '%'
              params: '100*last(//zfs.dataset.used[{#DATASET}])/(last(//zfs.dataset.quota[{#DATASET}])+(last(//zfs.dataset.quota[{#DATASET}])=0))*(last(//zfs.dataset.quota[{#DATASET}])>0)'
              description: |
                0 means quota not configured; this is not a quota capacity indicator for unlimited datasets.
                
                Calculated from the existing used and quota items; returns 0 for unlimited quota (quota=0).
              preprocessing:
                - type: MATCHES_REGEX
                  parameters:
                    - '^(?:[0-9]+(?:\.[0-9]+)?|\.[0-9]+)(?:[eE][+-]?[0-9]+)?$'
                  error_handler: DISCARD_VALUE
              tags:
                - tag: component
                  value: dataset
                - tag: system
                  value: zfs
            - uuid: 61d5527e9e19492098383b15c91c67c5
              name: 'Dataset {#DATASET}: Quota'
              type: DEPENDENT
              key: 'zfs.dataset.quota[{#DATASET}]'
              history: 7d
              units: B
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.datasets["{#DATASET}"].properties.quota.value'
                  error_handler: DISCARD_VALUE
                - type: MATCHES_REGEX
                  parameters:
                    - '^[0-9]+$'
                  error_handler: DISCARD_VALUE
              master_item:
                key: zfs.native.dataset.list
              tags:
                - tag: component
                  value: dataset
                - tag: system
                  value: zfs
            - uuid: 25a3a163d6c146b292724a1c95dd73d6
              name: 'Dataset {#DATASET}: Referenced'
              type: DEPENDENT
              key: 'zfs.dataset.referenced[{#DATASET}]'
              history: 7d
              units: B
              preprocessing:
                - type: JSONPATH
                  parameters:
