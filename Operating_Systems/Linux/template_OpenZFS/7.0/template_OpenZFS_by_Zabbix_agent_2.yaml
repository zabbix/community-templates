          type: DEPENDENT
          key: zfs.arc.hits.rate
          history: 30d
          value_type: FLOAT
          units: ops
          description: 'Rate of the monotonic counter, reset-safe according to Zabbix change-per-second preprocessing.'
          preprocessing:
            - type: CHANGE_PER_SECOND
          master_item:
            key: zfs.arc.hits
          tags:
            - tag: component
              value: arc
            - tag: system
              value: zfs
        - uuid: 48836cfc72f2424b974923ec66415bf0
          name: 'ZFS ARC: hit ratio (cumulative)'
          type: CALCULATED
          key: zfs.arc.hit_ratio
          delay: 5m
          history: 7d
          value_type: FLOAT
          units: '%'
          params: '100*last(//zfs.arc.hits)/(last(//zfs.arc.hits)+last(//zfs.arc.misses)+0.000001)'
          preprocessing:
            - type: MATCHES_REGEX
              parameters:
                - '^(?:[0-9]+(?:\.[0-9]+)?|\.[0-9]+)(?:[eE][+-]?[0-9]+)?$'
              error_handler: DISCARD_VALUE
          tags:
            - tag: component
              value: arc
            - tag: system
              value: zfs
        - uuid: 075e9861f9e343089d59aa6b852c06f1
          name: 'ARC hit ratio (interval)'
          type: CALCULATED
          key: zfs.arc.hit_ratio.interval
          delay: 5m
          history: 30d
          value_type: FLOAT
          units: '%'
          params: '100*last(//zfs.arc.hits.rate)/(last(//zfs.arc.hits.rate)+last(//zfs.arc.misses.rate)+0.000001)'
          description: 'Hit ratio derived from per-second delta counters rather than lifetime totals. 0% during a fully idle interval.'
          tags:
            - tag: component
              value: arc
            - tag: system
              value: zfs
