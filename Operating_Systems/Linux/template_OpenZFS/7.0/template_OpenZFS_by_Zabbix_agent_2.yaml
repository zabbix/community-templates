zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 4b4c333cb9d04b4388a2296977692188
      name: 'Templates/Operating systems'
  templates:
    - uuid: fd1478f765964706af7c991beaf2b17c
      template: 'OpenZFS by Zabbix agent 2'
      name: 'OpenZFS by Zabbix agent 2'
      description: |
        Author: colttt
        
        OpenZFS 2.3 on Linux with Zabbix Agent 2, native zpool/zfs commands and /proc/spl/kstat/zfs.
      vendor:
        name: 'community-templates'
        version: '7.0-1'
      groups:
        - name: 'Templates/Operating systems'
      items:
        - uuid: c3f4862dfcbe4f6282fa5f86608a3a09
          name: 'ZFS: ARC kstat'
          key: 'vfs.file.contents[/proc/spl/kstat/zfs/arcstats]'
          history: '0'
          value_type: TEXT
          tags:
            - tag: component
              value: raw
            - tag: system
              value: zfs
        - uuid: 5563b92ec4124dabbe79df6161cc77ea
