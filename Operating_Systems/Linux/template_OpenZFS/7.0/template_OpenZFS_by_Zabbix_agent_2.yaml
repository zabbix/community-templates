            - uuid: 473ce42d1f0d4819b982f781698fce60
              name: 'Pool {#POOL}: scrub active'
              type: DEPENDENT
              key: 'zfs.pool.scrub.active[{#POOL}]'
              history: 7d
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.pools[?(@.name == "{#POOL}" && @.scan_stats.function == "SCRUB" && @.scan_stats.state == "SCANNING")].length()'
                  error_handler: DISCARD_VALUE
                - type: MATCHES_REGEX
                  parameters:
                    - '^(?:[0-9]+(?:\.[0-9]+)?|\.[0-9]+)(?:[eE][+-]?[0-9]+)?$'
                  error_handler: DISCARD_VALUE
              master_item:
                key: zfs.native.pool.status
              tags:
                - tag: component
                  value: pool
                - tag: system
                  value: zfs
            - uuid: 596fdfbbbe1d42a88bebacb80cb0af4a
              name: 'Pool {#POOL}: scrub age (days)'
              type: DEPENDENT
              key: 'zfs.pool.scrub.age.days[{#POOL}]'
              history: 30d
              value_type: FLOAT
              units: d
              description: 'Age in days of last observed successful scrub; no value when unknown. Updated hourly.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - 'var t=Number(value);if(!isFinite(t)||t<=0)throw "No completed scrub observed";return Math.max(0,(Date.now()/1000-t)/86400);'
                - type: MATCHES_REGEX
                  parameters:
                    - '^(?:[0-9]+(?:\.[0-9]+)?|\.[0-9]+)(?:[eE][+-]?[0-9]+)?$'
                  error_handler: DISCARD_VALUE
              master_item:
                key: 'zfs.pool.scrub.last_known[{#POOL}]'
              tags:
                - tag: component
                  value: scrub
                - tag: system
                  value: zfs
            - uuid: 4fae7057d1154d078b14f9fed668ddc7
              name: 'Pool {#POOL}: most recent scan was a finished scrub (timestamp; 0 otherwise)'
              type: DEPENDENT
              key: 'zfs.pool.scrub.last[{#POOL}]'
              history: 190d
              trends: '0'
              units: unixtime
              description: 'Return the scan end_time only if the latest scan is a successfully finished SCRUB (errors=0); otherwise 0. A later resilver must not overwrite previously observed successful scrub timestamps in the history-window maximum. This source has 190d history for the default 180d lookback. Invalid/missing pool JSON values are discarded rather than synthesized.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.pools["{#POOL}"]'
                  error_handler: DISCARD_VALUE
                - type: JAVASCRIPT
                  parameters:
                    - 'var p = JSON.parse(value);var s = p.scan_stats || {};var end = String(s.end_time == null ? 0 : s.end_time);if (s.function === "SCRUB" && s.state === "FINISHED" && String(s.errors) === "0" && /^[0-9]+$/.test(end) && Number(end) > 0) return end;return "0";'
                - type: MATCHES_REGEX
                  parameters:
                    - '^[0-9]+$'
                  error_handler: DISCARD_VALUE
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: zfs.native.pool.status
              tags:
                - tag: component
                  value: pool
                - tag: system
                  value: zfs
            - uuid: 5a60f70232a24e8f829cee60bbf2a84c
              name: 'Pool {#POOL}: last observed completed scrub'
              type: CALCULATED
              key: 'zfs.pool.scrub.last_known[{#POOL}]'
              delay: 1h
              history: 30d
              units: unixtime
              params: 'max(//zfs.pool.scrub.last[{#POOL}],{$ZFS.SCRUB.LOOKBACK})'
              description: 'Maximum observed completed SCRUB end_time in lookback window. Zero indicates none observed, not proof that no scrub has ever run. Retains successful scrub evidence across later RESILVER scans and avoids host-side state files.'
              tags:
                - tag: component
                  value: scrub
                - tag: system
                  value: zfs
              trigger_prototypes:
                - uuid: ddb460cabaeb459784439cc20286d51b
                  expression: 'max(/OpenZFS by Zabbix agent 2/zfs.pool.scrub.last_known[{#POOL}],1d)=0 and count(/OpenZFS by Zabbix agent 2/zfs.pool.scrub.last_known[{#POOL}],1d)>=24'
                  name: 'Pool {#POOL}: no completed scrub observed by Zabbix (history unknown)'
                  priority: INFO
                  description: 'A full day of hourly calculated samples contains no known successful scrub. This is an observation gap, not proof that the pool was never scrubbed. Common after linking the template while a resilver is already active. Resolves after observing a completed scrub.'
                  tags:
                    - tag: component
                      value: scrub
                    - tag: scope
                      value: notice
                    - tag: system
                      value: zfs
            - uuid: b084e356225f48faadaa8eadec1c7291
              name: 'Pool {#POOL}: Size'
              type: DEPENDENT
              key: 'zfs.pool.size[{#POOL}]'
              history: 7d
              units: B
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.pools["{#POOL}"].properties.size.value'
                  error_handler: DISCARD_VALUE
                - type: MATCHES_REGEX
                  parameters:
                    - '^[0-9]+$'
                  error_handler: DISCARD_VALUE
              master_item:
                key: zfs.native.pool.list
              tags:
                - tag: component
                  value: pool
                - tag: system
                  value: zfs
            - uuid: 82e806b795754f45a2f72497edf0ae8f
              name: 'Pool {#POOL}: hot spares in use'
              type: DEPENDENT
              key: 'zfs.pool.spare.inuse[{#POOL}]'
              history: 7d
              description: 'Count of top-level, class=spare disk VDEVs with state=INUSE (one entry per physical hot spare; not the parent spare-* virtual VDEV).'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.pools["{#POOL}"].vdevs[?(@.vdev_type == "disk" && @.class == "spare" && @.state == "INUSE")].length()'
                  error_handler: DISCARD_VALUE
                - type: MATCHES_REGEX
                  parameters:
                    - '^(?:[0-9]+(?:\.[0-9]+)?|\.[0-9]+)(?:[eE][+-]?[0-9]+)?$'
                  error_handler: DISCARD_VALUE
              master_item:
                key: zfs.native.pool.status
              tags:
                - tag: component
                  value: pool
                - tag: system
                  value: zfs
              trigger_prototypes:
                - uuid: ddfeba5de7754a2e895dbdba64c09237
                  expression: 'last(/OpenZFS by Zabbix agent 2/zfs.pool.spare.inuse[{#POOL}])>0'
                  name: 'Pool {#POOL}: hot spare in use'
                  priority: WARNING
                  description: 'At least one hot spare is active. Replacement/reintegration should be checked; an INUSE spare is not by itself a failed device.'
                  tags:
                    - tag: component
                      value: pool
                    - tag: system
                      value: zfs
            - uuid: 4e6aaead445042c0b8c00da76553c222
              name: 'Pool {#POOL}: spare replacement groups'
              type: DEPENDENT
              key: 'zfs.pool.spare.replacing[{#POOL}]'
              history: 7d
              description: 'Number of active spare-* virtual replacement groups, including resilvering replacement groups.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.pools["{#POOL}"].vdevs[?(@.vdev_type == "spare")].length()'
                  error_handler: DISCARD_VALUE
                - type: MATCHES_REGEX
                  parameters:
                    - '^(?:[0-9]+(?:\.[0-9]+)?|\.[0-9]+)(?:[eE][+-]?[0-9]+)?$'
                  error_handler: DISCARD_VALUE
              master_item:
                key: zfs.native.pool.status
              tags:
                - tag: component
                  value: pool
                - tag: system
                  value: zfs
            - uuid: 0e0778ee740d463a8f50e71f62a37bb3
              name: 'Pool {#POOL}: state'
              type: DEPENDENT
              key: 'zfs.pool.state[{#POOL}]'
              history: 7d
              value_type: TEXT
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.pools["{#POOL}"].state'
                  error_handler: DISCARD_VALUE
              master_item:
                key: zfs.native.pool.status
              tags:
                - tag: component
                  value: pool
                - tag: system
                  value: zfs
              trigger_prototypes:
                - uuid: 7d4e9a87a702476785022b6313b0ef76
                  expression: 'last(/OpenZFS by Zabbix agent 2/zfs.pool.state[{#POOL}])<>"ONLINE"'
                  name: 'Pool {#POOL}: not ONLINE'
                  priority: HIGH
                  tags:
                    - tag: system
                      value: zfs
          trigger_prototypes:
            - uuid: ae9ca48230884df4ab1f2edd269357bb
              expression: 'last(/OpenZFS by Zabbix agent 2/zfs.pool.resilver.active[{#POOL}])=1 and last(/OpenZFS by Zabbix agent 2/zfs.pool.scan.elapsed.seconds[{#POOL}])>{$ZFS.RESILVER.MAXDURATION}'
              name: 'Pool {#POOL}: resilver has run longer than {$ZFS.RESILVER.MAXDURATION}'
              priority: INFO
              description: 'Default threshold is seven days; capacity and bandwidth determine normal resilver duration.'
              tags:
                - tag: component
                  value: scrub
                - tag: system
                  value: zfs
            - uuid: 18b5cdeb7df142a2bebbd97b8342c285
              expression: 'last(/OpenZFS by Zabbix agent 2/zfs.pool.resilver.active[{#POOL}])=1 and count(/OpenZFS by Zabbix agent 2/zfs.pool.scan.issued.delta[{#POOL}],{$ZFS.SCAN.STALL.WINDOW})>=6 and max(/OpenZFS by Zabbix agent 2/zfs.pool.scan.issued.delta[{#POOL}],{$ZFS.SCAN.STALL.WINDOW})=min(/OpenZFS by Zabbix agent 2/zfs.pool.scan.issued.delta[{#POOL}],{$ZFS.SCAN.STALL.WINDOW})'
              name: 'Pool {#POOL}: running resilver makes no scan progress for {$ZFS.SCAN.STALL.WINDOW}'
              priority: WARNING
              description: 'No change in issued bytes across the configured window. Large pools or paused I/O can legitimately show limited progress; adjust the threshold.'
              tags:
                - tag: component
                  value: scrub
                - tag: system
                  value: zfs
            - uuid: ab70ba89c47b44319e682199c6104278
              expression: 'last(/OpenZFS by Zabbix agent 2/zfs.pool.scrub.last_known[{#POOL}])>0 and now()-last(/OpenZFS by Zabbix agent 2/zfs.pool.scrub.last_known[{#POOL}])>{$ZFS.SCRUB.MAXAGE} and last(/OpenZFS by Zabbix agent 2/zfs.pool.scrub.active[{#POOL}])=0 and last(/OpenZFS by Zabbix agent 2/zfs.pool.resilver.active[{#POOL}])=0'
              name: 'Pool {#POOL}: scrub overdue (older than {$ZFS.SCRUB.MAXAGE}s)'
              priority: WARNING
              description: 'Last observed finished scrub is older than the configured age. Suppressed while a scrub or resilver is running. Zabbix retains scan observations for the lookback window. This does not infer undocumented history.'
              tags:
                - tag: component
                  value: scrub
                - tag: scope
                  value: notice
                - tag: system
                  value: zfs
          master_item:
            key: zfs.native.pool.list
          lld_macro_paths:
            - lld_macro: '{#POOL}'
              path: $.name
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.pools.*'
        - uuid: 3c73bc51060d47c39cbc25f894775f37
          name: 'ZFS vdev discovery'
          type: DEPENDENT
