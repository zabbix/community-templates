zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: a571c0d144b14fd4a87a9d9b2aa9fcd6
      name: Templates/Applications
  templates:
    - uuid: 2979f674222a49aebd5e344b7ce1cc6a
      template: 'APP Discovery DHCP scopes'
      name: 'APP Discovery DHCP scopes'
      description: |
        Microsoft DHCP Server (Windows Server 2012 / 2016 / 2019 / 2022) monitoring via Zabbix agent (active).
        - DHCP Server service state
        - LLD of all IPv4 scopes: free / in use / reserved / pending addresses, % in use, failover partner statistics
        - LLD of super scopes: available / in use addresses, % in use, number of scopes
        
        Requirements: Zabbix 7.4+, Zabbix agent (active) with the PowerShell scripts and UserParameters from the repository.
        For CPU / memory / disk monitoring link the official template 'Windows by Zabbix agent active'.
        Source: https://github.com/DuprTECH/Zabbix-Microsoft-DHCP-Server-2012-2016-2019
        Contact / custom work: info@duprtech.sk
      groups:
        - name: Templates/Applications
      items:
        - uuid: 51a00b069b1743f9af1c7c6f277b31e5
          name: 'DHCP Server service state'
          type: ZABBIX_ACTIVE
          key: 'service.info["DHCPServer",state]'
          history: 30d
          description: 'State of the Windows service DHCPServer.'
          valuemap:
            name: 'Windows service state'
          tags:
            - tag: Application
              value: 'DHCP Server'
          triggers:
            - uuid: 24feeecccfcc4b01b2ba617e6463c0fa
              expression: 'min(/APP Discovery DHCP scopes/service.info["DHCPServer",state],#3)<>0'
              name: 'DHCP Server service is not running'
              opdata: 'State: {ITEM.LASTVALUE1}'
              priority: HIGH
              description: 'The DHCPServer service has not been running for the last 3 checks. Clients cannot get IP addresses from this server.'
      discovery_rules:
        - uuid: d6b587151af649e9a3d3a64506f475d6
          name: 'DHCP Scopes'
          type: ZABBIX_ACTIVE
          key: DHCPv4LLD
          delay: 1h
          timeout: 30s
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          item_prototypes:
            - uuid: 2f605e1d8f7c4e44821d31428ee77b49
              name: 'DHCP Scope {#SSCOPENAME} -> {#SCOPENAME} [{#SCOPENETWORK}] - Addresses Free On Partner Server'
              type: DEPENDENT
              key: 'DHCPv4ScopeStats.AddressesFreeOnPartnerServer[{#SCOPENETWORK}]'
              history: 30d
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.AddressesFreeOnPartnerServer
                - type: STR_REPLACE
                  parameters:
                    - 'null'
                    - '0'
              master_item:
                key: 'DHCPv4ScopeStats[{#SCOPENETWORK}]'
              tags:
                - tag: Application
                  value: 'DHCP Server'
            - uuid: aaaac08a678043f48ae4711a5fef33c5
              name: 'DHCP Scope {#SSCOPENAME} -> {#SCOPENAME} [{#SCOPENETWORK}] - Addresses Free On This Server'
              type: DEPENDENT
              key: 'DHCPv4ScopeStats.AddressesFreeOnThisServer[{#SCOPENETWORK}]'
              history: 30d
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.AddressesFreeOnThisServer
                - type: STR_REPLACE
                  parameters:
                    - 'null'
                    - '0'
              master_item:
                key: 'DHCPv4ScopeStats[{#SCOPENETWORK}]'
              tags:
                - tag: Application
                  value: 'DHCP Server'
            - uuid: afa4ffbc1c11490a9672c0530a45511c
              name: 'DHCP Scope {#SSCOPENAME} -> {#SCOPENAME} [{#SCOPENETWORK}] - AddressesFree'
              type: DEPENDENT
              key: 'DHCPv4ScopeStats.AddressesFree[{#SCOPENETWORK}]'
              history: 30d
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.AddressesFree
              master_item:
                key: 'DHCPv4ScopeStats[{#SCOPENETWORK}]'
              tags:
                - tag: Application
                  value: 'DHCP Server'
            - uuid: 10601b1bba8344b1812ac2d173c7365d
              name: 'DHCP Scope {#SSCOPENAME} -> {#SCOPENAME} [{#SCOPENETWORK}] - Addresses In Use On Partner Server'
              type: DEPENDENT
              key: 'DHCPv4ScopeStats.AddressesInUseOnPartnerServer[{#SCOPENETWORK}]'
              history: 30d
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.AddressesInUseOnPartnerServer
                - type: STR_REPLACE
                  parameters:
                    - 'null'
                    - '0'
              master_item:
                key: 'DHCPv4ScopeStats[{#SCOPENETWORK}]'
              tags:
                - tag: Application
                  value: 'DHCP Server'
            - uuid: 9586c6acf9474555aef0132b741b531c
              name: 'DHCP Scope {#SSCOPENAME} -> {#SCOPENAME} [{#SCOPENETWORK}] - Addresses In Use On This Server'
              type: DEPENDENT
              key: 'DHCPv4ScopeStats.AddressesInUseOnThisServer[{#SCOPENETWORK}]'
              history: 30d
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.AddressesInUseOnThisServer
                - type: STR_REPLACE
                  parameters:
                    - 'null'
                    - '0'
              master_item:
                key: 'DHCPv4ScopeStats[{#SCOPENETWORK}]'
              tags:
                - tag: Application
                  value: 'DHCP Server'
            - uuid: 3f906f9ee4a441f484930dd821366695
              name: 'DHCP Scope {#SSCOPENAME} -> {#SCOPENAME} [{#SCOPENETWORK}] - All IP (except the excluded and reserved)'
              type: CALCULATED
              key: 'DHCPv4ScopeStats.Allip[{#SCOPENETWORK}]'
              delay: 30m
              history: 30d
              params: 'last(//DHCPv4ScopeStats.Free[{#SCOPENETWORK}])+last(//DHCPv4ScopeStats.InUse[{#SCOPENETWORK}])'
              tags:
                - tag: Application
                  value: 'DHCP Server'
            - uuid: c558b5526b054022aa4106522451db56
              name: 'DHCP Scope {#SSCOPENAME} -> {#SCOPENAME} [{#SCOPENETWORK}] - Free'
              type: DEPENDENT
              key: 'DHCPv4ScopeStats.Free[{#SCOPENETWORK}]'
              history: 30d
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.Free
              master_item:
                key: 'DHCPv4ScopeStats[{#SCOPENETWORK}]'
              tags:
                - tag: Application
                  value: 'DHCP Server'
            - uuid: 3e9a44b2eb3f466aaf9a6ec732b2654d
              name: 'DHCP Scope {#SSCOPENAME} -> {#SCOPENAME} [{#SCOPENETWORK}] - InUse'
              type: DEPENDENT
              key: 'DHCPv4ScopeStats.InUse[{#SCOPENETWORK}]'
              history: 30d
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.InUse
              master_item:
                key: 'DHCPv4ScopeStats[{#SCOPENETWORK}]'
              tags:
                - tag: Application
                  value: 'DHCP Server'
            - uuid: 1b8baa6a2fcf4315be3ce3f5c9036114
              name: 'DHCP Scope {#SSCOPENAME} -> {#SCOPENAME} [{#SCOPENETWORK}] - Pending'
              type: DEPENDENT
              key: 'DHCPv4ScopeStats.Pending[{#SCOPENETWORK}]'
              history: 30d
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.Pending
              master_item:
                key: 'DHCPv4ScopeStats[{#SCOPENETWORK}]'
              tags:
                - tag: Application
                  value: 'DHCP Server'
            - uuid: 6470a06f8b724164aa6e46859615fccd
              name: 'DHCP Scope {#SSCOPENAME} -> {#SCOPENAME} [{#SCOPENETWORK}] - PercentageInUse'
              type: DEPENDENT
              key: 'DHCPv4ScopeStats.PercentageInUse[{#SCOPENETWORK}]'
              history: 30d
              value_type: FLOAT
              units: '%'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.PercentageInUse
              master_item:
                key: 'DHCPv4ScopeStats[{#SCOPENETWORK}]'
              tags:
                - tag: Application
                  value: 'DHCP Server'
              trigger_prototypes:
                - uuid: 1cb6c311b79e4e1abbfb23219b3550c8
                  expression: 'last(/APP Discovery DHCP scopes/DHCPv4ScopeStats.PercentageInUse[{#SCOPENETWORK}])>{$DHCP_SCOPE_USAGE_WARN}'
                  name: 'DHCP Scope {#SSCOPENAME} -> {#SCOPENAME} [{#SCOPENETWORK}] - is running out of free addresses'
                  opdata: 'In use: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: 'More than {$DHCP_SCOPE_USAGE_WARN}% of the scope is in use. New clients may not get an IP address.'
            - uuid: ca060042d515425cad5d0b65fefc3c64
              name: 'DHCP Scope {#SSCOPENAME} -> {#SCOPENAME} [{#SCOPENETWORK}] - Reserved'
              type: DEPENDENT
              key: 'DHCPv4ScopeStats.Reserved[{#SCOPENETWORK}]'
              history: 30d
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.Reserved
              master_item:
                key: 'DHCPv4ScopeStats[{#SCOPENETWORK}]'
              tags:
                - tag: Application
                  value: 'DHCP Server'
            - uuid: a42f3ff6f0234b68af6657eefb3b6d7c
              name: 'DHCP Scope {#SSCOPENAME} -> {#SCOPENAME} [{#SCOPENETWORK}] - json object'
              type: ZABBIX_ACTIVE
              key: 'DHCPv4ScopeStats[{#SCOPENETWORK}]'
              delay: 30m
              history: '0'
              value_type: TEXT
              timeout: 30s
              description: 'Raw output of Get-DhcpServerv4ScopeStatistics (JSON). All scope items are taken from this one.'
              tags:
                - tag: Application
                  value: 'DHCP Server'
          trigger_prototypes:
            - uuid: 6f0427e749d748aea62e44e14b2534e3
              expression: 'last(/APP Discovery DHCP scopes/DHCPv4ScopeStats.Free[{#SCOPENETWORK}])=0 and last(/APP Discovery DHCP scopes/DHCPv4ScopeStats.InUse[{#SCOPENETWORK}])=0 and last(/APP Discovery DHCP scopes/DHCPv4ScopeStats.Pending[{#SCOPENETWORK}])=0 and last(/APP Discovery DHCP scopes/DHCPv4ScopeStats.Reserved[{#SCOPENETWORK}])=0'
              name: 'DHCP Scope {#SSCOPENAME} -> {#SCOPENAME} [{#SCOPENETWORK}] - Not used IP pool'
              description: 'The scope has no free, used, pending or reserved addresses (scope inactive or misconfigured). Disabled by default.'
              status: DISABLED
              priority: INFO
              manual_close: 'YES'
          graph_prototypes:
            - uuid: ebae26e4aa4047748614a388258ea256
              name: 'DHCP Scope {#SSCOPENAME} -> {#SCOPENAME} [{#SCOPENETWORK}]'
              ymin_type_1: FIXED
              graph_items:
                - sortorder: '1'
                  drawtype: GRADIENT_LINE
                  color: '000000'
                  yaxisside: RIGHT
                  item:
                    host: 'APP Discovery DHCP scopes'
                    key: 'DHCPv4ScopeStats.Allip[{#SCOPENETWORK}]'
                - sortorder: '2'
                  drawtype: GRADIENT_LINE
                  color: '787878'
                  yaxisside: RIGHT
                  item:
                    host: 'APP Discovery DHCP scopes'
                    key: 'DHCPv4ScopeStats.Reserved[{#SCOPENETWORK}]'
                - sortorder: '3'
                  drawtype: BOLD_LINE
                  color: 00FF00
                  yaxisside: RIGHT
                  item:
                    host: 'APP Discovery DHCP scopes'
                    key: 'DHCPv4ScopeStats.InUse[{#SCOPENETWORK}]'
                - sortorder: '4'
                  drawtype: DASHED_LINE
                  color: 33691E
                  yaxisside: RIGHT
                  item:
                    host: 'APP Discovery DHCP scopes'
                    key: 'DHCPv4ScopeStats.AddressesInUseOnPartnerServer[{#SCOPENETWORK}]'
                - sortorder: '5'
                  drawtype: FILLED_REGION
                  color: FFBF00
                  yaxisside: RIGHT
                  item:
                    host: 'APP Discovery DHCP scopes'
                    key: 'DHCPv4ScopeStats.Pending[{#SCOPENETWORK}]'
                - sortorder: '6'
                  drawtype: DOTTED_LINE
                  color: 0080FF
                  item:
                    host: 'APP Discovery DHCP scopes'
                    key: 'DHCPv4ScopeStats.PercentageInUse[{#SCOPENETWORK}]'
          lld_macro_paths:
            - lld_macro: '{#SCOPENAME}'
              path: $.Name
            - lld_macro: '{#SCOPENETWORK}'
              path: $.ScopeId.IPAddressToString
            - lld_macro: '{#SSCOPENAME}'
              path: $.SuperscopeName
        - uuid: fe64b89947bc4e6f903baafa88bee885
          name: 'DHCP Super Scopes'
          type: ZABBIX_ACTIVE
          key: DHCPv4SuperScopeStats
          delay: 30m
          timeout: 30s
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          item_prototypes:
            - uuid: ccefc07ea5b4403a9250d0f1a179ddad
              name: 'DHCP Super Scope {#S.SCOPE.NAME} - All IP (except the excluded and reserved)'
              type: CALCULATED
              key: 'DHCPv4SuperScopeStats.allip[{#S.SCOPE.NAME}]'
              delay: 30m
              history: 90d
              params: '{#S.SCOPE.AVAILABLE}+{#S.SCOPE.INUSE}'
              tags:
                - tag: Application
                  value: 'DHCP Server'
            - uuid: 0dff1b5f32264e1facf3e20178ded9e8
              name: 'DHCP Super Scope {#S.SCOPE.NAME} - Available IP'
              type: CALCULATED
              key: 'DHCPv4SuperScopeStats.available[{#S.SCOPE.NAME}]'
              delay: 30m
              history: 90d
              params: '{#S.SCOPE.AVAILABLE}'
              tags:
                - tag: Application
                  value: 'DHCP Server'
            - uuid: 53c12a3a30504ac3b7451b315bff3c34
              name: 'DHCP Super Scope {#S.SCOPE.NAME} - Use IP'
              type: CALCULATED
              key: 'DHCPv4SuperScopeStats.in.use[{#S.SCOPE.NAME}]'
              delay: 30m
              history: 90d
              params: '{#S.SCOPE.INUSE}'
              tags:
                - tag: Application
                  value: 'DHCP Server'
            - uuid: 0908f4f9fe6f476e8cab16dc1cd6c2a6
              name: 'DHCP Super Scope {#S.SCOPE.NAME} - SubScopes'
              type: CALCULATED
              key: 'DHCPv4SuperScopeStats.numscopes[{#S.SCOPE.NAME}]'
              delay: 30m
              history: 90d
              params: '{#S.SCOPE.NUMSCOPES}'
              tags:
                - tag: Application
                  value: 'DHCP Server'
            - uuid: f91b0b2842b340f2bceac0c5b1db8e40
              name: 'DHCP Super Scope {#S.SCOPE.NAME} - % Used IP'
              type: CALCULATED
              key: 'DHCPv4SuperScopeStats.p.inuse[{#S.SCOPE.NAME}]'
              delay: 30m
              history: 90d
              value_type: FLOAT
              units: '%'
              params: '{#S.SCOPE.P.INUSE}'
              tags:
                - tag: Application
                  value: 'DHCP Server'
          graph_prototypes:
            - uuid: 66406e4f40584b65b31306b9b0e09a73
              name: 'DHCP Super Scope {#S.SCOPE.NAME}'
              ymin_type_1: FIXED
              graph_items:
                - sortorder: '1'
                  drawtype: GRADIENT_LINE
                  color: '000000'
                  yaxisside: RIGHT
                  item:
                    host: 'APP Discovery DHCP scopes'
                    key: 'DHCPv4SuperScopeStats.allip[{#S.SCOPE.NAME}]'
                - sortorder: '2'
                  drawtype: BOLD_LINE
                  color: 00FF00
                  yaxisside: RIGHT
                  item:
                    host: 'APP Discovery DHCP scopes'
                    key: 'DHCPv4SuperScopeStats.in.use[{#S.SCOPE.NAME}]'
                - sortorder: '3'
                  drawtype: DOTTED_LINE
                  color: 00BFFF
                  item:
                    host: 'APP Discovery DHCP scopes'
                    key: 'DHCPv4SuperScopeStats.p.inuse[{#S.SCOPE.NAME}]'
                - sortorder: '4'
                  drawtype: DASHED_LINE
                  color: F7941D
                  yaxisside: RIGHT
                  item:
                    host: 'APP Discovery DHCP scopes'
                    key: 'DHCPv4SuperScopeStats.numscopes[{#S.SCOPE.NAME}]'
          description: 'Values of super scope items are taken from the discovery data, so they refresh with every discovery run (30 min).'
          lld_macro_paths:
            - lld_macro: '{#S.SCOPE.AVAILABLE}'
              path: $.Available
            - lld_macro: '{#S.SCOPE.INUSE}'
              path: $.InUse
            - lld_macro: '{#S.SCOPE.NAME}'
              path: $.Name
            - lld_macro: '{#S.SCOPE.NUMSCOPES}'
              path: $.NumScopes
            - lld_macro: '{#S.SCOPE.P.INUSE}'
              path: $.PercentageInUse
      macros:
        - macro: '{$DHCP_SCOPE_USAGE_WARN}'
          value: '97'
          description: 'Scope usage threshold (%)'
      valuemaps:
        - uuid: 61812c2ca072477186542b10dbde78d4
          name: 'Windows service state'
          mappings:
            - value: '0'
              newvalue: Running
            - value: '1'
              newvalue: Paused
            - value: '2'
              newvalue: 'Start pending'
            - value: '3'
              newvalue: 'Pause pending'
            - value: '4'
              newvalue: 'Continue pending'
            - value: '5'
              newvalue: 'Stop pending'
            - value: '6'
              newvalue: Stopped
            - value: '7'
              newvalue: Unknown
            - value: '255'
              newvalue: 'No such service'