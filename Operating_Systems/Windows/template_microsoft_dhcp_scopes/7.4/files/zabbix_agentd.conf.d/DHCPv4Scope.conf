# Microsoft DHCP Server monitoring - https://github.com/DuprTECH/Zabbix-Microsoft-DHCP-Server-2012-2016-2019
# Change the path if your agent is installed elsewhere (for example C:\Program Files\Zabbix Agent 2)
UserParameter=DHCPv4LLD,powershell -NoProfile -ExecutionPolicy Bypass -File "C:\Program Files\Zabbix Agent\scripts\DHCPv4ScopesLLD.ps1"
UserParameter=DHCPv4ScopeStats[*],powershell -NoProfile -ExecutionPolicy Bypass -File "C:\Program Files\Zabbix Agent\scripts\DHCPv4ScopeStats.ps1" "$1"
UserParameter=DHCPv4SuperScopeStats,powershell -NoProfile -ExecutionPolicy Bypass -File "C:\Program Files\Zabbix Agent\scripts\DHCPv4SuperScopeStats.ps1"