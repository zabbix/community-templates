      macros:
        - macro: '{$PATCH.CHECK.CMD}'
          value: /usr/local/bin/zbx-patch-linux.sh
          description: 'Command of the item "Patch - Run update check". Override on Windows hosts (see the item description).'
        - macro: '{$PATCH.LASTUPDATE.MAXAGE}'
          value: 45d
          description: 'Alert when no updates were installed for this time and updates are pending (trigger disabled by default)'
        - macro: '{$PATCH.NODATA}'
          value: 2d
          description: 'Alert when the check script sends no data for this time'
        - macro: '{$PATCH.REBOOT.MAXAGE}'
          value: 7d
          description: 'Alert when a reboot is pending for this time'
