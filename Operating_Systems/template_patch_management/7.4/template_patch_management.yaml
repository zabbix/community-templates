zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 846977d1dfed4968bc5f8bdb363285bc
      name: 'Templates/Operating systems'
  templates:
    - uuid: 5063f5f454c64dbd9a3f7fe7f79ca809
      template: 'PatchBix - Patch management all OS'
      name: 'PatchBix - Patch management all OS'
      description: |
        PatchBix - Zabbix patch management. OS independent patch management monitoring for Windows and Linux: one template, the same keys (patch.*) on all hosts,
        so dashboards, triggers and reports work the same for every OS.
        Update management fully controlled from Zabbix, no extra port: the host macros {$PATCH.CONF.WINDOW} (maintenance
        window and update types), {$PATCH.CONF.AUTO_UPDATE} (automatic updates on / off), {$PATCH.CONF.EXCLUDE} (excluded
        updates) and {$PATCH.CONF.REBOOT} (reboot allowed) are delivered by the Zabbix agent; the check script installs the
        updates in the window and reports back over the existing agent / zabbix_sender connection to the server or proxy.
        - Pending updates: all, security, critical, bugfix, enhancement, kernel, held / hidden, severity (critical / important / moderate / low)
        - OS specific categories: definition, service packs, update rollups, drivers, upgrades (Windows), kernel (Linux); 0 on the other OS
        - Pending updates list and recent update history (log of installed / upgraded / removed updates)
        - Reboot required and its reason, last reboot time, uptime
        - Last update installed (detected on the host) and its patch day, last install run (sent by the install job / Ansible)
        - OS name and version / kernel, update source and its availability, automatic updates, Windows Update service
        - Last check time, age, duration and result
        - Patch settings of the host (patchbix.conf): maintenance window (when and which update types the
          check script installs) and the next window, excluded updates (and how many pending updates they match), reboot allowed
        - Host dashboard 'PatchBix - Patch management': overview, categories and severity, installs and history

        Data are sent with zabbix_sender (trapper items) by the check scripts patchbix-windows.ps1 and patchbix-linux.sh,
        started by Task Scheduler / cron or by the Zabbix agent. Values that can't be determined on an OS are not sent
        (for example severity on Ubuntu or on Debian without debsecan), so the item stays empty.
        Requirements: Zabbix 7.4+, zabbix_sender on the hosts.
        Source: https://github.com/DuprTECH/PatchBix-Zabbix-Patch-Management-Windows-Linux
        Contact / custom work: info@duprtech.sk
      groups:
        - name: 'Templates/Operating systems'
      items:
        - uuid: 3c322b45aa3f40058adb08151780e173
          name: 'Patch - Run update check'
          key: 'system.run[{$PATCH.CHECK.CMD},nowait]'
          delay: '12h;3h/1-5,07:00-17:00'
          history: 1d
          trends: '0'
          status: DISABLED
          description: |
            Starts the check script through the Zabbix agent (needs AllowKey=system.run[*] in the agent config).
            Disabled by default: running the script from cron (as root) / Task Scheduler (as SYSTEM) is recommended.
            The command is in the macro {$PATCH.CHECK.CMD} (default: Linux). On Windows hosts set the host macro to:
            start /low powershell -NoProfile -ExecutionPolicy Bypass -File "C:\Program Files\Zabbix Agent 2\scripts\patchbix-windows.ps1"
          tags:
            - tag: component
              value: check
        - uuid: 0bac5250c8254561bae4dd00d6c0a7af
          name: 'Patch - Last check time'
          type: TRAP
          key: patch.check.timestamp
          allowed_hosts: '0.0.0.0/0,::/0'
          history: 90d
          trends: '0'
          units: unixtime
          description: 'Time of the last update check'
          tags:
            - tag: component
              value: check
          triggers:
            - uuid: 2c28f0b2746643c696ab6a3a66b52c3b
              expression: 'nodata(/PatchBix - Patch management all OS/patch.check.timestamp,{$PATCH.NODATA})=1'
              name: 'No update check data for {$PATCH.NODATA}'
              status: DISABLED
              priority: WARNING
              description: 'The update check script has not sent any data. Check that it runs (cron / Task Scheduler / agent item) and that zabbix_sender can reach the Zabbix server / proxy.'
              tags:
                - tag: service
                  value: patch-management
                - tag: scope
                  value: availability
                - tag: UpdatePlan
                  value: '{INVENTORY.TYPE.FULL}'
        - uuid: a0eb93727ce24bfaaa7b00afedbbb607
          name: 'Patch - Last check age'
          type: CALCULATED
          key: patch.check.age
          delay: 5m
          history: 30d
          trends: '0'
          units: uptime
          params: 'now()-last(//patch.check.timestamp)'
          description: 'Time since the last update check'
          tags:
            - tag: component
              value: check
        - uuid: eee9758039be426d8873849cc9406ba6
          name: 'Patch - Check duration'
          type: TRAP
          key: patch.check.duration
          allowed_hosts: '0.0.0.0/0,::/0'
          history: 30d
          trends: 90d
          units: s
          description: 'How long the last update check took'
          tags:
            - tag: component
              value: check
        - uuid: 2bcba909a04d4553b3852925cb82bf25
          name: 'Patch - Check result'
          type: TRAP
          key: patch.check.result
          allowed_hosts: '0.0.0.0/0,::/0'
          history: 30d
          value_type: CHAR
          trends: '0'
          description: 'Result of the last update check: OK or ERROR: <reason>. The update counts are not sent when the check fails.'
          tags:
            - tag: component
              value: check
          triggers:
            - uuid: 7b8d1cbf82404350a83dabe0adff5cd5
              expression: 'find(/PatchBix - Patch management all OS/patch.check.result,,"regexp","^ERROR")=1'
              name: 'Update check failed'
              opdata: '{ITEM.LASTVALUE1}'
              priority: WARNING
              tags:
                - tag: service
                  value: patch-management
                - tag: scope
                  value: availability
                - tag: UpdatePlan
                  value: '{INVENTORY.TYPE.FULL}'
        - uuid: 95178a1f069c419bb196960c80e99458
          name: 'Patch - OS family'
          type: TRAP
          key: patch.os
          allowed_hosts: '0.0.0.0/0,::/0'
          history: 30d
          value_type: CHAR
          trends: '0'
          description: 'Windows or Linux'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 6h
          tags:
            - tag: component
              value: system
        - uuid: 3d29f30e0c4b4cbf9bb1fdcf5d702447
          name: 'Patch - OS name'
          type: TRAP
          key: patch.os.name
          allowed_hosts: '0.0.0.0/0,::/0'
          history: 90d
          value_type: CHAR
          trends: '0'
          description: 'For example Windows Server 2022 Standard, Ubuntu 24.04.1 LTS, Rocky Linux 9.4 (Blue Onyx)'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 6h
          tags:
            - tag: component
              value: system
        - uuid: 86ed0dc195d5444d9996df2acc79fb17
          name: 'Patch - OS version / kernel'
          type: TRAP
          key: patch.os.version
          allowed_hosts: '0.0.0.0/0,::/0'
          history: 365d
          value_type: CHAR
          trends: '0'
          description: 'Windows: build with the update revision (UBR), for example 10.0.20348.2700 (21H2). Linux: running kernel (uname -r). Shows the real patch level.'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 6h
          tags:
            - tag: component
              value: system
        - uuid: c7500b9ded1242e3b26eca02d076e31d
          name: 'Patch - Check script version'
          type: TRAP
          key: patch.script.version
          allowed_hosts: '0.0.0.0/0,::/0'
          history: 90d
          value_type: CHAR
          trends: '0'
          description: 'Version of the check script on the host (patchbix-linux.sh / patchbix-windows.ps1), for example 26.10.10. Shows the hosts with an old script.'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 6h
          tags:
            - tag: component
              value: system
        - uuid: 5522af96d6a14d0f8f27590e7ffa7fc3
          name: 'Patch - Update source'
          type: TRAP
          key: patch.source
          allowed_hosts: '0.0.0.0/0,::/0'
          history: 30d
          value_type: CHAR
          trends: '0'
          description: 'Windows: Windows Update, or WSUS <server> when the policy UseWUServer is set. Linux: package manager (apt, dnf, yum).'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 6h
          tags:
            - tag: component
              value: system
        - uuid: 9e1541a27a26400e892f8bbec2ba84ab
          name: 'Patch - Update source availability'
          type: TRAP
          key: patch.source.available
          allowed_hosts: '0.0.0.0/0,::/0'
          history: 90d
          trends: 365d
          description: |
            Windows: the update search succeeded (1) or not (0).
            Linux: package lists could be refreshed from the repositories (1) or not (0). On apt sent only when the script runs as root.
          valuemap:
            name: Availability
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: ad7440cf6ec9465ab7d18c7d50e95431
              expression: 'last(/PatchBix - Patch management all OS/patch.source.available)=0'
              name: 'Update source is unavailable'
              priority: WARNING
              description: 'Windows: Windows Update search failed. Linux: a repository or proxy is unavailable.'
              tags:
                - tag: service
                  value: patch-management
                - tag: scope
                  value: availability
                - tag: UpdatePlan
                  value: '{INVENTORY.TYPE.FULL}'
        - uuid: 6e5c974912164d03b4d549dc6c72b4b9
          name: 'Patch - Automatic updates'
          type: TRAP
          key: patch.autoupdate
          allowed_hosts: '0.0.0.0/0,::/0'
          history: 90d
          trends: 365d
          description: |
            How updates are installed automatically (the exact setting is in "Patch - Automatic updates detail"):
            0 - disabled, nothing installs updates automatically (Windows: also notify / download only - AUOptions 2, 3, 7,
                NoAutoUpdate=1, the service disabled, or no policy on Windows Server)
            1 - OS, security updates only (Linux: unattended-upgrades with the default security origins, dnf-automatic upgrade_type = security, yum-cron update_cmd = security)
            2 - OS, all updates (Linux: unattended-upgrades with the -updates origin, dnf-automatic / yum-cron default;
                Windows: policy AUOptions 4 "download and install", or no policy on a Windows client; with WSUS only the approved updates)
            3 - patch management: a maintenance window and AUTO_UPDATE="true" - the check script installs the update types of the window in it
            4 - OS and patch management both - choose one of them
            5 - Azure Update Manager (Azure Arc): scheduled patching (maintenance configuration in Azure) - a scheduled run of the
                extension LinuxOsUpdateExtension / WindowsOsUpdateExtension in the last 35 days; the detail shows the last run
                (time, classifications, reboot setting, duration, result). Arc with the periodic assessment only doesn't change the value.
            6 - Azure Update Manager and patch management both - choose one of them
            7 - SCCM / ConfigMgr (Windows): the client runs and software updates are enabled in its client settings
                (CCM_SoftwareUpdatesClientConfig.Enabled) - SCCM deploys and installs the updates; the detail shows the site,
                the management point, the deployed updates pending and the next deadline. A client with software updates
                disabled doesn't change the value.
            8 - SCCM and patch management both - choose one of them
          valuemap:
            name: 'Automatic updates'
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: 40e18b5e96bb46d69c9891a3e74dcb98
              expression: 'last(/PatchBix - Patch management all OS/patch.autoupdate)=0'
              name: 'Automatic updates are disabled'
              status: DISABLED
              priority: INFO
              tags:
                - tag: service
                  value: patch-management
                - tag: scope
                  value: notice
            - uuid: 6bb51f7116b44fad9677ff758062d3a3
              expression: 'last(/PatchBix - Patch management all OS/patch.autoupdate)=4 or last(/PatchBix - Patch management all OS/patch.autoupdate)=6 or last(/PatchBix - Patch management all OS/patch.autoupdate)=8'
              name: 'Updates are installed automatically twice (patch management and the OS, Azure Update Manager or SCCM)'
              status: DISABLED
              opdata: '{ITEM.LASTVALUE}'
              priority: WARNING
              description: 'A maintenance window is set (patch management installs the updates) and the automatic updates of the OS (4) or a scheduled patching of Azure Update Manager (6) or SCCM software updates (8) are enabled too - disable one of them (onboarding disables the OS automatic updates; the Azure schedule is in the maintenance configuration of the Arc machine, SCCM in the client settings / deployments).'
              tags:
                - tag: service
                  value: patch-management
                - tag: scope
                  value: notice
        - uuid: bc42cfa332c14978b10113dc377fe8da
          name: 'Patch - Automatic updates detail'
          type: TRAP
          key: patch.autoupdate.detail
          allowed_hosts: '0.0.0.0/0,::/0'
          history: 90d
          value_type: TEXT
          trends: '0'
          description: |
            The exact automatic update setting of the host, for example:
            Windows Update: download only, notify to install (AUOptions 3); WSUS http://wsus:8530 (approved updates only)
            unattended-upgrades: security updates only
            Patch management (maintenance window 'crit+sec * 02:00-03:00'); Windows Update: disabled by policy (NoAutoUpdate=1)
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 6h
          tags:
            - tag: component
              value: system
        - uuid: f389c08f0dee49bf88123d245dac5397
          name: 'Patch - Windows Update service startup type'
          type: TRAP
          key: patch.service.startup
          allowed_hosts: '0.0.0.0/0,::/0'
          history: 90d
          trends: 365d
          description: |
            Windows only: startup type of the Windows Update service (wuauserv), same values as service.info[wuauserv,startup]:
            0 - auto, 1 - auto (delayed), 2 - manual, 3 - disabled, 4 - unknown.
            Manual is the default on Windows 10 / 11 / Server 2016+ (the service is started on demand). Not sent on Linux.
          valuemap:
            name: 'Service startup'
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: 210438bacf314ce0a7b782b1d57c037c
              expression: 'last(/PatchBix - Patch management all OS/patch.service.startup)=3'
              name: 'Windows Update service is disabled'
              priority: WARNING
              tags:
                - tag: service
                  value: patch-management
                - tag: scope
                  value: security
                - tag: UpdatePlan
                  value: '{INVENTORY.TYPE.FULL}'
        - uuid: 1742139b4f344a5ca63d2c990a171c27
          name: 'Patch - Updates: All'
          type: TRAP
          key: patch.updates.all
          allowed_hosts: '0.0.0.0/0,::/0'
          history: 90d
          trends: 365d
          description: 'All pending updates (Windows: updates and drivers, not hidden; Linux: packages to upgrade / install).'
          tags:
            - tag: component
              value: updates
          triggers:
            - uuid: cd1757599ab246c6b0ad060cc2a11f75
              expression: 'last(/PatchBix - Patch management all OS/patch.updates.all)>0'
              name: 'Updates are available'
              opdata: 'Pending: {ITEM.LASTVALUE1}'
              status: DISABLED
              priority: INFO
              tags:
                - tag: service
                  value: patch-management
                - tag: scope
                  value: notice
                - tag: UpdatePlan
                  value: '{INVENTORY.TYPE.FULL}'
        - uuid: 52eb3393cb8b4d59ae46840833e88fbc
          name: 'Patch - Updates: Actionable'
          type: CALCULATED
          key: patch.updates.actionable
          delay: 5m
          history: 90d
          trends: 365d
          params: 'last(//patch.updates.all)-last(//patch.updates.definition)-last(//patch.updates.drivers)'
          description: 'Pending updates without definition updates and drivers (PatchBix does not install drivers, definitions come several times a day). Used by the summary count of hosts with pending updates.'
          tags:
            - tag: component
              value: updates
        - uuid: a7745bb29381434ab2ceef3fcbcfbc16
          name: 'Patch - Updates: Security'
          type: TRAP
          key: patch.updates.security
          allowed_hosts: '0.0.0.0/0,::/0'
          history: 90d
          trends: 365d
          description: |
            Windows: classification Security Updates.
            Linux: packages with a security advisory (dnf / yum updateinfo), on Debian / Ubuntu packages from a *-security suite.
          tags:
            - tag: component
              value: updates
          triggers:
            - uuid: 6124493653dc437fae65c1de79c36373
              expression: 'last(/PatchBix - Patch management all OS/patch.updates.security)>0'
              name: 'Security updates are available'
              status: DISABLED
              opdata: 'Pending: {ITEM.LASTVALUE1}'
              priority: WARNING
              dependencies:
                - name: 'Critical updates are available'
                  expression: 'last(/PatchBix - Patch management all OS/patch.updates.critical)>0'
              tags:
                - tag: service
                  value: patch-management
                - tag: scope
                  value: security
                - tag: UpdatePlan
                  value: '{INVENTORY.TYPE.FULL}'
        - uuid: 16a51e761e874e09a5f7a690348329ec
          name: 'Patch - Updates: Critical'
          type: TRAP
          key: patch.updates.critical
          allowed_hosts: '0.0.0.0/0,::/0'
          history: 90d
          trends: 365d
          description: |
            Windows: classification Critical Updates.
            Linux (dnf / yum): packages with a security advisory of severity Critical.
            Debian: packages with a fixed CVE of urgency high (debsecan, security-tracker.debian.org).
            Not sent on Ubuntu or on Debian without debsecan / access to the security tracker.
          tags:
            - tag: component
              value: updates
          triggers:
            - uuid: 98db03a7811d43cd936f554688d5c7fd
              expression: 'last(/PatchBix - Patch management all OS/patch.updates.critical)>0'
              name: 'Critical updates are available'
              opdata: 'Pending: {ITEM.LASTVALUE1}'
              priority: HIGH
              tags:
                - tag: service
                  value: patch-management
                - tag: scope
                  value: security
                - tag: UpdatePlan
                  value: '{INVENTORY.TYPE.FULL}'
        - uuid: 4045701added435380f29a1816ab993d
          name: 'Patch - Updates: Bugfix'
          type: TRAP
          key: patch.updates.bugfix
          allowed_hosts: '0.0.0.0/0,::/0'
          history: 90d
          trends: 365d
          description: 'Windows: classification Updates. Linux (dnf / yum): packages with a bugfix advisory. Not sent on Debian / Ubuntu.'
          tags:
            - tag: component
              value: updates
        - uuid: 3b0246679f6644b8b83c361b34c0e161
          name: 'Patch - Updates: Enhancement'
          type: TRAP
          key: patch.updates.enhancement
          allowed_hosts: '0.0.0.0/0,::/0'
          history: 90d
          trends: 365d
          description: 'Windows: classification Feature Packs. Linux (dnf / yum): packages with an enhancement advisory. Not sent on Debian / Ubuntu.'
          tags:
            - tag: component
              value: updates
        - uuid: 398dbaf16e8f453d96e455c3f959de11
          name: 'Patch - Updates: Kernel'
          type: TRAP
          key: patch.updates.kernel
          allowed_hosts: '0.0.0.0/0,::/0'
          history: 90d
          trends: 365d
          description: 'Linux: pending kernel packages (linux-image-*, kernel, kernel-core, ...). Windows: 0.'
          tags:
            - tag: component
              value: updates
        - uuid: 0fb10354ab234cf0920669b297e4641f
          name: 'Patch - Updates: Held / hidden'
          type: TRAP
          key: patch.updates.held
          allowed_hosts: '0.0.0.0/0,::/0'
          history: 90d
          trends: 365d
          description: 'Updates excluded from patching. Windows: hidden updates. Linux: packages on hold (apt-mark hold) or version locked (dnf / yum versionlock).'
          tags:
            - tag: component
              value: updates
        - uuid: ec5a5cef74e44f819087582968254768
          name: 'Patch - Updates: Definition'
          type: TRAP
          key: patch.updates.definition
          allowed_hosts: '0.0.0.0/0,::/0'
          history: 90d
          trends: 365d
          description: 'Windows: classification Definition Updates (Microsoft Defender). Linux: 0.'
          tags:
            - tag: component
              value: updates
        - uuid: a10634db4a5f464e9919b2075afef47e
          name: 'Patch - Updates: Service packs'
          type: TRAP
          key: patch.updates.servicepacks
          allowed_hosts: '0.0.0.0/0,::/0'
          history: 90d
          trends: 365d
          description: 'Windows: classification Service Packs. Linux: 0.'
          tags:
            - tag: component
              value: updates
        - uuid: ec7fe0da76a045cb8f417497afe9679b
          name: 'Patch - Updates: Update rollups'
          type: TRAP
          key: patch.updates.updaterollups
          allowed_hosts: '0.0.0.0/0,::/0'
          history: 90d
          trends: 365d
          description: 'Windows: classification Update Rollups. Linux: 0.'
          tags:
            - tag: component
              value: updates
        - uuid: 19003639efde4e5385975c329367ef8a
          name: 'Patch - Updates: Drivers'
          type: TRAP
          key: patch.updates.drivers
          allowed_hosts: '0.0.0.0/0,::/0'
          history: 90d
          trends: 365d
          description: 'Windows: driver updates. Linux: 0.'
          tags:
            - tag: component
              value: updates
        - uuid: 331da9e79f584213b4b5a31609185a30
          name: 'Patch - Updates: Upgrades'
          type: TRAP
          key: patch.updates.upgrades
          allowed_hosts: '0.0.0.0/0,::/0'
          history: 90d
          trends: 365d
          description: 'Windows: classification Upgrades (feature update to a new Windows version). Linux: 0.'
          tags:
            - tag: component
              value: updates
        - uuid: 6bb52eecfc4a43d1b50a6320851d387e
          name: 'Patch - Severity: Critical'
          type: TRAP
          key: patch.updates.severity.critical
          allowed_hosts: '0.0.0.0/0,::/0'
          history: 90d
          trends: 365d
          description: 'Pending updates with severity Critical. Windows: MSRC severity. Linux (dnf / yum): severity of the security advisory. Debian (debsecan): urgency of the fixed CVEs - high = Critical, medium = Important, low = Low (Moderate 0). Not sent on Ubuntu or on Debian without debsecan.'
          tags:
            - tag: component
              value: severity
        - uuid: b7d309b5a2ea40a5a2e28837a5f0810c
          name: 'Patch - Severity: Important'
          type: TRAP
          key: patch.updates.severity.important
          allowed_hosts: '0.0.0.0/0,::/0'
          history: 90d
          trends: 365d
          description: 'Pending updates with severity Important. Windows: MSRC severity. Linux (dnf / yum): severity of the security advisory. Debian (debsecan): urgency of the fixed CVEs - high = Critical, medium = Important, low = Low (Moderate 0). Not sent on Ubuntu or on Debian without debsecan.'
          tags:
            - tag: component
              value: severity
        - uuid: 356dfea92f964d43bf04b62e767e9fdd
          name: 'Patch - Severity: Moderate'
          type: TRAP
          key: patch.updates.severity.moderate
          allowed_hosts: '0.0.0.0/0,::/0'
          history: 90d
          trends: 365d
          description: 'Pending updates with severity Moderate. Windows: MSRC severity. Linux (dnf / yum): severity of the security advisory. Debian (debsecan): urgency of the fixed CVEs - high = Critical, medium = Important, low = Low (Moderate 0). Not sent on Ubuntu or on Debian without debsecan.'
          tags:
            - tag: component
              value: severity
        - uuid: 42e421a55d0d49e196d6b8dee70b986c
          name: 'Patch - Severity: Low'
          type: TRAP
          key: patch.updates.severity.low
          allowed_hosts: '0.0.0.0/0,::/0'
          history: 90d
          trends: 365d
          description: 'Pending updates with severity Low. Windows: MSRC severity. Linux (dnf / yum): severity of the security advisory. Debian (debsecan): urgency of the fixed CVEs - high = Critical, medium = Important, low = Low (Moderate 0). Not sent on Ubuntu or on Debian without debsecan.'
          tags:
            - tag: component
              value: severity
        - uuid: e4db62012fa34d7780eb6c46c3ca1670
          name: 'Patch - Pending updates list'
          type: TRAP
          key: patch.updates.list
          allowed_hosts: '0.0.0.0/0,::/0'
          history: 90d
          value_type: TEXT
          trends: '0'
          description: |
            Pending updates, one per line: [category] [severity] name version
            Windows: [security] [Critical] KB5044281 - 2024-10 Cumulative Update for ...
            Linux:   [security] [Important] openssl-libs 1:3.0.7-28.el9_4
                     [security] openssl 3.0.13-0ubuntu3.3 -> 3.0.13-0ubuntu3.4
          preprocessing:
