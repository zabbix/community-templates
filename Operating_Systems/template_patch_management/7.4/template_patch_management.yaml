      macros:
        - macro: '{$PATCH.CHECK.CMD}'
          value: /usr/local/bin/patchbix-linux.sh
          description: 'Command of the item "Patch - Run update check". Override on Windows hosts (see the item description).'
        - macro: '{$PATCH.CONF.AUTO_UPDATE}'
          value: ''
          description: 'Host setting from Zabbix (overrides AUTO_UPDATE of patchbix.conf): true = the check script installs the update types of the maintenance window in it, false = check only. Empty = patchbix.conf (not set there = false).'
        - macro: '{$PATCH.CONF.EXCLUDE}'
          value: ''
          description: 'Host setting from Zabbix (overrides EXCLUDE of patchbix.conf): updates that are not installed, comma separated (Linux: packages, Windows: KB or a part of the title), % = wildcard (kernel%), none = nothing excluded. Empty = patchbix.conf.'
        - macro: '{$PATCH.CONF.REBOOT}'
          value: ''
          description: 'Host setting from Zabbix (overrides REBOOT of patchbix.conf): true = reboot after updates when needed, false = only report it. Empty = patchbix.conf.'
        - macro: '{$PATCH.CONF.UPDATE_PACKAGE}'
          value: ''
          description: 'Linux: urgent update of these packages, comma separated, % = wildcard (for example openssl, libssl%). The check script updates them at its next automatic run (cron every 15 min) - right away, also outside the maintenance window and without AUTO_UPDATE, once per value; the result goes to the install items (Patch - Last install result). To run the same value again, clear the macro, wait 15 min and set it again. Reboot: {$PATCH.CONF.UPDATE_REBOOT}. Empty = nothing.'
        - macro: '{$PATCH.CONF.UPDATE_REBOOT}'
          value: ''
          description: 'Linux: reboot after {$PATCH.CONF.UPDATE_PACKAGE} when needed: true = right away, false = in the maintenance window where the updates run, after them ({$PATCH.CONF.WINDOW}; without AUTO_UPDATE when the window opens, without a window only reported), never = only report it. Empty = false.'
        - macro: '{$PATCH.CONF.WINDOW}'
          value: ''
          description: 'Host setting from Zabbix (overrides MAINTENANCE_WINDOW of patchbix.conf): when and which updates the check script installs - <types> <day> <HH:MM>-<HH:MM>, comma separated; types all = all updates, crit, sec, kernel (Linux), def (Windows), joined with + (* is not allowed by the agent); day 1-7 = Mon-Sun or Mon..Sun (1-7 = every day), 1-5 or Mon-Fri, 2.3 = 2nd Wednesday, several days joined with + (Tue+Thu = Tuesday and Thursday). Examples: all Wed 03:00-05:00, all Tue+Thu 03:00-05:00, crit+sec 1-7 02:00-03:00. A * in any of the macros makes the agent refuse all of them (Character "*" is not allowed). none = no window. The automatic updates need {$PATCH.CONF.AUTO_UPDATE} = true (or AUTO_UPDATE="true" in patchbix.conf). Empty = patchbix.conf.'
        - macro: '{$PATCH.LASTUPDATE.MAXAGE}'
          value: 30d
          description: 'Alert when no updates were installed for this time and updates are pending'
        - macro: '{$PATCH.NODATA}'
          value: 2d
          description: 'Alert when the check script sends no data for this time'
        - macro: '{$PATCH.REBOOT.MAXAGE}'
          value: 7d
          description: 'Alert when a reboot is pending for this time'
