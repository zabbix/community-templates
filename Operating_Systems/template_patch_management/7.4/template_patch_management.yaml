        - uuid: ffb64cc7f5684d3db0748389742c0dbd
          name: 'Patch - Maintenance window'
          type: TRAP
          key: patch.maintenance.window
          allowed_hosts: '0.0.0.0/0,::/0'
          history: 365d
          value_type: CHAR
          trends: '0'
          description: |
            MAINTENANCE_WINDOW of the host (patchbix.conf or the host macro {$PATCH.CONF.WINDOW}): when and which updates the check
            script installs itself - "[<types>] <day> <HH:MM>-<HH:MM>", for example "* 3 03:00-05:00" (all updates on Wednesday) or
            "crit+sec * 02:00-03:00, * 6 03:00-06:00"; types * = all, crit, sec, kernel (Linux), def (Windows), joined with +;
            days 1-7 = Monday-Sunday or Mon..Sun, several joined with + (Tue+Thu). "-" = no window. The check script installs in the window only with AUTO_UPDATE="true".
            An invalid window is sent with the error in brackets.
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 6h
          tags:
            - tag: component
              value: maintenance
          triggers:
            - uuid: 63dbdcea11774c53896b47ba7335df46
              expression: 'last(/PatchBix - Patch management all OS/patch.maintenance.window)="-"'
              name: 'No maintenance window configured'
              status: DISABLED
              priority: INFO
              description: 'Set MAINTENANCE_WINDOW in patchbix.conf on the host.'
              tags:
                - tag: service
                  value: patch-management
                - tag: scope
                  value: notice
            - uuid: b41743c07d674c97a68914da99090654
              expression: 'find(/PatchBix - Patch management all OS/patch.maintenance.window,,"like","invalid maintenance window")=1'
              name: 'Invalid maintenance window in patchbix.conf'
              priority: WARNING
              description: 'The install job doesn''t install updates on this host until the window is fixed.'
              tags:
                - tag: service
                  value: patch-management
                - tag: scope
                  value: notice
        - uuid: ceca732be9b74adea5b91bfab7489265
          name: 'Patch - Next maintenance window'
          type: TRAP
          key: patch.maintenance.next
          allowed_hosts: '0.0.0.0/0,::/0'
          history: 90d
          trends: '0'
          units: unixtime
          description: 'Start of the next maintenance window (local time of the host). Not sent when no window is set.'
          tags:
            - tag: component
              value: maintenance
        - uuid: 153552099b624c24a0fd216f240a6c5b
          name: 'Patch - Reboot allowed'
          type: TRAP
          key: patch.reboot.allowed
          allowed_hosts: '0.0.0.0/0,::/0'
          history: 90d
          trends: 365d
          description: 'REBOOT from the patch settings of the host (patchbix.conf): 1 - the install job may reboot the host, 0 - it only reports the reboot.'
          valuemap:
            name: Enabled
          tags:
            - tag: component
              value: maintenance
        - uuid: ad3c2ba3f80541e58cde01e4cc0b6876
          name: 'Patch - Auto update'
          type: TRAP
          key: patch.autoupdate.config
          allowed_hosts: '0.0.0.0/0,::/0'
          history: 90d
          trends: 365d
          description: |
            Automatic updates by the check script:
            1 - a maintenance window and AUTO_UPDATE="true": the check script installs the update types of the window itself in it
                (once per window, cron / task every 15 min); the result of the install runs goes to the "Patch install" items,
            0 - check only (default): no window, or AUTO_UPDATE not true - the windows can be set first and turned on later.
          valuemap:
            name: Enabled
          tags:
            - tag: component
              value: maintenance
        - uuid: d22fbcc254a74e6db02d72d09ba28e83
          name: 'Patch - Urgent package update'
          type: TRAP
          key: patch.update.package
          allowed_hosts: '0.0.0.0/0,::/0'
          history: 90d
          value_type: CHAR
          trends: '0'
          description: |
            Linux: packages of the urgent update (UPDATE_PACKAGE, host macro {$PATCH.CONF.UPDATE_PACKAGE}), "-" = none.
            The check script updates them at its next automatic run (cron every 15 min), once per value; the result
            goes to "Patch - Last install result". Sent by the check and after a change of the host macros.
          tags:
            - tag: component
              value: maintenance
        - uuid: d41654b838c04e2c9bb0b3397e4c51c3
          name: 'Patch - Reboot after urgent update'
          type: TRAP
          key: patch.update.reboot
          allowed_hosts: '0.0.0.0/0,::/0'
          history: 90d
          trends: '0'
          description: 'Linux: reboot after the urgent package update when needed (UPDATE_REBOOT, host macro {$PATCH.CONF.UPDATE_REBOOT}): 2 - right away, 1 - in the maintenance window, after its updates (default), 0 - never (only reported).'
          valuemap:
            name: 'Reboot after urgent update'
          tags:
            - tag: component
              value: maintenance
        - uuid: 2e02ba15feeb4746a97faa87d7c4b598
          name: 'Patch - Reboot scheduled (maintenance window)'
          type: TRAP
          key: patch.reboot.scheduled
          allowed_hosts: '0.0.0.0/0,::/0'
          history: 90d
          trends: '0'
          units: unixtime
          description: 'Linux: a reboot left for the maintenance window after the urgent package update (UPDATE_REBOOT false) - start of the window when the host reboots, 0 = none. A reboot in the meantime cancels it.'
          valuemap:
            name: 'Reboot scheduled'
          tags:
            - tag: component
              value: maintenance
        - uuid: 755bc789857b41b2a6389621490d3410
          name: 'Patch - Settings from host macros (agent)'
          type: ZABBIX_ACTIVE
          key: 'patch.config["{$PATCH.CONF.WINDOW}","{$PATCH.CONF.AUTO_UPDATE}","{$PATCH.CONF.EXCLUDE}","{$PATCH.CONF.REBOOT}","{$PATCH.CONF.UPDATE_PACKAGE}","{$PATCH.CONF.UPDATE_REBOOT}"]'
          delay: 5m
          history: 30d
          value_type: CHAR
          trends: '0'
          timeout: 20s
          description: |
            Delivers the host macros {$PATCH.CONF.WINDOW}, {$PATCH.CONF.AUTO_UPDATE}, {$PATCH.CONF.EXCLUDE}, {$PATCH.CONF.REBOOT},
            {$PATCH.CONF.UPDATE_PACKAGE} and {$PATCH.CONF.UPDATE_REBOOT} (urgent package update, Linux only) to the host: the agent (UserParameter patch.config, installed by the setup / --install-agent-config) validates them
            and writes the set ones to patchbix-from-zbx-host-macro.cache next to patchbix.conf. Those keys win over
            patchbix.conf, which is never changed from Zabbix. Empty macro = patchbix.conf stays in effect.
            Value: OK, written / unchanged: <keys>, or ERROR: <reason> (then nothing is written).
            The agent forbids * " ' $ ; | # and other characters in the values: window type all = all updates and day 1-7 =
            every day (instead of *), none = no window (no automatic updates); exclude % = wildcard, none = nothing excluded.
            Not supported = the UserParameter is not installed on the host (run the setup again). The update macros need the
            UserParameter of check script 26.11.18 or newer (6 values) - an older one passes only the first four.
          tags:
            - tag: component
              value: maintenance
          triggers:
            - uuid: 219feb389a8c46f6a4bb7eb492b678b1
              expression: 'find(/PatchBix - Patch management all OS/patch.config["{$PATCH.CONF.WINDOW}","{$PATCH.CONF.AUTO_UPDATE}","{$PATCH.CONF.EXCLUDE}","{$PATCH.CONF.REBOOT}","{$PATCH.CONF.UPDATE_PACKAGE}","{$PATCH.CONF.UPDATE_REBOOT}"],,"like","ERROR")=1'
              name: 'Patch settings in the host macros are invalid'
              opdata: '{ITEM.LASTVALUE}'
              priority: WARNING
              description: 'A macro {$PATCH.CONF.*} of the host has an invalid value, the settings from the macros were not changed. See the last value of the item "Patch - Settings from host macros (agent)".'
              tags:
                - tag: service
                  value: patch-management
                - tag: scope
                  value: notice
        - uuid: e02807b5cd9a45269faa3291f81ee139
          name: 'Patch - Config'
          type: TRAP
          key: patch.config.override
          allowed_hosts: '0.0.0.0/0,::/0'
          history: 90d
          value_type: TEXT
          trends: '0'
          description: |
            The patch settings that are set on the host, each with its source, for example:
            ✎ window: crit+sec * 02:00-03:00, ✎ auto update: true, ▤ reboot: false
            ✎ = Zabbix host macro {$PATCH.CONF.*} (patchbix-from-zbx-host-macro.cache, wins over patchbix.conf),
            ▤ = patchbix.conf on the host. Empty = nothing set: check only, reboot when needed, nothing excluded.
            The check script sends [S] / [C], the preprocessing replaces them with the symbols (Unicode BMP characters,
            they work also with a MySQL database in utf8).
          preprocessing:
            - type: STR_REPLACE
              parameters:
                - '[S]'
                - ✎
            - type: STR_REPLACE
              parameters:
                - '[C]'
                - ▤
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 6h
          tags:
            - tag: component
              value: maintenance
        - uuid: 9157fc5c931649d2814242ba4a8cd953
          name: 'Patch - Excluded updates (config)'
          type: TRAP
          key: patch.exclude
          allowed_hosts: '0.0.0.0/0,::/0'
          history: 365d
          value_type: TEXT
          trends: '0'
          description: |
            EXCLUDE from the patch settings of the host (patchbix.conf): updates the install job doesn't install. "-" = none.
            Linux: package names, wildcards allowed (kernel*, docker-ce). Windows: KB number or a part of the title (KB5034441, Preview).
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 6h
          tags:
            - tag: component
              value: maintenance
        - uuid: aa17a69b3a67474fb20ffe449bd89b0c
          name: 'Patch - Updates: Excluded'
          type: TRAP
          key: patch.updates.excluded
          allowed_hosts: '0.0.0.0/0,::/0'
          history: 90d
          trends: 365d
          description: 'Pending updates that match EXCLUDE (they are not installed). They are included in the other counts and marked "(excluded)" in the pending updates list.'
          tags:
            - tag: component
              value: updates
